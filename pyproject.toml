[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[project]
name = "contextual-orchestrator"
version = "0.2.0"
description = "Paper-grounded model orchestration lab with an enterprise admin console."
readme = "README.md"
# PEP 639: the SPDX expression and the licence file that backs it, so the
# built distribution declares the licence the repository actually carries
# instead of leaving it undeclared for every downstream SBOM to guess.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43.0",
  "opentelemetry-api>=1.30.0",
  "opentelemetry-sdk>=1.30.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30.0",
  "jsonschema>=4.26.0",
  "egressweave>=0.1.0,<0.2.0",
  "fast-mlsirm==0.11.4",
]

[project.optional-dependencies]
test = [
  "hypothesis>=6.100",
]
api = [
  "fastapi>=0.128.0",
  "uvicorn>=0.38.0",
]
db = [
  "SQLAlchemy>=2.0",
  "alembic>=1.17",
  "pg8000>=1.31.5",
  "greenlet>=3.2",
]
fuzz = [
  "atheris==3.1.0; python_version >= '3.12'",
]
queue = [
  "redis>=5.0",
]

[dependency-groups]
native-build = ["maturin==1.15.0", "uv_build==0.12.5"]
dev = [
  "hypothesis>=6.100",
  "openai==2.54.0",
  "pytest>=8.0",
]

[tool.contextual_orchestrator]
object_name_pattern = "two_or_more_words_snake_case"

[tool.uv.build-backend]
module-name = "contextual_orchestrator"
module-root = ""
# Native measurement ships in its separate maturin wheel.
source-exclude = ["**/*.so", "**/*.pyd"]
wheel-exclude = ["**/*.so", "**/*.pyd"]

[tool.coverage.run]
source = ["contextual_orchestrator"]
omit = ["contextual_orchestrator/__main__.py", "contextual_orchestrator/server.py"]

[tool.coverage.report]
show_missing = true

[tool.interrogate]
exclude = ["tests"]
fail-under = 100
ignore-init-method = true
ignore-magic = true
ignore-nested-functions = true
ignore-private = true
ignore-property-decorators = true
ignore-semiprivate = true
