[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contextual-orchestrator"
version = "0.1.0"
description = "Provider-neutral OpenAI-compatible orchestration control plane for governed routing and multi-agent conduct."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "hypothesis>=6.100",
]

[project.urls]
Homepage = "https://github.com/ContextualWisdomLab/contextual-orchestrator"
Repository = "https://github.com/ContextualWisdomLab/contextual-orchestrator"
Issues = "https://github.com/ContextualWisdomLab/contextual-orchestrator/issues"

[project.optional-dependencies]
api = [
  "fastapi>=0.128.0",
  "uvicorn>=0.38.0",
]
db = [
  "SQLAlchemy>=2.0",
  "alembic>=1.17",
  "psycopg[binary]>=3.2",
]
fuzz = [
  "atheris==3.0.0; python_version < '3.13'",
  "atheris==3.1.0; python_version >= '3.13'",
]

[tool.contextual_orchestrator]
object_name_pattern = "two_or_more_words_snake_case"

[tool.setuptools.packages.find]
include = ["contextual_orchestrator*"]

[tool.coverage.run]
source = ["contextual_orchestrator"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.interrogate]
exclude = ["tests"]
fail-under = 100
ignore-init-method = true
ignore-magic = true
ignore-nested-functions = true
ignore-private = true
ignore-property-decorators = true
ignore-semiprivate = true
