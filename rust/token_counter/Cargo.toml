[package]
name = "contextual-token-packer"
version = "0.1.0"
edition = "2021"

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py310", "auto-initialize"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = "0.7"

[lib]
name = "_token_packer"
crate-type = ["cdylib"]
