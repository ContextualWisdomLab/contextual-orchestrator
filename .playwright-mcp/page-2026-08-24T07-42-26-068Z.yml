omLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_sales_readiness.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_sales_readiness.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_sales_readiness.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -162,7 +162,7 @@ def test_sales_readiness_warns_for_single_token_local_deployment() -> None:\\n def test_provider_egress_report_skips_local_and_checks_remote_agents() -> None:\\n orchestrator = TaskOrchestrator(\\n [\\n- ModelAgent(\\\"local_agent\\\", \\\"local-model\\\", base_url=\\\"mlx://127.0.0.1:8080/v1\\\"),\\n+ ModelAgent(\\\"local_agent\\\", \\\"local-model\\\", base_url=\\\"local://127.0.0.1:8080/v1\\\", local_credential_key=\\\"LOCAL_GATEWAY_TOKEN\\\"),\\n ModelAgent(\\n \\\"remote_agent\\\",\\n \\\"remote-model\\\",\" }, { \"sha\": \"7152fc110ab0ecce9243bdd932b5051c80688914\", \"filename\": \"tests/test_sampling_contract.py\", \"status\": \"added\", \"additions\": 85, \"deletions\": 0, \"changes\": 85, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_sampling_contract.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_sampling_contract.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_sampling_contract.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,85 @@\\n+\\\"\\\"\\\"Tests for provider-neutral optional sampling request fields.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import json\\n+\\n+from contextual_orchestrator.orchestrator import ModelAgent, ModelClient\\n+\\n+\\n+def _agent() -> ModelAgent:\\n+ return ModelAgent(\\n+ id=\\\"sampling_worker\\\",\\n+ model=\\\"provider/model\\\",\\n+ base_url=\\\"https://gateway.example.com\\\",\\n+ credential_key=\\\"\\\",\\n+ )\\n+\\n+\\n+def test_model_client_owns_default_sampling_without_import_side_effects() -> None:\\n+ client = ModelClient()\\n+\\n+ assert client.default_temperature is None\\n+ assert client.temperature is None\\n+\\n+\\n+def test_stream_omits_unrequested_temperature_and_preserves_explicit_value(monkeypatch) -> None:\\n+ client = ModelClient()\\n+ captured: list[dict[str, object]] = []\\n+ monkeypatch.setattr(client, \\\"_validate_provider\\\", lambda _agent: object())\\n+\\n+ def stream_send(_agent, payload, _destination=None):\\n+ captured.append(payload)\\n+ return iter([\\\"OK\\\"])\\n+\\n+ monkeypatch.setattr(client, \\\"_stream_send\\\", stream_send)\\n+\\n+ assert list(client.stream_chat(_agent(), [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Sample.\\\"}])) == [\\\"OK\\\"]\\n+ assert \\\"temperature\\\" not in captured[0]\\n+ assert list(client.stream_chat(_agent(), [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Sample.\\\"}], temperature=0.2)) == [\\\"OK\\\"]\\n+ assert captured[1][\\\"temperature\\\"] == 0.2\\n+\\n+\\n+def test_batch_omits_unrequested_temperature_and_preserves_explicit_value(monkeypatch) -> None:\\n+ client = ModelClient()\\n+ uploaded: list[list[dict[str, object]]] = []\\n+\\n+ def batch_upload(_agent, payload, _destination=None):\\n+ uploaded.append([json.loads(line) for line in payload.decode(\\\"utf-8\\\").splitlines()])\\n+ return \\\"file_001\\\"\\n+\\n+ monkeypatch.setattr(client, \\\"_batch_upload\\\", batch_upload)\\n+\\n+ def batch_json(_agent, method, path, body=None, destination=None):\\n+ del path, body, destination\\n+ if method == \\\"POST\\\":\\n+ return {\\\"id\\\": \\\"batch_001\\\"}\\n+ return {\\\"status\\\": \\\"completed\\\", \\\"output_file_id\\\": \\\"file_002\\\"}\\n+\\n+ monkeypatch.setattr(client, \\\"_batch_json\\\", batch_json)\\n+ monkeypatch.setattr(\\n+ client,\\n+ \\\"_batch_raw\\\",\\n+ lambda *_args, **_kwargs: (\\n+ b'{\\\"custom_id\\\":\\\"request_1\\\",\\\"response\\\":{\\\"body\\\":{\\\"choices\\\":[{\\\"message\\\":'\\n+ b'{\\\"content\\\":\\\"OK\\\"}}]}}}'\\n+ ),\\n+ )\\n+\\n+ client._batch_run(\\n+ _agent(),\\n+ {\\\"request_1\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Sample.\\\"}]},\\n+ None,\\n+ 0.0,\\n+ 1.0,\\n+ )\\n+ assert \\\"temperature\\\" not in uploaded[0][0][\\\"body\\\"]\\n+\\n+ client._batch_run(\\n+ _agent(),\\n+ {\\\"request_2\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Sample.\\\"}]},\\n+ 0.2,\\n+ 0.0,\\n+ 1.0,\\n+ )\\n+ assert uploaded[1][0][\\\"body\\\"][\\\"temperature\\\"] == 0.2\" }, { \"sha\": \"49bb8c2fb4d60c97fe502be6d5e55cb6f42b674d\", \"filename\": \"tests/test_security_hardening.py\", \"status\": \"modified\", \"additions\": 50, \"deletions\": 2, \"changes\": 52, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_security_hardening.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_security_hardening.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_security_hardening.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -1,7 +1,6 @@\\n from __future__ import annotations\\n \\n import json\\n-import os\\n import socket\\n import threading\\n import urllib.error\\n@@ -58,6 +57,19 @@ def post_json(url: str, payload: dict[str, object], token: str | None = None) ->\\n return exc.code, json.loads(exc.read().decode(\\\"utf-8\\\"))\\n \\n \\n+def get_status(url: str, token: str) -> int:\\n+ request = urllib.request.Request(\\n+ url,\\n+ headers={\\\"authorization\\\": f\\\"Bearer {token}\\\", \\\"connection\\\": \\\"close\\\"},\\n+ method=\\\"GET\\\",\\n+ )\\n+ try:\\n+ with urllib.request.urlopen(request, timeout=5) as response:\\n+ return response.status\\n+ except urllib.error.HTTPError as exc:\\n+ return exc.code\\n+\\n+\\n def test_http_api_requires_bearer_token_and_hides_trace_by_default() -> None:\\n server = build_server(build(), port=0, security=SecurityConfig(auth_token=\\\"secret_token\\\"))\\n thread = threading.Thread(target=server.serve_forever, daemon=True)\\n@@ -88,7 +100,11 @@ def test_admin_and_inference_tokens_are_separate() -> None:\\n server = build_server(\\n build(),\\n port=0,\\n- security=SecurityConfig(auth_token=\\\"\\\", admin_token=\\\"admin_secret\\\", inference_token=\\\"inference_secret\\\"),\\n+ security=SecurityConfig(\\n+ auth_token=\\\"\\\",\\n+ admin_token=\\\"admin_secret\\\", # noqa: S106\\n+ inference_token=\\\"inference_secret\\\", # noqa: S106\\n+ ),\\n )\\n thread = threading.Thread(target=server.serve_forever, daemon=True)\\n thread.start()\\n@@ -116,6 +132,38 @@ def test_admin_and_inference_tokens_are_separate() -> None:\\n assert \\\"trace\\\" not in inference_body[\\\"orchestration\\\"]\\n \\n \\n+def test_inference_token_cannot_read_admin_get_surfaces() -> None:\\n+ server = build_server(\\n+ build(),\\n+ port=0,\\n+ security=SecurityConfig(auth_token=\\\"\\\", admin_token=\\\"admin_secret\\\", inference_token=\\\"inference_secret\\\"),\\n+ )\\n+ thread = threading.Thread(target=server.serve_forever, daemon=True)\\n+ thread.start()\\n+ port = server.server_address[1]\\n+ admin_paths = (\\n+ \\\"/api/v1/workflow_runs\\\",\\n+ \\\"/api/v1/evaluation_runs/missing\\\",\\n+ \\\"/api/v1/access_reports/missing\\\",\\n+ )\\n+\\n+ try:\\n+ inference_statuses = [\\n+ get_status(f\\\"http://127.0.0.1:{port}{path}\\\", \\\"inference_secret\\\")\\n+ for path in admin_paths\\n+ ]\\n+ admin_statuses = [\\n+ get_status(f\\\"http://127.0.0.1:{port}{path}\\\", \\\"admin_secret\\\")\\n+ for path in admin_paths\\n+ ]\\n+ finally:\\n+ server.shutdown()\\n+ thread.join(timeout=5)\\n+\\n+ assert inference_statuses == [401, 401, 401]\\n+ assert admin_statuses == [200, 404, 404]\\n+\\n+\\n def test_single_and_split_token_modes_cannot_be_combined() -> None:\\n try:\\n SecurityConfig(auth_token=\\\"shared_secret\\\", admin_token=\\\"admin_secret\\\", inference_token=\\\"inference_secret\\\")\" }, { \"sha\": \"47ab4c8384fbac987f6717e98a89c8c33dadcfc4\", \"filename\": \"tests/test_spend_analytics.py\", \"status\": \"modified\", \"additions\": 49, \"deletions\": 0, \"changes\": 49, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_spend_analytics.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_spend_analytics.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_spend_analytics.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -7,6 +7,7 @@\\n \\n from __future__ import annotations\\n \\n+from concurrent.futures import ThreadPoolExecutor\\n import json\\n from pathlib import Path\\n import sys\\n@@ -79,6 +80,54 @@ def test_spend_empty_when_no_runs() -> None:\\n assert report[\\\"totals\\\"][\\\"estimated_output_tokens\\\"] == 0\\n \\n \\n+def test_raw_run_retention_is_bounded_without_resetting_spend() -> None:\\n+ orchestrator = TaskOrchestrator(\\n+ [ModelAgent(\\\"general_agent\\\", \\\"priced-model\\\")],\\n+ price_per_million={\\\"priced-model\\\": 10.0},\\n+ )\\n+ run_count = orchestrator._run_order.maxlen * 2\\n+\\n+ def persist(index: int) -> None:\\n+ orchestrator._persist_workflow_run(\\n+ {\\n+ \\\"workflow_run_id\\\": f\\\"run_retention_{index}\\\",\\n+ \\\"created_at\\\": index,\\n+ \\\"mode\\\": \\\"route\\\",\\n+ \\\"policy_mode\\\": \\\"route\\\",\\n+ \\\"prompt_text\\\": \\\"abcd\\\",\\n+ \\\"answer\\\": \\\"done\\\",\\n+ \\\"trace\\\": [\\n+ {\\n+ \\\"id\\\": 0,\\n+ \\\"role\\\": \\\"worker\\\",\\n+ \\\"agent_id\\\": \\\"general_agent\\\",\\n+ \\\"subtask\\\": \\\"Direct route\\\",\\n+ \\\"access\\\": [],\\n+ \\\"output\\\": \\\"done\\\",\\n+ \\\"usage\\\": {\\\"prompt_tokens\\\": 1, \\\"completion_tokens\\\": 1},\\n+ }\\n+ ],\\n+ \\\"policy_snapshot\\\": {},\\n+ \\\"verification\\\": {\\\"accepted\\\": True},\\n+ }\\n+ )\\n+\\n+ with ThreadPoolExecutor(max_workers=8) as pool:\\n+ list(pool.map(persist, range(run_count)))\\n+\\n+ retained = orchestrator._workflow_runs[next(iter(orchestrator._workflow_runs))]\\n+ orchestrator._persist_workflow_run(retained)\\n+\\n+ report = orchestrator.spend_analytics()\\n+ assert len(orchestrator._workflow_runs) == orchestrator._run_order.maxlen\\n+ assert len(orchestrator._run_order) == orchestrator._run_order.maxlen\\n+ assert len(set(orchestrator._run_order)) == orchestrator._run_order.maxlen\\n+ assert report[\\\"totals\\\"][\\\"run_count\\\"] == run_count\\n+ assert report[\\\"totals\\\"][\\\"estimated_output_tokens\\\"] == run_count\\n+ assert report[\\\"totals\\\"][\\\"reported_prompt_tokens\\\"] == run_count\\n+ assert report[\\\"by_model\\\"][0][\\\"step_count\\\"] == run_count\\n+\\n+\\n def test_http_spend_endpoint_returns_report() -> None:\\n token = \\\"spend_token\\\"\\n orchestrator = TaskOrchestrator([ModelAgent(\\\"general_agent\\\", \\\"priced-model\\\", tags=(\\\"reasoning\\\",))])\" }, { \"sha\": \"a710ca52c59acf1e2db94b9f9bfa8d19b663f036\", \"filename\": \"tests/test_telemetry.py\", \"status\": \"added\", \"additions\": 285, \"deletions\": 0, \"changes\": 285, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_telemetry.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_telemetry.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_telemetry.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,285 @@\\n+\\\"\\\"\\\"Tests for request session binding and prompt-safe telemetry.\\\"\\\"\\\"\\n+\\n+from contextlib import contextmanager\\n+from http.server import BaseHTTPRequestHandler\\n+from types import SimpleNamespace\\n+from unittest.mock import MagicMock\\n+\\n+import contextual_orchestrator.orchestrator as orchestrator_module\\n+import contextual_orchestrator.telemetry as telemetry_module\\n+from contextual_orchestrator.__main__ import _bootstrap_telemetry_config\\n+from contextual_orchestrator.orchestrator import ModelAgent, ModelClient\\n+from contextual_orchestrator.server import build_server\\n+from contextual_orchestrator.telemetry import (\\n+ _otlp_trace_endpoint,\\n+ current_session_id,\\n+ reset_session_id,\\n+ session_id_from_headers,\\n+ session_id_from_metadata,\\n+ set_session_id,\\n+ traced,\\n+)\\n+\\n+\\n+def test_session_id_accepts_lineageweave_header_and_metadata():\\n+ \\\"\\\"\\\"The two compatible transport forms identify the same processing session.\\\"\\\"\\\"\\n+ assert (\\n+ session_id_from_headers({\\\"x-lineageweave-session-id\\\": \\\"session-1\\\"})\\n+ == \\\"session-1\\\"\\n+ )\\n+ assert (\\n+ session_id_from_metadata({\\\"lineageweave_post_session_id\\\": \\\"session-1\\\"})\\n+ == \\\"session-1\\\"\\n+ )\\n+\\n+\\n+def test_session_and_attribute_boundaries_reject_unsafe_values():\\n+ \\\"\\\"\\\"Correlation and span attributes stay bounded, scalar, and prompt-free.\\\"\\\"\\\"\\n+ assert telemetry_module._config_value(None, \\\"missing\\\", \\\"fallback\\\") == \\\"fallback\\\"\\n+ assert telemetry_module._normalize_session_id(None) is None\\n+ for value in (\\\"\\\", \\\"x\\\" * 129, \\\"line\\\\nbreak\\\"):\\n+ assert telemetry_module._normalize_session_id(value) is None\\n+ assert session_id_from_metadata(None) is None\\n+\\n+ token = set_session_id(\\\"session-safe\\\")\\n+ try:\\n+ assert telemetry_module._safe_attributes(\\n+ {\\n+ \\\"\\\": \\\"empty-key\\\",\\n+ \\\"nested\\\": {\\\"prompt\\\": \\\"excluded\\\"},\\n+ \\\"long\\\": \\\"x\\\" * 300,\\n+ \\\"enabled\\\": True,\\n+ \\\"attempt\\\": 2,\\n+ \\\"ratio\\\": 0.5,\\n+ \\\"object\\\": object(),\\n+ }\\n+ ) == {\\n+ \\\"long\\\": \\\"x\\\" * 256,\\n+ \\\"enabled\\\": True,\\n+ \\\"attempt\\\": 2,\\n+ \\\"ratio\\\": 0.5,\\n+ \\\"contextual_orchestrator.session_id\\\": \\\"session-safe\\\",\\n+ }\\n+ finally:\\n+ reset_session_id(token)\\n+\\n+\\n+def test_session_binding_is_reset():\\n+ \\\"\\\"\\\"A request cannot leak its session into a later request context.\\\"\\\"\\\"\\n+ token = set_session_id(\\\"session-2\\\")\\n+ try:\\n+ assert current_session_id() == \\\"session-2\\\"\\n+ finally:\\n+ reset_session_id(token)\\n+ assert current_session_id() is None\\n+\\n+\\n+def test_local_batch_workers_inherit_session_id(monkeypatch):\\n+ \\\"\\\"\\\"Concurrent local batch provider spans retain the caller's session.\\\"\\\"\\\"\\n+ client = ModelClient(local_concurrency=2)\\n+ agent = ModelAgent(\\n+ \\\"local_agent\\\",\\n+ \\\"local-model\\\",\\n+ base_url=\\\"local://127.0.0.1:8080/v1\\\",\\n+ local_credential_key=\\\"LOCAL_GATEWAY_TOKEN\\\",\\n+ )\\n+ observed: list[str | None] = []\\n+\\n+ def fake_chat(_agent, _messages, temperature=None):\\n+ del temperature\\n+ observed.append(current_session_id())\\n+ return \\\"ok\\\"\\n+\\n+ monkeypatch.setattr(client, \\\"chat\\\", fake_chat)\\n+ token = set_session_id(\\\"post-session\\\")\\n+ try:\\n+ result = client._local_batch_chat(\\n+ agent,\\n+ {\\\"one\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"1\\\"}], \\\"two\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"2\\\"}]},\\n+ None,\\n+ )\\n+ finally:\\n+ reset_session_id(token)\\n+\\n+ assert set(observed) == {\\\"post-session\\\"}\\n+ assert {key: value[\\\"content\\\"] for key, value in result.items()} == {\\\"one\\\": \\\"ok\\\", \\\"two\\\": \\\"ok\\\"}\\n+\\n+\\n+def test_traced_preserves_provider_error():\\n+ \\\"\\\"\\\"Tracing records failure but never changes the provider contract.\\\"\\\"\\\"\\n+ try:\\n+ with traced(\\\"contextual_orchestrator.test.failure\\\"):\\n+ raise RuntimeError(\\\"provider failure\\\")\\n+ except RuntimeError as exc:\\n+ assert str(exc) == \\\"provider failure\\\"\\n+ else: # pragma: no cover\\n+ raise AssertionError(\\\"traced must preserve operation failures\\\")\\n+\\n+\\n+def test_otlp_base_endpoint_gets_trace_signal_path():\\n+ \\\"\\\"\\\"Explicit OTLP endpoints use the HTTP traces signal path exactly once.\\\"\\\"\\\"\\n+ assert _otlp_trace_endpoint(\\\"http://collector:4318\\\") == \\\"http://collector:4318/v1/traces\\\"\\n+ assert _otlp_trace_endpoint(\\\"http://collector:4318/v1/traces/\\\") == \\\"http://collector:4318/v1/traces\\\"\\n+\\n+\\n+def test_telemetry_settings_enter_the_process_kv_at_bootstrap(monkeypatch):\\n+ \\\"\\\"\\\"Runtime telemetry reads a KV populated by the deployment bootstrap.\\\"\\\"\\\"\\n+ monkeypatch.setenv(\\\"OTEL_EXPORTER_OTLP_ENDPOINT\\\", \\\"http://collector:4318\\\")\\n+ monkeypatch.setenv(\\\"OTEL_SERVICE_NAME\\\", \\\"gateway-test\\\")\\n+ config = _bootstrap_telemetry_config()\\n+ assert config.get(\\\"telemetry\\\", \\\"exporter_otlp_endpoint\\\") == \\\"http://collector:4318\\\"\\n+ assert config.get(\\\"telemetry\\\", \\\"service_name\\\") == \\\"gateway-test\\\"\\n+\\n+\\n+def test_configure_telemetry_handles_missing_and_disabled_kv(monkeypatch):\\n+ \\\"\\\"\\\"Absent configuration is retryable while an explicit disable is final.\\\"\\\"\\\"\\n+ monkeypatch.setattr(telemetry_module, \\\"_CONFIGURED\\\", False)\\n+ telemetry_module.configure_telemetry(config=None)\\n+ assert telemetry_module._CONFIGURED is False\\n+\\n+ disabled = SimpleNamespace(\\n+ get=lambda category, key, default=None: \\\"true\\\" if key == \\\"sdk_disabled\\\" else default\\n+ )\\n+ telemetry_module.configure_telemetry(config=disabled)\\n+ assert telemetry_module._CONFIGURED is True\\n+\\n+\\n+def test_configure_telemetry_wires_kv_values_to_otlp(monkeypatch):\\n+ \\\"\\\"\\\"The exporter receives only normalized values read from the injected KV.\\\"\\\"\\\"\\n+ import opentelemetry.exporter.otlp.proto.http.trace_exporter as exporter_module\\n+ import opentelemetry.sdk.resources as resources_module\\n+ import opentelemetry.sdk.trace as trace_sdk_module\\n+ import opentelemetry.sdk.trace.export as trace_export_module\\n+\\n+ exporter = MagicMock()\\n+ processor = MagicMock()\\n+ resource = MagicMock()\\n+ resource.create.return_value = {\\n+ \\\"service.name\\\": \\\"gateway-fallback\\\",\\n+ \\\"service.namespace\\\": \\\"contextualwisdomlab\\\",\\n+ }\\n+ provider_factory = MagicMock()\\n+ fake_trace = MagicMock()\\n+ monkeypatch.setattr(exporter_module, \\\"OTLPSpanExporter\\\", exporter)\\n+ monkeypatch.setattr(resources_module, \\\"Resource\\\", resource)\\n+ monkeypatch.setattr(trace_sdk_module, \\\"TracerProvider\\\", provider_factory)\\n+ monkeypatch.setattr(trace_export_module, \\\"BatchSpanProcessor\\\", processor)\\n+ monkeypatch.setattr(telemetry_module, \\\"trace\\\", fake_trace)\\n+ monkeypatch.setattr(telemetry_module, \\\"_CONFIGURED\\\", False)\\n+ values = {\\n+ \\\"exporter_otlp_endpoint\\\": \\\"http://collector:4318/\\\",\\n+ \\\"service_name\\\": \\\" \\\",\\n+ }\\n+ config = SimpleNamespace(\\n+ get=lambda category, key, default=None: values.get(key, default)\\n+ )\\n+\\n+ telemetry_module.configure_telemetry(\\\"gateway-fallback\\\", config=config)\\n+ expected_resource = {\\n+ \\\"service.name\\\": \\\"gateway-fallback\\\",\\n+ \\\"service.namespace\\\": \\\"contextualwisdomlab\\\",\\n+ }\\n+ exporter.assert_called_once_with(endpoint=\\\"http://collector:4318/v1/traces\\\")\\n+ resource.create.assert_called_once_with(expected_resource)\\n+ processor.assert_called_once_with(exporter.return_value)\\n+ provider_factory.assert_called_once_with(resource=expected_resource)\\n+ provider_factory.return_value.add_span_processor.assert_called_once_with(\\n+ processor.return_value\\n+ )\\n+ fake_trace.set_tracer_provider.assert_called_once_with(provider_factory.return_value)\\n+ telemetry_module.configure_telemetry(config=config)\\n+ exporter.assert_called_once()\\n+\\n+\\n+def test_handler_resets_session_after_each_keep_alive_request(monkeypatch):\\n+ \\\"\\\"\\\"A later request on the same connection cannot inherit the prior session.\\\"\\\"\\\"\\n+ server = build_server(SimpleNamespace(agents=[], candidates=[]), port=0)\\n+ handler = server.RequestHandlerClass.__new__(server.RequestHandlerClass)\\n+ monkeypatch.setattr(BaseHTTPRequestHandler, \\\"handle_one_request\\\", lambda self: None)\\n+ try:\\n+ handler._bind_session(\\\"first-request\\\")\\n+ assert current_session_id() == \\\"first-request\\\"\\n+ handler.handle_one_request()\\n+ assert current_session_id() is None\\n+ finally:\\n+ server.server_close()\\n+\\n+\\n+def test_provider_calls_use_current_genai_semantic_convention(monkeypatch):\\n+ \\\"\\\"\\\"Provider spans expose the required, prompt-free GenAI attributes.\\\"\\\"\\\"\\n+ captured = []\\n+\\n+ @contextmanager\\n+ def capture(name, attributes):\\n+ captured.append({\\\"name\\\": name, \\\"attributes\\\": attributes})\\n+ yield None\\n+\\n+ client = ModelClient()\\n+ agent = ModelAgent(\\n+ \\\"provider_agent\\\",\\n+ \\\"model-x\\\",\\n+ base_url=\\\"https://provider.example/v1\\\",\\n+ credential_key=\\\"\\\",\\n+ provider_name=\\\"openai\\\",\\n+ )\\n+ monkeypatch.setattr(orchestrator_module, \\\"traced\\\", capture)\\n+ monkeypatch.setattr(client, \\\"_validate_provider\\\", lambda unused_agent: None)\\n+ monkeypatch.setattr(\\n+ client,\\n+ \\\"_send_with_retry\\\",\\n+ lambda unused_agent, unused_payload, unused_destination: \\\"ok\\\",\\n+ )\\n+ monkeypatch.setattr(\\n+ client,\\n+ \\\"_send_embeddings_with_retry\\\",\\n+ lambda unused_agent, unused_payload, unused_destination: [[1.0]],\\n+ )\\n+\\n+ assert client.chat(agent, [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"not telemetry\\\"}]) == \\\"ok\\\"\\n+ assert client.embed_many(agent, [\\\"not telemetry\\\"]) == [[1.0]]\\n+ assert captured == [\\n+ {\\n+ \\\"name\\\": \\\"chat model-x\\\",\\n+ \\\"attributes\\\": {\\n+ \\\"gen_ai.operation.name\\\": \\\"chat\\\",\\n+ \\\"gen_ai.provider.name\\\": \\\"openai\\\",\\n+ \\\"gen_ai.request.model\\\": \\\"model-x\\\",\\n+ \\\"contextual_orchestrator.agent_id\\\": \\\"provider_agent\\\",\\n+ \\\"server.address\\\": \\\"provider.example\\\",\\n+ \\\"server.port\\\": 443,\\n+ },\\n+ },\\n+ {\\n+ \\\"name\\\": \\\"embeddings model-x\\\",\\n+ \\\"attributes\\\": {\\n+ \\\"gen_ai.operation.name\\\": \\\"embeddings\\\",\\n+ \\\"gen_ai.provider.name\\\": \\\"openai\\\",\\n+ \\\"gen_ai.request.model\\\": \\\"model-x\\\",\\n+ \\\"contextual_orchestrator.agent_id\\\": \\\"provider_agent\\\",\\n+ \\\"server.address\\\": \\\"provider.example\\\",\\n+ \\\"server.port\\\": 443,\\n+ },\\n+ },\\n+ ]\\n+\\n+\\n+def test_traced_starts_client_span_with_attributes_and_error_type(monkeypatch):\\n+ \\\"\\\"\\\"Sampling attributes exist at span creation and failures stay classifiable.\\\"\\\"\\\"\\n+ tracer = MagicMock()\\n+ span = tracer.start_as_current_span.return_value.__enter__.return_value\\n+ monkeypatch.setattr(telemetry_module.trace, \\\"get_tracer\\\", lambda unused_name: tracer)\\n+\\n+ try:\\n+ with traced(\\\"chat model-x\\\", {\\\"gen_ai.operation.name\\\": \\\"chat\\\"}):\\n+ error = TimeoutError(\\\"provider timeout\\\")\\n+ raise error\\n+ except TimeoutError as caught:\\n+ assert caught is error\\n+\\n+ tracer.start_as_current_span.assert_called_once_with(\\n+ \\\"chat model-x\\\",\\n+ kind=telemetry_module.SpanKind.CLIENT,\\n+ attributes={\\\"gen_ai.operation.name\\\": \\\"chat\\\"},\\n+ )\\n+ span.record_exception.assert_called_once_with(error)\\n+ span.set_attribute.assert_called_once_with(\\\"error.type\\\", \\\"TimeoutError\\\")\" }, { \"sha\": \"9e9d1f83af0c1ce6e2d5cd811ecb503405e3e5a5\", \"filename\": \"tests/test_temperature_capability_negotiation_honesty.py\", \"status\": \"added\", \"additions\": 147, \"deletions\": 0, \"changes\": 147, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_temperature_capability_negotiation_honesty.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_temperature_capability_negotiation_honesty.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_temperature_capability_negotiation_honesty.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,147 @@\\n+\\\"\\\"\\\"Regressions for bounded, evidence-preserving temperature negotiation.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import http.client\\n+import io\\n+import json\\n+import socket\\n+import urllib.error\\n+\\n+import pytest\\n+\\n+from contextual_orchestrator import ModelAgent\\n+from contextual_orchestrator.orchestrator import (\\n+ ModelClient,\\n+ _temperature_capability_rejection,\\n+)\\n+\\n+\\n+def _http_error(status: int, message: str) -> urllib.error.HTTPError:\\n+ body = json.dumps({\\\"error\\\": {\\\"message\\\": message}}).encode(\\\"utf-8\\\")\\n+ return urllib.error.HTTPError(\\n+ \\\"https://provider.example/v1/chat/completions\\\",\\n+ status,\\n+ \\\"provider error\\\",\\n+ {},\\n+ io.BytesIO(body),\\n+ )\\n+\\n+\\n+def test_invalid_temperature_range_is_not_negotiated_as_missing_capability() -> None:\\n+ \\\"\\\"\\\"A bad caller value must remain a 4xx instead of being silently removed.\\\"\\\"\\\"\\n+ error = _http_error(400, \\\"temperature is not allowed to be greater than 1\\\")\\n+\\n+ assert not _temperature_capability_rejection(error)\\n+\\n+\\n+def test_azure_default_only_temperature_is_negotiated() -> None:\\n+ \\\"\\\"\\\"Azure's default-only diagnostic proves the optional field is unsupported.\\\"\\\"\\\"\\n+ error = _http_error(\\n+ 400,\\n+ \\\"AzureException BadRequestError - Unsupported value: 'temperature' does not \\\"\\n+ \\\"support 0.2 with this model. Only the default (1) value is supported.\\\",\\n+ )\\n+\\n+ assert _temperature_capability_rejection(error)\\n+\\n+\\n+def test_non_negotiated_error_body_remains_available_to_the_caller() -> None:\\n+ \\\"\\\"\\\"Capability inspection must not consume evidence from an unrelated 4xx.\\\"\\\"\\\"\\n+ expected = json.dumps(\\n+ {\\\"error\\\": {\\\"message\\\": \\\"invalid temperature value\\\"}}\\n+ ).encode(\\\"utf-8\\\")\\n+ error = urllib.error.HTTPError(\\n+ \\\"https://provider.example/v1/chat/completions\\\",\\n+ 400,\\n+ \\\"provider error\\\",\\n+ {},\\n+ io.BytesIO(expected),\\n+ )\\n+\\n+ assert not _temperature_capability_rejection(error)\\n+ assert error.read() == expected\\n+\\n+\\n+def test_incomplete_error_body_preserves_partial_capability_evidence() -> None:\\n+ \\\"\\\"\\\"A truncated diagnostic must not replace the provider's original HTTP error.\\\"\\\"\\\"\\n+ partial = b\\\"Unsupported value: temperature does not support 0.2 with this model\\\"\\n+\\n+ class _IncompleteBody:\\n+ def read(self) -> bytes:\\n+ raise http.client.IncompleteRead(partial)\\n+\\n+ def close(self) -> None:\\n+ pass\\n+\\n+ error = urllib.error.HTTPError(\\n+ \\\"https://provider.example/v1/chat/completions\\\",\\n+ 400,\\n+ \\\"provider error\\\",\\n+ {},\\n+ _IncompleteBody(),\\n+ )\\n+\\n+ assert _temperature_capability_rejection(error)\\n+ assert error.read() == partial\\n+\\n+\\n+class _Response:\\n+ \\\"\\\"\\\"Minimal context-managed JSON response for transport tests.\\\"\\\"\\\"\\n+\\n+ def __init__(self, payload: dict[str, object]) -> None:\\n+ self._body = json.dumps(payload).encode(\\\"utf-8\\\")\\n+\\n+ def __enter__(self) -> \\\"_Response\\\":\\n+ return self\\n+\\n+ def __exit__(self, *_args: object) -> bool:\\n+ return False\\n+\\n+ def read(self) -> bytes:\\n+ return self._body\\n+\\n+\\n+def test_transient_retry_after_negotiation_keeps_temperature_omitted(monkeypatch) -> None:\\n+ \\\"\\\"\\\"Once unsupported is proven, later transient retries must use the negotiated payload.\\\"\\\"\\\"\\n+ client = ModelClient(max_retries=1, retry_backoff=0.0)\\n+ agent = ModelAgent(\\n+ \\\"provider_agent\\\",\\n+ \\\"restricted-model\\\",\\n+ base_url=\\\"https://provider.example/v1\\\",\\n+ )\\n+ sent_payloads: list[dict[str, object]] = []\\n+\\n+ def open_provider(request, _destination=None, **_kwargs):\\n+ sent_payloads.append(json.loads(request.data.decode(\\\"utf-8\\\")))\\n+ if len(sent_payloads) == 1:\\n+ raise _http_error(422, \\\"temperature is not supported for this deployment\\\")\\n+ if len(sent_payloads) == 2:\\n+ raise _http_error(503, \\\"temporarily unavailable\\\")\\n+ return _Response(\\n+ {\\n+ \\\"choices\\\": [\\n+ {\\\"message\\\": {\\\"role\\\": \\\"assistant\\\", \\\"content\\\": \\\"recovered\\\"}}\\n+ ]\\n+ }\\n+ )\\n+\\n+ monkeypatch.setattr(client, \\\"_open_provider\\\", open_provider)\\n+ monkeypatch.setattr(client, \\\"_sleep\\\", lambda _delay: None)\\n+\\n+ result = client._send_with_retry(\\n+ agent,\\n+ {\\\"model\\\": agent.model, \\\"messages\\\": [], \\\"temperature\\\": 0.2},\\n+ (socket.AF_INET, (\\\"93.184.216.34\\\", 443)),\\n+ )\\n+\\n+ assert result == \\\"recovered\\\"\\n+ assert [\\\"temperature\\\" in payload for payload in sent_payloads] == [\\n+ True,\\n+ False,\\n+ False,\\n+ ]\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover\\n+ raise SystemExit(pytest.main([__file__]))\" }, { \"sha\": \"6749ab60e244ad2318dcd5eb92e4a286490344cd\", \"filename\": \"tests/test_tip_reland_sdk_omit_persist_http_honesty.py\", \"status\": \"modified\", \"additions\": 12, \"deletions\": 16, \"changes\": 28, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_tip_reland_sdk_omit_persist_http_honesty.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a07