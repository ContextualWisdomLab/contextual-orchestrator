- generic [active] [ref=f3e1]: "[ { \"sha\": \"1b951628a44baee32306a9977aad77aae8eff7e9\", \"filename\": \".github/workflows/provider-catalog-sync.yml\", \"status\": \"added\", \"additions\": 105, \"deletions\": 0, \"changes\": 105, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/.github%2Fworkflows%2Fprovider-catalog-sync.yml\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/.github%2Fworkflows%2Fprovider-catalog-sync.yml\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/.github%2Fworkflows%2Fprovider-catalog-sync.yml?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,105 @@\\n+name: Provider catalog sync\\n+\\n+on:\\n+ workflow_dispatch:\\n+ schedule:\\n+ - cron: \\\"17 * * * *\\\"\\n+\\n+permissions:\\n+ contents: read\\n+\\n+concurrency:\\n+ group: provider-catalog-sync\\n+ cancel-in-progress: false\\n+\\n+jobs:\\n+ sync:\\n+ name: Bootstrap durable provider KV and model catalog\\n+ if: github.ref == 'refs/heads/main'\\n+ runs-on: ubuntu-latest\\n+ environment: production\\n+ timeout-minutes: 15\\n+ steps:\\n+ - name: Checkout protected default branch\\n+ uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7\\n+ with:\\n+ persist-credentials: false\\n+\\n+ - name: Set up Python\\n+ uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6\\n+ with:\\n+ python-version: \\\"3.12\\\"\\n+\\n+ - name: Install hash-pinned runtime dependencies\\n+ run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements.lock\\n+\\n+ - name: Register credentials and refresh normalized model catalog\\n+ shell: bash\\n+ env:\\n+ CONTEXTUAL_ORCHESTRATOR_KV_BACKEND: postgres\\n+ CONTEXTUAL_ORCHESTRATOR_KV_DSN: ${{ secrets.CONTEXTUAL_ORCHESTRATOR_KV_DSN }}\\n+ CONTEXTUAL_ORCHESTRATOR_KV_PASSPHRASE: ${{ secrets.CONTEXTUAL_ORCHESTRATOR_KV_PASSPHRASE }}\\n+ NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}\\n+ NVIDIA_NIM_API_KEY_SUB: ${{ secrets.NVIDIA_NIM_API_KEY_SUB }}\\n+ BYTEZ_API_KEY: ${{ secrets.BYTEZ_API_KEY }}\\n+ OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}\\n+ OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}\\n+ run: |\\n+ set -euo pipefail\\n+ test -n \\\"${CONTEXTUAL_ORCHESTRATOR_KV_DSN}\\\"\\n+ test -n \\\"${CONTEXTUAL_ORCHESTRATOR_KV_PASSPHRASE}\\\"\\n+ python -m contextual_orchestrator.provider_catalog_bootstrap --model-limit 24 > provider-bootstrap-report.json\\n+ python - <<'PY'\\n+ import json\\n+ from pathlib import Path\\n+\\n+ report = json.loads(Path('provider-bootstrap-report.json').read_text(encoding='utf-8'))\\n+ expected = {\\n+ 'NVIDIA_NIM_API_KEY',\\n+ 'NVIDIA_NIM_API_KEY_SUB',\\n+ 'BYTEZ_API_KEY',\\n+ 'OPENROUTER_API_KEY',\\n+ 'OPENAI_API_KEY',\\n+ }\\n+ registered = set(report['registered_credentials'])\\n+ if registered != expected:\\n+ raise SystemExit(f'credential inventory mismatch: {sorted(expected - registered)}')\\n+ if report['catalog_backend'] != 'postgres':\\n+ raise SystemExit('provider catalog is not durable PostgreSQL')\\n+ if report['catalog_model_count'] < 1 or report['eligible_model_count'] < 1:\\n+ raise SystemExit('provider catalog has no compatible serving model')\\n+ if not report['selected_agent_ids']:\\n+ raise SystemExit('provider catalog produced no serving candidates')\\n+ if report['enabled_agent_ids'] or report['durable_agent_pool']:\\n+ raise SystemExit('ephemeral Actions sync must not claim agent-pool activation')\\n+ print(json.dumps({\\n+ 'registered_credentials': sorted(registered),\\n+ 'live_discovered_model_count': report['live_discovered_model_count'],\\n+ 'catalog_model_count': report['catalog_model_count'],\\n+ 'last_known_good_model_count': report['last_known_good_model_count'],\\n+ 'selected_agent_count': len(report['selected_agent_ids']),\\n+ 'catalog_refresh_failure_count': report['catalog_refresh_failure_count'],\\n+ 'providers_with_errors': report['providers_with_errors'],\\n+ }, sort_keys=True))\\n+ PY\\n+ python - <<'PY'\\n+ import os\\n+ from pathlib import Path\\n+\\n+ report = Path('provider-bootstrap-report.json').read_text(encoding='utf-8')\\n+ names = (\\n+ 'NVIDIA_NIM_API_KEY',\\n+ 'NVIDIA_NIM_API_KEY_SUB',\\n+ 'BYTEZ_API_KEY',\\n+ 'OPENROUTER_API_KEY',\\n+ 'OPENAI_API_KEY',\\n+ )\\n+ leaked = [\\n+ name\\n+ for name in names\\n+ if os.environ[name].rstrip('\\\\r\\\\n')\\n+ and os.environ[name].rstrip('\\\\r\\\\n') in report\\n+ ]\\n+ if leaked:\\n+ raise SystemExit(f'provider bootstrap report leaked secret values for: {leaked}')\\n+ PY\" }, { \"sha\": \"fb9beb151cb73656da41c7e22cdbfeb93c4bc842\", \"filename\": \"README.md\", \"status\": \"modified\", \"additions\": 10, \"deletions\": 1, \"changes\": 11, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/README.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/README.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/README.md?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -97,7 +97,6 @@ Run an evaluation against that server with `--temperature 0` for repeatable judg\\n Model-based conduct verification requires `fast-mlsirm` in the same runtime and fails closed when it is absent or broken; fast-mlsirm sends its judge completion through this contextual-orchestrator gateway, so no direct provider fallback is used. “Same runtime” means that the exact interpreter used for the live run can import both packages: install both checkouts into one environment (prefer editable installs), or expose both source roots with `PYTHONPATH` during a source run. Before a live judge benchmark, run `python -m contextual_orchestrator check-fast-mlsirm` with that exact interpreter. It prints the interpreter, package version, transitive-import status, and contextual contract check, and exits nonzero on a missing dependency or contract mismatch. Do not run the preflight in one virtual environment and the judge in another. See [ADR 0001](docs/planning/adrs/0001-fail-closed-model-judgment.md).\\n \\n The agent pool is manageable at runtime: `POST`/`PATCH`/`DELETE` on `/api/v1/agent_pools/default/worker_agents[/{id}]` add, govern, and remove model-group members. Pass `--agents-db PATH` (or `CONTEXTUAL_ORCHESTRATOR_AGENTS_DB`) to persist those changes to a stdlib sqlite file — stored changes overlay the seed agents file at startup, and removals write disabled tombstones so they survive restarts; without it the pool is in-memory as before.\\n-\\n Beyond the local MLX/llama.cpp discovery above, `python -m contextual_orchestrator discover-models [--agents-db PATH]` discovers models from remote providers (OpenAI, OpenRouter, NVIDIA NIM ×2 keys, Bytez) for any subset of their KV-registered credentials, and can persist them into the same `--agents-db` sqlite file, added disabled by default. See [docs/kv-credentials.md](docs/kv-credentials.md#multi-provider-auto-discovery) for the credential-name table and cost-based auto-selection.\\n \\n Seed the credential into the KV once at bootstrap:\\n@@ -304,6 +303,16 @@ python tests/test_admin_contract.py\\n python tests/test_conventions.py\\n python tests/test_api_contract.py\\n python tests/test_security_hardening.py\\n+python tests/test_chat_model_capability_isolation.py\\n+python tests/test_chat_transport_role_separation.py\\n+python tests/test_chat_capability_unknown_identifiers.py\\n+python tests/test_chat_passthrough_capability_isolation.py\\n+python tests/test_discovery_bootstrap_selection.py\\n+python tests/test_provider_bootstrap.py\\n+python tests/test_provider_bootstrap_secret_normalization.py\\n+python tests/test_provider_catalog_bootstrap.py\\n+python tests/test_provider_catalog_credential_promotion.py\\n+python tests/test_provider_catalog_store.py\\n python tests/test_repository_security_metadata.py\\n python tests/test_product_planning_contract.py\\n python tests/test_plugin_driven_artifacts.py\" }, { \"sha\": \"3424629af79165eaa9878e2c0e5d176bd90a151f\", \"filename\": \"contextual_orchestrator/__main__.py\", \"status\": \"modified\", \"additions\": 3, \"deletions\": 3, \"changes\": 6, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2F__main__.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2F__main__.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2F__main__.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -16,7 +16,7 @@\\n agent_id_for,\\n discover_all_models,\\n refresh_price_book,\\n- select_top_n_cheapest_discovered_agents,\\n+ select_bootstrap_discovered_agents,\\n )\\n from .orchestrator import (\\n CONTEXTUAL_ORCHESTRATOR_CONTRACT_V1,\\n@@ -211,7 +211,7 @@ def _discover_models_command(argv: list[str]) -> None:\\n type=_non_negative_int,\\n default=0,\\n metavar=\\\"N\\\",\\n- help=\\\"Enable the N cheapest discovered agents in --agents-db (auto-optimization bootstrap; \\\"\\n+ help=\\\"Enable a price-honest, provider-diverse discovered agent pool in --agents-db (auto-optimization bootstrap; \\\"\\n \\\"requires --agents-db; 0 disables, the default, leaving every discovered agent inert).\\\",\\n )\\n args = parser.parse_args(argv)\\n@@ -229,7 +229,7 @@ def _discover_models_command(argv: list[str]) -> None:\\n )\\n bootstrap.sync_discovered_agents([agent_from_discovered(model) for model in discovered])\\n if args.enable_cheapest:\\n- for model in select_top_n_cheapest_discovered_agents(discovered, price_book, args.enable_cheapest):\\n+ for model in select_bootstrap_discovered_agents(discovered, price_book, args.enable_cheapest):\\n agent_id = agent_id_for(model)\\n bootstrap.patch_agent(\\\"default\\\", agent_id, {\\\"status\\\": \\\"active\\\"})\\n enabled_agent_ids.append(agent_id)\" }, { \"sha\": \"4a2a96cd560621fcc8099010ec759a2f4f75be40\", \"filename\": \"contextual_orchestrator/chat_capability.py\", \"status\": \"added\", \"additions\": 96, \"deletions\": 0, \"changes\": 96, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Fchat_capability.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Fchat_capability.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Fchat_capability.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,96 @@\\n+\\\"\\\"\\\"Classify chat transport compatibility and ordinary agent-role eligibility.\\n+\\n+Provider catalogs mix endpoint-only models with models served through an\\n+OpenAI-compatible chat transport. Transport compatibility is not the same as\\n+fitness for an ordinary thinker, worker, verifier, or synthesizer role: audio\\n+and policy-classification models can use chat transport, while embedding,\\n+reranking, transcription, moderation-endpoint, image-generation, realtime, and\\n+speech-only models cannot.\\n+\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import re\\n+\\n+_MODEL_TOKEN_RE = re.compile(r\\\"[a-z0-9]+\\\")\\n+_TRANSPORT_INCOMPATIBLE_EXACT_TOKENS = frozenset(\\n+ {\\n+ \\\"bge\\\",\\n+ \\\"clip\\\",\\n+ \\\"dall\\\",\\n+ \\\"e5\\\",\\n+ \\\"embed\\\",\\n+ \\\"embedding\\\",\\n+ \\\"embeddings\\\",\\n+ \\\"gte\\\",\\n+ \\\"image\\\",\\n+ \\\"images\\\",\\n+ \\\"moderation\\\",\\n+ \\\"realtime\\\",\\n+ \\\"rerank\\\",\\n+ \\\"reranker\\\",\\n+ \\\"siglip\\\",\\n+ \\\"sora\\\",\\n+ \\\"speech\\\",\\n+ \\\"transcribe\\\",\\n+ \\\"transcription\\\",\\n+ \\\"tts\\\",\\n+ \\\"whisper\\\",\\n+ }\\n+)\\n+_TRANSPORT_INCOMPATIBLE_PREFIXES = (\\n+ \\\"embed\\\",\\n+ \\\"moderat\\\",\\n+ \\\"rerank\\\",\\n+ \\\"transcrib\\\",\\n+)\\n+\\n+\\n+def is_chat_compatible_model_id(model_id: str) -> bool:\\n+ \\\"\\\"\\\"Return whether an identifier can use the ordinary chat transport.\\n+\\n+ The classifier rejects only identifiers that clearly advertise an endpoint\\n+ family incompatible with chat messages. Audio-capable and safety-classifier\\n+ models remain transport-compatible because providers serve some of them over\\n+ ``/chat/completions``.\\n+ \\\"\\\"\\\"\\n+ tokens = _model_tokens(model_id)\\n+ return _is_transport_compatible_tokens(tokens)\\n+\\n+\\n+def _is_transport_compatible_tokens(tokens: tuple[str, ...]) -> bool:\\n+ \\\"\\\"\\\"Judge transport compatibility from already-normalized model tokens.\\\"\\\"\\\"\\n+ if not tokens:\\n+ return False\\n+ for token in tokens:\\n+ if token in _TRANSPORT_INCOMPATIBLE_EXACT_TOKENS:\\n+ return False\\n+ if token.startswith(_TRANSPORT_INCOMPATIBLE_PREFIXES):\\n+ return False\\n+ return True\\n+\\n+\\n+def _model_tokens(model_id: str) -> tuple[str, ...]:\\n+ \\\"\\\"\\\"Normalize one provider-prefixed model identifier into lowercase tokens.\\\"\\\"\\\"\\n+ if not isinstance(model_id, str):\\n+ return ()\\n+ return tuple(_MODEL_TOKEN_RE.findall(model_id.casefold()))\\n+\\n+\\n+def is_general_chat_agent_model_id(model_id: str) -> bool:\\n+ \\\"\\\"\\\"Return whether a chat model may enter ordinary orchestration roles.\\n+\\n+ Explicit guard and safety models can use chat transport but are specialized\\n+ policy classifiers, not general answer synthesizers. This negative role gate\\n+ does not infer reasoning, coding, vision, or verification capabilities.\\n+ \\\"\\\"\\\"\\n+ tokens = _model_tokens(model_id)\\n+ if not tokens or not _is_transport_compatible_tokens(tokens):\\n+ return False\\n+ return not any(\\n+ token == \\\"safety\\\"\\n+ or token == \\\"guard\\\"\\n+ or token == \\\"shieldgemma\\\"\\n+ or token.startswith(\\\"nemoguard\\\")\\n+ for token in tokens\\n+ )\" }, { \"sha\": \"254caa98548b161670fa9ce2e8fdf83928eaedd7\", \"filename\": \"contextual_orchestrator/cost_ledger.py\", \"status\": \"modified\", \"additions\": 48, \"deletions\": 7, \"changes\": 55, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Fcost_ledger.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Fcost_ledger.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Fcost_ledger.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -31,6 +31,7 @@\\n import threading\\n from dataclasses import dataclass, field\\n from decimal import ROUND_HALF_UP, Decimal\\n+import math\\n import time\\n from typing import Any, Dict, List, Optional, Protocol\\n import uuid\\n@@ -105,6 +106,31 @@ def _price_key(provider: str, model: str) -> str:\\n return f\\\"{provider}:{model}\\\"\\n \\n \\n+def _decimal_safe_price(value: object) -> Optional[float]:\\n+ \\\"\\\"\\\"Parse one raw price component, or ``None`` when unknown, underflowed, or overflowed.\\n+\\n+ Parses through ``Decimal`` first so a nonzero price that underflows to\\n+ ``0.0`` in float (e.g. a stray ``1e-10000``) is rejected as unknown\\n+ rather than silently accepted as a legitimate free price. A ``Decimal``\\n+ can still be finite while its ``float()`` conversion overflows to\\n+ ``inf`` (e.g. ``1e10000``), so ``math.isfinite`` is checked separately\\n+ on the converted value.\\n+ \\\"\\\"\\\"\\n+ try:\\n+ decimal_value = Decimal(str(value))\\n+ price = float(decimal_value)\\n+ except (ArithmeticError, TypeError, ValueError):\\n+ return None\\n+ if (\\n+ not decimal_value.is_finite()\\n+ or not math.isfinite(price)\\n+ or decimal_value < 0\\n+ or (decimal_value != 0 and price == 0)\\n+ ):\\n+ return None\\n+ return price\\n+\\n+\\n @dataclass\\n class PriceEntry:\\n \\\"\\\"\\\"A single price-table row: per-1K-token prices for a provider+model.\\\"\\\"\\\"\\n@@ -155,18 +181,33 @@ def get_price(self, provider: str, model: str) -> Optional[PriceEntry]:\\n \\\"\\\"\\\"Return the price entry for ``provider``+``model``, if configured.\\n \\n Falls back to a provider-wildcard entry (``\\\"{provider}:*\\\"``) so a\\n- provider can set one default price for all of its models.\\n+ provider can set one default price for all of its models. A corrupt\\n+ specific row does not suppress an otherwise-valid wildcard fallback.\\n \\\"\\\"\\\"\\n- raw = self._config.get(_PRICE_CATEGORY, _price_key(provider, model), None)\\n- if raw is None:\\n- raw = self._config.get(_PRICE_CATEGORY, _price_key(provider, \\\"*\\\"), None)\\n- if raw is None:\\n+ for candidate_model in (model, \\\"*\\\"):\\n+ raw = self._config.get(_PRICE_CATEGORY, _price_key(provider, candidate_model), None)\\n+ entry = self._parse_price_entry(raw, provider, model)\\n+ if entry is not None:\\n+ return entry\\n+ return None\\n+\\n+ def _parse_price_entry(\\n+ self, raw: Any, provider: str, model: str\\n+ ) -> Optional[PriceEntry]:\\n+ \\\"\\\"\\\"Validate one raw KV row into a ``PriceEntry``, or ``None`` if it is unusable.\\\"\\\"\\\"\\n+ if not isinstance(raw, dict):\\n+ return None\\n+ if \\\"prompt_price_per_1k\\\" not in raw or \\\"completion_price_per_1k\\\" not in raw:\\n+ return None\\n+ prompt_price = _decimal_safe_price(raw[\\\"prompt_price_per_1k\\\"])\\n+ completion_price = _decimal_safe_price(raw[\\\"completion_price_per_1k\\\"])\\n+ if prompt_price is None or completion_price is None:\\n return None\\n return PriceEntry(\\n provider_name=raw.get(\\\"provider_name\\\", provider),\\n model_name=raw.get(\\\"model_name\\\", model),\\n- prompt_price_per_1k=float(raw.get(\\\"prompt_price_per_1k\\\", 0.0)),\\n- completion_price_per_1k=float(raw.get(\\\"completion_price_per_1k\\\", 0.0)),\\n+ prompt_price_per_1k=prompt_price,\\n+ completion_price_per_1k=completion_price,\\n currency_code=raw.get(\\\"currency_code\\\", self.default_currency),\\n )\\n \" }, { \"sha\": \"3daf36283e78a2dadd0bc814d761c066756fc217\", \"filename\": \"contextual_orchestrator/credentials.py\", \"status\": \"modified\", \"additions\": 34, \"deletions\": 0, \"changes\": 34, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Fcredentials.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Fcredentials.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Fcredentials.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -50,6 +50,10 @@ def set(self, name: str, value: str) -> None:\\n \\\"\\\"\\\"Register (or replace) the secret stored under ``name``.\\\"\\\"\\\"\\n ...\\n \\n+ def delete(self, name: str) -> None:\\n+ \\\"\\\"\\\"Remove one credential after an unvalidated candidate promotion.\\\"\\\"\\\"\\n+ ...\\n+\\n \\n class InMemoryCredentialBackend:\\n \\\"\\\"\\\"Process-local credential registry for dev and tests (no Postgres needed).\\\"\\\"\\\"\\n@@ -68,6 +72,11 @@ def set(self, name: str, value: str) -> None:\\n with self._lock:\\n self._store[name] = value\\n \\n+ def delete(self, name: str) -> None:\\n+ \\\"\\\"\\\"Remove ``name`` from the in-memory credential registry if present.\\\"\\\"\\\"\\n+ with self._lock:\\n+ self._store.pop(name, None)\\n+\\n \\n # --- Postgres pgcrypto-encrypted credential registry ------------------------\\n #\\n@@ -112,6 +121,15 @@ def __init__(self, dsn: str, passphrase: str) -> None:\\n self._passphrase = passphrase\\n self._ensured = False\\n \\n+ @property\\n+ def connection_dsn(self) -> str:\\n+ \\\"\\\"\\\"Return the bootstrap DSN for a colocated metadata store.\\n+\\n+ Callers must treat this as connection material: never include it in logs,\\n+ reports, traces, or exceptions. Provider API keys remain inaccessible.\\n+ \\\"\\\"\\\"\\n+ return self._dsn\\n+\\n @classmethod\\n def from_env(cls) -> \\\"PostgresCredentialBackend\\\":\\n \\\"\\\"\\\"Build the backend from bootstrap transport env vars (the only allowed env use).\\n@@ -173,6 +191,17 @@ def set(self, name: str, value: str) -> None: # pragma: no cover - requires a l\\n )\\n conn.commit()\\n \\n+ def delete(self, name: str) -> None: # pragma: no cover - requires a live Postgres\\n+ \\\"\\\"\\\"Delete one encrypted credential after a failed candidate promotion.\\\"\\\"\\\"\\n+ with self._connect() as conn:\\n+ self._ensure_schema(conn)\\n+ with conn.cursor() as cur:\\n+ cur.execute(\\n+ \\\"DELETE FROM provider_credentials WHERE credential_name = %s\\\",\\n+ (name,),\\n+ )\\n+ conn.commit()\\n+\\n \\n _backend: CredentialBackend | None = None\\n _backend_lock = threading.Lock()\\n@@ -216,3 +245,8 @@ def get_credential(name: str) -> str | None:\\n def register_credential(name: str, value: str) -> None:\\n \\\"\\\"\\\"Register a named secret into the KV (used by the bootstrap CLI).\\\"\\\"\\\"\\n get_backend().set(name, value)\\n+\\n+\\n+def delete_credential(name: str) -> None:\\n+ \\\"\\\"\\\"Remove a named credential from the KV after an unvalidated promotion.\\\"\\\"\\\"\\n+ get_backend().delete(name)\" }, { \"sha\": \"fbc3da91c6fa8ef5bb7768cb3659a74ffc5cf205\", \"filename\": \"contextual_orchestrator/model_discovery.py\", \"status\": \"modified\", \"additions\": 221, \"deletions\": 51, \"changes\": 272, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Fmodel_discovery.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Fmodel_discovery.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Fmodel_discovery.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -13,14 +13,16 @@\\n \\n from __future__ import annotations\\n \\n+from decimal import Decimal\\n import json\\n+import math\\n import re\\n import urllib.error\\n import urllib.request\\n-from dataclasses import dataclass\\n+from dataclasses import dataclass, replace\\n from typing import TYPE_CHECKING, Any\\n \\n-from .batch_routing import cheapest_upstream\\n+from .chat_capability import is_general_chat_agent_model_id\\n from .credentials import get_credential\\n from .orchestrator import ModelAgent\\n \\n@@ -84,7 +86,7 @@ class ProviderModelSource:\\n \\n @dataclass(frozen=True)\\n class DiscoveredModel:\\n- \\\"\\\"\\\"One model found on a provider, with pricing when the provider reports it.\\\"\\\"\\\"\\n+ \\\"\\\"\\\"One general-chat model found on a provider, with reported pricing.\\\"\\\"\\\"\\n \\n provider_name: str\\n model_id: str\\n@@ -121,14 +123,78 @@ def _fetch_json(url: str, *, api_key: str, auth_scheme: str, timeout: float) ->\\n return json.loads(response.read().decode(\\\"utf-8\\\"))\\n \\n \\n+def _valid_price_component(value: object) -> bool:\\n+ \\\"\\\"\\\"Return whether one price component is finite, numeric, and non-negative.\\\"\\\"\\\"\\n+ if isinstance(value, bool) or not isinstance(value, (int, float)):\\n+ return False\\n+ try:\\n+ numeric = float(value)\\n+ except (TypeError, ValueError, OverflowError):\\n+ return False\\n+ return math.isfinite(numeric) and numeric >= 0.0\\n+\\n+\\n def _price_per_1k(value: Any) -> float | None:\\n- \\\"\\\"\\\"OpenAI-compatible providers report USD price per single token; convert to per-1K.\\\"\\\"\\\"\\n- if value is None:\\n+ \\\"\\\"\\\"Convert a trustworthy per-token USD price to per-1K, else return unknown.\\n+\\n+ Parses through ``Decimal`` first so a nonzero price that underflows to\\n+ ``0.0`` in float (e.g. a stray ``1e-10000``) is rejected as unknown\\n+ rather than silently accepted as a legitimate free price.\\n+ \\\"\\\"\\\"\\n+ if value is None or isinstance(value, bool):\\n return None\\n try:\\n- return float(value) * 1000\\n- except (TypeError, ValueError):\\n+ decimal_per_1k = Decimal(str(value)) * 1000\\n+ per_1k = float(decimal_per_1k)\\n+ except (ArithmeticError, TypeError, ValueError):\\n+ return None\\n+ if not decimal_per_1k.is_finite() or (decimal_per_1k != 0 and per_1k == 0):\\n return None\\n+ return per_1k if _valid_price_component(per_1k) else None\\n+\\n+\\n+def _serving_identity(model: DiscoveredModel) -> tuple[str, str]:\\n+ \\\"\\\"\\\"Return the durable agent identity used by discovery synchronization.\\\"\\\"\\\"\\n+ return (model.provider_name, model.model_id)\\n+\\n+\\n+def _source_tiebreaker(model: DiscoveredModel) -> tuple[str, str, str, str]:\\n+ \\\"\\\"\\\"Choose deterministic transport metadata for an ambiguous duplicate row.\\\"\\\"\\\"\\n+ return (\\n+ model.credential_name,\\n+ model.chat_base_url,\\n+ model.auth_scheme,\\n+ model.currency_code,\\n+ )\\n+\\n+\\n+def _deduplicate_discovered_models(\\n+ discovered: list[DiscoveredModel],\\n+) -> list[DiscoveredModel]:\\n+ \\\"\\\"\\\"Collapse duplicate agent identities and withhold conflicting price evidence.\\n+\\n+ Exact duplicate catalog rows become one candidate. When the same provider/model\\n+ identity is repeated with conflicting metadata or prices, one deterministic\\n+ transport record is retained but its prices become unknown. Provider row order\\n+ therefore cannot fabricate a cheaper bootstrap candidate or consume failover\\n+ capacity twice.\\n+ \\\"\\\"\\\"\\n+ unique: dict[tuple[str, str], DiscoveredModel] = {}\\n+ for model in discovered:\\n+ identity = _serving_identity(model)\\n+ previous = unique.get(identity)\\n+ if previous is None:\\n+ unique[identity] = model\\n+ continue\\n+ if previous == model:\\n+ continue\\n+ chosen = min((previous, model), key=_source_tiebreaker)\\n+ unique[identity] = replace(\\n+ chosen,\\n+ prompt_price_per_1k=None,\\n+ completion_price_per_1k=None,\\n+ )\\n+ return list(unique.values())\\n \\n \\n def _parse_openai_compatible(payload: Any, source: ProviderModelSource) -> list[DiscoveredModel]:\\n@@ -138,7 +204,7 @@ def _parse_openai_compatible(payload: Any, source: ProviderModelSource) -> list[\\n if not isinstance(row, dict):\\n continue\\n model_id = row.get(\\\"id\\\")\\n- if type(model_id) is not str or not model_id:\\n+ if type(model_id) is not str or not model_id or not is_general_chat_agent_model_id(model_id):\\n continue\\n pricing = row.get(\\\"pricing\\\") if isinstance(row.get(\\\"pricing\\\"), dict) else {}\\n discovered.append(\\n@@ -152,7 +218,7 @@ def _parse_openai_compatible(payload: Any, source: ProviderModelSource) -> list[\\n completion_price_per_1k=_price_per_1k(pricing.get(\\\"completion\\\")),\\n )\\n )\\n- return discovered\\n+ return _deduplicate_discovered_models(discovered)\\n \\n \\n def _parse_bytez(payload: Any, source: ProviderModelSource) -> list[DiscoveredModel]:\\n@@ -162,7 +228,7 @@ def _parse_bytez(payload: Any, source: ProviderModelSource) -> list[DiscoveredMo\\n if not isinstance(row, dict):\\n continue\\n model_id = row.get(\\\"modelId\\\")\\n- if type(model_id) is not str or not model_id:\\n+ if type(model_id) is not str or not model_id or not is_general_chat_agent_model_id(model_id):\\n continue\\n discovered.append(\\n DiscoveredModel(\\n@@ -175,7 +241,7 @@ def _parse_bytez(payload: Any, source: ProviderModelSource) -> list[DiscoveredMo\\n # per-1k pricing unset is more honest than a misleading estimate.\\n )\\n )\\n- return discovered\\n+ return _deduplicate_discovered_models(discovered)\\n \\n \\n def discover_provider_models(\\n@@ -214,7 +280,7 @@ def discover_all_models(\\n discovered.extend(discover_provider_models(source, timeout=timeout))\\n except ProviderDiscoveryError as exc:\\n errors.append(exc)\\n- return discovered, errors\\n+ return _deduplicate_discovered_models(discovered), errors\\n \\n \\n _SLUG_RE = re.compile(r\\\"[^a-z0-9]+\\\")\\n@@ -231,7 +297,9 @@ def agent_id_for(discovered: DiscoveredModel) -> str:\\n \\n \\n def agent_from_discovered(discovered: DiscoveredModel, *, priority: int = 0) -> ModelAgent:\\n- \\\"\\\"\\\"Build a disabled-by-default ModelAgent for a discovered model (opt-in serving).\\\"\\\"\\\"\\n+ \\\"\\\"\\\"Build a disabled general-chat agent or reject an ineligible record.\\\"\\\"\\\"\\n+ if not is_general_chat_agent_model_id(discovered.model_id):\\n+ raise ValueError(\\\"model is not eligible for a general chat agent\\\")\\n return ModelAgent(\\n id=agent_id_for(discovered),\\n model=discovered.model_id,\\n@@ -245,73 +313,175 @@ def agent_from_discovered(discovered: DiscoveredModel, *, priority: int = 0) ->\\n )\\n \\n \\n+def _currency_is_comparable(currency_code: object, default_currency: object) -> bool:\\n+ \\\"\\\"\\\"Return whether two ISO-style currency codes can be compared directly.\\\"\\\"\\\"\\n+ return (\\n+ isinstance(currency_code, str)\\n+ and isinstance(default_currency, str)\\n+ and currency_code.strip().upper() == default_currency.strip().upper()\\n+ and bool(currency_code.strip())\\n+ )\\n+\\n+\\n def refresh_price_book(discovered: list[DiscoveredModel], price_book: \\\"PriceBook\\\") -> int:\\n- \\\"\\\"\\\"Write every discovered model's known pricing into the price book.\\n+ \\\"\\\"\\\"Write complete, comparable provider pricing into the discovery price book.\\n \\n- Returns the number of price rows written. A model without provider-reported\\n- pricing is skipped rather than defaulted to 0 -- an unpriced model already\\n- costs 0 under ``PriceBook.compute_cost``'s \\\"explicit, not silently expensive\\\"\\n- contract, so writing a fabricated 0 row here would just hide that signal.\\n+ Both prompt and completion prices are required for the fixed 1K+1K ranking\\n+ workload. Partial, conflicting, non-finite, negative, or cross-currency\\n+ evidence remains unknown rather than acquiring an invented zero component.\\n \\\"\\\"\\\"\\n from .cost_ledger import PriceEntry\\n \\n written = 0\\n- for model in discovered:\\n- if model.prompt_price_per_1k is None and model.completion_price_per_1k is None:\\n+ for model in _deduplicate_discovered_models(discovered):\\n+ if not is_general_chat_agent_model_id(model.model_id):\\n+ continue\\n+ if not (\\n+ _valid_price_component(model.prompt_price_per_1k)\\n+ and _valid_price_component(model.completion_price_per_1k)\\n+ and _currency_is_comparable(\\n+ model.currency_code,\\n+ price_book.default_currency,\\n+ )\\n+ ):\\n continue\\n price_book.set_price(\\n PriceEntry(\\n provider_name=model.provider_name,\\n model_name=model.model_id,\\n- prompt_price_per_1k=model.prompt_price_per_1k or 0.0,\\n- completion_price_per_1k=model.completion_price_per_1k or 0.0,\\n- currency_code=model.currency_code,\\n+ prompt_price_per_1k=float(model.prompt_price_per_1k),\\n+ completion_price_per_1k=float(model.completion_price_per_1k),\\n+ currency_code=model.currency_code.strip().upper(),\\n )\\n )\\n written += 1\\n return written\\n \\n \\n+def _discovery_price_key(\\n+ model: DiscoveredModel,\\n+ price_book: \\\"PriceBook\\\",\\n+) -> tuple[int, float, str, str]:\\n+ \\\"\\\"\\\"Rank comparable trustworthy prices first, then deterministic unknowns.\\\"\\\"\\\"\\n+ unknown = (1, 0.0, model.provider_name, model.model_id)\\n+ try:\\n+ entry = price_book.get_price(model.provider_name, model.model_id)\\n+ except (TypeError, ValueError, OverflowError):\\n+ return unknown\\n+ if entry is None:\\n+ return unknown\\n+ if not (\\n+ _valid_price_component(entry.prompt_price_per_1k)\\n+ and _valid_price_component(entry.completion_price_per_1k)\\n+ and _currency_is_comparable(\\n+ entry.currency_code,\\n+ price_book.default_currency,\\n+ )\\n+ ):\\n+ return unknown\\n+ try:\\n+ cost, currency = price_book.compute_cost(\\n+ model.provider_name,\\n+ model.model_id,\\n+ 1000,\\n+ 1000,\\n+ )\\n+ except (TypeError, ValueError, OverflowError):\\n+ return unknown\\n+ if not (\\n+ _valid_price_component(cost)\\n+ and _currency_is_comparable(currency, price_book.default_currency)\\n+ ):\\n+ return unknown\\n+ return (0, cost, model.provider_name, model.model_id)\\n+\\n+\\n+def _provider_family(provider_name: str) -> str:\\n+ \\\"\\\"\\\"Collapse credentials that share one upstream provider outage domain.\\\"\\\"\\\"\\n+ if provider_name in {\\\"nvidia_nim\\\", \\\"nvidia_nim_sub\\\"}:\\n+ return \\\"nvidia_nim\\\"\\n+ return provider_name\\n+\\n+\\n def select_cheapest_discovered_agent(\\n discovered: list[DiscoveredModel], price_book: \\\"PriceBook\\\"\\n ) -> DiscoveredModel | None:\\n- \\\"\\\"\\\"Pick the lowest-cost discovered model per the price book (auto-optimization).\\n-\\n- Reuses :func:`~contextual_orchestrator.batch_routing.cheapest_upstream`, the\\n- existing cost-optimizing upstream selector. Call :func:`refresh_price_book`\\n- first so discovered pricing is visible; an unpriced candidate costs ``0``\\n- under that selector's documented contract and is treated as free, not\\n- unknown -- so a genuinely unpriced provider (e.g. Bytez, priced by\\n- GPU-second rather than per token) will always look cheapest here. Fine for\\n- \\\"auto-pick something free to try,\\\" but callers doing real cost comparison\\n- should refresh pricing for every candidate they care about first.\\n+ \\\"\\\"\\\"Pick the cheapest candidate with trustworthy price evidence.\\n+\\n+ A candidate without a price row is unknown, not free. Known prices therefore\\n+ sort first; when every candidate is unpriced, provider and model identifiers\\n+ provide deterministic fallback ordering without inventing a monetary value.\\n \\\"\\\"\\\"\\n- if not discovered:\\n- return None\\n- candidates = [{\\\"provider\\\": model.provider_name, \\\"model\\\": model.model_id} for model in discovered]\\n- winner = cheapest_upstream(candidates, price_book)\\n- if winner is None:\\n+ eligible = [\\n+ model\\n+ for model in _deduplicate_discovered_models(discovered)\\n+ if is_general_chat_agent_model_id(model.model_id)\\n+ ]\\n+ if not eligible:\\n return None\\n- for model in discovered:\\n- if model.provider_name == winner[\\\"provider\\\"] and model.model_id == winner[\\\"model\\\"]:\\n- return model\\n- return None # pragma: no cover - winner always comes from candidates\\n+ return min(eligible, key=lambda model: _discovery_price_key(model, price_book))\\n \\n \\n def select_top_n_cheapest_discovered_agents(\\n discovered: list[DiscoveredModel], price_book: \\\"PriceBook\\\", limit: int\\n ) -> list[DiscoveredModel]:\\n- \\\"\\\"\\\"Return the ``limit`` lowest-cost discovered models, cheapest first.\\n+ \\\"\\\"\\\"Return up to ``limit`` unique candidates, known-priced before unknown.\\\"\\\"\\\"\\n+ if limit <= 0:\\n+ return []\\n+ eligible = [\\n+ model\\n+ for model in _deduplicate_discovered_models(discovered)\\n+ if is_general_chat_agent_model_id(model.model_id)\\n+ ]\\n+ if not eligible:\\n+ return []\\n+ return sorted(\\n+ eligible,\\n+ key=lambda model: _discovery_price_key(model, price_book),\\n+ )[:limit]\\n \\n- For bootstrapping a CI sidecar (or any first-boot pool) with more than one\\n- enabled agent for failover, without hand-picking which discovered models to\\n- trust. Same pricing contract as :func:`select_cheapest_discovered_agent`.\\n+\\n+def select_bootstrap_discovered_agents(\\n+ discovered: list[DiscoveredModel],\\n+ price_book: \\\"PriceBook\\\",\\n+ limit: int,\\n+) -> list[DiscoveredModel]:\\n+ \\\"\\\"\\\"Build a deterministic, price-honest, provider-diverse initial pool.\\n+\\n+ Candidates retain the known-price-first ordering above, but the first pass\\n+ takes at most one model from each independent provider family. Remaining\\n+ capacity is filled in the same deterministic cost order. NVIDIA NIM primary\\n+ and sub credentials are one outage domain, so they participate in the second\\n+ pass only after independently hosted providers have had a chance to enter.\\n+ Duplicate serving identities never consume capacity twice.\\n \\\"\\\"\\\"\\n- if limit <= 0 or not discovered:\\n+ if limit <= 0:\\n+ return []\\n+ eligible = [\\n+ model\\n+ for model in _deduplicate_discovered_models(discovered)\\n+ if is_general_chat_agent_model_id(model.model_id)\\n+ ]\\n+ if not eligible:\\n return []\\n \\n- def _cost(model: DiscoveredModel) -> float:\\n- cost, _currency = price_book.compute_cost(model.provider_name, model.model_id, 1000, 1000)\\n- return cost\\n+ ranked = sorted(\\n+ eligible,\\n+ key=lambda model: _discovery_price_key(model, price_book),\\n+ )\\n+ selected: list[DiscoveredModel] = []\\n+ deferred: list[DiscoveredModel] = []\\n+ provider_families: set[str] = set()\\n+\\n+ for model in ranked:\\n+ family = _provider_family(model.provider_name)\\n+ if family in provider_families:\\n+ deferred.append(model)\\n+ continue\\n+ provider_families.add(family)\\n+ selected.append(model)\\n+ if len(selected) == limit:\\n+ return selected\\n \\n- return sorted(discovered, key=_cost)[:limit]\\n+ selected.extend(deferred[: limit - len(selected)])\\n+ return selected\" }, { \"sha\": \"254d593bed7de2f3fc823fc9e59062e6777590a8\", \"filename\": \"contextual_orchestrator/orchestrator.py\", \"status\": \"modified\", \"additions\": 62, \"deletions\": 10, \"changes\": 72, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Forchestrator.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Forchestrator.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Forchestrator.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -31,6 +31,10 @@\\n import urllib.error\\n import urllib.request\\n \\n+from .chat_capability import (\\n+ is_chat_compatible_model_id,\\n+ is_general_chat_agent_model_id,\\n+)\\n from .conventions import require_object_name\\n from .credentials import NotConfigured, get_credential\\n \\n@@ -776,6 +780,8 @@ def chat(\\n ``default_top_p`` are used so request-scoped Completions sampling can be\\n applied without threading kwargs through every orchestrator hop.\\n \\\"\\\"\\\"\\n+ if not is_chat_compatible_model_id(agent.model):\\n+ raise ValueError(\\\"model is not chat-compatible and cannot serve a chat request\\\")\\n self._local.usage = None\\n # Expose the effective sampling knobs for request-path tests / diagnostics.\\n effective_temperature = self.default_temperature if temperature is None else temperature\\n@@ -825,6 +831,15 @@ def probe(self, agent: ModelAgent, *, timeout: float = DEFAULT_PROVIDER_PROBE_TI\\n \\\"\\\"\\\"\\n probe_timeout = _validate_provider_probe_timeout(timeout)\\n started = time.monotonic()\\n+ if not is_chat_compatible_model_id(agent.model):\\n+ return {\\n+ \\\"agent_id\\\": agent.id,\\n+ \\\"model\\\": agent.model,\\n+ \\\"status\\\": \\\"not_ready\\\",\\n+ \\\"latency_ms\\\": round((time.monotonic() - started) * 1000, 2),\\n+ \\\"error_type\\\": \\\"ValueError\\\",\\n+ \\\"failure_code\\\": \\\"non_chat_model\\\",\\n+ }\\n self._local.usage = None\\n failure_code = \\\"provider_probe_failed\\\"\\n try:\\n@@ -1070,6 +1085,10 @@ def stream_chat(self, agent: ModelAgent, messages: list[ChatMessage], temperatur\\n are yielded as they arrive (not computed-then-framed). The mock path yields its\\n answer in fixed chunks so behavior shape stays testable and unchanged.\\n \\\"\\\"\\\"\\n+ if not is_chat_compatible_model_id(agent.model):\\n+ raise ValueError(\\n+ f\\\"model {agent.model!r} is not chat-compatible and cannot serve {agent.id!r}\\\"\\n+ )\\n if agent.base_url.startswith(\\\"mock://\\\"):\\n answer = self._mock(agent, messages)\\n for start in range(0, len(answer), 24):\\n@@ -1129,10 +1148,20 @@ def proxy_send(\\n self, agent: ModelAgent, endpoint: str, payload: dict[str, Any]\\n ) -> dict[str, Any]:\\n \\\"\\\"\\\"Passthrough a full request to one agent, returning the raw provider JSON.\\\"\\\"\\\"\\n+ normalized_endpoint = endpoint.strip(\\\"/\\\")\\n+ if normalized_endpoint.startswith(\\\"v1/\\\"):\\n+ normalized_endpoint = normalized_endpoint[3:]\\n+ if (\\n+ normalized_endpoint in {\\\"chat/completions\\\", \\\"completions\\\", \\\"responses\\\"}\\n+ and not is_chat_compatible_model_id(agent.model)\\n+ ):\\n+ raise ValueError(\\n+ f\\\"model {agent.model!r} is not chat-compatible and cannot serve {agent.id!r}\\\"\\n+ )\\n if agent.base_url.startswith(\\\"mock://\\\"):\\n- return self._mock_raw(agent, endpoint, payload)\\n+ return self._mock_raw(agent, normalized_endpoint, payload)\\n destination = self._validate_provider(agent) # pragma: no cover\\n- if endpoint.strip(\\\"/\\\") == \\\"responses\\\" and _is_local_provider_url(agent.base_url):\\n+ if normalized_endpoint == \\\"responses\\\" and _is_local_provider_url(agent.base_url):\\n chat_payload = _responses_to_chat_payload(payload)\\n chat_payload.setdefault(\\\"max_tokens\\\", self.max_output_tokens)\\n if _is_direct_mlx_provider_url(agent.base_url) and self.chat_template_args:\\n@@ -1143,7 +1172,7 @@ def proxy_send(\\n )\\n return _chat_to_responses_payload(chat_response, payload)\\n with _local_provider_slot(agent, self.local_concurrency, self.timeout): # pragma: no cover\\n- return self._send_raw_with_retry(agent, endpoint, payload, destination)\\n+ return self._send_raw_with_retry(agent, normalized_endpoint, payload, destination)\\n \\n def _send_raw_with_retry(\\n self,\\n@@ -1316,6 +1345,10 @@ def batch_chat(\\n workloads (24h completion window, ~half the price); real-time chat should keep\\n using ``chat``. The mock path answers synchronously so tests and local runs work.\\n \\\"\\\"\\\"\\n+ if not is_chat_compatible_model_id(agent.model):\\n+ raise ValueError(\\n+ f\\\"model {agent.model!r} is not chat-compatible and cannot serve {agent.id!r}\\\"\\n+ )\\n if agent.base_url.startswith(\\\"mock://\\\"):\\n results = {\\n custom_id: {\\\"content\\\": self._mock(agent, messages), \\\"usage\\\": None}\\n@@ -2434,6 +2467,7 @@ def _plan_generated(self, task: str) -> list[WorkflowStep]:\\n pool = \\\"\\\\n\\\".join(\\n f\\\"- {agent.id}: model={agent.model}, tags={', '.join(agent.tags) or 'none'}\\\"\\n for agent in self.agents\\n+ if is_general_chat_agent_model_id(agent.model)\\n )\\n system = (\\n \\\"You are the workflow conductor. Decompose the user's task into a short workflow.\\\\n\\\"\\n@@ -2459,7 +2493,7 @@ def _parse_workflow_plan(self, raw: str) -> list[WorkflowStep]:\\n raw_steps = data.get(\\\"steps\\\")\\n if not isinstance(raw_steps, list) or not (2 <= len(raw_steps) <= self.policy.max_workflow_steps):\\n raise ValueError(f\\\"plan must have 2..{self.policy.max_workflow_steps} steps\\\")\\n- known_agents = {agent.id for agent in self.agents}\\n+ known_agents = {agent.id: agent for agent in self.agents}\\n steps: list[WorkflowStep] = []\\n for index, item in enumerate(raw_steps):\\n if int(item.get(\\\"id\\\", -1)) != index:\\n@@ -2474,8 +2508,9 @@ def _parse_workflow_plan(self, raw: str) -> list[WorkflowStep]:\\n if any(value < 0 or value >= index for value in access):\\n raise ValueError(\\\"access may reference only earlier steps\\\")\\n agent_id = item.get(\\\"agent_id\\\")\\n- if agent_id not in known_agents:\\n- # The planner named an unknown agent: reselect honestly instead of failing the plan.\\n+ assigned = known_agents.get(agent_id)\\n+ if assigned is None or not is_general_chat_agent_model_id(assigned.model):\\n+ # Unknown or stale ineligible assignments are reselected honestly.\\n agent_id = self._select_agent(subtask, role).id\\n steps.append(WorkflowStep(index, role, agent_id, subtask, access))\\n if steps[-1].role not in {\\\"synthesizer\\\", \\\"worker\\\"}:\\n@@ -2509,10 +2544,21 @@ def _score_agent(self, agent: ModelAgent, role: str, lowered: str) -> tuple[int,\\n def _ranked_agents(self, text: str, role: str) -> list[ModelAgent]:\\n \\\"\\\"\\\"Agents sorted best-first for a role; the head is the primary, the tail are failovers.\\\"\\\"\\\"\\n lowered = text.lower()\\n- return sorted(self.agents, key=lambda agent: self._score_agent(agent, role, lowered), reverse=True)\\n+ return [\\n+ agent\\n+ for agent in sorted(\\n+ self.agents,\\n+ key=lambda agent: self._score_agent(agent, role, lowered),\\n+ reverse=True,\\n+ )\\n+ if is_general_chat_agent_model_id(agent.model)\\n+ ]\\n \\n def _select_agent(self, text: str, role: str) -> ModelAgent:\\n- selected = self._ranked_agents(text, role)[0]\\n+ ranked = self._ranked_agents(text, role)\\n+ if not ranked:\\n+ raise RuntimeError(f\\\"no chat-compatible agent available for role={role}\\\")\\n+ selected = ranked[0]\\n if selected.disabled: # pragma: no cover\\n raise RuntimeError(f\\\"no enabled agent available for role={role}\\\")\\n if role in selected.provider_exclusions: # pragma: no cover\\n@@ -2530,6 +2576,8 @@ def _invoke(\\n usage when available (else None), so spend analytics can prefer it.\\n \\\"\\\"\\\"\\n candidates = self._failover_candidates(primary, text, role)\\n+ if not candidates:\\n+ raise RuntimeError(f\\\"no chat-compatible agent available for role={role}\\\")\\n last_error: Exception | None = None\\n for agent in candidates:\\n try:\\n@@ -2545,11 +2593,15 @@ def _invoke(\\n \\n def _failover_candidates(self, primary: ModelAgent, text: str, role: str) -> list[ModelAgent]:\\n ranked = self._ranked_agents(text, role)\\n- ordered = [primary] + [agent for agent in ranked if agent.id != primary.id]\\n+ ordered = [\\n+ agent\\n+ for agent in [primary] + [agent for agent in ranked if agent.id != primary.id]\\n+ if is_general_chat_agent_model_id(agent.model)\\n+ ]\\n eligible = [agent for agent in ordered if not agent.disabled and role not in agent.provider_exclusions]\\n healthy = [agent for agent in eligible if not self._circuit_open(agent.id)]\\n # If every eligible agent is circuit-open, still probe them rather than fail with no attempt.\\n- return healthy or eligible or [primary]\\n+ return healthy or eligible\\n \\n def _circuit_open(self, agent_id: str) -> bool:\\n with self._circuit_lock:\" }, { \"sha\": \"323c56d9df0bd0f36acf58fa641df6585a57efd9\", \"filename\": \"contextual_orchestrator/provider_bootstrap.py\", \"status\": \"added\", \"additions\": 354, \"deletions\": 0, \"changes\": 354, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Fprovider_bootstrap.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Fprovider_bootstrap.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Fprovider_bootstrap.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,354 @@\\n+\\\"\\\"\\\"Durable bootstrap for the organization provider credential inventory.\\n+\\n+A trusted deployment process may expose the fixed provider-secret inventory to\\n+this one-shot module. Values are validated as a complete set, written to the\\n+configured credential KV, and then model discovery runs exclusively through the\\n+KV-backed runtime seam. Runtime provider calls never read provider API keys from\\n+``os.environ``.\\n+\\n+Bootstrap establishes a conservative serving candidate set. It does not infer\\n+reasoning, coding, vision, or other provider capabilities from model names;\\n+capability negotiation remains an explicit runtime/catalog responsibility.\\n+\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import argparse\\n+from dataclasses import dataclass, replace\\n+import json\\n+import os\\n+from typing import Mapping, Sequence\\n+\\n+from .chat_capability import is_general_chat_agent_model_id\\n+from .cost_ledger import PriceBook\\n+from .credentials import (\\n+ InMemoryCredentialBackend,\\n+ PostgresCredentialBackend,\\n+ get_backend,\\n+)\\n+from .kv_config import InMemoryConfigStore\\n+from .model_discovery import (\\n+ DiscoveredModel,\\n+ PROVIDER_MODEL_SOURCES,\\n+ _currency_is_comparable,\\n+ _provider_family,\\n+ agent_from_discovered,\\n+ agent_id_for,\\n+ discover_all_models,\\n+ refresh_price_book,\\n+)\\n+from .orchestrator import ModelAgent, TaskOrchestrator\\n+\\n+\\n+PROVIDER_CREDENTIAL_NAMES: tuple[str, ...] = tuple(\\n+ dict.fromkeys(source.credential_name for source in PROVIDER_MODEL_SOURCES)\\n+)\\n+\\\"\\\"\\\"Fixed organization credential inventory accepted by the bootstrap boundary.\\\"\\\"\\\"\\n+\\n+_GENERIC_SERVING_TAGS = (\\n+ \\\"discovered\\\",\\n+ \\\"chat\\\",\\n+ \\\"worker\\\",\\n+ \\\"writing\\\",\\n+ \\\"synthesizer\\\",\\n+)\\n+\\n+\\n+class ProviderBootstrapError(RuntimeError):\\n+ \\\"\\\"\\\"Raised when trusted provider bootstrap cannot establish a usable catalog.\\\"\\\"\\\"\\n+\\n+\\n+@dataclass(frozen=True)\\n+class ProviderBootstrapReport:\\n+ \\\"\\\"\\\"Secret-free evidence emitted after one provider bootstrap run.\\\"\\\"\\\"\\n+\\n+ registered_credentials: tuple[str, ...]\\n+ discovered_model_count: int\\n+ eligible_model_count: int\\n+ selected_agent_ids: tuple[str, ...]\\n+ enabled_agent_ids: tuple[str, ...]\\n+ durable_agent_pool: bool\\n+ providers_with_errors: tuple[str, ...]\\n+ priced_model_count: int\\n+\\n+ def as_dict(self) -> dict[str, object]:\\n+ \\\"\\\"\\\"Return JSON-safe evidence without credential values or provider payloads.\\\"\\\"\\\"\\n+ return {\\n+ \\\"registered_credentials\\\": list(self.registered_credentials),\\n+ \\\"discovered_model_count\\\": self.discovered_model_count,\\n+ \\\"eligible_model_count\\\": self.eligible_model_count,\\n+ \\\"selected_agent_ids\\\": list(self.selected_agent_ids),\\n+ \\\"enabled_agent_ids\\\": list(self.enabled_agent_ids),\\n+ \\\"durable_agent_pool\\\": self.durable_agent_pool,\\n+ \\\"providers_with_errors\\\": list(self.providers_with_errors),\\n+ \\\"priced_model_count\\\": self.priced_model_count,\\n+ }\\n+\\n+\\n+def _strip_mounted_line_endings(value: str) -> str:\\n+ \\\"\\\"\\\"Remove only CR/LF bytes commonly appended by mounted secret files.\\\"\\\"\\\"\\n+ return value.rstrip(\\\"\\\\r\\\\n\\\")\\n+\\n+\\n+def collect_provider_credentials(\\n+ environ: Mapping[str, str], *, require_all: bool = True\\n+) -> dict[str, str]:\\n+ \\\"\\\"\\\"Collect the fixed inventory without rewriting non-line-ending bytes.\\\"\\\"\\\"\\n+ values: dict[str, str] = {}\\n+ missing: list[str] = []\\n+ for name in PROVIDER_CREDENTIAL_NAMES:\\n+ raw = environ.get(name, \\\"\\\")\\n+ value = _strip_mounted_line_endings(raw) if isinstance(raw, str) else \\\"\\\"\\n+ if value and value.strip():\\n+ values[name] = value\\n+ else:\\n+ missing.append(name)\\n+ if require_all and missing:\\n+ raise ProviderBootstrapError(\\n+ \\\"provider bootstrap requires the complete credential inventory: \\\"\\n+ + \\\", \\\".join(sorted(missing))\\n+ )\\n+ if not values:\\n+ raise ProviderBootstrapError(\\\"provider bootstrap received no credentials\\\")\\n+ return values\\n+\\n+\\n+def register_provider_credentials_atomically(\\n+ credentials: Mapping[str, str],\\n+) -> tuple[str, ...]:\\n+ \\\"\\\"\\\"Register a validated credential batch with one commit where supported.\\\"\\\"\\\"\\n+ if not credentials:\\n+ raise ProviderBootstrapError(\\\"provider bootstrap received an empty credential batch\\\")\\n+ unknown = sorted(set(credentials) - set(PROVIDER_CREDENTIAL_NAMES))\\n+ if unknown:\\n+ raise ProviderBootstrapError(\\\"provider bootstrap rejected unknown credential names\\\")\\n+\\n+ normalized: dict[str, str] = {}\\n+ for name, value in credentials.items():\\n+ if not isinstance(value, str):\\n+ raise ProviderBootstrapError(\\n+ f\\\"provider bootstrap rejected an empty value for {name}\\\"\\n+ )\\n+ normalized_value = _strip_mounted_line_endings(value)\\n+ if not normalized_value or not normalized_value.strip():\\n+ raise ProviderBootstrapError(\\n+ f\\\"provider bootstrap rejected an empty value for {name}\\\"\\n+ )\\n+ normalized[name] = normalized_value\\n+\\n+ backend = get_backend()\\n+ if isinstance(backend, InMemoryCredentialBackend):\\n+ with backend._lock: # noqa: SLF001 - package-internal atomic batch operation\\n+ backend._store.update(normalized) # noqa: SLF001\\n+ elif isinstance(backend, PostgresCredentialBackend):\\n+ with backend._connect() as connection: # noqa: SLF001 - package transaction\\n+ backend._ensure_schema(connection) # noqa: SLF001\\n+ with connection.cursor() as cursor:\\n+ for name, value in normalized.items():\\n+ cursor.execute(\\n+ \\\"INSERT INTO provider_credentials \\\"\\n+ \\\"(credential_name, encrypted_value, updated_at) \\\"\\n+ \\\"VALUES (%s, pgp_sym_encrypt(%s, %s), now()) \\\"\\n+ \\\"ON CONFLICT (credential_name) DO UPDATE SET \\\"\\n+ \\\"encrypted_value = EXCLUDED.encrypted_value, updated_at = now()\\\",\\n+ (name, value, backend._passphrase), # noqa: SLF001\\n+ )\\n+ connection.commit()\\n+ else:\\n+ raise ProviderBootstrapError(\\n+ \\\"provider bootstrap requires an atomic built-in credential backend\\\"\\n+ )\\n+ return tuple(sorted(normalized))\\n+\\n+\\n+def is_chat_serving_candidate(model: DiscoveredModel) -> bool:\\n+ \\\"\\\"\\\"Apply the shared ordinary-chat eligibility policy to a catalog row.\\n+\\n+ This is a negative compatibility filter, not positive capability inference.\\n+ Models that survive receive only generic chat-serving tags until an explicit\\n+ provider/catalog capability record or measured evidence is available.\\n+ \\\"\\\"\\\"\\n+ return is_general_chat_agent_model_id(model.model_id)\\n+\\n+\\n+def serving_tags_for_discovered(_model: DiscoveredModel) -> tuple[str, ...]:\\n+ \\\"\\\"\\\"Return capability-neutral tags safe for any compatible chat candidate.\\\"\\\"\\\"\\n+ return _GENERIC_SERVING_TAGS\\n+\\n+\\n+def _known_cost_sort_key(\\n+ model: DiscoveredModel,\\n+) -> tuple[int, float, str, str]:\\n+ \\\"\\\"\\\"Sort known-price, comparable-currency models before unknown/incomparable ones.\\n+\\n+ Mirrors ``model_discovery._discovery_price_key``'s currency gate so a\\n+ cheap non-USD price can never outrank a USD one on face value alone.\\n+ \\\"\\\"\\\"\\n+ prices = (model.prompt_price_per_1k, model.completion_price_per_1k)\\n+ prompt_price, completion_price = prices\\n+ if (\\n+ prompt_price is None\\n+ or completion_price is None\\n+ or not _currency_is_comparable(model.currency_code, \\\"USD\\\")\\n+ ):\\n+ return (1, float(\\\"inf\\\"), model.provider_name, model.model_id)\\n+ return (0, prompt_price + completion_price, model.provider_name, model.model_id)\\n+\\n+\\n+def select_provider_diverse_models(\\n+ discovered: Sequence[DiscoveredModel], *, limit: int\\n+) -> list[DiscoveredModel]:\\n+ \\\"\\\"\\\"Choose a bounded compatible pool while preserving provider diversity.\\\"\\\"\\\"\\n+ if limit < 1:\\n+ raise ValueError(\\\"provider bootstrap model limit must be positive\\\")\\n+ unique: dict[tuple[str, str, str], DiscoveredModel] = {}\\n+ for model in discovered:\\n+ if not is_chat_serving_candidate(model):\\n+ continue\\n+ unique[(model.provider_name, model.credential_name, model.model_id)] = model\\n+ ordered = sorted(unique.values(), key=_known_cost_sort_key)\\n+ selected: list[DiscoveredModel] = []\\n+ seen_providers: set[str] = set()\\n+ for model in ordered:\\n+ provider_family = _provider_family(model.provider_name)\\n+ if provider_family in seen_providers:\\n+ continue\\n+ selected.append(model)\\n+ seen_providers.add(provider_family)\\n+ if len(selected) >= limit:\\n+ return selected\\n+ selected_keys = {\\n+ (item.provider_name, item.credential_name, item.model_id)\\n+ for item in selected\\n+ }\\n+ for model in ordered:\\n+ key = (model.provider_name, model.credential_name, model.model_id)\\n+ if key in selected_keys:\\n+ continue\\n+ selected.append(model)\\n+ if len(selected) >= limit:\\n+ break\\n+ return selected\\n+\\n+\\n+def _active_agent_from_discovered(model: DiscoveredModel) -> ModelAgent:\\n+ \\\"\\\"\\\"Convert one selected chat model into an enabled capability-neutral agent.\\\"\\\"\\\"\\n+ return replace(\\n+ agent_from_discovered(model),\\n+ disabled=False,\\n+ tags=serving_tags_for_discovered(model),\\n+ )\\n+\\n+\\n+def _synchronize_durable_agent_pool(\\n+ agents_db: str,\\n+ selected: Sequence[DiscoveredModel],\\n+) -> tuple[str, ...]:\\n+ \\\"\\\"\\\"Activate exactly the selected discovered models in one durable agent pool.\\\"\\\"\\\"\\n+ bootstrap = TaskOrchestrator(\\n+ [ModelAgent(\\\"bootstrap_agent\\\", \\\"bootstrap-model\\\")],\\n+ agents_db=agents_db,\\n+ )\\n+ agents = [_active_agent_from_discovered(model) for model in selected]\\n+ selected_ids = {agent.id for agent in agents}\\n+ bootstrap.sync_discovered_agents(agents)\\n+\\n+ for candidate in list(bootstrap.candidates):\\n+ if candidate.id in selected_ids:\\n+ continue\\n+ if candidate.id == \\\"bootstrap_agent\\\" or \\\"discovered\\\" in candidate.tags:\\n+ if not candidate.disabled:\\n+ bootstrap.remove_agent(\\\"default\\\", candidate.id)\\n+\\n+ for agent in agents:\\n+ bootstrap.patch_agent(\\\"default\\\", agent.id, {\\\"status\\\": \\\"active\\\"})\\n+\\n+ enabled = tuple(\\n+ sorted(agent.id for agent in bootstrap.agents if agent.id in selected_ids)\\n+ )\\n+ if set(enabled) != selected_ids:\\n+ raise ProviderBootstrapError(\\n+ \\\"provider bootstrap could not activate the selected agent pool\\\"\\n+ )\\n+ return enabled\\n+\\n+\\n+def bootstrap_provider_runtime(\\n+ *,\\n+ environ: Mapping[str, str],\\n+ require_all_credentials: bool = True,\\n+ agents_db: str | None = None,\\n+ model_limit: int = 16,\\n+) -> ProviderBootstrapReport:\\n+ \\\"\\\"\\\"Register trusted secrets, discover chat models, and optionally activate a pool.\\\"\\\"\\\"\\n+ credentials = collect_provider_credentials(\\n+ environ, require_all=require_all_credentials\\n+ )\\n+ registered = register_provider_credentials_atomically(credentials)\\n+ discovered, errors = discover_all_models()\\n+ if not discovered:\\n+ raise ProviderBootstrapError(\\n+ \\\"provider bootstrap discovered no usable models\\\"\\n+ )\\n+\\n+ eligible = [model for model in discovered if is_chat_serving_candidate(model)]\\n+ if not eligible:\\n+ raise ProviderBootstrapError(\\n+ \\\"provider bootstrap discovered no chat-capable models\\\"\\n+ )\\n+\\n+ price_book = PriceBook(InMemoryConfigStore())\\n+ priced_count = refresh_price_book(discovered, price_book)\\n+ selected = select_provider_diverse_models(eligible, limit=model_limit)\\n+ if not selected:\\n+ raise ProviderBootstrapError(\\n+ \\\"provider bootstrap selected no chat-capable models\\\"\\n+ )\\n+ selected_ids = tuple(agent_id_for(model) for model in selected)\\n+ enabled_ids = (\\n+ _synchronize_durable_agent_pool(agents_db, selected)\\n+ if agents_db\\n+ else ()\\n+ )\\n+\\n+ return ProviderBootstrapReport(\\n+ registered_credentials=registered,\\n+ discovered_model_count=len(discovered),\\n+ eligible_model_count=len(eligible),\\n+ selected_agent_ids=selected_ids,\\n+ enabled_agent_ids=enabled_ids,\\n+ durable_agent_pool=bool(agents_db),\\n+ providers_with_errors=tuple(\\n+ sorted({error.provider_name for error in errors})\\n+ ),\\n+ priced_model_count=priced_count,\\n+ )\\n+\\n+\\n+def main(argv: Sequence[str] | None = None) -> None:\\n+ \\\"\\\"\\\"Run the one-shot provider bootstrap command used by trusted deployment jobs.\\\"\\\"\\\"\\n+ parser = argparse.ArgumentParser(\\n+ description=\\\"Register provider secrets and refresh the runtime model pool.\\\"\\n+ )\\n+ parser.add_argument(\\n+ \\\"--agents-db\\\",\\n+ default=os.environ.get(\\\"CONTEXTUAL_ORCHESTRATOR_AGENTS_DB\\\") or None,\\n+ )\\n+ parser.add_argument(\\\"--model-limit\\\", type=int, default=16)\\n+ parser.add_argument(\\n+ \\\"--allow-partial-credentials\\\",\\n+ action=\\\"store_true\\\",\\n+ help=\\\"Permit a subset of the fixed provider inventory (development only).\\\",\\n+ )\\n+ args = parser.parse_args(list(argv) if argv is not None else None)\\n+ report = bootstrap_provider_runtime(\\n+ environ=os.environ,\\n+ require_all_credentials=not args.allow_partial_credentials,\\n+ agents_db=args.agents_db,\\n+ model_limit=args.model_limit,\\n+ )\\n+ print(json.dumps(report.as_dict(), ensure_ascii=False, sort_keys=True))\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover - subprocess/CLI coverage\\n+ main()\" }, { \"sha\": \"2253caef562a6275371ebcb9700add802ee39ed9\", \"filename\": \"contextual_orchestrator/provider_catalog_bootstrap.py\", \"status\": \"added\", \"additions\": 378, \"deletions\": 0, \"changes\": 378, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Fprovider_catalog_bootstrap.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Fprovider_catalog_bootstrap.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Fprovider_catalog_bootstrap.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,378 @@\\n+\\\"\\\"\\\"Trusted provider bootstrap with durable normalized model-catalog persistence.\\n+\\n+This command registers the complete credential inventory, performs provider-\\n+isolated discovery, persists successful model metadata in PostgreSQL, retains\\n+last-known-good models for failed providers, and constructs a bounded candidate\\n+pool from the persisted catalog.\\n+\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import argparse\\n+from dataclasses import dataclass\\n+import json\\n+import os\\n+from typing import Callable, Mapping, Sequence\\n+\\n+from .cost_ledger import PriceBook\\n+from .credentials import (\\n+ InMemoryCredentialBackend,\\n+ PostgresCredentialBackend,\\n+ get_backend,\\n+ get_credential,\\n+)\\n+from .kv_config import InMemoryConfigStore\\n+from .model_discovery import (\\n+ DiscoveredModel,\\n+ PROVIDER_MODEL_SOURCES,\\n+ ProviderDiscoveryError,\\n+ ProviderModelSource,\\n+ agent_id_for,\\n+ discover_all_models,\\n+ refresh_price_book,\\n+)\\n+from .provider_bootstrap import (\\n+ ProviderBootstrapError,\\n+ _synchronize_durable_agent_pool,\\n+ collect_provider_credentials,\\n+ is_chat_serving_candidate,\\n+ register_provider_credentials_atomically,\\n+ select_provider_diverse_models,\\n+ serving_tags_for_discovered,\\n+)\\n+from .provider_catalog_store import (\\n+ InMemoryProviderCatalogStore,\\n+ PostgresProviderCatalogStore,\\n+ ProviderCatalogStore,\\n+)\\n+\\n+\\n+@dataclass(frozen=True)\\n+class ProviderCatalogSnapshot:\\n+ \\\"\\\"\\\"Effective persisted model snapshot after provider-isolated refresh.\\\"\\\"\\\"\\n+\\n+ models: tuple[DiscoveredModel, ...]\\n+ live_model_count: int\\n+ last_known_good_model_count: int\\n+ refresh_failure_count: int\\n+ providers_with_errors: tuple[str, ...]\\n+\\n+\\n+@dataclass(frozen=True)\\n+class ProviderCatalogBootstrapReport:\\n+ \\\"\\\"\\\"Secret-free evidence for one durable provider-catalog bootstrap.\\n+\\n+ ``registered_credentials`` contains the credential names that remain in the\\n+ credential registry after provider-isolated rollback has completed. It is\\n+ therefore safe for a workflow to use as durable-registration evidence.\\n+ \\\"\\\"\\\"\\n+\\n+ registered_credentials: tuple[str, ...]\\n+ restored_credentials: tuple[str, ...]\\n+ live_discovered_model_count: int\\n+ catalog_model_count: int\\n+ eligible_model_count: int\\n+ last_known_good_model_count: int\\n+ selected_agent_ids: tuple[str, ...]\\n+ enabled_agent_ids: tuple[str, ...]\\n+ durable_agent_pool: bool\\n+ catalog_backend: str\\n+ catalog_refresh_failure_count: int\\n+ providers_with_errors: tuple[str, ...]\\n+ priced_model_count: int\\n+\\n+ def as_dict(self) -> dict[str, object]:\\n+ \\\"\\\"\\\"Return the stable JSON evidence contract without secret values.\\\"\\\"\\\"\\n+ return {\\n+ \\\"registered_credentials\\\": list(self.registered_credentials),\\n+ \\\"restored_credentials\\\": list(self.restored_credentials),\\n+ \\\"live_discovered_model_count\\\": self.live_discovered_model_count,\\n+ \\\"catalog_model_count\\\": self.catalog_model_count,\\n+ \\\"eligible_model_count\\\": self.eligible_model_count,\\n+ \\\"last_known_good_model_count\\\": self.last_known_good_model_count,\\n+ \\\"selected_agent_ids\\\": list(self.selected_agent_ids),\\n+ \\\"enabled_agent_ids\\\": list(self.enabled_agent_ids),\\n+ \\\"durable_agent_pool\\\": self.durable_agent_pool,\\n+ \\\"catalog_backend\\\": self.catalog_backend,\\n+ \\\"catalog_refresh_failure_count\\\": self.catalog_refresh_failure_count,\\n+ \\\"providers_with_errors\\\": list(self.providers_with_errors),\\n+ \\\"priced_model_count\\\": self.priced_model_count,\\n+ }\\n+\\n+\\n+def build_provider_catalog_store() -> ProviderCatalogStore:\\n+ \\\"\\\"\\\"Build a catalog store colocated with the active credential backend.\\\"\\\"\\\"\\n+ backend = get_backend()\\n+ if isinstance(backend, PostgresCredentialBackend):\\n+ return PostgresProviderCatalogStore(backend.connection_dsn)\\n+ if isinstance(backend, InMemoryCredentialBackend):\\n+ return InMemoryProviderCatalogStore()\\n+ raise ProviderBootstrapError(\\n+ \\\"provider catalog requires a built-in atomic credential backend\\\"\\n+ )\\n+\\n+\\n+def _restore_provider_credentials_atomically(\\n+ previous_credentials: Mapping[str, str | None],\\n+) -> tuple[str, ...]:\\n+ \\\"\\\"\\\"Restore one credential snapshot in a single built-in backend transaction.\\\"\\\"\\\"\\n+ backend = get_backend()\\n+ ordered = tuple(sorted(previous_credentials))\\n+ if isinstance(backend, InMemoryCredentialBackend):\\n+ with backend._lock: # noqa: SLF001 - package-internal rollback transaction\\n+ for name in ordered:\\n+ previous = previous_credentials[name]\\n+ if previous is None:\\n+ backend._store.pop(name, None) # noqa: SLF001\\n+ else:\\n+ backend._store[name] = previous # noqa: SLF001\\n+ return ordered\\n+ if isinstance(backend, PostgresCredentialBackend):\\n+ with backend._connect() as connection: # noqa: SLF001 - package transaction\\n+ backend._ensure_schema(connection) # noqa: SLF001\\n+ with connection.cursor() as cursor:\\n+ for name in ordered:\\n+ previous = previous_credentials[name]\\n+ if previous is None:\\n+ cursor.execute(\\n+ \\\"DELETE FROM provider_credentials WHERE credential_name = %s\\\",\\n+ (name,),\\n+ )\\n+ else:\\n+ cursor.execute(\\n+ \\\"INSERT INTO provider_credentials \\\"\\n+ \\\"(credential_name, encrypted_value, updated_at) \\\"\\n+ \\\"VALUES (%s, pgp_sym_encrypt(%s, %s), now()) \\\"\\n+ \\\"ON CONFLICT (credential_name) DO UPDATE SET \\\"\\n+ \\\"encrypted_value = EXCLUDED.encrypted_value, updated_at = now()\\\",\\n+ (name, previous, backend._passphrase), # noqa: SLF001\\n+ )\\n+ connection.commit()\\n+ return ordered\\n+ raise ProviderBootstrapError(\\n+ \\\"provider credential rollback requires an atomic built-in backend\\\"\\n+ )\\n+\\n+\\n+def _source_key(source: ProviderModelSource) -> tuple[str, str]:\\n+ \\\"\\\"\\\"Return the provider-account key shared by sources and model rows.\\\"\\\"\\\"\\n+ return (source.provider_name, source.credential_name)\\n+\\n+\\n+def _model_key(model: DiscoveredModel) -> tuple[str, str]:\\n+ \\\"\\\"\\\"Return the provider-account key carried by one discovered model.\\\"\\\"\\\"\\n+ return (model.provider_name, model.credential_name)\\n+\\n+\\n+def refresh_persisted_provider_catalog(\\n+ store: ProviderCatalogStore,\\n+ *,\\n+ sources: Sequence[ProviderModelSource],\\n+ registered_credentials: Sequence[str],\\n+ discovered: Sequence[DiscoveredModel],\\n+ errors: Sequence[ProviderDiscoveryError],\\n+) -> ProviderCatalogSnapshot:\\n+ \\\"\\\"\\\"Persist account-local refreshes and return the effective LKG snapshot.\\\"\\\"\\\"\\n+ registered = set(registered_credentials)\\n+ live_by_account: dict[tuple[str, str], list[DiscoveredModel]] = {}\\n+ for model in discovered:\\n+ live_by_account.setdefault(_model_key(model), []).append(model)\\n+\\n+ failed_names = {error.provider_name for error in errors}\\n+ effective: list[DiscoveredModel] = []\\n+ last_known_good_count = 0\\n+ refresh_failures = 0\\n+ providers_with_errors: set[str] = set(failed_names)\\n+\\n+ for source in sources:\\n+ if source.credential_name not in registered:\\n+ continue\\n+ account_models = live_by_account.get(_source_key(source), [])\\n+ failed = source.provider_name in failed_names\\n+ if failed:\\n+ store.record_failure(source, error_code=\\\"provider_discovery_error\\\")\\n+ refresh_failures += 1\\n+ elif not account_models:\\n+ store.record_failure(source, error_code=\\\"empty_provider_catalog\\\")\\n+ refresh_failures += 1\\n+ providers_with_errors.add(source.provider_name)\\n+ else:\\n+ eligible_ids = {\\n+ model.model_id\\n+ for model in account_models\\n+ if is_chat_serving_candidate(model)\\n+ }\\n+ tags = {\\n+ model.model_id: serving_tags_for_discovered(model)\\n+ for model in account_models\\n+ if model.model_id in eligible_ids\\n+ }\\n+ store.record_success(\\n+ source,\\n+ account_models,\\n+ eligible_model_ids=eligible_ids,\\n+ serving_tags=tags,\\n+ )\\n+\\n+ persisted = store.serving_models(source)\\n+ effective.extend(persisted)\\n+ if failed or not account_models:\\n+ last_known_good_count += len(persisted)\\n+\\n+ unique: dict[tuple[str, str, str], DiscoveredModel] = {}\\n+ for model in effective:\\n+ unique[(model.provider_name, model.credential_name, model.model_id)] = model\\n+ ordered = tuple(unique[key] for key in sorted(unique))\\n+ return ProviderCatalogSnapshot(\\n+ models=ordered,\\n+ live_model_count=len(discovered),\\n+ last_known_good_model_count=last_known_good_count,\\n+ refresh_failure_count=refresh_failures,\\n+ providers_with_errors=tuple(sorted(providers_with_errors)),\\n+ )\\n+\\n+\\n+DiscoveryFunction = Callable[\\n+ [tuple[ProviderModelSource, ...]],\\n+ tuple[list[DiscoveredModel], list[ProviderDiscoveryError]],\\n+]\\n+\\n+\\n+def bootstrap_provider_catalog_runtime(\\n+ *,\\n+ environ: Mapping[str, str],\\n+ require_all_credentials: bool = True,\\n+ agents_db: str | None = None,\\n+ model_limit: int = 16,\\n+ catalog_store: ProviderCatalogStore | None = None,\\n+ sources: Sequence[ProviderModelSource] = PROVIDER_MODEL_SOURCES,\\n+ discovery: DiscoveryFunction | None = None,\\n+) -> ProviderCatalogBootstrapReport:\\n+ \\\"\\\"\\\"Register secrets, persist catalogs, and build the effective serving pool.\\\"\\\"\\\"\\n+ credentials = collect_provider_credentials(\\n+ environ,\\n+ require_all=require_all_credentials,\\n+ )\\n+ previous_credentials = {\\n+ name: get_credential(name) for name in credentials\\n+ }\\n+ registered = register_provider_credentials_atomically(credentials)\\n+ try:\\n+ store = catalog_store or build_provider_catalog_store()\\n+ source_tuple = tuple(sources)\\n+ discover = discovery or (\\n+ lambda requested_sources: discover_all_models(requested_sources)\\n+ )\\n+ live_models, errors = discover(source_tuple)\\n+ snapshot = refresh_persisted_provider_catalog(\\n+ store,\\n+ sources=source_tuple,\\n+ registered_credentials=registered,\\n+ discovered=live_models,\\n+ errors=errors,\\n+ )\\n+ failed_provider_names = {error.provider_name for error in errors}\\n+ failed_credentials = {\\n+ source.credential_name\\n+ for source in source_tuple\\n+ if source.credential_name in registered\\n+ and (\\n+ source.provider_name in failed_provider_names\\n+ or not any(\\n+ _model_key(model) == _source_key(source)\\n+ for model in live_models\\n+ )\\n+ )\\n+ }\\n+ restored_credentials = _restore_provider_credentials_atomically(\\n+ {\\n+ name: previous_credentials.get(name)\\n+ for name in failed_credentials\\n+ }\\n+ ) if failed_credentials else ()\\n+\\n+ usable_models = tuple(\\n+ model\\n+ for model in snapshot.models\\n+ if get_credential(model.credential_name)\\n+ )\\n+ if not usable_models:\\n+ raise ProviderBootstrapError(\\n+ \\\"provider bootstrap has no persisted chat-compatible model with a usable credential\\\"\\n+ )\\n+\\n+ price_book = PriceBook(InMemoryConfigStore())\\n+ priced_count = refresh_price_book(list(usable_models), price_book)\\n+ selected = select_provider_diverse_models(\\n+ usable_models,\\n+ limit=model_limit,\\n+ )\\n+ if not selected:\\n+ raise ProviderBootstrapError(\\n+ \\\"provider bootstrap selected no persisted chat-compatible model\\\"\\n+ )\\n+ selected_ids = tuple(agent_id_for(model) for model in selected)\\n+ enabled_ids = (\\n+ _synchronize_durable_agent_pool(agents_db, selected)\\n+ if agents_db\\n+ else ()\\n+ )\\n+ durable_registered_credentials = tuple(\\n+ name for name in registered if get_credential(name) is not None\\n+ )\\n+\\n+ return ProviderCatalogBootstrapReport(\\n+ registered_credentials=durable_registered_credentials,\\n+ restored_credentials=tuple(restored_credentials),\\n+ live_discovered_model_count=snapshot.live_model_count,\\n+ catalog_model_count=len(snapshot.models),\\n+ eligible_model_count=len(snapshot.models),\\n+ last_known_good_model_count=snapshot.last_known_good_model_count,\\n+ selected_agent_ids=selected_ids,\\n+ enabled_agent_ids=enabled_ids,\\n+ durable_agent_pool=bool(agents_db),\\n+ catalog_backend=store.backend_name,\\n+ catalog_refresh_failure_count=snapshot.refresh_failure_count,\\n+ providers_with_errors=snapshot.providers_with_errors,\\n+ priced_model_count=priced_count,\\n+ )\\n+ except Exception:\\n+ try:\\n+ _restore_provider_credentials_atomically(previous_credentials)\\n+ except Exception as rollback_error:\\n+ raise ProviderBootstrapError(\\n+ \\\"provider bootstrap failed and credential rollback could not complete\\\"\\n+ ) from rollback_error\\n+ raise\\n+\\n+\\n+def main(argv: Sequence[str] | None = None) -> None:\\n+ \\\"\\\"\\\"Run trusted durable provider bootstrap and print secret-free evidence.\\\"\\\"\\\"\\n+ parser = argparse.ArgumentParser(\\n+ description=(\\n+ \\\"Register provider secrets, persist provider models, and refresh \\\"\\n+ \\\"the effective serving pool.\\\"\\n+ )\\n+ )\\n+ parser.add_argument(\\n+ \\\"--agents-db\\\",\\n+ default=os.environ.get(\\\"CONTEXTUAL_ORCHESTRATOR_AGENTS_DB\\\") or None,\\n+ )\\n+ parser.add_argument(\\\"--model-limit\\\", type=int, default=16)\\n+ parser.add_argument(\\n+ \\\"--allow-partial-credentials\\\",\\n+ action=\\\"store_true\\\",\\n+ help=\\\"Permit a subset of the fixed provider inventory (development only).\\\",\\n+ )\\n+ args = parser.parse_args(list(argv) if argv is not None else None)\\n+ report = bootstrap_provider_catalog_runtime(\\n+ environ=os.environ,\\n+ require_all_credentials=not args.allow_partial_credentials,\\n+ agents_db=args.agents_db,\\n+ model_limit=args.model_limit,\\n+ )\\n+ print(json.dumps(report.as_dict(), ensure_ascii=False, sort_keys=True))\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover - subprocess/CLI boundary\\n+ main()\" }, { \"sha\": \"39511e7ceb5798643e8ab9c043498534f4ed30de\", \"filename\": \"contextual_orchestrator/provider_catalog_store.py\", \"status\": \"added\", \"additions\": 634, \"deletions\": 0, \"changes\": 634, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Fprovider_catalog_store.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/contextual_orchestrator%2Fprovider_catalog_store.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Fprovider_catalog_store.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,634 @@\\n+\\\"\\\"\\\"Normalized durable provider-model catalog persistence.\\n+\\n+This module owns provider-account/model metadata persistence and last-known-good\\n+refresh behavior. It never performs network I/O and never stores credential\\n+values. Discovery transport remains in ``model_discovery``; runtime selection\\n+remains in the ordinary orchestrator.\\n+\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+from dataclasses import dataclass\\n+from datetime import datetime, timezone\\n+from decimal import Decimal\\n+import hashlib\\n+import math\\n+import re\\n+import threading\\n+import uuid\\n+from typing import Callable, Mapping, Protocol, Sequence\\n+\\n+from .model_discovery import DiscoveredModel, ProviderModelSource\\n+\\n+\\n+PROVIDER_CATALOG_SCHEMA_SQL = \\\"\\\"\\\"\\n+CREATE TABLE IF NOT EXISTS provider_account (\\n+ provider_account_id text PRIMARY KEY,\\n+ provider_name text NOT NULL,\\n+ credential_name text NOT NULL,\\n+ list_url text NOT NULL,\\n+ chat_base_url text NOT NULL,\\n+ auth_scheme text NOT NULL,\\n+ discovery_style text NOT NULL,\\n+ task_filter text NOT NULL,\\n+ enabled_flag boolean NOT NULL DEFAULT true,\\n+ created_at timestamptz NOT NULL DEFAULT now(),\\n+ updated_at timestamptz NOT NULL DEFAULT now(),\\n+ UNIQUE (provider_name, credential_name)\\n+);\\n+\\n+CREATE TABLE IF NOT EXISTS provider_model (\\n+ provider_model_id text PRIMARY KEY,\\n+ provider_account_id text NOT NULL\\n+ REFERENCES provider_account(provider_account_id) ON DELETE CASCADE,\\n+ model_name text NOT NULL,\\n+ prompt_price_per_1k numeric(20, 8),\\n+ completion_price_per_1k numeric(20, 8),\\n+ currency_code text NOT NULL,\\n+ serving_eligible_flag boolean NOT NULL DEFAULT false,\\n+ enabled_flag boolean NOT NULL DEFAULT true,\\n+ first_seen_at timestamptz NOT NULL,\\n+ last_seen_at timestamptz NOT NULL,\\n+ UNIQUE (provider_account_id, model_name)\\n+);\\n+\\n+CREATE TABLE IF NOT EXISTS model_serving_tag (\\n+ provider_model_id text NOT NULL\\n+ REFERENCES provider_model(provider_model_id) ON DELETE CASCADE,\\n+ tag_name text NOT NULL,\\n+ PRIMARY KEY (provider_model_id, tag_name)\\n+);\\n+\\n+CREATE TABLE IF NOT EXISTS catalog_refresh_run (\\n+ catalog_refresh_run_id text PRIMARY KEY,\\n+ provider_account_id text NOT NULL\\n+ REFERENCES provider_account(provider_account_id) ON DELETE CASCADE,\\n+ refresh_status text NOT NULL,\\n+ observed_model_count integer NOT NULL DEFAULT 0,\\n+ eligible_model_count integer NOT NULL DEFAULT 0,\\n+ error_code text,\\n+ started_at timestamptz NOT NULL,\\n+ finished_at timestamptz NOT NULL\\n+);\\n+\\n+CREATE INDEX IF NOT EXISTS provider_model_account_idx\\n+ ON provider_model (provider_account_id, enabled_flag, serving_eligible_flag);\\n+CREATE INDEX IF NOT EXISTS catalog_refresh_account_idx\\n+ ON catalog_refresh_run (provider_account_id, finished_at DESC);\\n+\\\"\\\"\\\"\\n+\\\"\\\"\\\"Third-normal-form schema for provider accounts, models, tags, and refreshes.\\\"\\\"\\\"\\n+\\n+\\n+class ProviderCatalogError(RuntimeError):\\n+ \\\"\\\"\\\"Raised when durable provider catalog metadata cannot be persisted or read.\\\"\\\"\\\"\\n+\\n+\\n+@dataclass(frozen=True)\\n+class CatalogRefreshEvidence:\\n+ \\\"\\\"\\\"Secret-free evidence for one provider-account catalog refresh.\\\"\\\"\\\"\\n+\\n+ provider_account_id: str\\n+ refresh_status: str\\n+ observed_model_count: int\\n+ eligible_model_count: int\\n+ error_code: str | None\\n+ started_at: datetime\\n+ finished_at: datetime\\n+\\n+\\n+class ProviderCatalogStore(Protocol):\\n+ \\\"\\\"\\\"Persistence boundary for provider model metadata and last-known-good rows.\\\"\\\"\\\"\\n+\\n+ @property\\n+ def backend_name(self) -> str:\\n+ \\\"\\\"\\\"Return a stable backend name for secret-free operator evidence.\\\"\\\"\\\"\\n+ ...\\n+\\n+ def record_success(\\n+ self,\\n+ source: ProviderModelSource,\\n+ models: Sequence[DiscoveredModel],\\n+ *,\\n+ eligible_model_ids: set[str],\\n+ serving_tags: Mapping[str, tuple[str, ...]],\\n+ ) -> None:\\n+ \\\"\\\"\\\"Replace one provider account's current catalog atomically.\\\"\\\"\\\"\\n+ ...\\n+\\n+ def record_failure(\\n+ self,\\n+ source: ProviderModelSource,\\n+ *,\\n+ error_code: str,\\n+ ) -> None:\\n+ \\\"\\\"\\\"Record failure without changing last-known-good enabled models.\\\"\\\"\\\"\\n+ ...\\n+\\n+ def serving_models(\\n+ self,\\n+ source: ProviderModelSource,\\n+ ) -> list[DiscoveredModel]:\\n+ \\\"\\\"\\\"Return enabled, serving-eligible last-known-good models.\\\"\\\"\\\"\\n+ ...\\n+\\n+ def refresh_evidence(self) -> tuple[CatalogRefreshEvidence, ...]:\\n+ \\\"\\\"\\\"Return refresh evidence in insertion order.\\\"\\\"\\\"\\n+ ...\\n+\\n+\\n+_SLUG_RE = re.compile(r\\\"[^a-z0-9]+\\\")\\n+_CURRENCY_RE = re.compile(r\\\"^[A-Z]{3}$\\\")\\n+_ALLOWED_REFRESH_ERROR_CODES = frozenset(\\n+ {\\\"provider_discovery_error\\\", \\\"empty_provider_catalog\\\", \\\"unknown_error\\\"}\\n+)\\n+\\n+\\n+def provider_account_id(source: ProviderModelSource) -> str:\\n+ \\\"\\\"\\\"Return a stable two-or-more-word snake-case provider account ID.\\\"\\\"\\\"\\n+ provider = _SLUG_RE.sub(\\\"_\\\", source.provider_name.casefold()).strip(\\\"_\\\")\\n+ credential = _SLUG_RE.sub(\\\"_\\\", source.credential_name.casefold()).strip(\\\"_\\\")\\n+ if not provider or not credential:\\n+ raise ProviderCatalogError(\\\"provider account identity is incomplete\\\")\\n+ return f\\\"{provider}_{credential}\\\"\\n+\\n+\\n+def provider_model_id(source: ProviderModelSource, model_name: str) -> str:\\n+ \\\"\\\"\\\"Return a stable opaque ID for one account-scoped model name.\\\"\\\"\\\"\\n+ normalized = model_name.strip()\\n+ if not normalized:\\n+ raise ProviderCatalogError(\\\"provider model name is empty\\\")\\n+ digest = hashlib.sha256(\\n+ f\\\"{provider_account_id(source)}\\\\0{normalized}\\\".encode(\\\"utf-8\\\")\\n+ ).hexdigest()\\n+ return f\\\"provider_model_{digest[:32]}\\\"\\n+\\n+\\n+def _now() -> datetime:\\n+ \\\"\\\"\\\"Return a timezone-aware UTC timestamp.\\\"\\\"\\\"\\n+ return datetime.now(timezone.utc)\\n+\\n+\\n+def _normalize_price(value: object) -> float | None:\\n+ \\\"\\\"\\\"Return one finite non-negative price, or ``None`` when unknown, underflowed, or overflowed.\\n+\\n+ Parses through ``Decimal`` first so a nonzero price that underflows to\\n+ ``0.0`` in float (e.g. a stray ``1e-10000``) is rejected as unknown\\n+ rather than silently accepted as a legitimate free price. A ``Decimal``\\n+ can still be finite while its ``float()`` conversion overflows to\\n+ ``inf`` (e.g. ``1e10000``), so ``math.isfinite`` is checked separately\\n+ on the converted value.\\n+ \\\"\\\"\\\"\\n+ if value is None or isinstance(value, bool):\\n+ return None\\n+ try:\\n+ decimal_value = Decimal(str(value))\\n+ number = float(decimal_value)\\n+ except (ArithmeticError, TypeError, ValueError):\\n+ return None\\n+ if (\\n+ not decimal_value.is_finite()\\n+ or not math.isfinite(number)\\n+ or decimal_value < 0\\n+ or (decimal_value != 0 and number == 0)\\n+ ):\\n+ return None\\n+ return number\\n+\\n+\\n+_UNKNOWN_CURRENCY = \\\"UNKNOWN\\\"\\n+\\n+\\n+def _normalize_currency(value: object) -> str:\\n+ \\\"\\\"\\\"Return an ISO-style three-letter currency code, or an explicit unknown marker.\\n+\\n+ An unrecognized currency must never collapse to ``USD`` by default: doing\\n+ so would let a priced model with an unverified currency rank as a\\n+ comparable USD cost. ``_UNKNOWN_CURRENCY`` deliberately fails\\n+ ``_currency_is_comparable`` against every real default currency.\\n+ \\\"\\\"\\\"\\n+ if not isinstance(value, str):\\n+ return _UNKNOWN_CURRENCY\\n+ normalized = value.strip().upper()\\n+ return normalized if _CURRENCY_RE.fullmatch(normalized) else _UNKNOWN_CURRENCY\\n+\\n+\\n+def _normalize_error_code(value: object) -> str:\\n+ \\\"\\\"\\\"Return one approved secret-free provider refresh failure code.\\\"\\\"\\\"\\n+ if not isinstance(value, str):\\n+ return \\\"unknown_error\\\"\\n+ normalized = value.strip().casefold()\\n+ return normalized if normalized in _ALLOWED_REFRESH_ERROR_CODES else \\\"unknown_error\\\"\\n+\\n+\\n+def _normalize_tags(tags: Sequence[str]) -> tuple[str, ...]:\\n+ \\\"\\\"\\\"Return deterministic, valid, duplicate-free serving tags.\\\"\\\"\\\"\\n+ normalized: list[str] = []\\n+ for raw in tags:\\n+ if not isinstance(raw, str):\\n+ continue\\n+ tag = raw.strip().casefold()\\n+ if not tag or not re.fullmatch(r\\\"[a-z][a-z0-9_]*\\\", tag):\\n+ continue\\n+ if tag not in normalized:\\n+ normalized.append(tag)\\n+ return tuple(normalized)\\n+\\n+\\n+def normalize_discovered_model(\\n+ source: ProviderModelSource,\\n+ model: DiscoveredModel,\\n+) -> DiscoveredModel:\\n+ \\\"\\\"\\\"Normalize one discovered row and enforce its provider-account identity.\\\"\\\"\\\"\\n+ name = model.model_id.strip() if isinstance(model.model_id, str) else \\\"\\\"\\n+ if not name:\\n+ raise ProviderCatalogError(\\\"provider model name is empty\\\")\\n+ if (\\n+ model.provider_name != source.provider_name\\n+ or model.credential_name != source.credential_name\\n+ ):\\n+ raise ProviderCatalogError(\\\"provider model belongs to a different account\\\")\\n+ return DiscoveredModel(\\n+ provider_name=source.provider_name,\\n+ model_id=name,\\n+ credential_name=source.credential_name,\\n+ chat_base_url=source.chat_base_url,\\n+ auth_scheme=source.auth_scheme,\\n+ prompt_price_per_1k=_normalize_price(model.prompt_price_per_1k),\\n+ completion_price_per_1k=_normalize_price(\\n+ model.completion_price_per_1k\\n+ ),\\n+ currency_code=_normalize_currency(model.currency_code),\\n+ )\\n+\\n+\\n+def _deduplicate_models(\\n+ source: ProviderModelSource,\\n+ models: Sequence[DiscoveredModel],\\n+) -> dict[str, DiscoveredModel]:\\n+ \\\"\\\"\\\"Normalize and deterministically deduplicate account-scoped models.\\\"\\\"\\\"\\n+ result: dict[str, DiscoveredModel] = {}\\n+ for model in models:\\n+ normalized = normalize_discovered_model(source, model)\\n+ result[normalized.model_id] = normalized\\n+ return result\\n+\\n+\\n+class InMemoryProviderCatalogStore:\\n+ \\\"\\\"\\\"Thread-safe deterministic provider catalog for tests and standalone use.\\\"\\\"\\\"\\n+\\n+ def __init__(self) -> None:\\n+ self._accounts: dict[str, ProviderModelSource] = {}\\n+ self._models: dict[str, dict[str, DiscoveredModel]] = {}\\n+ self._eligible: dict[str, set[str]] = {}\\n+ self._tags: dict[tuple[str, str], tuple[str, ...]] = {}\\n+ self._refreshes: list[CatalogRefreshEvidence] = []\\n+ self._lock = threading.RLock()\\n+\\n+ @property\\n+ def backend_name(self) -> str:\\n+ \\\"\\\"\\\"Return the stable in-memory backend name.\\\"\\\"\\\"\\n+ return \\\"memory\\\"\\n+\\n+ def record_success(\\n+ self,\\n+ source: ProviderModelSource,\\n+ models: Sequence[DiscoveredModel],\\n+ *,\\n+ eligible_model_ids: set[str],\\n+ serving_tags: Mapping[str, tuple[str, ...]],\\n+ ) -> None:\\n+ \\\"\\\"\\\"Replace one in-memory account catalog.\\\"\\\"\\\"\\n+ normalized = _deduplicate_models(source, models)\\n+ if not normalized:\\n+ raise ProviderCatalogError(\\\"successful provider refresh cannot be empty\\\")\\n+ account_id = provider_account_id(source)\\n+ started_at = _now()\\n+ eligible = set(normalized).intersection(eligible_model_ids)\\n+ with self._lock:\\n+ self._accounts[account_id] = source\\n+ self._models[account_id] = normalized\\n+ self._eligible[account_id] = eligible\\n+ for key in [key for key in self._tags if key[0] == account_id]:\\n+ del self._tags[key]\\n+ for model_name in eligible:\\n+ self._tags[(account_id, model_name)] = _normalize_tags(\\n+ serving_tags.get(model_name, ())\\n+ )\\n+ self._refreshes.append(\\n+ CatalogRefreshEvidence(\\n+ account_id,\\n+ \\\"succeeded\\\",\\n+ len(normalized),\\n+ len(eligible),\\n+ None,\\n+ started_at,\\n+ _now(),\\n+ )\\n+ )\\n+\\n+ def record_failure(\\n+ self,\\n+ source: ProviderModelSource,\\n+ *,\\n+ error_code: str,\\n+ ) -> None:\\n+ \\\"\\\"\\\"Record a stable failure without mutating last-known-good models.\\\"\\\"\\\"\\n+ account_id = provider_account_id(source)\\n+ started_at = _now()\\n+ stable_code = _normalize_error_code(error_code)\\n+ with self._lock:\\n+ self._accounts[account_id] = source\\n+ self._refreshes.append(\\n+ CatalogRefreshEvidence(\\n+ account_id,\\n+ \\\"failed\\\",\\n+ 0,\\n+ 0,\\n+ stable_code,\\n+ started_at,\\n+ _now(),\\n+ )\\n+ )\\n+\\n+ def serving_models(\\n+ self,\\n+ source: ProviderModelSource,\\n+ ) -> list[DiscoveredModel]:\\n+ \\\"\\\"\\\"Return deterministic serving models for one account.\\\"\\\"\\\"\\n+ account_id = provider_account_id(source)\\n+ with self._lock:\\n+ models = self._models.get(account_id, {})\\n+ eligible = self._eligible.get(account_id, set())\\n+ return [models[name] for name in sorted(eligible) if name in models]\\n+\\n+ def serving_tags(\\n+ self,\\n+ source: ProviderModelSource,\\n+ model_name: str,\\n+ ) -> tuple[str, ...]:\\n+ \\\"\\\"\\\"Return persisted generic serving tags for one model.\\\"\\\"\\\"\\n+ with self._lock:\\n+ return self._tags.get((provider_account_id(source), model_name), ())\\n+\\n+ def refresh_evidence(self) -> tuple[CatalogRefreshEvidence, ...]:\\n+ \\\"\\\"\\\"Return immutable refresh evidence in insertion order.\\\"\\\"\\\"\\n+ with self._lock:\\n+ return tuple(self._refreshes)\\n+\\n+\\n+class PostgresProviderCatalogStore:\\n+ \\\"\\\"\\\"PostgreSQL provider catalog sharing the credential registry database.\\\"\\\"\\\"\\n+\\n+ def __init__(\\n+ self,\\n+ dsn: str,\\n+ *,\\n+ connection_factory: Callable[[], object] | None = None,\\n+ ) -> None:\\n+ if not isinstance(dsn, str) or not dsn.strip():\\n+ raise ProviderCatalogError(\\\"provider catalog requires a PostgreSQL DSN\\\")\\n+ self._dsn = dsn\\n+ self._connection_factory = connection_factory\\n+ self._schema_ready = False\\n+ self._schema_lock = threading.Lock()\\n+ self._evidence: list[CatalogRefreshEvidence] = []\\n+\\n+ @property\\n+ def backend_name(self) -> str:\\n+ \\\"\\\"\\\"Return the stable PostgreSQL backend name.\\\"\\\"\\\"\\n+ return \\\"postgres\\\"\\n+\\n+ def _connect(self):\\n+ \\\"\\\"\\\"Open one catalog connection through the injected or psycopg factory.\\\"\\\"\\\"\\n+ if self._connection_factory is not None:\\n+ return self._connection_factory()\\n+ try:\\n+ import psycopg\\n+ except ImportError as exc: # pragma: no cover - packaging boundary\\n+ raise ProviderCatalogError(\\n+ \\\"provider catalog requires contextual-orchestrator[db]\\\"\\n+ ) from exc\\n+ return psycopg.connect(self._dsn) # pragma: no cover - live database\\n+\\n+ def _ensure_schema(self, connection: object) -> None:\\n+ \\\"\\\"\\\"Create normalized catalog objects once per store instance.\\\"\\\"\\\"\\n+ if self._schema_ready:\\n+ return\\n+ with self._schema_lock:\\n+ if self._schema_ready:\\n+ return\\n+ with connection.cursor() as cursor:\\n+ cursor.execute(PROVIDER_CATALOG_SCHEMA_SQL)\\n+ connection.commit()\\n+ self._schema_ready = True\\n+\\n+ @staticmethod\\n+ def _upsert_account(cursor: object, source: ProviderModelSource) -> str:\\n+ \\\"\\\"\\\"Upsert one provider account without credential values.\\\"\\\"\\\"\\n+ account_id = provider_account_id(source)\\n+ cursor.execute(\\n+ \\\"INSERT INTO provider_account (\\\"\\n+ \\\"provider_account_id, provider_name, credential_name, list_url, \\\"\\n+ \\\"chat_base_url, auth_scheme, discovery_style, task_filter, \\\"\\n+ \\\"enabled_flag, created_at, updated_at\\\"\\n+ \\\") VALUES (%s, %s, %s, %s, %s, %s, %s, %s, true, now(), now()) \\\"\\n+ \\\"ON CONFLICT (provider_account_id) DO UPDATE SET \\\"\\n+ \\\"provider_name = EXCLUDED.provider_name, \\\"\\n+ \\\"credential_name = EXCLUDED.credential_name, \\\"\\n+ \\\"list_url = EXCLUDED.list_url, \\\"\\n+ \\\"chat_base_url = EXCLUDED.chat_base_url, \\\"\\n+ \\\"auth_scheme = EXCLUDED.auth_scheme, \\\"\\n+ \\\"discovery_style = EXCLUDED.discovery_style, \\\"\\n+ \\\"task_filter = EXCLUDED.task_filter, \\\"\\n+ \\\"enabled_flag = true, updated_at = now()\\\",\\n+ (\\n+ account_id,\\n+ source.provider_name,\\n+ source.credential_name,\\n+ source.list_url,\\n+ source.chat_base_url,\\n+ source.auth_scheme,\\n+ source.style,\\n+ source.task_filter,\\n+ ),\\n+ )\\n+ return account_id\\n+\\n+ def record_success(\\n+ self,\\n+ source: ProviderModelSource,\\n+ models: Sequence[DiscoveredModel],\\n+ *,\\n+ eligible_model_ids: set[str],\\n+ serving_tags: Mapping[str, tuple[str, ...]],\\n+ ) -> None:\\n+ \\\"\\\"\\\"Replace one PostgreSQL account catalog in a single transaction.\\\"\\\"\\\"\\n+ normalized = _deduplicate_models(source, models)\\n+ if not normalized:\\n+ raise ProviderCatalogError(\\\"successful provider refresh cannot be empty\\\")\\n+ started_at = _now()\\n+ eligible = set(normalized).intersection(eligible_model_ids)\\n+ with self._connect() as connection:\\n+ self._ensure_schema(connection)\\n+ with connection.cursor() as cursor:\\n+ account_id = self._upsert_account(cursor, source)\\n+ cursor.execute(\\n+ \\\"UPDATE provider_model SET enabled_flag = false \\\"\\n+ \\\"WHERE provider_account_id = %s\\\",\\n+ (account_id,),\\n+ )\\n+ cursor.execute(\\n+ \\\"DELETE FROM model_serving_tag WHERE provider_model_id IN (\\\"\\n+ \\\"SELECT provider_model_id FROM provider_model \\\"\\n+ \\\"WHERE provider_account_id = %s)\\\",\\n+ (account_id,),\\n+ )\\n+ for model_name, model in normalized.items():\\n+ model_row_id = provider_model_id(source, model_name)\\n+ cursor.execute(\\n+ \\\"INSERT INTO provider_model (\\\"\\n+ \\\"provider_model_id, provider_account_id, model_name, \\\"\\n+ \\\"prompt_price_per_1k, completion_price_per_1k, currency_code, \\\"\\n+ \\\"serving_eligible_flag, enabled_flag, first_seen_at, \\\"\\n+ \\\"last_seen_at\\\"\\n+ \\\") VALUES (%s, %s, %s, %s, %s, %s, %s, \\\"\\n+ \\\"true, %s, %s) \\\"\\n+ \\\"ON CONFLICT (provider_model_id) DO UPDATE SET \\\"\\n+ \\\"model_name = EXCLUDED.model_name, \\\"\\n+ \\\"prompt_price_per_1k = EXCLUDED.prompt_price_per_1k, \\\"\\n+ \\\"completion_price_per_1k = EXCLUDED.completion_price_per_1k, \\\"\\n+ \\\"currency_code = EXCLUDED.currency_code, \\\"\\n+ \\\"serving_eligible_flag = EXCLUDED.serving_eligible_flag, \\\"\\n+ \\\"enabled_flag = true, last_seen_at = EXCLUDED.last_seen_at\\\",\\n+ (\\n+ model_row_id,\\n+ account_id,\\n+ model_name,\\n+ model.prompt_price_per_1k,\\n+ model.completion_price_per_1k,\\n+ model.currency_code,\\n+ model_name in eligible,\\n+ started_at,\\n+ started_at,\\n+ ),\\n+ )\\n+ if model_name in eligible:\\n+ for tag in _normalize_tags(serving_tags.get(model_name, ())):\\n+ cursor.execute(\\n+ \\\"INSERT INTO model_serving_tag \\\"\\n+ \\\"(provider_model_id, tag_name) \\\"\\n+ \\\"VALUES (%s, %s) ON CONFLICT DO NOTHING\\\",\\n+ (model_row_id, tag),\\n+ )\\n+ finished_at = _now()\\n+ cursor.execute(\\n+ \\\"INSERT INTO catalog_refresh_run (\\\"\\n+ \\\"catalog_refresh_run_id, provider_account_id, refresh_status, \\\"\\n+ \\\"observed_model_count, eligible_model_count, error_code, \\\"\\n+ \\\"started_at, finished_at\\\"\\n+ \\\") VALUES (%s, %s, %s, %s, %s, %s, %s, %s)\\\",\\n+ (\\n+ f\\\"catalog_refresh_{uuid.uuid4().hex}\\\",\\n+ account_id,\\n+ \\\"succeeded\\\",\\n+ len(normalized),\\n+ len(eligible),\\n+ None,\\n+ started_at,\\n+ finished_at,\\n+ ),\\n+ )\\n+ connection.commit()\\n+ self._evidence.append(\\n+ CatalogRefreshEvidence(\\n+ provider_account_id(source),\\n+ \\\"succeeded\\\",\\n+ len(normalized),\\n+ len(eligible),\\n+ None,\\n+ started_at,\\n+ finished_at,\\n+ )\\n+ )\\n+\\n+ def record_failure(\\n+ self,\\n+ source: ProviderModelSource,\\n+ *,\\n+ error_code: str,\\n+ ) -> None:\\n+ \\\"\\\"\\\"Record a PostgreSQL failure without disabling prior models.\\\"\\\"\\\"\\n+ started_at = _now()\\n+ stable_code = _normalize_error_code(error_code)\\n+ with self._connect() as connection:\\n+ self._ensure_schema(connection)\\n+ with connection.cursor() as cursor:\\n+ account_id = self._upsert_account(cursor, source)\\n+ finished_at = _now()\\n+ cursor.execute(\\n+ \\\"INSERT INTO catalog_refresh_run (\\\"\\n+ \\\"catalog_refresh_run_id, provider_account_id, refresh_status, \\\"\\n+ \\\"observed_model_count, eligible_model_count, error_code, \\\"\\n+ \\\"started_at, finished_at\\\"\\n+ \\\") VALUES (%s, %s, %s, %s, %s, %s, %s, %s)\\\",\\n+ (\\n+ f\\\"catalog_refresh_{uuid.uuid4().hex}\\\",\\n+ account_id,\\n+ \\\"failed\\\",\\n+ 0,\\n+ 0,\\n+ stable_code,\\n+ started_at,\\n+ finished_at,\\n+ ),\\n+ )\\n+ connection.commit()\\n+ self._evidence.append(\\n+ CatalogRefreshEvidence(\\n+ provider_account_id(source),\\n+ \\\"failed\\\",\\n+ 0,\\n+ 0,\\n+ stable_code,\\n+ started_at,\\n+ finished_at,\\n+ )\\n+ )\\n+\\n+ def serving_models(\\n+ self,\\n+ source: ProviderModelSource,\\n+ ) -> list[DiscoveredModel]:\\n+ \\\"\\\"\\\"Read enabled last-known-good serving models for one account.\\\"\\\"\\\"\\n+ account_id = provider_account_id(source)\\n+ with self._connect() as connection:\\n+ self._ensure_schema(connection)\\n+ with connection.cursor() as cursor:\\n+ cursor.execute(\\n+ \\\"SELECT pm.model_name, pa.chat_base_url, pa.auth_scheme, \\\"\\n+ \\\"pm.prompt_price_per_1k, pm.completion_price_per_1k, \\\"\\n+ \\\"pm.currency_code FROM provider_model AS pm \\\"\\n+ \\\"JOIN provider_account AS pa ON pa.provider_account_id = pm.provider_account_id \\\"\\n+ \\\"WHERE pm.provider_account_id = %s \\\"\\n+ \\\"AND pm.enabled_flag = true AND pm.serving_eligible_flag = true \\\"\\n+ \\\"ORDER BY pm.model_name\\\",\\n+ (account_id,),\\n+ )\\n+ rows = cursor.fetchall()\\n+ return [\\n+ DiscoveredModel(\\n+ provider_name=source.provider_name,\\n+ model_id=row[0],\\n+ credential_name=source.credential_name,\\n+ chat_base_url=row[1],\\n+ auth_scheme=row[2],\\n+ prompt_price_per_1k=_normalize_price(row[3]),\\n+ completion_price_per_1k=_normalize_price(row[4]),\\n+ currency_code=_normalize_currency(row[5]),\\n+ )\\n+ for row in rows\\n+ ]\\n+\\n+ def refresh_evidence(self) -> tuple[CatalogRefreshEvidence, ...]:\\n+ \\\"\\\"\\\"Return evidence emitted by this store instance.\\\"\\\"\\\"\\n+ return tuple(self._evidence)\" }, { \"sha\": \"56c37beac22656936aa8ba54e7623365e9a1278b\", \"filename\": \"docs/database_design.sql\", \"status\": \"modified\", \"additions\": 64, \"deletions\": 0, \"changes\": 64, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/docs%2Fdatabase_design.sql\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/docs%2Fdatabase_design.sql\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fdatabase_design.sql?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -69,6 +69,64 @@ create table audit_event (\\n created_at timestamptz not null default now()\\n );\\n \\n+create table provider_credentials (\\n+ credential_name text primary key,\\n+ encrypted_value bytea not null,\\n+ updated_at timestamptz not null default now()\\n+);\\n+\\n+create table provider_account (\\n+ provider_account_id text primary key,\\n+ provider_name text not null,\\n+ -- Credential rollback deliberately stays independent of catalog rows so a\\n+ -- failed candidate promotion cannot delete last-known-good model metadata.\\n+ -- The runtime catalog DDL uses the same application-managed relationship.\\n+ credential_name text not null,\\n+ list_url text not null,\\n+ chat_base_url text not null,\\n+ auth_scheme text not null,\\n+ discovery_style text not null,\\n+ task_filter text not null,\\n+ enabled_flag boolean not null default true,\\n+ created_at timestamptz not null default now(),\\n+ updated_at timestamptz not null default now(),\\n+ unique (provider_name, credential_name)\\n+);\\n+\\n+create table provider_model (\\n+ provider_model_id text primary key,\\n+ provider_account_id text not null\\n+ references provider_account(provider_account_id) on delete cascade,\\n+ model_name text not null,\\n+ prompt_price_per_1k numeric(20, 8),\\n+ completion_price_per_1k numeric(20, 8),\\n+ currency_code text not null,\\n+ serving_eligible_flag boolean not null default false,\\n+ enabled_flag boolean not null default true,\\n+ first_seen_at timestamptz not null,\\n+ last_seen_at timestamptz not null,\\n+ unique (provider_account_id, model_name)\\n+);\\n+\\n+create table model_serving_tag (\\n+ provider_model_id text not null\\n+ references provider_model(provider_model_id) on delete cascade,\\n+ tag_name text not null,\\n+ primary key (provider_model_id, tag_name)\\n+);\\n+\\n+create table catalog_refresh_run (\\n+ catalog_refresh_run_id text primary key,\\n+ provider_account_id text not null\\n+ references provider_account(provider_account_id) on delete cascade,\\n+ refresh_status text not null,\\n+ observed_model_count integer not null default 0,\\n+ eligible_model_count integer not null default 0,\\n+ error_code text,\\n+ started_at timestamptz not null,\\n+ finished_at timestamptz not null\\n+);\\n+\\n create index workflow_run_retention_idx\\n on workflow_run (retention_expires_at)\\n where deleted_at is null;\\n@@ -81,6 +139,12 @@ create index audit_event_retention_idx\\n on audit_event (retention_expires_at)\\n where deleted_at is null;\\n \\n+create index provider_model_account_idx\\n+ on provider_model (provider_account_id, enabled_flag, serving_eligible_flag);\\n+\\n+create index catalog_refresh_account_idx\\n+ on catalog_refresh_run (provider_account_id, finished_at desc);\\n+\\n create view workflow_run_safe_view as\\n select\\n workflow_run_id,\" }, { \"sha\": \"383868be62f1d2e560651614d6ac60ee77d6b7e4\", \"filename\": \"docs/doctoring/current-main-provider-bootstrap.md\", \"status\": \"added\", \"additions\": 119, \"deletions\": 0, \"changes\": 119, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/docs%2Fdoctoring%2Fcurrent-main-provider-bootstrap.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/docs%2Fdoctoring%2Fcurrent-main-provider-bootstrap.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fdoctoring%2Fcurrent-main-provider-bootstrap.md?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,119 @@\\n+# Current-main provider bootstrap\\n+\\n+## Decision\\n+\\n+The durable catalog decision is recorded in\\n+[`ADR 0015`](../planning/adrs/0015-durable-provider-catalog.md), including the\\n+third-normal-form dependency boundary and the last-known-good refresh contract.\\n+\\n+Contextual Orchestrator treats the five organization provider credentials as one\\n+trusted bootstrap inventory:\\n+\\n+- `NVIDIA_NIM_API_KEY`\\n+- `NVIDIA_NIM_API_KEY_SUB`\\n+- `BYTEZ_API_KEY`\\n+- `OPENROUTER_API_KEY`\\n+- `OPENAI_API_KEY`\\n+\\n+GitHub Actions secrets are transport into a one-shot bootstrap process, not the\\n+runtime credential source. Production bootstrap requires the PostgreSQL credential\\n+backend so values are stored encrypted at rest through the existing pgcrypto\\n+registry. Runtime model discovery resolves credential names through\\n+`get_credential()` only.\\n+\\n+## Failure contract\\n+\\n+Production bootstrap fails closed when any fixed credential is missing, when the\\n+configured credential backend is not atomic, or when no usable provider model can\\n+be discovered. A provider-local discovery exception does not erase models returned\\n+by other providers; the report contains only stable provider names and counts, never\\n+raw exception strings or credential values.\\n+\\n+`registered_credentials` is the post-rollback durable inventory, not merely the\\n+set of candidate names received from Actions. If a first-ever candidate key is\\n+reverted after a failed provider refresh, that name is omitted from the report\\n+and the hourly workflow fails its complete-inventory gate. Existing keys that\\n+are restored remain listed, so a transient provider outage can preserve\\n+last-known-good serving without falsely claiming that a missing key is durable.\\n+\\n+A successful generic `/models` response is not itself evidence that every row can\\n+serve Chat Completions. OpenAI-compatible registries may mix chat models with\\n+embeddings, rerankers, speech, image generation, moderation, safety, or realtime\\n+transports. The bootstrap therefore applies a conservative negative compatibility\\n+filter before selection and reports both:\\n+\\n+- `discovered_model_count`: every syntactically valid catalog row; and\\n+- `eligible_model_count`: rows that are not clearly a non-chat transport.\\n+\\n+If no compatible row remains, bootstrap fails closed instead of activating the\\n+cheapest incompatible model. Surviving rows receive only generic serving tags:\\n+`discovered`, `chat`, `worker`, `writing`, and `synthesizer`. The bootstrap never\\n+infers reasoning, verification, coding, vision, or provider-native effort support\\n+from a model name. Those capabilities require explicit provider/catalog evidence or\\n+measured evaluation and are negotiated by the ordinary runtime policy.\\n+\\n+The bootstrap pool is provider-diverse before it is cost-ordered. Missing price is\\n+`unknown`, not zero. This avoids treating a provider such as Bytez, whose public\\n+catalog may use a non-token billing unit, as a fabricated free route.\\n+\\n+Candidate selection and durable serving activation are separate claims:\\n+\\n+- `selected_agent_ids` records the bounded chat candidates produced by discovery\\n+ and selection;\\n+- `enabled_agent_ids` is populated only when an explicit durable `--agents-db`\\n+ is supplied and the selected agents are confirmed active in that pool; and\\n+- `durable_agent_pool` states whether the activation claim is backed by a\\n+ persistent agent-pool database.\\n+\\n+When a durable pool is refreshed, the bootstrap tombstones its synthetic seed and\\n+previously discovered agents that are absent from the current bounded selection.\\n+Operator-managed agents are preserved. This prevents retired, withdrawn, or newly\\n+classified non-chat provider models from continuing to receive traffic after a\\n+later discovery run.\\n+\\n+## Operational workflow\\n+\\n+`.github/workflows/provider-catalog-sync.yml` runs hourly on protected `main` and may\\n+also be dispatched manually. It is intentionally absent from pull-request secret\\n+execution. The production environment must provide:\\n+\\n+- the five provider secrets above;\\n+- `CONTEXTUAL_ORCHESTRATOR_KV_DSN`; and\\n+- `CONTEXTUAL_ORCHESTRATOR_KV_PASSPHRASE`.\\n+\\n+The GitHub-hosted workflow has an ephemeral filesystem. It therefore registers the\\n+five credentials in the durable PostgreSQL KV and verifies discovery,\\n+`eligible_model_count`, and `selected_agent_ids`; it does not claim durable\\n+agent-pool activation. A long-running service may either use the ordinary KV-backed\\n+startup discovery path or invoke this bootstrap with a persistent `--agents-db`\\n+under its own deployment boundary.\\n+\\n+The workflow verifies that all five credential names were registered, at least one\\n+model was discovered, at least one chat-compatible model survived classification, a\\n+bounded serving candidate set was produced, and no exact provider secret appears in\\n+the emitted report.\\n+\\n+## Research and standards grounding\\n+\\n+The automatic pool remains a routing input rather than an unsupported claim that a\\n+single cheapest model is universally best. Quality/performance selection remains in\\n+the orchestrator's paper-grounded routing and orchestration layer; this bootstrap\\n+only establishes a compatible candidate set and failure isolation.\\n+\\n+National Institute of Standards and Technology. (2020). *Security and privacy\\n+controls for information systems and organizations* (NIST Special Publication\\n+800-53 Rev. 5). https://doi.org/10.6028/NIST.SP.800-53r5\\n+\\n+National Institute of Standards and Technology. (2024). *Artificial intelligence\\n+risk management framework: Generative artificial intelligence profile* (NIST AI\\n+600-1). https://doi.org/10.6028/NIST.AI.600-1\\n+\\n+Tang, Y., et al. (2026). *Sakana Fugu technical report*. Sakana AI.\\n+\\n+Xu, J., Sun, Q., Schwendeman, P., Nielsen, S., Cetin, E., & Tang, Y. (2025).\\n+*Trinity: An evolved LLM coordinator* (arXiv:2512.04695).\\n+https://doi.org/10.48550/arXiv.2512.04695\\n+\\n+Nielsen, S., Cetin, E., Schwendeman, P., Sun, Q., Xu, J., & Tang, Y. (2025).\\n+*Learning to orchestrate agents in natural language with the Conductor*\\n+(arXiv:2512.04388). https://doi.org/10.48550/arXiv.2512.04388\" }, { \"sha\": \"0251375d4bd4ad91ac23995d68c1fd6b300b0a88\", \"filename\": \"docs/doctoring/embedding-chat-capability-isolation.md\", \"status\": \"added\", \"additions\": 133, \"deletions\": 0, \"changes\": 133, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/docs%2Fdoctoring%2Fembedding-chat-capability-isolation.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/docs%2Fdoctoring%2Fembedding-chat-capability-isolation.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fdoctoring%2Fembedding-chat-capability-isolation.md?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,133 @@\\n+# Embedding-to-chat capability isolation incident\\n+\\n+**Status:** Accepted incident decision\\n+**Date:** 2026-08-20\\n+**Affected consumer:** LineageWeave buyer-surface stack around PR #260\\n+\\n+## Incident\\n+\\n+A conducted workflow reached the final contextual-orchestrator synthesizer with\\n+`model_group=text-embedding-3-large` and deployment\\n+`azure/text-embedding-3-large`. The gateway rejected the chat operation as\\n+unsupported. Its configured fallback map contained chat-generation model groups,\\n+but no fallback attached to the embedding group.\\n+\\n+The missing fallback was a symptom, not the causal defect. An embedding deployment\\n+had already crossed the chat-agent capability boundary and become eligible for a\\n+worker role.\\n+\\n+## Causal boundary\\n+\\n+Provider-compatible `/models` registries can contain multiple endpoint families.\\n+The original discovery parser accepted every non-empty model identifier and exposed\\n+it to agent creation, price selection, and durable pool synchronization. A catalog\\n+row naming an embedding deployment could therefore be scored for thinker, worker,\\n+verifier, or synthesizer work even though its serving endpoint accepts embedding\\n+input rather than chat messages.\\n+\\n+The first incident fix closed discovery and price-routing boundaries, but further\\n+root-cause tracing showed an already-persisted incompatible `ModelAgent` could still\\n+survive that filter. The runtime ranking path, generated workflow assignment,\\n+cross-agent failover, readiness probe, streaming path, and direct\\n+`ModelClient.chat()` path previously trusted the persisted model identifier. That\\n+stale-state path is sufficient to reproduce the same unsupported Azure chat\\n+operation after a process restart or durable bootstrap.\\n+\\n+OpenAI documents `text-embedding-3-large` under the embeddings endpoint, separately\\n+from models supported by chat completions. Microsoft likewise demonstrates it with\\n+`client.embeddings.create`, not `client.chat.completions.create`. LiteLLM exposes\\n+chat, responses, embeddings, image, audio, rerank, and other endpoint families as\\n+distinct operations. A router fallback can choose another deployment for the same\\n+operation; it cannot make an embedding deployment execute a chat operation.\\n+\\n+## Decision\\n+\\n+Chat transport compatibility and general agent-role eligibility are separate\\n+shared runtime invariants. A provider may expose an audio-capable model or a\\n+policy classifier through Chat Completions while that model remains unsuitable\\n+for ordinary thinker, worker, verifier, or synthesizer work.\\n+\\n+1. Normalize provider prefixes and common separators in model identifiers.\\n+2. At the transport boundary, reject identifiers that clearly advertise embedding,\\n+ reranking, transcription, moderation-endpoint, image-generation, realtime, or\\n+ speech-only semantics.\\n+3. Keep provider-documented audio and policy-classifier models transport-compatible\\n+ when they are served through Chat Completions.\\n+4. At discovery and ordinary orchestration-role boundaries, additionally exclude\\n+ explicit guard, safety, and NemoGuard policy classifiers.\\n+5. Apply the general-role guard while parsing both OpenAI-compatible and Bytez\\n+ catalogs and before converting, pricing, or cost-selecting a discovery record.\\n+6. Remove stale ineligible agents from thinker, worker, verifier, and synthesizer\\n+ ranking even if a durable configuration still contains them.\\n+7. Reselect a generated workflow step that explicitly names a stale ineligible\\n+ agent and omit such agents from planner inventory.\\n+8. Remove ineligible agents from cross-agent failover candidates.\\n+9. Apply the transport guard at `ModelClient.chat()`, `stream_chat()`, and\\n+ readiness probing before mock or network transport.\\n+10. Fail closed when no general chat agent remains.\\n+11. Leave unknown identifiers eligible without fabricating reasoning, tool, vision,\\n+ or verification capabilities from their names.\\n+\\n+This is deliberately a conservative negative filter. A future capability registry\\n+may replace name-based exclusion with authenticated provider metadata, measured\\n+endpoint probes, and separate endpoint-specific pools. Until that evidence exists,\\n+a clearly incompatible model fails closed at transport boundaries and a clearly\\n+specialized policy model fails closed at general-role boundaries.\\n+\\n+## Rejected response\\n+\\n+Adding `text-embedding-3-large` to a chat fallback map is rejected. It would retain\\n+the invalid primary assignment and merely hide it when a fallback happened to be\\n+available. Repeated provider retries are also rejected because the request is\\n+structurally unsupported, not transiently unavailable.\\n+\\n+## Residual operational action\\n+\\n+Runtime containment means an already-persisted embedding agent can no longer win\\n+chat selection or failover while stale data is being cleaned up. Durable state must\\n+still converge to the correct exact set: the provider-bootstrap slice owns stale\\n+discovered-agent withdrawal and now imports the same shared classifier as the\\n+runtime, with a policy-matrix regression test covering image, embedding, safety,\\n+audio, and ordinary chat identifiers.\\n+Runtime rejection is defense in depth, not a substitute for deleting invalid\\n+persistent configuration.\\n+\\n+## Verification evidence\\n+\\n+`tests/test_chat_model_capability_isolation.py` reproduces the exact Azure model ID\\n+and provider/separator aliases. Together with\\n+`tests/test_chat_capability_unknown_identifiers.py`,\\n+`tests/test_chat_transport_role_separation.py`, and\\n+`tests/test_chat_passthrough_capability_isolation.py`, it verifies:\\n+\\n+- OpenAI-compatible and Bytez catalog filtering;\\n+- malformed and prefix-only identifier handling;\\n+- agent-conversion rejection;\\n+- exclusion from the price book and cheapest-agent selection;\\n+- exclusion of a high-priority stale embedding agent from synthesizer selection;\\n+- fail-closed behavior when the persisted pool contains only non-chat agents;\\n+- generated-plan reassignment away from a stale embedding agent;\\n+- exclusion from cross-agent failover;\\n+- direct and streaming `ModelClient` rejection before transport;\\n+- readiness failure with a stable non-chat code before provider access;\\n+- planner inventory and generated-plan isolation;\\n+- distinction between chat-served audio/policy models and general agent roles.\\n+- conservative unknown-identifier handling, including unrelated `vanguard` names;\\n+- endpoint-family exclusions for image-generation (`dall-e`), CLIP, and SigLIP;\\n+- normalized `/v1/responses` passthrough and pre-transport rejection of embedding models.\\n+\\n+## References\\n+\\n+BerriAI. (n.d.). *LiteLLM: Call 100+ LLMs using the OpenAI input/output format*.\\n+Retrieved August 20, 2026, from https://docs.litellm.ai/\\n+\\n+Microsoft. (n.d.). *How to switch between OpenAI and Azure OpenAI endpoints*.\\n+Microsoft Learn. Retrieved August 20, 2026, from\\n+https://learn.microsoft.com/en-us/azure/developer/ai/how-to/switching-endpoints\\n+\\n+OpenAI. (n.d.). *Data controls in the OpenAI platform: Default usage policies by\\n+endpoint*. Retrieved August 20, 2026, from\\n+https://platform.openai.com/docs/models/default-usage-policies-by-endpoint\\n+\\n+OpenAI. (n.d.). *GPT-audio model*. Retrieved August 20, 2026, from\\n+https://developers.openai.com/api/docs/models/gpt-audio\" }, { \"sha\": \"08c20b1eb3de1baaa8fa306bbc2ecc45397efc42\", \"filename\": \"docs/doctoring/provider-diverse-discovery-routing.md\", \"status\": \"added\", \"additions\": 49, \"deletions\": 0, \"changes\": 49, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/docs%2Fdoctoring%2Fprovider-diverse-discovery-routing.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/docs%2Fdoctoring%2Fprovider-diverse-discovery-routing.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fdoctoring%2Fprovider-diverse-discovery-routing.md?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,49 @@\\n+---\\n+title: \\\"Provider-diverse discovery and cost-honest failover routing\\\"\\n+status: \\\"implemented\\\"\\n+date: \\\"2026-08-21\\\"\\n+scope: \\\"PR #770\\\"\\n+---\\n+\\n+# Provider-diverse discovery and cost-honest failover routing\\n+\\n+## Decision\\n+\\n+PR #770 makes model discovery fail closed for invalid catalog rows (a price\\n+that is negative, non-finite, or a nonzero value that underflows to zero),\\n+retains eligible candidates that simply have no reported price as an\\n+explicit unknown-cost fallback, and selects a provider-diverse bootstrap\\n+pool before ordinary chat routing. The selector is deterministic eligibility\\n+and cost accounting; it is not a learned answer-quality judge and does not\\n+claim to reproduce the learning systems in the cited work.\\n+\\n+## Research-to-code mapping\\n+\\n+| Implementation boundary | Evidence-informed reason | Acceptance evidence |\\n+| --- | --- | --- |\\n+| Reject malformed, negative, or non-finite price rows | A cost-aware router must not treat missing or invalid evidence as zero cost. | Discovery and persisted-price tests reject the row before selection. |\\n+| Keep unknown-price candidates only as an explicit fallback | Cost optimization must remain honest when price evidence is incomplete. | Selection tests never rank an unknown price above a valid priced candidate. |\\n+| Prefer distinct providers in the bootstrap pool | A gateway needs an upstream failover set rather than several aliases for one provider. | Provider-diversity tests assert the configured pool spans available providers. |\\n+| Leave quality judgment to evaluation/review policy | Routing signals and answer-quality judgment have different failure modes. | Existing model-judge and fail-closed routing tests remain the quality boundary. |\\n+\\n+The routing papers and OA PDFs are already committed in the prerequisite\\n+stack base under `docs/papers/` (`routellm-routing-2406.18665.pdf`,\\n+`hybrid-llm-query-routing-2404.14618.pdf`, and\\n+`frugalgpt-cost-2305.05176.pdf`). This doctoring record makes their relevance\\n+to the exact discovery selector explicit instead of treating inherited files\\n+as incidental documentation.\\n+\\n+## APA 7 references\\n+\\n+Chen, L., Zaharia, M., & Zou, J. (2023). *FrugalGPT: How to use large\\n+language models while reducing cost and improving performance*. arXiv.\\n+https://arxiv.org/abs/2305.05176\\n+\\n+Ding, D., Mallick, A., Wang, C., Sim, R., Mukherjee, S., Rühle, V.,\\n+Lakshmanan, L. V. S., & Awadallah, A. H. (2024). *Hybrid LLM:\\n+Cost-efficient and quality-aware query routing*. International Conference on\\n+Learning Representations. https://arxiv.org/abs/2404.14618\\n+\\n+Ong, I., Almahairi, A., Wu, V., Chiang, W.-L., Wu, T., Gonzalez, J. E.,\\n+Kadous, M. W., & Stoica, I. (2024). *RouteLLM: Learning to route LLMs with\\n+preference data*. arXiv. https://arxiv.org/abs/2406.18665\" }, { \"sha\": \"98e3789821249149eca5dc11fe9ce7ff6e9b3e5f\", \"filename\": \"docs/planning/adrs/0015-durable-provider-catalog.md\", \"status\": \"added\", \"additions\": 93, \"deletions\": 0, \"changes\": 93, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/docs%2Fplanning%2Fadrs%2F0015-durable-provider-catalog.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/docs%2Fplanning%2Fadrs%2F0015-durable-provider-catalog.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fplanning%2Fadrs%2F0015-durable-provider-catalog.md?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,93 @@\\n+---\\n+id: \\\"0015\\\"\\n+title: \\\"Durable provider catalog and last-known-good composition\\\"\\n+status: accepted\\n+proposed_date: \\\"2026-08-20\\\"\\n+accepted_date: \\\"2026-08-22\\\"\\n+deciders:\\n+ - \\\"repository maintainer\\\"\\n+consulted:\\n+ - \\\"NIST SP 800-53 Rev. 5\\\"\\n+ - \\\"NIST AI 600-1\\\"\\n+informed:\\n+ - \\\"LineageWeave\\\"\\n+ - \\\"fast-mlsirm\\\"\\n+ - \\\"contributors\\\"\\n+affected_components:\\n+ - \\\"contextual_orchestrator/provider_bootstrap.py\\\"\\n+ - \\\"contextual_orchestrator/provider_catalog_bootstrap.py\\\"\\n+ - \\\"contextual_orchestrator/provider_catalog_store.py\\\"\\n+ - \\\".github/workflows/provider-catalog-sync.yml\\\"\\n+supersedes: null\\n+superseded-by: null\\n+related:\\n+ - path: \\\"docs/planning/adrs/0012-gateway-only-provider-contract.md\\\"\\n+ relation: depends-on\\n+ - path: \\\"docs/planning/adrs/0014-gateway-owned-model-selection.md\\\"\\n+ relation: extends\\n+effort: L\\n+---\\n+\\n+# Durable provider catalog and last-known-good composition\\n+\\n+## Context\\n+\\n+Registering the five organization provider secrets in PostgreSQL is necessary\\n+but not sufficient. A production process must also retain discovered provider\\n+accounts and models so a transient catalog outage does not erase the serving\\n+pool, and operators must distinguish live discovery from last-known-good\\n+metadata. GitHub-hosted scheduled jobs have ephemeral filesystems, so SQLite\\n+cannot be the authority for this catalog.\\n+\\n+## Decision\\n+\\n+Use a third-normal-form PostgreSQL catalog colocated with the encrypted\\n+credential registry. The authority contains four two-or-more-word\\n+`snake_case` objects:\\n+\\n+- `provider_account`: provider endpoint and credential name, never the value;\\n+- `provider_model`: account-scoped model identity, known prices, compatibility\\n+ and lifecycle state; endpoint and authentication fields are joined from its\\n+ owning account;\\n+- `model_serving_tag`: generic serving tags as a separate many-to-many relation;\\n+- `catalog_refresh_run`: provider-local success/failure evidence.\\n+\\n+A successful non-empty provider refresh atomically replaces that provider\\n+account's enabled current set. A failed or empty/malformed refresh records only\\n+an allowlisted stable error code and preserves the account's last-known-good\\n+models. Successful discovery of an authoritative non-chat-only catalog may\\n+withdraw earlier chat rows.\\n+\\n+Model names are used only for a conservative negative compatibility filter that\\n+excludes obvious embedding, reranking, speech, image, moderation, safety, and\\n+realtime transports. They are never used to infer reasoning, verification,\\n+coding, vision, or provider-native effort capabilities. Those require explicit\\n+catalog or measured evidence under the gateway-owned policy.\\n+\\n+## Consequences\\n+\\n+- Credentials and model metadata are durable but remain separated.\\n+- NVIDIA primary and secondary keys are independent provider accounts.\\n+- One provider outage does not erase other providers or its own last-known-good set.\\n+- Unknown price remains unknown rather than becoming fabricated zero cost.\\n+- The protected hourly workflow can persist catalog metadata without claiming\\n+ that its ephemeral runner has activated a durable agent-pool database.\\n+- Long-running deployments may separately synchronize selected catalog rows into\\n+ a persistent agent pool.\\n+\\n+## Verification\\n+\\n+The merge gate covers normalized DDL, secret-column absence, provider-account\\n+isolation, parameterized PostgreSQL statements, last-known-good retention,\\n+withdrawal after authoritative success, non-chat filtering, secret-free\\n+evidence, and end-to-end recovery when one provider fails.\\n+\\n+## References\\n+\\n+National Institute of Standards and Technology. (2020). *Security and privacy\\n+controls for information systems and organizations* (NIST Special Publication\\n+800-53 Rev. 5). https://doi.org/10.6028/NIST.SP.800-53r5\\n+\\n+National Institute of Standards and Technology. (2024). *Artificial\\n+intelligence risk management framework: Generative artificial intelligence\\n+profile* (NIST AI 600-1). https://doi.org/10.6028/NIST.AI.600-1\" }, { \"sha\": \"0f9fd25386195533e85fdcc66a4a22718c4a7c04\", \"filename\": \"docs/provider_catalog_database.sql\", \"status\": \"added\", \"additions\": 53, \"deletions\": 0, \"changes\": 53, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/docs%2Fprovider_catalog_database.sql\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/docs%2Fprovider_catalog_database.sql\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fprovider_catalog_database.sql?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,53 @@\\n+CREATE TABLE IF NOT EXISTS provider_account (\\n+ provider_account_id text PRIMARY KEY,\\n+ provider_name text NOT NULL,\\n+ credential_name text NOT NULL,\\n+ list_url text NOT NULL,\\n+ chat_base_url text NOT NULL,\\n+ auth_scheme text NOT NULL,\\n+ discovery_style text NOT NULL,\\n+ task_filter text NOT NULL,\\n+ enabled_flag boolean NOT NULL DEFAULT true,\\n+ created_at timestamptz NOT NULL DEFAULT now(),\\n+ updated_at timestamptz NOT NULL DEFAULT now(),\\n+ UNIQUE (provider_name, credential_name)\\n+);\\n+\\n+CREATE TABLE IF NOT EXISTS provider_model (\\n+ provider_model_id text PRIMARY KEY,\\n+ provider_account_id text NOT NULL\\n+ REFERENCES provider_account(provider_account_id) ON DELETE CASCADE,\\n+ model_name text NOT NULL,\\n+ prompt_price_per_1k numeric(20, 8),\\n+ completion_price_per_1k numeric(20, 8),\\n+ currency_code text NOT NULL,\\n+ serving_eligible_flag boolean NOT NULL DEFAULT false,\\n+ enabled_flag boolean NOT NULL DEFAULT true,\\n+ first_seen_at timestamptz NOT NULL,\\n+ last_seen_at timestamptz NOT NULL,\\n+ UNIQUE (provider_account_id, model_name)\\n+);\\n+\\n+CREATE TABLE IF NOT EXISTS model_serving_tag (\\n+ provider_model_id text NOT NULL\\n+ REFERENCES provider_model(provider_model_id) ON DELETE CASCADE,\\n+ tag_name text NOT NULL,\\n+ PRIMARY KEY (provider_model_id, tag_name)\\n+);\\n+\\n+CREATE TABLE IF NOT EXISTS catalog_refresh_run (\\n+ catalog_refresh_run_id text PRIMARY KEY,\\n+ provider_account_id text NOT NULL\\n+ REFERENCES provider_account(provider_account_id) ON DELETE CASCADE,\\n+ refresh_status text NOT NULL,\\n+ observed_model_count integer NOT NULL DEFAULT 0,\\n+ eligible_model_count integer NOT NULL DEFAULT 0,\\n+ error_code text,\\n+ started_at timestamptz NOT NULL,\\n+ finished_at timestamptz NOT NULL\\n+);\\n+\\n+CREATE INDEX IF NOT EXISTS provider_model_account_idx\\n+ ON provider_model (provider_account_id, enabled_flag, serving_eligible_flag);\\n+CREATE INDEX IF NOT EXISTS catalog_refresh_account_idx\\n+ ON catalog_refresh_run (provider_account_id, finished_at DESC);\" }, { \"sha\": \"d9e72b6ca5738f5f3f4005cd3ca767157f610097\", \"filename\": \"tests/test_chat_capability_unknown_identifiers.py\", \"status\": \"added\", \"additions\": 47, \"deletions\": 0, \"changes\": 47, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_chat_capability_unknown_identifiers.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_chat_capability_unknown_identifiers.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_chat_capability_unknown_identifiers.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,47 @@\\n+\\\"\\\"\\\"Regressions for conservative treatment of unknown model identifiers.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import sys\\n+from pathlib import Path\\n+\\n+import pytest\\n+\\n+sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\n+\\n+from contextual_orchestrator.chat_capability import ( # noqa: E402\\n+ is_chat_compatible_model_id,\\n+ is_general_chat_agent_model_id,\\n+)\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ \\\"model_id\\\",\\n+ [\\n+ \\\"vendor/vanguard-7b\\\",\\n+ \\\"vendor/vanguard-instruct\\\",\\n+ ],\\n+)\\n+def test_unknown_names_that_merely_end_with_guard_remain_eligible(model_id: str) -> None:\\n+ \\\"\\\"\\\"Do not fabricate a policy-classifier capability from an unrelated word suffix.\\\"\\\"\\\"\\n+ assert is_chat_compatible_model_id(model_id)\\n+ assert is_general_chat_agent_model_id(model_id)\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ \\\"model_id\\\",\\n+ [\\n+ \\\"meta-llama/llama-guard-4-12b\\\",\\n+ \\\"nvidia/llama-3.1-nemotron-safety-guard-8b-v3\\\",\\n+ \\\"nvidia/llama-3.1-nemoguard-8b-topic-control\\\",\\n+ \\\"google/shieldgemma-2b-it\\\",\\n+ ],\\n+)\\n+def test_explicit_policy_classifier_markers_remain_role_ineligible(model_id: str) -> None:\\n+ \\\"\\\"\\\"Keep exact guard, safety, and NemoGuard markers out of general synthesis roles.\\\"\\\"\\\"\\n+ assert is_chat_compatible_model_id(model_id)\\n+ assert not is_general_chat_agent_model_id(model_id)\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover\\n+ raise SystemExit(pytest.main([__file__]))\" }, { \"sha\": \"249240e247b7b7aa27bd0e02c237c31fdbef896d\", \"filename\": \"tests/test_chat_model_capability_isolation.py\", \"status\": \"added\", \"additions\": 391, \"deletions\": 0, \"changes\": 391, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_chat_model_capability_isolation.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_chat_model_capability_isolation.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_chat_model_capability_isolation.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,391 @@\\n+\\\"\\\"\\\"Regression coverage for isolating non-chat models from chat agent discovery.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import json\\n+import sys\\n+from pathlib import Path\\n+from unittest.mock import patch\\n+\\n+import pytest\\n+\\n+sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\n+\\n+from contextual_orchestrator import ModelAgent, TaskOrchestrator # noqa: E402\\n+from contextual_orchestrator.chat_capability import ( # noqa: E402\\n+ is_chat_compatible_model_id,\\n+)\\n+from contextual_orchestrator.credentials import ( # noqa: E402\\n+ InMemoryCredentialBackend,\\n+ register_credential,\\n+ set_backend,\\n+)\\n+from contextual_orchestrator.cost_ledger import PriceBook, PriceEntry # noqa: E402\\n+from contextual_orchestrator.kv_config import InMemoryConfigStore # noqa: E402\\n+from contextual_orchestrator.model_discovery import ( # noqa: E402\\n+ DiscoveredModel,\\n+ ProviderModelSource,\\n+ agent_from_discovered,\\n+ discover_provider_models,\\n+ refresh_price_book,\\n+ select_cheapest_discovered_agent,\\n+ select_top_n_cheapest_discovered_agents,\\n+)\\n+from contextual_orchestrator.orchestrator import ModelClient # noqa: E402\\n+\\n+\\n+class _Response:\\n+ \\\"\\\"\\\"Small context-managed HTTP response used by the offline regression.\\\"\\\"\\\"\\n+\\n+ def __init__(self, payload: dict[str, object]) -> None:\\n+ self._body = json.dumps(payload).encode(\\\"utf-8\\\")\\n+\\n+ def __enter__(self) -> \\\"_Response\\\":\\n+ return self\\n+\\n+ def __exit__(self, *_args: object) -> bool:\\n+ return False\\n+\\n+ def read(self, _size: int = -1) -> bytes:\\n+ return self._body\\n+\\n+\\n+@pytest.fixture(autouse=True)\\n+def _fresh_credential_backend():\\n+ \\\"\\\"\\\"Keep the provider credential registry isolated between tests.\\\"\\\"\\\"\\n+ set_backend(InMemoryCredentialBackend())\\n+ try:\\n+ yield\\n+ finally:\\n+ set_backend(None)\\n+\\n+\\n+def _model(model_id: str, *, priced: bool = False) -> DiscoveredModel:\\n+ \\\"\\\"\\\"Build one synthetic discovered model for capability-boundary tests.\\\"\\\"\\\"\\n+ return DiscoveredModel(\\n+ provider_name=\\\"enterprise_gateway\\\",\\n+ model_id=model_id,\\n+ credential_name=\\\"GATEWAY_API_KEY\\\",\\n+ chat_base_url=\\\"https://gateway.example.test/v1\\\",\\n+ auth_scheme=\\\"Bearer\\\",\\n+ prompt_price_per_1k=1.0 if priced else None,\\n+ completion_price_per_1k=1.0 if priced else None,\\n+ )\\n+\\n+\\n+def _agent(\\n+ agent_id: str,\\n+ model_id: str,\\n+ *,\\n+ priority: int = 0,\\n+ tags: tuple[str, ...] = (\\\"writing\\\",),\\n+) -> ModelAgent:\\n+ \\\"\\\"\\\"Build one mock-backed runtime agent for selection-path regressions.\\\"\\\"\\\"\\n+ return ModelAgent(\\n+ id=agent_id,\\n+ model=model_id,\\n+ base_url=\\\"mock://local\\\",\\n+ priority=priority,\\n+ tags=tags,\\n+ )\\n+\\n+\\n+def test_embedding_deployments_never_enter_chat_agent_discovery() -> None:\\n+ \\\"\\\"\\\"Exclude the exact Azure embedding deployment seen in synthesis alerts.\\\"\\\"\\\"\\n+ register_credential(\\\"GATEWAY_API_KEY\\\", \\\"gateway-secret\\\")\\n+ source = ProviderModelSource(\\n+ provider_name=\\\"enterprise_gateway\\\",\\n+ credential_name=\\\"GATEWAY_API_KEY\\\",\\n+ list_url=\\\"https://gateway.example.test/v1/models\\\",\\n+ chat_base_url=\\\"https://gateway.example.test/v1\\\",\\n+ )\\n+ payload = {\\n+ \\\"data\\\": [\\n+ {\\\"id\\\": \\\"azure/text-embedding-3-large\\\"},\\n+ {\\\"id\\\": \\\"text_embedding_3_large\\\"},\\n+ {\\\"id\\\": \\\"BAAI/bge-m3\\\"},\\n+ {\\\"id\\\": \\\"openai/whisper-1\\\"},\\n+ {\\\"id\\\": \\\"gpt-4o-mini-transcribe\\\"},\\n+ {\\\"id\\\": \\\"text-moderation-latest\\\"},\\n+ {\\\"id\\\": \\\"company/reranker-v2\\\"},\\n+ {\\\"id\\\": \\\"nvidia/llama-3.1-nemotron-safety-guard-8b-v3\\\"},\\n+ {\\\"id\\\": \\\"gpt-audio\\\"},\\n+ {\\\"id\\\": \\\"gpt-5.2\\\"},\\n+ {\\\"id\\\": \\\"qwen/qwen3-235b-a22b-instruct\\\"},\\n+ ]\\n+ }\\n+\\n+ with patch(\\n+ \\\"contextual_orchestrator.model_discovery.urllib.request.urlopen\\\",\\n+ return_value=_Response(payload),\\n+ ):\\n+ discovered = discover_provider_models(source)\\n+\\n+ assert [model.model_id for model in discovered] == [\\n+ \\\"gpt-audio\\\",\\n+ \\\"gpt-5.2\\\",\\n+ \\\"qwen/qwen3-235b-a22b-instruct\\\",\\n+ ]\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ (\\\"model_id\\\", \\\"expected\\\"),\\n+ [\\n+ (None, False),\\n+ (\\\"\\\", False),\\n+ (\\\"---\\\", False),\\n+ (\\\"vendor/embeddingv2\\\", False),\\n+ (\\\"vendor/reranking-v2\\\", False),\\n+ (\\\"vendor/transcriber-v2\\\", False),\\n+ (\\\"gpt-5.2\\\", True),\\n+ (\\\"qwen/qwen3-instruct\\\", True),\\n+ ],\\n+)\\n+def test_chat_compatibility_normalizes_identifiers(\\n+ model_id: object, expected: bool\\n+) -> None:\\n+ \\\"\\\"\\\"Normalize provider prefixes and separators without guessing chat features.\\\"\\\"\\\"\\n+ assert is_chat_compatible_model_id(model_id) is expected # type: ignore[arg-type]\\n+\\n+\\n+def test_bytez_chat_catalog_still_rejects_non_chat_identifiers() -> None:\\n+ \\\"\\\"\\\"Apply the same boundary even when a provider accepts a chat task filter.\\\"\\\"\\\"\\n+ register_credential(\\\"BYTEZ_API_KEY\\\", \\\"bytez-secret\\\")\\n+ source = ProviderModelSource(\\n+ provider_name=\\\"bytez\\\",\\n+ credential_name=\\\"BYTEZ_API_KEY\\\",\\n+ list_url=\\\"https://api.bytez.com/models/v2/list/models\\\",\\n+ chat_base_url=\\\"https://api.bytez.com/models/v2/openai/v1\\\",\\n+ auth_scheme=\\\"Key\\\",\\n+ style=\\\"bytez\\\",\\n+ task_filter=\\\"chat\\\",\\n+ )\\n+ payload = {\\n+ \\\"output\\\": [\\n+ {\\\"modelId\\\": \\\"vendor/embeddingv2\\\"},\\n+ {\\\"modelId\\\": \\\"vendor/chat-instruct\\\"},\\n+ ]\\n+ }\\n+\\n+ with patch(\\n+ \\\"contextual_orchestrator.model_discovery.urllib.request.urlopen\\\",\\n+ return_value=_Response(payload),\\n+ ):\\n+ discovered = discover_provider_models(source)\\n+\\n+ assert [model.model_id for model in discovered] == [\\\"vendor/chat-instruct\\\"]\\n+\\n+\\n+def test_non_chat_discovery_cannot_be_converted_to_agent() -> None:\\n+ \\\"\\\"\\\"Keep manually constructed discovery rows from bypassing the parser filter.\\\"\\\"\\\"\\n+ with pytest.raises(ValueError, match=\\\"general chat agent\\\"):\\n+ agent_from_discovered(_model(\\\"azure/text-embedding-3-large\\\"))\\n+\\n+\\n+def test_non_chat_discovery_is_not_priced_or_selected_for_chat() -> None:\\n+ \\\"\\\"\\\"Keep price routing from reintroducing an incompatible endpoint model.\\\"\\\"\\\"\\n+ price_book = PriceBook(InMemoryConfigStore())\\n+ embedding_model = _model(\\\"azure/text-embedding-3-large\\\", priced=True)\\n+ chat_model = _model(\\\"gpt-5.2\\\", priced=True)\\n+ price_book.set_price(PriceEntry(\\\"enterprise_gateway\\\", \\\"gpt-5.2\\\", 1.0, 1.0))\\n+\\n+ assert refresh_price_book([embedding_model, chat_model], price_book) == 1\\n+ assert price_book.get_price(\\n+ \\\"enterprise_gateway\\\", \\\"azure/text-embedding-3-large\\\"\\n+ ) is None\\n+ assert select_cheapest_discovered_agent([embedding_model], price_book) is None\\n+ assert select_top_n_cheapest_discovered_agents(\\n+ [embedding_model], price_book, 1\\n+ ) == []\\n+\\n+\\n+def test_stale_embedding_agent_cannot_win_synthesizer_selection() -> None:\\n+ \\\"\\\"\\\"Exclude an already-persisted embedding row even when it has high priority.\\\"\\\"\\\"\\n+ embedding_agent = _agent(\\n+ \\\"embedding_agent\\\",\\n+ \\\"azure/text-embedding-3-large\\\",\\n+ priority=10_000,\\n+ )\\n+ chat_agent = _agent(\\\"chat_agent\\\", \\\"gpt-5.2\\\")\\n+ orchestrator = TaskOrchestrator([embedding_agent, chat_agent])\\n+\\n+ assert orchestrator._select_agent(\\\"Produce the final answer.\\\", \\\"synthesizer\\\") is chat_agent\\n+\\n+\\n+def test_all_non_chat_agents_fail_before_synthesis() -> None:\\n+ \\\"\\\"\\\"Fail closed when a stale pool contains no chat-compatible worker.\\\"\\\"\\\"\\n+ orchestrator = TaskOrchestrator(\\n+ [_agent(\\\"embedding_agent\\\", \\\"azure/text-embedding-3-large\\\")]\\n+ )\\n+\\n+ with pytest.raises(RuntimeError, match=\\\"chat-compatible\\\"):\\n+ orchestrator._select_agent(\\\"Produce the final answer.\\\", \\\"synthesizer\\\")\\n+\\n+\\n+def test_generated_plan_reselects_non_chat_agent_assignment() -> None:\\n+ \\\"\\\"\\\"Do not trust a generated plan that names a stale embedding agent directly.\\\"\\\"\\\"\\n+ embedding_agent = _agent(\\n+ \\\"embedding_agent\\\",\\n+ \\\"azure/text-embedding-3-large\\\",\\n+ priority=10_000,\\n+ )\\n+ chat_agent = _agent(\\\"chat_agent\\\", \\\"gpt-5.2\\\")\\n+ orchestrator = TaskOrchestrator([embedding_agent, chat_agent])\\n+ raw_plan = json.dumps(\\n+ {\\n+ \\\"steps\\\": [\\n+ {\\n+ \\\"id\\\": 0,\\n+ \\\"role\\\": \\\"worker\\\",\\n+ \\\"agent_id\\\": \\\"chat_agent\\\",\\n+ \\\"subtask\\\": \\\"Execute the task.\\\",\\n+ \\\"access\\\": [],\\n+ },\\n+ {\\n+ \\\"id\\\": 1,\\n+ \\\"role\\\": \\\"synthesizer\\\",\\n+ \\\"agent_id\\\": \\\"embedding_agent\\\",\\n+ \\\"subtask\\\": \\\"Produce the final answer.\\\",\\n+ \\\"access\\\": [0],\\n+ },\\n+ ]\\n+ }\\n+ )\\n+\\n+ steps = orchestrator._parse_workflow_plan(raw_plan)\\n+\\n+ assert steps[-1].agent_id == \\\"chat_agent\\\"\\n+\\n+\\n+def test_failover_candidates_exclude_stale_embedding_agents() -> None:\\n+ \\\"\\\"\\\"Keep cross-agent retry from falling through to an incompatible endpoint.\\\"\\\"\\\"\\n+ chat_agent = _agent(\\\"chat_agent\\\", \\\"gpt-5.2\\\")\\n+ embedding_agent = _agent(\\n+ \\\"embedding_agent\\\",\\n+ \\\"azure/text-embedding-3-large\\\",\\n+ priority=10_000,\\n+ )\\n+ orchestrator = TaskOrchestrator([chat_agent, embedding_agent])\\n+\\n+ candidates = orchestrator._failover_candidates(\\n+ chat_agent,\\n+ \\\"Produce the final answer.\\\",\\n+ \\\"synthesizer\\\",\\n+ )\\n+\\n+ assert candidates == [chat_agent]\\n+\\n+\\n+def test_invoke_fails_clearly_when_no_general_chat_agent_remains() -> None:\\n+ \\\"\\\"\\\"Report the role boundary instead of claiming that zero candidates failed.\\\"\\\"\\\"\\n+ embedding_agent = _agent(\\\"embedding_agent\\\", \\\"azure/text-embedding-3-large\\\")\\n+ orchestrator = TaskOrchestrator([embedding_agent])\\n+\\n+ with pytest.raises(RuntimeError, match=\\\"no chat-compatible agent available\\\"):\\n+ orchestrator._invoke(\\n+ embedding_agent,\\n+ [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Produce the final answer.\\\"}],\\n+ text=\\\"Produce the final answer.\\\",\\n+ role=\\\"worker\\\",\\n+ )\\n+\\n+\\n+def test_model_client_rejects_non_chat_model_before_mock_or_network_call() -> None:\\n+ \\\"\\\"\\\"Keep the provider boundary fail-closed even when selection is bypassed.\\\"\\\"\\\"\\n+ client = ModelClient()\\n+ embedding_agent = _agent(\\\"embedding_agent\\\", \\\"azure/text-embedding-3-large\\\")\\n+\\n+ with pytest.raises(ValueError, match=\\\"chat-compatible\\\"):\\n+ client.chat(\\n+ embedding_agent,\\n+ [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Produce the final answer.\\\"}],\\n+ )\\n+\\n+\\n+def test_non_chat_primary_fails_over_only_to_chat_agents() -> None:\\n+ \\\"\\\"\\\"Drop an incompatible primary while retaining a compatible fallback.\\\"\\\"\\\"\\n+ embedding_agent = _agent(\\\"embedding_agent\\\", \\\"azure/text-embedding-3-large\\\")\\n+ chat_agent = _agent(\\\"chat_agent\\\", \\\"gpt-5.2\\\")\\n+ orchestrator = TaskOrchestrator([embedding_agent, chat_agent])\\n+\\n+ candidates = orchestrator._failover_candidates(\\n+ embedding_agent,\\n+ \\\"Produce the final answer.\\\",\\n+ \\\"synthesizer\\\",\\n+ )\\n+\\n+ assert candidates == [chat_agent]\\n+\\n+\\n+def test_streaming_client_rejects_non_chat_model_before_transport() -> None:\\n+ \\\"\\\"\\\"Apply the same endpoint boundary to streaming chat requests.\\\"\\\"\\\"\\n+ client = ModelClient()\\n+ embedding_agent = _agent(\\\"embedding_agent\\\", \\\"azure/text-embedding-3-large\\\")\\n+\\n+ with pytest.raises(ValueError, match=\\\"chat-compatible\\\"):\\n+ next(\\n+ client.stream_chat(\\n+ embedding_agent,\\n+ [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Produce the final answer.\\\"}],\\n+ )\\n+ )\\n+\\n+\\n+def test_probe_reports_non_chat_model_without_provider_transport(monkeypatch) -> None:\\n+ \\\"\\\"\\\"Readiness must fail closed with a stable code before network access.\\\"\\\"\\\"\\n+ client = ModelClient()\\n+ embedding_agent = _agent(\\\"embedding_agent\\\", \\\"azure/text-embedding-3-large\\\")\\n+ monkeypatch.setattr(\\n+ client,\\n+ \\\"_validate_provider\\\",\\n+ lambda _agent: (_ for _ in ()).throw(AssertionError(\\\"transport reached\\\")),\\n+ )\\n+\\n+ assert client.probe(embedding_agent)[\\\"failure_code\\\"] == \\\"non_chat_model\\\"\\n+\\n+\\n+def test_generated_planner_inventory_excludes_non_chat_agents() -> None:\\n+ \\\"\\\"\\\"Do not advertise stale endpoint-incompatible agents to the planner.\\\"\\\"\\\"\\n+ embedding_agent = _agent(\\\"embedding_agent\\\", \\\"azure/text-embedding-3-large\\\")\\n+ chat_agent = _agent(\\\"chat_agent\\\", \\\"gpt-5.2\\\", tags=(\\\"reasoning\\\", \\\"writing\\\"))\\n+\\n+ class PlannerClient:\\n+ def __init__(self) -> None:\\n+ self.system_prompt = \\\"\\\"\\n+\\n+ def chat(self, _agent, messages, **_kwargs):\\n+ self.system_prompt = messages[0][\\\"content\\\"]\\n+ return json.dumps(\\n+ {\\n+ \\\"steps\\\": [\\n+ {\\n+ \\\"id\\\": 0,\\n+ \\\"role\\\": \\\"worker\\\",\\n+ \\\"agent_id\\\": \\\"chat_agent\\\",\\n+ \\\"subtask\\\": \\\"Execute the task.\\\",\\n+ \\\"access\\\": [],\\n+ },\\n+ {\\n+ \\\"id\\\": 1,\\n+ \\\"role\\\": \\\"synthesizer\\\",\\n+ \\\"agent_id\\\": \\\"chat_agent\\\",\\n+ \\\"subtask\\\": \\\"Produce the answer.\\\",\\n+ \\\"access\\\": [0],\\n+ },\\n+ ]\\n+ }\\n+ )\\n+\\n+ client = PlannerClient()\\n+ orchestrator = TaskOrchestrator([embedding_agent, chat_agent], client=client)\\n+\\n+ steps = orchestrator._plan_generated(\\\"Produce the final answer.\\\")\\n+\\n+ assert steps[-1].agent_id == \\\"chat_agent\\\"\\n+ assert \\\"embedding_agent\\\" not in client.system_prompt\\n+ assert \\\"azure/text-embedding-3-large\\\" not in client.system_prompt\\n+ assert \\\"chat_agent\\\" in client.system_prompt\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover\\n+ raise SystemExit(pytest.main([__file__]))\" }, { \"sha\": \"927c213243303d7343bc0b9feb2d0ab58f3ea9c5\", \"filename\": \"tests/test_chat_passthrough_capability_isolation.py\", \"status\": \"added\", \"additions\": 127, \"deletions\": 0, \"changes\": 127, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_chat_passthrough_capability_isolation.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_chat_passthrough_capability_isolation.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_chat_passthrough_capability_isolation.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,127 @@\\n+\\\"\\\"\\\"Regression tests for chat-capability checks on passthrough and batch paths.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import sys\\n+from pathlib import Path\\n+\\n+import pytest\\n+\\n+sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\n+\\n+from contextual_orchestrator import ModelAgent, TaskOrchestrator # noqa: E402\\n+from contextual_orchestrator.orchestrator import ModelClient # noqa: E402\\n+\\n+\\n+def _embedding_agent() -> ModelAgent:\\n+ \\\"\\\"\\\"Build the stale embedding agent from the production incident.\\\"\\\"\\\"\\n+ return ModelAgent(\\n+ \\\"embedding_agent\\\",\\n+ \\\"azure/text-embedding-3-large\\\",\\n+ base_url=\\\"mock://local\\\",\\n+ )\\n+\\n+\\n+def _chat_agent() -> ModelAgent:\\n+ \\\"\\\"\\\"Build one compatible fallback for explicit-model passthrough tests.\\\"\\\"\\\"\\n+ return ModelAgent(\\n+ \\\"general_chat_agent\\\",\\n+ \\\"gpt-5.2\\\",\\n+ base_url=\\\"mock://local\\\",\\n+ tags=(\\\"writing\\\",),\\n+ )\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ \\\"endpoint\\\",\\n+ [\\n+ \\\"chat/completions\\\",\\n+ \\\"/v1/chat/completions\\\",\\n+ \\\"completions\\\",\\n+ \\\"/v1/completions\\\",\\n+ \\\"responses\\\",\\n+ \\\"/v1/responses\\\",\\n+ ],\\n+)\\n+def test_proxy_send_rejects_embedding_before_mock_or_network_transport(endpoint: str) -> None:\\n+ \\\"\\\"\\\"Keep raw OpenAI passthrough from bypassing the chat transport invariant.\\\"\\\"\\\"\\n+ client = ModelClient()\\n+\\n+ with pytest.raises(ValueError, match=\\\"chat-compatible\\\"):\\n+ client.proxy_send(\\n+ _embedding_agent(),\\n+ endpoint,\\n+ {\\n+ \\\"model\\\": \\\"azure/text-embedding-3-large\\\",\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Return JSON.\\\"}],\\n+ \\\"input\\\": \\\"Return JSON.\\\",\\n+ },\\n+ )\\n+\\n+\\n+def test_explicit_embedding_model_cannot_bypass_through_structured_passthrough() -> None:\\n+ \\\"\\\"\\\"Reject an explicitly requested stale embedding agent before raw proxy transport.\\\"\\\"\\\"\\n+ orchestrator = TaskOrchestrator([_embedding_agent(), _chat_agent()])\\n+\\n+ with pytest.raises(ValueError, match=\\\"chat-compatible\\\"):\\n+ orchestrator.proxy_completion(\\n+ {\\n+ \\\"model\\\": \\\"azure/text-embedding-3-large\\\",\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Return JSON.\\\"}],\\n+ \\\"response_format\\\": {\\\"type\\\": \\\"json_object\\\"},\\n+ }\\n+ )\\n+\\n+\\n+def test_explicit_embedding_model_cannot_bypass_through_responses_passthrough() -> None:\\n+ \\\"\\\"\\\"Apply the same transport contract to the Responses passthrough path.\\\"\\\"\\\"\\n+ orchestrator = TaskOrchestrator([_embedding_agent(), _chat_agent()])\\n+\\n+ with pytest.raises(ValueError, match=\\\"chat-compatible\\\"):\\n+ orchestrator.proxy_completion(\\n+ {\\n+ \\\"model\\\": \\\"azure/text-embedding-3-large\\\",\\n+ \\\"input\\\": \\\"Return JSON.\\\",\\n+ },\\n+ endpoint=\\\"responses\\\",\\n+ )\\n+\\n+\\n+def test_batch_chat_rejects_embedding_before_mock_or_network_transport() -> None:\\n+ \\\"\\\"\\\"Prevent direct batch callers from submitting embedding models as chat jobs.\\\"\\\"\\\"\\n+ client = ModelClient()\\n+\\n+ with pytest.raises(ValueError, match=\\\"chat-compatible\\\"):\\n+ client.batch_chat(\\n+ _embedding_agent(),\\n+ {\\\"task_0\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Return JSON.\\\"}]},\\n+ )\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ \\\"model_id\\\",\\n+ [\\n+ \\\"gpt-audio\\\",\\n+ \\\"nvidia/llama-3.1-nemotron-safety-guard-8b-v3\\\",\\n+ ],\\n+)\\n+def test_chat_served_specialized_models_remain_valid_passthrough_transports(model_id: str) -> None:\\n+ \\\"\\\"\\\"Do not turn ordinary-role exclusion into a false transport rejection.\\\"\\\"\\\"\\n+ client = ModelClient()\\n+ agent = ModelAgent(\\\"specialized_chat_agent\\\", model_id, base_url=\\\"mock://local\\\")\\n+\\n+ response = client.proxy_send(\\n+ agent,\\n+ \\\"chat/completions\\\",\\n+ {\\n+ \\\"model\\\": model_id,\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Classify this.\\\"}],\\n+ },\\n+ )\\n+\\n+ assert response[\\\"object\\\"] == \\\"chat.completion\\\"\\n+ assert response[\\\"model\\\"] == model_id\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover\\n+ raise SystemExit(pytest.main([__file__]))\" }, { \"sha\": \"17f5b7277e09d9d5e07e8380f7adadfea4477e8e\", \"filename\": \"tests/test_chat_transport_role_separation.py\", \"status\": \"added\", \"additions\": 84, \"deletions\": 0, \"changes\": 84, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_chat_transport_role_separation.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_chat_transport_role_separation.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_chat_transport_role_separation.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,84 @@\\n+\\\"\\\"\\\"Regression coverage for chat transport versus ordinary agent-role eligibility.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import sys\\n+from pathlib import Path\\n+\\n+import pytest\\n+\\n+sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\n+\\n+from contextual_orchestrator.chat_capability import ( # noqa: E402\\n+ is_chat_compatible_model_id,\\n+ is_general_chat_agent_model_id,\\n+)\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ \\\"model_id\\\",\\n+ [\\n+ \\\"gpt-audio\\\",\\n+ \\\"gpt-audio-mini\\\",\\n+ \\\"nvidia/llama-3.1-nemotron-safety-guard-8b-v3\\\",\\n+ \\\"nvidia/llama-3.1-nemoguard-8b-content-safety\\\",\\n+ \\\"nvidia/llama-3.1-nemoguard-8b-topic-control\\\",\\n+ ],\\n+)\\n+def test_chat_served_models_remain_transport_compatible(model_id: str) -> None:\\n+ \\\"\\\"\\\"Do not pre-reject models that provider contracts serve through chat completions.\\\"\\\"\\\"\\n+ assert is_chat_compatible_model_id(model_id)\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ \\\"model_id\\\",\\n+ [\\n+ \\\"nvidia/llama-3.1-nemotron-safety-guard-8b-v3\\\",\\n+ \\\"nvidia/llama-3.1-nemoguard-8b-content-safety\\\",\\n+ \\\"nvidia/llama-3.1-nemoguard-8b-topic-control\\\",\\n+ ],\\n+)\\n+def test_policy_classifiers_do_not_enter_general_agent_roles(model_id: str) -> None:\\n+ \\\"\\\"\\\"Keep chat-served policy classifiers out of ordinary synthesis roles.\\\"\\\"\\\"\\n+ assert not is_general_chat_agent_model_id(model_id)\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ \\\"model_id\\\",\\n+ [\\n+ \\\"gpt-audio\\\",\\n+ \\\"gpt-audio-mini\\\",\\n+ \\\"gpt-5.2\\\",\\n+ \\\"qwen/qwen3-235b-a22b-instruct\\\",\\n+ ],\\n+)\\n+def test_general_generation_models_remain_agent_eligible(model_id: str) -> None:\\n+ \\\"\\\"\\\"Preserve chat generation models for ordinary agent selection.\\\"\\\"\\\"\\n+ assert is_general_chat_agent_model_id(model_id)\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ \\\"model_id\\\",\\n+ [\\n+ \\\"azure/text-embedding-3-large\\\",\\n+ \\\"text_embedding_3_large\\\",\\n+ \\\"company/reranker-v2\\\",\\n+ \\\"gpt-4o-mini-transcribe\\\",\\n+ \\\"omni-moderation-latest\\\",\\n+ \\\"gpt-image-1\\\",\\n+ \\\"dall-e-3\\\",\\n+ \\\"openai/clip-vit-large-patch14\\\",\\n+ \\\"google/siglip-so400m-patch14-384\\\",\\n+ \\\"sora-2\\\",\\n+ \\\"gpt-realtime\\\",\\n+ \\\"tts-1\\\",\\n+ ],\\n+)\\n+def test_endpoint_only_models_fail_both_boundaries(model_id: str) -> None:\\n+ \\\"\\\"\\\"Reject endpoint-only model families before transport or ordinary role routing.\\\"\\\"\\\"\\n+ assert not is_chat_compatible_model_id(model_id)\\n+ assert not is_general_chat_agent_model_id(model_id)\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover\\n+ raise SystemExit(pytest.main([__file__]))\" }, { \"sha\": \"6d378336f1109b6c262b678b28b0e88abe84fd2e\", \"filename\": \"tests/test_cost_ledger.py\", \"status\": \"modified\", \"additions\": 50, \"deletions\": 0, \"changes\": 50, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_cost_ledger.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_cost_ledger.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_cost_ledger.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -98,6 +98,56 @@ def test_provider_wildcard_price_entry() -> None:\\n assert record.cost_amount == 2.0\\n \\n \\n+def test_corrupt_specific_row_still_falls_back_to_wildcard_price() -> None:\\n+ \\\"\\\"\\\"A malformed provider:model row must not shadow a valid provider:* row.\\\"\\\"\\\"\\n+ config = InMemoryConfigStore()\\n+ price_book = PriceBook(config)\\n+ price_book.set_price(PriceEntry(\\\"openai\\\", \\\"*\\\", prompt_price_per_1k=1.0, completion_price_per_1k=1.0))\\n+ config.set(\\\"llm_price_entries\\\", \\\"openai:broken-model\\\", {\\\"prompt_price_per_1k\\\": \\\"not-a-number\\\"})\\n+\\n+ entry = price_book.get_price(\\\"openai\\\", \\\"broken-model\\\")\\n+\\n+ assert entry is not None\\n+ assert entry.prompt_price_per_1k == 1.0\\n+ assert entry.completion_price_per_1k == 1.0\\n+\\n+\\n+def test_underflowing_positive_price_row_falls_back_to_wildcard() -> None:\\n+ \\\"\\\"\\\"A nonzero KV price that underflows to 0.0 must not be treated as free.\\\"\\\"\\\"\\n+ config = InMemoryConfigStore()\\n+ price_book = PriceBook(config)\\n+ price_book.set_price(PriceEntry(\\\"openai\\\", \\\"*\\\", prompt_price_per_1k=1.0, completion_price_per_1k=1.0))\\n+ config.set(\\n+ \\\"llm_price_entries\\\",\\n+ \\\"openai:underflow-model\\\",\\n+ {\\\"prompt_price_per_1k\\\": \\\"1e-10000\\\", \\\"completion_price_per_1k\\\": \\\"1e-10000\\\"},\\n+ )\\n+\\n+ entry = price_book.get_price(\\\"openai\\\", \\\"underflow-model\\\")\\n+\\n+ assert entry is not None\\n+ assert entry.prompt_price_per_1k == 1.0\\n+ assert entry.completion_price_per_1k == 1.0\\n+\\n+\\n+def test_overflowing_price_row_falls_back_to_wildcard() -> None:\\n+ \\\"\\\"\\\"A Decimal-finite KV price whose float() conversion overflows to inf must not be treated as valid.\\\"\\\"\\\"\\n+ config = InMemoryConfigStore()\\n+ price_book = PriceBook(config)\\n+ price_book.set_price(PriceEntry(\\\"openai\\\", \\\"*\\\", prompt_price_per_1k=1.0, completion_price_per_1k=1.0))\\n+ config.set(\\n+ \\\"llm_price_entries\\\",\\n+ \\\"openai:overflow-model\\\",\\n+ {\\\"prompt_price_per_1k\\\": \\\"1e10000\\\", \\\"completion_price_per_1k\\\": \\\"1e10000\\\"},\\n+ )\\n+\\n+ entry = price_book.get_price(\\\"openai\\\", \\\"overflow-model\\\")\\n+\\n+ assert entry is not None\\n+ assert entry.prompt_price_per_1k == 1.0\\n+ assert entry.completion_price_per_1k == 1.0\\n+\\n+\\n def test_writes_carry_full_attribution() -> None:\\n ledger = _priced_ledger()\\n record = ledger.record_usage(\" }, { \"sha\": \"444557f755a4983db4ce6ce1be67724737efddf8\", \"filename\": \"tests/test_discover_models_cli.py\", \"status\": \"modified\", \"additions\": 46, \"deletions\": 0, \"changes\": 46, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_discover_models_cli.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_discover_models_cli.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_discover_models_cli.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -164,3 +164,49 @@ def urlopen(request, timeout=None):\\n by_id = {agent.id: agent for agent in reloaded.candidates}\\n assert by_id[\\\"openrouter_cheap_model\\\"].disabled is False\\n assert by_id[\\\"openai_pricey_model\\\"].disabled is True\\n+\\n+\\n+def test_enable_cheapest_bootstraps_independent_provider_families(tmp_path) -> None:\\n+ \\\"\\\"\\\"CLI bootstrap must use the provider-diverse selector, not only the cheapest vendor.\\\"\\\"\\\"\\n+ from contextual_orchestrator import TaskOrchestrator\\n+ from contextual_orchestrator.orchestrator import ModelAgent\\n+\\n+ set_backend(InMemoryCredentialBackend())\\n+ register_credential(\\\"OPENAI_API_KEY\\\", \\\"sk-openai\\\")\\n+ register_credential(\\\"OPENROUTER_API_KEY\\\", \\\"sk-router\\\")\\n+ register_credential(\\\"NVIDIA_NIM_API_KEY\\\", \\\"nv-primary\\\")\\n+ db_path = str(tmp_path / \\\"pool.db\\\")\\n+ stdout = StringIO()\\n+\\n+ def urlopen(request, timeout=None):\\n+ host = urllib.parse.urlsplit(request.full_url).hostname\\n+ payloads = {\\n+ \\\"api.openai.com\\\": {\\\"data\\\": [{\\\"id\\\": \\\"openai-model\\\", \\\"pricing\\\": {\\\"prompt\\\": \\\"0.001\\\", \\\"completion\\\": \\\"0.001\\\"}}]},\\n+ \\\"openrouter.ai\\\": {\\\"data\\\": [{\\\"id\\\": \\\"router-model\\\", \\\"pricing\\\": {\\\"prompt\\\": \\\"0.000001\\\", \\\"completion\\\": \\\"0.000001\\\"}}]},\\n+ \\\"integrate.api.nvidia.com\\\": {\\\"data\\\": [{\\\"id\\\": \\\"nim-model\\\", \\\"pricing\\\": {\\\"prompt\\\": \\\"0.000002\\\", \\\"completion\\\": \\\"0.000002\\\"}}]},\\n+ }\\n+ return _Response(payloads.get(host, {\\\"data\\\": []}))\\n+\\n+ try:\\n+ with (\\n+ patch.object(\\n+ sys,\\n+ \\\"argv\\\",\\n+ [\\\"contextual-orchestrator\\\", \\\"discover-models\\\", \\\"--agents-db\\\", db_path, \\\"--enable-cheapest\\\", \\\"3\\\"],\\n+ ),\\n+ patch.object(sys, \\\"stdout\\\", stdout),\\n+ patch(\\\"contextual_orchestrator.model_discovery.urllib.request.urlopen\\\", side_effect=urlopen),\\n+ ):\\n+ main()\\n+ finally:\\n+ set_backend(None)\\n+\\n+ report = json.loads(stdout.getvalue())\\n+ assert report[\\\"enabled_agent_ids\\\"] == [\\n+ \\\"openrouter_router_model\\\",\\n+ \\\"nvidia_nim_nim_model\\\",\\n+ \\\"openai_openai_model\\\",\\n+ ]\\n+ reloaded = TaskOrchestrator([ModelAgent(\\\"seed_agent\\\", \\\"seed-model\\\")], agents_db=db_path)\\n+ enabled = {agent.id for agent in reloaded.candidates if not agent.disabled}\\n+ assert enabled - {\\\"seed_agent\\\"} == set(report[\\\"enabled_agent_ids\\\"])\" }, { \"sha\": \"45ca53917fadb330596eb16b217cfe54469db111\", \"filename\": \"tests/test_discovery_bootstrap_selection.py\", \"status\": \"added\", \"additions\": 364, \"deletions\": 0, \"changes\": 364, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_discovery_bootstrap_selection.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_discovery_bootstrap_selection.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_discovery_bootstrap_selection.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,364 @@\\n+\\\"\\\"\\\"Regression coverage for honest, provider-diverse discovery bootstrap.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import pytest\\n+\\n+from contextual_orchestrator.cost_ledger import PriceBook, PriceEntry\\n+from contextual_orchestrator.kv_config import InMemoryConfigStore\\n+from contextual_orchestrator import model_discovery\\n+from contextual_orchestrator.model_discovery import (\\n+ DiscoveredModel,\\n+ refresh_price_book,\\n+ select_cheapest_discovered_agent,\\n+ select_top_n_cheapest_discovered_agents,\\n+)\\n+\\n+\\n+def _model(provider_name: str, model_id: str) -> DiscoveredModel:\\n+ \\\"\\\"\\\"Build one deterministic OpenAI-compatible discovery fixture.\\\"\\\"\\\"\\n+ credential_name = f\\\"{provider_name.upper()}_API_KEY\\\"\\n+ return DiscoveredModel(\\n+ provider_name=provider_name,\\n+ model_id=model_id,\\n+ credential_name=credential_name,\\n+ chat_base_url=f\\\"https://{provider_name}.example/v1\\\",\\n+ auth_scheme=\\\"Bearer\\\",\\n+ )\\n+\\n+\\n+def _priced_model(\\n+ provider_name: str,\\n+ model_id: str,\\n+ *,\\n+ prompt_price_per_1k: float | None,\\n+ completion_price_per_1k: float | None,\\n+ currency_code: str = \\\"USD\\\",\\n+) -> DiscoveredModel:\\n+ \\\"\\\"\\\"Build one discovery row carrying provider-reported price evidence.\\\"\\\"\\\"\\n+ base = _model(provider_name, model_id)\\n+ return DiscoveredModel(\\n+ provider_name=base.provider_name,\\n+ model_id=base.model_id,\\n+ credential_name=base.credential_name,\\n+ chat_base_url=base.chat_base_url,\\n+ auth_scheme=base.auth_scheme,\\n+ prompt_price_per_1k=prompt_price_per_1k,\\n+ completion_price_per_1k=completion_price_per_1k,\\n+ currency_code=currency_code,\\n+ )\\n+\\n+\\n+def _set_price(\\n+ price_book: PriceBook,\\n+ model: DiscoveredModel,\\n+ price_per_1k: float,\\n+ *,\\n+ currency_code: str = \\\"USD\\\",\\n+) -> None:\\n+ \\\"\\\"\\\"Record one known symmetric prompt/completion price.\\\"\\\"\\\"\\n+ price_book.set_price(\\n+ PriceEntry(\\n+ model.provider_name,\\n+ model.model_id,\\n+ price_per_1k,\\n+ price_per_1k,\\n+ currency_code,\\n+ )\\n+ )\\n+\\n+\\n+def test_unpriced_discovered_model_is_unknown_not_free() -> None:\\n+ \\\"\\\"\\\"Missing price evidence must not outrank a model with a known price.\\\"\\\"\\\"\\n+ price_book = PriceBook(InMemoryConfigStore())\\n+ priced = _model(\\\"openrouter\\\", \\\"priced-model\\\")\\n+ unpriced = _model(\\\"bytez\\\", \\\"unpriced-model\\\")\\n+ _set_price(price_book, priced, 0.01)\\n+\\n+ assert select_cheapest_discovered_agent([unpriced, priced], price_book) is priced\\n+ assert select_top_n_cheapest_discovered_agents(\\n+ [unpriced, priced], price_book, 2\\n+ ) == [priced, unpriced]\\n+\\n+\\n+def test_partial_provider_price_is_unknown_instead_of_fabricating_a_free_component() -> None:\\n+ \\\"\\\"\\\"A missing prompt or completion price cannot become an invented zero.\\\"\\\"\\\"\\n+ price_book = PriceBook(InMemoryConfigStore())\\n+ partial = _priced_model(\\n+ \\\"partial_vendor\\\",\\n+ \\\"partial-model\\\",\\n+ prompt_price_per_1k=0.001,\\n+ completion_price_per_1k=None,\\n+ )\\n+ complete = _priced_model(\\n+ \\\"openrouter\\\",\\n+ \\\"complete-model\\\",\\n+ prompt_price_per_1k=1.0,\\n+ completion_price_per_1k=1.0,\\n+ )\\n+\\n+ assert refresh_price_book([partial, complete], price_book) == 1\\n+ assert price_book.get_price(partial.provider_name, partial.model_id) is None\\n+ assert select_cheapest_discovered_agent([partial, complete], price_book) is complete\\n+\\n+\\n+def test_persisted_price_row_missing_one_component_remains_unknown() -> None:\\n+ \\\"\\\"\\\"KV corruption must not silently manufacture a zero-priced component.\\\"\\\"\\\"\\n+ store = InMemoryConfigStore()\\n+ store.set(\\n+ \\\"llm_price_entries\\\",\\n+ \\\"partial_vendor:partial-model\\\",\\n+ {\\n+ \\\"provider_name\\\": \\\"partial_vendor\\\",\\n+ \\\"model_name\\\": \\\"partial-model\\\",\\n+ \\\"prompt_price_per_1k\\\": 0.001,\\n+ \\\"currency_code\\\": \\\"USD\\\",\\n+ },\\n+ )\\n+ price_book = PriceBook(store)\\n+\\n+ assert price_book.get_price(\\\"partial_vendor\\\", \\\"partial-model\\\") is None\\n+\\n+\\n+def test_invalid_catalog_prices_are_unknown_not_trusted_cost_evidence() -> None:\\n+ \\\"\\\"\\\"Reject negative, non-finite, and boolean provider price values.\\\"\\\"\\\"\\n+ assert model_discovery._price_per_1k(\\\"-0.000001\\\") is None\\n+ assert model_discovery._price_per_1k(\\\"nan\\\") is None\\n+ assert model_discovery._price_per_1k(\\\"inf\\\") is None\\n+ assert model_discovery._price_per_1k(True) is None\\n+ assert model_discovery._price_per_1k(\\\"0\\\") == 0.0\\n+\\n+\\n+def test_huge_price_values_remain_unknown_without_crashing_discovery_or_ranking() -> None:\\n+ \\\"\\\"\\\"Unbounded JSON or KV integers must not terminate bootstrap selection.\\\"\\\"\\\"\\n+ huge_price = 10**10000\\n+ assert model_discovery._price_per_1k(huge_price) is None\\n+\\n+ price_book = PriceBook(InMemoryConfigStore())\\n+ huge = _model(\\\"huge_vendor\\\", \\\"huge-model\\\")\\n+ valid = _model(\\\"openrouter\\\", \\\"valid-model\\\")\\n+ _set_price(price_book, huge, huge_price)\\n+ _set_price(price_book, valid, 1.0)\\n+\\n+ assert select_cheapest_discovered_agent([huge, valid], price_book) is valid\\n+\\n+\\n+def test_malformed_price_book_row_is_unknown_instead_of_crashing_selection() -> None:\\n+ \\\"\\\"\\\"A corrupt persisted price row must not take down the serving bootstrap.\\\"\\\"\\\"\\n+ store = InMemoryConfigStore()\\n+ store.set(\\n+ \\\"llm_price_entries\\\",\\n+ \\\"broken_vendor:broken-model\\\",\\n+ {\\n+ \\\"provider_name\\\": \\\"broken_vendor\\\",\\n+ \\\"model_name\\\": \\\"broken-model\\\",\\n+ \\\"prompt_price_per_1k\\\": \\\"not-a-number\\\",\\n+ \\\"completion_price_per_1k\\\": 0.001,\\n+ \\\"currency_code\\\": \\\"USD\\\",\\n+ },\\n+ )\\n+ price_book = PriceBook(store)\\n+ broken = _model(\\\"broken_vendor\\\", \\\"broken-model\\\")\\n+ valid = _model(\\\"openrouter\\\", \\\"valid-model\\\")\\n+ _set_price(price_book, valid, 1.0)\\n+\\n+ assert select_cheapest_discovered_agent([broken, valid], price_book) is valid\\n+\\n+\\n+def test_refresh_counts_only_complete_prices_in_the_comparison_currency() -> None:\\n+ \\\"\\\"\\\"Cross-currency evidence is unknown until an explicit conversion exists.\\\"\\\"\\\"\\n+ price_book = PriceBook(InMemoryConfigStore(), default_currency=\\\"USD\\\")\\n+ usd = _priced_model(\\n+ \\\"openrouter\\\",\\n+ \\\"usd-model\\\",\\n+ prompt_price_per_1k=1.0,\\n+ completion_price_per_1k=1.0,\\n+ currency_code=\\\"USD\\\",\\n+ )\\n+ eur = _priced_model(\\n+ \\\"eur_vendor\\\",\\n+ \\\"eur-model\\\",\\n+ prompt_price_per_1k=0.001,\\n+ completion_price_per_1k=0.001,\\n+ currency_code=\\\"EUR\\\",\\n+ )\\n+\\n+ assert refresh_price_book([eur, usd], price_book) == 1\\n+ assert price_book.get_price(\\\"eur_vendor\\\", \\\"eur-model\\\") is None\\n+ assert price_book.get_price(\\\"openrouter\\\", \\\"usd-model\\\") is not None\\n+\\n+\\n+def test_invalid_or_cross_currency_price_rows_do_not_outrank_comparable_usd_cost() -> None:\\n+ \\\"\\\"\\\"Only finite non-negative prices in the configured currency are comparable.\\\"\\\"\\\"\\n+ price_book = PriceBook(InMemoryConfigStore(), default_currency=\\\"USD\\\")\\n+ valid = _model(\\\"openrouter\\\", \\\"valid-model\\\")\\n+ negative = _model(\\\"negative_vendor\\\", \\\"negative-model\\\")\\n+ non_finite = _model(\\\"nan_vendor\\\", \\\"nan-model\\\")\\n+ foreign = _model(\\\"eur_vendor\\\", \\\"eur-model\\\")\\n+\\n+ _set_price(price_book, valid, 1.0)\\n+ _set_price(price_book, negative, -100.0)\\n+ _set_price(price_book, non_finite, float(\\\"nan\\\"))\\n+ _set_price(price_book, foreign, 0.000001, currency_code=\\\"EUR\\\")\\n+\\n+ assert select_cheapest_discovered_agent(\\n+ [negative, non_finite, foreign, valid],\\n+ price_book,\\n+ ) is valid\\n+\\n+\\n+def test_duplicate_serving_identity_cannot_consume_bootstrap_capacity() -> None:\\n+ \\\"\\\"\\\"A repeated provider/model row must not masquerade as failover diversity.\\\"\\\"\\\"\\n+ selector = getattr(\\n+ model_discovery,\\n+ \\\"select_bootstrap_discovered_agents\\\",\\n+ None,\\n+ )\\n+ assert callable(selector), \\\"missing provider-diverse bootstrap selector\\\"\\n+\\n+ price_book = PriceBook(InMemoryConfigStore())\\n+ duplicate_first = _model(\\\"openrouter\\\", \\\"same-model\\\")\\n+ duplicate_second = _model(\\\"openrouter\\\", \\\"same-model\\\")\\n+ independent = _model(\\\"openai\\\", \\\"independent-model\\\")\\n+ _set_price(price_book, duplicate_first, 0.01)\\n+ _set_price(price_book, independent, 0.02)\\n+\\n+ selected = selector(\\n+ [duplicate_second, independent, duplicate_first],\\n+ price_book,\\n+ 3,\\n+ )\\n+ top_n = select_top_n_cheapest_discovered_agents(\\n+ [duplicate_second, independent, duplicate_first],\\n+ price_book,\\n+ 3,\\n+ )\\n+\\n+ assert [\\n+ (model.provider_name, model.model_id)\\n+ for model in selected\\n+ ] == [\\n+ (\\\"openrouter\\\", \\\"same-model\\\"),\\n+ (\\\"openai\\\", \\\"independent-model\\\"),\\n+ ]\\n+ assert [\\n+ (model.provider_name, model.model_id)\\n+ for model in top_n\\n+ ] == [\\n+ (\\\"openrouter\\\", \\\"same-model\\\"),\\n+ (\\\"openai\\\", \\\"independent-model\\\"),\\n+ ]\\n+\\n+\\n+def test_conflicting_duplicate_prices_are_withheld_as_ambiguous() -> None:\\n+ \\\"\\\"\\\"Do not let provider row order decide the trusted price for one agent id.\\\"\\\"\\\"\\n+ price_book = PriceBook(InMemoryConfigStore())\\n+ cheap_claim = _priced_model(\\n+ \\\"openrouter\\\",\\n+ \\\"duplicate-model\\\",\\n+ prompt_price_per_1k=0.000001,\\n+ completion_price_per_1k=0.000001,\\n+ )\\n+ expensive_claim = _priced_model(\\n+ \\\"openrouter\\\",\\n+ \\\"duplicate-model\\\",\\n+ prompt_price_per_1k=100.0,\\n+ completion_price_per_1k=100.0,\\n+ )\\n+ complete = _priced_model(\\n+ \\\"openai\\\",\\n+ \\\"complete-model\\\",\\n+ prompt_price_per_1k=1.0,\\n+ completion_price_per_1k=1.0,\\n+ )\\n+\\n+ assert refresh_price_book(\\n+ [cheap_claim, expensive_claim, complete],\\n+ price_book,\\n+ ) == 1\\n+ assert price_book.get_price(\\\"openrouter\\\", \\\"duplicate-model\\\") is None\\n+ assert select_cheapest_discovered_agent(\\n+ [cheap_claim, expensive_claim, complete],\\n+ price_book,\\n+ ) is complete\\n+\\n+\\n+def test_bootstrap_selector_prefers_provider_diversity_before_duplicates() -> None:\\n+ \\\"\\\"\\\"The initial failover pool must span providers before repeating one.\\\"\\\"\\\"\\n+ selector = getattr(\\n+ model_discovery,\\n+ \\\"select_bootstrap_discovered_agents\\\",\\n+ None,\\n+ )\\n+ assert callable(selector), \\\"missing provider-diverse bootstrap selector\\\"\\n+\\n+ price_book = PriceBook(InMemoryConfigStore())\\n+ router_cheapest = _model(\\\"openrouter\\\", \\\"router-cheapest\\\")\\n+ router_second = _model(\\\"openrouter\\\", \\\"router-second\\\")\\n+ nim_model = _model(\\\"nvidia_nim\\\", \\\"nim-model\\\")\\n+ openai_model = _model(\\\"openai\\\", \\\"openai-model\\\")\\n+ _set_price(price_book, router_cheapest, 0.01)\\n+ _set_price(price_book, router_second, 0.02)\\n+ _set_price(price_book, nim_model, 0.5)\\n+ _set_price(price_book, openai_model, 1.0)\\n+\\n+ selected = selector(\\n+ [router_second, openai_model, nim_model, router_cheapest],\\n+ price_book,\\n+ 3,\\n+ )\\n+\\n+ assert selected == [router_cheapest, nim_model, openai_model]\\n+\\n+\\n+def test_bootstrap_selector_treats_nim_primary_and_sub_as_one_outage_domain() -> None:\\n+ \\\"\\\"\\\"Two NIM keys must not displace an independently hosted provider.\\\"\\\"\\\"\\n+ selector = getattr(\\n+ model_discovery,\\n+ \\\"select_bootstrap_discovered_agents\\\",\\n+ None,\\n+ )\\n+ assert callable(selector), \\\"missing provider-diverse bootstrap selector\\\"\\n+\\n+ price_book = PriceBook(InMemoryConfigStore())\\n+ nim_primary = _model(\\\"nvidia_nim\\\", \\\"primary-model\\\")\\n+ nim_sub = _model(\\\"nvidia_nim_sub\\\", \\\"sub-model\\\")\\n+ openrouter = _model(\\\"openrouter\\\", \\\"router-model\\\")\\n+ _set_price(price_book, nim_primary, 0.01)\\n+ _set_price(price_book, nim_sub, 0.02)\\n+ _set_price(price_book, openrouter, 0.5)\\n+\\n+ selected = selector(\\n+ [nim_sub, openrouter, nim_primary],\\n+ price_book,\\n+ 2,\\n+ )\\n+\\n+ assert selected == [nim_primary, openrouter]\\n+\\n+\\n+def test_bootstrap_selector_is_deterministic_when_every_model_is_unpriced() -> None:\\n+ \\\"\\\"\\\"All-unpriced discovery remains usable but never order-dependent.\\\"\\\"\\\"\\n+ selector = getattr(\\n+ model_discovery,\\n+ \\\"select_bootstrap_discovered_agents\\\",\\n+ None,\\n+ )\\n+ assert callable(selector), \\\"missing provider-diverse bootstrap selector\\\"\\n+\\n+ price_book = PriceBook(InMemoryConfigStore())\\n+ router_z = _model(\\\"openrouter\\\", \\\"z-model\\\")\\n+ router_a = _model(\\\"openrouter\\\", \\\"a-model\\\")\\n+ nim_b = _model(\\\"nvidia_nim\\\", \\\"b-model\\\")\\n+\\n+ selected = selector(\\n+ [router_z, nim_b, router_a],\\n+ price_book,\\n+ 3,\\n+ )\\n+\\n+ assert selected == [nim_b, router_a, router_z]\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover\\n+ raise SystemExit(pytest.main([__file__]))\" }, { \"sha\": \"f1eca6acd721c760f601ef90b3c10d0b0419810f\", \"filename\": \"tests/test_local_mlx.py\", \"status\": \"modified\", \"additions\": 3, \"deletions\": 2, \"changes\": 5, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_local_mlx.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_local_mlx.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_local_mlx.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -350,7 +350,8 @@ def test_response_without_content_or_reasoning_fails_clearly() -> None:\\n ModelClient()._response_content(agent, {\\\"choices\\\": [{\\\"message\\\": {}}]})\\n \\n \\n-def test_local_responses_passthrough_adapts_to_chat_transport() -> None:\\n+@pytest.mark.parametrize(\\\"endpoint\\\", [\\\"responses\\\", \\\"/v1/responses\\\"])\\n+def test_local_responses_passthrough_adapts_to_chat_transport(endpoint: str) -> None:\\n agent = ModelAgent(\\\"local_agent\\\", \\\"local-model\\\", base_url=\\\"mlx://127.0.0.1:8080/v1\\\")\\n client = ModelClient(max_retries=0, chat_template_args={\\\"enable_thinking\\\": False})\\n with patch.object(client, \\\"_validate_provider\\\", return_value=None), patch.object(\\n@@ -369,7 +370,7 @@ def test_local_responses_passthrough_adapts_to_chat_transport() -> None:\\n ) as send:\\n response = client.proxy_send(\\n agent,\\n- \\\"responses\\\",\\n+ endpoint,\\n {\\n \\\"model\\\": \\\"local-model\\\",\\n \\\"instructions\\\": \\\"Be concise.\\\",\" }, { \"sha\": \"d1974a88c31401c752fed7932bb4ce9bd48d6efc\", \"filename\": \"tests/test_model_discovery.py\", \"status\": \"modified\", \"additions\": 8, \"deletions\": 0, \"changes\": 8, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_model_discovery.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_model_discovery.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_model_discovery.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -24,6 +24,7 @@\\n from contextual_orchestrator.model_discovery import ( # noqa: E402\\n DiscoveredModel,\\n ProviderModelSource,\\n+ _price_per_1k,\\n agent_from_discovered,\\n agent_id_for,\\n discover_all_models,\\n@@ -113,6 +114,13 @@ def urlopen(request, timeout=None):\\n assert discovered[1].prompt_price_per_1k is None\\n \\n \\n+def test_price_per_1k_rejects_underflowing_positive_value() -> None:\\n+ \\\"\\\"\\\"A nonzero per-token price that underflows to 0.0 in float stays unknown.\\\"\\\"\\\"\\n+ assert _price_per_1k(\\\"1e-10000\\\") is None\\n+ assert _price_per_1k(0) == 0.0\\n+ assert _price_per_1k(0.000001) == pytest.approx(0.001)\\n+\\n+\\n def test_discover_bytez_parses_models_with_key_auth_scheme() -> None:\\n register_credential(\\\"BYTEZ_API_KEY\\\", \\\"bytez-secret\\\")\\n payload = {\" }, { \"sha\": \"a2ce16f9562bc7470bcef3d7a090be9ed96892be\", \"filename\": \"tests/test_provider_bootstrap.py\", \"status\": \"added\", \"additions\": 405, \"deletions\": 0, \"changes\": 405, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_provider_bootstrap.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_provider_bootstrap.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_provider_bootstrap.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,405 @@\\n+\\\"\\\"\\\"Contracts for durable all-provider bootstrap and provider-diverse model activation.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+from dataclasses import replace\\n+import json\\n+import os\\n+\\n+import pytest\\n+\\n+from contextual_orchestrator import ModelAgent, TaskOrchestrator\\n+from contextual_orchestrator.chat_capability import is_general_chat_agent_model_id\\n+from contextual_orchestrator.credentials import (\\n+ InMemoryCredentialBackend,\\n+ get_credential,\\n+ set_backend,\\n+)\\n+from contextual_orchestrator.model_discovery import (\\n+ DiscoveredModel,\\n+ agent_from_discovered,\\n+)\\n+from contextual_orchestrator import provider_bootstrap\\n+\\n+\\n+@pytest.fixture(autouse=True)\\n+def isolated_credential_backend():\\n+ \\\"\\\"\\\"Give each test a fresh process-local credential registry.\\\"\\\"\\\"\\n+ set_backend(InMemoryCredentialBackend())\\n+ yield\\n+ set_backend(None)\\n+\\n+\\n+def _complete_environment() -> dict[str, str]:\\n+ \\\"\\\"\\\"Return one complete mounted-secret fixture with trailing newlines.\\\"\\\"\\\"\\n+ return {\\n+ name: f\\\"secret-for-{name.lower()}\\\\n\\\"\\n+ for name in provider_bootstrap.PROVIDER_CREDENTIAL_NAMES\\n+ }\\n+\\n+\\n+def _model(\\n+ provider: str,\\n+ credential: str,\\n+ model_id: str,\\n+ prompt: float | None,\\n+) -> DiscoveredModel:\\n+ \\\"\\\"\\\"Build a deterministic provider-catalog row for bootstrap tests.\\\"\\\"\\\"\\n+ return DiscoveredModel(\\n+ provider_name=provider,\\n+ model_id=model_id,\\n+ credential_name=credential,\\n+ chat_base_url=f\\\"https://{provider}.example/v1\\\",\\n+ auth_scheme=\\\"Bearer\\\",\\n+ prompt_price_per_1k=prompt,\\n+ completion_price_per_1k=prompt,\\n+ )\\n+\\n+\\n+def test_fixed_inventory_matches_all_five_organization_secrets():\\n+ \\\"\\\"\\\"The bootstrap inventory must not silently lose an organization provider key.\\\"\\\"\\\"\\n+ assert set(provider_bootstrap.PROVIDER_CREDENTIAL_NAMES) == {\\n+ \\\"NVIDIA_NIM_API_KEY\\\",\\n+ \\\"NVIDIA_NIM_API_KEY_SUB\\\",\\n+ \\\"BYTEZ_API_KEY\\\",\\n+ \\\"OPENROUTER_API_KEY\\\",\\n+ \\\"OPENAI_API_KEY\\\",\\n+ }\\n+\\n+\\n+def test_collect_requires_complete_inventory_without_leaking_values():\\n+ \\\"\\\"\\\"Production bootstrap fails before writes when one trusted secret is absent.\\\"\\\"\\\"\\n+ environment = _complete_environment()\\n+ removed = environment.pop(\\\"BYTEZ_API_KEY\\\")\\n+ with pytest.raises(provider_bootstrap.ProviderBootstrapError) as raised:\\n+ provider_bootstrap.collect_provider_credentials(environment)\\n+ assert \\\"BYTEZ_API_KEY\\\" in str(raised.value)\\n+ assert removed.strip() not in str(raised.value)\\n+ assert all(\\n+ get_credential(name) is None\\n+ for name in provider_bootstrap.PROVIDER_CREDENTIAL_NAMES\\n+ )\\n+\\n+\\n+def test_atomic_memory_registration_strips_mounted_secret_newlines():\\n+ \\\"\\\"\\\"A complete inventory becomes visible together and mounted newlines are removed.\\\"\\\"\\\"\\n+ credentials = provider_bootstrap.collect_provider_credentials(\\n+ _complete_environment()\\n+ )\\n+ registered = provider_bootstrap.register_provider_credentials_atomically(\\n+ credentials\\n+ )\\n+ assert registered == tuple(\\n+ sorted(provider_bootstrap.PROVIDER_CREDENTIAL_NAMES)\\n+ )\\n+ for name in provider_bootstrap.PROVIDER_CREDENTIAL_NAMES:\\n+ value = get_credential(name)\\n+ assert value == f\\\"secret-for-{name.lower()}\\\"\\n+ assert \\\"\\\\n\\\" not in value\\n+\\n+\\n+def test_unknown_credential_name_is_rejected_before_any_write():\\n+ \\\"\\\"\\\"The fixed bootstrap boundary cannot be expanded by untrusted names.\\\"\\\"\\\"\\n+ with pytest.raises(provider_bootstrap.ProviderBootstrapError):\\n+ provider_bootstrap.register_provider_credentials_atomically(\\n+ {\\\"EVIL_PROVIDER_KEY\\\": \\\"secret\\\"}\\n+ )\\n+ assert get_credential(\\\"EVIL_PROVIDER_KEY\\\") is None\\n+\\n+\\n+def test_diverse_selection_prefers_known_cost_without_treating_unknown_as_free():\\n+ \\\"\\\"\\\"Unknown-cost candidates stay usable but cannot win as fabricated zero cost.\\\"\\\"\\\"\\n+ models = [\\n+ _model(\\\"openai\\\", \\\"OPENAI_API_KEY\\\", \\\"gpt-expensive\\\", 4.0),\\n+ _model(\\\"openai\\\", \\\"OPENAI_API_KEY\\\", \\\"gpt-cheap\\\", 1.0),\\n+ _model(\\\"openrouter\\\", \\\"OPENROUTER_API_KEY\\\", \\\"mistral-router\\\", 2.0),\\n+ _model(\\\"bytez\\\", \\\"BYTEZ_API_KEY\\\", \\\"llama-unknown\\\", None),\\n+ ]\\n+ selected = provider_bootstrap.select_provider_diverse_models(models, limit=3)\\n+ assert [(item.provider_name, item.model_id) for item in selected] == [\\n+ (\\\"openai\\\", \\\"gpt-cheap\\\"),\\n+ (\\\"openrouter\\\", \\\"mistral-router\\\"),\\n+ (\\\"bytez\\\", \\\"llama-unknown\\\"),\\n+ ]\\n+\\n+\\n+def test_partial_price_is_unknown_in_provider_bootstrap_ranking():\\n+ \\\"\\\"\\\"A missing prompt or completion price cannot become an invented zero.\\\"\\\"\\\"\\n+ partial = replace(\\n+ _model(\\\"bytez\\\", \\\"BYTEZ_API_KEY\\\", \\\"partial-model\\\", None),\\n+ prompt_price_per_1k=0.001,\\n+ )\\n+ complete = _model(\\\"openrouter\\\", \\\"OPENROUTER_API_KEY\\\", \\\"complete-model\\\", 1.0)\\n+\\n+ selected = provider_bootstrap.select_provider_diverse_models(\\n+ [partial, complete], limit=2\\n+ )\\n+\\n+ assert [(item.provider_name, item.model_id) for item in selected] == [\\n+ (\\\"openrouter\\\", \\\"complete-model\\\"),\\n+ (\\\"bytez\\\", \\\"partial-model\\\"),\\n+ ]\\n+\\n+\\n+def test_non_usd_price_cannot_outrank_a_comparable_usd_price():\\n+ \\\"\\\"\\\"A cheap non-USD row must not beat a pricier USD row on face value alone.\\\"\\\"\\\"\\n+ cheap_foreign = replace(\\n+ _model(\\\"openrouter\\\", \\\"OPENROUTER_API_KEY\\\", \\\"cheap-foreign\\\", 0.001),\\n+ currency_code=\\\"EUR\\\",\\n+ )\\n+ priced_usd = _model(\\\"openai\\\", \\\"OPENAI_API_KEY\\\", \\\"priced-usd\\\", 1.0)\\n+\\n+ selected = provider_bootstrap.select_provider_diverse_models(\\n+ [cheap_foreign, priced_usd], limit=2\\n+ )\\n+\\n+ assert [(item.provider_name, item.model_id) for item in selected] == [\\n+ (\\\"openai\\\", \\\"priced-usd\\\"),\\n+ (\\\"openrouter\\\", \\\"cheap-foreign\\\"),\\n+ ]\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ (\\\"model_id\\\", \\\"eligible\\\"),\\n+ [\\n+ (\\\"dall-e-3\\\", False),\\n+ (\\\"openai/clip-vit-large\\\", False),\\n+ (\\\"siglip-base-patch16\\\", False),\\n+ (\\\"nvidia/guard-model\\\", False),\\n+ (\\\"provider/audio-chat-model\\\", True),\\n+ (\\\"openai/gpt-4.1-mini\\\", True),\\n+ ],\\n+)\\n+def test_provider_bootstrap_reuses_shared_chat_capability_policy(model_id, eligible):\\n+ \\\"\\\"\\\"Bootstrap and runtime must agree on ordinary chat-model eligibility.\\\"\\\"\\\"\\n+ model = _model(\\\"openai\\\", \\\"OPENAI_API_KEY\\\", model_id, 1.0)\\n+ assert provider_bootstrap.is_chat_serving_candidate(model) is eligible\\n+ assert eligible is is_general_chat_agent_model_id(model_id)\\n+\\n+\\n+def test_provider_bootstrap_collapses_nim_credentials_to_one_outage_domain():\\n+ \\\"\\\"\\\"Primary and secondary NIM credentials cannot displace an independent provider.\\\"\\\"\\\"\\n+ nim_primary = _model(\\\"nvidia_nim\\\", \\\"NVIDIA_NIM_API_KEY\\\", \\\"primary-model\\\", 0.01)\\n+ nim_secondary = _model(\\\"nvidia_nim_sub\\\", \\\"NVIDIA_NIM_API_KEY_SUB\\\", \\\"secondary-model\\\", 0.02)\\n+ openrouter = _model(\\\"openrouter\\\", \\\"OPENROUTER_API_KEY\\\", \\\"router-model\\\", 0.5)\\n+\\n+ selected = provider_bootstrap.select_provider_diverse_models(\\n+ [nim_secondary, openrouter, nim_primary], limit=2\\n+ )\\n+\\n+ assert [(item.provider_name, item.model_id) for item in selected] == [\\n+ (\\\"nvidia_nim\\\", \\\"primary-model\\\"),\\n+ (\\\"openrouter\\\", \\\"router-model\\\"),\\n+ ]\\n+\\n+\\n+def test_non_chat_catalog_rows_are_never_selected_for_chat_service():\\n+ \\\"\\\"\\\"Embeddings, rerankers, speech, image, moderation, and realtime rows stay inert.\\\"\\\"\\\"\\n+ models = [\\n+ _model(\\\"openai\\\", \\\"OPENAI_API_KEY\\\", \\\"text-embedding-3-small\\\", 0.1),\\n+ _model(\\\"openai\\\", \\\"OPENAI_API_KEY\\\", \\\"whisper-1\\\", 0.1),\\n+ _model(\\\"openai\\\", \\\"OPENAI_API_KEY\\\", \\\"gpt-image-1\\\", 0.1),\\n+ _model(\\\"openai\\\", \\\"OPENAI_API_KEY\\\", \\\"omni-moderation-latest\\\", 0.1),\\n+ _model(\\n+ \\\"nvidia_nim\\\",\\n+ \\\"NVIDIA_NIM_API_KEY\\\",\\n+ \\\"nv-rerankqa-mistral-4b-v3\\\",\\n+ 0.1,\\n+ ),\\n+ _model(\\n+ \\\"openrouter\\\",\\n+ \\\"OPENROUTER_API_KEY\\\",\\n+ \\\"openai/gpt-4.1-mini\\\",\\n+ 2.0,\\n+ ),\\n+ ]\\n+ selected = provider_bootstrap.select_provider_diverse_models(models, limit=10)\\n+ assert [(item.provider_name, item.model_id) for item in selected] == [\\n+ (\\\"openrouter\\\", \\\"openai/gpt-4.1-mini\\\")\\n+ ]\\n+\\n+\\n+def test_serving_tags_do_not_infer_capabilities_from_model_names():\\n+ \\\"\\\"\\\"Reasoning, coding, and vision-looking names receive only generic tags.\\\"\\\"\\\"\\n+ model = _model(\\n+ \\\"openrouter\\\",\\n+ \\\"OPENROUTER_API_KEY\\\",\\n+ \\\"qwen/qwen-vl-coder-reasoning\\\",\\n+ 1.0,\\n+ )\\n+ assert provider_bootstrap.serving_tags_for_discovered(model) == (\\n+ \\\"discovered\\\",\\n+ \\\"chat\\\",\\n+ \\\"worker\\\",\\n+ \\\"writing\\\",\\n+ \\\"synthesizer\\\",\\n+ )\\n+\\n+\\n+def test_bootstrap_registers_then_discovers_without_environment_runtime_reads(\\n+ monkeypatch,\\n+):\\n+ \\\"\\\"\\\"Discovery sees KV-backed credentials after one-shot environment bootstrap.\\\"\\\"\\\"\\n+ environment = _complete_environment()\\n+ observed: dict[str, str | None] = {}\\n+\\n+ def fake_discover_all_models():\\n+ \\\"\\\"\\\"Observe the KV from the mocked provider-discovery boundary.\\\"\\\"\\\"\\n+ for name in provider_bootstrap.PROVIDER_CREDENTIAL_NAMES:\\n+ observed[name] = get_credential(name)\\n+ return (\\n+ [_model(\\\"openai\\\", \\\"OPENAI_API_KEY\\\", \\\"gpt-test\\\", 1.0)],\\n+ [],\\n+ )\\n+\\n+ monkeypatch.setattr(\\n+ provider_bootstrap,\\n+ \\\"discover_all_models\\\",\\n+ fake_discover_all_models,\\n+ )\\n+ report = provider_bootstrap.bootstrap_provider_runtime(\\n+ environ=environment,\\n+ model_limit=1,\\n+ )\\n+\\n+ assert report.discovered_model_count == 1\\n+ assert report.eligible_model_count == 1\\n+ assert report.selected_agent_ids == (\\\"openai_gpt_test\\\",)\\n+ assert report.enabled_agent_ids == ()\\n+ assert report.durable_agent_pool is False\\n+ assert all(\\n+ observed[name] == environment[name].strip()\\n+ for name in observed\\n+ )\\n+\\n+\\n+def test_bootstrap_fails_closed_when_no_model_is_discovered(monkeypatch):\\n+ \\\"\\\"\\\"Credential writes without a usable catalog are not reported service-ready.\\\"\\\"\\\"\\n+ monkeypatch.setattr(\\n+ provider_bootstrap,\\n+ \\\"discover_all_models\\\",\\n+ lambda: ([], []),\\n+ )\\n+ with pytest.raises(\\n+ provider_bootstrap.ProviderBootstrapError,\\n+ match=\\\"no usable models\\\",\\n+ ):\\n+ provider_bootstrap.bootstrap_provider_runtime(\\n+ environ=_complete_environment()\\n+ )\\n+\\n+\\n+def test_bootstrap_fails_closed_when_catalog_has_only_non_chat_models(monkeypatch):\\n+ \\\"\\\"\\\"A successful catalog response is not ready without a chat candidate.\\\"\\\"\\\"\\n+ monkeypatch.setattr(\\n+ provider_bootstrap,\\n+ \\\"discover_all_models\\\",\\n+ lambda: (\\n+ [\\n+ _model(\\n+ \\\"openai\\\",\\n+ \\\"OPENAI_API_KEY\\\",\\n+ \\\"text-embedding-3-small\\\",\\n+ 0.1,\\n+ )\\n+ ],\\n+ [],\\n+ ),\\n+ )\\n+ with pytest.raises(\\n+ provider_bootstrap.ProviderBootstrapError,\\n+ match=\\\"no chat-capable models\\\",\\n+ ):\\n+ provider_bootstrap.bootstrap_provider_runtime(\\n+ environ=_complete_environment()\\n+ )\\n+\\n+\\n+def test_durable_pool_withdraws_bootstrap_and_stale_discovered_agents(\\n+ monkeypatch,\\n+ tmp_path,\\n+):\\n+ \\\"\\\"\\\"A refresh leaves exactly the current selected discovered models active.\\\"\\\"\\\"\\n+ agents_db = str(tmp_path / \\\"agents.db\\\")\\n+ old_model = _model(\\n+ \\\"openai\\\",\\n+ \\\"OPENAI_API_KEY\\\",\\n+ \\\"gpt-retired-model\\\",\\n+ 1.0,\\n+ )\\n+ old_agent = replace(agent_from_discovered(old_model), disabled=False)\\n+ seeded = TaskOrchestrator(\\n+ [ModelAgent(\\\"manual_agent\\\", \\\"manual-model\\\")],\\n+ agents_db=agents_db,\\n+ )\\n+ seeded.sync_discovered_agents([old_agent])\\n+\\n+ new_model = _model(\\n+ \\\"openrouter\\\",\\n+ \\\"OPENROUTER_API_KEY\\\",\\n+ \\\"qwen-current-coder\\\",\\n+ 2.0,\\n+ )\\n+ monkeypatch.setattr(\\n+ provider_bootstrap,\\n+ \\\"discover_all_models\\\",\\n+ lambda: ([new_model], []),\\n+ )\\n+ report = provider_bootstrap.bootstrap_provider_runtime(\\n+ environ=_complete_environment(),\\n+ agents_db=agents_db,\\n+ model_limit=1,\\n+ )\\n+\\n+ assert report.discovered_model_count == 1\\n+ assert report.eligible_model_count == 1\\n+ assert report.selected_agent_ids == (\\\"openrouter_qwen_current_coder\\\",)\\n+ assert report.enabled_agent_ids == (\\\"openrouter_qwen_current_coder\\\",)\\n+ assert report.durable_agent_pool is True\\n+\\n+ restarted = TaskOrchestrator(\\n+ [ModelAgent(\\\"bootstrap_agent\\\", \\\"bootstrap-model\\\")],\\n+ agents_db=agents_db,\\n+ )\\n+ assert {agent.id for agent in restarted.agents} == {\\n+ \\\"openrouter_qwen_current_coder\\\"\\n+ }\\n+ assert restarted.agents[0].tags == (\\n+ \\\"discovered\\\",\\n+ \\\"chat\\\",\\n+ \\\"worker\\\",\\n+ \\\"writing\\\",\\n+ \\\"synthesizer\\\",\\n+ )\\n+ assert all(\\n+ agent.id not in {\\\"bootstrap_agent\\\", \\\"openai_gpt_retired_model\\\"}\\n+ for agent in restarted.agents\\n+ )\\n+\\n+\\n+def test_cli_report_never_contains_secret_values(monkeypatch, capsys):\\n+ \\\"\\\"\\\"Operator evidence names credentials and agents but never prints secrets.\\\"\\\"\\\"\\n+ environment = _complete_environment()\\n+ monkeypatch.setattr(os, \\\"environ\\\", environment)\\n+ monkeypatch.setattr(\\n+ provider_bootstrap,\\n+ \\\"discover_all_models\\\",\\n+ lambda: (\\n+ [_model(\\\"openai\\\", \\\"OPENAI_API_KEY\\\", \\\"gpt-test\\\", 1.0)],\\n+ [],\\n+ ),\\n+ )\\n+ provider_bootstrap.main([\\\"--model-limit\\\", \\\"1\\\"])\\n+ output = capsys.readouterr().out\\n+ report = json.loads(output)\\n+ assert \\\"OPENAI_API_KEY\\\" in output\\n+ assert report[\\\"eligible_model_count\\\"] == 1\\n+ assert report[\\\"selected_agent_ids\\\"] == [\\\"openai_gpt_test\\\"]\\n+ assert report[\\\"enabled_agent_ids\\\"] == []\\n+ assert report[\\\"durable_agent_pool\\\"] is False\\n+ for value in environment.values():\\n+ assert value.strip() not in output\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover\\n+ raise SystemExit(pytest.main([__file__]))\" }, { \"sha\": \"70ea8ecc7e83442b115b97847523e3c26484689a\", \"filename\": \"tests/test_provider_bootstrap_secret_normalization.py\", \"status\": \"added\", \"additions\": 71, \"deletions\": 0, \"changes\": 71, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_provider_bootstrap_secret_normalization.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_provider_bootstrap_secret_normalization.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_provider_bootstrap_secret_normalization.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,71 @@\\n+\\\"\\\"\\\"Regression coverage for mounted provider-secret normalization.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+from pathlib import Path\\n+\\n+import pytest\\n+\\n+from contextual_orchestrator.credentials import (\\n+ InMemoryCredentialBackend,\\n+ get_credential,\\n+ set_backend,\\n+)\\n+from contextual_orchestrator.provider_bootstrap import (\\n+ PROVIDER_CREDENTIAL_NAMES,\\n+ collect_provider_credentials,\\n+ register_provider_credentials_atomically,\\n+)\\n+\\n+\\n+@pytest.fixture(autouse=True)\\n+def isolated_credential_backend():\\n+ \\\"\\\"\\\"Give each test a fresh process-local credential registry.\\\"\\\"\\\"\\n+ set_backend(InMemoryCredentialBackend())\\n+ try:\\n+ yield\\n+ finally:\\n+ set_backend(None)\\n+\\n+\\n+def _complete_environment() -> dict[str, str]:\\n+ \\\"\\\"\\\"Return a complete mounted-secret inventory.\\\"\\\"\\\"\\n+ return {name: f\\\"secret-for-{name.lower()}\\\\n\\\" for name in PROVIDER_CREDENTIAL_NAMES}\\n+\\n+\\n+def test_collection_removes_only_mounted_line_endings() -> None:\\n+ \\\"\\\"\\\"Do not silently rewrite other credential bytes while removing CR/LF mounts.\\\"\\\"\\\"\\n+ environment = _complete_environment()\\n+ environment[\\\"OPENAI_API_KEY\\\"] = \\\" edge-sensitive-secret \\\\r\\\\n\\\"\\n+\\n+ collected = collect_provider_credentials(environment)\\n+\\n+ assert collected[\\\"OPENAI_API_KEY\\\"] == \\\" edge-sensitive-secret \\\"\\n+ assert collected[\\\"BYTEZ_API_KEY\\\"] == \\\"secret-for-bytez_api_key\\\"\\n+\\n+\\n+def test_atomic_registration_preserves_normalized_secret_bytes() -> None:\\n+ \\\"\\\"\\\"The atomic backend write must not perform a second broad whitespace trim.\\\"\\\"\\\"\\n+ credentials = {\\n+ name: f\\\"secret-for-{name.lower()}\\\"\\n+ for name in PROVIDER_CREDENTIAL_NAMES\\n+ }\\n+ credentials[\\\"OPENROUTER_API_KEY\\\"] = \\\" edge-sensitive-router-secret \\\"\\n+\\n+ register_provider_credentials_atomically(credentials)\\n+\\n+ assert get_credential(\\\"OPENROUTER_API_KEY\\\") == \\\" edge-sensitive-router-secret \\\"\\n+\\n+\\n+def test_catalog_sync_leak_guard_matches_secret_normalization() -> None:\\n+ \\\"\\\"\\\"The workflow checks the exact credential bytes that bootstrap handles.\\\"\\\"\\\"\\n+ workflow = Path(\\\".github/workflows/provider-catalog-sync.yml\\\").read_text(\\n+ encoding=\\\"utf-8\\\"\\n+ )\\n+\\n+ assert \\\"os.environ[name].rstrip('\\\\\\\\r\\\\\\\\n')\\\" in workflow\\n+ assert \\\"os.environ[name] and os.environ[name] in report\\\" not in workflow\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover\\n+ raise SystemExit(pytest.main([__file__]))\" }, { \"sha\": \"02f93564c6bf711ca56a16f342bdbd24ddfba144\", \"filename\": \"tests/test_provider_catalog_bootstrap.py\", \"status\": \"added\", \"additions\": 175, \"deletions\": 0, \"changes\": 175, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_provider_catalog_bootstrap.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_provider_catalog_bootstrap.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_provider_catalog_bootstrap.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,175 @@\\n+\\\"\\\"\\\"End-to-end durable provider catalog bootstrap contracts.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import pytest\\n+\\n+from contextual_orchestrator.credentials import (\\n+ InMemoryCredentialBackend,\\n+ get_credential,\\n+ register_credential,\\n+ set_backend,\\n+)\\n+from contextual_orchestrator.model_discovery import (\\n+ DiscoveredModel,\\n+ ProviderDiscoveryError,\\n+ ProviderModelSource,\\n+)\\n+from contextual_orchestrator.provider_bootstrap import PROVIDER_CREDENTIAL_NAMES\\n+from contextual_orchestrator.provider_catalog_bootstrap import (\\n+ bootstrap_provider_catalog_runtime,\\n+)\\n+from contextual_orchestrator.provider_catalog_store import (\\n+ InMemoryProviderCatalogStore,\\n+)\\n+\\n+\\n+def _environment() -> dict[str, str]:\\n+ return {\\n+ name: f\\\"value-for-{name.casefold()}\\\"\\n+ for name in PROVIDER_CREDENTIAL_NAMES\\n+ }\\n+\\n+\\n+def _source(provider: str, credential: str) -> ProviderModelSource:\\n+ return ProviderModelSource(\\n+ provider_name=provider,\\n+ credential_name=credential,\\n+ list_url=f\\\"https://{provider}.example/v1/models\\\",\\n+ chat_base_url=f\\\"https://{provider}.example/v1\\\",\\n+ )\\n+\\n+\\n+def _model(source: ProviderModelSource, model_id: str) -> DiscoveredModel:\\n+ return DiscoveredModel(\\n+ provider_name=source.provider_name,\\n+ model_id=model_id,\\n+ credential_name=source.credential_name,\\n+ chat_base_url=source.chat_base_url,\\n+ auth_scheme=source.auth_scheme,\\n+ prompt_price_per_1k=1.0,\\n+ completion_price_per_1k=2.0,\\n+ )\\n+\\n+\\n+def test_failed_provider_uses_persisted_last_known_good_model() -> None:\\n+ \\\"\\\"\\\"A later provider outage keeps its last successful compatible model.\\\"\\\"\\\"\\n+ set_backend(InMemoryCredentialBackend())\\n+ try:\\n+ openai = _source(\\\"openai\\\", \\\"OPENAI_API_KEY\\\")\\n+ openrouter = _source(\\\"openrouter\\\", \\\"OPENROUTER_API_KEY\\\")\\n+ store = InMemoryProviderCatalogStore()\\n+\\n+ first = bootstrap_provider_catalog_runtime(\\n+ environ=_environment(),\\n+ catalog_store=store,\\n+ sources=(openai, openrouter),\\n+ discovery=lambda _sources: (\\n+ [_model(openai, \\\"gpt-live\\\"), _model(openrouter, \\\"router-live\\\")],\\n+ [],\\n+ ),\\n+ model_limit=4,\\n+ )\\n+ assert first.catalog_model_count == 2\\n+ assert first.last_known_good_model_count == 0\\n+\\n+ second = bootstrap_provider_catalog_runtime(\\n+ environ=_environment(),\\n+ catalog_store=store,\\n+ sources=(openai, openrouter),\\n+ discovery=lambda _sources: (\\n+ [_model(openrouter, \\\"router-new\\\")],\\n+ [ProviderDiscoveryError(\\\"openai\\\", \\\"secret-bearing detail\\\")],\\n+ ),\\n+ model_limit=4,\\n+ )\\n+ assert second.live_discovered_model_count == 1\\n+ assert second.catalog_model_count == 2\\n+ assert second.last_known_good_model_count == 1\\n+ assert second.catalog_refresh_failure_count == 1\\n+ assert second.providers_with_errors == (\\\"openai\\\",)\\n+ assert set(second.selected_agent_ids) == {\\n+ \\\"openai_gpt_live\\\",\\n+ \\\"openrouter_router_new\\\",\\n+ }\\n+ assert \\\"secret-bearing detail\\\" not in str(second.as_dict())\\n+ finally:\\n+ set_backend(None)\\n+\\n+\\n+def test_empty_catalog_preserves_lkg_but_nonchat_success_withdraws_it() -> None:\\n+ \\\"\\\"\\\"Empty refresh is failure; authoritative non-chat success is withdrawal.\\\"\\\"\\\"\\n+ set_backend(InMemoryCredentialBackend())\\n+ try:\\n+ openai = _source(\\\"openai\\\", \\\"OPENAI_API_KEY\\\")\\n+ store = InMemoryProviderCatalogStore()\\n+ bootstrap_provider_catalog_runtime(\\n+ environ=_environment(),\\n+ catalog_store=store,\\n+ sources=(openai,),\\n+ discovery=lambda _sources: ([_model(openai, \\\"gpt-live\\\")], []),\\n+ model_limit=1,\\n+ )\\n+\\n+ empty = bootstrap_provider_catalog_runtime(\\n+ environ=_environment(),\\n+ catalog_store=store,\\n+ sources=(openai,),\\n+ discovery=lambda _sources: ([], []),\\n+ model_limit=1,\\n+ )\\n+ assert empty.last_known_good_model_count == 1\\n+ assert empty.catalog_model_count == 1\\n+\\n+ try:\\n+ bootstrap_provider_catalog_runtime(\\n+ environ=_environment(),\\n+ catalog_store=store,\\n+ sources=(openai,),\\n+ discovery=lambda _sources: (\\n+ [_model(openai, \\\"text-embedding-3-small\\\")],\\n+ [],\\n+ ),\\n+ model_limit=1,\\n+ )\\n+ except RuntimeError as error:\\n+ assert \\\"no persisted chat-compatible model\\\" in str(error)\\n+ else:\\n+ raise AssertionError(\\\"non-chat-only authoritative catalog must fail\\\")\\n+ finally:\\n+ set_backend(None)\\n+\\n+\\n+def test_unexpected_discovery_failure_restores_entire_credential_inventory() -> None:\\n+ \\\"\\\"\\\"An unclassified bootstrap failure must not leave unvalidated secrets promoted.\\\"\\\"\\\"\\n+ set_backend(InMemoryCredentialBackend())\\n+ try:\\n+ previous = {\\n+ name: f\\\"previous-value-for-{name.casefold()}\\\"\\n+ for name in PROVIDER_CREDENTIAL_NAMES\\n+ }\\n+ for name, value in previous.items():\\n+ register_credential(name, value)\\n+\\n+ def fail_discovery(_sources):\\n+ raise RuntimeError(\\\"unexpected discovery parser failure\\\")\\n+\\n+ with pytest.raises(RuntimeError, match=\\\"unexpected discovery parser failure\\\"):\\n+ bootstrap_provider_catalog_runtime(\\n+ environ=_environment(),\\n+ catalog_store=InMemoryProviderCatalogStore(),\\n+ sources=(_source(\\\"openai\\\", \\\"OPENAI_API_KEY\\\"),),\\n+ discovery=fail_discovery,\\n+ model_limit=1,\\n+ )\\n+\\n+ assert {\\n+ name: get_credential(name)\\n+ for name in PROVIDER_CREDENTIAL_NAMES\\n+ } == previous\\n+ finally:\\n+ set_backend(None)\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover\\n+ raise SystemExit(pytest.main([__file__]))\" }, { \"sha\": \"2a8e019ac52f508dc68b4a3fc1fee7350a4052fe\", \"filename\": \"tests/test_provider_catalog_credential_promotion.py\", \"status\": \"added\", \"additions\": 196, \"deletions\": 0, \"changes\": 196, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_provider_catalog_credential_promotion.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_provider_catalog_credential_promotion.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_provider_catalog_credential_promotion.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,196 @@\\n+\\\"\\\"\\\"Regression coverage for provider credential promotion around catalog refresh.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import pytest\\n+\\n+from contextual_orchestrator.credentials import (\\n+ InMemoryCredentialBackend,\\n+ get_credential,\\n+ register_credential,\\n+ set_backend,\\n+)\\n+from contextual_orchestrator.model_discovery import (\\n+ DiscoveredModel,\\n+ ProviderDiscoveryError,\\n+ ProviderModelSource,\\n+)\\n+from contextual_orchestrator.provider_bootstrap import ProviderBootstrapError\\n+from contextual_orchestrator.provider_catalog_bootstrap import (\\n+ bootstrap_provider_catalog_runtime,\\n+)\\n+from contextual_orchestrator.provider_catalog_store import (\\n+ InMemoryProviderCatalogStore,\\n+)\\n+\\n+\\n+@pytest.fixture(autouse=True)\\n+def isolated_credential_backend():\\n+ \\\"\\\"\\\"Give every promotion test a fresh credential registry.\\\"\\\"\\\"\\n+ set_backend(InMemoryCredentialBackend())\\n+ try:\\n+ yield\\n+ finally:\\n+ set_backend(None)\\n+\\n+\\n+def _source() -> ProviderModelSource:\\n+ return ProviderModelSource(\\n+ provider_name=\\\"openai\\\",\\n+ credential_name=\\\"OPENAI_API_KEY\\\",\\n+ list_url=\\\"https://api.openai.example/v1/models\\\",\\n+ chat_base_url=\\\"https://api.openai.example/v1\\\",\\n+ )\\n+\\n+\\n+def _model(source: ProviderModelSource, model_id: str) -> DiscoveredModel:\\n+ return DiscoveredModel(\\n+ provider_name=source.provider_name,\\n+ model_id=model_id,\\n+ credential_name=source.credential_name,\\n+ chat_base_url=source.chat_base_url,\\n+ auth_scheme=source.auth_scheme,\\n+ prompt_price_per_1k=1.0,\\n+ completion_price_per_1k=2.0,\\n+ )\\n+\\n+\\n+def _seed_last_known_good(\\n+ store: InMemoryProviderCatalogStore,\\n+ source: ProviderModelSource,\\n+) -> None:\\n+ model = _model(source, \\\"gpt-last-known-good\\\")\\n+ store.record_success(\\n+ source,\\n+ [model],\\n+ eligible_model_ids={model.model_id},\\n+ serving_tags={model.model_id: (\\\"discovered\\\", \\\"chat\\\", \\\"worker\\\")},\\n+ )\\n+\\n+\\n+def test_failed_refresh_restores_previous_credential_before_using_lkg() -> None:\\n+ \\\"\\\"\\\"An invalid candidate key must not replace the key paired with LKG models.\\\"\\\"\\\"\\n+ source = _source()\\n+ store = InMemoryProviderCatalogStore()\\n+ _seed_last_known_good(store, source)\\n+ register_credential(source.credential_name, \\\"old-working-secret\\\")\\n+\\n+ def failing_discovery(_sources):\\n+ assert get_credential(source.credential_name) == \\\"new-invalid-secret\\\"\\n+ return [], [ProviderDiscoveryError(source.provider_name, \\\"unauthorized\\\")]\\n+\\n+ report = bootstrap_provider_catalog_runtime(\\n+ environ={source.credential_name: \\\"new-invalid-secret\\\"},\\n+ require_all_credentials=False,\\n+ catalog_store=store,\\n+ sources=(source,),\\n+ discovery=failing_discovery,\\n+ model_limit=1,\\n+ )\\n+\\n+ assert get_credential(source.credential_name) == \\\"old-working-secret\\\"\\n+ assert report.selected_agent_ids == (\\\"openai_gpt_last_known_good\\\",)\\n+ assert report.restored_credentials == (source.credential_name,)\\n+\\n+\\n+def test_empty_refresh_restores_previous_credential_before_using_lkg() -> None:\\n+ \\\"\\\"\\\"An empty candidate-key catalog is failure, not credential promotion.\\\"\\\"\\\"\\n+ source = _source()\\n+ store = InMemoryProviderCatalogStore()\\n+ _seed_last_known_good(store, source)\\n+ register_credential(source.credential_name, \\\"old-working-secret\\\")\\n+\\n+ report = bootstrap_provider_catalog_runtime(\\n+ environ={source.credential_name: \\\"new-empty-catalog-secret\\\"},\\n+ require_all_credentials=False,\\n+ catalog_store=store,\\n+ sources=(source,),\\n+ discovery=lambda _sources: ([], []),\\n+ model_limit=1,\\n+ )\\n+\\n+ assert get_credential(source.credential_name) == \\\"old-working-secret\\\"\\n+ assert report.selected_agent_ids == (\\\"openai_gpt_last_known_good\\\",)\\n+ assert report.restored_credentials == (source.credential_name,)\\n+\\n+\\n+def test_failed_first_promotion_cannot_activate_lkg_without_a_prior_credential() -> None:\\n+ \\\"\\\"\\\"Persisted models are unusable when the candidate key failed and no old key exists.\\\"\\\"\\\"\\n+ source = _source()\\n+ store = InMemoryProviderCatalogStore()\\n+ _seed_last_known_good(store, source)\\n+\\n+ with pytest.raises(\\n+ ProviderBootstrapError,\\n+ match=\\\"no persisted chat-compatible model with a usable credential\\\",\\n+ ):\\n+ bootstrap_provider_catalog_runtime(\\n+ environ={source.credential_name: \\\"first-invalid-secret\\\"},\\n+ require_all_credentials=False,\\n+ catalog_store=store,\\n+ sources=(source,),\\n+ discovery=lambda _sources: (\\n+ [],\\n+ [ProviderDiscoveryError(source.provider_name, \\\"unauthorized\\\")],\\n+ ),\\n+ model_limit=1,\\n+ )\\n+\\n+ assert get_credential(source.credential_name) is None\\n+\\n+\\n+def test_report_excludes_first_promotion_credential_removed_by_rollback() -> None:\\n+ \\\"\\\"\\\"Durable-registration evidence cannot claim a deleted first candidate key.\\\"\\\"\\\"\\n+ openai = _source()\\n+ openrouter = ProviderModelSource(\\n+ provider_name=\\\"openrouter\\\",\\n+ credential_name=\\\"OPENROUTER_API_KEY\\\",\\n+ list_url=\\\"https://openrouter.example/v1/models\\\",\\n+ chat_base_url=\\\"https://openrouter.example/v1\\\",\\n+ )\\n+ live = _model(openrouter, \\\"router-live\\\")\\n+\\n+ report = bootstrap_provider_catalog_runtime(\\n+ environ={\\n+ openai.credential_name: \\\"first-invalid-secret\\\",\\n+ openrouter.credential_name: \\\"working-router-secret\\\",\\n+ },\\n+ require_all_credentials=False,\\n+ catalog_store=InMemoryProviderCatalogStore(),\\n+ sources=(openai, openrouter),\\n+ discovery=lambda _sources: (\\n+ [live],\\n+ [ProviderDiscoveryError(openai.provider_name, \\\"temporary discovery failure\\\")],\\n+ ),\\n+ model_limit=1,\\n+ )\\n+\\n+ assert report.restored_credentials == (openai.credential_name,)\\n+ assert report.registered_credentials == (openrouter.credential_name,)\\n+ assert get_credential(openai.credential_name) is None\\n+ assert get_credential(openrouter.credential_name) == \\\"working-router-secret\\\"\\n+\\n+\\n+def test_successful_refresh_promotes_the_candidate_credential() -> None:\\n+ \\\"\\\"\\\"A validated non-empty catalog commits the new provider credential.\\\"\\\"\\\"\\n+ source = _source()\\n+ store = InMemoryProviderCatalogStore()\\n+ register_credential(source.credential_name, \\\"old-working-secret\\\")\\n+ live = _model(source, \\\"gpt-new-live\\\")\\n+\\n+ report = bootstrap_provider_catalog_runtime(\\n+ environ={source.credential_name: \\\"new-working-secret\\\"},\\n+ require_all_credentials=False,\\n+ catalog_store=store,\\n+ sources=(source,),\\n+ discovery=lambda _sources: ([live], []),\\n+ model_limit=1,\\n+ )\\n+\\n+ assert get_credential(source.credential_name) == \\\"new-working-secret\\\"\\n+ assert report.selected_agent_ids == (\\\"openai_gpt_new_live\\\",)\\n+ assert report.restored_credentials == ()\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover\\n+ raise SystemExit(pytest.main([__file__]))\" }, { \"sha\": \"35459edd4d7c559546abfbd47c8ffb98705c036b\", \"filename\": \"tests/test_provider_catalog_store.py\", \"status\": \"added\", \"additions\": 316, \"deletions\": 0, \"changes\": 316, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_provider_catalog_store.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/9c4535e1a9503a6d65cec07a398607f6413f910a/tests%2Ftest_provider_catalog_store.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_provider_catalog_store.py?ref=9c4535e1a9503a6d65cec07a398607f6413f910a\", \"patch\": \"@@ -0,0 +1,316 @@\\n+\\\"\\\"\\\"Provider catalog persistence and last-known-good contracts.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+from dataclasses import replace\\n+from decimal import Decimal\\n+\\n+import pytest\\n+\\n+from contextual_orchestrator.model_discovery import (\\n+ DiscoveredModel,\\n+ ProviderModelSource,\\n+ _currency_is_comparable,\\n+)\\n+from contextual_orchestrator.provider_catalog_store import (\\n+ InMemoryProviderCatalogStore,\\n+ PostgresProviderCatalogStore,\\n+ PROVIDER_CATALOG_SCHEMA_SQL,\\n+ ProviderCatalogError,\\n+ normalize_discovered_model,\\n+ provider_account_id,\\n+)\\n+\\n+\\n+def _source(\\n+ provider: str = \\\"nvidia_nim\\\",\\n+ credential: str = \\\"NVIDIA_NIM_API_KEY\\\",\\n+) -> ProviderModelSource:\\n+ return ProviderModelSource(\\n+ provider_name=provider,\\n+ credential_name=credential,\\n+ list_url=f\\\"https://{provider}.example/v1/models\\\",\\n+ chat_base_url=f\\\"https://{provider}.example/v1\\\",\\n+ )\\n+\\n+\\n+def _model(\\n+ source: ProviderModelSource,\\n+ model_id: str,\\n+ prompt_price: object = 1.0,\\n+) -> DiscoveredModel:\\n+ return DiscoveredModel(\\n+ provider_name=source.provider_name,\\n+ model_id=model_id,\\n+ credential_name=source.credential_name,\\n+ chat_base_url=source.chat_base_url,\\n+ auth_scheme=source.auth_scheme,\\n+ prompt_price_per_1k=prompt_price,\\n+ completion_price_per_1k=prompt_price,\\n+ currency_code=\\\"usd\\\",\\n+ )\\n+\\n+\\n+def test_schema_is_normalized_and_contains_no_secret_value_column() -> None:\\n+ \\\"\\\"\\\"Catalog DDL keeps accounts, models, tags, and refresh evidence separate.\\\"\\\"\\\"\\n+ for table in (\\n+ \\\"provider_account\\\",\\n+ \\\"provider_model\\\",\\n+ \\\"model_serving_tag\\\",\\n+ \\\"catalog_refresh_run\\\",\\n+ ):\\n+ assert f\\\"CREATE TABLE IF NOT EXISTS {table}\\\" in PROVIDER_CATALOG_SCHEMA_SQL\\n+ lowered = PROVIDER_CATALOG_SCHEMA_SQL.casefold()\\n+ assert \\\"api_key\\\" not in lowered\\n+ assert \\\"secret_value\\\" not in lowered\\n+ assert \\\"encrypted_value\\\" not in lowered\\n+ model_table = lowered.split(\\n+ \\\"create table if not exists provider_model (\\\", 1\\n+ )[1].split(\\\");\\\", 1)[0]\\n+ assert \\\"chat_base_url\\\" not in model_table\\n+ assert \\\"auth_scheme\\\" not in model_table\\n+\\n+\\n+def test_primary_and_secondary_nim_accounts_have_distinct_ids() -> None:\\n+ \\\"\\\"\\\"Two NIM credentials remain independent quota and failure domains.\\\"\\\"\\\"\\n+ primary = _source(credential=\\\"NVIDIA_NIM_API_KEY\\\")\\n+ secondary = _source(\\n+ provider=\\\"nvidia_nim_sub\\\",\\n+ credential=\\\"NVIDIA_NIM_API_KEY_SUB\\\",\\n+ )\\n+ assert provider_account_id(primary) != provider_account_id(secondary)\\n+\\n+\\n+def test_model_normalization_rejects_cross_account_rows_and_bad_prices() -> None:\\n+ \\\"\\\"\\\"Catalog normalization is account-bound and never stores non-finite prices.\\\"\\\"\\\"\\n+ source = _source()\\n+ wrong = _model(\\n+ _source(provider=\\\"openai\\\", credential=\\\"OPENAI_API_KEY\\\"),\\n+ \\\"gpt-test\\\",\\n+ )\\n+ with pytest.raises(ProviderCatalogError, match=\\\"different account\\\"):\\n+ normalize_discovered_model(source, wrong)\\n+\\n+ normalized = normalize_discovered_model(\\n+ source,\\n+ _model(source, \\\" model-a \\\", float(\\\"nan\\\")),\\n+ )\\n+ assert normalized.model_id == \\\"model-a\\\"\\n+ assert normalized.prompt_price_per_1k is None\\n+ assert normalized.completion_price_per_1k is None\\n+ assert normalized.currency_code == \\\"USD\\\"\\n+\\n+\\n+def test_underflowing_positive_price_is_rejected_not_treated_as_free() -> None:\\n+ \\\"\\\"\\\"A nonzero price that underflows to 0.0 in float must stay unknown.\\\"\\\"\\\"\\n+ source = _source()\\n+ normalized = normalize_discovered_model(\\n+ source, _model(source, \\\"underflow-model\\\", \\\"1e-10000\\\")\\n+ )\\n+ assert normalized.prompt_price_per_1k is None\\n+ assert normalized.completion_price_per_1k is None\\n+\\n+\\n+def test_overflowing_price_is_rejected_not_treated_as_infinite() -> None:\\n+ \\\"\\\"\\\"A Decimal-finite price whose float() conversion overflows to inf must stay unknown.\\\"\\\"\\\"\\n+ source = _source()\\n+ normalized = normalize_discovered_model(\\n+ source, _model(source, \\\"overflow-model\\\", \\\"1e10000\\\")\\n+ )\\n+ assert normalized.prompt_price_per_1k is None\\n+ assert normalized.completion_price_per_1k is None\\n+\\n+\\n+def test_unrecognized_currency_is_preserved_as_unknown_not_coerced_to_usd() -> None:\\n+ \\\"\\\"\\\"A priced model with an unverifiable currency must not rank as comparable USD.\\\"\\\"\\\"\\n+ source = _source()\\n+ garbage_currency = replace(\\n+ _model(source, \\\"mystery-currency-model\\\"), currency_code=\\\"not a currency\\\"\\n+ )\\n+ normalized = normalize_discovered_model(source, garbage_currency)\\n+ assert normalized.prompt_price_per_1k == 1.0\\n+ assert normalized.currency_code != \\\"USD\\\"\\n+ assert not _currency_is_comparable(normalized.currency_code, \\\"USD\\\")\\n+\\n+\\n+def test_success_replaces_current_rows_and_failure_keeps_last_known_good() -> None:\\n+ \\\"\\\"\\\"A failed refresh cannot erase the last successful serving model set.\\\"\\\"\\\"\\n+ store = InMemoryProviderCatalogStore()\\n+ source = _source()\\n+ store.record_success(\\n+ source,\\n+ [_model(source, \\\"model-a\\\"), _model(source, \\\"model-b\\\")],\\n+ eligible_model_ids={\\\"model-a\\\"},\\n+ serving_tags={\\\"model-a\\\": (\\\"discovered\\\", \\\"chat\\\", \\\"chat\\\")},\\n+ )\\n+ assert [model.model_id for model in store.serving_models(source)] == [\\n+ \\\"model-a\\\"\\n+ ]\\n+ assert store.serving_tags(source, \\\"model-a\\\") == (\\\"discovered\\\", \\\"chat\\\")\\n+\\n+ store.record_failure(source, error_code=\\\"provider_timeout: secret-token\\\")\\n+ assert [model.model_id for model in store.serving_models(source)] == [\\n+ \\\"model-a\\\"\\n+ ]\\n+ assert store.refresh_evidence()[-1].error_code == \\\"unknown_error\\\"\\n+\\n+ store.record_success(\\n+ source,\\n+ [_model(source, \\\"model-c\\\")],\\n+ eligible_model_ids={\\\"model-c\\\"},\\n+ serving_tags={\\\"model-c\\\": (\\\"discovered\\\", \\\"chat\\\")},\\n+ )\\n+ assert [model.model_id for model in store.serving_models(source)] == [\\n+ \\\"model-c\\\"\\n+ ]\\n+ assert [item.refresh_status for item in store.refresh_evidence()] == [\\n+ \\\"succeeded\\\",\\n+ \\\"failed\\\",\\n+ \\\"succeeded\\\",\\n+ ]\\n+\\n+\\n+class _FakeCursor:\\n+ \\\"\\\"\\\"Minimal DB-API cursor recording parameterized catalog statements.\\\"\\\"\\\"\\n+\\n+ def __init__(self, rows=None) -> None:\\n+ self.calls: list[tuple[str, object]] = []\\n+ self.rows = list(rows or [])\\n+\\n+ def __enter__(self):\\n+ return self\\n+\\n+ def __exit__(self, *_args) -> None:\\n+ return None\\n+\\n+ def execute(self, statement: str, params=None) -> None:\\n+ self.calls.append((statement, params))\\n+\\n+ def fetchall(self):\\n+ return list(self.rows)\\n+\\n+\\n+class _FakeConnection:\\n+ \\\"\\\"\\\"Minimal transaction object exercising the PostgreSQL adapter.\\\"\\\"\\\"\\n+\\n+ def __init__(self, rows=None) -> None:\\n+ self.cursor_object = _FakeCursor(rows)\\n+ self.commits = 0\\n+\\n+ def __enter__(self):\\n+ return self\\n+\\n+ def __exit__(self, *_args) -> None:\\n+ return None\\n+\\n+ def cursor(self):\\n+ return self.cursor_object\\n+\\n+ def commit(self) -> None:\\n+ self.commits += 1\\n+\\n+\\n+def test_postgres_success_is_parameterized_and_failure_does_not_disable_lkg() -> None:\\n+ \\\"\\\"\\\"PostgreSQL success replaces rows; failure records evidence only.\\\"\\\"\\\"\\n+ source = _source()\\n+ connections: list[_FakeConnection] = []\\n+\\n+ def factory():\\n+ connection = _FakeConnection()\\n+ connections.append(connection)\\n+ return connection\\n+\\n+ store = PostgresProviderCatalogStore(\\n+ \\\"postgresql://catalog.example/db\\\",\\n+ connection_factory=factory,\\n+ )\\n+ store.record_success(\\n+ source,\\n+ [_model(source, \\\"model-a\\\")],\\n+ eligible_model_ids={\\\"model-a\\\"},\\n+ serving_tags={\\\"model-a\\\": (\\\"discovered\\\", \\\"chat\\\")},\\n+ )\\n+ success_sql = \\\"\\\\n\\\".join(\\n+ statement for statement, _params in connections[-1].cursor_object.calls\\n+ )\\n+ assert \\\"UPDATE provider_model SET enabled_flag = false\\\" in success_sql\\n+ assert \\\"INSERT INTO model_serving_tag\\\" in success_sql\\n+ assert connections[-1].commits >= 1\\n+\\n+ store.record_failure(source, error_code=\\\"provider_timeout: secret-token\\\")\\n+ failure_sql = \\\"\\\\n\\\".join(\\n+ statement for statement, _params in connections[-1].cursor_object.calls\\n+ )\\n+ assert \\\"UPDATE provider_model SET enabled_flag = false\\\" not in failure_sql\\n+ assert \\\"INSERT INTO catalog_refresh_run\\\" in failure_sql\\n+ assert store.refresh_evidence()[-1].error_code == \\\"unknown_error\\\"\\n+\\n+\\n+def test_postgres_success_clears_tags_account_wide_not_per_current_model() -> None:\\n+ \\\"\\\"\\\"A model absent from a fresh refresh cannot leave orphaned serving_tag rows.\\\"\\\"\\\"\\n+ source = _source()\\n+ connection = _FakeConnection()\\n+ store = PostgresProviderCatalogStore(\\n+ \\\"postgresql://catalog.example/db\\\",\\n+ connection_factory=lambda: connection,\\n+ )\\n+ store.record_success(\\n+ source,\\n+ [_model(source, \\\"model-a\\\")],\\n+ eligible_model_ids={\\\"model-a\\\"},\\n+ serving_tags={\\\"model-a\\\": (\\\"discovered\\\", \\\"chat\\\")},\\n+ )\\n+ statements = [statement for statement, _params in connection.cursor_object.calls]\\n+ tag_delete_index = next(\\n+ i for i, s in enumerate(statements) if \\\"DELETE FROM model_serving_tag\\\" in s\\n+ )\\n+ tag_insert_index = next(\\n+ i for i, s in enumerate(statements) if \\\"INSERT INTO model_serving_tag\\\" in s\\n+ )\\n+ assert \\\"WHERE provider_model_id IN\\\" in statements[tag_delete_index]\\n+ assert \\\"WHERE provider_account_id = %s\\\" in statements[tag_delete_index]\\n+ assert tag_delete_index < tag_insert_index\\n+ assert statements.count(\\n+ \\\"DELETE FROM model_serving_tag WHERE provider_model_id = %s\\\"\\n+ ) == 0\\n+\\n+\\n+def test_postgres_serving_models_reconstructs_account_scoped_rows() -> None:\\n+ \\\"\\\"\\\"Read-side rows become normalized DiscoveredModel records.\\\"\\\"\\\"\\n+ source = _source(provider=\\\"openrouter\\\", credential=\\\"OPENROUTER_API_KEY\\\")\\n+ connection = _FakeConnection(\\n+ [\\n+ (\\n+ \\\"model-b\\\",\\n+ source.chat_base_url,\\n+ \\\"Bearer\\\",\\n+ Decimal(\\\"0.25\\\"),\\n+ Decimal(\\\"0.50\\\"),\\n+ \\\"usd\\\",\\n+ )\\n+ ]\\n+ )\\n+ store = PostgresProviderCatalogStore(\\n+ \\\"postgresql://catalog.example/db\\\",\\n+ connection_factory=lambda: connection,\\n+ )\\n+ assert store.serving_models(source) == [\\n+ DiscoveredModel(\\n+ provider_name=\\\"openrouter\\\",\\n+ model_id=\\\"model-b\\\",\\n+ credential_name=\\\"OPENROUTER_API_KEY\\\",\\n+ chat_base_url=source.chat_base_url,\\n+ auth_scheme=\\\"Bearer\\\",\\n+ prompt_price_per_1k=0.25,\\n+ completion_price_per_1k=0.5,\\n+ currency_code=\\\"USD\\\",\\n+ )\\n+ ]\\n+ query, params = connection.cursor_object.calls[-1]\\n+ assert \\\"JOIN provider_account AS pa\\\" in query\\n+ assert \\\"serving_eligible_flag = true\\\" in query\\n+ assert params == (provider_account_id(source),)\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover\\n+ raise SystemExit(pytest.main([__file__]))\" } ]"