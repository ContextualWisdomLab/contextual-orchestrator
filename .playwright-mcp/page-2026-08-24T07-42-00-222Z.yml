unpriced candidate costs ``0``\\n under that selector's documented contract and is treated as free, not\\n unknown -- so a genuinely unpriced provider (e.g. Bytez, priced by\\n GPU-second rather than per token) will always look cheapest here. Fine for\\n \\\"auto-pick something free to try,\\\" but callers doing real cost comparison\\n should refresh pricing for every candidate they care about first.\\n \\\"\\\"\\\"\\n- if not discovered:\\n- return None\\n- candidates = [{\\\"provider\\\": model.provider_name, \\\"model\\\": model.model_id} for model in discovered]\\n- winner = cheapest_upstream(candidates, price_book)\\n- if winner is None:\\n+ eligible = [model for model in discovered if is_general_chat_agent_model_id(model.model_id)]\\n+ if not eligible:\\n return None\\n- for model in discovered:\\n- if model.provider_name == winner[\\\"provider\\\"] and model.model_id == winner[\\\"model\\\"]:\\n- return model\\n- return None # pragma: no cover - winner always comes from candidates\\n+ return min(eligible, key=lambda model: _discovered_cost(model, price_book))\\n \\n \\n def select_top_n_cheapest_discovered_agents(\\n discovered: list[DiscoveredModel], price_book: \\\"PriceBook\\\", limit: int\\n ) -> list[DiscoveredModel]:\\n- \\\"\\\"\\\"Return the ``limit`` lowest-cost discovered models, cheapest first.\\n-\\n- For bootstrapping a CI sidecar (or any first-boot pool) with more than one\\n- enabled agent for failover, without hand-picking which discovered models to\\n- trust. Same pricing contract as :func:`select_cheapest_discovered_agent`.\\n- \\\"\\\"\\\"\\n- if limit <= 0 or not discovered:\\n+ \\\"\\\"\\\"Return the ``limit`` cheapest general chat-agent models in ascending cost.\\\"\\\"\\\"\\n+ if limit <= 0:\\n+ return []\\n+ eligible = [model for model in discovered if is_general_chat_agent_model_id(model.model_id)]\\n+ if not eligible:\\n return []\\n \\n- def _cost(model: DiscoveredModel) -> float:\\n- cost, _currency = price_book.compute_cost(model.provider_name, model.model_id, 1000, 1000)\\n- return cost\\n+ return sorted(eligible, key=lambda model: _discovered_cost(model, price_book))[:limit]\\n+\\n \\n- return sorted(discovered, key=_cost)[:limit]\\n+def _discovered_cost(model: DiscoveredModel, price_book: \\\"PriceBook\\\") -> float:\\n+ \\\"\\\"\\\"Price the representative discovery request used by both selectors.\\\"\\\"\\\"\\n+ cost, _currency = price_book.compute_cost(model.provider_name, model.model_id, 1000, 1000)\\n+ return cost\" }, { \"sha\": \"e68751645623a9fac0b4aec022f1829fdabe4db4\", \"filename\": \"contextual_orchestrator/orchestrator.py\", \"status\": \"modified\", \"additions\": 1414, \"deletions\": 249, \"changes\": 1663, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Forchestrator.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Forchestrator.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Forchestrator.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\" }, { \"sha\": \"328be1c492124de845dcc54798fda4b595bc0a8b\", \"filename\": \"contextual_orchestrator/passthrough_failover.py\", \"status\": \"added\", \"additions\": 151, \"deletions\": 0, \"changes\": 151, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Fpassthrough_failover.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Fpassthrough_failover.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Fpassthrough_failover.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,151 @@\\n+\\\"\\\"\\\"Bounded cross-provider failover for OpenAI-compatible passthrough requests.\\n+\\n+Tool calls, structured responses, and Responses API calls must preserve one\\n+provider's raw response shape. This module keeps that contract while advancing\\n+to another capability-ranked model when the caller selected the virtual\\n+``contextual-orchestrator`` model and an upstream candidate becomes transiently\\n+unavailable.\\n+\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import time\\n+import urllib.error\\n+from collections.abc import Iterator\\n+from typing import Any\\n+\\n+from .orchestrator import (\\n+ ModelAgent,\\n+ ModelClient,\\n+ is_transient_error,\\n+)\\n+from .orchestrator import (\\n+ TaskOrchestrator as BaseTaskOrchestrator,\\n+)\\n+\\n+_CANDIDATE_UNAVAILABLE_HTTP_STATUS = frozenset({404, 410})\\n+_MAX_PROVIDER_ERROR_CHAIN_DEPTH = 8\\n+\\n+\\n+def _provider_error_chain(error: BaseException) -> Iterator[BaseException]:\\n+ \\\"\\\"\\\"Yield a bounded, cycle-safe provider exception cause/context chain.\\n+\\n+ An explicit ``raise ... from cause`` is authoritative. An implicit context\\n+ is inspected only when it was not deliberately suppressed with\\n+ ``raise ... from None``; suppressed history must not turn a terminal wrapper\\n+ into an adaptive fallback signal.\\n+ \\\"\\\"\\\"\\n+ current: BaseException | None = error\\n+ seen: set[int] = set()\\n+ for _ in range(_MAX_PROVIDER_ERROR_CHAIN_DEPTH):\\n+ if current is None or id(current) in seen:\\n+ return\\n+ seen.add(id(current))\\n+ yield current\\n+ if current.__cause__ is not None:\\n+ current = current.__cause__\\n+ elif current.__suppress_context__:\\n+ return\\n+ else:\\n+ current = current.__context__\\n+\\n+\\n+def _is_adaptive_failover_error(error: BaseException) -> bool:\\n+ \\\"\\\"\\\"Classify transient or stale-candidate failures through provider wrappers.\\\"\\\"\\\"\\n+ for candidate in _provider_error_chain(error):\\n+ if is_transient_error(candidate):\\n+ return True\\n+ if (\\n+ isinstance(candidate, urllib.error.HTTPError)\\n+ and candidate.code in _CANDIDATE_UNAVAILABLE_HTTP_STATUS\\n+ ):\\n+ return True\\n+ return False\\n+\\n+\\n+def _proxy_send_once(\\n+ client: Any,\\n+ agent: ModelAgent,\\n+ endpoint: str,\\n+ payload: dict[str, Any],\\n+) -> dict[str, Any]:\\n+ \\\"\\\"\\\"Send one raw passthrough attempt without same-model transient retries.\\\"\\\"\\\"\\n+ one_shot = getattr(client, \\\"proxy_send_once\\\", None)\\n+ if callable(one_shot):\\n+ return one_shot(agent, endpoint, payload)\\n+ if isinstance(client, ModelClient):\\n+ return client.proxy_send_once(agent, endpoint, payload)\\n+ return client.proxy_send(agent, endpoint, payload)\\n+\\n+\\n+class TaskOrchestrator(BaseTaskOrchestrator):\\n+ \\\"\\\"\\\"Add bounded provider failover to the final OpenAI-compatible provider call.\\\"\\\"\\\"\\n+\\n+ def _proxy_provider_completion(\\n+ self,\\n+ agent: ModelAgent,\\n+ endpoint: str,\\n+ payload: dict[str, Any],\\n+ *,\\n+ requested_model: Any,\\n+ text: str,\\n+ role: str,\\n+ required_tags: tuple[str, ...] = (),\\n+ ) -> dict[str, Any]:\\n+ \\\"\\\"\\\"Preserve response shapes while failing over only adaptive requests.\\n+\\n+ An explicitly requested concrete model remains sticky and receives its\\n+ original provider error: serving another model would violate the caller's\\n+ model contract. Requests for the virtual ``contextual-orchestrator``\\n+ model, or requests that omit ``model``, may advance through\\n+ capability-ranked candidates for transient upstream failures and for a\\n+ discovered model that has become unavailable (HTTP 404/410). Provider\\n+ SDK wrapper causes are inspected through a bounded, cycle-safe chain.\\n+\\n+ Every candidate receives at most one passthrough attempt, so a 429 is\\n+ never amplified by replaying the same large tool request. Caller,\\n+ authentication, policy, and other non-transient failures are returned\\n+ immediately instead of being replayed to another provider.\\n+ \\\"\\\"\\\"\\n+ requested_agent = self._requested_agent(requested_model)\\n+ adaptive_request = requested_agent is None\\n+ if requested_agent is not None:\\n+ if requested_agent.disabled:\\n+ raise RuntimeError(f\\\"requested model {requested_model!r} is disabled\\\")\\n+ return self.client.proxy_send(requested_agent, endpoint, payload)\\n+ else:\\n+ candidates = self._failover_candidates(\\n+ agent,\\n+ text,\\n+ role,\\n+ required_tags=required_tags,\\n+ )\\n+\\n+ last_error: Exception | None = None\\n+ for candidate_agent in candidates:\\n+ upstream = dict(payload)\\n+ upstream[\\\"model\\\"] = candidate_agent.model\\n+ try:\\n+ result = _proxy_send_once(self.client, candidate_agent, endpoint, upstream)\\n+ except Exception as exc:\\n+ if not adaptive_request or not _is_adaptive_failover_error(exc):\\n+ raise\\n+ last_error = exc\\n+ self._record_failure(candidate_agent.id)\\n+ with self._circuit_lock:\\n+ state = self._circuit.setdefault(\\n+ candidate_agent.id,\\n+ {\\\"failures\\\": 0.0, \\\"opened_at\\\": 0.0},\\n+ )\\n+ state[\\\"failures\\\"] = max(\\n+ state[\\\"failures\\\"],\\n+ float(self.circuit_failure_threshold),\\n+ )\\n+ state[\\\"opened_at\\\"] = time.monotonic()\\n+ continue\\n+ self._record_success(candidate_agent.id)\\n+ return result\\n+\\n+ raise RuntimeError(\\n+ f\\\"all {len(candidates)} candidate agents failed for passthrough endpoint={endpoint}\\\"\\n+ ) from last_error\" }, { \"sha\": \"bf2230a8fee707a1d9963c3c5db1d2e514d086d3\", \"filename\": \"contextual_orchestrator/server.py\", \"status\": \"modified\", \"additions\": 531, \"deletions\": 129, \"changes\": 660, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Fserver.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Fserver.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Fserver.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -6,7 +6,10 @@\\n from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\\n import base64\\n import json\\n+import logging\\n+import math\\n import secrets\\n+import socket\\n import struct\\n import threading\\n import time\\n@@ -24,14 +27,28 @@\\n MAX_LOCAL_CONCURRENCY,\\n TaskOrchestrator,\\n _new_chat_completion_id,\\n+ _responses_usage,\\n chat_completion_chunks,\\n chat_completion_response,\\n+ _responses_to_chat_payload,\\n text_completion_response,\\n redact_value,\\n sse_stream_body,\\n )\\n+from .telemetry import (\\n+ attach_trace_context,\\n+ configure_telemetry,\\n+ current_session_id,\\n+ detach_trace_context,\\n+ reset_session_id,\\n+ session_id_from_headers,\\n+ session_id_from_metadata,\\n+ set_session_id,\\n+)\\n+\\n+_LOGGER = logging.getLogger(__name__)\\n \\n-# OpenAI request params forwarded verbatim to the provider on passthrough.\\n+# OpenAI request params forwarded to the final provider after orchestration.\\n OPENAI_PASSTHROUGH_PARAM_KEYS = {\\n \\\"temperature\\\", \\\"top_p\\\", \\\"max_tokens\\\", \\\"max_completion_tokens\\\", \\\"n\\\", \\\"stop\\\",\\n \\\"seed\\\", \\\"presence_penalty\\\", \\\"frequency_penalty\\\", \\\"logit_bias\\\", \\\"logprobs\\\",\\n@@ -50,8 +67,8 @@\\n # Assistants-style tool_resources — named unsupported (not unknown_fields).\\n \\\"tool_resources\\\",\\n }\\n-# Provider features the multi-agent verifier cannot merge -> single-agent passthrough.\\n-PASSTHROUGH_TRIGGER_KEYS = {\\\"response_format\\\", \\\"tools\\\", \\\"tool_choice\\\", \\\"functions\\\", \\\"function_call\\\"}\\n+# Tool calls still require provider-native loop semantics; structured JSON is\\n+# orchestrated through the conduct+synthesis path below instead of passthrough.\\n ALLOWED_CHAT_KEYS = {\\n \\\"model\\\", \\\"messages\\\", \\\"orchestration\\\",