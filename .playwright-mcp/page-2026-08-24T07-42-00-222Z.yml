b/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_multimodal_required_tag_boundary.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_multimodal_required_tag_boundary.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_multimodal_required_tag_boundary.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,55 @@\\n+\\\"\\\"\\\"Regression for enforcing multimodal capability at the invocation boundary.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import pytest\\n+\\n+from contextual_orchestrator import ModelAgent, TaskOrchestrator\\n+\\n+\\n+class _RecordingClient:\\n+ \\\"\\\"\\\"Record which synthetic agent the invocation boundary actually calls.\\\"\\\"\\\"\\n+\\n+ def __init__(self) -> None:\\n+ self.calls: list[str] = []\\n+\\n+ def chat(self, agent: ModelAgent, _messages, **_kwargs) -> str:\\n+ self.calls.append(agent.id)\\n+ return agent.id\\n+\\n+\\n+def test_required_tags_filter_an_ineligible_explicit_primary() -> None:\\n+ \\\"\\\"\\\"A stale or direct caller cannot smuggle a text-only primary into image work.\\\"\\\"\\\"\\n+ text_agent = ModelAgent(\\n+ \\\"text_agent\\\",\\n+ \\\"text-model\\\",\\n+ tags=(\\\"reasoning\\\", \\\"writing\\\"),\\n+ priority=100,\\n+ )\\n+ vision_agent = ModelAgent(\\n+ \\\"vision_agent\\\",\\n+ \\\"vision-model\\\",\\n+ tags=(\\\"vision\\\", \\\"reasoning\\\", \\\"writing\\\"),\\n+ priority=1,\\n+ )\\n+ client = _RecordingClient()\\n+ orchestrator = TaskOrchestrator(\\n+ [text_agent, vision_agent],\\n+ client=client,\\n+ )\\n+\\n+ answer, served_agent_id, _usage = orchestrator._invoke(\\n+ text_agent,\\n+ [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Inspect the source image.\\\"}],\\n+ text=\\\"Inspect the source image.\\\",\\n+ role=\\\"worker\\\",\\n+ required_tags=(\\\"vision\\\",),\\n+ )\\n+\\n+ assert answer == \\\"vision_agent\\\"\\n+ assert served_agent_id == \\\"vision_agent\\\"\\n+ assert client.calls == [\\\"vision_agent\\\"]\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover\\n+ raise SystemExit(pytest.main([__file__]))\" }, { \"sha\": \"8c20551b4605434f0d0de65e3555f26de617dad4\", \"filename\": \"tests/test_multimodal_workflow_evidence.py\", \"status\": \"added\", \"additions\": 162, \"deletions\": 0, \"changes\": 162, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_multimodal_workflow_evidence.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_multimodal_workflow_evidence.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_multimodal_workflow_evidence.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,162 @@\\n+from __future__ import annotations\\n+\\n+from pathlib import Path\\n+import sys\\n+\\n+import pytest\\n+\\n+sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\n+\\n+from contextual_orchestrator import ModelAgent, TaskOrchestrator # noqa: E402\\n+from contextual_orchestrator.orchestrator import _responses_to_chat_payload # noqa: E402\\n+\\n+\\n+IMAGE_PART = {\\n+ \\\"type\\\": \\\"image_url\\\",\\n+ \\\"image_url\\\": {\\n+ \\\"url\\\": \\\"data:image/png;base64,c3ludGhldGljLWZpeHR1cmU=\\\",\\n+ \\\"detail\\\": \\\"high\\\",\\n+ },\\n+}\\n+\\n+\\n+class RecordingClient:\\n+ \\\"\\\"\\\"Record synthetic provider calls without contacting a model.\\\"\\\"\\\"\\n+\\n+ def __init__(self, failing_agent_id: str | None = None) -> None:\\n+ self.failing_agent_id = failing_agent_id\\n+ self.calls: list[tuple[str, list[dict[str, object]]]] = []\\n+\\n+ def chat(self, agent: ModelAgent, messages, temperature: float = 0.2) -> str:\\n+ \\\"\\\"\\\"Return deterministic output, or fail the selected synthetic agent.\\\"\\\"\\\"\\n+ self.calls.append((agent.id, messages))\\n+ if agent.id == self.failing_agent_id:\\n+ raise RuntimeError(\\\"synthetic provider failure\\\")\\n+ return f\\\"{agent.id}:{len(self.calls)}\\\"\\n+\\n+\\n+def test_conduct_preserves_source_images_for_every_evidence_step() -> None:\\n+ client = RecordingClient()\\n+ orchestrator = TaskOrchestrator(\\n+ [ModelAgent(\\\"vision_agent\\\", \\\"mock-vision\\\", tags=(\\\"vision\\\",))],\\n+ client=client,\\n+ )\\n+\\n+ result = orchestrator.conduct(\\n+ [{\\\"role\\\": \\\"user\\\", \\\"content\\\": [{\\\"type\\\": \\\"text\\\", \\\"text\\\": \\\"Read the table.\\\"}, IMAGE_PART]}]\\n+ )\\n+\\n+ assert result[\\\"mode\\\"] == \\\"conduct\\\"\\n+ assert len(client.calls) == 4\\n+ for agent_id, messages in client.calls:\\n+ assert agent_id == \\\"vision_agent\\\"\\n+ content = messages[-1][\\\"content\\\"]\\n+ assert isinstance(content, list)\\n+ assert content[-1] == IMAGE_PART\\n+ assert \\\"data:image\\\" not in content[0][\\\"text\\\"]\\n+\\n+\\n+def test_image_route_failover_never_uses_a_text_only_agent() -> None:\\n+ client = RecordingClient(failing_agent_id=\\\"vision_primary\\\")\\n+ orchestrator = TaskOrchestrator(\\n+ [\\n+ ModelAgent(\\\"text_agent\\\", \\\"mock-text\\\", tags=(\\\"reasoning\\\",), priority=100),\\n+ ModelAgent(\\\"vision_primary\\\", \\\"mock-vision-primary\\\", tags=(\\\"vision\\\",), priority=20),\\n+ ModelAgent(\\\"vision_backup\\\", \\\"mock-vision-backup\\\", tags=(\\\"vision\\\",), priority=10),\\n+ ],\\n+ client=client,\\n+ )\\n+\\n+ result = orchestrator.route_once(\\n+ [{\\\"role\\\": \\\"user\\\", \\\"content\\\": [{\\\"type\\\": \\\"text\\\", \\\"text\\\": \\\"Read the image.\\\"}, IMAGE_PART]}]\\n+ )\\n+\\n+ assert result[\\\"answer\\\"].startswith(\\\"vision_backup:\\\")\\n+ assert [agent_id for agent_id, _ in client.calls] == [\\\"vision_primary\\\", \\\"vision_backup\\\"]\\n+\\n+\\n+def test_image_route_fails_before_io_without_a_vision_agent() -> None:\\n+ client = RecordingClient()\\n+ orchestrator = TaskOrchestrator(\\n+ [ModelAgent(\\\"text_agent\\\", \\\"mock-text\\\", tags=(\\\"reasoning\\\",))],\\n+ client=client,\\n+ )\\n+\\n+ with pytest.raises(RuntimeError, match=\\\"required tags.*vision\\\"):\\n+ orchestrator.route_once(\\n+ [{\\\"role\\\": \\\"user\\\", \\\"content\\\": [{\\\"type\\\": \\\"text\\\", \\\"text\\\": \\\"Read it.\\\"}, IMAGE_PART]}]\\n+ )\\n+\\n+ assert client.calls == []\\n+\\n+\\n+def test_responses_input_image_is_normalized_for_chat_orchestration() -> None:\\n+ payload = _responses_to_chat_payload(\\n+ {\\n+ \\\"model\\\": \\\"contextual-orchestrator\\\",\\n+ \\\"input\\\": [\\n+ {\\n+ \\\"type\\\": \\\"message\\\",\\n+ \\\"role\\\": \\\"user\\\",\\n+ \\\"content\\\": [\\n+ {\\\"type\\\": \\\"input_text\\\", \\\"text\\\": \\\"Read the table.\\\"},\\n+ {\\n+ \\\"type\\\": \\\"input_image\\\",\\n+ \\\"image_url\\\": \\\"data:image/png;base64,c3ludGhldGljLWZpeHR1cmU=\\\",\\n+ \\\"detail\\\": \\\"high\\\",\\n+ },\\n+ ],\\n+ }\\n+ ],\\n+ }\\n+ )\\n+\\n+ assert payload[\\\"messages\\\"] == [\\n+ {\\n+ \\\"role\\\": \\\"user\\\",\\n+ \\\"content\\\": [\\n+ {\\\"type\\\": \\\"text\\\", \\\"text\\\": \\\"Read the table.\\\"},\\n+ IMAGE_PART,\\n+ ],\\n+ }\\n+ ]\\n+\\n+\\n+def test_responses_input_image_requires_a_url() -> None:\\n+ with pytest.raises(ValueError, match=\\\"image_url\\\"):\\n+ _responses_to_chat_payload(\\n+ {\\n+ \\\"input\\\": [\\n+ {\\n+ \\\"type\\\": \\\"message\\\",\\n+ \\\"role\\\": \\\"user\\\",\\n+ \\\"content\\\": [{\\\"type\\\": \\\"input_image\\\", \\\"file_id\\\": \\\"synthetic-file\\\"}],\\n+ }\\n+ ]\\n+ }\\n+ )\\n+\\n+\\n+def test_responses_image_detail_is_normalized_or_rejected() -> None:\\n+ request = {\\n+ \\\"input\\\": [\\n+ {\\n+ \\\"type\\\": \\\"message\\\",\\n+ \\\"role\\\": \\\"user\\\",\\n+ \\\"content\\\": [\\n+ {\\n+ \\\"type\\\": \\\"input_image\\\",\\n+ \\\"image_url\\\": {\\\"url\\\": \\\"https://example.invalid/synthetic.png\\\", \\\"detail\\\": None},\\n+ }\\n+ ],\\n+ }\\n+ ]\\n+ }\\n+\\n+ assert _responses_to_chat_payload(request)[\\\"messages\\\"][0][\\\"content\\\"][0] == {\\n+ \\\"type\\\": \\\"image_url\\\",\\n+ \\\"image_url\\\": {\\\"url\\\": \\\"https://example.invalid/synthetic.png\\\"},\\n+ }\\n+ request[\\\"input\\\"][0][\\\"content\\\"][0][\\\"image_url\\\"][\\\"detail\\\"] = \\\"pixel-perfect\\\"\\n+ with pytest.raises(ValueError, match=\\\"detail\\\"):\\n+ _responses_to_chat_payload(request)\" }, { \"sha\": \"ea97f5f1c2b36370a0d16412b0d74a5401476a12\", \"filename\": \"tests/test_openai_passthrough.py\", \"status\": \"modified\", \"additions\": 888, \"deletions\": 25, \"changes\": 913, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_openai_passthrough.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_openai_passthrough.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_openai_passthrough.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -1,9 +1,4 @@\\n-\\\"\\\"\\\"Full OpenAI passthrough: response_format / tools / the Responses API.\\n-\\n-Requests carrying provider features the multi-agent verifier cannot merge are\\n-proxied to one agent so the full provider response shape survives, while plain\\n-prompts keep the orchestration (routing/verification) path.\\n-\\\"\\\"\\\"\\n+\\\"\\\"\\\"OpenAI provider features remain inside multi-agent orchestration.\\\"\\\"\\\"\\n \\n from __future__ import annotations\\n \\n@@ -12,30 +7,101 @@\\n import threading\\n import urllib.error\\n import urllib.request\\n+from concurrent.futures import ThreadPoolExecutor\\n from pathlib import Path\\n+from unittest.mock import patch\\n \\n import pytest\\n \\n sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\n \\n from contextual_orchestrator import ModelAgent, TaskOrchestrator # noqa: E402\\n-from contextual_orchestrator.server import SecurityConfig, build_server, responses_sse_body # noqa: E402\\n+from contextual_orchestrator.orchestrator import ( # noqa: E402\\n+ BudgetExceededError,\\n+ _FastMLSIJudgeAdapter,\\n+ _responses_to_chat_payload,\\n+ _responses_text_format_to_chat_response_format,\\n+ estimate_tokens,\\n+)\\n+from contextual_orchestrator.server import ( # noqa: E402\\n+ SecurityConfig,\\n+ build_server,\\n+ responses_sse_body,\\n+)\\n \\n \\n-def _build() -> TaskOrchestrator:\\n+def _build(*, budget_max_output_tokens: int | None = None) -> TaskOrchestrator:\\n return TaskOrchestrator(\\n agents=[\\n- ModelAgent(\\\"planner_agent\\\", \\\"mock-planner\\\", tags=(\\\"planning\\\", \\\"reasoning\\\")),\\n+ ModelAgent(\\\"planner_agent\\\", \\\"mock-planner\\\", tags=(\\\"planning\\\", \\\"reasoning\\\", \\\"vision\\\")),\\n ModelAgent(\\\"disabled_builder_duplicate\\\", \\\"mock-builder\\\", disabled=True),\\n ModelAgent(\\\"builder_agent\\\", \\\"mock-builder\\\", tags=(\\\"coding\\\", \\\"implementation\\\")),\\n ModelAgent(\\\"reviewer_agent\\\", \\\"mock-reviewer\\\", tags=(\\\"verification\\\", \\\"review\\\")),\\n ModelAgent(\\\"disabled_candidate\\\", \\\"disabled-model\\\", disabled=True),\\n- ]\\n+ ],\\n+ budget_max_output_tokens=budget_max_output_tokens,\\n )\\n \\n \\n # -- orchestrator-level ------------------------------------------------------\\n \\n+def test_responses_translation_preserves_input_image_content() -> None:\\n+ translated = _responses_to_chat_payload(\\n+ {\\n+ \\\"model\\\": \\\"mock-planner\\\",\\n+ \\\"input\\\": [\\n+ {\\n+ \\\"type\\\": \\\"message\\\",\\n+ \\\"role\\\": \\\"user\\\",\\n+ \\\"content\\\": [\\n+ {\\\"type\\\": \\\"input_text\\\", \\\"text\\\": \\\"Inspect this image\\\"},\\n+ {\\n+ \\\"type\\\": \\\"input_image\\\",\\n+ \\\"image_url\\\": \\\"data:image/png;base64,AA==\\\",\\n+ \\\"detail\\\": \\\"high\\\",\\n+ },\\n+ ],\\n+ }\\n+ ],\\n+ }\\n+ )\\n+\\n+ assert translated[\\\"messages\\\"] == [\\n+ {\\n+ \\\"role\\\": \\\"user\\\",\\n+ \\\"content\\\": [\\n+ {\\\"type\\\": \\\"text\\\", \\\"text\\\": \\\"Inspect this image\\\"},\\n+ {\\n+ \\\"type\\\": \\\"image_url\\\",\\n+ \\\"image_url\\\": {\\n+ \\\"url\\\": \\\"data:image/png;base64,AA==\\\",\\n+ \\\"detail\\\": \\\"high\\\",\\n+ },\\n+ },\\n+ ],\\n+ }\\n+ ]\\n+\\n+\\n+def test_final_synthesis_attaches_private_evidence_to_latest_user_turn() -> None:\\n+ result = _build().proxy_completion(\\n+ {\\n+ \\\"model\\\": \\\"mock-planner\\\",\\n+ \\\"messages\\\": [\\n+ {\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Earlier question\\\"},\\n+ {\\\"role\\\": \\\"assistant\\\", \\\"content\\\": \\\"Earlier answer\\\"},\\n+ {\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Current task\\\"},\\n+ ],\\n+ \\\"response_format\\\": {\\\"type\\\": \\\"json_object\\\"},\\n+ }\\n+ )\\n+\\n+ messages = result[\\\"echo\\\"][\\\"messages\\\"]\\n+ assert messages[0][\\\"content\\\"] == \\\"Earlier question\\\"\\n+ assert messages[2][\\\"content\\\"].startswith(\\\"Current task\\\")\\n+ assert \\\"Verified workflow evidence\\\" in messages[2][\\\"content\\\"]\\n+\\n+\\n def test_proxy_completion_forwards_response_format_and_returns_full_shape() -> None:\\n orch = _build()\\n body = {\\n@@ -55,6 +121,8 @@ def test_proxy_completion_forwards_response_format_and_returns_full_shape() -> N\\n assert \\\"mode\\\" not in result[\\\"echo\\\"]\\n # model overridden to the selected agent's model.\\n assert result[\\\"model\\\"] in {\\\"mock-planner\\\", \\\"mock-builder\\\", \\\"mock-reviewer\\\"}\\n+ assert result[\\\"orchestration\\\"][\\\"mode\\\"] == \\\"conduct\\\"\\n+ assert result[\\\"orchestration\\\"][\\\"agent_count\\\"] == 4\\n \\n \\n def test_proxy_completion_forwards_tools() -> None:\\n@@ -64,6 +132,7 @@ def test_proxy_completion_forwards_tools() -> None:\\n {\\\"model\\\": \\\"mock-planner\\\", \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"call a tool\\\"}], \\\"tools\\\": tools}\\n )\\n assert result[\\\"echo\\\"][\\\"tools\\\"] == tools\\n+ assert result[\\\"orchestration\\\"][\\\"agent_count\\\"] == 4\\n \\n \\n def test_proxy_completion_honors_an_enabled_requested_worker_model() -> None:\\n@@ -104,6 +173,582 @@ def test_proxy_completion_rejects_disabled_and_malformed_requested_models() -> N\\n })\\n \\n \\n+def test_proxy_completion_blocks_before_structured_workflow_when_budget_is_exceeded() -> None:\\n+ with pytest.raises(BudgetExceededError, match=\\\"spend budget exceeded\\\"):\\n+ _build(budget_max_output_tokens=0).proxy_completion(\\n+ {\\n+ \\\"model\\\": \\\"mock-planner\\\",\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"extract JSON\\\"}],\\n+ \\\"response_format\\\": {\\\"type\\\": \\\"json_object\\\"},\\n+ }\\n+ )\\n+\\n+\\n+def test_structured_budget_stops_before_the_next_workflow_provider_call() -> None:\\n+ orchestrator = _build(budget_max_output_tokens=1)\\n+\\n+ with (\\n+ patch.object(orchestrator.client, \\\"chat\\\", wraps=orchestrator.client.chat) as chat,\\n+ patch.object(orchestrator.client, \\\"proxy_send\\\", wraps=orchestrator.client.proxy_send) as send,\\n+ pytest.raises(BudgetExceededError, match=\\\"spend budget exceeded\\\"),\\n+ ):\\n+ orchestrator.proxy_completion(\\n+ {\\n+ \\\"model\\\": \\\"mock-planner\\\",\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"extract JSON\\\"}],\\n+ \\\"response_format\\\": {\\\"type\\\": \\\"json_object\\\"},\\n+ }\\n+ )\\n+\\n+ assert chat.call_count == 1\\n+ send.assert_not_called()\\n+\\n+\\n+def test_model_client_request_settings_are_thread_local() -> None:\\n+ client = _build().client\\n+ previous_temperature = client.default_temperature\\n+ barrier = threading.Barrier(2)\\n+\\n+ def read_settings(temperature: float, max_tokens: int) -> tuple[float, int]:\\n+ with client.request_settings(temperature=temperature, max_output_tokens=max_tokens):\\n+ barrier.wait(timeout=5)\\n+ values = (\\n+ client._request_setting(\\\"temperature\\\", client.default_temperature),\\n+ client._request_setting(\\\"max_output_tokens\\\", client.max_output_tokens),\\n+ )\\n+ barrier.wait(timeout=5)\\n+ return values\\n+\\n+ with ThreadPoolExecutor(max_workers=2) as executor:\\n+ futures = [\\n+ executor.submit(read_settings, 0.1, 11),\\n+ executor.submit(read_settings, 0.9, 29),\\n+ ]\\n+ assert {future.result() for future in futures} == {(0.1, 11), (0.9, 29)}\\n+\\n+ assert client.default_temperature == previous_temperature\\n+ assert client.max_output_tokens == 2048\\n+\\n+ with client.request_settings(temperature=0.3):\\n+ with client.request_settings(temperature=0.4):\\n+ assert client._request_setting(\\\"temperature\\\", None) == 0.4\\n+ assert client._request_setting(\\\"temperature\\\", None) == 0.3\\n+\\n+\\n+def test_plain_proxy_completion_persists_reported_usage_before_next_budget_check() -> None:\\n+ orch = _build(budget_max_output_tokens=3)\\n+ raw = {\\n+ \\\"id\\\": \\\"chatcmpl-accounted\\\",\\n+ \\\"object\\\": \\\"chat.completion\\\",\\n+ \\\"model\\\": \\\"mock-planner\\\",\\n+ \\\"choices\\\": [\\n+ {\\n+ \\\"index\\\": 0,\\n+ \\\"message\\\": {\\\"role\\\": \\\"assistant\\\", \\\"content\\\": \\\"accounted\\\"},\\n+ \\\"finish_reason\\\": \\\"stop\\\",\\n+ }\\n+ ],\\n+ \\\"usage\\\": {\\\"prompt_tokens\\\": 2, \\\"completion_tokens\\\": 3, \\\"total_tokens\\\": 5},\\n+ \\\"echo\\\": {},\\n+ }\\n+ body = {\\n+ \\\"model\\\": \\\"mock-planner\\\",\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"plain passthrough\\\"}],\\n+ }\\n+\\n+ with patch.object(orch.client, \\\"proxy_send\\\", return_value=raw) as send:\\n+ assert orch.proxy_completion(body)[\\\"id\\\"] == \\\"chatcmpl-accounted\\\"\\n+ analytics = orch.spend_analytics()\\n+ assert analytics[\\\"totals\\\"][\\\"run_count\\\"] == 1\\n+ assert analytics[\\\"budget\\\"][\\\"spent_output_tokens\\\"] == 3\\n+ assert analytics[\\\"by_model\\\"] == [\\n+ {\\n+ \\\"model\\\": \\\"mock-planner\\\",\\n+ \\\"estimated_output_tokens\\\": 3,\\n+ \\\"output_tokens\\\": 3,\\n+ \\\"usage_source\\\": \\\"reported\\\",\\n+ \\\"step_count\\\": 1,\\n+ \\\"price_per_million_usd\\\": None,\\n+ \\\"estimated_cost_usd\\\": None,\\n+ }\\n+ ]\\n+ with pytest.raises(BudgetExceededError, match=\\\"spend budget exceeded\\\"):\\n+ orch.proxy_completion(body)\\n+\\n+ assert send.call_count == 1\\n+\\n+\\n+def test_responses_tool_loop_usage_counts_toward_the_next_budget_check() -> None:\\n+ orch = _build(budget_max_output_tokens=3)\\n+ raw = {\\n+ \\\"id\\\": \\\"resp_accounted\\\",\\n+ \\\"object\\\": \\\"response\\\",\\n+ \\\"model\\\": \\\"mock-planner\\\",\\n+ \\\"output\\\": [\\n+ {\\n+ \\\"type\\\": \\\"function_call\\\",\\n+ \\\"call_id\\\": \\\"call_1\\\",\\n+ \\\"name\\\": \\\"lookup\\\",\\n+ \\\"arguments\\\": \\\"{}\\\",\\n+ }\\n+ ],\\n+ \\\"usage\\\": {\\\"input_tokens\\\": 2, \\\"output_tokens\\\": 3, \\\"total_tokens\\\": 5},\\n+ }\\n+ body = {\\n+ \\\"model\\\": \\\"mock-planner\\\",\\n+ \\\"input\\\": \\\"call the tool\\\",\\n+ \\\"tools\\\": [{\\\"type\\\": \\\"function\\\", \\\"name\\\": \\\"lookup\\\"}],\\n+ }\\n+\\n+ with patch.object(orch.client, \\\"proxy_send\\\", return_value=raw) as send:\\n+ assert orch.proxy_completion(body, endpoint=\\\"responses\\\", single_agent=True) is raw\\n+ assert raw[\\\"usage\\\"] == {\\\"input_tokens\\\": 2, \\\"output_tokens\\\": 3, \\\"total_tokens\\\": 5}\\n+ analytics = orch.spend_analytics()\\n+ assert analytics[\\\"totals\\\"][\\\"reported_prompt_tokens\\\"] == 2\\n+ assert analytics[\\\"budget\\\"][\\\"spent_output_tokens\\\"] == 3\\n+ assert analytics[\\\"by_model\\\"][0][\\\"usage_source\\\"] == \\\"reported\\\"\\n+ with pytest.raises(BudgetExceededError, match=\\\"spend budget exceeded\\\"):\\n+ orch.proxy_completion(body, endpoint=\\\"responses\\\", single_agent=True)\\n+\\n+ assert send.call_count == 1\\n+\\n+\\n+def test_plain_proxy_completion_accounts_a_tool_only_response() -> None:\\n+ orch = _build()\\n+ raw = {\\n+ \\\"choices\\\": [\\n+ {\\n+ \\\"message\\\": {\\n+ \\\"content\\\": None,\\n+ \\\"tool_calls\\\": [{\\\"id\\\": \\\"call_1\\\", \\\"type\\\": \\\"function\\\"}],\\n+ }\\n+ }\\n+ ]\\n+ }\\n+\\n+ with patch.object(orch.client, \\\"proxy_send\\\", return_value=raw):\\n+ assert orch.proxy_completion(\\n+ {\\n+ \\\"model\\\": \\\"mock-planner\\\",\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"call the tool\\\"}],\\n+ },\\n+ single_agent=True,\\n+ ) is raw\\n+\\n+ assert next(iter(orch._workflow_runs.values()))[\\\"answer\\\"] == \\\"\\\"\\n+\\n+\\n+def test_structured_provider_completion_rechecks_budget_before_final_provider_call() -> None:\\n+ orch = _build()\\n+ orch.budget_max_cost_usd = 1.0\\n+ orch.price_per_million = {\\\"mock-planner\\\": 1_000_000.0}\\n+ with patch.object(\\n+ orch,\\n+ \\\"conduct\\\",\\n+ return_value={\\n+ \\\"trace\\\": [\\n+ {\\n+ \\\"id\\\": \\\"worker\\\",\\n+ \\\"role\\\": \\\"worker\\\",\\n+ \\\"agent_id\\\": \\\"planner_agent\\\",\\n+ \\\"output\\\": \\\"verified\\\",\\n+ }\\n+ ]\\n+ },\\n+ ), patch.object(orch.client, \\\"proxy_send\\\") as send:\\n+ with pytest.raises(BudgetExceededError, match=\\\"spend budget exceeded\\\"):\\n+ orch.proxy_completion(\\n+ {\\n+ \\\"model\\\": \\\"mock-planner\\\",\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"extract JSON\\\"}],\\n+ \\\"response_format\\\": {\\\"type\\\": \\\"json_object\\\"},\\n+ }\\n+ )\\n+\\n+ send.assert_not_called()\\n+\\n+\\n+def test_structured_provider_completion_counts_model_judge_cost() -> None:\\n+ orch = _build()\\n+ orch.budget_max_cost_usd = 3.0\\n+ orch.price_per_million = {\\\"mock-reviewer\\\": 1_000_000.0}\\n+ workflow = {\\n+ \\\"trace\\\": [{\\\"id\\\": 0, \\\"agent_id\\\": \\\"builder_agent\\\", \\\"role\\\": \\\"worker\\\", \\\"output\\\": \\\"ok\\\"}],\\n+ \\\"verification\\\": {\\n+ \\\"accepted\\\": True,\\n+ \\\"judge_agent_id\\\": \\\"rev