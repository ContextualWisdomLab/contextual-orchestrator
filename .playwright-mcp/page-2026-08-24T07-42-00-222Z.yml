nput\\\"]},\\n+ {\\\"required\\\": [\\\"inputs\\\"]},\\n+ ],\\n \\\"properties\\\": {\\n- \\\"model\\\": {\\\"type\\\": \\\"string\\\"},\\n+ \\\"model\\\": {\\n+ \\\"type\\\": \\\"string\\\",\\n+ \\\"description\\\": \\\"Optional enabled embedding-capable pool model; omitted selects one.\\\",\\n+ },\\n \\\"input\\\": {\\n \\\"oneOf\\\": [\\n {\\\"type\\\": \\\"string\\\"},\" }, { \"sha\": \"68a2af371d7925b096d1d9b5278c428a9c4bbd5d\", \"filename\": \"contextual_orchestrator/batch_routing.py\", \"status\": \"modified\", \"additions\": 23, \"deletions\": 2, \"changes\": 25, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Fbatch_routing.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Fbatch_routing.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Fbatch_routing.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -26,6 +26,7 @@\\n import time\\n import uuid\\n from concurrent.futures import ThreadPoolExecutor\\n+from contextvars import copy_context\\n from dataclasses import dataclass, field\\n from typing import Any, Callable, Dict, List, Optional, Protocol\\n \\n@@ -253,8 +254,13 @@ def run(request: BatchRequest) -> BatchResultItem:\\n if self.max_concurrency == 1 or len(requests) <= 1:\\n items = [run(request) for request in requests]\\n else:\\n+ def run_with_context(item: tuple[Any, BatchRequest]) -> BatchResultItem:\\n+ context, request = item\\n+ return context.run(run, request)\\n+\\n+ contexts_and_requests = [(copy_context(), request) for request in requests]\\n with ThreadPoolExecutor(max_workers=min(self.max_concurrency, len(requests))) as pool:\\n- items = list(pool.map(run, requests))\\n+ items = list(pool.map(run_with_context, contexts_and_requests))\\n self._results[job_id] = items\\n return BatchJob(job_id=job_id, backend=self.name, status=\\\"completed\\\", request_count=len(requests))\\n \\n@@ -411,6 +417,7 @@ class EmbeddingBatchRequest:\\n \\n input_text: str\\n model: str = \\\"contextual-orchestrator\\\"\\n+ provider_name: str = \\\"unknown\\\"\\n custom_id: str = field(default_factory=lambda: f\\\"emb_{uuid.uuid4().hex}\\\")\\n attribution: Dict[str, Any] = field(default_factory=dict)\\n source_index: int = 0\\n@@ -437,6 +444,7 @@ class EmbeddingBatchResultItem:\\n embedding: List[float]\\n prompt_tokens: int = 0\\n model: str = \\\"contextual-orchestrator\\\"\\n+ provider_name: str = \\\"unknown\\\"\\n \\n \\n class EmbeddingBatchBackend(Protocol):\\n@@ -493,10 +501,12 @@ def __init__(\\n self,\\n embedder: Optional[Callable[[str], List[float]]] = None,\\n *,\\n+ batch_embedder: Optional[Callable[[List[EmbeddingBatchRequest]], List[List[float]]]] = None,\\n token_counter: Any = None,\\n dimension: int = _DEFAULT_EMBEDDING_DIMENSION,\\n ) -> None:\\n self._embedder = embedder or (lambda text: heuristic_embedding(text, dimension))\\n+ self._batch_embedder = batch_embedder\\n self._token_counter = token_counter\\n self._results: Dict[str, List[EmbeddingBatchResultItem]] = {}\\n \\n@@ -511,15 +521,23 @@ def submit(\\n ) -> BatchJob:\\n \\\"\\\"\\\"Embed every input in-process and stash the results under a job id.\\\"\\\"\\\"\\n job_id = f\\\"localembed_{uuid.uuid4().hex}\\\"\\n+ vectors = (\\n+ self._batch_embedder(requests)\\n+ if self._batch_embedder is not None\\n+ else [self._embedder(request.input_text) for request in requests]\\n+ )\\n+ if len(vectors) != len(requests):\\n+ raise RuntimeError(\\\"embedding provider returned an incomplete vector batch\\\")\\n items: List[EmbeddingBatchResultItem] = []\\n for index, request in enumerate(requests):\\n items.append(\\n EmbeddingBatchResultItem(\\n custom_id=request.custom_id,\\n index=index,\\n- embedding=list(self._embedder(request.input_text)),\\n+ embedding=list(vectors[index]),\\n prompt_tokens=self._count_tokens(request.input_text, request.model),\\n model=request.model,\\n+ provider_name=request.provider_name,\\n )\\n )\\n self._results[job_id] = items\\n@@ -639,6 +657,9 @@ async def _download() -> Dict[str, Any]:\\n embedding=embedding,\\n prompt_tokens=int(usage.get(\\\"prompt_tokens\\\", 0)),\\n model=tracked_request.model if tracked_request else \\\"contextual-orchestrator\\\",\\n+ provider_name=(\\n+ tracked_request.provider_name if tracked_request else \\\"unknown\\\"\\n+ ),\\n )\\n )\\n items.sort(key=lambda item: item.index)\" }, { \"sha\": \"4a2a96cd560621fcc8099010ec759a2f4f75be40\", \"filename\": \"contextual_orchestrator/chat_capability.py\", \"status\": \"added\", \"additions\": 96, \"deletions\": 0, \"changes\": 96, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Fchat_capability.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Fchat_capability.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Fchat_capability.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,96 @@\\n+\\\"\\\"\\\"Classify chat transport compatibility and ordinary agent-role eligibility.\\n+\\n+Provider catalogs mix endpoint-only models with models served through an\\n+OpenAI-compatible chat transport. Transport compatibility is not the same as\\n+fitness for an ordinary thinker, worker, verifier, or synthesizer role: audio\\n+and policy-classification models can use chat transport, while embedding,\\n+reranking, transcription, moderation-endpoint, image-generation, realtime, and\\n+speech-only models cannot.\\n+\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import re\\n+\\n+_MODEL_TOKEN_RE = re.compile(r\\\"[a-z0-9]+\\\")\\n+_TRANSPORT_INCOMPATIBLE_EXACT_TOKENS = frozenset(\\n+ {\\n+ \\\"bge\\\",\\n+ \\\"clip\\\",\\n+ \\\"dall\\\",\\n+ \\\"e5\\\",\\n+ \\\"embed\\\",\\n+ \\\"embedding\\\",\\n+ \\\"embeddings\\\",\\n+ \\\"gte\\\",\\n+ \\\"image\\\",\\n+ \\\"images\\\",\\n+ \\\"moderation\\\",\\n+ \\\"realtime\\\",\\n+ \\\"rerank\\\",\\n+ \\\"reranker\\\",\\n+ \\\"siglip\\\",\\n+ \\\"sora\\\",\\n+ \\\"speech\\\",\\n+ \\\"transcribe\\\",\\n+ \\\"transcription\\\",\\n+ \\\"tts\\\",\\n+ \\\"whisper\\\",\\n+ }\\n+)\\n+_TRANSPORT_INCOMPATIBLE_PREFIXES = (\\n+ \\\"embed\\\",\\n+ \\\"moderat\\\",\\n+ \\\"rerank\\\",\\n+ \\\"transcrib\\\",\\n+)\\n+\\n+\\n+def is_chat_compatible_model_id(model_id: str) -> bool:\\n+ \\\"\\\"\\\"Return whether an identifier can use the ordinary chat transport.\\n+\\n+ The classifier rejects only identifiers that clearly advertise an endpoint\\n+ family incompatible with chat messages. Audio-capable and safety-classifier\\n+ models remain transport-compatible because providers serve some of them over\\n+ ``/chat/completions``.\\n+ \\\"\\\"\\\"\\n+ tokens = _model_tokens(model_id)\\n+ return _is_transport_compatible_tokens(tokens)\\n+\\n+\\n+def _is_transport_compatible_tokens(tokens: tuple[str, ...]) -> bool:\\n+ \\\"\\\"\\\"Judge transport compatibility from already-normalized model tokens.\\\"\\\"\\\"\\n+ if not tokens:\\n+ return False\\n+ for token in tokens:\\n+ if token in _TRANSPORT_INCOMPATIBLE_EXACT_TOKENS:\\n+ return False\\n+ if token.startswith(_TRANSPORT_INCOMPATIBLE_PREFIXES):\\n+ return False\\n+ return True\\n+\\n+\\n+def _model_tokens(model_id: str) -> tuple[str, ...]:\\n+ \\\"\\\"\\\"Normalize one provider-prefixed model identifier into lowercase tokens.\\\"\\\"\\\"\\n+ if not isinstance(model_id, str):\\n+ return ()\\n+ return tuple(_MODEL_TOKEN_RE.findall(model_id.casefold()))\\n+\\n+\\n+def is_general_chat_agent_model_id(model_id: str) -> bool:\\n+ \\\"\\\"\\\"Return whether a chat model may enter ordinary orchestration roles.\\n+\\n+ Explicit guard and safety models can use chat transport but are specialized\\n+ policy classifiers, not general answer synthesizers. This negative role gate\\n+ does not infer reasoning, coding, vision, or verification capabilities.\\n+ \\\"\\\"\\\"\\n+ tokens = _model_tokens(model_id)\\n+ if not tokens or not _is_transport_compatible_tokens(tokens):\\n+ return False\\n+ return not any(\\n+ token == \\\"safety\\\"\\n+ or token == \\\"guard\\\"\\n+ or token == \\\"shieldgemma\\\"\\n+ or token.startswith(\\\"nemoguard\\\")\\n+ for token in tokens\\n+ )\" }, { \"sha\": \"4ce34b6ea106497738b8a3bec3de422a80d7484f\", \"filename\": \"contextual_orchestrator/cost_ledger.py\", \"status\": \"modified\", \"additions\": 6, \"deletions\": 1, \"changes\": 7, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Fcost_ledger.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Fcost_ledger.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Fcost_ledger.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -330,6 +330,7 @@ class NoopUsageTelemetrySink:\\n \\\"\\\"\\\"Default sink for callers that do not wire telemetry yet.\\\"\\\"\\\"\\n \\n def emit_usage(self, event: UsageTelemetryEvent) -> None:\\n+ \\\"\\\"\\\"Discard one prompt-safe usage event.\\\"\\\"\\\"\\n return None\\n \\n \\n@@ -342,12 +343,14 @@ def __init__(self, max_events: int = 512) -> None:\\n self._lock = threading.Lock()\\n \\n def emit_usage(self, event: UsageTelemetryEvent) -> None:\\n+ \\\"\\\"\\\"Append one usage event while retaining only the configured limit.\\\"\\\"\\\"\\n with self._lock:\\n self._events.append(event)\\n if len(self._events) > self._max_events:\\n del self._events[: len(self._events) - self._max_events]\\n \\n def events(self) -> List[UsageTelemetryEvent]:\\n+ \\\"\\\"\\\"Return a thread-safe snapshot of retained usage events.\\\"\\\"\\\"\\n with self._lock:\\n return list(self._events)\\n \\n@@ -363,6 +366,7 @@ class UsageTelemetryHealth:\\n last_error_type: Optional[str] = None\\n \\n def as_dict(self) -> Dict[str, Any]:\\n+ \\\"\\\"\\\"Return operator-safe counters as a serializable mapping.\\\"\\\"\\\"\\n return {\\n \\\"records_accepted\\\": self.records_accepted,\\n \\\"records_stored\\\": self.records_stored,\\n@@ -442,6 +446,7 @@ def flush(self, timeout: Optional[float] = None) -> bool:\\n return True\\n \\n def telemetry_health(self) -> Dict[str, Any]:\\n+ \\\"\\\"\\\"Return a thread-safe snapshot of persistence health counters.\\\"\\\"\\\"\\n with self._lock:\\n return self._health.as_dict()\\n \\n@@ -669,7 +674,7 @@ def query(self, start: Optional[int] = None, end: Optional[int] = None) -> List[\\n _USAGE_QUERY_SQL[(self._paramstyle, start is not None, end is not None)],\\n tuple(params),\\n )\\n- return [dict(zip(_USAGE_COLUMNS, values)) for values in cur.fetchall()]\\n+ return [dict(zip(_USAGE_COLUMNS, values, strict=True)) for values in cur.fetchall()]\\n \\n \\n def _within_window(created_at: int, start: Optional[int], end: Optional[int]) -> bool:\" }, { \"sha\": \"1120b9877f000c96483b5234a6f05742ab68bdca\", \"filename\": \"contextual_orchestrator/cost_router.py\", \"status\": \"modified\", \"additions\": 272, \"deletions\": 31, \"changes\": 303, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Fcost_router.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Fcost_router.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Fcost_router.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -34,7 +34,7 @@\\n RoutingHints,\\n RoutingPolicy,\\n )\\n-from .cost_ledger import CostLedger, PriceBook\\n+from .cost_ledger import CostLedger, PriceBook, UsageRecord\\n from .kv_config import InMemoryConfigStore\\n from .token_counting import HeuristicTokenCounter, build_token_counter\\n \\n@@ -77,21 +77,74 @@ def __init__(\\n )\\n else:\\n self.batch_backend = batch_backend\\n- self.embedding_batch_backend: EmbeddingBatchBackend = (\\n- embedding_batch_backend\\n- or LocalEmbeddingBatchBackend(token_counter=self.token_counter)\\n- )\\n+ self._embedding_backend_is_default = embedding_batch_backend is None\\n+ self.embedding_batch_backend: EmbeddingBatchBackend = embedding_batch_backend or self._default_embedding_backend()\\n # job_id -> submitted BatchJob (so poll/retrieve can be driven by id)\\n self._batch_jobs: Dict[str, BatchJob] = {}\\n # embeddings batch state: job handle + submitted requests + cached doc,\\n # keyed by batch id so poll/retrieve is idempotent (usage recorded once).\\n self._embedding_jobs: Dict[str, BatchJob] = {}\\n+ self._embedding_job_backends: Dict[str, EmbeddingBatchBackend] = {}\\n self._embedding_requests: Dict[str, List[EmbeddingBatchRequest]] = {}\\n self._embedding_input_counts: Dict[str, int] = {}\\n self._embedding_part_counts: Dict[str, List[int]] = {}\\n self._embedding_part_limits: Dict[str, Dict[str, int]] = {}\\n self._embedding_documents: Dict[str, Dict[str, Any]] = {}\\n \\n+ def _default_embedding_backend(self) -> EmbeddingBatchBackend:\\n+ \\\"\\\"\\\"Use a provider-tagged embedding agent when one is configured.\\\"\\\"\\\"\\n+ candidates = [\\n+ agent\\n+ for agent in getattr(self.orchestrator, \\\"candidates\\\", [])\\n+ if not agent.disabled\\n+ and \\\"embedding\\\" in agent.tags\\n+ and not agent.base_url.startswith(\\\"mock://\\\")\\n+ ]\\n+ if not candidates:\\n+ return LocalEmbeddingBatchBackend(token_counter=self.token_counter)\\n+\\n+ def embed_batch(requests: List[EmbeddingBatchRequest]) -> List[List[float]]:\\n+ vectors: List[List[float] | None] = [None] * len(requests)\\n+ provider_models = {\\n+ (request.provider_name, request.model) for request in requests\\n+ }\\n+ for provider_name, model in provider_models:\\n+ matching = [\\n+ agent\\n+ for agent in candidates\\n+ if agent.model == model\\n+ and (agent.provider_name or _provider_from_base_url(agent.base_url) or \\\"unknown\\\")\\n+ == provider_name\\n+ ]\\n+ if not matching:\\n+ raise ValueError(f\\\"embedding model {model!r} is not configured in the embedding agent pool\\\")\\n+ selected = max(matching, key=lambda agent: (agent.priority, agent.id))\\n+ indexes = [\\n+ index\\n+ for index, request in enumerate(requests)\\n+ if request.model == model and request.provider_name == provider_name\\n+ ]\\n+ client = getattr(self.orchestrator, \\\"client\\\", None)\\n+ embed_many = getattr(client, \\\"embed_many\\\", None)\\n+ if not callable(embed_many):\\n+ raise RuntimeError(\\\"configured embedding agent has no provider embedding client\\\")\\n+ batch_vectors = embed_many(\\n+ selected,\\n+ [requests[index].input_text for index in indexes],\\n+ )\\n+ if len(batch_vectors) != len(indexes):\\n+ raise RuntimeError(\\\"provider returned an incomplete embedding vector batch\\\")\\n+ for index, vector in zip(indexes, batch_vectors, strict=True):\\n+ vectors[index] = vector\\n+ if any(vector is None for vector in vectors):\\n+ raise RuntimeError(\\\"provider returned an incomplete embedding vector batch\\\")\\n+ return [vector for vector in vectors if vector is not None]\\n+\\n+ return LocalEmbeddingBatchBackend(\\n+ batch_embedder=embed_batch,\\n+ token_counter=self.token_counter,\\n+ )\\n+\\n # ------------------------------------------------------------------\\n # Provider / model resolution\\n # ------------------------------------------------------------------\\n@@ -110,6 +163,63 @@ def _served_provider_model(self, result: Dict[str, Any], fallback_model: str) ->\\n pass\\n return \\\"unknown\\\", fallback_model\\n \\n+ @staticmethod\\n+ def _provider_usage_counts(usage: Any) -> tuple[int, int] | None:\\n+ \\\"\\\"\\\"Return validated provider token counts, accepting Chat and Responses names.\\\"\\\"\\\"\\n+ if not isinstance(usage, dict):\\n+ return None\\n+ prompt_tokens = usage.get(\\\"prompt_tokens\\\", usage.get(\\\"input_tokens\\\"))\\n+ completion_tokens = usage.get(\\\"completion_tokens\\\", usage.get(\\\"output_tokens\\\"))\\n+ if (\\n+ type(prompt_tokens) is not int\\n+ or prompt_tokens < 0\\n+ or type(completion_tokens) is not int\\n+ or completion_tokens < 0\\n+ ):\\n+ return None\\n+ return prompt_tokens, completion_tokens\\n+\\n+ def _record_provider_workflow_usage(\\n+ self,\\n+ result: Dict[str, Any],\\n+ *,\\n+ attribution: Optional[Dict[str, Any]],\\n+ model_name: str,\\n+ ) -> tuple[List[UsageRecord], int]:\\n+ \\\"\\\"\\\"Record every provider-reported workflow call under one run lineage.\\\"\\\"\\\"\\n+ steps = [step for step in result.get(\\\"trace\\\", []) if isinstance(step, dict)]\\n+ verification = result.get(\\\"verification\\\")\\n+ if isinstance(verification, dict) and isinstance(verification.get(\\\"judge_usage\\\"), dict):\\n+ judge_step = {\\n+ \\\"agent_id\\\": verification.get(\\\"judge_agent_id\\\"),\\n+ \\\"usage\\\": verification[\\\"judge_usage\\\"],\\n+ }\\n+ # Provider-facing synthesis is the final persisted trace step.\\n+ steps.insert(max(0, len(steps) - 1), judge_step)\\n+\\n+ records: List[UsageRecord] = []\\n+ unmetered_count = 0\\n+ for step in steps:\\n+ counts = self._provider_usage_counts(step.get(\\\"usage\\\"))\\n+ if counts is None:\\n+ unmetered_count += 1\\n+ continue\\n+ records.append(\\n+ self._record_completion(\\n+ messages=[],\\n+ answer=\\\"\\\",\\n+ route_mode=result.get(\\\"mode\\\"),\\n+ request_channel=\\\"sync\\\",\\n+ attribution=attribution,\\n+ model_name=model_name,\\n+ provider_model=self._served_provider_model({\\\"trace\\\": [step]}, model_name),\\n+ workflow_run_id=resul