 str(Path(__file__).resolve().parents[1]))\\n \\n from contextual_orchestrator import ModelAgent, TaskOrchestrator # noqa: E402\\n@@ -45,6 +47,24 @@ def _post(port: int, payload: dict) -> tuple[int, dict]:\\n return exc.code, json.loads(exc.read().decode(\\\"utf-8\\\"))\\n \\n \\n+def _post_responses(port: int, payload: dict) -> tuple[int, dict]:\\n+ request = urllib.request.Request(\\n+ f\\\"http://127.0.0.1:{port}/v1/responses\\\",\\n+ data=json.dumps(payload).encode(\\\"utf-8\\\"),\\n+ headers={\\n+ \\\"content-type\\\": \\\"application/json\\\",\\n+ \\\"authorization\\\": f\\\"Bearer {_TEST_AUTH_TOKEN}\\\",\\n+ \\\"connection\\\": \\\"close\\\",\\n+ },\\n+ method=\\\"POST\\\",\\n+ )\\n+ try:\\n+ with urllib.request.urlopen(request, timeout=10) as response:\\n+ return response.status, json.loads(response.read().decode(\\\"utf-8\\\"))\\n+ except urllib.error.HTTPError as exc:\\n+ return exc.code, json.loads(exc.read().decode(\\\"utf-8\\\"))\\n+\\n+\\n def _server():\\n server = build_server(build(), port=0, security=SecurityConfig(auth_token=_TEST_AUTH_TOKEN))\\n thread = threading.Thread(target=server.serve_forever, daemon=True)\\n@@ -141,6 +161,71 @@ def test_http_chat_omits_json_schema_null_optionals_on_response_format() -> None\\n thread.join(timeout=5)\\n \\n \\n+@pytest.mark.parametrize(\\n+ \\\"response_format\\\",\\n+ [\\n+ {\\\"type\\\": \\\"json_object\\\"},\\n+ {\\n+ \\\"type\\\": \\\"json_schema\\\",\\n+ \\\"json_schema\\\": {\\n+ \\\"name\\\": \\\"receipt_line\\\",\\n+ \\\"schema\\\": {\\n+ \\\"type\\\": \\\"object\\\",\\n+ \\\"properties\\\": {\\\"amount\\\": {\\\"type\\\": \\\"number\\\"}},\\n+ },\\n+ },\\n+ },\\n+ ],\\n+)\\n+def test_http_chat_structured_output_keeps_multi_agent_workflow(response_format: dict) -> None:\\n+ server, thread, port = _server()\\n+ try:\\n+ status, body = _post(\\n+ port,\\n+ {\\n+ \\\"model\\\": \\\"mock-planner\\\",\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"structured workflow\\\"}],\\n+ 