\n+ BatchRequest(messages=[{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"two\\\"}], custom_id=\\\"b\\\"),\\n+ ]\\n+ token = set_session_id(\\\"post-session\\\")\\n+ try:\\n+ backend.submit(requests)\\n+ finally:\\n+ reset_session_id(token)\\n+\\n+ assert observed == [\\\"post-session\\\", \\\"post-session\\\"]\\n+\\n+\\n # ---------------------------------------------------------------------------\\n # pg-llm-batch backend (mocked async client mirroring BatchAPIClient)\\n # ---------------------------------------------------------------------------\" }, { \"sha\": \"30628947dad405f6c732f62f2713f886df95dc8c\", \"filename\": \"tests/test_bool_01_seed_str_http_honesty.py\", \"status\": \"modified\", \"additions\": 4, \"deletions\": 3, \"changes\": 7, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_bool_01_seed_str_http_honesty.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_bool_01_seed_str_http_honesty.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_bool_01_seed_str_http_honesty.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -144,15 +144,16 @@ def test_http_chat_parallel_tool_calls_one_requires_tools() -> None:\\n thread.join(timeout=5)\\n \\n \\n-def test_http_responses_accepts_seed_digit_string() -> None:\\n+def test_http_responses_rejects_unapplied_seed_digit_string() -> None:\\n server, thread, port = _server()\\n try:\\n status, body = _post(\\n port,\\n \\\"/v1/responses\\\",\\n {\\\"model\\\": \\\"mock-planner\\\", \\\"input\\\": \\\"seed str\\\", \\\"seed\\\": \\\"42\\\"},\\n )\\n- assert status == 200, body\\n+ assert status == 422, body\\n+ assert \\\"unsupported_responses_orchestration_controls\\\" in json.dumps(body)\\n finally:\\n server.shutdown()\\n thread.join(timeout=5)\\n@@ 