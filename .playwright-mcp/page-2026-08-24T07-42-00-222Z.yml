- generic [active] [ref=e1]: "[ { \"sha\": \"b19e63e9d9c3c8e8b4e849356b1968ff7ea00986\", \"filename\": \".github/workflows/tests.yml\", \"status\": \"modified\", \"additions\": 6, \"deletions\": 4, \"changes\": 10, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/.github%2Fworkflows%2Ftests.yml\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/.github%2Fworkflows%2Ftests.yml\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/.github%2Fworkflows%2Ftests.yml?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -29,10 +29,12 @@ jobs:\\n python-version: \\\"3.12\\\"\\n \\n - name: Install test dependencies\\n- # Hash-pinned per OpenSSF Scorecard Pinned-Dependencies. Reuses the\\n- # property-test lockfile (pytest + hypothesis), which covers the full\\n- # suite's requirements: the package itself is stdlib-only.\\n- run: python -m pip install --require-hashes -r fuzz/requirements-property.txt\\n+ # Hash-pinned per OpenSSF Scorecard Pinned-Dependencies. Install the\\n+ # runtime lock before the property-test lock so optional integrations\\n+ # such as OpenTelemetry are exercised instead of silently disabled.\\n+ run: |\\n+ python -m pip install --require-hashes -r requirements.lock\\n+ python -m pip install --require-hashes -r fuzz/requirements-property.txt\\n \\n - name: Run full test suite\\n run: python -m pytest -q\" }, { \"sha\": \"9f198bb2fb55479e52ac1977bbb2ce33eb7715c8\", \"filename\": \"AGENTS.md\", \"status\": \"modified\", \"additions\": 23, \"deletions\": 0, \"changes\": 23, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/AGENTS.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/AGENTS.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/AGENTS.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -119,4 +119,27 @@ push or open a PR.\\n cost-optimal LLM routing, upstream load balancing, and latency/throughput\\n scheduling (e.g. LLM-cascade / model-routing and queueing/load-balancing\\n papers).\\n+\\n+### Model and reasoning policy\\n+\\n+- Model selection, reasoning-effort allocation, orchestration topology, and\\n+ claims about quality/cost trade-offs must be grounded in cited academic\\n+ papers and current capability evidence. Do not introduce a model policy from\\n+ a vendor blog, benchmark marketing claim, or an implementation convention.\\n+ The governing decision is [ADR 0013](docs/planning/adrs/0013-paper-grounded-adaptive-reasoning-policy.md).\\n+- `auto` is an orchestrator policy, not a provider `reasoning_effort` value. It\\n+ may select a provider-supported value or an orchestrated multi-agent path,\\n+ but the trace must retain the requested policy and the effective strategy.\\n+- Provider values are capability-negotiated. Do not send `none`, `minimal`,\\n+ `low`, `medium`, `high`, or `xhigh` unless the selected provider advertises\\n+ that value; omit the field for a non-reasoning provider. Never infer support\\n+ from a model name.\\n+- `high` and `xhigh` may require multiple independent attempts, verification,\\n+ and synthesis when one worker cannot provide the requested capability. That\\n+ is an orchestrator strategy, not a claim that a non-reasoning worker became a\\n+ reasoning model.\\n+- MLX is not a public provider contract. Keep runtime-specific local model\\n+ behavior behind an authenticated provider-neutral gateway as specified by\\n+ ADR 0012; do not add direct `mlx://` configuration, transport, or model\\n+ selection logic.\\n <!-- END cwl-agent-guidance -->\" }, { \"sha\": \"defc3f2e94e7d1f0e210a5b30f888798e9f0c353\", \"filename\": \"README.md\", \"status\": \"modified\", \"additions\": 14, \"deletions\": 9, \"changes\": 23, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/README.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/README.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/README.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -66,38 +66,37 @@ Use real workers by replacing `mock://` agents with OpenAI-compatible endpoints.\\n }\\n ```\\n \\n-For a local `mlx-lm` OpenAI-compatible server, use the explicit `mlx://` scheme. It is loopback-only, does not require a credential, and is translated to HTTP only after the loopback check:\\n+For a local OpenAI-compatible gateway, use the explicit `local://` loopback scheme and name its separate KV credential. Provider-specific runtime settings stay behind that gateway:\\n \\n ```json\\n {\\n \\\"agents\\\": [\\n {\\n- \\\"id\\\": \\\"local_fast_agent\\\",\\n- \\\"model\\\": \\\"mlx-community/llama-3.2-3b-instruct-4bit\\\",\\n- \\\"base_url\\\": \\\"mlx://127.0.0.1:8080/v1\\\",\\n- \\\"provider_name\\\": \\\"mlx-lm\\\",\\n+ \\\"id\\\": \\\"local_gateway_agent\\\",\\n+ \\\"model\\\": \\\"gateway-selected-model\\\",\\n+ \\\"base_url\\\": \\\"local://127.0.0.1:8080/v1\\\",\\n+ \\\"local_credential_key\\\": \\\"LOCAL_GATEWAY_TOKEN\\\",\\n \\\"tags\\\": [\\\"reasoning\\\", \\\"coding\\\", \\\"verification\\\"]\\n }\\n ]\\n }\\n ```\\n \\n The full local candidate registry is [examples/agents.local.json](examples/agents.local.json).\\n-It contains the public `contextual-orchestrator` candidate, discovered MLX\\n-worker models, and every discovered llama.cpp/LM Studio candidate. Discovery\\n+It contains the public `contextual-orchestrator` candidate and generic local\\n+gateway/llama.cpp/LM Studio candidates. Discovery\\n does not decide governance state: seed candidates are enabled by default, while\\n `disabled` is reserved for an explicit operator/admin quarantine or a persisted\\n removal tombstone. The contextual-orchestrator record is excluded from internal\\n roles because this implementation has no bounded recursive self-call protocol;\\n that is a routing safety constraint, not a disabled candidate. The registry is\\n explicit; runtime discovery does not silently change the pool.\\n \\n-Run an evaluation against that server with `--temperature 0` for repeatable judging. For reasoning-capable mlx models, pass `--chat-template-args '{\\\"enable_thinking\\\":false}'` when a short structured judge response is required. `--local-concurrency N` enables bounded concurrent local batch requests (`1..64`; the current measured starting point for this server is `8`); when serving HTTP, set `--max-concurrent-runs N` explicitly as well if the measured batch concurrency exceeds the secure default of `8`. Keep interactive route/conduct requests on the default sequential path.\\n+Run an evaluation against that gateway with the normal provider capability contract. `--local-concurrency N` enables bounded concurrent local batch requests (`1..64`); when serving HTTP, set `--max-concurrent-runs N` explicitly as well if the measured batch concurrency exceeds the secure default of `8`. Keep interactive route/conduct requests on the default sequential path.\\n \\n Model-based conduct verification requires `fast-mlsirm` in the same runtime and fails closed when it is absent or broken; fast-mlsirm sends its judge completion through this contextual-orchestrator gateway, so no direct provider fallback is used. “Same runtime” means that the exact interpreter used for the live run can import both packages: install both checkouts into one environment (prefer editable installs), or expose both source roots with `PYTHONPATH` during a source run. Before a live judge benchmark, run `python -m contextual_orchestrator check-fast-mlsirm` with that exact interpreter. It prints the interpreter, package version, transitive-import status, and contextual contract check, and exits nonzero on a missing dependency or contract mismatch. Do not run the preflight in one virtual environment and the judge in another. See [ADR 0001](docs/planning/adrs/0001-fail-closed-model-judgment.md).\\n \\n The agent pool is manageable at runtime: `POST`/`PATCH`/`DELETE` on `/api/v1/agent_pools/default/worker_agents[/{id}]` add, govern, and remove model-group members. Pass `--agents-db PATH` (or `CONTEXTUAL_ORCHESTRATOR_AGENTS_DB`) to persist those changes to a stdlib sqlite file — stored changes overlay the seed agents file at startup, and removals write disabled tombstones so they survive restarts; without it the pool is in-memory as before.\\n-\\n Beyond the local MLX/llama.cpp discovery above, `python -m contextual_orchestrator discover-models [--agents-db PATH]` discovers models from remote providers (OpenAI, OpenRouter, NVIDIA NIM ×2 keys, Bytez) for any subset of their KV-registered credentials, and can persist them into the same `--agents-db` sqlite file, added disabled by default. See [docs/kv-credentials.md](docs/kv-credentials.md#multi-provider-auto-discovery) for the credential-name table and cost-based auto-selection.\\n \\n Seed the credential into the KV once at bootstrap:\\n@@ -304,6 +303,12 @@ python tests/test_admin_contract.py\\n python tests/test_conventions.py\\n python tests/test_api_contract.py\\n python tests/test_security_hardening.py\\n+python tests/test_chat_model_capability_isolation.py\\n+python tests/test_chat_transport_role_separation.py\\n+python tests/test_chat_capability_unknown_identifiers.py\\n+python tests/test_chat_passthrough_capability_isolation.py\\n+python tests/test_inbound_request_framing.py\\n+python tests/test_inbound_request_total_deadline.py\\n python tests/test_repository_security_metadata.py\\n python tests/test_product_planning_contract.py\\n python tests/test_plugin_driven_artifacts.py\" }, { \"sha\": \"d00cff4624b7daf9946e5ccd793dd30ed4fefffc\", \"filename\": \"conductor/tracks/001-paper-grounded-orchestrator/spec.md\", \"status\": \"modified\", \"additions\": 2, \"deletions\": 0, \"changes\": 2, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/conductor%2Ftracks%2F001-paper-grounded-orchestrator%2Fspec.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/conductor%2Ftracks%2F001-paper-grounded-orchestrator%2Fspec.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/conductor%2Ftracks%2F001-paper-grounded-orchestrator%2Fspec.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -5,6 +5,8 @@\\n - The public API accepts chat messages through one OpenAI-compatible endpoint.\\n - Simple prompts use one selected worker.\\n - Complex prompts use a workflow with thinker, worker, verifier, and synthesizer steps.\\n+- Image-bearing prompts keep their validated source image blocks in every\\n+ evidence-bearing step and use only explicitly VISION-capable agents.\\n - Workflow steps expose only the prior outputs listed in their access list.\\n - Operators can open a management console to inspect agent pool, policy, trace, and audit state.\\n - Tests encode the Fugu, TRINITY, and Conductor contracts.\" }, { \"sha\": \"f7e43c2a82e5e818a2b7460c9791b378ec49e3e4\", \"filename\": \"contextual_orchestrator/__init__.py\", \"status\": \"modified\", \"additions\": 6, \"deletions\": 1, \"changes\": 7, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2F__init__.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2F__init__.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2F__init__.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -37,7 +37,12 @@\\n from .cost_router import CostRoutingCoordinator\\n from .credentials import NotConfigured, get_credential, register_credential\\n from .kv_config import InMemoryConfigStore, get_config_store\\n-from .orchestrator import ModelAgent, TaskOrchestrator, WorkflowStep, load_agents\\n+from .orchestrator import (\\n+ ModelAgent,\\n+ WorkflowStep,\\n+ load_agents,\\n+)\\n+from .passthrough_failover import TaskOrchestrator\\n from .token_counting import HeuristicTokenCounter, build_token_counter\\n \\n __all__ = [\" }, { \"sha\": \"850aa27dab97ca4fc2faf3cdfc64f33a6b7edd23\", \"filename\": \"contextual_orchestrator/__main__.py\", \"status\": \"modified\", \"additions\": 116, \"deletions\": 22, \"changes\": 138, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2F__main__.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2F__main__.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2F__main__.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -4,17 +4,22 @@\\n \\n import argparse\\n import json\\n+import math\\n import os\\n import sys\\n from dataclasses import replace\\n \\n from .cost_ledger import PriceBook\\n+from .cost_router import CostRoutingCoordinator\\n from .credentials import get_credential, register_credential\\n from .kv_config import InMemoryConfigStore\\n from .model_discovery import (\\n+ ProviderDiscoveryError,\\n+ ProviderModelSource,\\n agent_from_discovered,\\n agent_id_for,\\n discover_all_models,\\n+ discover_provider_models,\\n refresh_price_book,\\n select_top_n_cheapest_discovered_agents,\\n )\\n@@ -23,16 +28,30 @@\\n MAX_LOCAL_CONCURRENCY,\\n ModelAgent,\\n ModelClient,\\n- TaskOrchestrator,\\n load_agents,\\n )\\n+from .passthrough_failover import TaskOrchestrator\\n from .server import SecurityConfig, serve\\n \\n DEFAULT_AUTH_TOKEN_KEY = \\\"CONTEXTUAL_ORCHESTRATOR_TOKEN\\\"\\n DEFAULT_ADMIN_TOKEN_KEY = \\\"CONTEXTUAL_ORCHESTRATOR_ADMIN_TOKEN\\\"\\n DEFAULT_INFERENCE_TOKEN_KEY = \\\"CONTEXTUAL_ORCHESTRATOR_INFERENCE_TOKEN\\\"\\n \\n \\n+def _bootstrap_telemetry_config() -> InMemoryConfigStore:\\n+ \\\"\\\"\\\"Load non-secret OTEL deployment settings into the process KV at startup.\\\"\\\"\\\"\\n+ config = InMemoryConfigStore()\\n+ for environment_name, key in (\\n+ (\\\"OTEL_EXPORTER_OTLP_ENDPOINT\\\", \\\"exporter_otlp_endpoint\\\"),\\n+ (\\\"OTEL_SERVICE_NAME\\\", \\\"service_name\\\"),\\n+ (\\\"OTEL_SDK_DISABLED\\\", \\\"sdk_disabled\\\"),\\n+ ):\\n+ value = os.environ.get(environment_name, \\\"\\\").strip()\\n+ if value:\\n+ config.set(\\\"telemetry\\\", key, value)\\n+ return config\\n+\\n+\\n def _positive_int(value: str) -> int:\\n \\\"\\\"\\\"Parse a strictly positive integer for an argparse option.\\\"\\\"\\\"\\n try:\\n@@ -65,14 +84,14 @@ def _local_concurrency(value: str) -> int:\\n return parsed\\n \\n \\n-def _json_object(value: str) -> dict[str, object]:\\n- \\\"\\\"\\\"Parse a JSON object for an argparse option, rejecting other JSON values.\\\"\\\"\\\"\\n+def _request_read_timeout(value: str) -> float:\\n+ \\\"\\\"\\\"Parse a finite request-body deadline in the server-supported range.\\\"\\\"\\\"\\n try:\\n- parsed = json.loads(value)\\n- except json.JSONDecodeError as exc:\\n- raise argparse.ArgumentTypeError(\\\"valid JSON object required\\\") from exc\\n- if not isinstance(parsed, dict):\\n- raise argparse.ArgumentTypeError(\\\"JSON object required\\\")\\n+ parsed = float(value)\\n+ except ValueError as exc:\\n+ raise argparse.ArgumentTypeError(\\\"number in 0.1..120 required\\\") from exc\\n+ if not math.isfinite(parsed) or not 0.1 <= parsed <= 120.0:\\n+ raise argparse.ArgumentTypeError(\\\"number in 0.1..120 required\\\")\\n return parsed\\n \\n \\n@@ -249,15 +268,59 @@ def _discover_models_command(argv: list[str]) -> None:\\n raise SystemExit(1)\\n \\n \\n-def main() -> None:\\n+def _auto_discover_seed_agents(\\n+ agents: list[ModelAgent], *, allow_failures: bool\\n+) -> list[ModelAgent]:\\n+ \\\"\\\"\\\"Expand empty-model gateway seeds without selecting a model in the consumer.\\\"\\\"\\\"\\n+ expanded: list[ModelAgent] = []\\n+ for seed in agents:\\n+ if seed.model:\\n+ expanded.append(seed)\\n+ continue\\n+ source = ProviderModelSource(\\n+ provider_name=seed.provider_name or seed.id,\\n+ credential_name=seed.credential_name,\\n+ list_url=f\\\"{seed.base_url.rstrip('/')}/models\\\",\\n+ chat_base_url=seed.base_url,\\n+ auth_scheme=seed.auth_scheme,\\n+ )\\n+ try:\\n+ discovered = discover_provider_models(source)\\n+ except ProviderDiscoveryError:\\n+ if not allow_failures:\\n+ raise\\n+ expanded.append(replace(seed, disabled=True))\\n+ continue\\n+ # OpenAI-compatible registries do not always declare task capabilities;\\n+ # embedding deployments cannot serve the chat worker pool.\\n+ chat_models = [model for model in discovered if \\\"embedding\\\" not in model.model_id.casefold()]\\n+ if not chat_models:\\n+ expanded.append(replace(seed, disabled=True))\\n+ continue\\n+ for model in chat_models:\\n+ discovered_agent = agent_from_discovered(model, priority=seed.priority)\\n+ expanded.append(\\n+ replace(\\n+ discovered_agent,\\n+ id=f\\\"{seed.id}_{agent_id_for(model)}\\\",\\n+ tags=seed.tags,\\n+ disabled=seed.disabled,\\n+ provider_exclusions=seed.provider_exclusions,\\n+ )\\n+ )\\n+ return expanded\\n+\\n+\\n+def main(argv: list[str] | None = None) -> None:\\n \\\"\\\"\\\"Parse CLI options and run bootstrap, prompt completion, or the HTTP server.\\\"\\\"\\\"\\n- if len(sys.argv) > 1 and sys.argv[1] == \\\"register-credential\\\":\\n- _register_credential_command(sys.argv[2:])\\n+ arguments = list(sys.argv[1:] if argv is None else argv)\\n+ if arguments and arguments[0] == \\\"register-credential\\\":\\n+ _register_credential_command(arguments[1:])\\n return\\n- if len(sys.argv) > 1 and sys.argv[1] == \\\"discover-models\\\":\\n- _discover_models_command(sys.argv[2:])\\n+ if arguments and arguments[0] == \\\"discover-models\\\":\\n+ _discover_models_command(arguments[1:])\\n return\\n- if len(sys.argv) > 1 and sys.argv[1] == \\\"check-fast-mlsirm\\\":\\n+ if arguments and arguments[0] == \\\"check-fast-mlsirm\\\":\\n _check_fast_mlsirm_command()\\n return\\n \\n@@ -268,6 +331,16 @@ def main() -> None:\\n help=\\\"Optional sqlite path to persist runs/audit/analytics across restarts (default: in-memory).\\\")\\n parser.add_argument(\\\"--mode\\\", choices=[\\\"auto\\\", \\\"route\\\", \\\"conduct\\\"], default=\\\"auto\\\")\\n parser.add_argument(\\\"--serve\\\", action=\\\"store_true\\\", help=\\\"Run the chat completions HTTP server.\\\")\\n+ parser.add_argument(\\n+ \\\"--auto-discover-model-agents\\\",\\n+ action=\\\"store_true\\\",\\n+ help=\\\"Expand empty-model agents from their configured OpenAI-compatible /models endpoint.\\\",\\n+ )\\n+ parser.add_argument(\\n+ \\\"--allow-discovery-failures\\\",\\n+ action=\\\"store_true\\\",\\n+ help=\\\"Keep failed discovery seeds disabled instead of aborting startup.\\\",\\n+ )\\n parser.add_argument(\\\"--host\\\", default=\\\"127.0.0.1\\\")\\n parser.add_argument(\\\"--port\\\", type=int, default=8000)\\n parser.add_argument(\\\"--auth-token\\\", default=\\\"\\\", help=\\\"Explicit local-development bearer token; prefer a KV token name.\\\")\\n@@ -295,21 +368,31 @@ def main() -> None:\\n \\\"--temperature\\\",\\n dest=\\\"sampling_temperature\\\",\\n type=float,\\n- default=0.2,\\n- help=\\\"Default provider sampling temperature (default: 0.2; --temperature is a compatibility alias).\\\",\\n+ default=None,\\n+ help=\\\"Optional provider sampling temperature; omitted by default (--temperature is an alias).\\\",\\n )\\n parser.add_argument(\\\"--max-output-tokens\\\", type=int, default=2048,\\n help=\\\"Default provider output token cap (default: 2048).\\\")\\n+ parser.add_argument(\\n+ \\\"--max-body-bytes\\\",\\n+ type=_positive_int,\\n+ default=64 * 1024,\\n+ help=\\\"Maximum JSON request body size in bytes (default: 65536).\\\",\\n+ )\\n+ parser.add_argument(\\n+ \\\"--request-read-timeout-seconds\\\",\\n+ type=_request_read_timeout,\\n+ default=10.0,\\n+ help=\\\"Maximum time to read one fixed-length JSON body (default: 10 seconds).\\\",\\n+ )\\n parser.add_argument(\\\"--local-concurrency\\\", type=_local_concurrency, default=1,\\n- help=f\\\"Concurrent requests for explicit mlx:// local batch work (default: 1; maximum: {MAX_LOCAL_CONCURRENCY}).\\\")\\n+ help=f\\\"Concurrent requests for local gateway batch work (default: 1; maximum: {MAX_LOCAL_CONCURRENCY}).\\\")\\n parser.add_argument(\\\"--max-concurrent-runs\\\", type=_local_concurrency, default=8,\\n help=f\\\"Maximum simultaneous HTTP orchestration runs (default: 8; maximum: {MAX_LOCAL_CONCURRENCY}).\\\")\\n parser.add_argument(\\\"--route-text-length-threshold\\\", type=_positive_int, default=None,\\n help=\\\"Auto-mode minimum prompt length that can trigger conduct instead of route.\\\")\\n parser.add_argument(\\\"--conduct-hint-threshold\\\", type=_positive_int, default=None,\\n help=\\\"Auto-mode hint-count minimum that can trigger conduct instead of route.\\\")\\n- parser.add_argument(\\\"--chat-template-args\\\", type=_json_object, default={},\\n- help=\\\"JSON kwargs forwarded to local mlx-lm chat templates, e.g. '{\\\\\\\"enable_thinking\\\\\\\":false}'.\\\")\\n parser.add_argument(\\\"--budget-max-output-tokens\\\", type=int, default=None,\\n help=\\\"Refuse new runs once estimated/reported output tokens reach this cap (default: no cap).\\\")\\n parser.add_argument(\\\"--budget-max-cost-usd\\\", type=float, default=None,\\n@@ -318,18 +401,23 @@ def main() -> None:\\n help=\\\"Seconds to cache identical requests (default 0 = disabled).\\\")\\n parser.add_argument(\\\"--eval\\\", nargs=\\\"+\\\", metavar=\\\"PROMPT\\\",\\n help=\\\"Measure orchestration vs a single-worker baseline on these prompts and print the report.\\\")\\n- args = parser.parse_args()\\n+ args = parser.parse_args(arguments)\\n \\n client = ModelClient(\\n ca_bundle=args.provider_ca_bundle,\\n temperature=args.sampling_temperature,\\n max_output_tokens=args.max_output_tokens,\\n local_concurrency=args.local_concurrency,\\n- chat_template_args=args.chat_template_args,\\n allowed_provider_hosts=args.allowed_provider_hosts,\\n )\\n+ agents = load_agents(args.agents)\\n+ if args.auto_discover_model_agents:\\n+ try:\\n+ agents = _auto_discover_seed_agents(agents, allow_failures=args.allow_discovery_failures)\\n+ except (ProviderDiscoveryError, ValueError) as exc:\\n+ parser.error(str(exc))\\n orchestrator = TaskOrchestrator(\\n- load_agents(args.agents),\\n+ agents,\\n client=client,\\n state_db=args.state_db,\\n agents_db=args.agents_db,\\n@@ -396,8 +484,14 @@ def main() -> None:\\n max_concurrent_runs=args.max_concurrent_runs,\\n allow_public_bind=args.allow_public_bind,\\n expose_trace_by_default=args.expose_trace_by_default,\\n+ max_body_bytes=args.max_body_bytes,\\n+ request_read_timeout_seconds=args.request_read_timeout_seconds,\\n ),\\n clearfolio_url=args.clearfolio_url,\\n+ coordinator=CostRoutingCoordinator(\\n+ orchestrator,\\n+ config_store=_bootstrap_telemetry_config(),\\n+ ),\\n )\\n return\\n \" }, { \"sha\": \"454cd7620e28ccbec1f95da9990f7327ba9121ae\", \"filename\": \"contextual_orchestrator/api_contract.py\", \"status\": \"modified\", \"additions\": 16, \"deletions\": 5, \"changes\": 21, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Fapi_contract.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/