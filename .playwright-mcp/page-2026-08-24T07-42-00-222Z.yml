tions\": 266, \"deletions\": 0, \"changes\": 266, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_passthrough_one_shot_local_semantics.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_passthrough_one_shot_local_semantics.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_passthrough_one_shot_local_semantics.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,266 @@\\n+\\\"\\\"\\\"Regression coverage for one-shot passthrough transport semantics.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+from contextlib import contextmanager\\n+from copy import deepcopy\\n+import io\\n+import socket\\n+from unittest.mock import patch\\n+import urllib.error\\n+\\n+import pytest\\n+\\n+from contextual_orchestrator import ModelAgent\\n+from contextual_orchestrator.orchestrator import ModelClient\\n+\\n+\\n+def _local_agent() -> ModelAgent:\\n+ \\\"\\\"\\\"Build one authenticated loopback gateway agent.\\\"\\\"\\\"\\n+ return ModelAgent(\\n+ \\\"local_gateway_agent\\\",\\n+ \\\"local-model\\\",\\n+ base_url=\\\"local://127.0.0.1:8080/v1\\\",\\n+ local_credential_key=\\\"LOCAL_GATEWAY_TOKEN\\\",\\n+ )\\n+\\n+\\n+def _chat_response(content: str = \\\"local answer\\\") -> dict[str, object]:\\n+ \\\"\\\"\\\"Return one minimal OpenAI-compatible chat response.\\\"\\\"\\\"\\n+ return {\\n+ \\\"id\\\": \\\"chatcmpl-one-shot\\\",\\n+ \\\"object\\\": \\\"chat.completion\\\",\\n+ \\\"created\\\": 1,\\n+ \\\"model\\\": \\\"local-model\\\",\\n+ \\\"choices\\\": [\\n+ {\\n+ \\\"index\\\": 0,\\n+ \\\"message\\\": {\\\"role\\\": \\\"assistant\\\", \\\"content\\\": content},\\n+ \\\"finish_reason\\\": \\\"stop\\\",\\n+ }\\n+ ],\\n+ \\\"usage\\\": {\\n+ \\\"prompt_tokens\\\": 1,\\n+ \\\"completion_tokens\\\": 2,\\n+ \\\"total_tokens\\\": 3,\\n+ },\\n+ }\\n+\\n+\\n+def test_one_shot_local_responses_preserves_translation_and_concurrency_slot() -> None:\\n+ \\\"\\\"\\\"One-shot failover must retain the provider-neutral local Responses adapter.\\\"\\\"\\\"\\n+ client = ModelClient(max_retries=4, local_concurrency=3)\\n+ agent = _local_agent()\\n+ request = {\\n+ \\\"model\\\": \\\"local-model\\\",\\n+ \\\"input\\\": \\\"summarize the incident\\\",\\n+ \\\"metadata\\\": {\\\"tenant\\\": \\\"tenant-one\\\"},\\n+ }\\n+ original = deepcopy(request)\\n+ sent: list[tuple[str, dict[str, object]]] = []\\n+ slots: list[tuple[str, int, int]] = []\\n+\\n+ @contextmanager\\n+ def local_slot(\\n+ slot_agent: ModelAgent,\\n+ capacity: int,\\n+ timeout: int,\\n+ ):\\n+ slots.append((slot_agent.id, capacity, timeout))\\n+ yield\\n+\\n+ def send_raw(\\n+ sent_agent: ModelAgent,\\n+ endpoint: str,\\n+ payload: dict[str, object],\\n+ _destination: object,\\n+ ) -> dict[str, object]:\\n+ assert sent_agent is agent\\n+ sent.append((endpoint, deepcopy(payload)))\\n+ return _chat_response()\\n+\\n+ with (\\n+ patch.object(\\n+ client,\\n+ \\\"_validate_provider\\\",\\n+ return_value=(socket.AF_INET, (\\\"127.0.0.1\\\", 8080)),\\n+ ),\\n+ patch.object(client, \\\"_send_raw\\\", side_effect=send_raw),\\n+ patch(\\n+ \\\"contextual_orchestrator.orchestrator._local_provider_slot\\\",\\n+ side_effect=local_slot,\\n+ ),\\n+ client.request_settings(max_output_tokens=73),\\n+ ):\\n+ result = client.proxy_send_once(agent, \\\"responses\\\", request)\\n+\\n+ assert request == original\\n+ assert slots == [(agent.id, 3, client.timeout)]\\n+ assert len(sent) == 1\\n+ endpoint, payload = sent[0]\\n+ assert endpoint == \\\"chat/completions\\\"\\n+ assert payload[\\\"model\\\"] == \\\"local-model\\\"\\n+ assert payload[\\\"stream\\\"] is False\\n+ assert payload[\\\"max_tokens\\\"] == 73\\n+ assert payload[\\\"messages\\\"] == [\\n+ {\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"summarize the incident\\\"}\\n+ ]\\n+ assert result[\\\"object\\\"] == \\\"response\\\"\\n+ assert result[\\\"output_text\\\"] == \\\"local answer\\\"\\n+ assert result[\\\"metadata\\\"] == {\\\"tenant\\\": \\\"tenant-one\\\"}\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ (\\\"requested_max_tokens\\\", \\\"expected_max_tokens\\\"), [(None, 57), (11, 11)]\\n+)\\n+def test_one_shot_local_chat_still_uses_model_switch_concurrency_slot(\\n+ requested_max_tokens: int | None,\\n+ expected_max_tokens: int,\\n+) -> None:\\n+ \\\"\\\"\\\"Removing same-model retries must not bypass local model-switch coordination.\\\"\\\"\\\"\\n+ client = ModelClient(max_retries=5, local_concurrency=2, max_output_tokens=57)\\n+ agent = _local_agent()\\n+ payload = {\\n+ \\\"model\\\": \\\"local-model\\\",\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"hello\\\"}],\\n+ \\\"stream\\\": False,\\n+ }\\n+ if requested_max_tokens is not None:\\n+ payload[\\\"max_tokens\\\"] = requested_max_tokens\\n+ original = deepcopy(payload)\\n+ slots: list[tuple[str, int, int]] = []\\n+ sends: list[tuple[str, dict[str, object]]] = []\\n+\\n+ @contextmanager\\n+ def local_slot(\\n+ slot_agent: ModelAgent,\\n+ capacity: int,\\n+ timeout: int,\\n+ ):\\n+ slots.append((slot_agent.id, capacity, timeout))\\n+ yield\\n+\\n+ def send_raw(\\n+ _agent: ModelAgent,\\n+ endpoint: str,\\n+ sent_payload: dict[str, object],\\n+ _destination: object,\\n+ ) -> dict[str, object]:\\n+ sends.append((endpoint, deepcopy(sent_payload)))\\n+ return _chat_response(\\\"hello\\\")\\n+\\n+ with (\\n+ patch.object(\\n+ client,\\n+ \\\"_validate_provider\\\",\\n+ return_value=(socket.AF_INET, (\\\"127.0.0.1\\\", 8080)),\\n+ ),\\n+ patch.object(client, \\\"_send_raw\\\", side_effect=send_raw),\\n+ patch(\\n+ \\\"contextual_orchestrator.orchestrator._local_provider_slot\\\",\\n+ side_effect=local_slot,\\n+ ),\\n+ ):\\n+ result = client.proxy_send_once(agent, \\\"chat/completions\\\", payload)\\n+\\n+ assert result[\\\"object\\\"] == \\\"chat.completion\\\"\\n+ assert slots == [(agent.id, 2, client.timeout)]\\n+ assert sends == [\\n+ (\\\"chat/completions\\\", {**payload, \\\"max_tokens\\\": expected_max_tokens})\\n+ ]\\n+ assert payload == original\\n+\\n+\\n+def test_one_shot_remote_passthrough_never_enters_same_agent_retry_wrapper() -> None:\\n+ \\\"\\\"\\\"A candidate attempt is exactly one raw provider request.\\\"\\\"\\\"\\n+ client = ModelClient(max_retries=7)\\n+ agent = ModelAgent(\\n+ \\\"remote_provider_agent\\\",\\n+ \\\"remote-model\\\",\\n+ base_url=\\\"https://provider.example/v1\\\",\\n+ credential_key=\\\"REMOTE_PROVIDER_KEY\\\",\\n+ )\\n+ rate_limit = urllib.error.HTTPError(\\n+ \\\"https://provider.example/v1/chat/completions\\\",\\n+ 429,\\n+ \\\"rate limited\\\",\\n+ None,\\n+ None,\\n+ )\\n+\\n+ with (\\n+ patch.object(\\n+ client,\\n+ \\\"_validate_provider\\\",\\n+ return_value=(socket.AF_INET, (\\\"93.184.216.34\\\", 443)),\\n+ ),\\n+ patch.object(client, \\\"_send_raw\\\", side_effect=rate_limit) as send_raw,\\n+ ):\\n+ with pytest.raises(urllib.error.HTTPError) as caught:\\n+ client.proxy_send_once(\\n+ agent,\\n+ \\\"chat/completions\\\",\\n+ {\\n+ \\\"model\\\": \\\"remote-model\\\",\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"hello\\\"}],\\n+ \\\"stream\\\": False,\\n+ },\\n+ )\\n+\\n+ assert caught.value is rate_limit\\n+ send_raw.assert_called_once()\\n+\\n+\\n+def test_one_shot_passthrough_keeps_optional_temperature_negotiation() -> None:\\n+ \\\"\\\"\\\"Capability negotiation removes only temperature without transient replay.\\\"\\\"\\\"\\n+\\n+ client = ModelClient(max_retries=7)\\n+ agent = ModelAgent(\\n+ \\\"remote_provider_agent\\\",\\n+ \\\"remote-model\\\",\\n+ base_url=\\\"https://provider.example/v1\\\",\\n+ credential_key=\\\"REMOTE_PROVIDER_KEY\\\",\\n+ )\\n+ unsupported = urllib.error.HTTPError(\\n+ \\\"https://provider.example/v1/responses\\\",\\n+ 400,\\n+ \\\"bad request\\\",\\n+ None,\\n+ io.BytesIO(\\n+ b\\\"Unsupported value: 'temperature' does not support 0.2; only the default is supported\\\"\\n+ ),\\n+ )\\n+ sent: list[dict[str, object]] = []\\n+\\n+ def send_raw(\\n+ _agent: ModelAgent,\\n+ _endpoint: str,\\n+ payload: dict[str, object],\\n+ _destination: object,\\n+ ) -> dict[str, object]:\\n+ sent.append(deepcopy(payload))\\n+ if len(sent) == 1:\\n+ raise unsupported\\n+ return _chat_response(\\\"negotiated\\\")\\n+\\n+ with (\\n+ patch.object(\\n+ client,\\n+ \\\"_validate_provider\\\",\\n+ return_value=(socket.AF_INET, (\\\"93.184.216.34\\\", 443)),\\n+ ),\\n+ patch.object(client, \\\"_send_raw\\\", side_effect=send_raw),\\n+ ):\\n+ result = client.proxy_send_once(\\n+ agent,\\n+ \\\"responses\\\",\\n+ {\\n+ \\\"model\\\": \\\"remote-model\\\",\\n+ \\\"input\\\": \\\"hello\\\",\\n+ \\\"temperature\\\": 0.2,\\n+ },\\n+ )\\n+\\n+ assert result[\\\"object\\\"] == \\\"chat.completion\\\"\\n+ assert sent[0][\\\"temperature\\\"] == 0.2\\n+ assert \\\"temperature\\\" not in sent[1]\" }, { \"sha\": \"7c858ef527ec0e31680407b462504903358500d0\", \"filename\": \"tests/test_passthrough_provider_failover.py\", \"status\": \"added\", \"additions\": 364, \"deletions\": 0, \"changes\": 364, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_passthrough_provider_failover.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_passthrough_provider_failover.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_passthrough_provider_failover.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,364 @@\\n+\\\"\\\"\\\"Regression coverage for cross-provider failover on raw OpenAI passthrough.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import urllib.error\\n+from copy import deepcopy\\n+from typing import Any\\n+\\n+import pytest\\n+\\n+from contextual_orchestrator import ModelAgent, TaskOrchestrator\\n+\\n+\\n+class SequencedProxyClient:\\n+ \\\"\\\"\\\"Record passthrough calls and return configured outcomes by agent id.\\\"\\\"\\\"\\n+\\n+ def __init__(self, outcomes: dict[str, dict[str, Any] | BaseException]) -> None:\\n+ self.outcomes = outcomes\\n+ self.calls: list[tuple[str, str, dict[str, Any]]] = []\\n+\\n+ def chat(\\n+ self,\\n+ agent: ModelAgent,\\n+ messages: list[dict[str, Any]],\\n+ temperature: float | None = None,\\n+ top_p: float | None = None,\\n+ ) -> str:\\n+ \\\"\\\"\\\"Supply deterministic workflow evidence before final passthrough.\\\"\\\"\\\"\\n+ del messages, temperature, top_p\\n+ return f\\\"verified evidence from {agent.id}\\\"\\n+\\n+ def take_usage(self) -> None:\\n+ \\\"\\\"\\\"Expose the client usage seam used by workflow accounting.\\\"\\\"\\\"\\n+ return\\n+\\n+ def proxy_send_once(\\n+ self,\\n+ agent: ModelAgent,\\n+ endpoint: str,\\n+ payload: dict[str, Any],\\n+ ) -> dict[str, Any]:\\n+ \\\"\\\"\\\"Perform one deterministic provider attempt for the requested agent.\\\"\\\"\\\"\\n+ self.calls.append((agent.id, endpoint, deepcopy(payload)))\\n+ outcome = self.outcomes[agent.id]\\n+ if isinstance(outcome, BaseException):\\n+ raise outcome\\n+ return deepcopy(outcome)\\n+\\n+ def proxy_send(\\n+ self,\\n+ agent: ModelAgent,\\n+ endpoint: str,\\n+ payload: dict[str, Any],\\n+ ) -> dict[str, Any]:\\n+ \\\"\\\"\\\"Expose the ordinary explicit-model transport seam.\\\"\\\"\\\"\\n+ return self.proxy_send_once(agent, endpoint, payload)\\n+\\n+\\n+def _http_error(status: int, message: str) -> urllib.error.HTTPError:\\n+ \\\"\\\"\\\"Return a realistic provider HTTP error for passthrough routing tests.\\\"\\\"\\\"\\n+ return urllib.error.HTTPError(\\n+ \\\"https://provider.example/v1/chat/completions\\\",\\n+ status,\\n+ message,\\n+ None,\\n+ None,\\n+ )\\n+\\n+\\n+def _rate_limit() -> urllib.error.HTTPError:\\n+ \\\"\\\"\\\"Return a realistic transient provider HTTP 429 error.\\\"\\\"\\\"\\n+ return _http_error(429, \\\"rate limited\\\")\\n+\\n+\\n+def _wrapped(error: BaseException) -> RuntimeError:\\n+ \\\"\\\"\\\"Return a provider-style wrapper with the original failure as its cause.\\\"\\\"\\\"\\n+ try:\\n+ raise RuntimeError(\\\"provider wrapper\\\") from error\\n+ except RuntimeError as wrapper:\\n+ return wrapper\\n+\\n+\\n+def _suppressed_wrapper(error: BaseException) -> RuntimeError:\\n+ \\\"\\\"\\\"Return a terminal wrapper whose incidental context is explicitly hidden.\\\"\\\"\\\"\\n+ try:\\n+ raise error\\n+ except BaseException:\\n+ try:\\n+ raise RuntimeError(\\\"terminal provider wrapper\\\") from None\\n+ except RuntimeError as wrapper:\\n+ return wrapper\\n+\\n+\\n+def _build(client: SequencedProxyClient) -> TaskOrchestrator:\\n+ \\\"\\\"\\\"Build a deterministic two-provider pool for passthrough tests.\\\"\\\"\\\"\\n+ return TaskOrchestrator(\\n+ [\\n+ ModelAgent(\\n+ \\\"primary_agent\\\",\\n+ \\\"primary-model\\\",\\n+ tags=(\\\"coding\\\", \\\"implementation\\\", \\\"security\\\", \\\"review\\\"),\\n+ priority=10,\\n+ ),\\n+ ModelAgent(\\n+ \\\"fallback_agent\\\",\\n+ \\\"fallback-model\\\",\\n+ tags=(\\\"coding\\\", \\\"implementation\\\", \\\"security\\\", \\\"review\\\"),\\n+ priority=1,\\n+ ),\\n+ ],\\n+ client=client,\\n+ )\\n+\\n+\\n+@pytest.mark.parametrize(\\\"single_agent\\\", [False, True])\\n+def test_429_advances_immediately_and_preserves_tool_request(\\n+ single_agent: bool,\\n+) -> None:\\n+ \\\"\\\"\\\"A 429 must advance to another model without replaying the saturated one.\\\"\\\"\\\"\\n+ client = SequencedProxyClient(\\n+ {\\n+ \\\"primary_agent\\\": _rate_limit(),\\n+ \\\"fallback_agent\\\": {\\n+ \\\"object\\\": \\\"chat.completion\\\",\\n+ \\\"model\\\": \\\"fallback-model\\\",\\n+ \\\"choices\\\": [],\\n+ },\\n+ }\\n+ )\\n+ orchestrator = _build(client)\\n+ tools = [\\n+ {\\n+ \\\"type\\\": \\\"function\\\",\\n+ \\\"function\\\": {\\\"name\\\": \\\"inspect\\\", \\\"parameters\\\": {\\\"type\\\": \\\"object\\\"}},\\n+ }\\n+ ]\\n+ body = {\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"review this security-sensitive code\\\"}],\\n+ \\\"tools\\\": tools,\\n+ \\\"tool_choice\\\": \\\"auto\\\",\\n+ \\\"response_format\\\": {\\\"type\\\": \\\"json_object\\\"},\\n+ \\\"reasoning_effort\\\": \\\"auto\\\",\\n+ \\\"mode\\\": \\\"auto\\\",\\n+ \\\"stream\\\": True,\\n+ }\\n+ original = deepcopy(body)\\n+\\n+ result = orchestrator.proxy_completion(body, single_agent=single_agent)\\n+\\n+ assert result[\\\"model\\\"] == \\\"fallback-model\\\"\\n+ assert [call[0] for call in client.calls] == [\\\"primary_agent\\\", \\\"fallback_agent\\\"]\\n+ assert client.calls[0][2][\\\"model\\\"] == \\\"primary-model\\\"\\n+ assert client.calls[1][2][\\\"model\\\"] == \\\"fallback-model\\\"\\n+ assert client.calls[1][2][\\\"tools\\\"] == tools\\n+ assert client.calls[1][2][\\\"tool_choice\\\"] == \\\"auto\\\"\\n+ assert client.calls[1][2][\\\"response_format\\\"] == {\\\"type\\\": \\\"json_object\\\"}\\n+ assert \\\"reasoning_effort\\\" not in client.calls[1][2]\\n+ assert client.calls[1][2][\\\"stream\\\"] is False\\n+ assert \\\"mode\\\" not in client.calls[1][2]\\n+ assert body == original\\n+\\n+\\n+@pytest.mark.parametrize(\\\"status\\\", [404, 410])\\n+def test_virtual_request_advances_when_discovered_candidate_disappears(\\n+ status: int,\\n+) -> None:\\n+ \\\"\\\"\\\"A stale discovered candidate must not block another compatible worker.\\\"\\\"\\\"\\n+ unavailable = _http_error(status, \\\"model unavailable\\\")\\n+ client = SequencedProxyClient(\\n+ {\\n+ \\\"primary_agent\\\": unavailable,\\n+ \\\"fallback_agent\\\": {\\n+ \\\"object\\\": \\\"chat.completion\\\",\\n+ \\\"model\\\": \\\"fallback-model\\\",\\n+ \\\"choices\\\": [],\\n+ },\\n+ }\\n+ )\\n+ orchestrator = _build(client)\\n+\\n+ result = orchestrator.proxy_completion(\\n+ {\\n+ \\\"model\\\": \\\"contextual-orchestrator\\\",\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"review code\\\"}],\\n+ \\\"tools\\\": [],\\n+ }\\n+ )\\n+\\n+ assert result[\\\"model\\\"] == \\\"fallback-model\\\"\\n+ assert [call[0] for call in client.calls] == [\\\"primary_agent\\\", \\\"fallback_agent\\\"]\\n+\\n+\\n+@pytest.mark.parametrize(\\\"provider_error\\\", [_rate_limit(), _http_error(410, \\\"gone\\\")])\\n+def test_virtual_request_unwraps_provider_failure_causes(\\n+ provider_error: BaseException,\\n+) -> None:\\n+ \\\"\\\"\\\"Provider SDK wrappers must not hide a bounded fallback signal.\\\"\\\"\\\"\\n+ client = SequencedProxyClient(\\n+ {\\n+ \\\"primary_agent\\\": _wrapped(provider_error),\\n+ \\\"fallback_agent\\\": {\\n+ \\\"object\\\": \\\"chat.completion\\\",\\n+ \\\"model\\\": \\\"fallback-model\\\",\\n+ \\\"choices\\\": [],\\n+ },\\n+ }\\n+ )\\n+ orchestrator = _build(client)\\n+\\n+ result = orchestrator.proxy_completion(\\n+ {\\n+ \\\"model\\\": \\\"contextual-orchestrator\\\",\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"review code\\\"}],\\n+ \\\"tools\\\": [],\\n+ }\\n+ )\\n+\\n+ assert result[\\\"model\\\"] == \\\"fallback-model\\\"\\n+ assert [call[0] for call in client.calls] == [\\\"primary_agent\\\", \\\"fallback_agent\\\"]\\n+\\n+\\n+def test_suppressed_provider_context_does_not_authorize_failover() -> None:\\n+ \\\"\\\"\\\"An explicitly suppressed prior 429 must not override a terminal wrapper.\\\"\\\"\\\"\\n+ terminal = _suppressed_wrapper(_rate_limit())\\n+ client = SequencedProxyClient(\\n+ {\\n+ \\\"primary_agent\\\": terminal,\\n+ \\\"fallback_agent\\\": {\\n+ \\\"object\\\": \\\"chat.completion\\\",\\n+ \\\"model\\\": \\\"fallback-model\\\",\\n+ \\\"choices\\\": [],\\n+ },\\n+ }\\n+ )\\n+ orchestrator = _build(client)\\n+\\n+ with pytest.raises(RuntimeError, match=\\\"terminal provider wrapper\\\") as caught:\\n+ orchestrator.proxy_completion(\\n+ {\\n+ \\\"model\\\": \\\"contextual-orchestrator\\\",\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"review code\\\"}],\\n+ \\\"tools\\\": [],\\n+ }\\n+ )\\n+\\n+ assert caught.value is terminal\\n+ assert terminal.__suppress_context__ is True\\n+ assert [call[0] for call in client.calls] == [\\\"primary_agent\\\"]\\n+\\n+\\n+@pytest.mark.parametrize(\\\"status\\\", [404, 410])\\n+def test_explicit_concrete_model_remains_sticky_when_unavailable(status: int) -> None:\\n+ \\\"\\\"\\\"An explicit concrete model must never be silently replaced.\\\"\\\"\\\"\\n+ unavailable = _http_error(status, \\\"model unavailable\\\")\\n+ client = SequencedProxyClient(\\n+ {\\n+ \\\"primary_agent\\\": unavailable,\\n+ \\\"fallback_agent\\\": {\\n+ \\\"object\\\": \\\"chat.completion\\\",\\n+ \\\"model\\\": \\\"fallback-model\\\",\\n+ \\\"choices\\\": [],\\n+ },\\n+ }\\n+ )\\n+ orchestrator = _build(client)\\n+\\n+ with pytest.raises(urllib.error.HTTPError) as caught:\\n+ orchestrator.proxy_completion(\\n+ {\\n+ \\\"model\\\": \\\"primary-model\\\",\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"review code\\\"}],\\n+ \\\"tools\\\": [],\\n+ }\\n+ )\\n+\\n+ assert caught.value is unavailable\\n+ assert [call[0] for call in client.calls] == [\\\"primary_agent\\\"]\\n+\\n+\\n+def test_explicit_concrete_model_preserves_rate_limit_error() -> None:\\n+ \\\"\\\"\\\"A concrete-model 429 must remain the provider's original error.\\\"\\\"\\\"\\n+ rate_limit = _rate_limit()\\n+ client = SequencedProxyClient(\\n+ {\\n+ \\\"primary_agent\\\": rate_limit,\\n+ \\\"fallback_agent\\\": {\\n+ \\\"object\\\": \\\"chat.completion\\\",\\n+ \\\"model\\\": \\\"fallback-model\\\",\\n+ \\\"choices\\\": [],\\n+ },\\n+ }\\n+ )\\n+ orchestrator = _build(client)\\n+\\n+ with pytest.raises(urllib.error.HTTPError) as caught:\\n+ orchestrator.proxy_completion(\\n+ {\\n+ \\\"model\\\": \\\"primary-model\\\",\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"review code\\\"}],\\n+ \\\"tools\\\": [],\\n+ }\\n+ )\\n+\\n+ assert caught.value is rate_limit\\n+ assert [call[0] for call in client.calls] == [\\\"primary_agent\\\"]\\n+\\n+\\n+def test_non_transient_request_error_is_not_replayed_to_another_provider() -> None:\\n+ \\\"\\\"\\\"A provider 400 is caller/configuration evidence, not a failover signal.\\\"\\\"\\\"\\n+ bad_request = _http_error(400, \\\"unsupported request\\\")\\n+ client = SequencedProxyClient(\\n+ {\\n+ \\\"primary_agent\\\": bad_request,\\n+ \\\"fallback_agent\\\": {\\n+ \\\"object\\\": \\\"chat.completion\\\",\\n+ \\\"model\\\": \\\"fallback-model\\\",\\n+ \\\"choices\\\": [],\\n+ },\\n+ }\\n+ )\\n+ orchestrator = _build(client)\\n+\\n+ with pytest.raises(urllib.error.HTTPError) as caught:\\n+ orchestrator.proxy_completion(\\n+ {\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"invalid request\\\"}],\\n+ \\\"tools\\\": [],\\n+ }\\n+ )\\n+\\n+ assert caught.value is bad_request\\n+ assert [call[0] for call in client.calls] == [\\\"primary_agent\\\"]\\n+ assert not orchestrator._circuit_open(\\\"primary_agent\\\")\\n+\\n+\\n+def test_all_transient_candidate_failures_chain_final_provider_error() -> None:\\n+ \\\"\\\"\\\"Exhausted transient candidates fail closed with the final provider cause.\\\"\\\"\\\"\\n+ first = _rate_limit()\\n+ final = _http_error(503, \\\"fallback unavailable\\\")\\n+ client = SequencedProxyClient(\\n+ {\\\"primary_agent\\\": first, \\\"fallback_agent\\\": final}\\n+ )\\n+ orchestrator = _build(client)\\n+\\n+ with pytest.raises(RuntimeError, match=\\\"all 2 candidate agents failed\\\") as caught:\\n+ orchestrator.proxy_completion(\\n+ {\\n+ \\\"messages\\\": [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"review code\\\"}],\\n+ \\\"tools\\\": [],\\n+ }\\n+ )\\n+\\n+ assert caught.value.__cause__ is final\\n+ assert [call[0] for call in client.calls] == [\\\"primary_agent\\\", \\\"fallback_agent\\\"]\\n+\\n+\\n+def test_cli_server_constructs_the_failover_orchestrator() -> None:\\n+ \\\"\\\"\\\"The production ``python -m`` server path must use provider failover.\\\"\\\"\\\"\\n+ from contextual_orchestrator import __main__ as cli\\n+ from contextual_orchestrator.passthrough_failover import (\\n+ TaskOrchestrator as FailoverTaskOrchestrator,\\n+ )\\n+\\n+ assert cli.TaskOrchestrator is FailoverTaskOrchestrator\" }, { \"sha\": \"e58c64b610b13cf66a224859aedf64f01140803a\", \"filename\": \"tests/test_persistence.py\", \"status\": \"modified\", \"additions\": 49, \"deletions\": 0, \"changes\": 49, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_persistence.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_persistence.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_persistence.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -23,6 +23,30 @@ def _orch(state_db: str | None = None) -> TaskOrchestrator:\\n return TaskOrchestrator([ModelAgent(\\\"general_agent\\\", \\\"mock\\\", tags=(\\\"reasoning\\\", \\\"writing\\\"))], state_db=state_db)\\n \\n \\n+def _run_record(index: int) -> dict:\\n+ return {\\n+ \\\"workflow_run_id\\\": f\\\"run_retention_{index}\\\",\\n+ \\\"created_at\\\": index,\\n+ \\\"mode\\\": \\\"route\\\",\\n+ \\\"policy_mode\\\": \\\"route\\\",\\n+ \\\"prompt_text\\\": \\\"abcd\\\",\\n+ \\\"answer\\\": \\\"done\\\",\\n+ \\\"trace\\\": [\\n+ {\\n+ \\\"id\\\": 0,\\n+ \\\"role\\\": \\\"worker\\\",\\n+ \\\"agent_id\\\": \\\"general_agent\\\",\\n+ \\\"subtask\\\": \\\"Direct route\\\",\\n+ \\\"access\\\": [],\\n+ \\\"output\\\": \\\"done\\\",\\n+ \\\"usage\\\": {\\\"prompt_tokens\\\": 1, \\\"completion_tokens\\\": 1},\\n+ }\\n+ ],\\n+ \\\"policy_snapshot\\\": {},\\n+ \\\"verification\\\": {\\\"accepted\\\": True},\\n+ }\\n+\\n+\\n def test_runs_audit_analytics_survive_restart() -> None:\\n with tempfile.TemporaryDirectory() as directory:\\n db = os.path.join(directory, \\\"state.db\\\")\\n@@ -118,6 +142,31 @@ def test_stream_reload_respects_deque_maxlen() -> None:\\n second.close()\\n \\n \\n+def test_workflow_reload_bounds_raw_records_and_preserves_spend() -> None:\\n+ with tempfile.TemporaryDirectory() as directory:\\n+ db = os.path.join(directory, \\\"state.db\\\")\\n+ first = _orch(db)\\n+ run_count = first._run_order.maxlen + 2\\n+ for index in range(run_count):\\n+ first._persist_workflow_run(_run_record(index))\\n+ assert len(first._workflow_runs) == first._run_order.maxlen\\n+ assert first.spend_analytics()[\\\"totals\\\"][\\\"run_count\\\"] == run_count\\n+ first.close()\\n+\\n+ second = _orch(db)\\n+ try:\\n+ assert len(second._workflow_runs) == second._run_order.maxlen\\n+ assert \\\"run_retention_0\\\" not in second._workflow_runs\\n+ assert \\\"run_retention_129\\\" in second._workflow_runs\\n+ report = second.spend_analytics()\\n+ assert report[\\\"totals\\\"][\\\"run_count\\\"] == run_count\\n+ assert report[\\\"totals\\\"][\\\"estimated_output_tokens\\\"] == run_count\\n+ assert report[\\\"totals\\\"][\\\"reported_prompt_tokens\\\"] == run_count\\n+ assert len(second._store.load(\\\"workflow_run\\\")) == run_count\\n+ finally:\\n+ second.close()\\n+\\n+\\n if __name__ == \\\"__main__\\\":\\n for name, fn in sorted(globals().items()):\\n if name.startswith(\\\"test_\\\") and callable(fn):\" }, { \"sha\": \"e99335437d547ef6a2d7a934efb6433eed52128d\", \"filename\": \"tests/test_pr765_review_regressions.py\", \"status\": \"added\", \"additions\": 320, \"deletions\": 0, \"changes\": 320, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_pr765_review_regressions.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_pr765_review_regressions.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_pr765_review_regressions.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,320 @@\\n+\\\"\\\"\\\"Regression contracts for the PR 765 review findings.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+from concurrent.futures import ThreadPoolExecutor\\n+import json\\n+import threading\\n+import urllib.error\\n+from unittest.mock import patch\\n+\\n+import pytest\\n+\\n+from contextual_orchestrator import orchestrator as orchestration\\n+from contextual_orchestrator import server\\n+from contextual_orchestrator.orchestrator import ModelAgent, ModelClient, TaskOrchestrator\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ \\\"schema\\\",\\n+ [\\n+ {\\\"type\\\": \\\"object\\\", \\\"properties\\\": []},\\n+ {\\\"type\\\": \\\"object\\\", \\\"required\\\": [\\\"answer\\\", 7]},\\n+ {\\\"type\\\": \\\"array\\\", \\\"items\\\": []},\\n+ ],\\n+)\\n+def test_malformed_json_schema_is_rejected_before_response_validation(schema) -> None:\\n+ with pytest.raises(server.RequestError) as captured:\\n+ server._validate_chat_response_format(\\n+ {\\n+ \\\"response_format\\\": {\\n+ \\\"type\\\": \\\"json_schema\\\",\\n+ \\\"json_schema\\\": {\\\"name\\\": \\\"answer\\\", \\\"schema\\\": schema},\\n+ }\\n+ }\\n+ )\\n+ assert captured.value.status == 400\\n+ assert captured.value.code == \\\"invalid_response_format\\\"\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ \\\"field\\\",\\n+ [\\n+ \\\"temperature\\\",\\n+ \\\"top_p\\\",\\n+ \\\"presence_penalty\\\",\\n+ \\\"frequency_penalty\\\",\\n+ \\\"seed\\\",\\n+ \\\"stop\\\",\\n+ \\\"logit_bias\\\",\\n+ \\\"logprobs\\\",\\n+ \\\"top_logprobs\\\",\\n+ ],\\n+)\\n+def test_unapplied_responses_controls_fail_closed(field) -> None:\\n+ values = {\\n+ \\\"temperature\\\": 0.2,\\n+ \\\"top_p\\\": 0.9,\\n+ \\\"presence_penalty\\\": 0.1,\\n+ \\\"frequency_penalty\\\": -0.1,\\n+ \\\"seed\\\": 42,\\n+ \\\"stop\\\": [\\\"END\\\"],\\n+ \\\"logit_bias\\\": {\\\"1\\\": 1},\\n+ \\\"logprobs\\\": True,\\n+ \\\"top_logprobs\\\": 3,\\n+ }\\n+ with pytest.raises(server.RequestError) as captured:\\n+ server._reject_responses_orchestration_controls({field: values[field]})\\n+ assert captured.value.status == 422\\n+ assert captured.value.code == \\\"unsupported_responses_orchestration_controls\\\"\\n+ assert captured.value.detail == {\\\"fields\\\": [field]}\\n+\\n+\\n+def test_empty_responses_controls_remain_omit_equivalent() -> None:\\n+ server._reject_responses_orchestration_controls(\\n+ {\\n+ \\\"temperature\\\": None,\\n+ \\\"stop\\\": \\\"\\\",\\n+ \\\"logit_bias\\\": {},\\n+ \\\"logprobs\\\": False,\\n+ \\\"top_logprobs\\\": 0,\\n+ }\\n+ )\\n+\\n+\\n+def test_internal_chat_preserves_explicit_temperature(monkeypatch) -> None:\\n+ \\\"\\\"\\\"An explicit caller sampling control remains an honest provider passthrough.\\\"\\\"\\\"\\n+ client = ModelClient()\\n+ agent = ModelAgent(\\n+ id=\\\"chat_worker\\\",\\n+ model=\\\"provider/model\\\",\\n+ base_url=\\\"https://gateway.example.com\\\",\\n+ credential_key=\\\"\\\",\\n+ )\\n+ captured: dict[str, object] = {}\\n+\\n+ monkeypatch.setattr(client, \\\"_validate_provider\\\", lambda _agent: None)\\n+\\n+ def capture_payload(_agent, payload, _destination=None, *, timeout=None):\\n+ del timeout\\n+ captured.update(payload)\\n+ return \\\"OK\\\"\\n+\\n+ monkeypatch.setattr(client, \\\"_send\\\", capture_payload)\\n+\\n+ assert client.chat(\\n+ agent,\\n+ [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Sample.\\\"}],\\n+ temperature=0.2,\\n+ ) == \\\"OK\\\"\\n+ assert captured[\\\"temperature\\\"] == 0.2\\n+\\n+\\n+def test_request_sampling_settings_are_isolated_between_threads(monkeypatch) -> None:\\n+ client = ModelClient(max_retries=0)\\n+ agent = ModelAgent(\\n+ id=\\\"concurrent_worker\\\",\\n+ model=\\\"provider/model\\\",\\n+ base_url=\\\"https://gateway.example.com\\\",\\n+ credential_key=\\\"\\\",\\n+ )\\n+ barrier = threading.Barrier(2)\\n+ observed: list[tuple[float, int]] = []\\n+ monkeypatch.setattr(client, \\\"_validate_provider\\\", lambda _agent: None)\\n+\\n+ def capture_payload(_agent, payload, _destination=None, *, timeout=None):\\n+ del timeout\\n+ observed.append((payload[\\\"temperature\\\"], payload[\\\"max_tokens\\\"]))\\n+ barrier.wait(timeout=5)\\n+ return \\\"OK\\\"\\n+\\n+ monkeypatch.setattr(client, \\\"_send\\\", capture_payload)\\n+\\n+ def call(temperature: float, max_tokens: int) -> str:\\n+ with client.request_settings(\\n+ temperature=temperature,\\n+ max_output_tokens=max_tokens,\\n+ ):\\n+ return client.chat(agent, [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Sample.\\\"}])\\n+\\n+ with ThreadPoolExecutor(max_workers=2) as pool:\\n+ replies = list(pool.map(lambda row: call(*row), [(0.1, 11), (0.9, 29)]))\\n+\\n+ assert replies == [\\\"OK\\\", \\\"OK\\\"]\\n+ assert set(observed) == {(0.1, 11), (0.9, 29)}\\n+ assert client.default_temperature is None\\n+ assert client.max_output_tokens == 2048\\n+\\n+ with client.request_settings(temperature=0.3):\\n+ with client.request_settings(temperature=0.4):\\n+ assert client._request_setting(\\\"temperature\\\", None) == 0.4\\n+ assert client._request_setting(\\\"temperature\\\", None) == 0.3\\n+\\n+ streamed: list[tuple[float, int]] = []\\n+\\n+ def capture_stream(_agent, payload, _destination=None):\\n+ streamed.append((payload[\\\"temperature\\\"], payload[\\\"max_tokens\\\"]))\\n+ yield \\\"chunk\\\"\\n+\\n+ monkeypatch.setattr(client, \\\"_stream_send\\\", capture_stream)\\n+ with client.request_settings(temperature=0.6, max_output_tokens=19):\\n+ assert list(\\n+ client.stream_chat(agent, [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"Stream.\\\"}])\\n+ ) == [\\\"chunk\\\"]\\n+ assert streamed == [(0.6, 19)]\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ \\\"userinfo_url\\\",\\n+ [\\n+ \\\"https://@gateway.example.com/v1/models\\\",\\n+ \\\"https://:secret@gateway.example.com/v1/models\\\",\\n+ ],\\n+)\\n+def test_provider_json_rejects_empty_userinfo_before_provider_transport(userinfo_url: str) -> None:\\n+ \\\"\\\"\\\"An empty username or password is still userinfo and cannot bypass origin checks.\\\"\\\"\\\"\\n+ agent = ModelAgent(\\n+ id=\\\"model_discovery_agent\\\",\\n+ model=\\\"model_catalog\\\",\\n+ base_url=\\\"https://gateway.example.com/v1\\\",\\n+ credential_key=\\\"\\\",\\n+ )\\n+ client = ModelClient()\\n+ with (\\n+ patch.object(client, \\\"_validate_provider\\\") as validate_provider,\\n+ patch.object(client, \\\"_open_provider\\\") as open_provider,\\n+ pytest.raises(RuntimeError, match=\\\"validated agent origin\\\"),\\n+ ):\\n+ client.fetch_json(agent, userinfo_url)\\n+ validate_provider.assert_not_called()\\n+ open_provider.assert_not_called()\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ \\\"schema\\\",\\n+ [\\n+ [],\\n+ {\\\"properties\\\": {\\\"answer\\\": []}},\\n+ {\\\"anyOf\\\": {}},\\n+ ],\\n+)\\n+def test_json_schema_definition_rejects_invalid_nested_containers(schema) -> None:\\n+ with pytest.raises(server.RequestError, match=\\\"must\\\") as captured:\\n+ server._validate_json_schema_definition(schema)\\n+ assert captured.value.status == 400\\n+\\n+\\n+def test_json_schema_definition_accepts_recursive_items_and_any_of() -> None:\\n+ server._validate_json_schema_definition(\\n+ {\\n+ \\\"type\\\": \\\"array\\\",\\n+ \\\"items\\\": {\\\"anyOf\\\": [{\\\"type\\\": \\\"string\\\"}, {\\\"type\\\": \\\"integer\\\"}]},\\n+ }\\n+ )\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ (\\\"value\\\", \\\"schema\\\"),\\n+ [\\n+ (\\\"answer\\\", []),\\n+ (\\\"answer\\\", {\\\"enum\\\": [\\\"other\\\"]}),\\n+ (\\\"answer\\\", {\\\"const\\\": \\\"other\\\"}),\\n+ (\\\"answer\\\", {\\\"anyOf\\\": [{\\\"type\\\": \\\"integer\\\"}]}),\\n+ (\\\"answer\\\", {\\\"type\\\": \\\"object\\\"}),\\n+ ({}, {\\\"type\\\": \\\"object\\\", \\\"required\\\": [\\\"answer\\\"]}),\\n+ ({\\\"other\\\": 1}, {\\\"type\\\": \\\"object\\\", \\\"properties\\\": {}, \\\"additionalProperties\\\": False}),\\n+ (\\\"answer\\\", {\\\"type\\\": \\\"array\\\"}),\\n+ (1, {\\\"type\\\": \\\"string\\\"}),\\n+ (\\\"true\\\", {\\\"type\\\": \\\"boolean\\\"}),\\n+ (True, {\\\"type\\\": \\\"integer\\\"}),\\n+ (True, {\\\"type\\\": \\\"number\\\"}),\\n+ ],\\n+)\\n+def test_structured_value_validation_rejects_every_supported_mismatch(value, schema) -> None:\\n+ with pytest.raises(server.RequestError) as captured:\\n+ server._validate_json_schema_value(value, schema)\\n+ assert captured.value.status == 502\\n+\\n+\\n+def test_structured_value_validation_recurses_through_objects_and_arrays() -> None:\\n+ schema = {\\n+ \\\"type\\\": \\\"object\\\",\\n+ \\\"required\\\": [\\\"answers\\\"],\\n+ \\\"properties\\\": {\\\"answers\\\": {\\\"type\\\": \\\"array\\\", \\\"items\\\": {\\\"type\\\": \\\"string\\\"}}},\\n+ \\\"additionalProperties\\\": False,\\n+ }\\n+ server._validate_json_schema_value({\\\"answers\\\": [\\\"yes\\\"]}, schema)\\n+ assert server._json_schema_matches(\\\"yes\\\", {\\\"type\\\": \\\"string\\\"}) is True\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ (\\\"answer\\\", \\\"response_format\\\"),\\n+ [\\n+ (None, {\\\"type\\\": \\\"json_object\\\"}),\\n+ (\\\"not-json\\\", {\\\"type\\\": \\\"json_object\\\"}),\\n+ (\\\"[]\\\", {\\\"type\\\": \\\"json_object\\\"}),\\n+ ],\\n+)\\n+def test_structured_completion_rejects_non_contract_answers(answer, response_format) -> None:\\n+ with pytest.raises(server.RequestError) as captured:\\n+ server._validate_structured_completion_answer(answer, response_format)\\n+ assert captured.value.status == 502\\n+\\n+\\n+def test_structured_completion_applies_json_schema() -> None:\\n+ server._validate_structured_completion_answer(\\n+ json.dumps({\\\"answer\\\": \\\"yes\\\"}),\\n+ {\\n+ \\\"type\\\": \\\"json_schema\\\",\\n+ \\\"json_schema\\\": {\\n+ \\\"schema\\\": {\\n+ \\\"type\\\": \\\"object\\\",\\n+ \\\"properties\\\": {\\\"answer\\\": {\\\"type\\\": \\\"string\\\"}},\\n+ \\\"required\\\": [\\\"answer\\\"],\\n+ }\\n+ },\\n+ },\\n+ )\\n+\\n+\\n+def test_responses_chat_content_ignores_non_content_items() -> None:\\n+ assert orchestration._responses_chat_content(None) == \\\"\\\"\\n+ assert orchestration._responses_chat_content([\\\"one\\\", 2, {\\\"text\\\": \\\"two\\\"}]) == \\\"onetwo\\\"\\n+\\n+\\n+def test_temperature_capability_rejection_preserves_http_error_body() -> None:\\n+ class _UnreadableBody:\\n+ def read(self) -> bytes:\\n+ raise OSError(\\\"closed\\\")\\n+\\n+ def close(self) -> None:\\n+ return None\\n+\\n+ assert orchestration._temperature_capability_rejection(ValueError(\\\"temperature\\\")) is False\\n+ error = urllib.error.HTTPError(\\n+ \\\"https://gateway.example/v1/chat/completions\\\",\\n+ 400,\\n+ \\\"temperature is unsupported; only the default value is accepted\\\",\\n+ {},\\n+ _UnreadableBody(),\\n+ )\\n+ assert orchestration._temperature_capability_rejection(error) is True\\n+ assert error.read() == b\\\"\\\"\\n+\\n+\\n+def test_embedding_model_requires_an_orchestrator_when_omitted() -> None:\\n+ with pytest.raises(server.RequestError) as captured:\\n+ server._validate_embeddings_model({})\\n+ assert captured.value.code == \\\"invalid_model\\\"\\n+\\n+\\n+def test_response_content_and_capability_selection_fail_closed() -> None:\\n+ agent = ModelAgent(\\\"general_agent\\\", \\\"mock-model\\\")\\n+ with pytest.raises(RuntimeError, match=\\\"assistant content\\\"):\\n+ ModelClient._response_content(agent, {\\\"choices\\\": [{\\\"message\\\": {}}]})\\n+\\n+ orchestrator = TaskOrchestrator([agent])\\n+ with pytest.raises(ValueError, match=\\\"non-empty\\\"):\\n+ orchestrator.select_capability_agent(\\\" \\\")\\n+ with pytest.raises(RuntimeError, match=\\\"capability=embedding\\\"):\\n+ orchestrator.select_capability_agent(\\\"embedding\\\")\" }, { \"sha\": \"69c33d5d2f18f30d89c64d01e59e768b38d978eb\", \"filename\": \"tests/test_provider_embeddings.py\", \"status\": \"added\", \"additions\": 289, \"deletions\": 0, \"changes\": 289, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_provider_embeddings.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_provider_embeddings.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_provider_embeddings.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,289 @@\\n+\\\"\\\"\\\"Provider-backed embeddings stay inside contextual-orchestrator.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import json\\n+from contextlib import contextmanager\\n+from pathlib import Path\\n+import sys\\n+from types import SimpleNamespace\\n+\\n+import pytest\\n+\\n+sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\n+\\n+from contextual_orchestrator.credentials import ( # noqa: E402\\n+ InMemoryCredentialBackend,\\n+ register_credential,\\n+ set_backend,\\n+)\\n+from contextual_orchestrator.batch_routing import EmbeddingBatchRequest # noqa: E402\\n+from contextual_orchestrator.cost_router import CostRoutingCoordinator # noqa: E402\\n+from contextual_orchestrator.orchestrator import ( # noqa: E402\\n+ ModelAgent,\\n+ ModelClient,\\n+ NotConfigured,\\n+)\\n+\\n+\\n+class _Response:\\n+ def __init__(self, payload: dict) -> None:\\n+ self._payload = json.dumps(payload).encode()\\n+\\n+ def read(self, *_args: object) -> bytes:\\n+ return self._payload\\n+\\n+ def __enter__(self) -> \\\"_Response\\\":\\n+ return self\\n+\\n+ def __exit__(self, *args: object) -> None:\\n+ return None\\n+\\n+\\n+def test_model_client_embed_many_calls_provider_embeddings_endpoint(monkeypatch) -> None:\\n+ backend = InMemoryCredentialBackend()\\n+ set_backend(backend)\\n+ register_credential(\\\"EMBEDDING_KEY\\\", \\\"provider-secret\\\")\\n+ seen: list[tuple[str, dict, str]] = []\\n+ agent = ModelAgent(\\n+ \\\"embedding_agent\\\",\\n+ \\\"text-embedding-model\\\",\\n+ \\\"https://gateway.example/v1\\\",\\n+ credential_key=\\\"EMBEDDING_KEY\\\",\\n+ tags=(\\\"embedding\\\",),\\n+ )\\n+ client = ModelClient(max_retries=0)\\n+ monkeypatch.setattr(client, \\\"_validate_provider\\\", lambda _agent: object())\\n+\\n+ @contextmanager\\n+ def open_provider(request, _destination=None, **_kwargs):\\n+ seen.append((request.full_url, json.loads(request.data), request.headers[\\\"Authorization\\\"]))\\n+ yield _Response(\\n+ {\\n+ \\\"data\\\": [\\n+ {\\\"index\\\": 1, \\\"embedding\\\": [2.0, 3.0]},\\n+ {\\\"index\\\": 0, \\\"embedding\\\": [0.0, 1.0]},\\n+ ],\\n+ \\\"usage\\\": {\\\"prompt_tokens\\\": 2},\\n+ }\\n+ )\\n+\\n+ monkeypatch.setattr(client, \\\"_open_provider\\\", open_provider)\\n+ try:\\n+ assert client.embed_many(agent, [\\\"one\\\", \\\"two\\\"]) == [[0.0, 1.0], [2.0, 3.0]]\\n+ finally:\\n+ set_backend(None)\\n+ assert seen == [\\n+ (\\n+ \\\"https://gateway.example/v1/embeddings\\\",\\n+ {\\\"model\\\": \\\"text-embedding-model\\\", \\\"input\\\": [\\\"one\\\", \\\"two\\\"]},\\n+ \\\"Bearer provider-secret\\\",\\n+ )\\n+ ]\\n+\\n+\\n+def test_cost_router_uses_embedding_agent_instead_of_heuristic() -> None:\\n+ agent = ModelAgent(\\n+ \\\"embedding_agent\\\",\\n+ \\\"text-embedding-model\\\",\\n+ \\\"https://gateway.example/v1\\\",\\n+ tags=(\\\"embedding\\\",),\\n+ )\\n+ calls: list[tuple[str, list[str]]] = []\\n+\\n+ def embed_many(selected: ModelAgent, inputs: list[str]) -> list[list[float]]:\\n+ calls.append((selected.model, inputs))\\n+ return [[float(index)] for index, _input in enumerate(inputs)]\\n+\\n+ orchestrator = SimpleNamespace(\\n+ candidates=[agent],\\n+ client=SimpleNamespace(embed_many=embed_many),\\n+ )\\n+ coordinator = CostRoutingCoordinator(orchestrator)\\n+\\n+ result = coordinator.complete_embeddings_batch(\\n+ [\\\"one\\\", \\\"two\\\"],\\n+ attribution={\\\"provider\\\": \\\"caller-spoof\\\"},\\n+ )\\n+\\n+ assert [item[\\\"embedding\\\"] for item in result[\\\"embeddings\\\"]] == [[0.0], [1.0]]\\n+ assert calls == [(\\\"text-embedding-model\\\", [\\\"one\\\", \\\"two\\\"])]\\n+ assert result[\\\"model\\\"] == \\\"text-embedding-model\\\"\\n+ assert result[\\\"provider\\\"] == \\\"gateway.example\\\"\\n+ assert {record[\\\"provider_name\\\"] for record in coordinator.ledger.records()} == {\\n+ \\\"gateway.example\\\"\\n+ }\\n+\\n+\\n+def test_default_embedding_backend_observes_runtime_agent_addition() -> None:\\n+ calls: list[tuple[str, list[str]]] = []\\n+\\n+ def embed_many(selected: ModelAgent, inputs: list[str]) -> list[list[float]]:\\n+ calls.append((selected.model, inputs))\\n+ return [[1.0] for _input in inputs]\\n+\\n+ orchestrator = SimpleNamespace(\\n+ candidates=[],\\n+ client=SimpleNamespace(embed_many=embed_many),\\n+ )\\n+ coordinator = CostRoutingCoordinator(orchestrator)\\n+ orchestrator.candidates.append(\\n+ ModelAgent(\\n+ \\\"runtime_embedding_agent\\\",\\n+ \\\"runtime-embedding-model\\\",\\n+ \\\"https://gateway.example/v1\\\",\\n+ tags=(\\\"embedding\\\",),\\n+ )\\n+ )\\n+\\n+ result = coordinator.complete_embeddings_batch([\\\"added later\\\"])\\n+\\n+ assert calls == [(\\\"runtime-embedding-model\\\", [\\\"added later\\\"])]\\n+ assert result[\\\"embeddings\\\"][0][\\\"embedding\\\"] == [1.0]\\n+ assert result[\\\"provider\\\"] == \\\"gateway.example\\\"\\n+\\n+\\n+def test_embedding_client_fails_closed_before_or_after_transport(monkeypatch) -> None:\\n+ client = ModelClient(max_retries=0)\\n+ mock_agent = ModelAgent(\\\"mock_embedding\\\", \\\"embedding-model\\\", \\\"mock://embedding\\\")\\n+ assert client.embed_many(mock_agent, []) == []\\n+ with pytest.raises(RuntimeError, match=\\\"mock agents\\\"):\\n+ client.embed_many(mock_agent, [\\\"one\\\"])\\n+\\n+ backend = InMemoryCredentialBackend()\\n+ set_backend(backend)\\n+ configured_agent = ModelAgent(\\n+ \\\"embedding_agent\\\",\\n+ \\\"embedding-model\\\",\\n+ \\\"https://gateway.example/v1\\\",\\n+ credential_key=\\\"MISSING_KEY\\\",\\n+ )\\n+ monkeypatch.setattr(client, \\\"_validate_provider\\\", lambda _agent: object())\\n+ try:\\n+ with pytest.raises(NotConfigured, match=\\\"resolvable credential\\\"):\\n+ client.embed_many(configured_agent, [\\\"one\\\"])\\n+ finally:\\n+ set_backend(None)\\n+\\n+ monkeypatch.setattr(client, \\\"_send_embeddings\\\", lambda *_args: (_ for _ in ()).throw(ValueError(\\\"bad\\\")))\\n+ with pytest.raises(RuntimeError, match=\\\"embeddings request failed\\\"):\\n+ client._send_embeddings_with_retry(configured_agent, {\\\"input\\\": [\\\"one\\\"]}, object())\\n+\\n+\\n+@pytest.mark.parametrize(\\n+ \\\"payload\\\",\\n+ [\\n+ {\\\"data\\\": []},\\n+ {\\\"data\\\": [{\\\"index\\\": \\\"0\\\", \\\"embedding\\\": [1.0]}]},\\n+ {\\\"data\\\": [{\\\"index\\\": 1, \\\"embedding\\\": [1.0]}]},\\n+ {\\\"data\\\": [{\\\"index\\\": 0, \\\"embedding\\\": [float(\\\"nan\\\")]}]},\\n+ {\\n+ \\\"data\\\": [\\n+ {\\\"index\\\": 0, \\\"embedding\\\": [1.0]},\\n+ {\\\"index\\\": 0, \\\"embedding\\\": [2.0]},\\n+ ]\\n+ },\\n+ ],\\n+)\\n+def test_embedding_client_rejects_malformed_provider_vectors(monkeypatch, payload) -> None:\\n+ client = ModelClient(max_retries=0)\\n+ agent = ModelAgent(\\\"embedding_agent\\\", \\\"embedding-model\\\", \\\"https://gateway.example/v1\\\")\\n+\\n+ @contextmanager\\n+ def open_provider(*_args, **_kwargs):\\n+ yield _Response(payload)\\n+\\n+ monkeypatch.setattr(client, \\\"_open_provider\\\", open_provider)\\n+ inputs = [\\\"one\\\", \\\"two\\\"] if len(payload.get(\\\"data\\\", [])) == 2 else [\\\"one\\\"]\\n+ with pytest.raises(RuntimeError, match=\\\"provider embeddings response\\\"):\\n+ client._send_embeddings(agent, {\\\"model\\\": agent.model, \\\"input\\\": inputs}, object())\\n+\\n+\\n+def test_embedding_model_resolution_covers_server_owned_failure_paths() -> None:\\n+ agent = ModelAgent(\\n+ \\\"embedding_agent\\\",\\n+ \\\"embedding-model\\\",\\n+ \\\"https://gateway.example/v1\\\",\\n+ tags=(\\\"embedding\\\",),\\n+ )\\n+ selected = SimpleNamespace(\\n+ candidates=[agent],\\n+ client=SimpleNamespace(embed_many=lambda _agent, inputs: [[1.0] for _ in inputs]),\\n+ select_capability_agent=lambda capability: agent if capability == \\\"embedding\\\" else None,\\n+ )\\n+ coordinator = CostRoutingCoordinator(selected)\\n+ assert coordinator._resolve_embedding_provider_model(\\\"contextual-orchestrator\\\") == (\\n+ \\\"gateway.example\\\",\\n+ \\\"embedding-model\\\",\\n+ )\\n+ with pytest.raises(ValueError, match=\\\"not configured\\\"):\\n+ coordinator._resolve_embedding_provider_model(\\\"other-model\\\")\\n+\\n+ standalone = CostRoutingCoordinator(SimpleNamespace(candidates=[]))\\n+ with pytest.raises(ValueError, match=\\\"no enabled\\\"):\\n+ standalone._resolve_embedding_provider_model(\\\"contextual-orchestrator\\\")\\n+ assert standalone._resolve_embedding_provider_model(\\\"explicit-model\\\") == (\\n+ \\\"local\\\",\\n+ \\\"explicit-model\\\",\\n+ )\\n+\\n+\\n+def test_provider_embedding_backend_rejects_unknown_identity_and_missing_client() -> None:\\n+ agent = ModelAgent(\\n+ \\\"embedding_agent\\\",\\n+ \\\"embedding-model\\\",\\n+ \\\"https://gateway.example/v1\\\",\\n+ tags=(\\\"embedding\\\",),\\n+ )\\n+ request = EmbeddingBatchRequest(\\n+ input_text=\\\"one\\\",\\n+ model=agent.model,\\n+ provider_name=\\\"wrong.example\\\",\\n+ )\\n+ backend = CostRoutingCoordinator(SimpleNamespace(candidates=[agent])).embedding_batch_backend\\n+ with pytest.raises(ValueError, match=\\\"not configured\\\"):\\n+ backend._batch_embedder([request])\\n+\\n+ request.provider_name = \\\"gateway.example\\\"\\n+ with pytest.raises(RuntimeError, match=\\\"no provider embedding client\\\"):\\n+ backend._batch_embedder([request])\\n+\\n+\\n+def test_provider_json_fetch_is_bounded_and_requires_configured_credentials(monkeypatch) -> None:\\n+ client = ModelClient()\\n+ agent = ModelAgent(\\\"catalog_agent\\\", \\\"catalog-model\\\", \\\"https://gateway.example/v1\\\")\\n+ with pytest.raises(ValueError, match=\\\"positive integer\\\"):\\n+ client.fetch_json(agent, \\\"https://gateway.example/v1/models\\\", max_bytes=0)\\n+\\n+ backend = InMemoryCredentialBackend()\\n+ set_backend(backend)\\n+ secured = ModelAgent(\\n+ \\\"secured_catalog_agent\\\",\\n+ \\\"catalog-model\\\",\\n+ \\\"https://gateway.example/v1\\\",\\n+ credential_key=\\\"MISSING_KEY\\\",\\n+ )\\n+ monkeypatch.setattr(client, \\\"_validate_provider\\\", lambda _agent: object())\\n+ try:\\n+ with pytest.raises(NotConfigured, match=\\\"resolvable credential\\\"):\\n+ client.fetch_json(secured, \\\"https://gateway.example/v1/models\\\")\\n+ finally:\\n+ set_backend(None)\\n+\\n+ @contextmanager\\n+ def open_provider(*_args, **_kwargs):\\n+ yield _Response({\\\"models\\\": [\\\"too large\\\"]})\\n+\\n+ monkeypatch.setattr(client, \\\"_open_provider\\\", open_provider)\\n+ backend = InMemoryCredentialBackend()\\n+ backend.set(\\\"OPENAI_API_KEY\\\", \\\"provider-key\\\")\\n+ set_backend(backend)\\n+ try:\\n+ with pytest.raises(ValueError, match=\\\"maximum size\\\"):\\n+ client.fetch_json(agent, \\\"https://gateway.example/v1/models\\\", max_bytes=1)\\n+ finally:\\n+ set_backend(None)\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover\\n+ raise SystemExit(pytest.main([__file__]))\" }, { \"sha\": \"5edaee425381d26335edef5c15f43d3f2fbb4b95\", \"filename\": \"tests/test_provider_integration.py\", \"status\": \"modified\", \"additions\": 51, \"deletions\": 3, \"changes\": 54, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_provider_integration.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_provider_integration.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_provider_integration.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -34,12 +34,14 @@ class _FakeProvider:\\n \\n def __init__(self, responses: list[tuple[int, dict]]) -> None:\\n self.request_count = 0\\n+ self.requests: list[dict] = []\\n outer = self\\n \\n class Handler(BaseHTTPRequestHandler):\\n def do_POST(self) -> None: # noqa: N802\\n length = int(self.headers.get(\\\"content-length\\\", 0))\\n- self.rfile.read(length)\\n+ raw_request = self.rfile.read(length)\\n+ outer.requests.append(json.loads(raw_request.decode(\\\"utf-8\\\")))\\n index = min(outer.request_count, len(responses) - 1)\\n outer.request_count += 1\\n status, body = responses[index]\\n@@ -112,8 +114,54 @@ def test_permanent_4xx_is_not_retried_over_http() -> None:\\n client._send_with_retry(_agent(provider.base_url), {\\\"model\\\": \\\"gpt-x\\\"})\\n except RuntimeError:\\n raised = True\\n- assert raised\\n- assert provider.request_count == 1 # 400 is a real HTTPError classified permanent: one attempt\\n+ assert raised\\n+ assert provider.request_count == 1 # 400 is a real HTTPError classified permanent: one attempt\\n+\\n+\\n+def test_unsupported_temperature_is_negotiated_on_the_same_chat_endpoint() -> None:\\n+ with _FakeProvider([\\n+ (422, {\\\"error\\\": {\\\"message\\\": \\\"temperature is not supported for this deployment\\\"}}),\\n+ (200, _completion(\\\"negotiated\\\")),\\n+ ]) as provider:\\n+ client = ModelClient(max_retries=0)\\n+ result = client._send_with_retry(\\n+ _agent(provider.base_url), {\\\"model\\\": \\\"gpt-x\\\", \\\"temperature\\\": 0.2}\\n+ )\\n+ assert result == \\\"negotiated\\\"\\n+ assert provider.request_count == 2\\n+ assert provider.requests[0][\\\"temperature\\\"] == 0.2\\n+ assert \\\"temperature\\\" not in provider.requests[1]\\n+\\n+\\n+def test_invalid_temperature_is_not_treated_as_capability_negotiation() -> None:\\n+ with _FakeProvider([(400, {\\\"error\\\": {\\\"message\\\": \\\"invalid temperature value\\\"}})]) as provider:\\n+ client = ModelClient(max_retries=3, retry_backoff=0.0)\\n+ raised = False\\n+ try:\\n+ client._send_with_retry(\\n+ _agent(provider.base_url), {\\\"model\\\": \\\"gpt-x\\\", \\\"temperature\\\": 2.5}\\n+ )\\n+ except RuntimeError:\\n+ raised = True\\n+ assert raised\\n+ assert provider.request_count == 1\\n+\\n+\\n+def test_unsupported_temperature_is_negotiated_for_raw_responses_transport() -> None:\\n+ response = {\\\"id\\\": \\\"response-1\\\", \\\"output\\\": [{\\\"type\\\": \\\"message\\\"}]}\\n+ with _FakeProvider([\\n+ (400, {\\\"error\\\": {\\\"message\\\": \\\"unknown parameter: temperature\\\"}}),\\n+ (200, response),\\n+ ]) as provider:\\n+ client = ModelClient(max_retries=0)\\n+ result = client._send_raw_with_retry(\\n+ _agent(provider.base_url),\\n+ \\\"responses\\\",\\n+ {\\\"model\\\": \\\"gpt-x\\\", \\\"input\\\": \\\"hello\\\", \\\"temperature\\\": 0.2},\\n+ )\\n+ assert result == response\\n+ assert provider.request_count == 2\\n+ assert \\\"temperature\\\" not in provider.requests[1]\\n \\n \\n def test_connection_error_is_transient_and_exhausts() -> None:\" }, { \"sha\": \"00f1b4b2d33f78216e749a9ea19e5a9e7ae55984\", \"filename\": \"tests/test_provider_reliability.py\", \"status\": \"modified\", \"additions\": 40, \"deletions\": 4, \"changes\": 44, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_provider_reliability.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_provider_reliability.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_provider_reliability.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -14,6 +14,8 @@\\n from concurrent.futures import ThreadPoolExecutor\\n from pathlib import Path\\n \\n+import pytest\\n+\\n sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\n \\n from contextual_orchestrator import ModelAgent, TaskOrchestrator # noqa: E402\\n@@ -78,7 +80,7 @@ def _send(self, agent: ModelAgent, payload: dict, destination=None) -> str: # t\\n raise urllib.error.URLError(\\\"local server