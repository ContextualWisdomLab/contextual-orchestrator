\\"application/json\\\":\\n raise RequestError(415, \\\"unsupported_media_type\\\", \\\"content-type must be application/json\\\")\\n- body_size = int(self.headers.get(\\\"content-length\\\", \\\"0\\\"))\\n- if body_size > security.max_body_bytes:\\n- raise RequestError(413, \\\"request_too_large\\\", \\\"request body exceeds configured limit\\\")\\n- raw = self.rfile.read(body_size)\\n- return _coerce_json(raw) if raw else {}\\n+ try:\\n+ body_size = _parse_request_framing(self.headers, security.max_body_bytes)\\n+ except RequestError:\\n+ self.close_connection = True\\n+ raise\\n+ if body_size == 0:\\n+ return {}\\n+ connection = getattr(self, \\\"connection\\\", None)\\n+ previous_timeout = None\\n+ timeout_supported = all(\\n+ hasattr(connection, method) for method in (\\\"gettimeout\\\", \\\"settimeout\\\")\\n+ )\\n+ if timeout_supported:\\n+ previous_timeout = connection.gettimeout()\\n+ connection.settimeout(security.request_read_timeout_seconds)\\n+ read_deadline = time.monotonic() + security.request_read_timeout_seconds\\n+ try:\\n+ chunks = bytearray()\\n+ while len(chunks) < body_size:\\n+ if time.monotonic() >= read_deadline:\\n+ self.close_connection = True\\n+ raise RequestError(408, \\\"request_read_timeout\\\", \\\"request body read timed out\\\")\\n+ chunk = self.rfile.read(body_size - len(chunks))\\n+ if not chunk:\\n+ self.close_connection = True\\n+ raise RequestError(400, \\\"invalid_request_framing\\\", \\\"request body ended before content-length\\\")\\n+ chunks.extend(chunk)\\n+ if len(chunks) < body_size and time.monotonic() >= read_deadline:\\n+ self.close_connection = True\\n+ raise RequestError(408, \\\"request_read_timeout\\\", \\\"request body read timed out\\\")\\n+ except (TimeoutError, socket.timeout):\\n+ self.close_connection = True\\n+ raise RequestError(408, \\\"request_read_timeout\\\", \\\"request body read timed out\\\") from None\\n+ finally:\\n+ if timeout_supported:\\n+ connection.settimeout(previous_timeout)\\n+ return _coerce_json(bytes(chunks))\\n \\n def log_message(self, format: str, *args: object) -> None:\\n+ \\\"\\\"\\\"Disable the base server's unaudited stderr access log.\\\"\\\"\\\"\\n return\\n \\n def _send_error(\\n@@ -5664,6 +6051,13 @@ def _send_error(\\n message: str,\\n detail: dict[str, Any] | None = None,\\n ) -> None:\\n+ _LOGGER.warning(\\n+ \\\"request_failed status=%s code=%s path=%s session_id=%s\\\",\\n+ status,\\n+ code,\\n+ urllib.parse.urlparse(self.path).path,\\n+ current_session_id() or \\\"\\\",\\n+ )\\n self._send(_error_payload(code, message, {\\\"request_id\\\": uuid.uuid4().hex, **(detail or {})}), status)\\n \\n def _send(self, payload: dict[str, Any], status: int = 200) -> None:\\n@@ -5752,8 +6146,16 @@ def serve(\\n port: int = 8000,\\n security: SecurityConfig | None = None,\\n clearfolio_url: str | None = None,\\n+ coordinator: CostRoutingCoordinator | None = None,\\n ) -> None:\\n \\\"\\\"\\\"Serve the admin console and resource-oriented orchestration API.\\\"\\\"\\\"\\n- server = build_server(orchestrator, host=host, port=port, security=security, clearfolio_url=clearfolio_url)\\n+ server = build_server(\\n+ orchestrator,\\n+ host=host,\\n+ port=port,\\n+ security=security,\\n+ clearfolio_url=clearfolio_url,\\n+ coordinator=coordinator,\\n+ )\\n print(f\\\"listening on http://{host}:{port}\\\")\\n server.serve_forever()\" }, { \"sha\": \"27424e96201cd7d326d014f78996d7a6f1b49690\", \"filename\": \"contextual_orchestrator/telemetry.py\", \"status\": \"added\", \"additions\": 207, \"deletions\": 0, \"changes\": 207, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Ftelemetry.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/contextual_orchestrator%2Ftelemetry.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/contextual_orchestrator%2Ftelemetry.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,207 @@\\n+\\\"\\\"\\\"Prompt-safe OpenTelemetry and session correlation for the gateway.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+import logging\\n+from collections.abc import Iterator, Mapping\\n+from contextlib import contextmanager\\n+from contextvars import ContextVar, Token\\n+from typing import Any\\n+\\n+try:\\n+ from opentelemetry import trace\\n+ from opentelemetry.context import attach as _otel_attach\\n+ from opentelemetry.context import detach as _otel_detach\\n+ from opentelemetry.propagate import extract as _otel_extract\\n+ from opentelemetry.propagate import inject as _otel_inject\\n+ from opentelemetry.trace import SpanKind, Status, StatusCode\\n+except ImportError: # pragma: no cover - dependency is declared by the project\\n+ trace = None # type: ignore[assignment]\\n+ _otel_attach = None\\n+ _otel_detach = None\\n+ _otel_extract = None\\n+ _otel_inject = None\\n+ SpanKind = None # type: ignore[assignment,misc]\\n+ Status = None # type: ignore[assignment,misc]\\n+ StatusCode = None # type: ignore[assignment,misc]\\n+\\n+_LOGGER = logging.getLogger(__name__)\\n+_CURRENT_SESSION: ContextVar[str | None] = ContextVar(\\n+ \\\"contextual_orchestrator_session_id\\\", default=None\\n+)\\n+_CONFIGURED = False\\n+\\n+\\n+def _otlp_trace_endpoint(endpoint: str) -> str:\\n+ \\\"\\\"\\\"Turn an OTLP base endpoint into the explicit HTTP traces endpoint.\\\"\\\"\\\"\\n+ normalized = endpoint.rstrip(\\\"/\\\")\\n+ if normalized.casefold().endswith(\\\"/v1/traces\\\"):\\n+ return normalized\\n+ return f\\\"{normalized}/v1/traces\\\"\\n+\\n+\\n+def _config_value(config: Any | None, key: str, default: Any = None) -> Any:\\n+ \\\"\\\"\\\"Read one telemetry setting from the injected KV configuration.\\\"\\\"\\\"\\n+ if config is None:\\n+ return default\\n+ return config.get(\\\"telemetry\\\", key, default)\\n+\\n+\\n+def _normalize_session_id(value: object) -> str | None:\\n+ \\\"\\\"\\\"Accept a bounded correlation value without accepting a bearer token.\\\"\\\"\\\"\\n+ if not isinstance(value, str):\\n+ return None\\n+ value = value.strip()\\n+ if not value or len(value) > 128 or any(ord(char) < 0x20 for char in value):\\n+ return None\\n+ return value\\n+\\n+\\n+def session_id_from_headers(headers: Mapping[str, str]) -> str | None:\\n+ \\\"\\\"\\\"Read the LineageWeave correlation header from an HTTP request.\\\"\\\"\\\"\\n+ return _normalize_session_id(\\n+ headers.get(\\\"x-lineageweave-session-id\\\") or headers.get(\\\"x-session-id\\\")\\n+ )\\n+\\n+\\n+def session_id_from_metadata(metadata: Mapping[str, Any] | None) -> str | None:\\n+ \\\"\\\"\\\"Read a session value from compatible OpenAI metadata fields.\\\"\\\"\\\"\\n+ if metadata is None:\\n+ return None\\n+ return _normalize_session_id(\\n+ metadata.get(\\\"lineageweave_post_session_id\\\") or metadata.get(\\\"session_id\\\")\\n+ )\\n+\\n+\\n+def current_session_id() -> str | None:\\n+ \\\"\\\"\\\"Return the request-scoped correlation value, if one is bound.\\\"\\\"\\\"\\n+ return _CURRENT_SESSION.get()\\n+\\n+\\n+def set_session_id(value: object) -> Token[str | None]:\\n+ \\\"\\\"\\\"Bind one session to the current request context.\\\"\\\"\\\"\\n+ return _CURRENT_SESSION.set(_normalize_session_id(value))\\n+\\n+\\n+def reset_session_id(token: Token[str | None]) -> None:\\n+ \\\"\\\"\\\"Restore the context value that preceded a request.\\\"\\\"\\\"\\n+ _CURRENT_SESSION.reset(token)\\n+\\n+\\n+def attach_trace_context(headers: Mapping[str, str]) -> Any:\\n+ \\\"\\\"\\\"Attach an inbound W3C trace context and return its reset token.\\\"\\\"\\\"\\n+ if _otel_extract is None or _otel_attach is None:\\n+ return None\\n+ carrier = {str(key).lower(): str(value) for key, value in headers.items()}\\n+ return _otel_attach(_otel_extract(carrier))\\n+\\n+\\n+def detach_trace_context(token: Any) -> None:\\n+ \\\"\\\"\\\"Detach an inbound W3C trace context after one HTTP request.\\\"\\\"\\\"\\n+ if token is not None and _otel_detach is not None:\\n+ _otel_detach(token)\\n+\\n+\\n+def inject_trace_context(headers: dict[str, str]) -> None:\\n+ \\\"\\\"\\\"Inject the active W3C trace context into one provider request.\\\"\\\"\\\"\\n+ if _otel_inject is not None:\\n+ _otel_inject(headers)\\n+\\n+\\n+def _safe_attributes(\\n+ attributes: Mapping[str, Any] | None,\\n+) -> dict[str, str | int | float | bool]:\\n+ \\\"\\\"\\\"Keep span attributes scalar and exclude prompt, answer, and secret content.\\\"\\\"\\\"\\n+ result: dict[str, str | int | float | bool] = {}\\n+ for key, value in (attributes or {}).items():\\n+ if (\\n+ not isinstance(key, str)\\n+ or not key\\n+ or isinstance(value, (dict, list, tuple, set))\\n+ ):\\n+ continue\\n+ if isinstance(value, str):\\n+ result[key] = value[:256]\\n+ elif isinstance(value, (bool, int, float)):\\n+ result[key] = value\\n+ session_id = current_session_id()\\n+ if session_id:\\n+ result.setdefault(\\\"contextual_orchestrator.session_id\\\", session_id)\\n+ return result\\n+\\n+\\n+def configure_telemetry(\\n+ service_name: str = \\\"contextual-orchestrator\\\",\\n+ *,\\n+ config: Any | None = None,\\n+) -> None:\\n+ \\\"\\\"\\\"Configure OTLP export from the injected KV configuration only.\\\"\\\"\\\"\\n+ global _CONFIGURED\\n+ if _CONFIGURED:\\n+ return\\n+ if config is None:\\n+ _LOGGER.debug(\\\"OpenTelemetry is not configured without a KV store\\\")\\n+ return\\n+ _CONFIGURED = True\\n+ if str(_config_value(config, \\\"sdk_disabled\\\", \\\"\\\")).lower() == \\\"true\\\":\\n+ return\\n+ endpoint = str(_config_value(config, \\\"exporter_otlp_endpoint\\\", \\\"\\\")).strip()\\n+ if trace is None or not endpoint:\\n+ return\\n+ try:\\n+ from opentelemetry.exporter.otlp.proto.http.trace_exporter import (\\n+ OTLPSpanExporter,\\n+ )\\n+ from opentelemetry.sdk.resources import Resource\\n+ from opentelemetry.sdk.trace import TracerProvider\\n+ from opentelemetry.sdk.trace.export import BatchSpanProcessor\\n+ except ImportError: # pragma: no cover - guarded by the runtime dependency\\n+ _LOGGER.warning(\\\"OpenTelemetry SDK/exporter is unavailable\\\")\\n+ return\\n+\\n+ configured_service_name = str(\\n+ _config_value(config, \\\"service_name\\\", service_name)\\n+ ).strip() or service_name\\n+ resource = Resource.create({\\n+ \\\"service.name\\\": configured_service_name,\\n+ \\\"service.namespace\\\": \\\"contextualwisdomlab\\\",\\n+ })\\n+ provider = TracerProvider(resource=resource)\\n+ provider.add_span_processor(\\n+ BatchSpanProcessor(\\n+ OTLPSpanExporter(endpoint=_otlp_trace_endpoint(endpoint))\\n+ )\\n+ )\\n+ trace.set_tracer_provider(provider)\\n+\\n+\\n+@contextmanager\\n+def traced(\\n+ name: str,\\n+ attributes: Mapping[str, Any] | None = None,\\n+) -> Iterator[Any]:\\n+ \\\"\\\"\\\"Trace one provider CLIENT operation and preserve all failures.\\\"\\\"\\\"\\n+ if trace is None: # pragma: no cover - dependency is declared by the project\\n+ yield None\\n+ return\\n+ tracer = trace.get_tracer(\\\"contextual-orchestrator\\\")\\n+ safe = _safe_attributes(attributes)\\n+ with tracer.start_as_current_span(\\n+ name,\\n+ kind=SpanKind.CLIENT,\\n+ attributes=safe,\\n+ ) as span:\\n+ try:\\n+ yield span\\n+ except Exception as exc:\\n+ if Status is not None and StatusCode is not None:\\n+ span.record_exception(exc)\\n+ span.set_attribute(\\\"error.type\\\", type(exc).__name__)\\n+ span.set_status(Status(StatusCode.ERROR))\\n+ _LOGGER.warning(\\n+ \\\"telemetry.operation_failed operation=%s error_type=%s session_id=%s\\\",\\n+ name,\\n+ type(exc).__name__,\\n+ safe.get(\\\"contextual_orchestrator.session_id\\\", \\\"\\\"),\\n+ )\\n+ raise\" }, { \"sha\": \"c04f528e099aed5de2d0772646adc33af8a0f569\", \"filename\": \"docs/adr/0122-otel-session-observability.md\", \"status\": \"added\", \"additions\": 54, \"deletions\": 0, \"changes\": 54, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fadr%2F0122-otel-session-observability.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fadr%2F0122-otel-session-observability.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fadr%2F0122-otel-session-observability.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,54 @@\\n+# ADR 0122: Correlate gateway provider telemetry by caller session\\n+\\n+## Status\\n+\\n+Accepted.\\n+\\n+## Context\\n+\\n+The gateway can route one request through several workers and providers. A\\n+caller-provided post session already exists in compatible metadata, but it was\\n+not bound to the HTTP request or provider diagnostics. The organization GRC\\n+service owns the low-cardinality, secret-free telemetry control in its ADR\\n+0009; this service must emit evidence that can be consumed there without\\n+becoming a second GRC store.\\n+\\n+## Decision\\n+\\n+Telemetry deployment settings may enter the process KV during bootstrap from non-secret OTEL_* transport settings; runtime telemetry reads the injected KV only. A configured OTLP base URL is normalized to the HTTP /v1/traces signal endpoint.\\n+\\n+1. Use the OpenTelemetry Python API, SDK, and OTLP HTTP exporter. Export is\\n+ disabled unless `OTEL_EXPORTER_OTLP_ENDPOINT` is explicitly configured.\\n+2. Accept `X-LineageWeave-Session-Id` and compatible metadata fields, bind the\\n+ normalized value to the request context, and reset it when the request\\n+ handler finishes.\\n+3. Add the bounded session correlation to provider spans for chat and embedding\\n+ calls. Follow the current OpenTelemetry GenAI span convention: emit CLIENT\\n+ spans named `chat {model}` or `embeddings {model}`, include the required\\n+ `gen_ai.operation.name` and `gen_ai.provider.name` attributes, and use\\n+ `server.address` / `server.port` for the transport destination. Record\\n+ `error.type` on failure, but never prompt, answer, request body, API key, or\\n+ raw provider response.\\n+4. Keep structured-output, Responses API, VISION, embedding, and multi-agent\\n+ requests on the same orchestration path. Telemetry observes that path; it\\n+ does not introduce a single-agent fallback or a second credential source.\\n+\\n+## Consequences\\n+\\n+An operator can follow one LineageWeave post through gateway routing and\\n+provider failures while GRC receives aggregate operational evidence rather\\n+than copied product data. Session correlation is diagnostic only: it is not an\\n+identity, tenant, authorization, or evidence label.\\n+\\n+## References\\n+\\n+OpenTelemetry Authors. (n.d.). *Manual instrumentation with OpenTelemetry\\n+Python*. Retrieved August 21, 2026, from\\n+https://opentelemetry.io/docs/languages/python/instrumentation/\\n+\\n+OpenTelemetry Authors. (n.d.). *Service semantic conventions*. Retrieved\\n+August 21, 2026, from https://opentelemetry.io/docs/specs/semconv/registry/attributes/service/\\n+\\n+OpenTelemetry Authors. (n.d.). *Semantic conventions for generative AI spans*.\\n+Retrieved August 21, 2026, from\\n+https://github.com/open-telemetry/semantic-conventions-genai/blob/main/docs/gen-ai/gen-ai-spans.md\" }, { \"sha\": \"bfdafea3a1e22e34b6ba32226cf68fee3dc9f7bb\", \"filename\": \"docs/architecture.md\", \"status\": \"modified\", \"additions\": 33, \"deletions\": 2, \"changes\": 35, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Farchitecture.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Farchitecture.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Farchitecture.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -6,6 +6,10 @@\\n - Sakana Fugu Technical Report: https://github.com/SakanaAI/fugu/blob/main/Fugu_technical_report.pdf\\n - TRINITY: An Evolved LLM Coordinator: https://arxiv.org/abs/2512.04695\\n - Learning to Orchestrate Agents in Natural Language with the Conductor: https://arxiv.org/abs/2512.04388\\n+- Route to Reason: Adaptive Routing for LLM and Reasoning Strategy Selection: https://arxiv.org/abs/2505.19435\\n+- Route-and-Reason: Scaling Large Language Model Reasoning with Reinforced Model Router: https://arxiv.org/abs/2506.05901\\n+- Reasoning on a Budget: A Survey of Adaptive and Controllable Test-Time Compute in LLMs: https://arxiv.org/abs/2507.02076\\n+- Ares: Adaptive Reasoning Effort Selection for Efficient LLM Agents: https://arxiv.org/abs/2603.07915\\n \\n ## What The Architecture Is\\n \\n@@ -24,6 +28,17 @@ The useful split is quality-latency, not separate products:\\n - Low-latency routing: select one worker for the current query or turn.\\n - Deep orchestration: create a multi-step workflow when the task needs decomposition, independent attempts, verification, or synthesis.\\n \\n+Structured provider features do not create a third single-agent path. A\\n+non-null `response_format` or Responses request enters the conducted workflow\\n+and reaches one final provider only after the\\n+Thinker/Worker/Verifier/Synthesizer evidence has been assembled. The final\\n+provider call preserves the validated wire feature; it is a transport boundary,\\n+not a bypass of orchestration. JSON object and JSON schema are both covered by\\n+[ADR 0011](planning/adrs/0011-structured-provider-features-stay-orchestrated.md).\\n+The explicit client-owned tool-loop exception remains the single-worker\\n+contract defined by [ADR 0014](planning/adrs/0014-gateway-owned-model-selection.md);\\n+ordinary tool declarations without that opt-in fail closed.\\n+\\n TRINITY contributes the compact coordinator idea: a small model representation plus a lightweight head can choose agent and role over multiple turns. Its Thinker, Worker, and Verifier contracts are practical enough to implement directly.\\n \\n Conductor contributes the workflow representation: each step is a natural-language subtask, an assigned worker, and an access list of prior step outputs. This is the key piece for preventing every worker from being dragged into the same transcript while still allowing deliberate collaboration.\\n@@ -48,10 +63,23 @@ bounded, authenticated recursion protocol; it is not administratively disabled.\\n - `Orchestrator.route_once`: the low-latency routing path.\\n - `Orchestrator.conduct`: the workflow path with planner, worker, verifier, and synthesizer steps.\\n - `WorkflowStep.access`: Conductor-style visibility control.\\n+- Image-bearing Chat Completions and Responses retain their typed source image\\n+ blocks in every evidence-bearing workflow step; access lists still constrain\\n+ prior model outputs. See [ADR 0018](planning/adrs/0018-multimodal-evidence-preserving-orchestration.md).\\n - `ModelClient`: OpenAI-compatible HTTP client, with `mock://` for local checks.\\n - `contextual_orchestrator.server`: small `/v1/chat/completions` HTTP server.\\n \\n-The deliberate simplification is the policy. The paper systems learn routing and topology from rewards; this lab uses a deterministic capability-hint heuristic only for worker/role routing so the repo runs without training data, GPUs, or vendor credentials. It is never an answer-quality, verification, or accept/reject judgment: verifier decisions must use the structured model judge and fail closed (see [ADR 0001](planning/adrs/0001-fail-closed-model-judgment.md)).\\n+The deliberate simplification is the policy. The paper systems learn routing\\n+and topology from rewards; this lab uses capability evidence and a bounded\\n+orchestrator policy, with `auto` kept internal rather than sent as a provider\\n+value. This is never an answer-quality, verification, or accept/reject\\n+judgment: verifier decisions must use the structured model judge and fail\\n+closed (see [ADR 0001](planning/adrs/0001-fail-closed-model-judgment.md)).\\n+\\n+Model and reasoning changes are governed by [ADR\\n+0013](planning/adrs/0013-paper-grounded-adaptive-reasoning-policy.md). The\\n+provider-neutral gateway boundary and direct-MLX prohibition are governed by\\n+[ADR 0012](planning/adrs/0012-gateway-only-provider-contract.md).\\n \\n Add learned routing only when there is an evaluation set and logs proving the heuristic policy is the bottleneck.\\n \\n@@ -73,6 +101,9 @@ OpenAI. (n.d.-a). *Create chat completion*. OpenAI Platform. https://platform.op\\n \\n OpenAI. (n.d.-b). *Create a model response*. OpenAI Platform. https://platform.openai.com/docs/api-reference/responses/create\\n \\n+Tang, Y., et al. (2026). *Sakana Fugu technical report* (arXiv:2606.21228).\\n+arXiv. https://doi.org/10.48550/arXiv.2606.21228\\n+\\n Sakana AI. (2026, June 22). *Sakana Fugu: One model to command them all*. https://sakana.ai/fugu-release/\\n \\n Xu, J., Sun, Q., Schwendeman, P., Nielsen, S., Cetin, E., & Tang, Y. (2025). *Trinity: An evolved LLM coordinator* (arXiv:2512.04695). https://doi.org/10.48550/arXiv.2512.04695\\n@@ -92,4 +123,4 @@ The product is not a Fugu clone. It is a control-plane prototype for the same pu\\n See [product_planning.md](product_planning.md) for the product reboot.\\n \\n \\n-OpenAI o-series `reasoning_effort` (chat/Completions) and Responses `reasoning.effort` accept known levels `none`/`minimal`/`low`/`medium`/`high` (casefold, strip) as default-effort no-ops when this gateway has no effort plane; unknown levels fail closed with named errors. Locked by `tests/test_reasoning_effort_low_medium_high_noop_http_honesty.py` on tip ≥ #738.\\n+OpenAI o-series `reasoning_effort` (chat/Completions) and Responses `reasoning.effort` accept provider levels `none`/`minimal`/`low`/`medium`/`high` plus the orchestrator-owned `auto` policy value (casefold, strip). They are default-effort no-ops when this gateway has no effort plane; unknown levels fail closed with named errors. Locked by the reasoning HTTP honesty tests on tip ≥ #738.\" }, { \"sha\": \"caca05ee5d4a65a54c8672c9f26e4bb0f0dcdf71\", \"filename\": \"docs/doctoring/OPENTELEMETRY_REFERENCES.md\", \"status\": \"added\", \"additions\": 29, \"deletions\": 0, \"changes\": 29, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fdoctoring%2FOPENTELEMETRY_REFERENCES.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fdoctoring%2FOPENTELEMETRY_REFERENCES.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fdoctoring%2FOPENTELEMETRY_REFERENCES.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,29 @@\\n+# OpenTelemetry references and implementation traceability\\n+\\n+## Normative references\\n+\\n+- OpenTelemetry Authors. (n.d.). *Manual instrumentation with OpenTelemetry\\n+ Python*. Retrieved August 21, 2026, from\\n+ https://opentelemetry.io/docs/languages/python/instrumentation/\\n+- OpenTelemetry Authors. (n.d.). *Service semantic conventions*. Retrieved\\n+ August 21, 2026, from\\n+ https://opentelemetry.io/docs/specs/semconv/registry/attributes/service/\\n+- OpenTelemetry Authors. (n.d.). *Semantic conventions for generative AI\\n+ spans*. Retrieved August 21, 2026, from\\n+ https://github.com/open-telemetry/semantic-conventions-genai/blob/main/docs/gen-ai/gen-ai-spans.md\\n+- ContextualWisdomLab governance-risk-compliance. (2026). *ADR 0009:\\n+ Emit bounded OpenTelemetry request telemetry*. Retrieved August 21, 2026,\\n+ from https://github.com/ContextualWisdomLab/governance-risk-compliance/blob/develop/docs/adr/0009-opentelemetry-request-telemetry.md\\n+\\n+## Implementation mapping\\n+\\n+| Concern | Implementation | Evidence boundary |\\n+| --- | --- | --- |\\n+| Service resource | `OTEL_SERVICE_NAME`, default `contextual-orchestrator` | One logical service name per deployment |\\n+| Request correlation | `X-LineageWeave-Session-Id` and compatible metadata | Correlation only; not identity or authorization |\\n+| Provider calls | `ModelClient` chat/embedding CLIENT spans | Required GenAI operation/provider attributes, model and server destination; no prompt, answer, key, or response |\\n+| Export | Bootstrap OTEL_EXPORTER_OTLP_ENDPOINT into the process KV | Disabled by default; runtime reads KV and sends to the normalized /v1/traces signal |\\n+\\n+The GRC repository remains the organization control and evidence owner. The\\n+gateway emits operational signals and does not copy GRC tables or provider\\n+credentials.\" }, { \"sha\": \"a1bdcf76bca059234fe8bf91a7fd49671cde5437\", \"filename\": \"docs/doctoring/embedding-chat-capability-isolation.md\", \"status\": \"added\", \"additions\": 131, \"deletions\": 0, \"changes\": 131, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fdoctoring%2Fembedding-chat-capability-isolation.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fdoctoring%2Fembedding-chat-capability-isolation.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fdoctoring%2Fembedding-chat-capability-isolation.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,131 @@\\n+# Embedding-to-chat capability isolation incident\\n+\\n+**Status:** Accepted incident decision\\n+**Date:** 2026-08-20\\n+**Affected consumer:** LineageWeave buyer-surface stack around PR #260\\n+\\n+## Incident\\n+\\n+A conducted workflow reached the final contextual-orchestrator synthesizer with\\n+`model_group=text-embedding-3-large` and deployment\\n+`azure/text-embedding-3-large`. The gateway rejected the chat operation as\\n+unsupported. Its configured fallback map contained chat-generation model groups,\\n+but no fallback attached to the embedding group.\\n+\\n+The missing fallback was a symptom, not the causal defect. An embedding deployment\\n+had already crossed the chat-agent capability boundary and become eligible for a\\n+worker role.\\n+\\n+## Causal boundary\\n+\\n+Provider-compatible `/models` registries can contain multiple endpoint families.\\n+The original discovery parser accepted every non-empty model identifier and exposed\\n+it to agent creation, price selection, and durable pool synchronization. A catalog\\n+row naming an embedding deployment could therefore be scored for thinker, worker,\\n+verifier, or synthesizer work even though its serving endpoint accepts embedding\\n+input rather than chat messages.\\n+\\n+The first incident fix closed discovery and price-routing boundaries, but further\\n+root-cause tracing showed an already-persisted incompatible `ModelAgent` could still\\n+survive that filter. The runtime ranking path, generated workflow assignment,\\n+cross-agent failover, readiness probe, streaming path, and direct\\n+`ModelClient.chat()` path previously trusted the persisted model identifier. That\\n+stale-state path is sufficient to reproduce the same unsupported Azure chat\\n+operation after a process restart or durable bootstrap.\\n+\\n+OpenAI documents `text-embedding-3-large` under the embeddings endpoint, separately\\n+from models supported by chat completions. Microsoft likewise demonstrates it with\\n+`client.embeddings.create`, not `client.chat.completions.create`. LiteLLM exposes\\n+chat, responses, embeddings, image, audio, rerank, and other endpoint families as\\n+distinct operations. A router fallback can choose another deployment for the same\\n+operation; it cannot make an embedding deployment execute a chat operation.\\n+\\n+## Decision\\n+\\n+Chat transport compatibility and general agent-role eligibility are separate\\n+shared runtime invariants. A provider may expose an audio-capable model or a\\n+policy classifier through Chat Completions while that model remains unsuitable\\n+for ordinary thinker, worker, verifier, or synthesizer work.\\n+\\n+1. Normalize provider prefixes and common separators in model identifiers.\\n+2. At the transport boundary, reject identifiers that clearly advertise embedding,\\n+ reranking, transcription, moderation-endpoint, image-generation, realtime, or\\n+ speech-only semantics.\\n+3. Keep provider-documented audio and policy-classifier models transport-compatible\\n+ when they are served through Chat Completions.\\n+4. At discovery and ordinary orchestration-role boundaries, additionally exclude\\n+ explicit guard, safety, and NemoGuard policy classifiers.\\n+5. Apply the general-role guard while parsing both OpenAI-compatible and Bytez\\n+ catalogs and before converting, pricing, or cost-selecting a discovery record.\\n+6. Remove stale ineligible agents from thinker, worker, verifier, and synthesizer\\n+ ranking even if a durable configuration still contains them.\\n+7. Reselect a generated workflow step that explicitly names a stale ineligible\\n+ agent and omit such agents from planner inventory.\\n+8. Remove ineligible agents from cross-agent failover candidates.\\n+9. Apply the transport guard at `ModelClient.chat()`, `stream_chat()`, and\\n+ readiness probing before mock or network transport.\\n+10. Fail closed when no general chat agent remains.\\n+11. Leave unknown identifiers eligible without fabricating reasoning, tool, vision,\\n+ or verification capabilities from their names.\\n+\\n+This is deliberately a conservative negative filter. A future capability registry\\n+may replace name-based exclusion with authenticated provider metadata, measured\\n+endpoint probes, and separate endpoint-specific pools. Until that evidence exists,\\n+a clearly incompatible model fails closed at transport boundaries and a clearly\\n+specialized policy model fails closed at general-role boundaries.\\n+\\n+## Rejected response\\n+\\n+Adding `text-embedding-3-large` to a chat fallback map is rejected. It would retain\\n+the invalid primary assignment and merely hide it when a fallback happened to be\\n+available. Repeated provider retries are also rejected because the request is\\n+structurally unsupported, not transiently unavailable.\\n+\\n+## Residual operational action\\n+\\n+Runtime containment means an already-persisted embedding agent can no longer win\\n+chat selection or failover while stale data is being cleaned up. Durable state must\\n+still converge to the correct exact set: the provider-bootstrap slice owns stale\\n+discovered-agent withdrawal and must import the same shared classifier when rebased.\\n+Runtime rejection is defense in depth, not a substitute for deleting invalid\\n+persistent configuration.\\n+\\n+## Verification evidence\\n+\\n+`tests/test_chat_model_capability_isolation.py` reproduces the exact Azure model ID\\n+and provider/separator aliases. Together with\\n+`tests/test_chat_capability_unknown_identifiers.py`,\\n+`tests/test_chat_transport_role_separation.py`, and\\n+`tests/test_chat_passthrough_capability_isolation.py`, it verifies:\\n+\\n+- OpenAI-compatible and Bytez catalog filtering;\\n+- malformed and prefix-only identifier handling;\\n+- agent-conversion rejection;\\n+- exclusion from the price book and cheapest-agent selection;\\n+- exclusion of a high-priority stale embedding agent from synthesizer selection;\\n+- fail-closed behavior when the persisted pool contains only non-chat agents;\\n+- generated-plan reassignment away from a stale embedding agent;\\n+- exclusion from cross-agent failover;\\n+- direct and streaming `ModelClient` rejection before transport;\\n+- readiness failure with a stable non-chat code before provider access;\\n+- planner inventory and generated-plan isolation;\\n+- distinction between chat-served audio/policy models and general agent roles.\\n+- conservative unknown-identifier handling, including unrelated `vanguard` names;\\n+- endpoint-family exclusions for image-generation (`dall-e`), CLIP, and SigLIP;\\n+- normalized `/v1/responses` passthrough and pre-transport rejection of embedding models.\\n+\\n+## References\\n+\\n+BerriAI. (n.d.). *LiteLLM: Call 100+ LLMs using the OpenAI input/output format*.\\n+Retrieved August 20, 2026, from https://docs.litellm.ai/\\n+\\n+Microsoft. (n.d.). *How to switch between OpenAI and Azure OpenAI endpoints*.\\n+Microsoft Learn. Retrieved August 20, 2026, from\\n+https://learn.microsoft.com/en-us/azure/developer/ai/how-to/switching-endpoints\\n+\\n+OpenAI. (n.d.). *Data controls in the OpenAI platform: Default usage policies by\\n+endpoint*. Retrieved August 20, 2026, from\\n+https://platform.openai.com/docs/models/default-usage-policies-by-endpoint\\n+\\n+OpenAI. (n.d.). *GPT-audio model*. Retrieved August 20, 2026, from\\n+https://developers.openai.com/api/docs/models/gpt-audio\" }, { \"sha\": \"6a50017d8629cfe80f8c2fe5696e5cbd43db78d6\", \"filename\": \"docs/doctoring/inbound-request-framing.md\", \"status\": \"added\", \"additions\": 28, \"deletions\": 0, \"changes\": 28, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fdoctoring%2Finbound-request-framing.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fdoctoring%2Finbound-request-framing.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fdoctoring%2Finbound-request-framing.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,28 @@\\n+# Inbound request framing doctoring\\n+\\n+## Root cause\\n+\\n+`_read_json` used `int(headers[\\\"Content-Length\\\"])` and read that value without\\n+handling unsupported transfer coding, duplicate fields, premature EOF, or\\n+a read deadline. A negative value could reach an unbounded `read(-1)`.\\n+\\n+## Implemented contract\\n+\\n+- exactly one ASCII decimal `Content-Length` is required;\\n+- unsupported `Transfer-Encoding` and every ambiguous combination fail closed;\\n+- declared size is checked before reading;\\n+- the body is read exactly and a premature EOF is rejected;\\n+- a finite request-read timeout is applied and restored;\\n+- framing failures close the connection and do not echo body/header content.\\n+\\n+## Verification\\n+\\n+```bash\\n+pytest -q tests/test_inbound_request_framing.py\\n+python -m compileall -q contextual_orchestrator\\n+git diff --check\\n+```\\n+\\n+The implementation follows HTTP/1.1 message framing and connection-management\\n+requirements in RFC 9112 (Fielding et al., 2022). It deliberately does not\\n+claim support for chunked transfer coding.\" }, { \"sha\": \"6ee39042960b7d82195ddfc539ef1d74884f8aae\", \"filename\": \"docs/kv-credentials.md\", \"status\": \"modified\", \"additions\": 7, \"deletions\": 19, \"changes\": 26, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fkv-credentials.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fkv-credentials.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fkv-credentials.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -21,8 +21,6 @@ register_credential(\\\"OPENAI_API_KEY\\\", value) # writes into the KV\\n The orchestrator resolves an agent's provider key through this seam only:\\n \\n - Remote `ModelAgent` records use `get_credential(agent.credential_name)`.\\n-- Direct `mlx://` workers are intentionally keyless and never receive a\\n- provider credential.\\n - Authenticated loopback `local://` gateways may use the separate,\\n explicitly named `ModelAgent.local_credential_key`.\\n - `ModelClient._send()` resolves the transport-specific key before building\\n@@ -50,30 +48,20 @@ string is treated as the **credential name** in the KV — it is *not* read as a\\n environment variable. `ModelAgent.credential_name` returns `api_key_env` when\\n present, otherwise `credential_key`.\\n \\n-### Direct MLX versus an authenticated local gateway\\n+### Authenticated local gateway\\n \\n-These schemes have different credential contracts:\\n+A `local://` URL denotes a provider-neutral loopback gateway. When that gateway\\n+requires bearer authentication, configure only its explicit local token name:\\n \\n ```json\\n-{ \\\"id\\\": \\\"mlx_worker\\\", \\\"model\\\": \\\"mlx-community/gemma-4-e4b-it-4bit\\\",\\n- \\\"base_url\\\": \\\"mlx://127.0.0.1:18083/v1\\\" }\\n-```\\n-\\n-The direct `mlx://` transport is a loopback-only, keyless mlx-lm server. A\\n-`credential_key` or remote `OPENAI_API_KEY` is never forwarded to it. A\\n-`local://` URL instead denotes the contextual-orchestrator loopback gateway;\\n-when that gateway requires bearer authentication, configure only its explicit\\n-local token name:\\n-\\n-```json\\n-{ \\\"id\\\": \\\"mlx_gateway\\\", \\\"model\\\": \\\"mlx-community/gemma-4-e4b-it-4bit\\\",\\n+{ \\\"id\\\": \\\"local_gateway\\\", \\\"model\\\": \\\"gateway-selected-model\\\",\\n \\\"base_url\\\": \\\"local://127.0.0.1:18084/v1\\\",\\n \\\"local_credential_key\\\": \\\"LOCAL_GATEWAY_TOKEN\\\" }\\n ```\\n \\n-The gateway owns worker template settings, so `chat_template_kwargs` is sent\\n-only to direct `mlx://` workers. Missing local gateway credentials fail closed;\\n-they do not fall back to an OpenAI credential or an unauthenticated request.\\n+The gateway owns worker-specific settings. Missing local gateway credentials\\n+fail closed; they do not fall back to an OpenAI credential or an\\n+unauthenticated request.\\n \\n ## Backends\\n \" }, { \"sha\": \"e645dab9f9f6004d831c7581b94bab1a88785f9a\", \"filename\": \"docs/library_research.md\", \"status\": \"modified\", \"additions\": 3, \"deletions\": 2, \"changes\": 5, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Flibrary_research.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Flibrary_research.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Flibrary_research.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -1,6 +1,6 @@\\n # Library Research\\n \\n-The design researched existing libraries before adding code. The repository keeps the runtime dependency-free for the current lab, but the enterprise implementation target is explicit.\\n+The design researched existing libraries before adding code. Runtime dependencies are kept explicit and hash-locked; optional enterprise integrations remain separate until they carry product weight.\\n \\n ## Selected Stack\\n \\n@@ -13,12 +13,13 @@ The design researched existing libraries before adding code. The repository keep\\n | Migrations | [Alembic](https://alembic.sqlalchemy.org/) | Use for schema migration lifecycle. | Alembic is the SQLAlchemy migration tool and supports autogenerated migrations from metadata. |\\n | Database | [PostgreSQL](https://www.postgresql.org/docs/current/sql-syntax-lexical.html) | Default relational store. | PostgreSQL identifiers allow letters, digits, and underscores; the project standardizes on unquoted lower snake_case. |\\n | API contract | [OpenAPI 3.1](https://spec.openapis.org/oas/v3.1.0.html) | Contract format for API review and client generation. | OAS defines a language-agnostic HTTP API description for humans and machines. |\\n+| Observability | [OpenTelemetry Python](https://opentelemetry.io/docs/languages/python/) | Use the API, SDK, and OTLP HTTP exporter for prompt-safe request/provider spans. | The standard Python API/SDK separates instrumentation from export; this repository keeps export disabled unless the injected process KV supplies an OTLP endpoint. |\\n \\n ## Ponytail Decision\\n \\n No new dependency is added until it carries real product weight:\\n \\n-- Current prototype: stdlib server, handwritten OpenAPI, static admin UI.\\n+- Current prototype: stdlib server, handwritten OpenAPI, static admin UI, and bounded OpenTelemetry instrumentation.\\n - First enterprise cut: FastAPI + React-admin + i18next + PostgreSQL + SQLAlchemy + Alembic.\\n - Do not add provider SDKs until raw OpenAI-compatible HTTP is insufficient.\\n \" }, { \"sha\": \"907b333c8e99734fe20f3b434cf0ab162e2876ba\", \"filename\": \"docs/papers/README.md\", \"status\": \"modified\", \"additions\": 63, \"deletions\": 0, \"changes\": 63, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fpapers%2FREADME.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fpapers%2FREADME.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fpapers%2FREADME.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -46,3 +46,66 @@ but not vendored here so this repository remains one deployable control plane.\\n > Citations are provided for scholarly attribution. Redistribution here relies\\n > on the arXiv non-exclusive distribution license each author granted; no\\n > GPL/AGPL-licensed material is vendored anywhere in this repository.\\n+\\n+## Adaptive reasoning and orchestration\\n+\\n+These sources govern model and reasoning-policy decisions. They are cited and\\n+linked rather than vendored because this repository does not assume that every\\n+paper permits redistribution of its PDF.\\n+\\n+- **Sakana Fugu Technical Report** — Yujin Tang et al. arXiv:2606.21228,\\n+ 2026. https://arxiv.org/abs/2606.21228\\n+ Grounds query-adaptive scaffolds over specialized agent teams. It supports\\n+ preserving modality evidence for each assigned specialist; it does not\\n+ justify selecting a model from its name.\\n+- **TRINITY: An Evolved LLM Coordinator** — Jinglue Xu, Qi Sun, Peter\\n+ Schwendeman, Stefan Nielsen, Edoardo Cetin, Yujin Tang. arXiv:2512.04695,\\n+ 2025. https://arxiv.org/abs/2512.04695\\n+ Grounds explicit Thinker, Worker, and Verifier role assignment over a\\n+ heterogeneous pool.\\n+- **Learning to Orchestrate Agents in Natural Language with the Conductor** —\\n+ Stefan Nielsen, Edoardo Cetin, Peter Schwendeman, Qi Sun, Jinglue Xu, Yujin\\n+ Tang. arXiv:2512.04388, 2025. https://arxiv.org/abs/2512.04388\\n+ Grounds targeted communication topology and natural-language subtasks. The\\n+ access list controls prior agent outputs, not removal of the source image.\\n+\\n+- **Route to Reason: Adaptive Routing for LLM and Reasoning Strategy Selection**\\n+ — Zhihong Pan, Kai Zhang, Yuze Zhao, Yupeng Han. arXiv:2505.19435, 2025.\\n+ https://arxiv.org/abs/2505.19435\\n+ Grounds joint routing of models and reasoning strategies under a budget.\\n+- **Route-and-Reason: Scaling Large Language Model Reasoning with Reinforced\\n+ Model Router** — Chenyang Shao, Xinyang Liu, Yutang Lin, Fengli Xu, Yong Li.\\n+ arXiv:2506.05901, 2025. https://arxiv.org/abs/2506.05901\\n+ Grounds decomposition and allocation across heterogeneous workers.\\n+- **Reasoning on a Budget: A Survey of Adaptive and Controllable Test-Time\\n+ Compute in LLMs** — Mohammad Ali Alomrani et al. arXiv:2507.02076, 2025.\\n+ https://arxiv.org/abs/2507.02076\\n+ Grounds the distinction between fixed effort control and adaptive effort\\n+ allocation.\\n+- **Ares: Adaptive Reasoning Effort Selection for Efficient LLM Agents** —\\n+ Jingbo Yang, Bairu Hou, Wei Wei, Yujia Bao, Shiyu Chang. arXiv:2603.07915,\\n+ 2026. https://arxiv.org/abs/2603.07915\\n+ Grounds per-step selection of the minimum sufficient effort with repeated\\n+ verification rather than a fixed effort for every step.\\n+- **Improving Factuality and Reasoning in Language Models through Multiagent\\n+ Debate** — Yilun Du, Shuang Li, Antonio Torralba, Joshua B. Tenenbaum, Igor\\n+ Mordatch. arXiv:2305.14325, 2023. https://arxiv.org/abs/2305.14325\\n+ Grounds independent proposals, multi-round debate, and final synthesis as\\n+ an optional escalation path. It does not justify treating majority vote as\\n+ proof or using debate for every request.\\n+- **Adaptive Test-Time Compute Allocation for Reasoning LLMs via Constrained\\n+ Policy Optimization** — Zhiyuan Zhai, Bingcong Li, Bingnan Xiao, Ming Li,\\n+ Xin Wang. arXiv:2604.14853, 2026. https://arxiv.org/abs/2604.14853\\n+ Grounds budget-constrained, per-input compute allocation instead of a fixed\\n+ reasoning-effort-to-worker-count mapping.\\n+\\n+## Transport references (not policy sources)\\n+\\n+The provider API documentation is used only to verify request-shape and\\n+capability compatibility. It does not select models, assign reasoning effort,\\n+or establish quality claims; those decisions remain grounded in the papers\\n+above and runtime measurement.\\n+\\n+- **OpenAI Responses API reference** — reasoning effort, output limits, and\\n+ structured output format compatibility:\\n+ https://platform.openai.com/docs/api-reference/responses\" }, { \"sha\": \"5ac7ad2eab7df442e143ef45542479857ba68543\", \"filename\": \"docs/planning/adrs/0002-explicit-local-mlx-evaluation.md\", \"status\": \"modified\", \"additions\": 7, \"deletions\": 7, \"changes\": 14, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0002-explicit-local-mlx-evaluation.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0002-explicit-local-mlx-evaluation.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fplanning%2Fadrs%2F0002-explicit-local-mlx-evaluation.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -1,7 +1,7 @@\\n ---\\n id: \\\"0002\\\"\\n title: \\\"Explicit local mlx transport and evaluation adapter\\\"\\n-status: accepted\\n+status: superseded\\n proposed_date: \\\"2026-08-10\\\"\\n accepted_date: \\\"2026-08-11\\\"\\n deciders:\\n@@ -22,13 +22,13 @@ affected_components:\\n - \\\"contextual_orchestrator/cost_router.py\\\"\\n - \\\"examples/agents.mlx.json\\\"\\n - \\\"examples/agents.local.json\\\"\\n- - \\\"tests/test_local_mlx.py\\\"\\n+ - \\\"tests/test_local_gateway.py\\\"\\n - \\\"tests/test_batch_routing.py\\\"\\n - \\\"tests/test_cost_router.py\\\"\\n - \\\"tests/test_openai_passthrough.py\\\"\\n effort: M\\n supersedes: null\\n-superseded-by: null\\n+superseded-by: \\\"0012-gateway-only-provider-contract\\\"\\n related:\\n - path: \\\"docs/planning/adrs/0001-fail-closed-model-judgment.md\\\"\\n relation: informational\\n@@ -48,7 +48,7 @@ success_criteria:\\n - metric: \\\"local provider safety\\\"\\n target: \\\"loopback-only mlx/local URL, no Authorization header, remote HTTP rejected\\\"\\n measurement_window: \\\"every local transport test run\\\"\\n- source: \\\"tests/test_local_mlx.py\\\"\\n+ source: \\\"tests/test_local_gateway.py\\\"\\n - metric: \\\"judge integration\\\"\\n target: \\\"fast-mlsirm judge reaches an injected contextual-orchestrator only\\\"\\n measurement_window: \\\"every LLM-as-a-Judge run\\\"\\n@@ -173,14 +173,14 @@ a Codex profile; its credential is never sent to the loopback mlx-lm endpoint.\\n * `contextual_orchestrator/server.py`: authenticate `/v1/models` and `/v1/responses`, proxy Responses requests, and frame streamed responses with `response.completed` and `data: [DONE]`.\\n * `examples/agents.mlx.json`: keep the minimal selected MLX worker example visible in data, not code.\\n * `examples/agents.local.json`: keep the explicit candidate registry: public contextual-orchestrator and every discovered MLX, llama.cpp, and LM Studio candidate. Do not pre-disable entries as a discovery side effect.\\n-* `tests/test_local_mlx.py`: verify direct MLX template arguments, authenticated local gateway credential separation, and fail-closed missing credentials.\\n+* `tests/test_local_gateway.py`: verify direct MLX template arguments, authenticated local gateway credential separation, and fail-closed missing credentials.\\n * `tests/test_model_judge.py`: verify structured fast-mlsirm completion requests remain on the contextual gateway adapter.\\n * `tests/test_openai_passthrough.py`: verify the Responses SSE completion contract and model discovery endpoint.\\n * Local machine configuration: keep the ChatGPT login in Codex's normal auth cache, select the built-in `openai` provider through a profile when needed, and keep the local gateway bearer token in the OS credential store.\\n \\n ## Verification\\n \\n-* `PYTHONPATH=. .venv/bin/python -m pytest -q tests/test_local_mlx.py tests/test_openai_passthrough.py` passes in the repository test environment.\\n+* `PYTHONPATH=. .venv/bin/python -m pytest -q tests/test_local_gateway.py tests/test_openai_passthrough.py` passes in the repository test environment.\\n * `GET /healthz` and authenticated `GET /v1/models` succeed on the loopback control plane; model discovery includes the public orchestrator and the complete configured candidate registry.\\n * Authenticated streamed `POST /v1/responses` contains `response.completed` and `data: [DONE]` and reaches the configured mlx-lm model.\\n * A Codex local-provider smoke returns the requested exact sentinel response through contextual-orchestrator.\\n@@ -342,7 +342,7 @@ Remove the explicit local adapter and use the mock path if the local server is u\\n * contextual_orchestrator/__main__.py\\n * examples/agents.mlx.json\\n * examples/agents.local.json\\n-* tests/test_local_mlx.py\\n+* tests/test_local_gateway.py\\n * tests/test_openai_passthrough.py\\n * fast-mlsirm/python/fast_mlsirm/llm_judge.py\\n * fast-mlsirm/tests/test_llm_judge.py\" }, { \"sha\": \"b4d06485033ae5bac25c866ab52734e5bcf14c88\", \"filename\": \"docs/planning/adrs/0004-pr-review-merge-loop.md\", \"status\": \"modified\", \"additions\": 6, \"deletions\": 0, \"changes\": 6, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0004-pr-review-merge-loop.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0004-pr-review-merge-loop.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fplanning%2Fadrs%2F0004-pr-review-merge-loop.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -340,6 +340,12 @@ For each repository, record branch, commit, PR URL, review result, check result,\\n | Contextual PR #109 exact head `60d9cfc9be2ce0426ed37746eb9a2768b8f3455d` produced Strix run `31831835133`/job `94869100782` with a successful zero-finding report and artifact `9231362799`, but no `evidence-binding.json`; `run.json` contained only a local temporary target and no repository, PR head, job, report path, or digest binding. The report digest was `33a47fa5855600b393d92c3a1a77e0ac15adb99a55406f99e5b2efba93c17c18`, and the same-head publish step was skipped. | Keep the success as provider/content evidence only, not a clean exact-head security or Merge result. Require the central trusted workflow to publish a structured binding for repository, full PR head, run/job, report path, and digest; reject unbound success and re-run the exact head after protected-main workflow integration. | Reproduced 2026-08-15; central provenance dependency and protected Merge remain open |\\n | The contextual exact-head code-scanning checks `Trivy` and `Scorecard` both became `neutral` because the PR's `security.yml` configuration was absent from protected `main` (`trivy-filesystem` and `supply-chain/branch-protection`), while the separate required `trivy-fs`/`scorecard` jobs were still pending or successful. | Keep the organization's CodeQL-only code-scanning rule unchanged; distinguish code-scanning alert comparison from required Security job results, record the missing configuration as a warning, and never treat neutral, skipped, or absent results as a pass. Re-audit after trusted workflow/ruleset integration. | Observed 2026-08-15; no local source bypass, governance/central workflow follow-up required |\\n | Fast PR #816 exact head `355f93b27ba4a0cb141e86b0fbc9127681edb750` produced Strix run `31833030282`/job `94872991843`; NVIDIA NIM failed with `agents.exceptions.ModelBehaviorError: Tool execute not found in agent strix`, no penetration-test report was produced, and the required check failed closed after 599 seconds. | Keep this as provider/model-tool-contract evidence, not a source vulnerability or clean security result. Preserve the failure denominator, do not publish a status-only success or retry to hide it, and require central trusted workflow/provider repair plus a structured same-head artifact before normal Merge. | Observed 2026-08-15; central Strix dependency and protected Merge remain open |\\n+| Post-merge review of PR #813 found that every budget-gated provider call reached `budget_status()` through the buyer-facing `spend_analytics()` aggregate, deep-copying archived spend and rescanning up to 128 retained runs even though ADR 0014 already requires a synchronized incremental process meter. | Make `budget_status()` read only the locked incremental meter and retain full run/model aggregation in `spend_analytics()`. Preserve current token/cost rounding and fail-closed limit semantics, and regression-test that the enforcement path never calls the aggregate. Keep per-call durable meter checkpoints because ADR 0014 explicitly retains failed-workflow spend across restarts. | Issue #814 implemented locally; 1,727 tests and 100% changed-line branch coverage passed, exact-head review/check evidence remains required |\\n+| PR #765 review found `host.docker.internal` classified as a `local://` provider even though the egress validator correctly rejects its usual non-loopback Docker gateway address. | Keep authenticated local transport loopback-only under ADR 0012, remove the unreachable host classification, and reject non-loopback `local://` configuration at `ModelAgent` construction while retaining the DNS-resolution check against rebinding. | Decision recorded 2026-08-21; implementation and exact-head review/check evidence follow |\\n+| PR #765 review found that auxiliary temperature-capability inspection could let `http.client.IncompleteRead` replace the provider's original HTTP error while reading its diagnostic body. | Treat an incomplete diagnostic body as insufficient capability evidence, preserve the original HTTP error for the caller, and cover the exact truncated-body branch without broad retry or fallback changes. | Decision recorded 2026-08-21; implementation and exact-head review/check evidence follow |\\n+| PR #765 review found that the HTTP tool loop passed the orchestrator-owned literal `reasoning_effort=auto` to a selected provider. | Strip accepted reasoning-effort values at the shared provider-payload boundary while no capability plane exists; provider-native levels may be forwarded later only after the selected agent advertises support under ADR 0013. Cover structured multi-agent and explicit single-agent tool-loop calls with the same regression. | Implemented locally 2026-08-21; focused tests pass and exact-head review/check evidence follows |\\n+| PR #765 review found that one-shot local failover bypassed the request-scoped output-token cap used by the ordinary transport path. | Reuse the existing request-setting lookup for local Responses translation and add a non-mutating `setdefault` for local Chat Completions so an explicit caller cap remains authoritative. | Implemented locally 2026-08-21; focused default/explicit cap tests pass and exact-head review/check evidence follows |\\n+| PR #765 regenerated a host-specific hash lock that omitted conditional Windows and native SQLAlchemy dependencies. | Generate the existing `requirements.lock` with uv universal resolution, retain PEP 508 markers and hashes, and fail repository metadata tests if universal mode or `colorama`, `greenlet`, or `tzdata` disappears; ADR 0025 records the format decision. | Implemented locally 2026-08-21; universal solve and hash-locked dry-run pass, exact-head review/check evidence follows |\\n \\n ## Risks and Mitigations\\n \" }, { \"sha\": \"bd40526e7c1fb24376c4983b10844fcf32cbf530\", \"filename\": \"docs/planning/adrs/0007-sast-transport-and-sql-hardening.md\", \"status\": \"modified\", \"additions\": 4, \"deletions\": 4, \"changes\": 8, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0007-sast-transport-and-sql-hardening.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0007-sast-transport-and-sql-hardening.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fplanning%2Fadrs%2F0007-sast-transport-and-sql-hardening.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -1,7 +1,7 @@\\n ---\\n id: \\\"0007\\\"\\n title: \\\"Harden provider transport and SQL ledger against scanner findings\\\"\\n-status: accepted\\n+status: superseded\\n proposed_date: \\\"2026-08-11\\\"\\n accepted_date: \\\"2026-08-11\\\"\\n deciders:\\n@@ -16,11 +16,11 @@ affected_components:\\n - \\\"contextual_orchestrator/cost_ledger.py\\\"\\n - \\\"contextual_orchestrator/__main__.py\\\"\\n - \\\"tests/test_provider_tls.py\\\"\\n- - \\\"tests/test_local_mlx.py\\\"\\n+ - \\\"tests/test_local_gateway.py\\\"\\n - \\\"tests/test_cost_ledger.py\\\"\\n effort: M\\n supersedes: null\\n-superseded-by: null\\n+superseded-by: \\\"0012-gateway-only-provider-contract\\\"\\n related:\\n - path: \\\"docs/planning/adrs/0002-explicit-local-mlx-evaluation.md\\\"\\n relation: influences\\n@@ -154,5 +154,5 @@ reintroducing general urllib URL handling.\\n * contextual_orchestrator/cost_ledger.py\\n * contextual_orchestrator/__main__.py\\n * tests/test_provider_tls.py\\n-* tests/test_local_mlx.py\\n+* tests/test_local_gateway.py\\n * tests/test_cost_ledger.py\" }, { \"sha\": \"22e82308105e18c47eb54aa881a1bc571863c73c\", \"filename\": \"docs/planning/adrs/0011-structured-provider-features-stay-orchestrated.md\", \"status\": \"added\", \"additions\": 141, \"deletions\": 0, \"changes\": 141, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0011-structured-provider-features-stay-orchestrated.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0011-structured-provider-features-stay-orchestrated.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fplanning%2Fadrs%2F0011-structured-provider-features-stay-orchestrated.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,141 @@\\n+---\\n+id: \\\"0011\\\"\\n+title: \\\"Keep structured provider features inside multi-agent orchestration\\\"\\n+status: accepted\\n+proposed_date: \\\"2026-08-21\\\"\\n+accepted_date: \\\"2026-08-21\\\"\\n+deciders:\\n+ - \\\"repository maintainer\\\"\\n+consulted:\\n+ - \\\"LineageWeave integration\\\"\\n+ - \\\"contextual-orchestrator runtime\\\"\\n+informed:\\n+ - \\\"API consumers\\\"\\n+affected_components:\\n+ - \\\"contextual_orchestrator/orchestrator.py\\\"\\n+ - \\\"contextual_orchestrator/server.py\\\"\\n+ - \\\"tests/test_openai_passthrough.py\\\"\\n+ - \\\"tests/test_model_judge.py\\\"\\n+effort: M\\n+supersedes: null\\n+superseded-by: null\\n+related:\\n+ - path: \\\"docs/planning/adrs/0001-fail-closed-model-judgment.md\\\"\\n+ relation: constrains\\n+ - path: \\\"docs/planning/adrs/0002-explicit-local-mlx-evaluation.md\\\"\\n+ relation: extends\\n+ - path: \\\"docs/architecture.md\\\"\\n+ relation: implements\\n+ - path: \\\"docs/planning/adrs/0014-gateway-owned-model-selection.md\\\"\\n+ relation: constrained-by\\n+success_criteria:\\n+ - metric: \\\"structured requests using the multi-agent workflow\\\"\\n+ target: \\\"100% of client-facing non-null response_format and Responses requests\\\"\\n+ measurement_window: \\\"every structured-output regression run\\\"\\n+ source: \\\"tests/test_openai_passthrough.py\\\"\\n+ - metric: \\\"Responses json_schema translation\\\"\\n+ target: \\\"Responses text.format json_schema reaches the final provider as the equivalent Chat response_format without losing the schema\\\"\\n+ measurement_window: \\\"every Responses structured-output regression run\\\"\\n+ source: \\\"tests/test_openai_passthrough.py\\\"\\n+ - metric: \\\"multimodal context preservation\\\"\\n+ target: \\\"image_url input remains available to the final synthesis request\\\"\\n+ measurement_window: \\\"every multimodal structured-output regression run\\\"\\n+ source: \\\"tests/test_openai_passthrough.py\\\"\\n+---\\n+\\n+# Keep structured provider features inside multi-agent orchestration\\n+\\n+## Context\\n+\\n+The OpenAI-compatible boundary previously treated `response_format` and the\\n+Responses API as a provider passthrough. That made a request look\\n+successful while skipping the Thinker/Worker/Verifier/Synthesizer workflow.\\n+Structured output and multimodal requests are still product work, not an\\n+exception to the orchestration contract. A consumer must receive the same\\n+workflow evidence, verification boundary, session lineage, and cost accounting\\n+as a plain chat request.\\n+\\n+## Decision\\n+\\n+1. A non-null structured-output contract or Responses request is an\\n+ orchestration trigger, never a silent single-agent downgrade.\\n+2. The request enters the existing conducted workflow. Intermediate steps use\\n+ the original messages, including multimodal content, and the final\\n+ synthesizer performs the provider-facing structured completion.\\n+3. The final provider payload preserves validated tools and structured-output\\n+ fields. A Responses request remains a Responses request at the final\\n+ provider boundary when the selected provider supports it; a local provider\\n+ may perform an explicit transport-level translation when its capability\\n+ boundary requires Chat Completions. Responses `text.format` therefore stays\\n+ native for Responses-capable providers rather than being silently downgraded.\\n+4. `json_object` and `json_schema` are both first-class structured workflows.\\n+ Schema validation remains fail-closed at the HTTP boundary; a provider\\n+ success is not treated as semantic schema validity.\\n+5. The workflow response exposes bounded orchestration metadata by default.\\n+ Prompts, answers, images, tool arguments, secrets, and unbounded raw traces\\n+ are not put into telemetry or the default response.\\n+6. Tool execution loops are not fabricated by this decision. Per ADR 0014,\\n+ clients must opt into the explicit client-owned `v1` tool-loop contract;\\n+ ordinary tool declarations fail closed, while the opted-in provider-shape\\n+ call remains a single-worker exception.\\n+7. The internal fail-closed LLM-as-a-Judge call remains one bounded,\\n+ schema-constrained provider request. It uses the orchestrator's existing\\n+ provider transport but never recursively starts another conducted workflow.\\n+\\n+## Research basis\\n+\\n+This decision applies the existing research-grounded architecture rather than\\n+inventing a provider-specific exception:\\n+\\n+- Fugu distinguishes a low-latency routed call from a quality-oriented deep\\n+ workflow and keeps the worker pool configurable.\\n+- TRINITY supplies the Thinker, Worker, and Verifier role boundary used before\\n+ synthesis.\\n+- Conductor supplies explicit workflow steps and access-controlled context.\\n+\\n+The canonical references are maintained in `docs/architecture.md` and\\n+`docs/papers/README.md`. OpenAI's Chat Completions and Responses API contracts\\n+define the wire-shape translation, not the orchestration policy.\\n+\\n+## Consequences\\n+\\n+* Good: structured and multimodal requests no longer bypass verification and\\n+ orchestration evidence.\\n+* Good: JSON object and JSON schema requests share one tested policy instead of\\n+ diverging into transport-specific single-agent paths.\\n+* Good: Responses-only providers receive their native endpoint and input shape\\n+ after the multi-agent workflow.\\n+* Good: the final provider retains the capability fields it must interpret.\\n+* Good: internal verification does not recursively multiply provider calls or\\n+ replace the judge verdict with an unrelated synthesized answer.\\n+* Bad: structured requests consume more provider calls and can take longer than\\n+ a plain routed request.\\n+* Bad: tool execution remains a distinct explicit client-owned contract rather\\n+ than being implied by merely forwarding a tool declaration.\\n+\\n+## Confirmation\\n+\\n+Run the focused structured-output and orchestration tests. Confirm that the\\n+Responses JSON-schema test preserves the schema, the structured-output test\\n+reports the conducted workflow, the multimodal test retains `image_url` through final\\n+synthesis, the explicit tool-loop test preserves its single-worker response,\\n+and the internal structured judge test performs exactly one provider call. Do\\n+not claim provider-side semantic schema validity from HTTP 200.\\n+\\n+## References\\n+\\n+Nielsen, S., Cetin, E., Schwendeman, P., Sun, Q., Xu, J., & Tang, Y. (2025).\\n+*Learning to orchestrate agents in natural language with the Conductor*.\\n+https://doi.org/10.48550/arXiv.2512.04388\\n+\\n+Sakana AI. (2026, June 22). *Sakana Fugu: One model to command them all*.\\n+https://sakana.ai/fugu-release/\\n+\\n+Xu, J., Sun, Q., Schwendeman, P., Nielsen, S., Cetin, E., & Tang, Y. (2025).\\n+*Trinity: An evolved LLM coordinator*. https://doi.org/10.48550/arXiv.2512.04695\\n+\\n+OpenAI. (n.d.-a). *Create chat completion*. OpenAI Platform.\\n+https://platform.openai.com/docs/api-reference/chat/create\\n+\\n+OpenAI. (n.d.-b). *Create a model response*. OpenAI Platform.\\n+https://platform.openai.com/docs/api-reference/responses/create\" }, { \"sha\": \"3adc1b70801414d66160504273790d5e2a3d7275\", \"filename\": \"docs/planning/adrs/0012-gateway-only-provider-contract.md\", \"status\": \"added\", \"additions\": 61, \"deletions\": 0, \"changes\": 61, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0012-gateway-only-provider-contract.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0012-gateway-only-provider-contract.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fplanning%2Fadrs%2F0012-gateway-only-provider-contract.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,61 @@\\n+---\\n+id: \\\"0012\\\"\\n+title: \\\"Gateway-only provider contract; no direct MLX transport\\\"\\n+status: accepted\\n+proposed_date: \\\"2026-08-20\\\"\\n+accepted_date: \\\"2026-08-20\\\"\\n+deciders:\\n+ - \\\"repository maintainer\\\"\\n+consulted:\\n+ - \\\"contextual-orchestrator provider capability contract\\\"\\n+ - \\\"paper-grounded model routing policy\\\"\\n+informed:\\n+ - \\\"LineageWeave\\\"\\n+ - \\\"fast-mlsirm\\\"\\n+ - \\\"contributors\\\"\\n+affected_components:\\n+ - \\\"contextual_orchestrator/orchestrator.py\\\"\\n+ - \\\"contextual_orchestrator/model_discovery.py\\\"\\n+ - \\\"contextual_orchestrator/__main__.py\\\"\\n+ - \\\"examples/agents.local.json\\\"\\n+ - \\\"docs/kv-credentials.md\\\"\\n+supersedes: \\\"0002-explicit-local-mlx-evaluation\\\"\\n+superseded-by: null\\n+effort: M\\n+---\\n+\\n+# Gateway-only provider contract; no direct MLX transport\\n+\\n+## Context\\n+\\n+The orchestrator is the model routing and orchestration boundary. A direct\\n+runtime-specific `mlx://` worker contract leaks one local inference runtime\\n+into the public agent schema, CLI, credential rules, and Responses-to-Chat\\n+adaptation. It also creates provider-specific controls that cannot be applied\\n+to other models or gateways.\\n+\\n+## Decision\\n+\\n+- The public worker contract is provider-neutral: `mock://` for tests,\\n+ `https://` for remote providers, and authenticated `local://` only for a\\n+ reviewed loopback gateway.\\n+- Direct `mlx://` agents are rejected at `ModelAgent` construction. No MLX\\n+ runtime, model-template setting, or keyless direct transport is part of the\\n+ orchestrator contract.\\n+- A local gateway owns downstream model selection and runtime-specific\\n+ settings. The orchestrator sends only the negotiated provider-neutral\\n+ request shape and the explicitly named local gateway credential.\\n+- Model selection and reasoning policy remain capability- and paper-driven;\\n+ they must not infer a provider from a model name or hard-code MLX behavior.\\n+\\n+## Consequences\\n+\\n+- LineageWeave and other callers can use one gateway boundary without a direct\\n+ local-model dependency or monkey patch.\\n+- Existing local gateway concurrency and Responses/Chat compatibility remain\\n+ available because they are transport capabilities, not MLX behavior.\\n+- Historical MLX benchmark artifacts remain for provenance but are not current\\n+ configuration guidance or a supported public transport.\\n+- Operators who previously configured `mlx://` must place the runtime behind\\n+ an authenticated OpenAI-compatible gateway and configure `local://` or\\n+ `https://` accordingly.\" }, { \"sha\": \"dc6402b27ae8518361bf189f2d27e975eec5b803\", \"filename\": \"docs/planning/adrs/0013-paper-grounded-adaptive-reasoning-policy.md\", \"status\": \"added\", \"additions\": 108, \"deletions\": 0, \"changes\": 108, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0013-paper-grounded-adaptive-reasoning-policy.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0013-paper-grounded-adaptive-reasoning-policy.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fplanning%2Fadrs%2F0013-paper-grounded-adaptive-reasoning-policy.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,108 @@\\n+---\\n+id: \\\"0013\\\"\\n+title: \\\"Paper-grounded adaptive reasoning and model capability policy\\\"\\n+status: accepted\\n+proposed_date: \\\"2026-08-20\\\"\\n+accepted_date: \\\"2026-08-20\\\"\\n+deciders:\\n+ - \\\"repository maintainer\\\"\\n+consulted:\\n+ - \\\"Route to Reason: Adaptive Routing for LLM and Reasoning Strategy Selection\\\"\\n+ - \\\"Route-and-Reason: Scaling Large Language Model Reasoning with Reinforced Model Router\\\"\\n+ - \\\"Reasoning on a Budget: A Survey of Adaptive and Controllable Test-Time Compute in LLMs\\\"\\n+ - \\\"Ares: Adaptive Reasoning Effort Selection for Efficient LLM Agents\\\"\\n+ - \\\"Improving Factuality and Reasoning in Language Models through Multiagent Debate\\\"\\n+ - \\\"Adaptive Test-Time Compute Allocation for Reasoning LLMs via Constrained Policy Optimization\\\"\\n+informed:\\n+ - \\\"LineageWeave\\\"\\n+ - \\\"fast-mlsirm\\\"\\n+ - \\\"contributors\\\"\\n+affected_components:\\n+ - \\\"contextual_orchestrator/orchestrator.py\\\"\\n+ - \\\"contextual_orchestrator/server.py\\\"\\n+ - \\\"contextual_orchestrator/model_discovery.py\\\"\\n+ - \\\"tests/test_openai_passthrough.py\\\"\\n+ - \\\"tests/test_request_metadata.py\\\"\\n+ - \\\"docs/architecture.md\\\"\\n+supersedes: null\\n+superseded-by: null\\n+related:\\n+ - path: \\\"docs/planning/adrs/0012-gateway-only-provider-contract.md\\\"\\n+ relation: extends\\n+effort: M\\n+---\\n+\\n+# Paper-grounded adaptive reasoning and model capability policy\\n+\\n+## Context\\n+\\n+The public API may receive a requested reasoning level such as `auto`,\\n+`medium`, `high`, or `xhigh`, while the selected provider may support a\\n+different subset of values or no reasoning control at all. A fixed value is\\n+also a poor policy for multi-step work: easy steps can be over-computed and\\n+hard steps can be under-computed. The repository must therefore distinguish\\n+the caller's policy from the provider wire value and must not make model\\n+decisions from model-name folklore.\\n+\\n+## Decision\\n+\\n+- Model selection, reasoning-effort allocation, orchestration topology, and\\n+ quality/cost claims are decided from cited academic papers plus current\\n+ runtime capability and measurement evidence. Vendor documentation defines\\n+ wire compatibility; it does not define this repository's model policy.\\n+- `auto` is an orchestrator-only policy. The orchestrator evaluates task/step\\n+ difficulty, capability advertisements, budget, latency constraints, and\\n+ required verification, then chooses a provider-supported effort or a\\n+ multi-agent workflow. The literal value `auto` is never sent upstream.\\n+- Explicit effort values are forwarded only when the selected provider\\n+ advertises them. `none` is not a universal synonym for a non-reasoning\\n+ model; if the provider does not advertise a requested value, the\\n+ orchestrator negotiates another supported path or fails clearly.\\n+- `high` and `xhigh` are outcome policies, not promises that one worker has a\\n+ particular hidden-thinking implementation. When appropriate, the\\n+ orchestrator may use heterogeneous workers, independent attempts,\\n+ verification, and synthesis. Traces must record the effective strategy and\\n+ must not label a non-reasoning worker as a reasoning model.\\n+- Multi-agent debate is an available escalation strategy, not a mandatory\\n+ replacement for one worker. The orchestrator may select independent\\n+ proposals, debate, verification, and synthesis when task difficulty and the\\n+ budget justify it; otherwise it may use one capable worker with the same\\n+ evidence and trace contract. A debate result is not accepted by majority\\n+ vote alone: the final synthesis must retain source attribution and pass the\\n+ requested output contract.\\n+- Adaptive compute allocation is evaluated as a constrained policy. The\\n+ orchestrator must spend additional attempts or verification where the\\n+ expected quality gain justifies the cost, rather than mapping `low`,\\n+ `medium`, `high`, or `xhigh` to fixed worker counts or a vendor model name.\\n+- No direct MLX transport or MLX-specific model policy is permitted. Local\\n+ runtimes remain behind the authenticated provider-neutral gateway boundary\\n+ in ADR 0012.\\n+\\n+## Evidence contract\\n+\\n+Every change to routing or reasoning policy must cite the relevant sources in\\n+`docs/papers/README.md`, add or update a regression test for the capability\\n+boundary, and report requested versus effective effort in the trace or\\n+metadata. A provider health result alone is not evidence of reasoning quality.\\n+\\n+Transport compatibility is checked against the current provider API contract,\\n+not treated as model-policy evidence. In particular, Responses API capability\\n+checks may cover supported reasoning-effort values and `json_schema` structured\\n+outputs; Chat Completions compatibility must negotiate its system-message and\\n+structured-output equivalent separately. These checks must never turn a vendor\\n+default into this repository's reasoning policy.\\n+\\n+## Consequences\\n+\\n+- Callers can request `auto` without coupling themselves to provider-specific\\n+ effort names.\\n+- Unsupported effort values cannot leak to providers or silently become a\\n+ different model behavior.\\n+- Adaptive multi-agent execution is measurable as orchestration, rather than\\n+ being misrepresented as a provider's native reasoning capability.\\n+- Structured-output requests, including `json_schema`, stay inside the same\\n+ multi-agent workflow. Unsupported worker-format capabilities are negotiated\\n+ or rejected; they must not silently downgrade the request to a single-agent\\n+ passthrough.\\n+- Historical MLX benchmark and transport ADRs remain available as provenance,\\n+ but they are not supported configuration guidance.\" }, { \"sha\": \"d399c8b1de1b975975e48274232bc8fe83b941b5\", \"filename\": \"docs/planning/adrs/0014-gateway-owned-model-selection.md\", \"status\": \"added\", \"additions\": 104, \"deletions\": 0, \"changes\": 104, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0014-gateway-owned-model-selection.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0014-gateway-owned-model-selection.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fplanning%2Fadrs%2F0014-gateway-owned-model-selection.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,104 @@\\n+---\\n+id: \\\"0014\\\"\\n+title: \\\"Gateway-owned model selection and multi-agent structured output\\\"\\n+status: accepted\\n+proposed_date: \\\"2026-08-20\\\"\\n+accepted_date: \\\"2026-08-20\\\"\\n+deciders:\\n+ - \\\"repository maintainer\\\"\\n+consulted:\\n+ - \\\"gateway-only provider contract\\\"\\n+ - \\\"paper-grounded adaptive reasoning policy\\\"\\n+informed:\\n+ - \\\"LineageWeave\\\"\\n+ - \\\"fast-mlsirm\\\"\\n+ - \\\"contributors\\\"\\n+affected_components:\\n+ - \\\"contextual_orchestrator/__main__.py\\\"\\n+ - \\\"contextual_orchestrator/cost_router.py\\\"\\n+ - \\\"contextual_orchestrator/orchestrator.py\\\"\\n+ - \\\"contextual_orchestrator/server.py\\\"\\n+supersedes: null\\n+superseded-by: null\\n+related:\\n+ - path: \\\"docs/planning/adrs/0012-gateway-only-provider-contract.md\\\"\\n+ relation: depends-on\\n+ - path: \\\"docs/planning/adrs/0013-paper-grounded-adaptive-reasoning-policy.md\\\"\\n+ relation: implements\\n+effort: M\\n+---\\n+\\n+# ADR 0014: Gateway-owned model selection and multi-agent structured output\\n+\\n+- Status: Accepted\\n+- Date: 2026-08-20\\n+\\n+## Context\\n+\\n+Consumers using contextual-orchestrator must not select a provider model by\\n+copying `LLM_GATEWAY_MODEL` into every application. The configured gateway\\n+exposes its model registry, and the orchestrator owns routing, reasoning effort,\\n+and cost attribution. A request carrying JSON output constraints or the\\n+Responses API must not silently downgrade to a single provider call merely\\n+because the provider response shape is richer.\\n+\\n+## Decision\\n+\\n+- An omitted chat or Responses `model` is represented by the virtual\\n+ `contextual-orchestrator` model and is resolved inside the orchestrator.\\n+- `reasoning_effort=auto` (or Responses `reasoning.effort=auto`) is an\\n+ orchestrator-only policy value and is never forwarded as a provider field.\\n+ Provider-native levels are forwarded only after the selected agent declares\\n+ that capability; support is never inferred from a model name. If no selected\\n+ provider declares the requested level, the gateway rejects the request rather\\n+ than silently falling back to a different effort.\\n+- `--auto-discover-model-agents` expands an empty seed agent from its configured\\n+ HTTPS `/models` endpoint. Embedding-only registry rows are excluded from the\\n+ chat pool. Consumers provide only the gateway URL and credential.\\n+- `json_object`, `json_schema`, and Responses text JSON formats force the\\n+ conduct workflow. The final synthesis receives the original provider-native\\n+ output contract, and the gateway independently validates the resulting JSON\\n+ locally before returning it. A Chat request therefore keeps\\n+ `response_format`, while a Responses request keeps `text.format`, at the\\n+ final provider boundary.\\n+- Tool-loop requests are explicitly passed to one selected worker agent. The\\n+ gateway preserves the provider's full tool-call response and the client owns\\n+ execution of the returned function calls; they do not claim a multi-agent\\n+ synthesis trace. Streaming tool loops are rejected until the gateway has a\\n+ provider-shape-preserving streaming relay. Clients must opt in with the\\n+ `X-Contextual-Orchestrator-Tool-Loop: v1` header; ordinary tool requests stay\\n+ fail-closed until that contract is explicitly selected.\\n+- Each provider-reported call in a conducted workflow writes its own cost-ledger\\n+ record under the shared workflow run id, including the model judge and final\\n+ provider synthesis. The response retains one last-metered-call\\n+ `usage_record_id` for compatibility and adds the complete `usage_record_ids`\\n+ list. Calls without\\n+ valid provider usage increment `unmetered_provider_call_count`; if no workflow\\n+ call reports usage, the existing request-level estimate remains the explicit\\n+ compatibility fallback.\\n+- Raw in-memory workflow records share the existing bounded recent-run capacity.\\n+ Evicted records contribute to a compact per-model spend accumulator, so budget\\n+ enforcement and spend totals remain cumulative without retaining every prompt,\\n+ answer, or trace in process memory. A configured durable state store remains\\n+ the long-term run-evidence boundary.\\n+- Every completed provider call adds reported output usage (or the bounded\\n+ estimate when unavailable) to a synchronized process budget ledger before the\\n+ next planner, worker, verifier, judge, or synthesizer call. Failed workflows\\n+ therefore retain consumed spend even when no completed run can be persisted;\\n+ the configured state store checkpoints this compact meter across restarts.\\n+\\n+## Consequences\\n+\\n+- Provider model selection remains centralized and can change with the registry\\n+ without an application rebuild.\\n+- Structured output retains the multi-agent trace and cannot bypass synthesis.\\n+- Cost reports price each metered workflow call against the model that served it\\n+ instead of attributing all conducted work to the final synthesizer.\\n+- A response never sums monetary amounts across currencies; mixed-currency\\n+ workflows expose `currency_code=MIXED` and a null aggregate amount while the\\n+ individual ledger records retain their original amounts and currencies.\\n+- High-volume passthrough traffic cannot grow raw workflow memory without bound,\\n+ while evicted usage still contributes to buyer-visible spend and budget gates.\\n+- Tool callers use an explicit single-agent passthrough contract. The gateway\\n+ remains the model-selection boundary, while tool execution stays with the\\n+ authenticated client and never becomes an implicit multi-agent fallback.\" }, { \"sha\": \"67280b86630213acb9d870a4cff3d75c9167ba84\", \"filename\": \"docs/planning/adrs/0015-auto-embedding-model-selection.md\", \"status\": \"added\", \"additions\": 110, \"deletions\": 0, \"changes\": 110, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0015-auto-embedding-model-selection.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0015-auto-embedding-model-selection.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fplanning%2Fadrs%2F0015-auto-embedding-model-selection.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,110 @@\\n+---\\n+id: \\\"0015\\\"\\n+title: \\\"Orchestrator-owned automatic embedding model selection\\\"\\n+status: proposed\\n+proposed_date: \\\"2026-08-20\\\"\\n+deciders:\\n+ - \\\"repository maintainer\\\"\\n+consulted:\\n+ - \\\"contextual-orchestrator gateway runtime\\\"\\n+ - \\\"downstream embedding consumers\\\"\\n+informed:\\n+ - \\\"downstream consumers (naruon, LineageWeave)\\\"\\n+affected_components:\\n+ - \\\"contextual_orchestrator/orchestrator.py\\\"\\n+ - \\\"contextual_orchestrator/server.py\\\"\\n+ - \\\"contextual_orchestrator/api_contract.py\\\"\\n+ - \\\"contextual_orchestrator/batch_routing.py\\\"\\n+ - \\\"contextual_orchestrator/cost_router.py\\\"\\n+ - \\\"tests/test_provider_embeddings.py\\\"\\n+ - \\\"tests/test_embeddings_model_pool_http_honesty.py\\\"\\n+effort: S\\n+supersedes: null\\n+superseded-by: null\\n+related:\\n+ - path: \\\"docs/planning/adrs/0001-fail-closed-model-judgment.md\\\"\\n+ relation: constrains\\n+ - path: \\\"docs/planning/adrs/0012-gateway-only-provider-contract.md\\\"\\n+ relation: depends-on\\n+---\\n+\\n+# ADR 0015: Orchestrator-owned automatic embedding model selection\\n+\\n+## Context\\n+\\n+Consumers currently have to send a model name to the embeddings endpoints. A\\n+consumer that already delegates model selection to contextual-orchestrator\\n+must then invent a sentinel model name or maintain provider-specific\\n+configuration. That contradicts the gateway-owned model policy and makes the\\n+OpenAI-compatible contract less useful for downstream services.\\n+\\n+Embedding agents are already represented in the orchestrator candidate pool by\\n+the explicit `embedding` capability tag. The selection must therefore reuse\\n+the existing ranked-agent policy rather than add a provider order, model-name\\n+guess, or consumer-side fallback.\\n+\\n+## Decision\\n+\\n+1. `/v1/embeddings` and `/v1/batch/embeddings` accept an omitted `model`.\\n+2. When omitted, the gateway selects the highest-ranked enabled agent carrying\\n+ the `embedding` capability. Ranking continues to use the existing priority\\n+ and capability policy; disabled agents and provider exclusions are ignored.\\n+3. An explicitly supplied model remains supported only when it matches an\\n+ enabled embedding-capable agent. Unknown, disabled, or non-embedding models\\n+ fail closed with the existing invalid-model contract.\\n+4. If no enabled embedding-capable agent exists for an omitted model, the\\n+ gateway returns `503 embedding_unavailable`; it never invents a model or\\n+ produces a heuristic vector as a provider substitute.\\n+5. The provider and resolved model are carried into internal batch requests,\\n+ provider JSONL, response metadata, and cost attribution so the selected\\n+ deployment remains deterministic and auditable. Client attribution metadata\\n+ cannot override either server-resolved identity. The standalone in-process\\n+ backend remains a local test/development path; a configured provider path\\n+ uses its injected embeddings backend and the resolved model.\\n+6. The default batch backend resolves the current agent pool at submission time.\\n+ Runtime additions, disablement, and priority changes are therefore visible to\\n+ new jobs; every submitted job retains the backend instance that created it for\\n+ deterministic polling and retrieval.\\n+\\n+## Contract and acceptance evidence\\n+\\n+The OpenAPI contract marks `model` optional and documents the unavailable\\n+response. Loopback HTTP tests cover omitted-model selection for sync and batch\\n+requests, explicit pool validation, and the no-capability failure. Provider\\n+backend contract tests must preserve the resolved model in every serialized\\n+embedding request before this ADR moves from proposed to accepted.\\n+\\n+## Consequences\\n+\\n+LineageWeave, naruon, and other consumers can omit provider model selectors\\n+while retaining pool validation, provider routing, and cost attribution.\\n+Explicit OpenAI-compatible model requests remain backward compatible. The\\n+gateway still exposes a clear distinction between local standalone evidence\\n+and configured-provider evidence; local heuristic vectors are not production\\n+provider evidence.\\n+\\n+## Research grounding\\n+\\n+The selection is a capability-constrained routing decision, not a semantic\\n+quality judgment. It reuses the repository's vendored routing literature:\\n+\\n+* Chen, L., Zaharia, M., & Zou, J. (2023). FrugalGPT: How to use large\\n+ language models while reducing cost and improving performance. *arXiv*.\\n+ https://arxiv.org/abs/2305.05176\\n+* Ong, I., Almahairi, A., Wu, V., Chiang, W.-L., Wu, T., Gonzalez, J. E.,\\n+ Kadous, M. W., & Stoica, I. (2024). RouteLLM: Learning to route LLMs with\\n+ preference data. *arXiv*. https://arxiv.org/abs/2406.18665\\n+* Ding, D., Mallick, A., Wang, C., Sim, R., Mukherjee, S., Rühle, V.,\\n+ Lakshmanan, L. V. S., & Awadallah, A. H. (2024). Hybrid LLM:\\n+ Cost-efficient and quality-aware query routing. *International Conference\\n+ on Learning Representations*. https://arxiv.org/abs/2404.14618\\n+\\n+These papers ground cost-aware and capability-aware routing decisions; they do\\n+not provide evidence that one embedding model is universally higher quality.\\n+No such unsupported quality claim is made by this ADR.\\n+\\n+## More information\\n+\\n+* docs/papers/README.md\\n+* docs/rest_api_design.md\\n+* docs/planning/adrs/0001-fail-closed-model-judgment.md\" }, { \"sha\": \"f3572403548fad1cb22fab5bdfa3fd5151c19608\", \"filename\": \"docs/planning/adrs/0016-optional-sampling-capability-negotiation.md\", \"status\": \"added\", \"additions\": 48, \"deletions\": 0, \"changes\": 48, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0016-optional-sampling-capability-negotiation.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0016-optional-sampling-capability-negotiation.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fplanning%2Fadrs%2F0016-optional-sampling-capability-negotiation.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,48 @@\\n+# ADR 0016: Optional sampling capability negotiation\\n+\\n+- Status: Accepted\\n+- Date: 2026-08-20\\n+\\n+## Context\\n+\\n+Some provider deployments reject the optional `temperature` request field even\\n+when the value is valid for the public API contract. A provider response that\\n+only reports an invalid value must not be silently changed into a different\\n+request. The same transport boundary serves chat completions and raw Responses\\n+passthrough, so the behavior must be endpoint-local and provider-neutral.\\n+\\n+## Decision\\n+\\n+When a provider returns HTTP 400 or 422 and the response evidence explicitly\\n+identifies `temperature` as unsupported, the orchestrator retries once against\\n+the same endpoint with only `temperature` removed. This negotiation is\\n+available to both the normal chat transport and raw/Responses passthrough.\\n+\\n+When neither the caller nor the operator supplies a sampling temperature, the\\n+runtime leaves the field absent so the selected provider applies its published\\n+default. The CLI compatibility flags remain an explicit operator override.\\n+HTTP request sampling and output-token controls are stored in thread-local\\n+request scope; concurrent requests never mutate the shared client defaults or\\n+inherit one another's controls.\\n+\\n+All other 4xx responses, including invalid temperature values, remain\\n+non-retryable. The orchestrator does not infer capability from a model name,\\n+provider ordering, parameter count, or local benchmark, and it does not select\\n+another model as a temperature fallback.\\n+\\n+## Consequences\\n+\\n+- GPT-5-family or otherwise restricted deployments can answer when the only\\n+ incompatibility is an optional sampling field.\\n+- The original endpoint, model, authentication, and all other request fields\\n+ remain unchanged.\\n+- Concurrent Completions, Chat Completions, Responses, streaming, and batch\\n+ transports apply only their own request-scoped controls.\\n+- The provider error body is consumed only for bounded capability\\n+ classification; it is not persisted or exposed as a credential-bearing log.\\n+\\n+## Verification\\n+\\n+`tests/test_provider_integration.py` covers successful chat negotiation,\\n+invalid-value non-negotiation, and raw Responses negotiation over a real local\\n+HTTP server.\" }, { \"sha\": \"500e834e82baa2b5b2dc9f96f2509135153b944c\", \"filename\": \"docs/planning/adrs/0017-inbound-request-framing.md\", \"status\": \"added\", \"additions\": 50, \"deletions\": 0, \"changes\": 50, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0017-inbound-request-framing.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0017-inbound-request-framing.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fplanning%2Fadrs%2F0017-inbound-request-framing.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,50 @@\\n+---\\n+status: proposed\\n+date: 2026-08-20\\n+decision-makers:\\n+ - contextual-orchestrator maintainers\\n+---\\n+\\n+# ADR 0017: Fail-closed inbound request framing\\n+\\n+## Context\\n+\\n+The HTTP handler previously converted one `Content-Length` value and delegated\\n+all other framing behavior to `BufferedReader.read`. Missing, negative,\\n+duplicate, transfer-coded, truncated, and slow request bodies therefore did not\\n+share one bounded policy. This is an inbound trust-boundary defect, separate\\n+from provider-response framing.\\n+\\n+## Decision\\n+\\n+Accept only one ASCII decimal `Content-Length` within the configured body limit.\\n+Reject missing length, duplicate length lines, `Transfer-Encoding`, malformed\\n+or signed values, and `Transfer-Encoding` plus `Content-Length` before reading\\n+body bytes. Read exactly the declared number of bytes with a bounded socket\\n+deadline. On any framing failure, return a stable generic error and close the\\n+connection so unread bytes cannot be interpreted as another request.\\n+\\n+The server does not implement chunked decoding in this change. A future bounded\\n+decoder requires a separate design and socket-level evidence.\\n+\\n+## Consequences\\n+\\n+- Every current JSON body endpoint inherits one parser/reader policy.\\n+- Clients must send a fixed-length JSON request; the API returns `411`, `413`,\\n+ `408`, or `400` with `invalid_request_framing`/named framing codes as\\n+ appropriate.\\n+- The body deadline and byte limit are visible in the secret-free readiness\\n+ profile.\\n+- Socket-level, truncation, timeout, duplicate, transfer-coding, and boundary\\n+ tests become merge evidence.\\n+\\n+## Standards\\n+\\n+Fielding, R., Nottingham, M., & Reschke, J. (2022). *HTTP/1.1* (RFC 9112).\\n+RFC Editor. https://www.rfc-editor.org/rfc/rfc9112.html\\n+\\n+## Customer next action\\n+\\n+Send JSON requests with exactly one fixed decimal `Content-Length`; retry a\\n+framing error only after correcting the request, not by replaying the same\\n+ambiguous bytes.\" }, { \"sha\": \"959c0a9911c70036ded333b68423fcecc5869001\", \"filename\": \"docs/planning/adrs/0018-multimodal-evidence-preserving-orchestration.md\", \"status\": \"added\", \"additions\": 104, \"deletions\": 0, \"changes\": 104, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0018-multimodal-evidence-preserving-orchestration.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0018-multimodal-evidence-preserving-orchestration.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fplanning%2Fadrs%2F0018-multimodal-evidence-preserving-orchestration.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,104 @@\\n+---\\n+id: \\\"0018\\\"\\n+title: \\\"Preserve multimodal evidence through every evidence-bearing workflow step\\\"\\n+status: accepted\\n+proposed_date: \\\"2026-08-20\\\"\\n+accepted_date: \\\"2026-08-20\\\"\\n+deciders:\\n+ - \\\"repository maintainer\\\"\\n+consulted:\\n+ - \\\"Sakana Fugu Technical Report\\\"\\n+ - \\\"TRINITY: An Evolved LLM Coordinator\\\"\\n+ - \\\"Learning to Orchestrate Agents in Natural Language with the Conductor\\\"\\n+ - \\\"OpenAI Chat Completions and Responses API references\\\"\\n+informed:\\n+ - \\\"LineageWeave\\\"\\n+ - \\\"OpenCode\\\"\\n+ - \\\"Noema\\\"\\n+ - \\\"Strix\\\"\\n+affected_components:\\n+ - \\\"contextual_orchestrator/orchestrator.py\\\"\\n+ - \\\"contextual_orchestrator/server.py\\\"\\n+ - \\\"tests/test_multimodal_workflow_evidence.py\\\"\\n+related:\\n+ - path: \\\"docs/planning/adrs/0013-paper-grounded-adaptive-reasoning-policy.md\\\"\\n+ relation: extends\\n+effort: S\\n+---\\n+\\n+# Preserve multimodal evidence through every evidence-bearing workflow step\\n+\\n+## Context\\n+\\n+The OpenAI-compatible boundary accepts Chat Completions `image_url` parts and\\n+Responses `input_image` parts, but the conducted workflow reduced the original\\n+request to text before thinker, worker, verifier, and synthesizer execution.\\n+The models therefore received the literal marker `[image]`, not the pixels.\\n+An authorized, non-identifying LineageWeave runtime check exposed the product\\n+impact: a completed five-image VISION run persisted five captions but zero OCR\\n+characters. Transport completion was incorrectly stronger than evidence\\n+completion.\\n+\\n+Fugu, TRINITY, and Conductor support adaptive coordination across specialized\\n+workers; they do not support removing the task evidence needed by those\\n+workers. The official OpenAI API contracts represent image input as typed\\n+content blocks, not as prose placeholders. The orchestrator must preserve\\n+that typed evidence while retaining access-list isolation for prior model\\n+outputs.\\n+\\n+## Decision\\n+\\n+- Normalize Responses `input_image` blocks to the existing Chat Completions\\n+ `image_url` representation at the provider-neutral boundary.\\n+- Retain the original validated image blocks beside each workflow step's text\\n+ instruction. Access lists still govern prior model outputs; source evidence\\n+ is part of the original task, not another agent's hidden state.\\n+- Route image-bearing work and failover only through enabled agents that\\n+ explicitly advertise the `vision` capability tag. Do not infer VISION\\n+ support from a provider name or model identifier.\\n+- Fail closed before provider I/O when no enabled VISION-capable worker is\\n+ available. A text-only answer to an unseen image is not a valid fallback.\\n+- Keep the public request shape and provider-neutral gateway boundary. This\\n+ change adds no provider SDK, model-name ordering, or direct provider path.\\n+\\n+## Consequences\\n+\\n+- Thinker, worker, verifier, and synthesizer steps can independently inspect\\n+ the same source pixels while seeing only the prior outputs allowed by the\\n+ workflow access list.\\n+- Chat Completions and Responses use one internal multimodal representation.\\n+- Image bytes cross the same configured provider boundary more than once in a\\n+ deep workflow. That is deliberate quality-oriented test-time compute, and\\n+ the existing request-size and URL validation remain authoritative.\\n+- A wrongly tagged pool fails visibly and requires an operator to correct its\\n+ capability catalog instead of silently accepting fabricated visual work.\\n+\\n+## Verification\\n+\\n+A synthetic content-block regression must prove that every conducted step\\n+receives the source image, text-only requests remain strings, Responses image\\n+parts survive normalization, failover never enters a non-VISION agent, and a\\n+pool without a VISION agent fails before any client call.\\n+\\n+## References\\n+\\n+Nielsen, S., Cetin, E., Schwendeman, P., Sun, Q., Xu, J., & Tang, Y. (2025).\\n+*Learning to orchestrate agents in natural language with the Conductor*\\n+(arXiv:2512.04388). arXiv. https://doi.org/10.48550/arXiv.2512.04388\\n+\\n+OpenAI. (n.d.-a). *Create chat completion*. OpenAI API reference. Retrieved\\n+August 20, 2026, from\\n+https://developers.openai.com/api/reference/cli/resources/chat/subresources/completions\\n+\\n+OpenAI. (n.d.-b). *Create a model response*. OpenAI API reference. Retrieved\\n+August 20, 2026, from\\n+https://developers.openai.com/api/reference/typescript/resources/beta/subresources/responses/methods/create\\n+\\n+Tang, Y., Cetin, E., Xu, J., Sun, Q., Nielsen, S., Richard, V., Goda, H.,\\n+Tymchenko, I., Nguyen, N., Lee, H., Ashiga, M., Kotyan, S., Kuroki, S., &\\n+Clanuwat, T. (2026). *Sakana Fugu technical report* (arXiv:2606.21228).\\n+arXiv. https://doi.org/10.48550/arXiv.2606.21228\\n+\\n+Xu, J., Sun, Q., Schwendeman, P., Nielsen, S., Cetin, E., & Tang, Y. (2025).\\n+*TRINITY: An evolved LLM coordinator* (arXiv:2512.04695). arXiv.\\n+https://doi.org/10.48550/arXiv.2512.04695\" }, { \"sha\": \"04b01aabcd845d19a22affdf19b65787c6bd2ae9\", \"filename\": \"docs/planning/adrs/0019-no-runtime-monkey-patching.md\", \"status\": \"added\", \"additions\": 25, \"deletions\": 0, \"changes\": 25, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0019-no-runtime-monkey-patching.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0019-no-runtime-monkey-patching.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fplanning%2Fadrs%2F0019-no-runtime-monkey-patching.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,25 @@\\n+# ADR 0019: No runtime monkey patching for transport contracts\\n+\\n+- Status: Accepted\\n+- Date: 2026-08-21\\n+\\n+## Context\\n+\\n+Provider capability behavior must be visible in the owning transport client.\\n+Import-time mutation of `ModelClient` obscures the effective contract, creates\\n+global process state, and can change behavior for callers that did not opt in.\\n+\\n+## Decision\\n+\\n+The orchestrator must not monkey patch classes or methods at runtime. Optional\\n+sampling omission, capability negotiation, protocol translation, and retry\\n+behavior are implemented in the owning `ModelClient` transport paths and are\\n+covered by direct tests. Importing the package must not mutate a class or\\n+install a wrapper as a side effect.\\n+\\n+## Consequences\\n+\\n+- The effective request contract is inspectable in one implementation.\\n+- Chat, streaming, and batch transports share the same provider-neutral policy.\\n+- Upstream capability changes require an ordinary code review instead of a\\n+ hidden import-order dependency.\" }, { \"sha\": \"0c47c83d6946b414d4669279f03a42cd85192f8a\", \"filename\": \"docs/planning/adrs/0020-provider-error-boundary.md\", \"status\": \"added\", \"additions\": 38, \"deletions\": 0, \"changes\": 38, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0020-provider-error-boundary.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0020-provider-error-boundary.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fplanning%2Fadrs%2F0020-provider-error-boundary.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,38 @@\\n+# ADR 0020: Keep raw provider failures inside the gateway\\n+\\n+- Status: Accepted\\n+- Date: 2026-08-21\\n+\\n+## Context\\n+\\n+Provider HTTP bodies and exception messages can contain credentials, prompt\\n+content, personal data, internal URLs, or vendor diagnostics. Structured\\n+orchestration, embeddings, retries, and cross-provider failover must not make\\n+provider raw exceptions available through a public gateway error or an\\n+exception cause.\\n+\\n+## Decision\\n+\\n+1. Chat, embedding, and passthrough transport failures expose only\\n+ package-owned messages and never copy provider exception text.\\n+2. Model discovery reports stable diagnostic codes without copying provider\\n+ response or exception text.\\n+3. Exhausted failover and structured-output parsing do not chain provider raw\\n+ errors; deterministic local remediation remains available.\\n+4. Provider diagnostics may be counted by allowlisted type/code in internal\\n+ telemetry, but raw bodies, exception text, credentials, and prompts are not\\n+ persisted or returned.\\n+\\n+## Verification\\n+\\n+`tests/test_model_discovery.py`, `tests/test_provider_reliability.py`, and\\n+`tests/test_model_judge.py` assert that provider response text is absent from\\n+public messages and causes. The full suite must remain green before merge.\\n+\\n+## References\\n+\\n+MITRE. (n.d.). *CWE-209: Generation of error message containing sensitive\\n+information*. https://cwe.mitre.org/data/definitions/209.html\\n+\\n+OWASP Foundation. (2023). *Application Security Verification Standard 4.0.3*.\\n+https://owasp.org/www-project-application-security-verification-standard/\" }, { \"sha\": \"7a720e1b826c290d228a2637831927706923bdfb\", \"filename\": \"docs/planning/adrs/0025-universal-hash-locked-requirements.md\", \"status\": \"added\", \"additions\": 58, \"deletions\": 0, \"changes\": 58, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0025-universal-hash-locked-requirements.md\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/docs%2Fplanning%2Fadrs%2F0025-universal-hash-locked-requirements.md\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/docs%2Fplanning%2Fadrs%2F0025-universal-hash-locked-requirements.md?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,58 @@\\n+---\\n+id: \\\"0025\\\"\\n+title: \\\"Generate one universal hash-locked runtime requirements file\\\"\\n+status: accepted\\n+accepted_date: \\\"2026-08-21\\\"\\n+deciders:\\n+ - \\\"repository maintainer\\\"\\n+affected_components:\\n+ - \\\"requirements.lock\\\"\\n+ - \\\"tests/test_repository_security_metadata.py\\\"\\n+---\\n+\\n+# Generate one universal hash-locked runtime requirements file\\n+\\n+## Context\\n+\\n+The runtime lock is installed with `pip --require-hashes`, but its previous\\n+platform-specific regeneration removed `colorama`, `greenlet`, and `tzdata`.\\n+Those packages are conditional transitive dependencies on supported Python\\n+environments, so a lock produced for one host was not complete evidence for\\n+another host.\\n+\\n+## Decision\\n+\\n+Generate `requirements.lock` with `uv pip compile --universal\\n+--generate-hashes --python-version 3.10 --extra api --extra db pyproject.toml`.\\n+Universal resolution retains PEP 508 environment markers, one exact version per\\n+resolved branch, and hashes for every artifact while preserving the existing\\n+`pip --require-hashes` installation contract. Regeneration must retain the\\n+platform-conditional `colorama`, `greenlet`, and `tzdata` records and a metadata\\n+test must fail if universal mode or those records disappear.\\n+\\n+Do not add a second lock format yet. PEP 751 standardizes `pylock.toml`, but the\\n+current CI and buyer evidence consume the existing requirements file directly.\\n+Adopt `pylock.toml` only when the production installer and security scanners can\\n+consume it without maintaining two divergent dependency authorities.\\n+\\n+## Consequences\\n+\\n+- macOS, Linux, Windows, architecture, and supported Python marker branches are\\n+ resolved together instead of inheriting the workstation that ran the tool.\\n+- Dependency versions remain auditable and installation remains resolution-free\\n+ under hash-checking mode.\\n+- A regeneration can be more constrained than a host-only solve; an\\n+ incompatible dependency must fail the universal solve rather than silently\\n+ disappear from another platform.\\n+\\n+## References\\n+\\n+Astral Software, Inc. (2026). *Resolution*. uv.\\n+https://docs.astral.sh/uv/concepts/resolution/\\n+\\n+Cannon, B. (2025). PEP 751: A file format to record Python dependencies for\\n+installation reproducibility. *Python Enhancement Proposals*. Python Software\\n+Foundation. https://peps.python.org/pep-0751/\\n+\\n+Python Packaging Authority. (2026). *Dependency specifiers*. Python Packaging\\n+User Guide. https://packaging.python.org/en/latest/specifications/dependency-specifiers/\" }, { \"sha\": \"23753f8b8097138ec68ea3b85b463a438362303e\", \"filename\": \"examples/agents.local.json\", \"status\": \"modified\", \"additions\": 6, \"deletions\": 45, \"changes\":