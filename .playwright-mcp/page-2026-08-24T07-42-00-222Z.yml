\\")\\n+\\n+\\n+def test_select_capability_agent_skips_disabled_and_excluded_agents() -> None:\\n+ \\\"\\\"\\\"Capability selection skips disabled and provider-excluded candidates.\\\"\\\"\\\"\\n+ orchestrator = TaskOrchestrator(\\n+ [\\n+ ModelAgent(\\\"disabled_embedding\\\", \\\"disabled\\\", tags=(\\\"embedding\\\",), disabled=True),\\n+ ModelAgent(\\n+ \\\"excluded_embedding\\\",\\n+ \\\"excluded\\\",\\n+ tags=(\\\"embedding\\\",),\\n+ provider_exclusions=(\\\"embedding\\\",),\\n+ ),\\n+ ModelAgent(\\\"eligible_embedding\\\", \\\"eligible\\\", tags=(\\\"embedding\\\",)),\\n+ ]\\n+ )\\n+ assert orchestrator.select_capability_agent(\\\"embedding\\\").id == \\\"eligible_embedding\\\"\\n+\\n+ unavailable = TaskOrchestrator(\\n+ [\\n+ ModelAgent(\\\"disabled_embedding\\\", \\\"disabled\\\", tags=(\\\"embedding\\\",), disabled=True),\\n+ ModelAgent(\\\"reasoning_agent\\\", \\\"reasoning\\\", tags=(\\\"reasoning\\\",)),\\n+ ]\\n+ )\\n+ try:\\n+ unavailable.select_capability_agent(\\\"embedding\\\")\\n+ except RuntimeError as exc:\\n+ assert str(exc) == \\\"no enabled agent available for capability=embedding\\\"\\n+ else:\\n+ raise AssertionError(\\\"an unavailable capability must fail closed\\\")\\n+\\n+\\n def test_http_embeddings_rejects_model_outside_agent_pool() -> None:\\n server, thread, port = _server()\\n try:\\n@@ -83,6 +138,44 @@ def test_http_embeddings_accepts_model_in_agent_pool() -> None:\\n thread.join(timeout=5)\\n \\n \\n+def test_http_embeddings_auto_selects_enabled_embedding_agent() -> None:\\n+ server, thread, port = _server()\\n+ try:\\n+ status, body = _post(port, \\\"/v1/embeddings\\\", {\\\"input\\\": \\\"invoice search chunk\\\"})\\n+ assert status == 200, body\\n+ assert body.get(\\\"model\\\") == \\\"mock-planner\\\"\\n+ finally:\\n+ server.shutdown()\\n+ thread.join(timeout=5)\\n+\\n+\\n+def test_http_embeddings_auto_selection_fails_when_capability_is_missing() -> None:\\n+ server, thread, port = _server_without_embedding()\\n+ try:\\n+ status, body = _post(port, \\\"/v1/embeddings\\\", {\\\"input\\\": \\\"invoice search chunk\\\"})\\n+ assert status == 503, body\\n+ assert \\\"embedding_unavailable\\\" in json.dumps(body)\\n+ finally:\\n+ server.shutdown()\\n+ thread.join(timeout=5)\\n+\\n+\\n+def test_http_embeddings_reject_virtual_orchestrator_model() -> None:\\n+ \\\"\\\"\\\"An explicit virtual chat model cannot bypass the embedding pool gate.\\\"\\\"\\\"\\n+ server, thread, port = _server()\\n+ try:\\n+ for path, payload in (\\n+ (\\\"/v1/embeddings\\\", {\\\"model\\\": \\\"contextual-orchestrator\\\", \\\"input\\\": \\\"invoice search chunk\\\"}),\\n+ (\\\"/v1/batch/embeddings\\\", {\\\"model\\\": \\\"contextual-orchestrator\\\", \\\"inputs\\\": [\\\"alpha\\\", \\\"beta\\\"]}),\\n+ ):\\n+ status, body = _post(port, path, payload)\\n+ assert status == 400, (path, body)\\n+ assert \\\"invalid_model\\\" in json.dumps(body)\\n+ finally:\\n+ server.shutdown()\\n+ thread.join(timeout=5)\\n+\\n+\\n def test_http_batch_embeddings_rejects_model_outside_agent_pool() -> None:\\n server, thread, port = _server()\\n try:\\n@@ -116,9 +209,24 @@ def test_http_batch_embeddings_accepts_model_in_agent_pool() -> None:\\n thread.join(timeout=5)\\n \\n \\n+def test_http_batch_embeddings_auto_selects_enabled_embedding_agent() -> None:\\n+ server, thread, port = _server()\\n+ try:\\n+ status, body = _post(port, \\\"/v1/batch/embeddings\\\", {\\\"inputs\\\": [\\\"alpha\\\", \\\"beta\\\"]})\\n+ assert status == 200, body\\n+ assert body.get(\\\"model\\\") == \\\"mock-planner\\\"\\n+ finally:\\n+ server.shutdown()\\n+ thread.join(timeout=5)\\n+\\n+\\n if __name__ == \\\"__main__\\\":\\n test_http_embeddings_rejects_model_outside_agent_pool()\\n test_http_embeddings_accepts_model_in_agent_pool()\\n+ test_http_embeddings_auto_selects_enabled_embedding_agent()\\n+ test_http_embeddings_auto_selection_fails_when_capability_is_missing()\\n+ test_http_embeddings_reject_virtual_orchestrator_model()\\n test_http_batch_embeddings_rejects_model_outside_agent_pool()\\n test_http_batch_embeddings_accepts_model_in_agent_pool()\\n+ test_http_batch_embeddings_auto_selects_enabled_embedding_agent()\\n print(\\\"ok\\\")\" }, { \"sha\": \"dc994ec6112f8fdd6cf13ebfa4d892a426be03cc\", \"filename\": \"tests/test_encoding_stream_logprobs_http_honesty.py\", \"status\": \"modified\", \"additions\": 2, \"deletions\": 2, \"changes\": 4, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_encoding_stream_logprobs_http_honesty.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_encoding_stream_logprobs_http_honesty.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_encoding_stream_logprobs_http_honesty.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -3,11 +3,11 @@\\n from __future__ import annotations\\n \\n import json\\n+import sys\\n import threading\\n import urllib.error\\n import urllib.request\\n from pathlib import Path\\n-import sys\\n \\n sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\n \\n@@ -19,7 +19,7 @@\\n \\n def build() -> TaskOrchestrator:\\n return TaskOrchestrator(\\n- [ModelAgent(\\\"general_agent\\\", \\\"mock-planner\\\", tags=(\\\"reasoning\\\", \\\"writing\\\"))]\\n+ [ModelAgent(\\\"general_agent\\\", \\\"mock-planner\\\", tags=(\\\"reasoning\\\", \\\"writing\\\", \\\"embedding\\\"))]\\n )\\n \\n \" }, { \"sha\": \"6df84664587f6dee684d1ddc874d37d67fc8f8c0\", \"filename\": \"tests/test_functions_null_max_tool_calls_null_http_honesty.py\", \"status\": \"modified\", \"additions\": 0, \"deletions\": 2, \"changes\": 2, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_functions_null_max_tool_calls_null_http_honesty.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_functions_null_max_tool_calls_null_http_honesty.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_functions_null_max_tool_calls_null_http_honesty.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -101,9 +101,7 @@ def test_http_responses_accepts_null_max_tool_calls_and_functions() -> None:\\n \\\"model\\\": \\\"mock-planner\\\",\\n \\\"input\\\": \\\"max tool null\\\",\\n \\\"max_tool_calls\\\": None,\\n- \\\"functions\\\": None,\\n \\\"function_call\\\": None,\\n- \\\"functions\\\": [],\\n },\\n )\\n assert status == 200, body\" }, { \"sha\": \"aaaf8219096d6b4099b2f8052d764d446fd36650\", \"filename\": \"tests/test_gateway_seed_discovery.py\", \"status\": \"added\", \"additions\": 106, \"deletions\": 0, \"changes\": 106, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_gateway_seed_discovery.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_gateway_seed_discovery.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_gateway_seed_discovery.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,106 @@\\n+from __future__ import annotations\\n+\\n+from types import SimpleNamespace\\n+\\n+import pytest\\n+\\n+from contextual_orchestrator import ModelAgent, TaskOrchestrator\\n+from contextual_orchestrator import __main__ as cli\\n+from contextual_orchestrator.model_discovery import (\\n+ DiscoveredModel,\\n+ ProviderDiscoveryError,\\n+)\\n+\\n+\\n+def test_empty_gateway_seed_expands_from_its_registry(monkeypatch) -> None:\\n+ seed = ModelAgent(\\n+ \\\"gateway_seed\\\",\\n+ \\\"\\\",\\n+ base_url=\\\"https://gateway.example/v1\\\",\\n+ credential_key=\\\"LLM_GATEWAY_API_KEY\\\",\\n+ tags=(\\\"reasoning\\\", \\\"writing\\\"),\\n+ )\\n+\\n+ monkeypatch.setattr(\\n+ cli,\\n+ \\\"discover_provider_models\\\",\\n+ lambda source: [\\n+ DiscoveredModel(\\n+ provider_name=source.provider_name,\\n+ model_id=\\\"chat-model\\\",\\n+ credential_name=source.credential_name,\\n+ chat_base_url=source.chat_base_url,\\n+ auth_scheme=source.auth_scheme,\\n+ ),\\n+ DiscoveredModel(\\n+ provider_name=source.provider_name,\\n+ model_id=\\\"text-embedding-model\\\",\\n+ credential_name=source.credential_name,\\n+ chat_base_url=source.chat_base_url,\\n+ auth_scheme=source.auth_scheme,\\n+ ),\\n+ ],\\n+ )\\n+\\n+ agents = cli._auto_discover_seed_agents([seed], allow_failures=False)\\n+\\n+ assert [agent.model for agent in agents] == [\\\"chat-model\\\"]\\n+ assert agents[0].disabled is False\\n+ assert agents[0].base_url == \\\"https://gateway.example/v1\\\"\\n+\\n+\\n+def test_gateway_seed_discovery_preserves_configured_and_disables_unusable_seeds(\\n+ monkeypatch,\\n+) -> None:\\n+ configured = ModelAgent(\\\"configured_agent\\\", \\\"chat-model\\\")\\n+ assert cli._auto_discover_seed_agents([configured], allow_failures=False) == [configured]\\n+\\n+ seed = ModelAgent(\\\"gateway_seed\\\", \\\"\\\", base_url=\\\"https://gateway.example/v1\\\")\\n+ failure = ProviderDiscoveryError(\\\"gateway\\\", \\\"unavailable\\\")\\n+ monkeypatch.setattr(cli, \\\"discover_provider_models\\\", lambda _source: (_ for _ in ()).throw(failure))\\n+ with pytest.raises(ProviderDiscoveryError):\\n+ cli._auto_discover_seed_agents([seed], allow_failures=False)\\n+ assert cli._auto_discover_seed_agents([seed], allow_failures=True)[0].disabled is True\\n+\\n+ monkeypatch.setattr(\\n+ cli,\\n+ \\\"discover_provider_models\\\",\\n+ lambda source: [\\n+ DiscoveredModel(\\n+ provider_name=source.provider_name,\\n+ model_id=\\\"text-embedding-model\\\",\\n+ credential_name=source.credential_name,\\n+ chat_base_url=source.chat_base_url,\\n+ auth_scheme=source.auth_scheme,\\n+ )\\n+ ],\\n+ )\\n+ assert cli._auto_discover_seed_agents([seed], allow_failures=False)[0].disabled is True\\n+\\n+\\n+def test_discover_models_command_fails_when_every_provider_fails(monkeypatch) -> None:\\n+ monkeypatch.setattr(\\n+ cli,\\n+ \\\"discover_all_models\\\",\\n+ lambda: ([], [SimpleNamespace(provider_name=\\\"gateway\\\")]),\\n+ )\\n+ monkeypatch.setattr(cli, \\\"refresh_price_book\\\", lambda _models, _prices: 0)\\n+ with pytest.raises(SystemExit) as captured:\\n+ cli._discover_models_command([])\\n+ assert captured.value.code == 1\\n+\\n+\\n+def test_structured_output_forces_conduct_even_when_auto_would_route() -> None:\\n+ orchestrator = TaskOrchestrator(\\n+ [ModelAgent(\\\"general_agent\\\", \\\"mock-model\\\", tags=(\\\"reasoning\\\", \\\"writing\\\"))]\\n+ )\\n+\\n+ result = orchestrator.complete(\\n+ [{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"short structured request\\\"}],\\n+ mode=\\\"auto\\\",\\n+ output_contract={\\\"type\\\": \\\"json_object\\\"},\\n+ )\\n+\\n+ assert result[\\\"mode\\\"] == \\\"conduct\\\"\\n+ assert len(result[\\\"trace\\\"]) == 4\\n+ assert result[\\\"answer\\\"] == \\\"{}\\\"\" }, { \"sha\": \"9f2d009bbabe6312f9b84bf2c8ed84a038e537e2\", \"filename\": \"tests/test_generated_workflow.py\", \"status\": \"modified\", \"additions\": 14, \"deletions\": 1, \"changes\": 15, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_generated_workflow.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_generated_workflow.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_generated_workflow.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -18,7 +18,7 @@\\n \\n from contextual_orchestrator import ModelAgent, TaskOrchestrator # noqa: E402\\n import contextual_orchestrator.orchestrator as orchestrator_module # noqa: E402\\n-from contextual_orchestrator.orchestrator import ModelClient # noqa: E402\\n+from contextual_orchestrator.orchestrator import BudgetExceededError, ModelClient # noqa: E402\\n \\n \\n PLAN = {\\n@@ -96,6 +96,19 @@ def test_invalid_plan_falls_back_to_template() -> None:\\n assert len(result[\\\"trace\\\"]) == 4 # fixed thinker/worker/verifier/synthesizer template\\n \\n \\n+def test_generated_planner_budget_exhaustion_does_not_fallback() -> None:\\n+ orchestrator, _ = _orch(json.dumps(PLAN))\\n+ budget_error = BudgetExceededError(\\\"spend budget exceeded\\\")\\n+ with patch.object(orchestrator, \\\"_plan\\\", side_effect=AssertionError(\\\"budget must not fall back\\\")):\\n+ with patch.object(orchestrator, \\\"_raise_if_spend_budget_exceeded\\\", side_effect=budget_error):\\n+ try:\\n+ orchestrator.conduct([{\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"solve the hard problem\\\"}])\\n+ except BudgetExceededError as exc:\\n+ assert exc is budget_error\\n+ else: # pragma: no cover\\n+ raise AssertionError(\\\"budget exhaustion must stop generated planning\\\")\\n+\\n+\\n def test_default_template_unchanged() -> None:\\n orchestrator = TaskOrchestrator(\\n [ModelAgent(\\\"general_agent\\\", \\\"model-x\\\", tags=(\\\"reasoning\\\", \\\"writing\\\", \\\"planning\\\", \\\"research\\\"))]\" }, { \"sha\": \"5b9cad401157d9129dc66d68ca80c3dcc0cdd671\", \"filename\": \"tests/test_inbound_request_framing.py\", \"status\": \"added\", \"additions\": 223, \"deletions\": 0, \"changes\": 223, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_inbound_request_framing.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_inbound_request_framing.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_inbound_request_framing.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,223 @@\\n+\\\"\\\"\\\"Fail-closed inbound HTTP request framing regressions.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+from email.message import Message\\n+import io\\n+import socket\\n+from pathlib import Path\\n+import sys\\n+\\n+import pytest\\n+\\n+sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\n+\\n+from contextual_orchestrator import ModelAgent, TaskOrchestrator # noqa: E402\\n+from contextual_orchestrator.server import ( # noqa: E402\\n+ RequestError,\\n+ SecurityConfig,\\n+ _parse_request_framing,\\n+ build_server,\\n+)\\n+\\n+\\n+class _FakeConnection:\\n+ \\\"\\\"\\\"Record socket timeout changes made by the bounded body reader.\\\"\\\"\\\"\\n+\\n+ def __init__(self) -> None:\\n+ self.timeout: float | None = None\\n+\\n+ def gettimeout(self) -> float | None:\\n+ \\\"\\\"\\\"Return the current synthetic socket timeout.\\\"\\\"\\\"\\n+ return self.timeout\\n+\\n+ def settimeout(self, value: float | None) -> None:\\n+ \\\"\\\"\\\"Record a synthetic socket timeout.\\\"\\\"\\\"\\n+ self.timeout = value\\n+\\n+\\n+class _TimeoutReader:\\n+ \\\"\\\"\\\"Raise a real socket timeout to exercise request deadline handling.\\\"\\\"\\\"\\n+\\n+ def read(self, _size: int) -> bytes:\\n+ \\\"\\\"\\\"Raise a bounded-read timeout.\\\"\\\"\\\"\\n+ raise socket.timeout(\\\"test timeout\\\")\\n+\\n+\\n+class _ExplodingReader:\\n+ \\\"\\\"\\\"Fail if framing validation accidentally consumes bytes.\\\"\\\"\\\"\\n+\\n+ def read(self, _size: int) -> bytes:\\n+ \\\"\\\"\\\"Report an invalid unbounded read.\\\"\\\"\\\"\\n+ raise AssertionError(\\\"request bytes were consumed before framing validation\\\")\\n+\\n+\\n+class _GetAllHeaders:\\n+ \\\"\\\"\\\"Expose only the standard get_all header API.\\\"\\\"\\\"\\n+\\n+ def get_all(self, field_name: str, _default: list[str]) -> list[str]:\\n+ \\\"\\\"\\\"Return one valid fixed-length field.\\\"\\\"\\\"\\n+ return [] if field_name.casefold() == \\\"transfer-encoding\\\" else [\\\"1\\\"]\\n+\\n+\\n+class _GetHeaders:\\n+ \\\"\\\"\\\"Expose only a mapping-like get API.\\\"\\\"\\\"\\n+\\n+ def get(self, field_name: str) -> str | None:\\n+ \\\"\\\"\\\"Return one valid fixed-length field.\\\"\\\"\\\"\\n+ return None if field_name.casefold() == \\\"transfer-encoding\\\" else \\\"1\\\"\\n+\\n+\\n+def _headers(content_length: str | None = None, *, transfer_encoding: str | None = None) -> Message:\\n+ \\\"\\\"\\\"Build raw-like headers for the pure framing and handler tests.\\\"\\\"\\\"\\n+ headers = Message()\\n+ headers[\\\"content-type\\\"] = \\\"application/json\\\"\\n+ if content_length is not None:\\n+ headers[\\\"content-length\\\"] = content_length\\n+ if transfer_encoding is not None:\\n+ headers[\\\"transfer-encoding\\\"] = transfer_encoding\\n+ return headers\\n+\\n+\\n+def _handler(headers: Message, body: bytes | object, *, timeout: float = 1.0):\\n+ \\\"\\\"\\\"Create the real nested request handler without opening a listening socket.\\\"\\\"\\\"\\n+ server = build_server(\\n+ TaskOrchestrator([ModelAgent(\\\"general_agent\\\", \\\"mock-generalist\\\")]),\\n+ port=0,\\n+ security=SecurityConfig(\\n+ auth_token=\\\"test_token\\\", # noqa: S106\\n+ request_read_timeout_seconds=timeout,\\n+ ),\\n+ )\\n+ handler = server.RequestHandlerClass.__new__(server.RequestHandlerClass)\\n+ handler.headers = headers\\n+ handler.rfile = body if hasattr(body, \\\"read\\\") else io.BytesIO(body)\\n+ handler.connection = _FakeConnection()\\n+ handler.close_connection = False\\n+ return server, handler\\n+\\n+\\n+@pytest.mark.parametrize(\\\"value\\\", [\\\"-1\\\", \\\"+1\\\", \\\" 1\\\", \\\"1 \\\", \\\"1.0\\\", \\\"1,1\\\", \\\"\\\"])\\n+def test_invalid_content_length_is_rejected_before_read(value: str) -> None:\\n+ \\\"\\\"\\\"Reject signed, padded, non-decimal, and comma-ambiguous lengths.\\\"\\\"\\\"\\n+ with pytest.raises(RequestError, match=\\\"content-length\\\"):\\n+ _parse_request_framing(_headers(value), 64)\\n+\\n+\\n+def test_missing_length_and_transfer_encoding_fail_closed() -> None:\\n+ \\\"\\\"\\\"Require fixed-length framing and reject unsupported transfer coding.\\\"\\\"\\\"\\n+ with pytest.raises(RequestError, match=\\\"required\\\") as missing:\\n+ _parse_request_framing(_headers(), 64)\\n+ assert missing.value.status == 411\\n+ with pytest.raises(RequestError, match=\\\"transfer-encoded\\\"):\\n+ _parse_request_framing(_headers(\\\"1\\\", transfer_encoding=\\\"chunked\\\"), 64)\\n+\\n+\\n+def test_request_reader_rejects_non_json_media_type() -> None:\\n+ headers = _headers(\\\"2\\\")\\n+ headers.replace_header(\\\"content-type\\\", \\\"text/plain\\\")\\n+ server, handler = _handler(headers, b\\\"{}\\\")\\n+ try:\\n+ with pytest.raises(RequestError) as captured:\\n+ handler._read_json()\\n+ assert captured.value.status == 415\\n+ finally:\\n+ server.server_close()\\n+\\n+\\n+def test_header_value_fallbacks_and_integer_overflow_are_safe() -> None:\\n+ \\\"\\\"\\\"Support ordinary header mappings without weakening strict parsing.\\\"\\\"\\\"\\n+ assert _parse_request_framing(_GetAllHeaders(), 64) == 1\\n+ assert _parse_request_framing(_GetHeaders(), 64) == 1\\n+ with pytest.raises(RequestError, match=\\\"invalid\\\"):\\n+ _parse_request_framing(_headers(\\\"9\\\" * 5000), 64)\\n+\\n+\\n+def test_duplicate_content_length_is_rejected_even_when_equal() -> None:\\n+ \\\"\\\"\\\"Do not choose a value when duplicate header lines are present.\\\"\\\"\\\"\\n+ headers = _headers(\\\"1\\\")\\n+ headers.add_header(\\\"Content-Length\\\", \\\"1\\\")\\n+ with pytest.raises(RequestError, match=\\\"duplicate\\\"):\\n+ _parse_request_framing(headers, 64)\\n+\\n+\\n+def test_oversized_content_length_is_rejected_before_read() -> None:\\n+ \\\"\\\"\\\"Enforce the configured byte limit before touching the body stream.\\\"\\\"\\\"\\n+ with pytest.raises(RequestError) as error:\\n+ _parse_request_framing(_headers(\\\"65\\\"), 64)\\n+ assert error.value.status == 413\\n+\\n+\\n+def test_read_json_requires_exact_body_and_restores_timeout() -> None:\\n+ \\\"\\\"\\\"Read exactly the declared bytes and restore the connection timeout.\\\"\\\"\\\"\\n+ server, handler = _handler(_headers(\\\"7\\\"), b'{\\\"x\\\":1}')\\n+ try:\\n+ assert handler._read_json() == {\\\"x\\\": 1}\\n+ assert handler.connection.timeout is None\\n+ assert handler.close_connection is False\\n+ finally:\\n+ server.server_close()\\n+\\n+\\n+def test_zero_length_json_body_is_framing_valid_and_returns_empty_object() -> None:\\n+ \\\"\\\"\\\"Leave endpoint-level required-field validation to the existing caller.\\\"\\\"\\\"\\n+ server, handler = _handler(_headers(\\\"0\\\"), b\\\"\\\")\\n+ try:\\n+ assert handler._read_json() == {}\\n+ assert handler.close_connection is False\\n+ finally:\\n+ server.server_close()\\n+\\n+\\n+def test_read_json_rejects_truncated_body_and_closes_connection() -> None:\\n+ \\\"\\\"\\\"Reject premature EOF rather than decoding a partial request.\\\"\\\"\\\"\\n+ server, handler = _handler(_headers(\\\"7\\\"), b'{\\\"x\\\":')\\n+ try:\\n+ with pytest.raises(RequestError, match=\\\"ended before\\\"):\\n+ handler._read_json()\\n+ assert handler.close_connection is True\\n+ finally:\\n+ server.server_close()\\n+\\n+\\n+def test_read_json_rejects_invalid_framing_without_consuming_body() -> None:\\n+ \\\"\\\"\\\"Mark the connection closed when framing fails before the first read.\\\"\\\"\\\"\\n+ server, handler = _handler(_headers(\\\"-1\\\"), _ExplodingReader())\\n+ try:\\n+ with pytest.raises(RequestError, match=\\\"content-length\\\"):\\n+ handler._read_json()\\n+ assert handler.close_connection is True\\n+ finally:\\n+ server.server_close()\\n+\\n+\\n+def test_read_json_times_out_slow_body_and_closes_connection() -> None:\\n+ \\\"\\\"\\\"Release a handler blocked on an incomplete declared body.\\\"\\\"\\\"\\n+ server, handler = _handler(_headers(\\\"1\\\"), _TimeoutReader(), timeout=0.1)\\n+ try:\\n+ with pytest.raises(RequestError, match=\\\"timed out\\\") as error:\\n+ handler._read_json()\\n+ assert error.value.status == 408\\n+ assert handler.close_connection is True\\n+ assert handler.connection.timeout is None\\n+ finally:\\n+ server.server_close()\\n+\\n+\\n+def test_security_config_rejects_unbounded_body_read_timeout() -> None:\\n+ \\\"\\\"\\\"Keep deployment-provided body deadlines finite and bounded.\\\"\\\"\\\"\\n+ with pytest.raises(ValueError, match=\\\"request_read_timeout_seconds\\\"):\\n+ SecurityConfig(request_read_timeout_seconds=float(\\\"inf\\\"))\\n+ with pytest.raises(ValueError, match=\\\"max_body_bytes\\\"):\\n+ SecurityConfig(max_body_bytes=0)\\n+\\n+\\n+def test_security_readiness_exposes_bounded_request_controls() -> None:\\n+ \\\"\\\"\\\"Let operators verify the active body limit and deadline without secrets.\\\"\\\"\\\"\\n+ profile = SecurityConfig(max_body_bytes=128, request_read_timeout_seconds=2.0).readiness_profile()\\n+ assert profile[\\\"max_body_bytes\\\"] == 128\\n+ assert profile[\\\"request_read_timeout_seconds\\\"] == 2.0\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover\\n+ raise SystemExit(pytest.main([__file__]))\" }, { \"sha\": \"379920f83e5abcdf3120175ee82ab0370c3bacde\", \"filename\": \"tests/test_inbound_request_total_deadline.py\", \"status\": \"added\", \"additions\": 175, \"deletions\": 0, \"changes\": 175, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_inbound_request_total_deadline.py\", \"raw_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/raw/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_inbound_request_total_deadline.py\", \"contents_url\": \"https://api.github.com/repos/ContextualWisdomLab/contextual-orchestrator/contents/tests%2Ftest_inbound_request_total_deadline.py?ref=d19e3492192e21e4a040fa3fc13a0793443731bf\", \"patch\": \"@@ -0,0 +1,175 @@\\n+\\\"\\\"\\\"Regression for a total inbound-body deadline, not only idle-socket timeout.\\\"\\\"\\\"\\n+\\n+from __future__ import annotations\\n+\\n+from email.message import Message\\n+from pathlib import Path\\n+import sys\\n+from types import SimpleNamespace\\n+\\n+import pytest\\n+\\n+sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\\n+\\n+from contextual_orchestrator import ModelAgent, TaskOrchestrator # noqa: E402\\n+from contextual_orchestrator import server as server_module # noqa: E402\\n+from contextual_orchestrator.server import ( # noqa: E402\\n+ RequestError,\\n+ SecurityConfig,\\n+ build_server,\\n+)\\n+\\n+\\n+class _Clock:\\n+ \\\"\\\"\\\"Deterministic monotonic clock advanced by the synthetic slow reader.\\\"\\\"\\\"\\n+\\n+ def __init__(self) -> None:\\n+ self.now = 0.0\\n+\\n+ def monotonic(self) -> float:\\n+ return self.now\\n+\\n+\\n+class _AdvancingClock:\\n+ \\\"\\\"\\\"Advance beyond the deadline before the first body read.\\\"\\\"\\\"\\n+\\n+ def __init__(self) -> None:\\n+ self.now = 0.0\\n+\\n+ def monotonic(self) -> float:\\n+ self.now += 0.2\\n+ return self.now\\n+\\n+\\n+class _SlowProgressReader:\\n+ \\\"\\\"\\\"Return progress before every idle timeout while exceeding the total deadline.\\\"\\\"\\\"\\n+\\n+ def __init__(self, payload: bytes, clock: _Clock, step_seconds: float) -> None:\\n+ self.payload = payload\\n+ self.clock = clock\\n+ self.step_seconds = step_seconds\\n+ self.offset = 0\\n+\\n+ def read(self, _size: int) -> bytes:\\n+ if self.offset >= len(self.payload):\\n+ return b\\\"\\\"\\n+ self.clock.now += self.step_seconds\\n+ result = self.payload[self.offset : self.offset + 1]\\n+ self.offset += 1\\n+ return result\\n+\\n+\\n+class _FakeConnection:\\n+ \\\"\\\"\\\"Expose the socket timeout methods used by the request reader.\\\"\\\"\\\"\\n+\\n+ def __init__(self) -> None:\\n+ self.timeout: float | None = None\\n+\\n+ def gettimeout(self) -> float | None:\\n+ return self.timeout\\n+\\n+ def settimeout(self, value: float | None) -> None:\\n+ self.timeout = value\\n+\\n+\\n+def _headers(body_size: int) -> Message:\\n+ headers = Message()\\n+ headers[\\\"content-type\\\"] = \\\"application/json\\\"\\n+ headers[\\\"content-length\\\"] = str(body_size)\\n+ return headers\\n+\\n+\\n+def test_slow_progress_cannot_extend_request_past_total_deadline(monkeypatch) -> None:\\n+ \\\"\\\"\\\"A byte trickle below the idle timeout must still terminate at the deadline.\\\"\\\"\\\"\\n+ payload = b'{\\\"x\\\":1}'\\n+ clock = _Clock()\\n+ server = build_server(\\n+ TaskOrchestrator([ModelAgent(\\\"general_agent\\\", \\\"mock-generalist\\\")]),\\n+ port=0,\\n+ security=SecurityConfig(\\n+ auth_token=\\\"test_token\\\", # noqa: S106\\n+ request_read_timeout_seconds=0.1,\\n+ ),\\n+ )\\n+ handler = server.RequestHandlerClass.__new__(server.RequestHandlerClass)\\n+ handler.headers = _headers(len(payload))\\n+ handler.rfile = _SlowProgressReader(payload, clock, step_seconds=0.06)\\n+ handler.connection = _FakeConnection()\\n+ handler.close_connection = False\\n+ monkeypatch.setattr(\\n+ server_module,\\n+ \\\"time\\\",\\n+ SimpleNamespace(monotonic=clock.monotonic),\\n+ )\\n+\\n+ try:\\n+ with pytest.raises(RequestError, match=\\\"timed out\\\") as error:\\n+ handler._read_json()\\n+ assert error.value.status == 408\\n+ assert handler.close_connection is True\\n+ assert handler.connection.timeout is None\\n+ finally:\\n+ server.server_close()\\n+\\n+\\n+def test_complete_body_at_total_deadline_is_accepted(monkeypatch) -> None:\\n+ \\\"\\\"\\\"Accept the final byte when it completes the body at the deadline.\\\"\\\"\\\"\\n+ payload = b\\\"{}\\\"\\n+ clock = _Clock()\\n+ server = build_server(\\n+ TaskOrchestrator([ModelAgent(\\\"general_agent\\\", \\\"mock-generalist\\\")]),\\n+ port=0,\\n+ security=SecurityConfig(\\n+ auth_token=\\\"test_token\\\", # noqa: S106\\n+ request_read_timeout_seconds=0.1,\\n+ ),\\n+ )\\n+ handler = server.RequestHandlerClass.__new__(server.RequestHandlerClass)\\n+ handler.headers = _headers(len(payload))\\n+ handler.rfile = _SlowProgressReader(payload, clock, step_seconds=0.05)\\n+ handler.connection = _FakeConnection()\\n+ handler.close_connection = False\\n+ monkeypatch.setattr(\\n+ server_module,\\n+ \\\"time\\\",\\n+ SimpleNamespace(monotonic=clock.monotonic),\\n+ )\\n+\\n+ try:\\n+ assert handler._read_json() == {}\\n+ assert handler.close_connection is False\\n+ assert handler.connection.timeout is None\\n+ finally:\\n+ server.server_close()\\n+\\n+\\n+def test_expired_total_deadline_rejects_before_first_read(monkeypatch) -> None:\\n+ payload = b\\\"{}\\\"\\n+ clock = _AdvancingClock()\\n+ server = build_server(\\n+ TaskOrchestrator([ModelAgent(\\\"general_agent\\\", \\\"mock-generalist\\\")]),\\n+ port=0,\\n+ security=SecurityConfig(\\n+ auth_token=\\\"test_token\\\", # noqa: S106\\n+ request_read_timeout_seconds=0.1,\\n+ ),\\n+ )\\n+ handler = server.RequestHandlerClass.__new__(server.RequestHandlerClass)\\n+ handler.headers = _headers(len(payload))\\n+ handler.rfile = SimpleNamespace(\\n+ read=lambda _size: (_ for _ in ()).throw(AssertionError(\\\"body was read\\\"))\\n+ )\\n+ handler.connection = _FakeConnection()\\n+ handler.close_connection = False\\n+ monkeypatch.setattr(server_module, \\\"time\\\", SimpleNamespace(monotonic=clock.monotonic))\\n+\\n+ try:\\n+ with pytest.raises(RequestError, match=\\\"timed out\\\"):\\n+ handler._read_json()\\n+ assert handler.close_connection is True\\n+ finally:\\n+ server.server_close()\\n+\\n+\\n+if __name__ == \\\"__main__\\\": # pragma: no cover\\n+ raise SystemExit(pytest.main([__file__]))\" }, { \"sha\": \"4f9c8e2c7d84a335db0185fc32605498e168a56f\", \"filename\": \"tests/test_int_float_max_output_stop_ws_http_honesty.py\", \"status\": \"modified\", \"additions\": 3, \"deletions\": 2, \"changes\": 5, \"blob_url\": \"https://github.com/ContextualWisdomLab/contextual-orchestrator/blob/d19e3492192e21e4a040fa3fc13a0793443731bf/tests%2Ftest_int_float_max_ou