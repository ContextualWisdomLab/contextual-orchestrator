name: PR 971 exact-head review-quality repair

on:
  push:
    branches:
      - fix/model-group-timeout-openrouter
    paths:
      - .github/workflows/source-fix-971-live-review-quality.yml
      - scripts/ci/pr971_live_review_quality_repair.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-971-live-review-quality-repair
  cancel-in-progress: false

jobs:
  repair:
    name: RED to GREEN owner repair
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Guard exact writer head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          test -e scripts/ci/pr971_live_review_quality_repair.py

      - name: Install current RED regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/pr971_live_review_quality_repair.py red
          python -m compileall -q tests/test_pr971_review_quality_regressions.py
          git diff --check

      - name: Verify two causal RED regressions
        shell: bash
        run: |
          set -euo pipefail
          nodes=(
            "tests/test_pr971_review_quality_regressions.py::test_provider_embedding_batch_rejects_mixed_provider_routing_identity"
            "tests/test_pr971_review_quality_regressions.py::test_openrouter_endpoint_enrichment_caps_daemon_workers"
          )
          for node in "${nodes[@]}"; do
            set +e
            uv run --locked --extra api --extra db --extra queue --group dev python -m pytest -q "$node"
            rc=$?
            set -e
            if [ "$rc" -ne 1 ]; then
              echo "Expected pytest RED exit 1 for ${node}, got ${rc}" >&2
              exit 1
            fi
          done

      - name: Apply smallest causal GREEN
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/pr971_live_review_quality_repair.py green
          git diff --check

      - name: Verify focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --extra api --extra db --extra queue --group dev python -m pytest -q \
            tests/test_pr971_review_quality_regressions.py \
            tests/test_discovery_bootstrap_selection.py \
            tests/test_provider_embedding_batch_backend.py \
            tests/test_model_discovery.py
          uv run --locked --extra api --extra db --extra queue --group dev ruff check \
            contextual_orchestrator/cost_router.py \
            contextual_orchestrator/model_discovery.py \
            tests/test_pr971_review_quality_regressions.py \
            tests/test_discovery_bootstrap_selection.py
          python -m compileall -q contextual_orchestrator tests/test_pr971_review_quality_regressions.py
          git diff --check

      - name: Verify broader GREEN
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --extra api --extra db --extra queue --group dev python -m pytest -q
          python -m compileall -q contextual_orchestrator tests
          git diff --check

      - name: Remove temporary repair machinery and publish successor
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo "::error::PR_REVIEW_MERGE_TOKEN with workflow-starting write authority is required; refusing github.token or generic review-token publication." >&2
            exit 1
          fi
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

          rm .github/workflows/source-fix-971-live-review-quality.yml
          rm scripts/ci/pr971_live_review_quality_repair.py
          if find .github/workflows -maxdepth 1 -type f -name '*source-fix-971*' -print -quit | grep -q .; then
            echo "::error::A source-fix-971 workflow would remain in the publishable tree" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            contextual_orchestrator/cost_router.py \
            contextual_orchestrator/model_discovery.py \
            tests/test_pr971_review_quality_regressions.py \
            tests/test_discovery_bootstrap_selection.py \
            CHANGELOG.md \
            docs/product-technical-gap-baseline.md
          git add -u -- \
            .github/workflows/source-fix-971-live-review-quality.yml \
            scripts/ci/pr971_live_review_quality_repair.py
          git diff --cached --check
          git commit -m "fix(review): bind routing identity and bound discovery workers"

          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          askpass="$RUNNER_TEMP/pr971-git-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$PUBLISH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          rm -f "$askpass"
