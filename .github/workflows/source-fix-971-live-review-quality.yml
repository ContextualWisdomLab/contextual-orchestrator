name: PR 971 live review-quality repair

on:
  push:
    branches:
      - fix/model-group-timeout-openrouter
    paths:
      - .github/workflows/source-fix-971-live-review-quality.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-971-live-review-quality-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Guard exact writer head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Add durable RED regressions
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_pr971_review_quality_regressions.py <<'PY'
          """Review regressions for PR #971 privacy, health, and discovery boundaries."""

          from __future__ import annotations

          import json
          import threading
          import urllib.error
          import urllib.request
          from contextlib import contextmanager
          from dataclasses import replace
          from unittest.mock import patch

          import pytest

          from contextual_orchestrator import CostRoutingCoordinator, ModelAgent, TaskOrchestrator
          from contextual_orchestrator.batch_routing import EmbeddingBatchRequest
          from contextual_orchestrator.credentials import (
              InMemoryCredentialBackend,
              register_credential,
              set_backend,
          )
          from contextual_orchestrator.model_discovery import discover_all_models
          from contextual_orchestrator.server import SecurityConfig, build_server
          from tests.test_model_discovery import OPENAI_SOURCE, OPENROUTER_SOURCE


          _AUTH_TOKEN = "pr971_review_quality_token"


          def _embedding_coordinator() -> tuple[CostRoutingCoordinator, TaskOrchestrator, ModelAgent]:
              """Build one deterministic ZDR-capable embedding route."""
              agent = ModelAgent(
                  "zdr_embedding_agent",
                  "embedding-model",
                  "https://provider.synthetic.invalid/v1",
                  tags=("embedding", "privacy:zdr"),
              )
              orchestrator = TaskOrchestrator([agent])
              orchestrator.client.embed = lambda _agent, texts: [[1.0] for _ in texts]
              coordinator = CostRoutingCoordinator(orchestrator)
              return coordinator, orchestrator, agent


          def test_recovered_zdr_batch_reenters_request_privacy_scope(monkeypatch) -> None:
              """Persisted ZDR execution must restore request policy on the worker thread."""
              coordinator, orchestrator, agent = _embedding_coordinator()
              entries: list[bool] = []

              @contextmanager
              def observed_policy(zdr_only: bool):
                  entries.append(zdr_only)
                  yield

              monkeypatch.setattr(orchestrator, "request_policy", observed_policy)
              coordinator._run_provider_embeddings(
                  [
                      EmbeddingBatchRequest(
                          input_text="private input",
                          model=agent.model,
                          token_count=2,
                          zdr_only=True,
                          agent_id=agent.id,
                      )
                  ]
              )

              assert entries == [True]


          def test_provider_embedding_batch_rejects_mixed_privacy_identity() -> None:
              """One coalesced execution cannot mix privacy/routing identities."""
              coordinator, _orchestrator, agent = _embedding_coordinator()
              private = EmbeddingBatchRequest(
                  input_text="private",
                  model=agent.model,
                  token_count=1,
                  zdr_only=True,
                  agent_id=agent.id,
                  provider_routing={"zdr": True},
              )
              ordinary = EmbeddingBatchRequest(
                  input_text="ordinary",
                  model=agent.model,
                  token_count=1,
                  zdr_only=False,
                  agent_id=agent.id,
                  provider_routing=None,
              )

              with pytest.raises(RuntimeError, match="privacy policy"):
                  coordinator._run_provider_embeddings([private, ordinary])


          def _post(port: int, path: str, payload: dict) -> tuple[int, dict]:
              request = urllib.request.Request(
                  f"http://127.0.0.1:{port}{path}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "content-type": "application/json",
                      "authorization": f"Bearer {_AUTH_TOKEN}",
                      "connection": "close",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=5) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  return exc.code, json.loads(exc.read().decode("utf-8"))


          def test_terminal_embedding_batch_document_fails_over_before_marking_health() -> None:
              """Terminal provider documents are failures, not endpoint-health successes."""
              first = ModelAgent(
                  "first_embedding_agent",
                  "embed-v1",
                  tags=("embedding",),
                  priority=1,
              )
              second = ModelAgent(
                  "second_embedding_agent",
                  "embed-v1",
                  tags=("embedding",),
                  priority=0,
              )
              orchestrator = TaskOrchestrator([first, second])
              coordinator = CostRoutingCoordinator(orchestrator)
              attempted: list[str] = []

              def complete(_inputs, *, agent_id=None, **_kwargs):
                  attempted.append(str(agent_id))
                  if agent_id == first.id:
                      return {
                          "batch_id": "failed-batch",
                          "status": "failed",
                          "backend": "provider",
                          "model": first.model,
                          "embeddings": None,
                      }
                  return {
                      "batch_id": "accepted-batch",
                      "status": "validating",
                      "backend": "provider",
                      "model": second.model,
                      "embeddings": None,
                  }

              coordinator.complete_embeddings_batch = complete
              server = build_server(
                  orchestrator,
                  port=0,
                  security=SecurityConfig(auth_token=_AUTH_TOKEN),
                  coordinator=coordinator,
              )
              thread = threading.Thread(target=server.serve_forever, daemon=True)
              thread.start()
              try:
                  status, body = _post(
                      server.server_address[1],
                      "/v1/batch/embeddings",
                      {"model": "embed-v1", "input": "hello"},
                  )
              finally:
                  server.shutdown()
                  server.server_close()
                  thread.join(timeout=5)

              assert status == 202
              assert body["batch_id"] == "accepted-batch"
              assert attempted == [first.id, second.id]


          def _assert_discovery_finishes(call) -> None:
              """Require one discovery call to abandon a hung shared metadata fetch."""
              errors: list[BaseException] = []

              def run() -> None:
                  try:
                      call()
                  except BaseException as exc:  # pragma: no cover - surfaced below
                      errors.append(exc)

              worker = threading.Thread(target=run, daemon=True)
              worker.start()
              worker.join(timeout=0.5)
              assert not worker.is_alive(), "shared discovery metadata bypassed the discovery deadline"
              assert errors == []


          def test_discover_all_models_bounds_every_shared_metadata_fetch() -> None:
              """Models.dev, OpenRouter ZDR, and credit metadata share the control-plane bound."""
              set_backend(InMemoryCredentialBackend())
              try:
                  register_credential("OPENAI_API_KEY", "sk-openai")
                  never_models_dev = threading.Event()
                  source = replace(OPENAI_SOURCE, models_dev_provider_id="openai")
                  with (
                      patch(
                          "contextual_orchestrator.model_discovery._fetch_models_dev_metadata",
                          side_effect=lambda **_kwargs: never_models_dev.wait(),
                      ),
                      patch(
                          "contextual_orchestrator.model_discovery.discover_provider_models",
                          return_value=[],
                      ),
                      patch(
                          "contextual_orchestrator.model_discovery._openrouter_zdr_model_ids",
                          return_value=set(),
                      ),
                  ):
                      _assert_discovery_finishes(
                          lambda: discover_all_models((source,), discovery_deadline=0.05)
                      )

                  set_backend(InMemoryCredentialBackend())
                  register_credential("OPENROUTER_API_KEY", "sk-router")
                  never_zdr = threading.Event()
                  with (
                      patch(
                          "contextual_orchestrator.model_discovery.discover_provider_models",
                          return_value=[],
                      ),
                      patch(
                          "contextual_orchestrator.model_discovery._openrouter_zdr_model_ids",
                          side_effect=lambda **_kwargs: never_zdr.wait(),
                      ),
                      patch(
                          "contextual_orchestrator.model_discovery.openrouter_paid_inference_available",
                          return_value=None,
                      ),
                  ):
                      _assert_discovery_finishes(
                          lambda: discover_all_models((OPENROUTER_SOURCE,), discovery_deadline=0.05)
                      )

                  never_credit = threading.Event()
                  with (
                      patch(
                          "contextual_orchestrator.model_discovery.discover_provider_models",
                          return_value=[],
                      ),
                      patch(
                          "contextual_orchestrator.model_discovery._openrouter_zdr_model_ids",
                          return_value=set(),
                      ),
                      patch(
                          "contextual_orchestrator.model_discovery.openrouter_paid_inference_available",
                          side_effect=lambda **_kwargs: never_credit.wait(),
                      ),
                  ):
                      _assert_discovery_finishes(
                          lambda: discover_all_models((OPENROUTER_SOURCE,), discovery_deadline=0.05)
                      )
              finally:
                  set_backend(None)
          PY

      - name: Verify RED causally
        shell: bash
        run: |
          set -euo pipefail
          nodes=(
            "tests/test_pr971_review_quality_regressions.py::test_recovered_zdr_batch_reenters_request_privacy_scope"
            "tests/test_pr971_review_quality_regressions.py::test_provider_embedding_batch_rejects_mixed_privacy_identity"
            "tests/test_pr971_review_quality_regressions.py::test_terminal_embedding_batch_document_fails_over_before_marking_health"
            "tests/test_pr971_review_quality_regressions.py::test_discover_all_models_bounds_every_shared_metadata_fetch"
          )
          for node in "${nodes[@]}"; do
            set +e
            uv run --locked --extra api --extra db --extra queue --group dev python -m pytest -q "$node"
            rc=$?
            set -e
            if [ "$rc" -ne 1 ]; then
              echo "Expected one causal RED test failure for $node, got pytest exit $rc" >&2
              exit 1
            fi
          done

      - name: Apply smallest causal GREEN repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "contextual_orchestrator/cost_router.py",
              '''        if any(
            request.model != first.model or request.agent_id != first.agent_id
            for request in requests
        ):
            raise RuntimeError("provider embedding batch must retain one selected route")
        max_tokens, _max_chars, max_inputs = self._embedding_request_limits()
        vectors: List[List[float]] = []
        prompt_tokens = 0
        shard: List[EmbeddingBatchRequest] = []
        shard_tokens = 0
        for request in requests:
            request_tokens = request.token_count or len(request.input_text.encode("utf-8"))
            if shard and (
                len(shard) >= max_inputs or shard_tokens + request_tokens > max_tokens
            ):
                shard_vectors, shard_usage = self._run_embedding_shard(agent, shard)
                vectors.extend(shard_vectors)
                prompt_tokens += shard_usage
                shard = []
                shard_tokens = 0
            shard.append(request)
            shard_tokens += request_tokens
        if shard:
            shard_vectors, shard_usage = self._run_embedding_shard(agent, shard)
            vectors.extend(shard_vectors)
            prompt_tokens += shard_usage
        return vectors, prompt_tokens
''',
              '''        if any(
            request.model != first.model
            or request.agent_id != first.agent_id
            or request.zdr_only != first.zdr_only
            or request.provider_routing != first.provider_routing
            for request in requests
        ):
            raise RuntimeError(
                "provider embedding batch must retain one selected route and privacy policy"
            )
        max_tokens, _max_chars, max_inputs = self._embedding_request_limits()
        vectors: List[List[float]] = []
        prompt_tokens = 0
        shard: List[EmbeddingBatchRequest] = []
        shard_tokens = 0
        with self.orchestrator.request_policy(first.zdr_only):
            for request in requests:
                request_tokens = request.token_count or len(request.input_text.encode("utf-8"))
                if shard and (
                    len(shard) >= max_inputs or shard_tokens + request_tokens > max_tokens
                ):
                    shard_vectors, shard_usage = self._run_embedding_shard(agent, shard)
                    vectors.extend(shard_vectors)
                    prompt_tokens += shard_usage
                    shard = []
                    shard_tokens = 0
                shard.append(request)
                shard_tokens += request_tokens
            if shard:
                shard_vectors, shard_usage = self._run_embedding_shard(agent, shard)
                vectors.extend(shard_vectors)
                prompt_tokens += shard_usage
        return vectors, prompt_tokens
''',
          )

          replace_once(
              "contextual_orchestrator/server.py",
              '''                        orchestrator._group_router.observe_success(
                            embedding_agent.id,
                            time.perf_counter() - attempt_started_at,
                        )
                        orchestrator._record_success(embedding_agent.id)
                        break
''',
              '''                        terminal_status = str(
                            document.get("status") or ""
                        ).strip().lower()
                        if terminal_status in {"failed", "cancelled", "canceled", "rejected"}:
                            terminal_error = RuntimeError(
                                "embedding batch returned terminal provider status "
                                f"{terminal_status!r}"
                            )
                            last_embedding_error = terminal_error
                            orchestrator._record_embedding_failure(
                                embedding_agent,
                                "/v1/batch/embeddings",
                                terminal_error,
                            )
                            document = None
                            continue
                        orchestrator._group_router.observe_success(
                            embedding_agent.id,
                            time.perf_counter() - attempt_started_at,
                        )
                        orchestrator._record_success(embedding_agent.id)
                        break
''',
          )

          model_path = Path("contextual_orchestrator/model_discovery.py")
          model_text = model_path.read_text()
          marker = '''\n\ndef discover_all_models(\n'''
          if model_text.count(marker) != 1:
              raise SystemExit("model_discovery.py: discover_all_models marker was not unique")
          helper = '''\n\ndef _run_discovery_control_plane_bounded(\n    operation,\n    *,\n    discovery_deadline: float | None,\n    fallback: Any,\n    operation_name: str,\n) -> Any:\n    """Run one shared discovery metadata operation under the discovery bound.\n\n    Shared Models.dev, OpenRouter ZDR, and OpenRouter credit metadata are\n    bootstrap control-plane calls just like per-provider catalog discovery.\n    They deliberately do not inherit a model-inference timeout; instead this\n    helper abandons a daemon worker after ``discovery_deadline`` so one hung\n    shared dependency cannot starve every provider. ``None`` retains the\n    explicit unbounded opt-in. A timeout returns a fail-closed caller-supplied\n    fallback and never publishes positive capability/privacy/spend evidence.\n    """\n    if discovery_deadline is None:\n        return operation()\n    results: list[Any] = []\n    failures: list[BaseException] = []\n\n    def run() -> None:\n        try:\n            results.append(operation())\n        except BaseException as exc:  # noqa: BLE001 -- re-raised below\n            failures.append(exc)\n\n    worker = threading.Thread(\n        target=run,\n        name=f"discover-metadata-{operation_name}",\n        daemon=True,\n    )\n    worker.start()\n    worker.join(timeout=discovery_deadline)\n    if worker.is_alive():\n        _LOGGER.warning(\n            "discovery_metadata_timeout operation=%s deadline_seconds=%s",\n            operation_name,\n            discovery_deadline,\n        )\n        return fallback\n    if failures:\n        raise failures[0]\n    return results[0] if results else fallback\n'''
          model_text = model_text.replace(marker, helper + marker, 1)
          model_path.write_text(model_text)

          replace_once(
              "contextual_orchestrator/model_discovery.py",
              '''        models_dev_metadata = _fetch_models_dev_metadata(timeout=timeout)\n''',
              '''        models_dev_metadata = _run_discovery_control_plane_bounded(\n            lambda: _fetch_models_dev_metadata(timeout=timeout),\n            discovery_deadline=discovery_deadline,\n            fallback=None,\n            operation_name="models-dev",\n        )\n''',
          )
          replace_once(
              "contextual_orchestrator/model_discovery.py",
              '''        _openrouter_zdr_model_ids(timeout=timeout),\n''',
              '''        _run_discovery_control_plane_bounded(\n            lambda: _openrouter_zdr_model_ids(timeout=timeout),\n            discovery_deadline=discovery_deadline,\n            fallback=set(),\n            operation_name="openrouter-zdr",\n        ),\n''',
          )
          replace_once(
              "contextual_orchestrator/model_discovery.py",
              '''            openrouter_paid_inference_available(timeout=timeout),\n''',
              '''            _run_discovery_control_plane_bounded(\n                lambda: openrouter_paid_inference_available(timeout=timeout),\n                discovery_deadline=discovery_deadline,\n                fallback=None,\n                operation_name="openrouter-credit",\n            ),\n''',
          )

          changelog = Path("CHANGELOG.md")
          changelog_text = changelog.read_text()
          fixed_marker = "### Fixed\n\n"
          bullet = (
              "- Provider-embedding recovery now re-enters the persisted ZDR request-policy scope "
              "and rejects mixed privacy/routing identities before provider I/O; terminal "
              "failed/cancelled/rejected embedding-batch documents count as endpoint failures "
              "and fail over instead of clearing circuit health. Shared Models.dev, OpenRouter "
              "ZDR, and OpenRouter credit discovery metadata now use the same independent "
              "control-plane discovery deadline as provider catalogs, with fail-closed timeout "
              "fallbacks rather than model-inference deadlines (PR #971).\n"
          )
          if bullet not in changelog_text:
              if changelog_text.count(fixed_marker) < 1:
                  raise SystemExit("CHANGELOG.md: missing Fixed marker")
              changelog.write_text(changelog_text.replace(fixed_marker, fixed_marker + bullet, 1))

          baseline = Path("docs/product-technical-gap-baseline.md")
          baseline_text = baseline.read_text()
          section_title = "## PR #971 review-quality runtime boundary repair (2026-09-02)"
          if section_title not in baseline_text:
              baseline.write_text(
                  baseline_text.rstrip()
                  + "\n\n"
                  + section_title
                  + "\n\n"
                  + "**Status: Proposed until one unchanged successor head is exact-head GREEN.** "
                    "Current-head external review evidence proved three causal owner defects: "
                    "durably recovered `zdr_only` embedding work revalidated tags but did not "
                    "re-enter request-policy execution scope; coalesced embedding work compared "
                    "only model/agent identity and could mix privacy/routing identity; terminal "
                    "provider batch documents were recorded as endpoint success before their "
                    "terminal status was inspected. The same audit proved that shared Models.dev, "
                    "OpenRouter ZDR, and credit metadata calls sat outside the per-provider "
                    "discovery deadline and could starve all discovery under the default "
                    "no-inference-timeout contract. The owner repair binds execution to persisted "
                    "privacy/routing identity, treats terminal batch documents as failures that "
                    "participate in failover, and bounds every shared discovery metadata call with "
                    "a fail-closed control-plane deadline. `tests/test_pr971_review_quality_regressions.py` "
                    "is the durable false-negative corpus for these exact defect classes.\n"
              )
          PY

      - name: Verify GREEN focused and broader owner suites
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --extra api --extra db --extra queue --group dev python -m pytest -q \
            tests/test_pr971_review_quality_regressions.py \
            tests/test_provider_embedding_batch_backend.py \
            tests/test_embeddings_model_pool_http_honesty.py \
            tests/test_model_discovery.py
          uv run --locked --extra api --extra db --extra queue --group dev python -m pytest -q
          python -m compileall -q contextual_orchestrator tests/test_pr971_review_quality_regressions.py
          git diff --check

      - name: Remove repair workflow and publish exact writer delta
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          rm .github/workflows/source-fix-971-live-review-quality.yml
          if find .github/workflows -maxdepth 1 -type f -name '*source-fix-971*' -print -quit | grep -q .; then
            echo "A source-fix-971 workflow would remain in the publishable tree" >&2
            exit 1
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(review): enforce embedding privacy health and discovery bounds"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:${GITHUB_REF_NAME}"
