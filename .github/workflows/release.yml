name: Release

# Publishes a canonical, immutable GitHub Release so downstream consumers can
# pin a versioned tag instead of vendoring this repository's source SHA (see
# docs/planning/adrs/0129-canonical-immutable-release.md). This is a
# deliberate, maintainer-dispatched action only -- it never runs on push,
# schedule, or as a side effect of merging to main. It never re-implements
# GitHub branch-protection governance: it verifies the released commit really
# is (or, for a resume, once really was) protected main's tip, then re-runs
# this repository's own primary regression gate fresh before cutting
# anything.
#
# The very first thing the workflow does (`tag_state`, below) is decide
# which of two situations this dispatch is, and which exact commit
# (TARGET_SHA) every later gate must evaluate against:
#   - a FRESH publish (no `vX.Y.Z` tag exists yet) -- TARGET_SHA is this
#     dispatch's own commit, GITHUB_SHA, which must equal main's live
#     current tip; or
#   - a RESUME of a tag-only interrupted publication (the tag already
#     exists -- pushed by an earlier run that then failed before creating
#     the GitHub Release -- and points at a commit that really was main's
#     tip at some point, i.e. an ancestor of main's current tip). TARGET_SHA
#     is the tag's own target commit, which main is very likely to have
#     advanced past by now -- that is expected, not an error, and every
#     later gate (checks-green, version match, release-notes rendering)
#     evaluates against TARGET_SHA, never against a possibly-stale
#     GITHUB_SHA/current-main value. A tag that exists but points at a
#     commit that is *not* an ancestor of main's current tip is a genuine
#     conflict and is still rejected outright -- a tag is never moved or
#     reused for a different release.
#
# Two jobs, least-privilege: `verify` runs with no write permission and no
# persisted git credentials while it executes repository-controlled code
# (the test suite, release-notes rendering) -- a `contents: write` token is
# never present alongside that code. `publish` holds the write token, and its
# very first steps re-check (for a fresh publish only -- see above)
# protected main's tip and every check reported for TARGET_SHA, immediately
# before tag creation, right after `verify`'s potentially long-running gate
# finishes. That tip/checks recheck is still a check-then-act window, not an
# atomic guarantee -- see docs/planning/adrs/0129-canonical-immutable-release.md's
# "Known limitations" section and docs/RELEASING.md for the accepted
# residual risk and the recovery path if it is ever actually hit.
#
# The checks-green gate itself is one shared script
# (scripts/ci/release_checks_gate.sh) that both jobs call, rather than two
# inline copies that could silently drift from each other.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, matching pyproject.toml exactly (e.g. 0.2.0, no leading v)"
        required: true
        type: string

permissions:
  contents: read

# This repository's push-triggered job names from the integrated security.yml
# workflow -- shared by both jobs' checks-green gate (see
# scripts/ci/release_checks_gate.sh) so a `commits/$SHA/check-runs` report
# that is empty, or missing one of them, is treated as "not ready yet",
# never as vacuously "nothing to block on". A dispatch fired moments after a
# merge can race GitHub's own registration of this new tip's push-triggered
# check-runs: the API can legitimately return an empty or partial list
# before GitHub has even created the entries, and filtering an empty/partial
# list for "not complete+green" is vacuously empty too -- which previously
# let a release publish before Security/Fuzz/CodeQL had even started (Devin
# finding). Kept in sync with the integrated workflow's job `name:` values by
# tests/test_release_workflow_contract.py; update this list in the same PR
# that adds, removes, or renames a push-triggered quality job.
env:
  RELEASE_EXPECTED_PUSH_CHECKS: '["Tests and package quality","Property and coverage-guided fuzzing","Rust workspace gate","CodeQL, supply chain, and SBOM"]'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release preconditions (read-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    outputs:
      tag_resume: ${{ steps.tag_state.outputs.tag_resume }}
      release_resume: ${{ steps.tag_state.outputs.release_resume }}
      target_sha: ${{ steps.tag_state.outputs.target_sha }}
    steps:
      - name: Checkout protected main (no write credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Determine whether this is a fresh publish or a resume, and the exact commit to operate on
        id: tag_state
        run: |
          set -euo pipefail
          # Tag existence is checked only in GitHub's refs/tags namespace.
          # The commits endpoint accepts arbitrary refs, so a branch named
          # v${RELEASE_VERSION} could otherwise impersonate a release tag.
          # The exact tag ref points either directly at a commit (lightweight)
          # or at one annotated-tag object, which is then peeled to a commit.
          tag_ref_endpoint="repos/${GITHUB_REPOSITORY}/git/ref/tags/v${RELEASE_VERSION}"
          if ! tag_ref_output="$(gh api "${tag_ref_endpoint}" --jq '[.object.type, .object.sha] | @tsv' 2>&1)"; then
            if printf '%s' "${tag_ref_output}" | grep -q "HTTP 404"; then
              echo "::notice::Tag v${RELEASE_VERSION} does not exist yet (confirmed 404); this is a fresh publish."
              {
                echo "tag_resume=false"
                echo "release_resume=false"
                echo "target_sha=${GITHUB_SHA}"
              } >> "${GITHUB_OUTPUT}"
              echo "TARGET_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"
              exit 0
            fi
            echo "::error::Could not determine whether tag v${RELEASE_VERSION} already exists: the exact tag-ref lookup failed with an error other than a confirmed 404, so absence is NOT confirmed. Failing closed; re-dispatch after the transient failure clears. Raw error: ${tag_ref_output}" >&2
            exit 1
          fi

          IFS=$'\t' read -r tag_object_type tag_object_sha <<< "${tag_ref_output}"
          case "${tag_object_type}" in
            commit)
              echo "::error::Tag v${RELEASE_VERSION} is lightweight; the canonical release contract requires an annotated tag. Refusing to resume or replace it." >&2
              exit 1
              ;;
            tag)
              if ! tag_object_output="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq '[.object.type, .object.sha] | @tsv' 2>&1)"; then
                echo "::error::Could not dereference annotated tag v${RELEASE_VERSION}; failing closed. Raw error: ${tag_object_output}" >&2
                exit 1
              fi
              IFS=$'\t' read -r peeled_type peeled_sha <<< "${tag_object_output}"
              if [ "${peeled_type}" != "commit" ]; then
                echo "::error::Tag v${RELEASE_VERSION} does not resolve directly to a commit after one annotated-tag dereference (resolved type: ${peeled_type}); refusing an ambiguous release identity." >&2
                exit 1
              fi
              tag_commit="${peeled_sha}"
              ;;
            *)
              echo "::error::Tag v${RELEASE_VERSION} points at unsupported Git object type '${tag_object_type}'; refusing an ambiguous release identity." >&2
              exit 1
              ;;
          esac

          if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
            # main may simply have advanced past the tag's target commit
            # since it was pushed -- a tag-only interrupted publication (the
            # tag was pushed by an earlier run that then failed before ever
            # creating the GitHub Release, and one or more merges landed on
            # main before this retry). That is a safe, legitimate resume,
            # not a conflict: distinguish it from a genuine conflict -- a
            # tag that points at a commit which was never on main's history
            # at all (e.g. a stray or wrong tag) -- by checking whether the
            # tag's target commit is an ancestor of (or equal to) main's own
            # current live tip via the compare API. Only a commit that
            # really was main's history at some point is safe to finish
            # publishing; the tag itself is still never moved or reused for
            # a different commit. Any failure of this lookup itself (rate
            # limit, network, 5xx) fails the whole step closed via `set -e`
            # above, the same fail-closed default every other lookup in
            # this step handles explicitly.
            compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${tag_commit}...main" --jq .status)"
            case "${compare_status}" in
              identical|ahead)
                echo "::notice::Tag v${RELEASE_VERSION} already exists and points at ${tag_commit}, an ancestor of main's current tip; main has advanced since the tag was pushed (a tag-only interrupted publication). Resuming publication for the tagged commit -- never moving or reusing the tag for a different one."
                ;;
              *)
                echo "::error::Tag v${RELEASE_VERSION} already exists and points at ${tag_commit}, which is not an ancestor of main's current tip (compare status: ${compare_status}); a release tag is never moved onto a different commit. Publish a new version instead." >&2
                exit 1
                ;;
            esac
          fi
          target_sha="${tag_commit}"

          {
            echo "tag_resume=true"
            echo "target_sha=${target_sha}"
          } >> "${GITHUB_OUTPUT}"
          echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"

          # An interrupted draft can resume asset attachment. A published
          # immutable release is verify-only: its assets cannot be changed.
          # The publish job validates that lifecycle before any mutation.
          #
          # As with the tag lookup above, a failed `gh release view` is NOT
          # automatically "Release absent": only a confirmed 404 means that.
          if ! release_view_error="$(gh release view "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" 2>&1 >/dev/null)"; then
            if printf '%s' "${release_view_error}" | grep -qiE "release not found|HTTP 404"; then
              echo "::notice::Tag v${RELEASE_VERSION} already points at ${target_sha} with no published GitHub Release yet (confirmed absent); resuming publication instead of re-tagging."
              echo "release_resume=false" >> "${GITHUB_OUTPUT}"
            else
              echo "::error::Could not determine whether a GitHub Release already exists for v${RELEASE_VERSION}: gh release view failed with an error other than a confirmed absence, so absence is NOT confirmed. Failing closed; re-dispatch after the transient failure clears. Raw error: ${release_view_error}" >&2
              exit 1
            fi
          else
            echo "::notice::Tag v${RELEASE_VERSION} already points at ${target_sha} and its GitHub Release already exists; resuming lifecycle validation before asset verification."
            echo "release_resume=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out the exact commit this run will operate on
        run: |
          set -euo pipefail
          # A fresh publish's TARGET_SHA already equals the checked-out
          # GITHUB_SHA, so this is a no-op switch. A resume's TARGET_SHA is
          # an older commit than GITHUB_SHA (main has advanced) -- the
          # tag_state step above confirmed it is an ancestor of main's
          # current tip, so it is guaranteed to already be present in this
          # checkout's full history (fetch-depth: 0). Every later step in
          # this job (the version check, the test suite, release-notes
          # rendering) must read TARGET_SHA's own tree, never GITHUB_SHA's,
          # so a resume never renders notes or validates a version against
          # commits that landed on main after the tag was pushed.
          git checkout "${TARGET_SHA}"

      - name: Verify this commit is protected main's current, untampered tip (fresh publish only)
        run: |
          set -euo pipefail
          if [ "${TARGET_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::notice::Resuming an already-tagged commit (${TARGET_SHA}); main's current tip is not required to match it for a resume -- skipping the fresh-publish freshness check."
            exit 0
          fi
          remote_head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${remote_head}" != "${GITHUB_SHA}" ]; then
            echo "::error::Dispatched commit ${GITHUB_SHA} is not protected main's current tip (${remote_head}); a merge landed after this run started. Re-dispatch against the fresh tip." >&2
            exit 1
          fi

      - name: Verify every check reported for this commit is complete and green
        run: bash scripts/ci/release_checks_gate.sh

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Verify the requested version matches pyproject.toml's [project] table
        run: |
          set -euo pipefail
          declared="$(python -c 'from scripts.ci.release_notes import read_declared_version; print(read_declared_version(open("pyproject.toml", encoding="utf-8").read()))')"
          if [ "${declared}" != "${RELEASE_VERSION}" ]; then
            echo "::error::pyproject.toml's [project] table at commit ${TARGET_SHA} declares version '${declared}', but the dispatch input was '${RELEASE_VERSION}'. Land a version-bump PR first; a release never redefines a commit's version." >&2
            exit 1
          fi

      - name: Build locked native decision measurement for the full test suite
        run: |
          set -euo pipefail
          rustup show active-toolchain
          uv sync --locked --extra api --extra db --extra queue --group dev --group native-build
          uv run --no-sync maturin develop --locked --release --features pyo3/extension-module --manifest-path rust/decision_receipt/Cargo.toml

      - name: Run the full required test suite fresh on this exact commit
        run: uv run --no-sync python -m pytest -q

      - name: Render release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          python -m scripts.ci.release_notes \
            --pyproject pyproject.toml \
            --changelog CHANGELOG.md \
            --version "${RELEASE_VERSION}" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit-sha "${TARGET_SHA}" \
            --output release-notes.md

      - name: Fetch the required CycloneDX SBOM for this commit
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow security.yml --commit "${TARGET_SHA}" --status success --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "${run_id}" ]; then
            echo "::error::No successful Security workflow run with CycloneDX evidence is available for exact commit ${TARGET_SHA}; refusing to publish without the required SBOM." >&2
            exit 1
          fi
          if ! gh run download --repo "${GITHUB_REPOSITORY}" "${run_id}" --name cyclonedx-sbom --dir sbom-download; then
            echo "::error::Security workflow run ${run_id} does not expose the required cyclonedx-sbom artifact; refusing to publish." >&2
            exit 1
          fi
          sbom_file="sbom-download/cyclonedx-sbom.json"
          if [ ! -s "${sbom_file}" ]; then
            echo "::error::Downloaded CycloneDX SBOM is missing or empty at ${sbom_file}; refusing to publish." >&2
            exit 1
          fi

      - name: Build the installable package for this exact commit
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${TARGET_SHA}")"
          export SOURCE_DATE_EPOCH
          uv build --wheel --python 3.12 --out-dir dist
          wheel="dist/contextual_orchestrator-${RELEASE_VERSION}-py3-none-any.whl"
          test -s "${wheel}"
          uv build --wheel --python 3.12 --out-dir "${RUNNER_TEMP}/release-rebuild"
          if ! cmp "${wheel}" "${RUNNER_TEMP}/release-rebuild/${wheel##*/}"; then
            echo "::error::The exact-commit wheel changed between isolated builds." >&2
            exit 1
          fi
          (cd dist && sha256sum "${wheel##*/}" > SHA256SUMS)
          release_site="${RUNNER_TEMP}/release-package"
          uv pip install --no-deps --python 3.12 --target "${release_site}" "${wheel}"
          RELEASE_SITE="${release_site}" python - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path

          site = Path(os.environ["RELEASE_SITE"])
          distributions = list(importlib.metadata.distributions(path=[str(site)]))
          assert len(distributions) == 1
          assert distributions[0].metadata["Name"] == "contextual-orchestrator"
          assert distributions[0].version == os.environ["RELEASE_VERSION"]
          assert (site / "contextual_orchestrator/__init__.py").is_file()
          PY

      - name: Check the exact wheel's metadata with twine check --strict
        run: |
          set -euo pipefail
          # Runs here, in the read-only `verify` job (no id-token, no PyPI
          # secret, no write token), on the exact wheel that becomes the
          # publish input; `publish-pypi` installs nothing. Stand-in for the
          # organization's shared package-description gate. Exact pins,
          # binary wheels only, in an isolated virtualenv. Regenerate with:
          #   uv pip compile --python-version 3.12 \
          #     --python-platform x86_64-manylinux_2_28 <(echo twine)
          wheel="dist/contextual_orchestrator-${RELEASE_VERSION}-py3-none-any.whl"
          # Digests are held in this shell's memory before any third-party
          # code runs and re-checked afterwards, so the twine install cannot
          # silently swap the wheel or its manifest before the upload below.
          wheel_digest="$(sha256sum "${wheel}")"
          manifest="$(cat dist/SHA256SUMS)"
          check_dir="${RUNNER_TEMP}/twine-check"
          mkdir -p "${check_dir}"
          cp "${wheel}" "${check_dir}/"
          constraints="${RUNNER_TEMP}/twine-constraints.txt"
          cat > "${constraints}" <<'PINS'
          certifi==2026.7.22
          cffi==2.1.1
          charset-normalizer==3.5.1
          cryptography==50.0.1
          docutils==0.23
          id==1.6.1
          idna==3.20
          jaraco-classes==3.4.0
          jaraco-context==6.1.2
          jaraco-functools==4.6.0
          jeepney==0.9.0
          keyring==25.7.0
          markdown-it-py==4.2.0
          mdurl==0.1.2
          more-itertools==11.1.0
          nh3==0.3.7
          packaging==26.3
          pycparser==3.0
          pygments==2.21.0
          readme-renderer==46.0
          requests==2.34.2
          requests-toolbelt==1.0.0
          rfc3986==2.0.0
          rich==15.0.0
          secretstorage==3.5.0
          twine==7.0.0
          urllib3==2.8.0
          PINS
          python -m venv "${RUNNER_TEMP}/twine-venv"
          "${RUNNER_TEMP}/twine-venv/bin/python" -m pip install --quiet --disable-pip-version-check \
            --only-binary=:all: --constraint "${constraints}" twine
          # Every sdist and wheel staged for publication is checked; today
          # that is the single verified wheel.
          shopt -s nullglob
          distributions=("${check_dir}"/*.whl "${check_dir}"/*.tar.gz)
          if [ "${#distributions[@]}" -eq 0 ]; then
            echo "::error::No distributions staged for twine check." >&2
            exit 1
          fi
          if ! "${RUNNER_TEMP}/twine-venv/bin/twine" check --strict "${distributions[@]}"; then
            echo "::error::twine check --strict rejected the wheel's metadata; refusing to prepare it for publication." >&2
            exit 1
          fi
          if [ "$(sha256sum "${wheel}")" != "${wheel_digest}" ] || [ "$(cat dist/SHA256SUMS)" != "${manifest}" ]; then
            echo "::error::dist/ changed while twine check ran; refusing to publish." >&2
            exit 1
          fi
          (cd dist && sha256sum --strict -c SHA256SUMS)

      - name: Upload rendered notes and SBOM for the publish job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # actions/upload-artifact@v5
        with:
          name: release-publish-inputs
          path: |
            release-notes.md
            sbom-download/**
            dist/**
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish canonical immutable release
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      TAG_RESUME: ${{ needs.verify.outputs.tag_resume }}
      RELEASE_RESUME: ${{ needs.verify.outputs.release_resume }}
      TARGET_SHA: ${{ needs.verify.outputs.target_sha }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.target_sha }}
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true

      - name: Re-verify protected main has not advanced since verification started (fresh publish only)
        run: |
          set -euo pipefail
          if [ "${TARGET_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::notice::Resuming an already-tagged commit (${TARGET_SHA}); no current-main-tip recheck applies to a resume."
            exit 0
          fi
          remote_head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${remote_head}" != "${GITHUB_SHA}" ]; then
            echo "::error::Protected main advanced to ${remote_head} while the verify job was testing and rendering notes for ${GITHUB_SHA}; refusing to publish a now-superseded commit as the latest release. Re-dispatch against the fresh tip." >&2
            exit 1
          fi

      - name: Re-verify every check reported for this commit is complete and green
        run: bash scripts/ci/release_checks_gate.sh

      - name: Download the release notes and SBOM produced by verify
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # actions/download-artifact@v5
        with:
          name: release-publish-inputs

      - name: Verify mandatory release inputs
        run: |
          set -euo pipefail
          test -s release-notes.md
          test -s sbom-download/cyclonedx-sbom.json
          test -s "dist/contextual_orchestrator-${RELEASE_VERSION}-py3-none-any.whl"
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Create the annotated release tag
        if: env.TAG_RESUME != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${RELEASE_VERSION}" -m "Release v${RELEASE_VERSION}"
          git push origin "refs/tags/v${RELEASE_VERSION}"

      - name: Verify the exact remote release tag exists and targets this commit
        run: |
          set -euo pipefail
          if ! remote_tag_ref="$(git ls-remote --exit-code --refs origin "refs/tags/v${RELEASE_VERSION}")"; then
            echo "::error::Remote refs/tags/v${RELEASE_VERSION} does not exist; refusing to let GitHub synthesize a release tag implicitly." >&2
            exit 1
          fi
          remote_tag_object_sha="${remote_tag_ref%%$'\t'*}"
          local_tag_object_sha="$(git rev-parse "refs/tags/v${RELEASE_VERSION}")"
          local_tag_commit="$(git rev-list -n 1 "refs/tags/v${RELEASE_VERSION}")"
          if [ "${remote_tag_object_sha}" != "${local_tag_object_sha}" ] || [ "${local_tag_commit}" != "${TARGET_SHA}" ]; then
            echo "::error::Remote release-tag identity does not match the verified local tag/target commit; refusing publication." >&2
            exit 1
          fi

      - name: Validate the existing release lifecycle
        if: env.RELEASE_RESUME == 'true'
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${RELEASE_VERSION}")"
          if ! jq -e --arg tag "v${RELEASE_VERSION}" --arg wheel "contextual_orchestrator-${RELEASE_VERSION}-py3-none-any.whl" '
            .tag_name == $tag and .prerelease == false and
            ((.draft == true and .immutable == false) or
             (.draft == false and .immutable == true and
              ([.assets[] | select(.name == "cyclonedx-sbom.json" and (.size | type) == "number" and .size > 0)] | length) == 1 and
              ([.assets[] | select(.name == $wheel and (.size | type) == "number" and .size > 0)] | length) == 1 and
              ([.assets[] | select(.name == "SHA256SUMS" and (.size | type) == "number" and .size > 0)] | length) == 1))
          ' <<<"${release}" >/dev/null; then
            echo "::error::Existing release is neither a resumable draft nor a complete immutable release; refusing mutation." >&2
            exit 1
          fi

      - name: Create the GitHub Release
        if: env.RELEASE_RESUME != 'true'
        run: |
          set -euo pipefail
          gh release create "v${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${RELEASE_VERSION}" \
            --verify-tag \
            --draft \
            --notes-file release-notes.md

      - name: Attach required release SBOM
        run: |
          set -euo pipefail
          sbom_file="sbom-download/cyclonedx-sbom.json"
          if [ ! -s "${sbom_file}" ]; then
            echo "::error::Required CycloneDX SBOM is missing or empty; release completion is not allowed." >&2
            exit 1
          fi
          attached="$(gh release view "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          if printf '%s\n' "${attached}" | grep -qxF "cyclonedx-sbom.json"; then
            echo "::notice::Existing SBOM will be compared with the verified artifact."
          elif ! gh release upload "v${RELEASE_VERSION}" "${sbom_file}" --repo "${GITHUB_REPOSITORY}"; then
            echo "::error::Could not attach mandatory cyclonedx-sbom.json to v${RELEASE_VERSION}; release workflow is failing closed. Re-dispatch to resume the asset attachment without moving the tag." >&2
            exit 1
          fi
          attached="$(gh release view "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          if ! printf '%s\n' "${attached}" | grep -qxF "cyclonedx-sbom.json"; then
            echo "::error::GitHub Release does not report the mandatory cyclonedx-sbom.json after upload; release workflow is failing closed." >&2
            exit 1
          fi
          remote_dir="$(mktemp -d)"
          if ! gh release download "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --pattern cyclonedx-sbom.json --dir "${remote_dir}"; then
            echo "::error::Cannot retrieve the published SBOM for content verification." >&2
            exit 1
          fi
          if ! cmp -s "${sbom_file}" "${remote_dir}/cyclonedx-sbom.json"; then
            echo "::error::Published SBOM differs from verified evidence; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Attach the verified installable package
        run: |
          set -euo pipefail
          wheel="contextual_orchestrator-${RELEASE_VERSION}-py3-none-any.whl"
          (cd dist && sha256sum -c SHA256SUMS)
          for asset in "${wheel}" SHA256SUMS; do
            attached="$(gh release view "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
            if ! printf '%s\n' "${attached}" | grep -qxF "${asset}"; then
              gh release upload "v${RELEASE_VERSION}" "dist/${asset}" --repo "${GITHUB_REPOSITORY}"
            fi
            remote_dir="$(mktemp -d)"
            gh release download "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --pattern "${asset}" --dir "${remote_dir}"
            cmp "dist/${asset}" "${remote_dir}/${asset}"
          done

      - name: Publish the verified draft and require immutable attestation
        run: |
          set -euo pipefail
          release_endpoint="repos/${GITHUB_REPOSITORY}/releases/tags/v${RELEASE_VERSION}"
          release="$(gh api "${release_endpoint}")"
          if ! jq -e --arg tag "v${RELEASE_VERSION}" --arg wheel "contextual_orchestrator-${RELEASE_VERSION}-py3-none-any.whl" '
            .tag_name == $tag and .prerelease == false and
            ([.assets[] | select(.name == "cyclonedx-sbom.json" and (.size | type) == "number" and .size > 0)] | length) == 1 and
            ([.assets[] | select(.name == $wheel and (.size | type) == "number" and .size > 0)] | length) == 1 and
            ([.assets[] | select(.name == "SHA256SUMS" and (.size | type) == "number" and .size > 0)] | length) == 1 and
            ((.draft == true and .immutable == false) or
             (.draft == false and .immutable == true))
          ' <<<"${release}" >/dev/null; then
            echo "::error::Release lifecycle or mandatory asset changed before publication." >&2
            exit 1
          fi
          if [ "$(jq -r '.draft' <<<"${release}")" = "true" ]; then
            gh release edit "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false
          fi
          release="$(gh api "${release_endpoint}")"
          if ! jq -e --arg tag "v${RELEASE_VERSION}" '
            .tag_name == $tag and .draft == false and
            .prerelease == false and .immutable == true
          ' <<<"${release}" >/dev/null; then
            echo "::error::Published release is not immutable; it must not enter the released-owner inventory. Enable repository release immutability before publishing." >&2
            exit 1
          fi
          gh release verify "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}"
          gh release verify-asset "v${RELEASE_VERSION}" sbom-download/cyclonedx-sbom.json \
            --repo "${GITHUB_REPOSITORY}"
          gh release verify-asset "v${RELEASE_VERSION}" "dist/contextual_orchestrator-${RELEASE_VERSION}-py3-none-any.whl" \
            --repo "${GITHUB_REPOSITORY}"
          gh release verify-asset "v${RELEASE_VERSION}" dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}"

  # Publishes the SAME wheel bytes the `publish` job just attached to the
  # immutable GitHub Release to PyPI. One small, self-contained job, so it can
  # later be swapped for a call to the organization's shared
  # publish-package.yml without touching `verify` or `publish`.
  #
  # It never rebuilds: its only input is the `release-publish-inputs` artifact
  # that `verify` built twice, compared byte-for-byte and hashed into
  # SHA256SUMS, and that `publish` then compared against the release assets. A
  # rebuild here could silently diverge from the attested GitHub Release asset.
  #
  # Ordering: `needs: [verify, publish]` plus the implicit success() status
  # check means PyPI is touched only after the tag, the GitHub Release and its
  # signed asset attestations all verified. A failed PyPI upload therefore
  # never leaves a PyPI file without a matching immutable GitHub Release.
  #
  # This job installs nothing: `twine check --strict` already ran in the
  # read-only `verify` job on the same bytes, and every step here is either a
  # SHA-pinned action or stdlib-only shell/Python. The read-only GH_TOKEN is
  # scoped to the one step that reads the GitHub Release.
  #
  # Credentials: the PyPI secret is referenced in exactly ONE place, the
  # upload step's `password:` input (renaming it is a one-line change). It is
  # the organization PyPI API token secret; its unusual spelling is
  # intentional and shared with the organization's other package
  # repositories. It is scoped to that one step, so no other step ever sees
  # it. `environment: pypi` is where deployment protection belongs (see the
  # pre-merge checklist in docs/RELEASING.md); until that environment exists
  # with required reviewers and a main-only deployment rule, it adds no gate.
  #   - When the secret is non-empty, pypa/gh-action-pypi-publish uploads
  #     with it. A token scoped to the `contextual-orchestrator` project is
  #     enough.
  #   - When it is empty for this repository (for example the organization
  #     secret's repository access list does not include
  #     contextual-orchestrator), the action falls back to PyPI Trusted
  #     Publishing: it exchanges this job's GitHub OIDC token (`id-token:
  #     write` below) for a short-lived upload token. That works only if a
  #     Trusted Publisher is registered on PyPI for owner ContextualWisdomLab,
  #     repository contextual-orchestrator, workflow release.yml, environment
  #     pypi.
  #   - If neither path is configured the upload step fails, and "Explain a
  #     PyPI upload failure" turns that into an explicit, actionable error.
  #     This job never reports success without PyPI serving the verified
  #     wheel: its last step re-reads PyPI and compares SHA-256 digests.
  #
  # Idempotency and resume: PyPI never lets a filename be re-uploaded with
  # different bytes, and a version cannot be reused once a file was uploaded.
  #   - `skip-existing: true` makes a re-run (re-run failed jobs, or a new
  #     dispatch that resumes an already-immutable GitHub Release) a no-op for
  #     a wheel PyPI already has -- the same retry approach as fast-mlsirm's
  #     publish-pypi.yml;
  #   - the pre-upload check fails closed when PyPI already has ANY file for
  #     this version whose name or SHA-256 is not in the verified manifest,
  #     because skip-existing alone skips by filename and would hide that;
  #   - the post-upload check requires PyPI's file list for this version to
  #     equal the verified manifest exactly.
  # A genuine mismatch cannot be repaired by re-running: publish a new version.
  publish-pypi:
    name: Publish verified wheel to PyPI
    needs: [verify, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PYPI_PROJECT: contextual-orchestrator
    steps:
      - name: Download the verified release inputs produced by verify
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # actions/download-artifact@v5
        with:
          name: release-publish-inputs
          path: release-publish-inputs

      - name: Stage exactly the verified wheel and re-verify SHA256SUMS
        env:
          # Read-only token, scoped to the one step that reads the GitHub
          # Release; no other step in this job sees it.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wheel="contextual_orchestrator-${RELEASE_VERSION}-py3-none-any.whl"
          inputs="release-publish-inputs/dist"
          test -s "${inputs}/${wheel}"
          test -s "${inputs}/SHA256SUMS"
          (cd "${inputs}" && sha256sum --strict -c SHA256SUMS)
          # The manifest must name exactly the one verified wheel, so nothing
          # else can ride along into the upload directory.
          listed="$(awk '{ sub(/^\*/, "", $2); print $2 }' "${inputs}/SHA256SUMS")"
          if [ "${listed}" != "${wheel}" ]; then
            echo "::error::SHA256SUMS must list exactly ${wheel}; found: ${listed}. Refusing to publish to PyPI." >&2
            exit 1
          fi
          # The manifest must also equal the one attached to the published,
          # immutable GitHub Release, so PyPI receives the attested bytes.
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${RELEASE_VERSION}")"
          if ! jq -e --arg tag "v${RELEASE_VERSION}" '
            .tag_name == $tag and .draft == false and
            .prerelease == false and .immutable == true
          ' <<<"${release}" >/dev/null; then
            echo "::error::v${RELEASE_VERSION} is not a published immutable GitHub Release; refusing to publish to PyPI." >&2
            exit 1
          fi
          remote_dir="$(mktemp -d)"
          if ! gh release download "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --pattern SHA256SUMS --dir "${remote_dir}"; then
            echo "::error::Cannot retrieve SHA256SUMS from the v${RELEASE_VERSION} GitHub Release; refusing to publish to PyPI." >&2
            exit 1
          fi
          if ! cmp -s "${inputs}/SHA256SUMS" "${remote_dir}/SHA256SUMS"; then
            echo "::error::The verified SHA256SUMS differs from the one attached to the immutable v${RELEASE_VERSION} GitHub Release; refusing to publish to PyPI." >&2
            exit 1
          fi
          mkdir dist
          cp "${inputs}/${wheel}" dist/
          cp "${inputs}/SHA256SUMS" "${RUNNER_TEMP}/SHA256SUMS"
          (cd dist && sha256sum --strict -c "${RUNNER_TEMP}/SHA256SUMS")
          staged="$(find dist -mindepth 1 -printf '%f\n')"
          if [ "${staged}" != "${wheel}" ]; then
            echo "::error::dist/ must contain only ${wheel}; found: ${staged}." >&2
            exit 1
          fi

      - name: Refuse a PyPI version that already holds different files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          project = os.environ["PYPI_PROJECT"]
          manifest = {}
          for line in Path(os.environ["RUNNER_TEMP"], "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, name = line.split(maxsplit=1)
              manifest[name.lstrip("*")] = digest
          url = f"https://pypi.org/pypi/{project}/{version}/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  files = json.load(response)["urls"]
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print(f"::notice::PyPI has no {project} {version} yet (confirmed 404); this is a fresh upload.")
                  raise SystemExit(0)
              raise SystemExit(f"::error::PyPI lookup for {project} {version} failed with HTTP {error.code}; absence is NOT confirmed. Failing closed.")
          remote = {item["filename"]: item["digests"]["sha256"] for item in files}
          foreign = sorted(name for name, digest in remote.items() if manifest.get(name) != digest)
          if foreign:
              raise SystemExit(
                  f"::error::PyPI already has {project} {version} files that are not the verified artifacts: {foreign}. "
                  "PyPI never allows replacing a file or reusing a version; publish a new version instead."
              )
          print(f"::notice::PyPI already has {sorted(remote)} for {version} with matching SHA-256; skip-existing makes the upload a no-op for them.")
          PY

      - name: Publish the verified wheel to PyPI
        id: pypi_upload
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
          # The ONLY reference to the PyPI secret (see the job comment). Empty
          # => the action falls back to Trusted Publishing (OIDC).
          password: ${{ secrets.PIPY_TOKEN }}
          # PEP 740 attestations need Trusted Publishing and are ignored with a
          # token; the wheel's provenance is the immutable GitHub Release asset
          # attestation verified by `publish`. Same setting as fast-mlsirm.
          attestations: false
          # A re-run after a partial or completed upload must not fail on a
          # filename PyPI already has. Content equality is enforced by the
          # checks before and after this step, not by skip-existing.
          skip-existing: true
          print-hash: true

      - name: Explain a PyPI upload failure
        if: failure() && steps.pypi_upload.outcome == 'failure'
        run: |
          echo "::error::PyPI upload failed. If the upload log above reports a Trusted Publishing exchange failure or an empty password, the organization PyPI token secret is not available to this repository and no Trusted Publisher is configured. Fix one of: (1) add contextual-orchestrator to that organization secret's repository access list, or (2) register a PyPI Trusted Publisher for owner ContextualWisdomLab, repository contextual-orchestrator, workflow release.yml, environment pypi. If it reports an invalid or non-permitted token, replace the token with one allowed to upload contextual-orchestrator. Then re-run this job; the immutable GitHub Release is already complete and is not modified." >&2
          exit 1

      - name: Verify PyPI serves exactly the verified wheel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          project = os.environ["PYPI_PROJECT"]
          manifest = {}
          for line in Path(os.environ["RUNNER_TEMP"], "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, name = line.split(maxsplit=1)
              manifest[name.lstrip("*")] = digest
          url = f"https://pypi.org/pypi/{project}/{version}/json"
          remote = None
          # PyPI's JSON API is CDN-cached, so a just-uploaded file can take a
          # short while to appear. Bounded retries only; never a pass on timeout.
          for attempt in range(12):
              try:
                  request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      files = json.load(response)["urls"]
                  remote = {item["filename"]: item["digests"]["sha256"] for item in files}
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise SystemExit(f"::error::PyPI lookup failed with HTTP {error.code}; cannot confirm publication.")
                  remote = {}
              if remote == manifest:
                  print(f"::notice::PyPI serves exactly the verified files for {project} {version}: {sorted(remote)}.")
                  raise SystemExit(0)
              if any(manifest.get(name) != digest for name, digest in remote.items()):
                  break
              time.sleep(20)
          raise SystemExit(
              f"::error::PyPI files for {project} {version} do not equal the verified SHA256SUMS. "
              f"Expected {manifest}, PyPI reports {remote}."
          )
          PY
