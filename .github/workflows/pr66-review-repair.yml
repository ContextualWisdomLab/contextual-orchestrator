name: PR 66 review repair

on:
  push:
    branches:
      - codex/sync-embeddings-file-ontology
    paths:
      - .github/workflows/pr66-review-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr66-review-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/contextual-orchestrator'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/sync-embeddings-file-ontology
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Apply verified review fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              content = file_path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one review target in {path}, found {count}"
                  )
              file_path.write_text(content.replace(old, new), encoding="utf-8")

          replace_exact(
              "contextual_orchestrator/__main__.py",
              '''    args = parser.parse_args(argv)\n\n    value = _read_stdin_credential()\n''',
              '''    args = parser.parse_args(argv)\n\n    if not args.value_stdin:\n        parser.error(\n            "--value-stdin is required; stdin is the only supported secret transport"\n        )\n\n    value = _read_stdin_credential()\n''',
          )
          replace_exact(
              "contextual_orchestrator/cost_router.py",
              '''            or not all(\n                isinstance(component, (int, float)) and math.isfinite(float(component))\n                for component in item_by_id[request.custom_id].embedding\n            )\n''',
              '''            or not all(\n                not isinstance(component, bool)\n                and isinstance(component, (int, float))\n                and math.isfinite(float(component))\n                for component in item_by_id[request.custom_id].embedding\n            )\n''',
          )
          replace_exact(
              "contextual_orchestrator/server.py",
              '''                        metadata={"actor_scope": "inference", "request_channel": "sync"},\n''',
              '''                        metadata={"actor_scope": "inference"},\n''',
          )
          replace_exact(
              "contextual_orchestrator/server.py",
              '''                        "model": model_name,\n                        "usage": {\n''',
              '''                        "model": str(document.get("model") or model_name),\n                        "usage": {\n''',
          )
          PY

      - name: Install validation tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest coverage interrogate

      - name: Run focused review regressions
        run: python -m pytest -q tests/test_pr66_review_regressions.py

      - name: Run the complete test suite
        run: python -m pytest -q

      - name: Recheck configured docstring gate
        run: python -m interrogate -c pyproject.toml contextual_orchestrator

      - name: Commit the verified repair and remove this workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/pr66-review-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contextual_orchestrator/__main__.py \
            contextual_orchestrator/cost_router.py \
            contextual_orchestrator/server.py \
            tests/test_pr66_review_regressions.py
          git diff --cached --check
          git commit -m "fix: address synchronous embeddings review findings"
          git push origin HEAD:codex/sync-embeddings-file-ontology
