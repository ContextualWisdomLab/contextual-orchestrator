name: Publish verified NIM benchmark integration

on:
  push:
    branches:
      - claude/nim-all-models-support-fecb0b
    paths:
      - .github/workflows/nim-apply-reviewed-patch.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: nim-reviewed-publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: >-
      github.repository == 'ContextualWisdomLab/contextual-orchestrator' &&
      github.ref == 'refs/heads/claude/nim-all-models-support-fecb0b'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_PARENT_SHA: 012f7c728faf3594026cc4654a066f38cdaf8b71
      EXPECTED_SECURITY_BASE_SHA: b9163f4e088318b3a9d4498868639993845567f5
      EXPECTED_ARTIFACT_ZIP_SHA256: f71eaedcb231df964fad52955e3a6a2f096fbd9adc28f22f15dfb38532d492ca
      EXPECTED_SOURCE_TAR_SHA256: 2b1d7538f50f9ce0bbb6f1b0ea0b907a6f32145d6ca739c61a5d5052a4fdb8d9
      EXPECTED_FINAL_TREE_SHA: 8dc5da1f8ea8194631cf41628e1231f41c08fe4c
      VERIFIED_ARTIFACT_ID: "8918112421"
      FINAL_SOURCE_DIR: /tmp/nim-final-source
      TARGET_BRANCH: claude/nim-all-models-support-fecb0b
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact publisher head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind publication to the reviewed lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_SECURITY_BASE_SHA" HEAD

      - name: Download and authenticate the immutable verified artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_zip="$RUNNER_TEMP/nim-final-source.zip"
          artifact_dir="$RUNNER_TEMP/nim-final-artifact"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$VERIFIED_ARTIFACT_ID/zip" \
            --output "$artifact_zip"
          printf '%s  %s\n' "$EXPECTED_ARTIFACT_ZIP_SHA256" "$artifact_zip" | sha256sum -c -
          rm -rf "$artifact_dir" "$FINAL_SOURCE_DIR"
          mkdir -p "$artifact_dir" "$FINAL_SOURCE_DIR"
          unzip -q "$artifact_zip" -d "$artifact_dir"
          printf '%s  %s\n' \
            "$EXPECTED_SOURCE_TAR_SHA256" \
            "$artifact_dir/nim-final-source.tar.gz" | sha256sum -c -
          test "$(cat "$artifact_dir/nim-final-tree-sha.txt")" = "$EXPECTED_FINAL_TREE_SHA"
          tar -xzf "$artifact_dir/nim-final-source.tar.gz" -C "$FINAL_SOURCE_DIR"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Reverify behavior, coverage, documentation, and packaging
        shell: bash
        run: |
          set -euo pipefail
          cd "$FINAL_SOURCE_DIR"
          python -m pip install --require-hashes -r fuzz/requirements-property.txt
          python -m pip install --require-hashes -r requirements-opencode-review-ci.txt
          python -m compileall -q contextual_orchestrator tests
          python -m pytest -q
          python -m coverage erase
          python -m coverage run --branch \
            --source=contextual_orchestrator.nim_benchmark \
            -m pytest \
            tests/test_nim_benchmark.py \
            tests/test_nim_benchmark_release_acceptance.py \
            tests/test_nim_benchmark_workflow_contract.py \
            -q
          python -m coverage report \
            --include=contextual_orchestrator/nim_benchmark.py \
            --show-missing \
            --fail-under=100
          python -m interrogate -f 100 contextual_orchestrator/nim_benchmark.py
          ! grep -R -n 'urllib.request.urlopen' contextual_orchestrator/nim_benchmark.py
          test ! -e contextual_orchestrator/nim_benchmark_hardening.py
          test ! -e tests/test_nim_benchmark_hardening.py
          test ! -e .review-evidence
          test ! -e .github/workflows/nim-apply-reviewed-patch.yml
          rm -rf dist "$RUNNER_TEMP/nim-wheel-site"
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps \
            --target "$RUNNER_TEMP/nim-wheel-site" \
            dist/contextual_orchestrator-*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/nim-wheel-site" \
            python -c "import contextual_orchestrator; import contextual_orchestrator.nim_benchmark"

      - name: Publish only the exact verified tree
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          final_index="$RUNNER_TEMP/nim-final.index"
          rm -f "$final_index"
          GIT_INDEX_FILE="$final_index" git read-tree --empty
          GIT_INDEX_FILE="$final_index" GIT_WORK_TREE="$FINAL_SOURCE_DIR" git add -A
          final_tree="$(GIT_INDEX_FILE="$final_index" git write-tree)"
          test "$final_tree" = "$EXPECTED_FINAL_TREE_SHA"
          current_remote="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$current_remote" = "$GITHUB_SHA"
          final_commit="$(git commit-tree "$final_tree" -p "$GITHUB_SHA" \
            -m 'feat(nim): integrate verified provider-neutral benchmark')"
          test "$(git rev-parse "$final_commit^{tree}")" = "$EXPECTED_FINAL_TREE_SHA"
          git push origin "$final_commit:refs/heads/$TARGET_BRANCH"
          printf 'published exact verified commit: %s\n' "$final_commit"
