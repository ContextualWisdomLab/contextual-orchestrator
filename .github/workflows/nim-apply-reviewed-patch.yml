name: Verify reviewed NIM benchmark integration

on:
  push:
    branches:
      - claude/nim-all-models-support-fecb0b
    paths:
      - .github/workflows/nim-apply-reviewed-patch.yml

permissions:
  contents: read

concurrency:
  group: nim-reviewed-patch-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apply-verify-export:
    if: >-
      github.repository == 'ContextualWisdomLab/contextual-orchestrator' &&
      github.ref == 'refs/heads/claude/nim-all-models-support-fecb0b'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_PARENT_SHA: 83b7906f2d4d88e1935f12b54fe8ca214c166465
      EXPECTED_SECURITY_BASE_SHA: b9163f4e088318b3a9d4498868639993845567f5
      PATCH_CONTEXT_SHA: 667b311564689a7a53e7fe2bfd91834f80869035
      EXPECTED_PATCH_SHA256: 3f5313cf905042b049af8a22fa10a6db6f883959d592727352101343014e5322
      EXPECTED_FINAL_TREE_SHA: 8dc5da1f8ea8194631cf41628e1231f41c08fe4c
      FINAL_SOURCE_DIR: /tmp/nim-final-worktree
      TARGET_BRANCH: claude/nim-all-models-support-fecb0b
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact pushed head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind execution to the reviewed lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_SECURITY_BASE_SHA" HEAD
          git merge-base --is-ancestor "$PATCH_CONTEXT_SHA" HEAD

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Reconstruct the exact reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          patch_gzip="$RUNNER_TEMP/nim-final.patch.gz"
          patch_file="$RUNNER_TEMP/nim-final.patch"
          rehydrate_script="$RUNNER_TEMP/rehydrate_patch_index.py"

          cat .review-evidence/nim-final-patch/part-*.txt \
            | tr -d '\n\r' \
            | base64 --decode > "$patch_gzip"
          gzip -dc "$patch_gzip" > "$patch_file"
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" "$patch_file" | sha256sum -c -

          cat > "$rehydrate_script" <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re
          import shlex
          import subprocess
          import sys

          patch_path = Path(sys.argv[1])
          current_path: str | None = None
          entries: list[tuple[str, str, str | None]] = []
          for line in patch_path.read_text(
              encoding="utf-8", errors="surrogateescape"
          ).splitlines():
              if line.startswith("diff --git "):
                  parts = shlex.split(line)
                  assert len(parts) == 4, line
                  old_path = parts[2][2:]
                  new_path = parts[3][2:]
                  assert old_path == new_path, line
                  current_path = new_path
                  continue
              if current_path is None or not line.startswith("index "):
                  continue
              match = re.fullmatch(
                  r"index ([0-9a-f]+)\.\.([0-9a-f]+)(?: ([0-7]{6}))?", line
              )
              assert match is not None, line
              entries.append((current_path, match.group(1), match.group(3)))
              current_path = None

          assert entries, "reviewed patch has no indexed paths"
          for path_text, old_object, declared_mode in entries:
              path = Path(path_text)
              if set(old_object) == {"0"}:
                  subprocess.run(
                      ["git", "update-index", "--force-remove", "--", path_text],
                      check=False,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if path.exists() or path.is_symlink():
                      path.unlink()
                  continue

              full_object = subprocess.check_output(
                  ["git", "rev-parse", "--verify", f"{old_object}^{{blob}}"],
                  text=True,
              ).strip()
              mode = declared_mode
              if mode is None:
                  listing = subprocess.run(
                      ["git", "ls-files", "-s", "--", path_text],
                      check=False,
                      capture_output=True,
                      text=True,
                  ).stdout.strip()
                  mode = listing.split(maxsplit=1)[0] if listing else "100644"
              subprocess.run(
                  ["git", "update-index", "--add", "--cacheinfo", mode, full_object, path_text],
                  check=True,
              )
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open("wb") as output:
                  subprocess.run(
                      ["git", "cat-file", "blob", full_object],
                      check=True,
                      stdout=output,
                  )
          PY

          rm -rf "$FINAL_SOURCE_DIR"
          git worktree add --detach "$FINAL_SOURCE_DIR" "$PATCH_CONTEXT_SHA"
          cd "$FINAL_SOURCE_DIR"
          python "$rehydrate_script" "$patch_file"
          git apply --check --index "$patch_file"
          git apply --index "$patch_file"
          git diff --cached --check
          actual_tree="$(git write-tree)"
          printf 'reconstructed tree: %s\n' "$actual_tree"
          test "$actual_tree" = "$EXPECTED_FINAL_TREE_SHA"

      - name: Install hash-locked verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$FINAL_SOURCE_DIR"
          python -m pip install --require-hashes -r fuzz/requirements-property.txt
          python -m pip install --require-hashes -r requirements-opencode-review-ci.txt

      - name: Verify full behavior and exact quality gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$FINAL_SOURCE_DIR"
          python -m compileall -q contextual_orchestrator tests
          python -m pytest -q
          python -m coverage erase
          python -m coverage run --branch \
            --source=contextual_orchestrator.nim_benchmark \
            -m pytest \
            tests/test_nim_benchmark.py \
            tests/test_nim_benchmark_release_acceptance.py \
            tests/test_nim_benchmark_workflow_contract.py \
            -q
          python -m coverage report \
            --include=contextual_orchestrator/nim_benchmark.py \
            --show-missing \
            --fail-under=100
          python -m interrogate -f 100 contextual_orchestrator/nim_benchmark.py
          ! grep -R -n 'urllib.request.urlopen' contextual_orchestrator/nim_benchmark.py
          test ! -e contextual_orchestrator/nim_benchmark_hardening.py
          test ! -e tests/test_nim_benchmark_hardening.py
          test ! -e .review-evidence/nim-source-repair.yml
          test ! -e .review-evidence/nim-direct-integration
          test ! -e .review-evidence/nim-final-patch
          test ! -e .github/workflows/nim-apply-reviewed-patch.yml
          git diff --cached --check

      - name: Build, install, and import the wheel in isolation
        shell: bash
        run: |
          set -euo pipefail
          cd "$FINAL_SOURCE_DIR"
          rm -rf dist "$RUNNER_TEMP/nim-wheel-site"
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
          python -m pip install --no-deps \
            --target "$RUNNER_TEMP/nim-wheel-site" \
            dist/contextual_orchestrator-*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/nim-wheel-site" \
            python -c "import contextual_orchestrator; import contextual_orchestrator.nim_benchmark"

      - name: Prove and export the exact final tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$FINAL_SOURCE_DIR"
          rm -rf dist build .coverage htmlcov contextual_orchestrator.egg-info
          git add -A
          git diff --cached --check
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$EXPECTED_FINAL_TREE_SHA"
          export_dir="$RUNNER_TEMP/nim-final-source"
          rm -rf "$export_dir"
          mkdir -p "$export_dir"
          git checkout-index --all --prefix="$export_dir/"
          tar -C "$export_dir" -czf "$RUNNER_TEMP/nim-final-source.tar.gz" .
          printf '%s\n' "$actual_tree" > "$RUNNER_TEMP/nim-final-tree-sha.txt"
          sha256sum "$RUNNER_TEMP/nim-final-source.tar.gz" \
            > "$RUNNER_TEMP/nim-final-source.tar.gz.sha256"

      - name: Upload exact verified source tree
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: nim-final-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nim-final-source.tar.gz
            ${{ runner.temp }}/nim-final-source.tar.gz.sha256
            ${{ runner.temp }}/nim-final-tree-sha.txt
          if-no-files-found: error
          retention-days: 1
