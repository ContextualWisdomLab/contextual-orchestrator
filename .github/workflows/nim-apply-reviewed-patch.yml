name: Inspect reviewed NIM integration artifact

on:
  push:
    branches:
      - claude/nim-all-models-support-fecb0b
    paths:
      - .github/workflows/nim-apply-reviewed-patch.yml

permissions:
  contents: read

concurrency:
  group: nim-reviewed-artifact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  inspect-artifact:
    if: >-
      github.repository == 'ContextualWisdomLab/contextual-orchestrator' &&
      github.ref == 'refs/heads/claude/nim-all-models-support-fecb0b'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PARENT_SHA: 7595919c4b5ac259605dd695d79eca3879485019
      EXPECTED_BASE_SHA: b9163f4e088318b3a9d4498868639993845567f5
      TARGET_BRANCH: claude/nim-all-models-support-fecb0b
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact pushed head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind inspection to the exact reviewed branch lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Identify the immutable direct-integration payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import bz2
          import gzip
          import hashlib
          import io
          import json
          import lzma
          from pathlib import Path
          import tarfile
          import zipfile
          import zlib

          chunks = sorted(Path('.review-evidence/nim-direct-integration').glob('chunk-*.b85'))
          assert chunks, 'direct-integration chunks are missing'
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          payload = base64.b85decode(encoded.encode('ascii'))
          print(json.dumps({
              'chunk_count': len(chunks),
              'encoded_bytes': len(encoded),
              'decoded_bytes': len(payload),
              'decoded_sha256': hashlib.sha256(payload).hexdigest(),
              'decoded_magic_hex': payload[:16].hex(),
          }, sort_keys=True))

          layers: list[tuple[str, bytes]] = [('base85', payload)]
          decompressors = (
              ('gzip', gzip.decompress),
              ('bz2', bz2.decompress),
              ('lzma', lzma.decompress),
              ('zlib', zlib.decompress),
          )
          for name, decoder in decompressors:
              try:
                  decoded = decoder(payload)
              except Exception:
                  continue
              layers.append((name, decoded))
              print(json.dumps({
                  'layer': name,
                  'bytes': len(decoded),
                  'sha256': hashlib.sha256(decoded).hexdigest(),
                  'magic_hex': decoded[:16].hex(),
              }, sort_keys=True))

          for name, data in layers:
              try:
                  with tarfile.open(fileobj=io.BytesIO(data), mode='r:*') as archive:
                      names = archive.getnames()
                  print(json.dumps({'layer': name, 'format': 'tar', 'members': names[:200]}, sort_keys=True))
              except tarfile.TarError:
                  pass
              try:
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      names = archive.namelist()
                  print(json.dumps({'layer': name, 'format': 'zip', 'members': names[:200]}, sort_keys=True))
              except zipfile.BadZipFile:
                  pass
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              structural = [
                  line for line in text.splitlines()
                  if line.startswith(('diff --git ', '--- ', '+++ ', 'index ', '{', '[', 'version ', 'tree '))
              ]
              print(json.dumps({
                  'layer': name,
                  'format': 'utf-8',
                  'line_count': len(text.splitlines()),
                  'structural_lines': structural[:100],
              }, sort_keys=True))
          PY
          exit 1
