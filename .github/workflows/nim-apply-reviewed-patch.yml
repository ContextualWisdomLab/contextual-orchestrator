name: Verify reviewed NIM benchmark integration

on:
  push:
    branches:
      - claude/nim-all-models-support-fecb0b
    paths:
      - .github/workflows/nim-apply-reviewed-patch.yml

permissions:
  contents: read

concurrency:
  group: nim-reviewed-patch-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apply-verify-export:
    if: >-
      github.repository == 'ContextualWisdomLab/contextual-orchestrator' &&
      github.ref == 'refs/heads/claude/nim-all-models-support-fecb0b'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_PARENT_SHA: a93ec2013652ddaec4ae8a6f7feb48205785846d
      EXPECTED_BASE_SHA: b9163f4e088318b3a9d4498868639993845567f5
      EXPECTED_DIRECT_PATCH_SHA256: fc16a96000e3a0ff88f3f27d52a14c1e73876989d2e918c9cd286aa459c7db76
      EXPECTED_FINAL_PATCH_SHA256: 3f5313cf905042b049af8a22fa10a6db6f883959d592727352101343014e5322
      EXPECTED_FINAL_TREE_SHA: 8dc5da1f8ea8194631cf41628e1231f41c08fe4c
      FINAL_SOURCE_DIR: /tmp/nim-final-worktree
      TARGET_BRANCH: claude/nim-all-models-support-fecb0b
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact pushed head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind execution to the reviewed staging parent and security base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Reconstruct the exact reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          direct_patch="$RUNNER_TEMP/nim-direct.patch"
          final_patch_gzip="$RUNNER_TEMP/nim-final.patch.gz"
          final_patch="$RUNNER_TEMP/nim-final.patch"

          python - "$direct_patch" <<'PY'
          import base64
          import lzma
          from pathlib import Path
          import sys

          chunks = sorted(Path('.review-evidence/nim-direct-integration').glob('chunk-*.b85'))
          assert chunks, 'direct-integration chunks are missing'
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          Path(sys.argv[1]).write_bytes(lzma.decompress(base64.b85decode(encoded.encode('ascii'))))
          PY
          printf '%s  %s\n' "$EXPECTED_DIRECT_PATCH_SHA256" "$direct_patch" | sha256sum -c -

          cat .review-evidence/nim-final-patch/part-*.txt \
            | tr -d '\n\r' \
            | base64 --decode > "$final_patch_gzip"
          gzip -dc "$final_patch_gzip" > "$final_patch"
          printf '%s  %s\n' "$EXPECTED_FINAL_PATCH_SHA256" "$final_patch" | sha256sum -c -

          matched_base_sha=""
          git worktree prune
          for candidate_sha in $(git rev-list --first-parent --max-count=200 HEAD); do
            rm -rf "$FINAL_SOURCE_DIR"
            git worktree add --detach --quiet "$FINAL_SOURCE_DIR" "$candidate_sha"
            if (
              cd "$FINAL_SOURCE_DIR"
              git apply --check "$direct_patch" 2>/dev/null
              git apply --index "$direct_patch"
              git diff --cached --check
              git apply --check "$final_patch" 2>/dev/null
              git apply --index "$final_patch"
              git diff --cached --check
              test "$(git write-tree)" = "$EXPECTED_FINAL_TREE_SHA"
            ); then
              matched_base_sha="$candidate_sha"
              break
            fi
            git worktree remove --force "$FINAL_SOURCE_DIR"
          done
          test -n "$matched_base_sha"
          printf 'matched reviewed patch base: %s\n' "$matched_base_sha"
          cd "$FINAL_SOURCE_DIR"
          test "$(git write-tree)" = "$EXPECTED_FINAL_TREE_SHA"

      - name: Install hash-locked verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$FINAL_SOURCE_DIR"
          python -m pip install --require-hashes -r fuzz/requirements-property.txt
          python -m pip install --require-hashes -r requirements-opencode-review-ci.txt

      - name: Verify full behavior and exact quality gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$FINAL_SOURCE_DIR"
          python -m compileall -q contextual_orchestrator tests
          python -m pytest -q
          python -m coverage erase
          python -m coverage run --branch \
            --source=contextual_orchestrator.nim_benchmark \
            -m pytest \
            tests/test_nim_benchmark.py \
            tests/test_nim_benchmark_release_acceptance.py \
            tests/test_nim_benchmark_workflow_contract.py \
            -q
          python -m coverage report \
            --include=contextual_orchestrator/nim_benchmark.py \
            --show-missing \
            --fail-under=100
          python -m interrogate -f 100 contextual_orchestrator/nim_benchmark.py
          ! grep -R -n 'urllib.request.urlopen' contextual_orchestrator/nim_benchmark.py
          test ! -e contextual_orchestrator/nim_benchmark_hardening.py
          test ! -e tests/test_nim_benchmark_hardening.py
          test ! -e .review-evidence/nim-source-repair.yml
          test ! -e .review-evidence/nim-direct-integration
          test ! -e .review-evidence/nim-final-patch
          test ! -e .github/workflows/nim-apply-reviewed-patch.yml
          git diff --cached --check

      - name: Build, install, and import the wheel in isolation
        shell: bash
        run: |
          set -euo pipefail
          cd "$FINAL_SOURCE_DIR"
          rm -rf dist "$RUNNER_TEMP/nim-wheel-site"
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
          python -m pip install --no-deps \
            --target "$RUNNER_TEMP/nim-wheel-site" \
            dist/contextual_orchestrator-*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/nim-wheel-site" \
            python -c "import contextual_orchestrator; import contextual_orchestrator.nim_benchmark"

      - name: Prove and export the exact final tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$FINAL_SOURCE_DIR"
          rm -rf dist build .coverage htmlcov contextual_orchestrator.egg-info
          git add -A
          git diff --cached --check
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$EXPECTED_FINAL_TREE_SHA"
          export_dir="$RUNNER_TEMP/nim-final-source"
          rm -rf "$export_dir"
          mkdir -p "$export_dir"
          git checkout-index --all --prefix="$export_dir/"
          tar -C "$export_dir" -czf "$RUNNER_TEMP/nim-final-source.tar.gz" .
          printf '%s\n' "$actual_tree" > "$RUNNER_TEMP/nim-final-tree-sha.txt"
          sha256sum "$RUNNER_TEMP/nim-final-source.tar.gz" \
            > "$RUNNER_TEMP/nim-final-source.tar.gz.sha256"

      - name: Upload exact verified source tree
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: nim-final-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nim-final-source.tar.gz
            ${{ runner.temp }}/nim-final-source.tar.gz.sha256
            ${{ runner.temp }}/nim-final-tree-sha.txt
          if-no-files-found: error
          retention-days: 1
