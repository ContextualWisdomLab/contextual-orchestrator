name: Repair PR 96 loopback HTTP boundary v2

on:
  push:
    branches:
      - fix/atheris-interpreter-lock
    paths:
      - .github/workflows/repair-pr96-loopback-http-v2.yml

permissions:
  contents: read

concurrency:
  group: repair-pr96-loopback-http-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify audited repair parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "549c4741df39977dec6ff96d9fa48d6ca4a96d4d"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install hash-locked test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r fuzz/requirements-property.txt

      - name: Add focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          python .github/repair_pr96_loopback_http_v2.py add-tests
          git diff --check

      - name: Prove the security regression is red
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_provider_address_pinning.py -k 'literal_loopback or non_loopback_http or url_userinfo or loopback_http'
          status=$?
          set -e
          test "$status" -ne 0

      - name: Apply bounded production repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/repair_pr96_loopback_http_v2.py apply-production
          git diff --check

      - name: Verify focused and full quality evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_provider_address_pinning.py tests/test_provider_integration.py
          python -m pytest -q
          python -m compileall -q contextual_orchestrator tests
          git diff --check

      - name: Publish exact repair and remove one-shot files
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_BRANCH: fix/atheris-interpreter-lock
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rm .github/workflows/repair-pr96-loopback-http.yml
          rm .github/workflows/repair-pr96-loopback-http-v2.yml
          rm .github/repair_pr96_loopback_http_v2.py
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            .github/repair_pr96_loopback_http_v2.py \
            .github/workflows/repair-pr96-loopback-http-v2.yml \
            .github/workflows/repair-pr96-loopback-http.yml \
            CHANGELOG.md \
            contextual_orchestrator/orchestrator.py \
            tests/test_provider_address_pinning.py | sort)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(security): restrict plain HTTP providers to loopback"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${EXPECTED_HEAD}" \
            "$remote_url" "HEAD:refs/heads/${SOURCE_BRANCH}"
