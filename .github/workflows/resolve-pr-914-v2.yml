name: Resolve PR 914 v2 against protected main

on:
  push:
    branches: [fix/chat-stream-usage-compat]

permissions:
  contents: write

concurrency:
  group: resolve-pr-914-v2
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge protected main with semantic conflict handling
        env:
          EXPECTED_BRANCH: fix/chat-stream-usage-compat
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Protected main is already an ancestor of this head."
            exit 0
          fi

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e
          if [[ $merge_rc -ne 0 ]] && [[ -z "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Merge failed without a resolvable conflict inventory."
            git merge --abort || true
            exit 1
          fi

          python scripts/resolve_pr_914.py
          test -z "$(git diff --name-only --diff-filter=U)"
          git add -A
          git diff --cached --check
          python -m compileall -q contextual_orchestrator tests scripts/resolve_pr_914.py
          git commit -m "chore: merge protected main into PR #914"
          git push origin "HEAD:$EXPECTED_BRANCH"
