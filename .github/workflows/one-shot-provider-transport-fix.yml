name: One-shot provider transport integration

on:
  push:
    branches: [fix/atheris-interpreter-lock]
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: one-shot-provider-transport-integration
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    if: github.repository == 'ContextualWisdomLab/contextual-orchestrator'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/atheris-interpreter-lock
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'

      - name: Apply exact reviewed source transforms
        run: python .github/scripts/one_shot_provider_transport_fix.py

      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r fuzz/requirements-property.txt

      - name: Verify full suite and source syntax
        run: |
          python -m pytest -q
          python -m compileall -q contextual_orchestrator tests
          git diff --check

      - name: Remove one-shot automation and publish verified source
        env:
          BRANCH_NAME: fix/atheris-interpreter-lock
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-provider-transport-fix.yml
          rm .github/scripts/one_shot_provider_transport_fix.py
          git add --all
          if git diff --cached --quiet; then
            echo '::error::Expected reviewed provider transport changes were not produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): make provider pinning import-safe'
          git push origin "HEAD:${BRANCH_NAME}"
