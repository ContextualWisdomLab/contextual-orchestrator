name: Resolve PR 914 semantically against protected main

on:
  push:
    branches: [fix/chat-stream-usage-compat]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: resolve-pr-914-semantic
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main and preserve provider-reported usage semantics
        env:
          EXPECTED_BRANCH: fix/chat-stream-usage-compat
          CALLER_FILE: .github/workflows/resolve-pr-914.yml
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e
          if [[ $merge_rc -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            unsafe=()
            for path in "${conflicts[@]}"; do
              case "$path" in
                *.md|*.mdx)
                  tmpdir="$(mktemp -d)"
                  git show ":2:$path" > "$tmpdir/ours"
                  git show ":1:$path" > "$tmpdir/base"
                  git show ":3:$path" > "$tmpdir/theirs"
                  git merge-file --union "$tmpdir/ours" "$tmpdir/base" "$tmpdir/theirs"
                  cp "$tmpdir/ours" "$path"
                  rm -rf "$tmpdir"
                  git add "$path"
                  ;;
                contextual_orchestrator/orchestrator.py|contextual_orchestrator/server.py|tests/test_chat_stream_options_http_honesty.py)
                  git checkout origin/main -- "$path"
                  ;;
                *) unsafe+=("$path") ;;
              esac
            done
            if (( ${#unsafe[@]} )); then
              printf 'Unexpected conflicts:\n%s\n' "${unsafe[*]}"
              git merge --abort
              exit 1
            fi
          fi

          # Start documentation/tests with the protected-main versions, then apply
          # the PR's narrower provider-reported usage contract deterministically.
          git checkout origin/main -- README.md tests/test_stream_options_null_flags_noop_http_honesty.py

          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)


          # ModelClient: clear stale usage before validation, request provider usage,
          # accept only well-shaped choices, and retain any reported usage dictionary.
          path = Path("contextual_orchestrator/orchestrator.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''        if type(include_usage) is not bool:\n            raise TypeError("include_usage must be a boolean")\n        if not is_chat_compatible_model_id(agent.model):\n''',
              '''        if type(include_usage) is not bool:\n            raise TypeError("include_usage must be a boolean")\n        self._local.usage = None\n        if not is_chat_compatible_model_id(agent.model):\n''',
              "stream_chat stale-usage reset",
          )
          text = replace_once(
              text,
              '''            )\n        self._local.usage = None\n        if agent.base_url.startswith("mock://"):\n''',
              '''            )\n        if agent.base_url.startswith("mock://"):\n''',
              "stream_chat duplicate reset",
          )
          text = replace_once(
              text,
              '''                    usage = chunk.get("usage")\n                    if isinstance(usage, dict):\n                        self._local.usage = usage\n                    choices = chunk.get("choices") or [{}]\n                    delta = (choices[0] or {}).get("delta", {}).get("content")\n''',
              '''                    choices = chunk.get("choices")\n                    usage = chunk.get("usage")\n                    if isinstance(usage, dict):\n                        self._local.usage = usage\n                    if choices == []:\n                        continue\n                    if not isinstance(choices, list) or not choices:\n                        continue\n                    delta = (choices[0] or {}).get("delta", {}).get("content")\n''',
              "provider SSE usage parser",
          )

          chunks_start = text.index("def chat_completion_chunks(")
          chunks_end = text.index("def _new_chat_completion_id()", chunks_start)
          chunks_function = '''def chat_completion_chunks(\n    result: dict[str, Any],\n    model: str = "contextual-orchestrator",\n    include_trace: bool = False,\n    include_usage: bool = False,\n) -> list[dict[str, Any]]:\n    """Frame an orchestration result as OpenAI-compatible ``chat.completion.chunk`` deltas.\n\n    The engine produces the full answer before framing, so this yields a correct-shape\n    SSE stream (role delta, content deltas, terminal stop delta) rather than true\n    token-by-token streaming — real token streaming requires a streaming ModelClient.\n    """\n    answer = result.get("answer", "")\n    completion_id = _new_chat_completion_id()\n    created = int(time.time())\n    base = {"id": completion_id, "object": "chat.completion.chunk", "created": created, "model": model}\n    if include_usage:\n        base["usage"] = None\n\n    chunks: list[dict[str, Any]] = [\n        {**base, "choices": [{"index": 0, "delta": {"role": "assistant"}, "finish_reason": None}]}\n    ]\n    for start in range(0, len(answer), _STREAM_CHUNK_SIZE):\n        piece = answer[start : start + _STREAM_CHUNK_SIZE]\n        chunks.append({**base, "choices": [{"index": 0, "delta": {"content": piece}, "finish_reason": None}]})\n\n    orchestration = {\n        "workflow_run_id": result.get("workflow_run_id"),\n        "mode": result.get("mode"),\n        "verification": result.get("verification"),\n    }\n    if include_trace and "trace" in result:\n        orchestration["trace"] = redact_value(result["trace"])\n    usage = result.get("usage")\n    cost = result.get("cost")\n    usage_chunk = None\n    if (\n        include_usage\n        and isinstance(cost, dict)\n        and cost.get("measurement_status") == "measured"\n        and isinstance(usage, dict)\n    ):\n        usage_chunk = {**base, "choices": [], "usage": usage}\n    final = {**base, "choices": [{"index": 0, "delta": {}, "finish_reason": "stop"}]}\n    final["orchestration"] = {key: value for key, value in orchestration.items() if value is not None}\n    chunks.append(final)\n    if usage_chunk is not None:\n        chunks.append(usage_chunk)\n    return chunks\n\n\n'''
          text = text[:chunks_start] + chunks_function + text[chunks_end:]
          path.write_text(text, encoding="utf-8")

          # HTTP gateway: structured passthrough cannot honestly produce this usage
          # contract; live route streams use the current callback/trace path but emit
          # only raw provider-reported usage, never a gateway estimate.
          path = Path("contextual_orchestrator/server.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''                    if body.get("response_format") or tools_list:\n                        if explicit_trace:\n''',
              '''                    if body.get("response_format") or tools_list:\n                        if stream and include_usage:\n                            raise RequestError(\n                                400,\n                                "invalid_stream_options",\n                                "stream_options.include_usage=true is not supported with tools or response_format",\n                            )\n                        if explicit_trace:\n''',
              "structured stream usage gate",
          )
          method_start = text.index("        def _stream_route_completion(")
          method_end = text.index("        def _send_security_headers", method_start)
          method = '''        def _stream_route_completion(\n            self,\n            orchestrator: Any,\n            security: Any,\n            messages: Any,\n            model_name: str,\n            *,\n            include_usage: bool = False,\n        ) -> None:\n            """Pipe a worker's live deltas out as OpenAI chat.completion.chunk SSE frames."""\n            run_id = f"run_{uuid.uuid4().hex}"\n            completion_id = _new_chat_completion_id()\n            created = int(time.time())\n            stream_usage: dict[str, Any] | None = None\n\n            def capture_usage(usage: dict[str, Any] | None) -> None:\n                nonlocal stream_usage\n                stream_usage = usage\n\n            def frame(delta: dict[str, Any], finish: str | None = None) -> str:\n                payload = {\n                    "id": completion_id,\n                    "object": "chat.completion.chunk",\n                    "created": created,\n                    "model": model_name,\n                    "choices": [{"index": 0, "delta": delta, "finish_reason": finish}],\n                }\n                if include_usage:\n                    payload["usage"] = None\n                return f"data: {json.dumps(payload, ensure_ascii=False)}\\n\\n"\n\n            def usage_frame(usage: dict[str, Any]) -> str:\n                payload = {\n                    "id": completion_id,\n                    "object": "chat.completion.chunk",\n                    "created": created,\n                    "model": model_name,\n                    "choices": [],\n                    "usage": usage,\n                }\n                return f"data: {json.dumps(payload, ensure_ascii=False)}\\n\\n"\n\n            security.acquire_run_slot()\n            try:\n                if not self._begin_sse() or not self._write_sse(frame({"role": "assistant"})):\n                    return\n                try:\n                    stream_kwargs: dict[str, Any] = {\n                        "workflow_run_id": run_id,\n                        "model_name": model_name,\n                    }\n                    if include_usage:\n                        stream_kwargs.update(\n                            {"include_usage": True, "usage_callback": capture_usage}\n                        )\n                    for delta in orchestrator.stream_route(messages, **stream_kwargs):\n                        if not self._write_sse(frame({"content": delta})):\n                            return\n                    if not self._write_sse(frame({}, finish="stop")):\n                        return\n                    if (\n                        include_usage\n                        and isinstance(stream_usage, dict)\n                        and not self._write_sse(usage_frame(stream_usage))\n                    ):\n                        return\n                except ToolFallbackStoppedError as exc:\n                    detail = {\n                        "request_id": uuid.uuid4().hex,\n                        **_tool_fallback_error_detail(exc),\n                    }\n                    payload = _error_payload(\n                        TOOL_FALLBACK_STOPPED_CODE,\n                        TOOL_FALLBACK_STOPPED_MESSAGE,\n                        detail,\n                    )\n                    if not self._write_sse(\n                        f"data: {json.dumps(payload, ensure_ascii=False)}\\n\\n"\n                    ):\n                        return\n                    if not self._write_sse(frame({}, finish="error")):\n                        return\n                except Exception:  # noqa: BLE001 - headers already sent; surface as a terminal error frame\n                    if not self._write_sse(frame({}, finish="error")):\n                        return\n                self._write_sse("data: [DONE]\\n\\n")\n            finally:\n                security.release_run_slot()\n\n'''
          text = text[:method_start] + method + text[method_end:]
          path.write_text(text, encoding="utf-8")

          # Keep README truth aligned with the actual provider-reported-only boundary.
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old_bullet = '- `/v1/chat/completions` accepts normal chat messages, and `"stream": true` returns an OpenAI-compatible `text/event-stream` of `chat.completion.chunk` deltas terminated by `data: [DONE]`. In **route** mode the worker\'s tokens are streamed live as they arrive from the provider (real token streaming); in **conduct** mode the multi-step answer is produced then framed as deltas (a workflow can\'t honestly token-stream a synthesizer that hasn\'t run yet).\n'
          new_bullet = '- `/v1/chat/completions` accepts normal chat messages, and `"stream": true` returns an OpenAI-compatible `text/event-stream` of `chat.completion.chunk` deltas terminated by `data: [DONE]`. `stream_options.include_usage=true` is accepted for ordinary chat streams and emits a provider-reported usage-only chunk after the terminal stop chunk when usage is available; structured `tools`/`response_format` passthrough rejects that combination before provider execution. In **route** mode the worker\'s tokens are streamed live as they arrive from the provider (real token streaming); in **conduct** mode the multi-step answer is produced then framed as deltas (a workflow can\'t honestly token-stream a synthesizer that hasn\'t run yet).\n'
          text = replace_once(text, old_bullet, new_bullet, "README stream contract")
          path.write_text(text, encoding="utf-8")

          # Reconcile protected-main tests with the stricter no-estimate contract.
          path = Path("tests/test_stream_options_null_flags_noop_http_honesty.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def test_http_chat_accepts_include_usage_true()")
          end = text.index("def test_http_chat_structured_streams_include_usage()", start)
          ordinary_test = '''def test_http_chat_accepts_include_usage_true() -> None:\n    server, thread, port = _server()\n    try:\n        status, content_type, sse = _post_raw(\n            port,\n            "/v1/chat/completions",\n            {\n                "model": "mock-planner",\n                "messages": [{"role": "user", "content": "usage true"}],\n                "stream": True,\n                "stream_options": {"include_usage": True},\n            },\n        )\n        assert status == 200, sse\n        assert content_type.startswith("text/event-stream")\n        frames = [\n            json.loads(frame[len("data: "):])\n            for frame in sse.split("\\n\\n")\n            if frame.startswith("data: ") and frame != "data: [DONE]"\n        ]\n        assert frames\n        assert all(frame.get("usage") is None for frame in frames)\n        assert not any(frame.get("choices") == [] for frame in frames)\n    finally:\n        server.shutdown()\n        thread.join(timeout=5)\n\n\n'''
          text = text[:start] + ordinary_test + text[end:]
          start = text.index("def test_http_chat_structured_streams_include_usage()")
          end = text.index("def test_http_chat_rejects_non_boolean_non_null_flag()", start)
          structured_test = '''def test_http_chat_structured_streams_include_usage() -> None:\n    server, thread, port = _server()\n    try:\n        for structured in (\n            {\n                "tools": [\n                    {\n                        "type": "function",\n                        "function": {\n                            "name": "lookup",\n                            "parameters": {"type": "object", "properties": {}},\n                        },\n                    }\n                ]\n            },\n            {"response_format": {"type": "json_object"}},\n        ):\n            status, _, body = _post_raw(\n                port,\n                "/v1/chat/completions",\n                {\n                    "model": "mock-planner",\n                    "messages": [{"role": "user", "content": "structured usage"}],\n                    "stream": True,\n                    "stream_options": {"include_usage": True},\n                    **structured,\n                },\n            )\n            assert status == 400, (structured, body)\n            assert "invalid_stream_options" in body\n    finally:\n        server.shutdown()\n        thread.join(timeout=5)\n\n\n'''
          text = text[:start] + structured_test + text[end:]
          path.write_text(text, encoding="utf-8")

          # Current stream_route reports usage through a callback after consuming
          # ModelClient.take_usage(); update the narrow test double to that contract.
          path = Path("tests/test_http_response_write_disconnect_safety.py")
          text = path.read_text(encoding="utf-8")
          old_stub = '''        def stream_route(self, messages, workflow_run_id, *, model_name, include_usage=False):\n            del messages, workflow_run_id, model_name\n            assert include_usage is True\n            yield "answer"\n'''
          new_stub = '''        def stream_route(\n            self,\n            messages,\n            workflow_run_id,\n            *,\n            model_name,\n            include_usage=False,\n            usage_callback=None,\n        ):\n            del messages, workflow_run_id, model_name\n            assert include_usage is True\n            yield "answer"\n            assert usage_callback is not None\n            usage_callback({"prompt_tokens": 2, "completion_tokens": 4, "total_tokens": 6})\n'''
          text = replace_once(text, old_stub, new_stub, "stream usage test double")
          path.write_text(text, encoding="utf-8")

          # Protected main introduced compatible tests while the PR was open; align
          # their expected payload with the measured-only, raw-provider contract.
          path = Path("tests/test_streaming.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''            "usage": {"prompt_tokens": 2, "completion_tokens": 3, "total_tokens": 5},\n        },\n        include_usage=True,\n''',
              '''            "usage": {"prompt_tokens": 2, "completion_tokens": 3, "total_tokens": 5},\n            "cost": {"measurement_status": "measured"},\n        },\n        include_usage=True,\n''',
              "unit usage measurement status",
          )
          text = text.replace('''        "total_tokens": 5,\n        "usage_source": "reported",\n''', '''        "total_tokens": 5,\n''', 1)
          text = replace_once(
              text,
              '''        "total_tokens": 10,\n        "usage_source": "reported",\n''',
              '''        "total_tokens": 10,\n''',
              "live stream raw usage",
          )
          path.write_text(text, encoding="utf-8")
          PY

          test -z "$(git diff --name-only --diff-filter=U)"
          rm -f "$CALLER_FILE"
          git add -A
          git diff --cached --check
          python -m compileall -q contextual_orchestrator tests
          git commit -m "chore: merge protected main into PR #914"
          git push origin "HEAD:$EXPECTED_BRANCH"
