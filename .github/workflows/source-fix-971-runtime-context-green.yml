name: TEMP PR971 runtime-context GREEN

on:
  push:
    branches:
      - fix/model-group-timeout-openrouter
    paths:
      - .github/workflows/source-fix-971-runtime-context-green.yml
      - scripts/source_fix_971_runtime_context_green.py

permissions:
  contents: read

concurrency:
  group: temp-pr971-runtime-context-green
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact writer head without persisted mutation credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install declared verification toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Revalidate exact remote head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          local_head="$(git rev-parse HEAD)"
          test -n "$remote_head"
          test "$remote_head" = "$local_head"

      - name: Materialize durable RED regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/source_fix_971_runtime_context_green.py red

      - name: Prove current head is RED for every causal contract
        shell: bash
        run: |
          set -euo pipefail
          for test_name in test_recovered_provider_embedding_restores_persisted_request_context test_provider_embedding_rejects_mixed_zdr_policy_before_provider_io test_default_provider_embedding_execution_has_no_wall_clock_deadline; do
            set +e
            python -m pytest -q "tests/test_batch_job_registry.py::${test_name}"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "::error::${test_name} was already GREEN before the causal repair"
              exit 1
            fi
          done

      - name: Apply causal GREEN owner repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/source_fix_971_runtime_context_green.py green

      - name: Verify focused GREEN contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q contextual_orchestrator
          python -m pytest -q tests/test_batch_job_registry.py tests/test_batch_embeddings.py tests/test_cost_router.py
          git diff --check

      - name: Verify broader repository suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          git diff --check

      - name: Remove completed one-shot repair machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch .github/workflows/source-fix-971-exact-head-review.yml .github/workflows/source-fix-971-runtime-context-green.yml .github/workflows/source-fix-971-default-retry-policy.yml .github/source-fix-971-default-retry-policy.trigger scripts/source_fix_971_default_retry_policy.py scripts/source_fix_971_runtime_context_green.py
          if git ls-files | grep -E '(^|/)(source-fix-971|source_fix_971)'; then
            echo "::error::temporary PR971 repair machinery remains tracked"
            exit 1
          fi
          git diff --check

      - name: Commit and publish with a workflow-starting credential
        shell: bash
        env:
          PRIMARY_PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
          FALLBACK_PUSH_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN }}
        run: |
          set -euo pipefail
          workflow_push_token="${PRIMARY_PUSH_TOKEN:-${FALLBACK_PUSH_TOKEN:-}}"
          if [ -z "$workflow_push_token" ]; then
            echo "::error::No workflow-starting mutation credential is configured; refusing github.token publication."
            exit 1
          fi
          git fetch origin "${GITHUB_REF_NAME}"
          remote_head="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          local_parent="$(git rev-parse HEAD)"
          test "$remote_head" = "$local_parent"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(batch): restore persisted embedding execution policy"
          git remote set-url origin "https://x-access-token:${workflow_push_token}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
