name: One-shot PR 128 review repair

on:
  push:
    branches:
      - feat/kv-provider-host-allowlist

permissions:
  contents: write

concurrency:
  group: one-shot-pr-128-review-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact contributor branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/kv-provider-host-allowlist
          fetch-depth: 0

      - name: Add startup regression and prove RED
        run: |
          set -euo pipefail
          cat > /tmp/pr128-red.patch <<'PATCH'
          diff --git a/tests/test_kv_provider_hosts.py b/tests/test_kv_provider_hosts.py
          index 7d60703..e9cb8e8 100644
          --- a/tests/test_kv_provider_hosts.py
          +++ b/tests/test_kv_provider_hosts.py
          @@ -5,6 +5,7 @@ from __future__ import annotations
           import os
           from pathlib import Path
           import sys
          +from unittest.mock import patch
           
           sys.path.insert(0, str(Path(__file__).resolve().parents[1]))
           
          @@ -48,9 +49,50 @@ def test_validate_provider_uses_kv_allowlist() -> None:
                   set_runtime_config_store(None)
           
           
          +def test_serve_installs_runtime_config_store_from_bootstrap() -> None:
          +    """Install the configured runtime KV before accepting server requests."""
          +    import contextual_orchestrator.__main__ as cli
          +
          +    configured_store = InMemoryConfigStore(
          +        {"provider": {"allowed_hosts": "api.example.com"}}
          +    )
          +    argv = [
          +        "contextual_orchestrator",
          +        "--serve",
          +        "--auth-token",
          +        "test-token",
          +    ]
          +    bootstrap_env = {
          +        "CONTEXTUAL_ORCHESTRATOR_KV_DSN": "postgresql://config.example/db",
          +        "CONTEXTUAL_ORCHESTRATOR_KV_PASSPHRASE": "bootstrap-passphrase",
          +    }
          +    with patch.object(cli.sys, "argv", argv), patch.dict(
          +        cli.os.environ, bootstrap_env, clear=False
          +    ), patch.object(
          +        cli, "get_config_store", return_value=configured_store
          +    ) as get_store, patch.object(
          +        cli, "set_runtime_config_store"
          +    ) as install_store, patch.object(
          +        cli, "load_agents", return_value=[]
          +    ), patch.object(
          +        cli, "ModelClient", return_value=object()
          +    ), patch.object(
          +        cli, "TaskOrchestrator", return_value=object()
          +    ), patch.object(cli, "serve") as serve_server:
          +        cli.main()
          +
          +    get_store.assert_called_once_with(
          +        "postgresql://config.example/db",
          +        fernet_key="bootstrap-passphrase",
          +    )
          +    install_store.assert_called_once_with(configured_store)
          +    serve_server.assert_called_once()
          +
          +
           if __name__ == "__main__":
               test_allowed_hosts_read_from_kv_not_live_env_mutation()
               test_bootstrap_env_seeds_kv_once()
               test_empty_env_bootstrap_locks_out_later_env_injection()
               test_validate_provider_uses_kv_allowlist()
          +    test_serve_installs_runtime_config_store_from_bootstrap()
               print("ok")
          PATCH
          git apply /tmp/pr128-red.patch
          set +e
          python3 -m pytest tests/test_kv_provider_hosts.py -q > /tmp/pr128-red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/pr128-red.log
          if [ "$red_status" -eq 0 ]; then
            echo "::error::Startup regression unexpectedly passed before bootstrap installation."
            exit 1
          fi
          grep -q "get_config_store" /tmp/pr128-red.log

      - name: Apply reviewed production and documentation repair
        run: |
          set -euo pipefail
          cat > /tmp/pr128-green.patch <<'PATCH'
          diff --git a/contextual_orchestrator/__main__.py b/contextual_orchestrator/__main__.py
          index 5ca5ae2..7ccd9ea 100644
          --- a/contextual_orchestrator/__main__.py
          +++ b/contextual_orchestrator/__main__.py
          @@ -8,6 +8,7 @@ import os
           import sys
           
           from .credentials import register_credential
          +from .kv_config import get_config_store, set_runtime_config_store
           from .orchestrator import ModelClient, TaskOrchestrator, load_agents
           from .server import SecurityConfig, serve
           
          @@ -34,6 +35,14 @@ def main() -> None:
                       args.admin_token and args.inference_token
                   ):
                       parser.error("split token mode requires both --admin-token and --inference-token")
          +        set_runtime_config_store(
          +            get_config_store(
          +                os.environ.get("CONTEXTUAL_ORCHESTRATOR_KV_DSN") or None,
          +                fernet_key=(
          +                    os.environ.get("CONTEXTUAL_ORCHESTRATOR_KV_PASSPHRASE") or None
          +                ),
          +            )
          +        )
                   serve(
                       orchestrator,
                       host=args.host,
          diff --git a/contextual_orchestrator/cost_ledger.py b/contextual_orchestrator/cost_ledger.py
          index cf93b6c..d9ea212 100644
          --- a/contextual_orchestrator/cost_ledger.py
          +++ b/contextual_orchestrator/cost_ledger.py
          @@ -587,13 +587,13 @@ class SqlLedgerStore:
                   cur = self._conn.cursor()
                   for order, (name, label, _column) in enumerate(ATTRIBUTION_DIMENSION_CATALOG):
                       cur.execute(  # nosemgrep -- sqlalchemy-execute-raw-query FP: only the DB-API placeholder char is interpolated; the value is bound.
          -                f"SELECT 1 FROM cost_attribution_dimensions WHERE dimension_name = {ph}",  # nosec B608 - ph is a DB-API placeholder.
          +                f"SELECT 1 FROM cost_attribution_dimensions WHERE dimension_name = {ph}",  # noqa: S608  # nosec B608 - ph is a DB-API placeholder.
                           (name,),
                       )
                       if cur.fetchone() is None:
                           cur.execute(  # nosemgrep -- sqlalchemy-execute-raw-query FP: only DB-API placeholder chars are interpolated; values are bound.
                               "INSERT INTO cost_attribution_dimensions "
          -                    f"(dimension_name, dimension_label, dimension_order) VALUES ({ph}, {ph}, {ph})",  # nosec B608 - ph is a DB-API placeholder.
          +                    f"(dimension_name, dimension_label, dimension_order) VALUES ({ph}, {ph}, {ph})",  # noqa: S608  # nosec B608 - ph is a DB-API placeholder.
                               (name, label, order),
                           )
                   self._conn.commit()
          @@ -606,7 +606,7 @@ class SqlLedgerStore:
                   columns = ", ".join(_USAGE_COLUMNS)
                   cur = self._conn.cursor()
                   cur.execute(  # nosemgrep -- sqlalchemy-execute-raw-query FP: columns are the fixed _USAGE_COLUMNS constant; values are bound.
          -            f"INSERT INTO llm_usage_records ({columns}) VALUES ({placeholders})",  # nosec B608 - columns are fixed _USAGE_COLUMNS.
          +            f"INSERT INTO llm_usage_records ({columns}) VALUES ({placeholders})",  # noqa: S608  # nosec B608 - columns are fixed _USAGE_COLUMNS.
                       tuple(row.get(column) for column in _USAGE_COLUMNS),
                   )
                   self._conn.commit()
          @@ -625,5 +625,5 @@ class SqlLedgerStore:
                   where = f" WHERE {' AND '.join(clauses)}" if clauses else ""
                   columns = ", ".join(_USAGE_COLUMNS)
                   cur = self._conn.cursor()
          -        cur.execute(f"SELECT {columns} FROM llm_usage_records{where}", tuple(params))  # nosec B608 - columns and clauses are fixed.  # nosemgrep -- sqlalchemy-execute-raw-query FP: fixed columns and clause templates; all values are bound.
          +        cur.execute(f"SELECT {columns} FROM llm_usage_records{where}", tuple(params))  # noqa: S608  # nosec B608 - columns and clauses are fixed.  # nosemgrep -- sqlalchemy-execute-raw-query FP: fixed columns and clause templates; all values are bound.
                   return [dict(zip(_USAGE_COLUMNS, values)) for values in cur.fetchall()]
          diff --git a/docs/kv-credentials.md b/docs/kv-credentials.md
          index ae30a51..007a07d 100644
          --- a/docs/kv-credentials.md
          +++ b/docs/kv-credentials.md
          @@ -77,18 +77,24 @@ back with `pgp_sym_decrypt(encrypted_value, passphrase)`.
          -## The single allowed env use: bootstrap transport
          +## Allowed environment use: bootstrap transport and one-shot config seeding
           
          -Environment variables are permitted in **exactly one place** — as bootstrap
          -transport to *connect to and unlock the KV itself*, never as the runtime source
          -of a provider key:
          +Environment variables are permitted only during process bootstrap. They may
          +select, connect to, and unlock the KV, or seed the non-secret provider host
          +allowlist exactly once. They are never the request-time source of a provider
          +key or a mutable request-time policy:
           
          -| Variable                                   | Role                                   |
          -| ------------------------------------------ | -------------------------------------- |
          -| `CONTEXTUAL_ORCHESTRATOR_KV_BACKEND`       | backend selector (`memory`/`postgres`) |
          -| `CONTEXTUAL_ORCHESTRATOR_KV_DSN`           | Postgres DSN to reach the registry     |
          -| `CONTEXTUAL_ORCHESTRATOR_KV_PASSPHRASE`    | pgcrypto passphrase to unlock secrets  |
          +| Variable                                           | Bootstrap role |
          +| -------------------------------------------------- | -------------- |
          +| `CONTEXTUAL_ORCHESTRATOR_KV_BACKEND`               | Select the `memory` or `postgres` backend. |
          +| `CONTEXTUAL_ORCHESTRATOR_KV_DSN`                   | Connect to the Postgres registry. |
          +| `CONTEXTUAL_ORCHESTRATOR_KV_PASSPHRASE`            | Unlock encrypted provider credentials. |
          +| `CONTEXTUAL_ORCHESTRATOR_ALLOWED_PROVIDER_HOSTS`   | Seed `provider/allowed_hosts` once when that KV key is initially absent. |
           
          -These open the KV. They are not provider API keys.
          +The first three values select or open the KV. The provider-host value is a
          +one-shot bootstrap input copied into the runtime config store. After store
          +installation and first seeding, the KV value is authoritative and later
          +environment mutations have no effect. None of these values is a provider API
          +key.
           
           ## Bootstrapping a credential
          PATCH
          git apply /tmp/pr128-green.patch

      - name: Verify focused and security behavior
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            tests/test_kv_provider_hosts.py \
            tests/test_security_hardening.py
          python3 -m compileall -q \
            contextual_orchestrator/__main__.py \
            contextual_orchestrator/cost_ledger.py \
            contextual_orchestrator/kv_config.py \
            tests/test_kv_provider_hosts.py
          git diff --check

      - name: Commit verified review repair and remove this one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-pr128-review-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            contextual_orchestrator/__main__.py \
            contextual_orchestrator/cost_ledger.py \
            docs/kv-credentials.md \
            tests/test_kv_provider_hosts.py \
            .github/workflows/one-shot-pr128-review-repair.yml
          git diff --cached --check
          git commit -m "fix(kv): install runtime store before serving"
          git push origin HEAD:feat/kv-provider-host-allowlist
