name: PR 85 stabilization

on:
  push:
    branches:
      - feat/hourly-product-development-loop
    paths:
      - .github/workflows/pr85-stabilize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr85-stabilization
  cancel-in-progress: false

jobs:
  stabilize:
    if: github.repository == 'ContextualWisdomLab/contextual-orchestrator'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1
        with:
          ref: feat/hourly-product-development-loop
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.0.0
        with:
          python-version: '3.12'

      - name: Merge the reviewed security prerequisite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin claude/inkspan-pr-audit-ci-q1u4uj
          git merge --no-ff --no-edit origin/claude/inkspan-pr-audit-ci-q1u4uj

      - name: Preserve exact delegated-prompt contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path(".github/workflows/hourly-product-development.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          replacements = {
              """          requests, the current source, and tests. Identify the single highest-value\n          buyer-visible product, reliability, interoperability, security, evaluation, or\n""": """          requests, the current source, and tests. Identify the single highest-value buyer-visible\n          product, reliability, interoperability, security, evaluation, or\n""",
              """          Maintain 100% production statement and branch coverage and 100% production\n          docstring coverage. Docstrings must let a beginner understand public modules,\n""": """          Maintain 100% production statement and branch coverage and\n          100% production docstring coverage. Docstrings must let a beginner understand public modules,\n""",
          }
          for old, new in replacements.items():
              count = workflow.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one exact prompt contract target, found {count}: {old!r}"
                  )
              workflow = workflow.replace(old, new)
          workflow_path.write_text(workflow, encoding="utf-8")
          PY

      - name: Install hash-locked test tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes \
            -r fuzz/requirements-property.txt

      - name: Verify focused and complete tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_hourly_product_development_workflow.py
          python -m pytest -q
          python -m compileall -q contextual_orchestrator tests

      - name: Verify least privilege and clean diff
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]+(contents|pull-requests):[[:space:]]+write' \
            .github/workflows/hourly-product-development.yml; then
            echo "hourly dispatcher widened repository permissions" >&2
            exit 1
          fi
          git diff --check

      - name: Publish verified stabilization and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr85-stabilize.yml
          git add .github/workflows/hourly-product-development.yml
          git diff --cached --check
          git commit -m "ci: stabilize hourly development governance"
          git push origin HEAD:feat/hourly-product-development-loop
