name: Export PR90 workspace

on:
  push:
    branches:
      - claude/nim-all-models-support-fecb0b
    paths:
      - .github/workflows/export-pr90-workspace.yml

permissions:
  contents: read

concurrency:
  group: export-pr90-workspace
  cancel-in-progress: true

jobs:
  export:
    if: >-
      github.repository == 'ContextualWisdomLab/contextual-orchestrator' &&
      github.ref == 'refs/heads/claude/nim-all-models-support-fecb0b'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Remove Git metadata
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: rm -rf .git

      - name: Upload read-only workspace
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pr90-workspace-${{ github.sha }}
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
