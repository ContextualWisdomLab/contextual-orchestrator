name: Apply verified PR90 complete request plan

on:
  push:
    branches:
      - claude/nim-all-models-support-fecb0b
    paths:
      - .github/workflows/apply-pr90-complete-plan.yml

permissions:
  contents: read

concurrency:
  group: apply-pr90-complete-plan
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact complete-plan patch
    if: >-
      github.repository == 'ContextualWisdomLab/contextual-orchestrator' &&
      github.ref == 'refs/heads/claude/nim-all-models-support-fecb0b'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT_SHA: a06f9c5dffa38c249d032e38cc5b5328a7c77d10
      EXPECTED_PATCH_SHA256: f2a21849dd2600c534907e207872f5e494bc9725fd222abb70dd0c615b03adb8
      EXPECTED_FINAL_TREE_SHA: f3a604c689b65ee36decbea95c272c8db823b62d
      TARGET_BRANCH: claude/nim-all-models-support-fecb0b
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact triggering head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind verification to the reviewed staging parent
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Apply patch and remove one-use control files
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          patch_file="$RUNNER_TEMP/pr90-complete-plan.patch"
          base64 --decode .review-evidence/pr90-complete-plan.patch.gz.b64 \
            | gzip -dc > "$patch_file"
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" "$patch_file" | sha256sum -c -
          git apply --check "$patch_file"
          git apply --index "$patch_file"
          git rm .review-evidence/pr90-complete-plan.patch.gz.b64
          git rm .github/workflows/apply-pr90-complete-plan.yml
          git rm .github/workflows/inspect-pr90-patch.yml
          git diff --cached --check

      - name: Install hash-locked verification dependencies
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pip install --require-hashes -r fuzz/requirements-property.txt
          python -m pip install --require-hashes -r requirements-opencode-review-ci.txt

      - name: Run complete tests and exact quality gates
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m compileall -q contextual_orchestrator tests
          python -m pytest -q
          python -m coverage erase
          python -m coverage run --branch \
            --source=contextual_orchestrator.nim_benchmark \
            -m pytest \
            tests/test_nim_benchmark.py \
            tests/test_nim_benchmark_release_acceptance.py \
            tests/test_nim_benchmark_workflow_contract.py \
            -q
          python -m coverage report \
            --include=contextual_orchestrator/nim_benchmark.py \
            --show-missing \
            --fail-under=100
          python -m interrogate -f 100 contextual_orchestrator/nim_benchmark.py

      - name: Build, install, and import the wheel in isolation
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm -rf dist "$RUNNER_TEMP/pr90-wheel-site"
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps \
            --target "$RUNNER_TEMP/pr90-wheel-site" \
            dist/contextual_orchestrator-*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/pr90-wheel-site" \
            python -c "import contextual_orchestrator; import contextual_orchestrator.nim_benchmark"

      - name: Prove exact final source tree
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf dist build .coverage htmlcov contextual_orchestrator.egg-info
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          git diff --cached --check
          actual_tree="$(git write-tree)"
          echo "actual_final_tree_sha=$actual_tree"
          test "$actual_tree" = "$EXPECTED_FINAL_TREE_SHA"

  publish:
    name: Publish the already verified tree
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_PARENT_SHA: a06f9c5dffa38c249d032e38cc5b5328a7c77d10
      EXPECTED_PATCH_SHA256: f2a21849dd2600c534907e207872f5e494bc9725fd222abb70dd0c615b03adb8
      EXPECTED_FINAL_TREE_SHA: f3a604c689b65ee36decbea95c272c8db823b62d
      TARGET_BRANCH: claude/nim-all-models-support-fecb0b
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the same exact triggering head without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Reproduce only the verified source transformation
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          patch_file="$RUNNER_TEMP/pr90-complete-plan.patch"
          base64 --decode .review-evidence/pr90-complete-plan.patch.gz.b64 \
            | gzip -dc > "$patch_file"
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" "$patch_file" | sha256sum -c -
          git apply --check "$patch_file"
          git apply --index "$patch_file"
          git rm .review-evidence/pr90-complete-plan.patch.gz.b64
          git rm .github/workflows/apply-pr90-complete-plan.yml
          git rm .github/workflows/inspect-pr90-patch.yml
          git diff --cached --check
          actual_tree="$(git write-tree)"
          echo "actual_final_tree_sha=$actual_tree"
          test "$actual_tree" = "$EXPECTED_FINAL_TREE_SHA"

      - name: Commit and update only the exact source branch
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(nim): require a complete catalog benchmark plan"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:refs/heads/$TARGET_BRANCH"
