name: Contextual Orchestrator Hourly Review Repair

on:
  schedule:
    - cron: "07 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contextual-orchestrator-hourly-review-repair
  cancel-in-progress: false

jobs:
  dispatch-central-review-loop:
    name: Dispatch protected central review loop
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-fix-scheduler.yml@main
    with:
      target_repository: ContextualWisdomLab/contextual-orchestrator
      base_branch: main
      max_prs: "1"
      max_dispatches: "1"
      retry_hours: "1"
      resolve_unreviewed_conflicts: true
      autofix_workflow: pr-review-autofix.yml
    secrets: inherit
