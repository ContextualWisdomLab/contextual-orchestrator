name: PR 652 exact-head repair

on:
  push:
    branches:
      - cursor/bc-68943147-0a07-4f7c-8508-3fd49c8a07f0-711e
    paths:
      - .github/workflows/pr652-exact-head-repair.yml

permissions:
  contents: write

concurrency:
  group: pr652-exact-head-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: cursor/bc-68943147-0a07-4f7c-8508-3fd49c8a07f0-711e
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact staged parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4526deadd8b0d48e332f9ea102e3ebfc9453c0dc"
          test "$(git branch --show-current)" = "cursor/bc-68943147-0a07-4f7c-8508-3fd49c8a07f0-711e"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install exact test dependencies
        run: python -m pip install --require-hashes -r fuzz/requirements-property.txt

      - name: Apply narrow GREEN changes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/pr652_apply_green.py.gz.b64 | gzip -d > /tmp/apply_green.py
          echo "86af4f37cadb2d74fa169b79bcb2f287a5def9a2825d15d0765d21fbdc775ca4  /tmp/apply_green.py" | sha256sum -c -
          python /tmp/apply_green.py
          python -m compileall -q contextual_orchestrator tests
          git diff --check

      - name: Verify focused review and Semgrep regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_pr652_review_regressions.py \
            tests/test_pr652_semgrep_regressions.py \
            tests/test_meaning_unit_chunking.py \
            tests/test_embeddings_meaning_units_http_honesty.py \
            tests/test_batch_embeddings.py \
            tests/test_cost_ledger.py \
            tests/test_provider_tls.py \
            tests/test_provider_integration.py \
            tests/test_security_hardening.py \
            tests/test_api_contract.py

      - name: Verify full test suite
        run: python -m pytest -q

      - name: Verify exact Semgrep gate
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            -e SEMGREP_SEND_METRICS=off \
            --entrypoint semgrep \
            semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942 \
            scan --config=p/default --severity=WARNING --severity=ERROR \
            --exclude=.github/workflows \
            --exclude='docs/research/**/standards' \
            --error --metrics=off

      - name: Commit exact-head repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr652-exact-head-repair.yml
          rm .github/pr652_apply_green.py.gz.b64
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "contextual-orchestrator-ci"
          git config user.email "contextual-orchestrator-ci@users.noreply.github.com"
          git commit -m "fix(embeddings): address review and Semgrep root causes"
          git push origin HEAD:cursor/bc-68943147-0a07-4f7c-8508-3fd49c8a07f0-711e
