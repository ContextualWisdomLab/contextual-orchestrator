name: PR 652 exact-head repair

on:
  push:
    branches:
      - cursor/bc-68943147-0a07-4f7c-8508-3fd49c8a07f0-711e
    paths:
      - .github/workflows/pr652-exact-head-repair.yml

permissions:
  contents: write

concurrency:
  group: pr652-exact-head-repair
  cancel-in-progress: false

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore: bootstrap PR 652 exact-head repair' }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: cursor/bc-68943147-0a07-4f7c-8508-3fd49c8a07f0-711e
          fetch-depth: 2
          persist-credentials: true

      - name: Verify bootstrap parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "58320907c1a72b48354623775e404dc0036ef41a"
          test "$(git branch --show-current)" = "cursor/bc-68943147-0a07-4f7c-8508-3fd49c8a07f0-711e"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install exact test dependencies
        run: python -m pip install --require-hashes -r fuzz/requirements-property.txt

      - name: Run RED, apply narrow GREEN, verify, and push
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/pr652-repair.sh
          chmod +x /tmp/pr652-repair.sh
          /tmp/pr652-repair.sh
