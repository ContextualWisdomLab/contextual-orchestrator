name: Hourly Product Development

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Evaluate the gate and prompt without running the agent
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "47 * * * *"

concurrency:
  group: hourly-product-development-${{ github.repository }}
  cancel-in-progress: false

# Default to read-only. The model-bearing job cannot write to GitHub and the
# OpenCode process never receives the NVIDIA credential. A separate broker owns
# the NIM key, and a fresh publication runner receives a short-lived GitHub App
# token only after the model output crosses a bounded, validated patch boundary.
permissions:
  contents: read

jobs:
  develop-product-gap:
    if: github.repository == 'ContextualWisdomLab/contextual-orchestrator'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      pull-requests: read
    outputs:
      candidate_ready: ${{ steps.package.outputs.candidate_ready }}
    env:
      DEFAULT_BRANCH: main
      DRY_RUN: ${{ inputs.dry_run || false }}
      AGENT_BASE_IMAGE: python:3.12-slim@sha256:423ed6ab25b1921a477529254bfeeabf5855151dc2c3141699a1bfc852199fbf
      OPENCODE_VERSION: "1.17.13"
      OPENCODE_SHA256: 157afa289d1a8d9372de0ce19ac726119b937a1f6b201808d46f06e4e59bb348
      OPENCODE_MODEL_CANDIDATES: >-
        nvidia-nim/nvidia/llama-3.3-nemotron-super-49b-v1.5
        nvidia-nim/nvidia/nemotron-3-super-120b-a12b
        nvidia-nim/deepseek-ai/deepseek-v4-pro
      OPENCODE_RUN_TIMEOUT_SECONDS: "2400"
    steps:
      - name: Enforce pull-request-first single-flight gate
        id: gate
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! open_prs="$(
            GH_TOKEN="$REPOSITORY_TOKEN" gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 1 \
              --json number,url
          )"; then
            {
              echo "dispatch=false"
              echo "reason=pull_request_inventory_unavailable"
            } >>"$GITHUB_OUTPUT"
            echo "Pull-request inventory was unavailable; failing closed." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$(jq 'length' <<<"$open_prs")" -gt 0 ]; then
            {
              echo "dispatch=false"
              echo "reason=open_pull_request"
            } >>"$GITHUB_OUTPUT"
            echo "An open pull request exists; central PR governance owns this hour." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            {
              echo "dispatch=false"
              echo "reason=nim_api_key_unavailable"
            } >>"$GITHUB_OUTPUT"
            cat >>"$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Autonomous development is disabled because `NVIDIA_NIM_API_KEY` is not configured.
          Configure the organization secret so the credential broker can reach NVIDIA NIM.
          The OpenCode container never receives the secret, a GitHub token, or an OIDC token.
          SUMMARY
            exit 0
          fi

          {
            echo "dispatch=true"
            echo "reason=ready"
          } >>"$GITHUB_OUTPUT"

      - name: Prepare bounded commercial-quality task
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        run: |
          cat >"$RUNNER_TEMP/contextual-orchestrator-agent-prompt.md" <<'PROMPT'
          Continue product development for ContextualWisdomLab/contextual-orchestrator.

          Start by reading AGENTS.md, README.md, CHANGELOG.md when present,
          docs/architecture.md, docs/product_planning.md, open issues, recent merged pull
          requests, the current source, and tests. Identify the single highest-value buyer-visible
          product, reliability, interoperability, security, evaluation, or operations gap that
          can be completed as exactly one bounded pull request. Do not create a new repository.

          Work test-first: establish a failing regression or executable contract before
          implementation, then make the smallest coherent change that passes it. Preserve
          the standalone Python package and its modular MSA role. Keep integration contracts
          compatible with ContextualWisdomLab/.github, naruon, and other CWL services. New
          database objects, if unavoidable, must use descriptive two-word-or-longer snake_case
          names; snake_case is preferred over CamelCase or PascalCase for database objects.

          Maintain 100% production statement and branch coverage and
          100% production docstring coverage. Docstrings must let a beginner understand public
          modules, classes, functions, methods, properties, inputs, outputs, exceptions, and
          security boundaries without reverse-engineering the implementation. Run focused tests,
          the full suite, coverage, docstring checks, compile checks, package build and installed
          package smoke tests, plus relevant SAST, dependency, secret, and adversarial checks.

          Where behavior is ambiguous, use current authoritative international standards,
          primary technical documentation, and peer-reviewed research. Preserve the published
          distinctions among low-latency routing, bounded deep orchestration, worker isolation,
          verifier roles, and quality/latency tradeoffs instead of claiming paper-level results
          without evidence. Use Figma or Product Design when a real user interface, workflow,
          or interaction contract benefits from it; do not manufacture design work for a
          backend-only increment.

          Treat issue #86 as the evidence contract for NVIDIA evaluation work. When that issue
          is the highest-value reviewable slice, use NVIDIA_NIM_API_KEY only through GitHub
          Secrets, dynamically discover the current hosted catalog with GET /v1/models, probe
          all discovered models under bounded concurrency, and compare eligible single-model,
          route-once, and conduct policies under equal task, call, step, timeout, and adjusted
          token budgets. Keep actual free API cost separate from hypothetical paid cost. Never
          invent prices: use a reviewed versioned price scenario or mark the hypothetical value
          unknown. Record uncertainty, Pareto tradeoffs, provenance, failures, skipped-model
          reasons, and secret-redacted artifacts. Do not hard-code model IDs as the catalog.

          Update CHANGELOG.md and all affected user, architecture, operations, evaluation, and
          security documentation. Follow Semantic Versioning. Change the package version only
          when the resulting integrated state is genuinely release-ready, and prepare release
          notes in the pull request rather than publishing a release from the task.

          Do not merge, publish, release, or bypass reviews. Do not weaken branch protection,
          security gates, coverage gates, independent approval, or exact-head verification.
          Do not modify `.github/`, GitHub workflow policy, or repository protection files from
          this autonomous product run. Leave the working tree holding one bounded increment and
          write PR_MESSAGE.md at the repository root: the title on the first line, then a body
          with reproducible evidence, standards or paper citations where relevant, explicit
          residual risks, and no unrelated refactoring. This workflow packages your working tree
          as exactly one bounded pull request against main. The organization-central review →
          repair → current-head Checks → merge loop owns every subsequent mutation and merge
          decision.
          PROMPT

      - name: Record dry-run decision
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN == 'true'
        shell: bash
        run: |
          {
            echo "Dry run: one isolated product-development agent session would start."
            echo
            cat "$RUNNER_TEMP/contextual-orchestrator-agent-prompt.md"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Check out the default branch without persisted credentials
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Download and verify the pinned OpenCode CLI
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/opencode-linux-x64.tar.gz"
          install_dir="${RUNNER_TEMP}/opencode-bin"
          mkdir -p "$install_dir"
          curl -fsSL \
            -o "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$install_dir"
          chmod 0755 "$install_dir/opencode"
          "$install_dir/opencode" --version

      - name: Build the isolated OpenCode agent image
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/nim-agent-build"
          agent_image="contextual-orchestrator-nim-agent:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$build_dir"
          install -d -m 0700 "$build_dir"
          install -m 0755 "$RUNNER_TEMP/opencode-bin/opencode" "$build_dir/opencode"
          install -m 0644 "$GITHUB_WORKSPACE/fuzz/requirements-property.txt" \
            "$build_dir/requirements-property.txt"

          cat >"$build_dir/Dockerfile" <<EOF
          FROM ${AGENT_BASE_IMAGE}
          ENV DEBIAN_FRONTEND=noninteractive \\
              PIP_DISABLE_PIP_VERSION_CHECK=1 \\
              PYTHONDONTWRITEBYTECODE=1
          RUN apt-get update \\
              && apt-get install -y --no-install-recommends bash ca-certificates git \\
              && rm -rf /var/lib/apt/lists/*
          COPY opencode /usr/local/bin/opencode
          COPY requirements-property.txt /tmp/requirements-property.txt
          RUN chmod 0755 /usr/local/bin/opencode \\
              && python -m pip install --require-hashes -r /tmp/requirements-property.txt \\
              && rm -f /tmp/requirements-property.txt
          WORKDIR /workspace
          EOF

          docker build --pull=false --tag "$agent_image" "$build_dir"

      - name: Configure OpenCode for the local credential broker
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/opencode-agent.json" <<'CONFIG'
          {
            "$schema": "https://opencode.ai/config.json",
            "enabled_providers": ["nvidia-nim"],
            "model": "nvidia-nim/nvidia/llama-3.3-nemotron-super-49b-v1.5",
            "small_model": "nvidia-nim/meta/llama-3.3-70b-instruct",
            "permission": {
              "read": "allow",
              "edit": "allow",
              "write": "allow",
              "glob": "allow",
              "grep": "allow",
              "list": "allow",
              "external_directory": "deny",
              "webfetch": "deny",
              "websearch": "deny",
              "bash": {
                "*": "allow",
                "git push *": "deny",
                "git commit *": "deny",
                "gh *": "deny",
                "docker *": "deny"
              }
            },
            "provider": {
              "nvidia-nim": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM through isolated credential broker",
                "options": {
                  "baseURL": "http://nim-proxy:8001/v1",
                  "apiKey": "brokered-by-local-proxy"
                },
                "models": {
                  "nvidia/llama-3.3-nemotron-super-49b-v1.5": {
                    "name": "NVIDIA Llama 3.3 Nemotron Super 49B v1.5",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "nvidia/nemotron-3-super-120b-a12b": {
                    "name": "NVIDIA Nemotron 3 Super 120B",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "deepseek-ai/deepseek-v4-pro": {
                    "name": "DeepSeek V4 Pro (NIM)",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "meta/llama-3.3-70b-instruct": {
                    "name": "Meta Llama 3.3 70B Instruct (NIM)",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  }
                }
              }
            }
          }
          CONFIG

      - name: Start the credential-isolated NVIDIA NIM broker
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          set -euo pipefail
          broker_script="$RUNNER_TEMP/nim_credential_broker.py"
          broker_container="nim-proxy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          agent_network="nim-agent-internal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          egress_network="nim-broker-egress-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          install -m 0644 \
            "$GITHUB_WORKSPACE/scripts/ci/nim_credential_broker.py" \
            "$broker_script"
          docker network create --internal "$agent_network" >/dev/null
          docker network create "$egress_network" >/dev/null
          docker run --detach \
            --name "$broker_container" \
            --network "$egress_network" \
            --user 65532:65532 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit 64 \
            --memory 256m \
            --cpus 1 \
            --env NVIDIA_API_KEY \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --volume "$broker_script:/broker/nim_credential_broker.py:ro" \
            "$AGENT_BASE_IMAGE" \
            python /broker/nim_credential_broker.py >/dev/null
          docker network connect --alias nim-proxy "$agent_network" "$broker_container"

          ready=false
          for _attempt in $(seq 1 30); do
            if docker run --rm \
              --network "$agent_network" \
              --user 65532:65532 \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit 16 \
              --memory 64m \
              "$AGENT_BASE_IMAGE" \
              python -c "import urllib.request; urllib.request.urlopen('http://nim-proxy:8001/healthz', timeout=2).read()"; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "::error::Credential broker did not become ready."
            docker logs "$broker_container" || true
            exit 1
          fi

      - name: Run the isolated NVIDIA NIM development agent
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          prompt="$(cat "$RUNNER_TEMP/contextual-orchestrator-agent-prompt.md")"
          agent_network="nim-agent-internal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          agent_image="contextual-orchestrator-nim-agent:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          status=1
          model_attempt=0

          for model in $OPENCODE_MODEL_CANDIDATES; do
            model_attempt=$((model_attempt + 1))
            agent_container="nim-agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${model_attempt}"
            echo "::group::isolated opencode $model"
            if timeout --kill-after=30s "${OPENCODE_RUN_TIMEOUT_SECONDS}s" \
              docker run --rm \
                --name "$agent_container" \
                --network "$agent_network" \
                --user "$runner_uid:$runner_gid" \
                --read-only \
                --tmpfs "/tmp:rw,noexec,nosuid,nodev,size=256m,uid=${runner_uid},gid=${runner_gid}" \
                --tmpfs "/home/agent:rw,noexec,nosuid,nodev,size=256m,uid=${runner_uid},gid=${runner_gid},mode=0700" \
                --cap-drop=ALL \
                --security-opt=no-new-privileges \
                --pids-limit 256 \
                --memory 4g \
                --cpus 2 \
                --env HOME=/home/agent \
                --env OPENCODE_CONFIG=/config/opencode.json \
                --env OPENCODE_DISABLE_PROJECT_CONFIG=1 \
                --env OPENCODE_DISABLE_CLAUDE_CODE=1 \
                --env OPENCODE_DISABLE_CLAUDE_CODE_PROMPT=1 \
                --env OPENCODE_DISABLE_CLAUDE_CODE_SKILLS=1 \
                --env OPENCODE_DISABLE_AUTOUPDATE=1 \
                --env OPENCODE_DISABLE_MODELS_FETCH=1 \
                --env OPENCODE_PURE=1 \
                --volume "$GITHUB_WORKSPACE:/workspace:rw" \
                --volume "$GITHUB_WORKSPACE/.git:/workspace/.git:ro" \
                --volume "$RUNNER_TEMP/opencode-agent.json:/config/opencode.json:ro" \
                --workdir /workspace \
                "$agent_image" \
                /usr/local/bin/opencode run "$prompt" --model "$model"; then
              status=0
              echo "::endgroup::"
              echo "Isolated agent session completed with \`$model\`." \
                >>"$GITHUB_STEP_SUMMARY"
              break
            fi
            docker rm --force "$agent_container" >/dev/null 2>&1 || true
            echo "::endgroup::"
            echo "::warning::Model $model failed; discarding partial work and trying the next candidate."
            git -C "$GITHUB_WORKSPACE" reset --hard HEAD
            git -C "$GITHUB_WORKSPACE" clean -fdx
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::Every NVIDIA NIM model candidate failed; no work was proposed."
            exit 1
          fi

      - name: Validate isolated candidate filesystem
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_WORKSPACE" <<'PY'
          import os
          import pathlib
          import stat
          import sys

          root = pathlib.Path(sys.argv[1]).resolve()
          entry_count = 0
          byte_count = 0
          for current, directory_names, file_names in os.walk(root, followlinks=False):
              current_path = pathlib.Path(current)
              if current_path == root and ".git" in directory_names:
                  directory_names.remove(".git")
              for name in [*directory_names, *file_names]:
                  if name == ".git":
                      raise SystemExit("unsupported candidate filesystem entry: nested .git")
                  entry = current_path / name
                  metadata = entry.lstat()
                  mode = metadata.st_mode
                  entry_count += 1
                  if entry_count > 20000:
                      raise SystemExit("candidate filesystem exceeds 20000 entries")
                  if stat.S_ISDIR(mode):
                      continue
                  if stat.S_ISREG(mode):
                      byte_count += metadata.st_size
                      if byte_count > 256 * 1024 * 1024:
                          raise SystemExit("candidate filesystem exceeds 256 MiB")
                      continue
                  raise SystemExit(
                      f"unsupported candidate filesystem entry: {entry.relative_to(root)}"
                  )
          PY
          git -C "$GITHUB_WORKSPACE" status --porcelain

      - name: Remove isolated containers and networks
        if: always() && steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set +e
          broker_container="nim-proxy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          agent_network="nim-agent-internal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          egress_network="nim-broker-egress-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          agent_image="contextual-orchestrator-nim-agent:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm --force "$broker_container" >/dev/null 2>&1
          docker network rm "$agent_network" >/dev/null 2>&1
          docker network rm "$egress_network" >/dev/null 2>&1
          docker image rm "$agent_image" >/dev/null 2>&1
          rm -rf \
            "$RUNNER_TEMP/nim-agent-build" \
            "$RUNNER_TEMP/nim_credential_broker.py" \
            "$RUNNER_TEMP/opencode-agent.json" \
            "$RUNNER_TEMP/opencode-bin" \
            "$RUNNER_TEMP/opencode-linux-x64.tar.gz"
          exit 0

      - name: Package untrusted candidate as a bounded patch
        id: package
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          artifact_dir="$RUNNER_TEMP/autonomous-product-candidate"
          rm -rf "$artifact_dir"
          install -d -m 0700 "$artifact_dir"

          python - "$artifact_dir/pr.json" <<'PY'
          import json
          import pathlib
          import sys

          output_path = pathlib.Path(sys.argv[1])
          message_path = pathlib.Path("PR_MESSAGE.md")
          title = "contextual-orchestrator autonomous product increment"
          body = "Autonomous NVIDIA NIM increment; see the diff and CHANGELOG.md."
          if message_path.exists():
              if not message_path.is_file() or message_path.stat().st_size > 65536:
                  raise SystemExit("PR_MESSAGE.md must be a regular UTF-8 file no larger than 64 KiB")
              text = message_path.read_text(encoding="utf-8")
              lines = text.splitlines()
              if lines:
                  candidate = lines[0].lstrip("#").strip()
                  if candidate:
                      title = candidate
                  body = "\n".join(lines[1:]).strip() or body
              message_path.unlink()

          if not 1 <= len(title) <= 120 or any(ord(char) < 32 for char in title):
              raise SystemExit("PR title must be one printable line of at most 120 characters")
          if len(body.encode("utf-8")) > 65536:
              raise SystemExit("PR body exceeds 64 KiB")
          output_path.write_text(
              json.dumps({"title": title, "body": body}, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

          if [ -z "$(git status --porcelain)" ]; then
            echo "candidate_ready=false" >>"$GITHUB_OUTPUT"
            echo "The agent made no changes; nothing to propose this hour." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git \
            -c core.hooksPath=/dev/null \
            -c core.fsmonitor=false \
            -c diff.external= \
            -c core.attributesFile=/dev/null \
            add -N -- .
          git \
            -c core.hooksPath=/dev/null \
            -c core.fsmonitor=false \
            -c diff.external= \
            -c core.attributesFile=/dev/null \
            --no-pager diff \
            --binary --full-index --no-ext-diff --no-textconv HEAD -- . \
            >"$artifact_dir/candidate.patch"

          if [ ! -s "$artifact_dir/candidate.patch" ]; then
            echo "candidate_ready=false" >>"$GITHUB_OUTPUT"
            echo "The candidate produced no applicable patch." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$(stat -c '%s' "$artifact_dir/candidate.patch")" -gt 5242880 ]; then
            echo "::error::Candidate patch exceeds the 5 MiB publication boundary."
            exit 1
          fi

          echo "candidate_ready=true" >>"$GITHUB_OUTPUT"

      - name: Upload the untrusted candidate boundary
        if: steps.package.outputs.candidate_ready == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: autonomous-product-candidate
          path: ${{ runner.temp }}/autonomous-product-candidate
          if-no-files-found: error
          retention-days: 1

  publish-product-gap:
    needs: develop-product-gap
    if: >-
      needs.develop-product-gap.result == 'success' &&
      needs.develop-product-gap.outputs.candidate_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write
    env:
      DEFAULT_BRANCH: main
    steps:
      - name: Check out a fresh trusted publication workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Download the untrusted candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/autonomous-product-candidate"
          rm -rf "$artifact_dir"
          install -d -m 0700 "$artifact_dir"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name autonomous-product-candidate \
            --dir "$artifact_dir"

      - name: Validate and apply the bounded patch
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          artifact_dir="$RUNNER_TEMP/autonomous-product-candidate"
          patch_file="$artifact_dir/candidate.patch"
          metadata_file="$artifact_dir/pr.json"

          python - "$patch_file" "$metadata_file" "$artifact_dir" <<'PY'
          import json
          import pathlib
          import shlex
          import sys

          patch_path = pathlib.Path(sys.argv[1])
          metadata_path = pathlib.Path(sys.argv[2])
          output_dir = pathlib.Path(sys.argv[3])
          if not patch_path.is_file() or not metadata_path.is_file():
              raise SystemExit("candidate artifact is incomplete")
          if not 1 <= patch_path.stat().st_size <= 5 * 1024 * 1024:
              raise SystemExit("candidate patch is empty or exceeds 5 MiB")

          patch = patch_path.read_text(encoding="utf-8")
          if "\x00" in patch:
              raise SystemExit("candidate patch contains a NUL byte")
          if "new file mode 120000" in patch or "old mode 120000" in patch:
              raise SystemExit("candidate patch may not create or modify symbolic links")
          if "new file mode 160000" in patch or "old mode 160000" in patch:
              raise SystemExit("candidate patch may not create or modify submodules")

          changed_paths = []
          for line in patch.splitlines():
              if not line.startswith("diff --git "):
                  continue
              if '"' in line:
                  raise SystemExit("quoted or ambiguous patch paths are not supported")
              parts = shlex.split(line)
              if len(parts) != 4 or not parts[2].startswith("a/") or not parts[3].startswith("b/"):
                  raise SystemExit("malformed patch path header")
              left = pathlib.PurePosixPath(parts[2][2:])
              right = pathlib.PurePosixPath(parts[3][2:])
              if left != right:
                  raise SystemExit("renames must be proposed in a separately reviewed PR")
              if (
                  left.is_absolute()
                  or ".." in left.parts
                  or not left.parts
                  or ".git" in left.parts
                  or left.parts[0] == ".github"
                  or left.name in {
                      ".gitattributes",
                      ".gitmodules",
                      "opencode.json",
                      "PR_MESSAGE.md",
                  }
              ):
                  raise SystemExit(f"forbidden candidate path: {left}")
              changed_paths.append(str(left))
          if not changed_paths or len(changed_paths) > 200:
              raise SystemExit("candidate must change between 1 and 200 files")

          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          title = metadata.get("title")
          body = metadata.get("body")
          if not isinstance(title, str) or not 1 <= len(title) <= 120:
              raise SystemExit("candidate title is invalid")
          if any(ord(char) < 32 for char in title):
              raise SystemExit("candidate title contains control characters")
          if not isinstance(body, str) or len(body.encode("utf-8")) > 65536:
              raise SystemExit("candidate body is invalid")

          (output_dir / "title.txt").write_text(title, encoding="utf-8")
          (output_dir / "body.md").write_text(body, encoding="utf-8")
          PY

          hooks_dir="$RUNNER_TEMP/empty-git-hooks"
          rm -rf "$hooks_dir"
          install -d -m 0700 "$hooks_dir"
          git apply --check --binary --whitespace=error "$patch_file"
          git -c core.hooksPath="$hooks_dir" apply \
            --index --binary --whitespace=error "$patch_file"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::Validated candidate produced an empty staged diff."
            exit 1
          fi

          echo "title_file=$artifact_dir/title.txt" >>"$GITHUB_OUTPUT"
          echo "body_file=$artifact_dir/body.md" >>"$GITHUB_OUTPUT"
          echo "hooks_dir=$hooks_dir" >>"$GITHUB_OUTPUT"

      - name: Exchange OpenCode app token for autonomous PR publication
        id: publisher_app_token
        shell: bash
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail

          mark_unavailable() {
            echo "available=false" >>"$GITHUB_OUTPUT"
          }

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] ||
            [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "Publication app token exchange unavailable: OIDC request environment is missing."
            mark_unavailable
            exit 0
          fi

          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac

          if ! oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"; then
            echo "Publication app token exchange unavailable: OIDC token request did not complete."
            mark_unavailable
            exit 0
          fi

          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          if [ -z "$oidc_token" ]; then
            echo "Publication app token exchange unavailable: OIDC response was empty."
            mark_unavailable
            exit 0
          fi

          if ! token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"; then
            echo "Publication app token exchange unavailable: app token request did not complete."
            mark_unavailable
            exit 0
          fi

          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          if [ -z "$app_token" ]; then
            echo "Publication app token exchange unavailable: app token response was empty."
            mark_unavailable
            exit 0
          fi

          echo "::add-mask::$app_token"
          {
            echo "available=true"
            echo "token=$app_token"
          } >>"$GITHUB_OUTPUT"

      - name: Fail closed without a workflow-triggering publication token
        if: steps.publisher_app_token.outputs.available != 'true'
        shell: bash
        run: |
          echo "::error::A GitHub App publication token is required so the created PR triggers required checks."
          exit 1

      - name: Commit, push, and open exactly one pull request
        if: steps.publisher_app_token.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher_app_token.outputs.token }}
          TITLE_FILE: ${{ steps.validate.outputs.title_file }}
          BODY_FILE: ${{ steps.validate.outputs.body_file }}
          HOOKS_DIR: ${{ steps.validate.outputs.hooks_dir }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          title="$(cat "$TITLE_FILE")"
          branch="nim-agent/product-dev-${GITHUB_RUN_ID}"
          git config user.name "opencode-agent[bot]"
          git config user.email "219766164+opencode-agent[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git -c core.hooksPath="$HOOKS_DIR" commit -m "$title"
          gh auth setup-git
          git -c core.hooksPath="$HOOKS_DIR" push \
            origin "HEAD:refs/heads/${branch}"
          pr_url="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "$title" \
              --body-file "$BODY_FILE"
          )"
          {
            echo "Opened bounded pull request with the GitHub App: $pr_url"
            echo "Central PR governance owns review, repair, revalidation, and merge."
          } >>"$GITHUB_STEP_SUMMARY"
