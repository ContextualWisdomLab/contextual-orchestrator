name: Hourly Product Development

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Evaluate the gate and prompt without running the agent
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "47 * * * *"

concurrency:
  group: hourly-product-development-${{ github.repository }}
  cancel-in-progress: false

# Default to read-only. The model-bearing job can inspect PRs but cannot write to
# GitHub. A separate fresh-runner job receives the write token only after the
# model output crosses a bounded, validated patch-artifact boundary.
permissions:
  contents: read

jobs:
  develop-product-gap:
    if: github.repository == 'ContextualWisdomLab/contextual-orchestrator'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: read
    outputs:
      candidate_ready: ${{ steps.package.outputs.candidate_ready }}
    env:
      DEFAULT_BRANCH: main
      DRY_RUN: ${{ inputs.dry_run || false }}
      OPENCODE_VERSION: "1.17.13"
      OPENCODE_SHA256: 157afa289d1a8d9372de0ce19ac726119b937a1f6b201808d46f06e4e59bb348
      OPENCODE_MODEL_CANDIDATES: >-
        nvidia-nim/nvidia/llama-3.3-nemotron-super-49b-v1.5
        nvidia-nim/nvidia/nemotron-3-super-120b-a12b
        nvidia-nim/deepseek-ai/deepseek-v4-pro
      OPENCODE_RUN_TIMEOUT_SECONDS: "2400"
    steps:
      - name: Enforce pull-request-first single-flight gate
        id: gate
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! open_prs="$(
            GH_TOKEN="$REPOSITORY_TOKEN" gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 1 \
              --json number,url
          )"; then
            {
              echo "dispatch=false"
              echo "reason=pull_request_inventory_unavailable"
            } >>"$GITHUB_OUTPUT"
            echo "Pull-request inventory was unavailable; failing closed." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$(jq 'length' <<<"$open_prs")" -gt 0 ]; then
            {
              echo "dispatch=false"
              echo "reason=open_pull_request"
            } >>"$GITHUB_OUTPUT"
            echo "An open pull request exists; central PR governance owns this hour." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            {
              echo "dispatch=false"
              echo "reason=nim_api_key_unavailable"
            } >>"$GITHUB_OUTPUT"
            cat >>"$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Autonomous development is disabled because `NVIDIA_NIM_API_KEY` is not configured.
          Configure the organization secret so the isolated OpenCode session can reach
          NVIDIA NIM. No Copilot subscription or user token is required.
          SUMMARY
            exit 0
          fi

          {
            echo "dispatch=true"
            echo "reason=ready"
          } >>"$GITHUB_OUTPUT"

      - name: Prepare bounded commercial-quality task
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        run: |
          cat >"$RUNNER_TEMP/contextual-orchestrator-agent-prompt.md" <<'PROMPT'
          Continue product development for ContextualWisdomLab/contextual-orchestrator.

          Start by reading AGENTS.md, README.md, CHANGELOG.md when present,
          docs/architecture.md, docs/product_planning.md, open issues, recent merged pull
          requests, the current source, and tests. Identify the single highest-value buyer-visible
          product, reliability, interoperability, security, evaluation, or operations gap that
          can be completed as exactly one bounded pull request. Do not create a new repository.

          Work test-first: establish a failing regression or executable contract before
          implementation, then make the smallest coherent change that passes it. Preserve
          the standalone Python package and its modular MSA role. Keep integration contracts
          compatible with ContextualWisdomLab/.github, naruon, and other CWL services. New
          database objects, if unavoidable, must use descriptive two-word-or-longer snake_case
          names; snake_case is preferred over CamelCase or PascalCase for database objects.

          Maintain 100% production statement and branch coverage and
          100% production docstring coverage. Docstrings must let a beginner understand public
          modules, classes, functions, methods, properties, inputs, outputs, exceptions, and
          security boundaries without reverse-engineering the implementation. Run focused tests,
          the full suite, coverage, docstring checks, compile checks, package build and installed
          package smoke tests, plus relevant SAST, dependency, secret, and adversarial checks.

          Where behavior is ambiguous, use current authoritative international standards,
          primary technical documentation, and peer-reviewed research. Preserve the published
          distinctions among low-latency routing, bounded deep orchestration, worker isolation,
          verifier roles, and quality/latency tradeoffs instead of claiming paper-level results
          without evidence. Use Figma or Product Design when a real user interface, workflow,
          or interaction contract benefits from it; do not manufacture design work for a
          backend-only increment.

          Treat issue #86 as the evidence contract for NVIDIA evaluation work. When that issue
          is the highest-value reviewable slice, use NVIDIA_NIM_API_KEY only through GitHub
          Secrets, dynamically discover the current hosted catalog with GET /v1/models, probe
          all discovered models under bounded concurrency, and compare eligible single-model,
          route-once, and conduct policies under equal task, call, step, timeout, and adjusted
          token budgets. Keep actual free API cost separate from hypothetical paid cost. Never
          invent prices: use a reviewed versioned price scenario or mark the hypothetical value
          unknown. Record uncertainty, Pareto tradeoffs, provenance, failures, skipped-model
          reasons, and secret-redacted artifacts. Do not hard-code model IDs as the catalog.

          Update CHANGELOG.md and all affected user, architecture, operations, evaluation, and
          security documentation. Follow Semantic Versioning. Change the package version only
          when the resulting integrated state is genuinely release-ready, and prepare release
          notes in the pull request rather than publishing a release from the task.

          Do not merge, publish, release, or bypass reviews. Do not weaken branch protection,
          security gates, coverage gates, independent approval, or exact-head verification.
          Leave the working tree holding one bounded increment and write PR_MESSAGE.md at the
          repository root: the title on the first line, then a body with reproducible evidence,
          standards or paper citations where relevant, explicit residual risks, and no unrelated
          refactoring. This workflow packages your working tree as exactly one bounded pull
          request against main. The organization-central review → repair → current-head Checks →
          merge loop owns every subsequent mutation and merge decision.
          PROMPT

      - name: Record dry-run decision
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN == 'true'
        shell: bash
        run: |
          {
            echo "Dry run: one bounded product-development agent session would start."
            echo
            cat "$RUNNER_TEMP/contextual-orchestrator-agent-prompt.md"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Check out the default branch without persisted credentials
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Install the pinned OpenCode CLI
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/opencode-linux-x64.tar.gz"
          install_dir="${HOME}/.opencode/bin"
          mkdir -p "$install_dir"
          curl -fsSL \
            -o "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "${RUNNER_TEMP}/opencode" "${install_dir}/opencode"
          "${install_dir}/opencode" --version
          echo "$install_dir" >>"$GITHUB_PATH"

      - name: Configure OpenCode for NVIDIA NIM
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat >"$GITHUB_WORKSPACE/opencode.json" <<'CONFIG'
          {
            "$schema": "https://opencode.ai/config.json",
            "enabled_providers": ["nvidia-nim"],
            "model": "nvidia-nim/nvidia/llama-3.3-nemotron-super-49b-v1.5",
            "small_model": "nvidia-nim/meta/llama-3.3-70b-instruct",
            "provider": {
              "nvidia-nim": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "https://integrate.api.nvidia.com/v1",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nvidia/llama-3.3-nemotron-super-49b-v1.5": {
                    "name": "NVIDIA Llama 3.3 Nemotron Super 49B v1.5",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "nvidia/nemotron-3-super-120b-a12b": {
                    "name": "NVIDIA Nemotron 3 Super 120B",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "deepseek-ai/deepseek-v4-pro": {
                    "name": "DeepSeek V4 Pro (NIM)",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "meta/llama-3.3-70b-instruct": {
                    "name": "Meta Llama 3.3 70B Instruct (NIM)",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  }
                }
              }
            }
          }
          CONFIG
          echo "/opencode.json" >>"$GITHUB_WORKSPACE/.git/info/exclude"

      - name: Run the NVIDIA NIM development agent without GitHub credentials
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          set -euo pipefail

          prompt="$(cat "$RUNNER_TEMP/contextual-orchestrator-agent-prompt.md")"
          status=1
          for model in $OPENCODE_MODEL_CANDIDATES; do
            echo "::group::opencode $model"
            if timeout --kill-after=30s "${OPENCODE_RUN_TIMEOUT_SECONDS}s" \
              env -u GH_TOKEN -u GITHUB_TOKEN -u REPOSITORY_TOKEN \
              -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
              -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STATE \
              -u GITHUB_STEP_SUMMARY \
              opencode run "$prompt" --model "$model"; then
              status=0
              echo "::endgroup::"
              echo "Agent session completed with \`$model\`." >>"$GITHUB_STEP_SUMMARY"
              break
            fi
            echo "::endgroup::"
            echo "::warning::Model $model failed; discarding partial work and trying the next candidate."
            git -C "$GITHUB_WORKSPACE" reset --hard HEAD
            git -C "$GITHUB_WORKSPACE" clean -fd
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::Every NVIDIA NIM model candidate failed; no work was proposed."
            exit 1
          fi

      - name: Package untrusted candidate as a bounded patch
        id: package
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          unset NVIDIA_API_KEY GH_TOKEN GITHUB_TOKEN REPOSITORY_TOKEN
          cd "$GITHUB_WORKSPACE"

          artifact_dir="$RUNNER_TEMP/autonomous-product-candidate"
          rm -rf "$artifact_dir"
          install -d -m 0700 "$artifact_dir"
          rm -f opencode.json

          python - "$artifact_dir/pr.json" <<'PY'
          import json
          import pathlib
          import sys

          output_path = pathlib.Path(sys.argv[1])
          message_path = pathlib.Path("PR_MESSAGE.md")
          title = "contextual-orchestrator autonomous product increment"
          body = "Autonomous NVIDIA NIM increment; see the diff and CHANGELOG.md."
          if message_path.exists():
              if not message_path.is_file() or message_path.stat().st_size > 65536:
                  raise SystemExit("PR_MESSAGE.md must be a regular UTF-8 file no larger than 64 KiB")
              text = message_path.read_text(encoding="utf-8")
              lines = text.splitlines()
              if lines:
                  candidate = lines[0].lstrip("#").strip()
                  if candidate:
                      title = candidate
                  body = "\n".join(lines[1:]).strip() or body
              message_path.unlink()

          if not 1 <= len(title) <= 120 or any(ord(char) < 32 for char in title):
              raise SystemExit("PR title must be one printable line of at most 120 characters")
          if len(body.encode("utf-8")) > 65536:
              raise SystemExit("PR body exceeds 64 KiB")
          output_path.write_text(
              json.dumps({"title": title, "body": body}, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

          if [ -z "$(git status --porcelain)" ]; then
            echo "candidate_ready=false" >>"$GITHUB_OUTPUT"
            echo "The agent made no changes; nothing to propose this hour." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git \
            -c core.hooksPath=/dev/null \
            -c core.fsmonitor=false \
            -c diff.external= \
            -c core.attributesFile=/dev/null \
            add -N -- .
          git \
            -c core.hooksPath=/dev/null \
            -c core.fsmonitor=false \
            -c diff.external= \
            -c core.attributesFile=/dev/null \
            --no-pager diff \
            --binary --full-index --no-ext-diff --no-textconv HEAD -- . \
            >"$artifact_dir/candidate.patch"

          if [ ! -s "$artifact_dir/candidate.patch" ]; then
            echo "candidate_ready=false" >>"$GITHUB_OUTPUT"
            echo "The candidate produced no applicable patch." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$(stat -c '%s' "$artifact_dir/candidate.patch")" -gt 5242880 ]; then
            echo "::error::Candidate patch exceeds the 5 MiB publication boundary."
            exit 1
          fi

          echo "candidate_ready=true" >>"$GITHUB_OUTPUT"

      - name: Upload the untrusted candidate boundary
        if: steps.package.outputs.candidate_ready == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: autonomous-product-candidate
          path: ${{ runner.temp }}/autonomous-product-candidate
          if-no-files-found: error
          retention-days: 1

  publish-product-gap:
    needs: develop-product-gap
    if: >-
      needs.develop-product-gap.result == 'success' &&
      needs.develop-product-gap.outputs.candidate_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      DEFAULT_BRANCH: main
    steps:
      - name: Check out a fresh trusted publication workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Download the untrusted candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/autonomous-product-candidate"
          rm -rf "$artifact_dir"
          install -d -m 0700 "$artifact_dir"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name autonomous-product-candidate \
            --dir "$artifact_dir"

      - name: Validate and apply the bounded patch
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          artifact_dir="$RUNNER_TEMP/autonomous-product-candidate"
          patch_file="$artifact_dir/candidate.patch"
          metadata_file="$artifact_dir/pr.json"

          python - "$patch_file" "$metadata_file" "$artifact_dir" <<'PY'
          import json
          import pathlib
          import shlex
          import sys

          patch_path = pathlib.Path(sys.argv[1])
          metadata_path = pathlib.Path(sys.argv[2])
          output_dir = pathlib.Path(sys.argv[3])
          if not patch_path.is_file() or not metadata_path.is_file():
              raise SystemExit("candidate artifact is incomplete")
          if not 1 <= patch_path.stat().st_size <= 5 * 1024 * 1024:
              raise SystemExit("candidate patch is empty or exceeds 5 MiB")

          patch = patch_path.read_text(encoding="utf-8")
          if "\x00" in patch:
              raise SystemExit("candidate patch contains a NUL byte")
          if "new file mode 120000" in patch or "old mode 120000" in patch:
              raise SystemExit("candidate patch may not create or modify symbolic links")
          if "new file mode 160000" in patch or "old mode 160000" in patch:
              raise SystemExit("candidate patch may not create or modify submodules")

          changed_paths = []
          for line in patch.splitlines():
              if not line.startswith("diff --git "):
                  continue
              if '"' in line:
                  raise SystemExit("quoted or ambiguous patch paths are not supported")
              parts = shlex.split(line)
              if len(parts) != 4 or not parts[2].startswith("a/") or not parts[3].startswith("b/"):
                  raise SystemExit("malformed patch path header")
              left = pathlib.PurePosixPath(parts[2][2:])
              right = pathlib.PurePosixPath(parts[3][2:])
              if left != right:
                  raise SystemExit("renames must be proposed in a separately reviewed PR")
              if (
                  left.is_absolute()
                  or ".." in left.parts
                  or not left.parts
                  or left.parts[0] == ".git"
                  or str(left) in {"opencode.json", "PR_MESSAGE.md", ".gitmodules"}
              ):
                  raise SystemExit(f"forbidden candidate path: {left}")
              changed_paths.append(str(left))
          if not changed_paths or len(changed_paths) > 200:
              raise SystemExit("candidate must change between 1 and 200 files")

          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          title = metadata.get("title")
          body = metadata.get("body")
          if not isinstance(title, str) or not 1 <= len(title) <= 120:
              raise SystemExit("candidate title is invalid")
          if any(ord(char) < 32 for char in title):
              raise SystemExit("candidate title contains control characters")
          if not isinstance(body, str) or len(body.encode("utf-8")) > 65536:
              raise SystemExit("candidate body is invalid")

          (output_dir / "title.txt").write_text(title, encoding="utf-8")
          (output_dir / "body.md").write_text(body, encoding="utf-8")
          PY

          hooks_dir="$RUNNER_TEMP/empty-git-hooks"
          rm -rf "$hooks_dir"
          install -d -m 0700 "$hooks_dir"
          git apply --check --binary --whitespace=error "$patch_file"
          git -c core.hooksPath="$hooks_dir" apply \
            --index --binary --whitespace=error "$patch_file"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::Validated candidate produced an empty staged diff."
            exit 1
          fi

          echo "title_file=$artifact_dir/title.txt" >>"$GITHUB_OUTPUT"
          echo "body_file=$artifact_dir/body.md" >>"$GITHUB_OUTPUT"
          echo "hooks_dir=$hooks_dir" >>"$GITHUB_OUTPUT"

      - name: Commit, push, and open exactly one pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE_FILE: ${{ steps.validate.outputs.title_file }}
          BODY_FILE: ${{ steps.validate.outputs.body_file }}
          HOOKS_DIR: ${{ steps.validate.outputs.hooks_dir }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          title="$(cat "$TITLE_FILE")"
          branch="nim-agent/product-dev-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git -c core.hooksPath="$HOOKS_DIR" commit -m "$title"
          gh auth setup-git
          git -c core.hooksPath="$HOOKS_DIR" push \
            origin "HEAD:refs/heads/${branch}"
          pr_url="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "$title" \
              --body-file "$BODY_FILE"
          )"
          {
            echo "Opened bounded pull request: $pr_url"
            echo "Central PR governance owns review, repair, revalidation, and merge."
          } >>"$GITHUB_STEP_SUMMARY"
