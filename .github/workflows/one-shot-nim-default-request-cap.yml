name: One-shot NIM complete-plan source changes

on:
  push:
    branches:
      - claude/nim-all-models-support-fecb0b
    paths:
      - .github/workflows/one-shot-nim-default-request-cap.yml

permissions:
  contents: read

concurrency:
  group: one-shot-nim-complete-plan-source-v8
  cancel-in-progress: true

jobs:
  test-fix-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/contextual-orchestrator'
      && github.actor == 'seonghobae'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/claude/nim-all-models-support-fecb0b'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact contributor head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Preserve test-first RED evidence
        env:
          EXPECTED_PARENT_SHA: da8ec5f424690fc4865e7eade62fc5444eb48145
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/one-shot-nim-default-request-cap.yml"
          python -m pip install --require-hashes -r fuzz/requirements-property.txt
          set +e
          python -m pytest tests/test_nim_task_manifest_evidence_floor.py -q
          red_status=$?
          set -e
          test "$red_status" -ne 0

      - name: Implement bounded complete-run evidence contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              target.write_text(source.replace(old, new, 1), encoding="utf-8")

          benchmark = Path("contextual_orchestrator/nim_benchmark.py")
          source = benchmark.read_text(encoding="utf-8")
          anchor = "\n\ndef evaluate_policies(\n"
          wrapper = "\n".join([
              "",
              "",
              "def planned_complete_run_requests(",
              "    model_count: int,",
              "    locked_task_count: int,",
              "    max_eval_models: int,",
              ") -> dict[str, int]:",
              '    """Return buyer-facing request counts for a complete benchmark run.',
              "",
              "    This stable planning view translates the internal conservative preflight",
              "    into terminology used by release acceptance, operator documentation, and",
              "    acquisition evidence. Validation remains centralized in",
              "    :func:`plan_complete_request_budget`, so both views fail closed identically.",
              "",
              "    Args:",
              "        model_count: Usable model identifiers discovered from ``/v1/models``.",
              "        locked_task_count: Number of locked evaluation tasks.",
              "        max_eval_models: Maximum workers admitted to policy comparison.",
              "",
              "    Returns:",
              "        Catalog, capability, evaluation, post-catalog, and total request counts.",
              '    """',
              "    plan = plan_complete_request_budget(",
              "        discovered_model_count=model_count,",
              "        max_eval_models=max_eval_models,",
              "        locked_task_count=locked_task_count,",
              "    )",
              "    requests_after_catalog = (",
              '        plan["capability_probe_request_count"]',
              '        + plan["evaluation_reserve_request_count"]',
              "    )",
              "    return {",
              '        "catalog_discovery_requests": plan["catalog_request_count"],',
              '        "capability_probe_requests": plan["capability_probe_request_count"],',
              '        "evaluation_worker_ceiling": plan["planned_worker_count"],',
              '        "evaluation_requests": plan["evaluation_reserve_request_count"],',
              '        "requests_after_catalog": requests_after_catalog,',
              '        "total_requests": plan["total_required_request_count"],',
              "    }",
          ]) + "\n"
          if "def planned_complete_run_requests(" not in source:
              if source.count(anchor) != 1:
                  raise SystemExit("complete-plan wrapper anchor drifted")
              benchmark.write_text(source.replace(anchor, wrapper + anchor, 1), encoding="utf-8")

          replace_once(
              "contextual_orchestrator/nim_benchmark.py",
              "    max_total_requests: int = 500,\n",
              "    max_total_requests: int = 2000,\n",
              "run_benchmark default",
          )
          replace_once(
              "contextual_orchestrator/nim_benchmark.py",
              '    parser.add_argument("--max-total-requests", type=int, default=500)\n',
              '    parser.add_argument("--max-total-requests", type=int, default=2000)\n',
              "CLI default",
          )
          replace_once(
              ".github/workflows/nim-benchmark.yml",
              "        default: 500\n",
              "        default: 2000\n",
              "manual workflow default",
          )

          tests = Path("tests/test_nim_benchmark.py")
          test_source = tests.read_text(encoding="utf-8")
          if test_source.count("max_total_requests=400") != 4:
              raise SystemExit("benchmark request fixture anchors drifted")
          test_source = test_source.replace("max_total_requests=400", "max_total_requests=600")
          if test_source.count('"--max-total-requests", "400"') != 1:
              raise SystemExit("CLI request fixture anchor drifted")
          test_source = test_source.replace(
              '"--max-total-requests", "400"',
              '"--max-total-requests", "600"',
              1,
          )
          if test_source.count("assert len(locked) == 10") != 1:
              raise SystemExit("locked manifest count anchor drifted")
          tests.write_text(
              test_source.replace("assert len(locked) == 10", "assert len(locked) == 30", 1),
              encoding="utf-8",
          )

          release_tests = Path("tests/test_nim_benchmark_release_acceptance.py")
          release_source = release_tests.read_text(encoding="utf-8")
          old_message = "complete benchmark needs 1284 requests but configured cap is 1283"
          if release_source.count(old_message) != 1:
              raise SystemExit("one-short message anchor drifted")
          release_source = release_source.replace(
              old_message,
              "complete benchmark needs 1564 requests but configured cap is 1563",
              1,
          )
          if release_source.count("max_total_requests=1283") != 1:
              raise SystemExit("one-short cap anchor drifted")
          release_tests.write_text(
              release_source.replace("max_total_requests=1283", "max_total_requests=1563", 1),
              encoding="utf-8",
          )

          changelog = Path("CHANGELOG.md")
          changelog_source = changelog.read_text(encoding="utf-8")
          heading = "### Changed\n\n"
          bullet = (
              "- Expose a stable complete-run request planning view and align API, CLI, "
              "manual-workflow, and deterministic test caps with the locked thirty-task "
              "evidence floor, preserving fail-before-probe behavior.\n"
          )
          if bullet not in changelog_source:
              if changelog_source.count(heading) != 1:
                  raise SystemExit("CHANGELOG Changed heading drifted")
              changelog.write_text(
                  changelog_source.replace(heading, heading + bullet, 1),
                  encoding="utf-8",
              )
          PY
          git diff --check

      - name: Verify GREEN contracts and complete repository suite
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest \
            tests/test_nim_task_manifest_evidence_floor.py \
            tests/test_nim_benchmark.py \
            tests/test_nim_benchmark_release_acceptance.py \
            tests/test_nim_benchmark_workflow_contract.py \
            -q
          python -m pytest -q
          python -m compileall -q contextual_orchestrator tests
          git diff --check

      - name: Publish verified non-workflow source changes
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_BRANCH: claude/nim-all-models-support-fecb0b
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)" = "$EXPECTED_HEAD"
          git add \
            CHANGELOG.md \
            contextual_orchestrator/nim_benchmark.py \
            tests/test_nim_benchmark.py \
            tests/test_nim_benchmark_release_acceptance.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(benchmark): align complete-plan source evidence'
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:refs/heads/${HEAD_BRANCH}"
