name: One-shot NIM default request cap

on:
  push:
    branches:
      - claude/nim-all-models-support-fecb0b
    paths:
      - .github/workflows/one-shot-nim-default-request-cap.yml

permissions:
  contents: read

concurrency:
  group: one-shot-nim-default-request-cap
  cancel-in-progress: true

jobs:
  test-fix-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/contextual-orchestrator'
      && github.actor == 'seonghobae'
      && github.ref == 'refs/heads/claude/nim-all-models-support-fecb0b'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact pushed head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate one-file trigger and prove RED acceptance test
        env:
          EXPECTED_PARENT_SHA: bec1129ff6d2a75899333a8e577fefc464818a38
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/one-shot-nim-default-request-cap.yml"
          python -m pip install --require-hashes -r fuzz/requirements-property.txt
          set +e
          python -m pytest tests/test_nim_task_manifest_evidence_floor.py -q
          red_status=$?
          set -e
          test "$red_status" -ne 0

      - name: Align API, CLI, workflow, and dry-run fixture caps
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {source.count(old)}")
              target.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "contextual_orchestrator/nim_benchmark.py",
              "    max_total_requests: int = 500,\n",
              "    max_total_requests: int = 2000,\n",
              "run_benchmark default",
          )
          replace_once(
              "contextual_orchestrator/nim_benchmark.py",
              '    parser.add_argument("--max-total-requests", type=int, default=500)\n',
              '    parser.add_argument("--max-total-requests", type=int, default=2000)\n',
              "CLI default",
          )
          replace_once(
              ".github/workflows/nim-benchmark.yml",
              '        default: 500\n',
              '        default: 2000\n',
              "manual workflow default",
          )
          replace_once(
              "tests/test_nim_benchmark.py",
              "        max_total_requests=400,\n",
              "        max_total_requests=600,\n",
              "dry report request cap",
          )
          changelog = Path("CHANGELOG.md")
          source = changelog.read_text(encoding="utf-8")
          anchor = "### Changed\n\n"
          bullet = (
              "- Align API, CLI, manual-workflow, and deterministic dry-run request "
              "defaults with the thirty-task complete-plan preflight so the bundled "
              "benchmark succeeds without an implicit override.\n"
          )
          if source.count(anchor) != 1:
              raise SystemExit("CHANGELOG Changed heading drifted")
          changelog.write_text(source.replace(anchor, anchor + bullet, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Verify GREEN contracts and full repository suite
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest \
            tests/test_nim_task_manifest_evidence_floor.py \
            tests/test_nim_benchmark.py \
            tests/test_nim_benchmark_release_acceptance.py \
            tests/test_nim_benchmark_workflow_contract.py \
            -q
          python -m pytest -q
          python -m compileall -q contextual_orchestrator tests
          git diff --check

      - name: Remove one-shot workflow and publish verified permanent tree
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_BRANCH: claude/nim-all-models-support-fecb0b
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          rm .github/workflows/one-shot-nim-default-request-cap.yml
          git add --all
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(benchmark): align defaults with complete evidence plan'
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:refs/heads/${HEAD_BRANCH}"
