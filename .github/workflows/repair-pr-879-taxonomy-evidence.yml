name: Repair PR 879 taxonomy evidence

on:
  push:
    branches:
      - fix/provider-error-taxonomy-telemetry

permissions:
  contents: write

concurrency:
  group: repair-pr-879-taxonomy-evidence
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.5"

      - name: Apply, validate, and commit the evidence repair
        env:
          EXPECTED_PARENT: fd828d934ae434e308766bd6003925736ed79986
          BRANCH: fix/provider-error-taxonomy-telemetry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python scripts/ci/repair_pr_879_taxonomy_evidence.py
          rm -f \
            scripts/ci/repair_pr_879_taxonomy_evidence.py \
            .github/workflows/repair-pr-879-taxonomy-evidence.yml
          git add -A
          git diff --cached --check
          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q \
              tests/test_provider_error_taxonomy.py \
              tests/test_provider_error_merge_regressions.py \
              tests/test_chat_include_orchestration_trace_http_honesty.py::test_http_structured_chat_discloses_only_an_authorized_conduct_trace \
              tests/test_chat_include_orchestration_trace_http_honesty.py::test_http_tool_passthrough_rejects_a_trace_it_cannot_return
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve provider taxonomy and batch trace evidence'
          git push origin "HEAD:$BRANCH"
