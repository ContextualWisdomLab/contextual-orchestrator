name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Full unit and contract suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Hash-pinned per OpenSSF Scorecard Pinned-Dependencies. Reuses the
        # property-test lockfile (pytest + hypothesis), which covers the full
        # suite's requirements: the package itself is stdlib-only.
        run: python -m pip install --require-hashes -r fuzz/requirements-property.txt

      - name: Run full test suite
        run: python -m pytest -q

  repair_sampling_isolation:
    name: Repair request-scoped sampling isolation
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/structured-output-orchestration'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout exact contributor head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r fuzz/requirements-property.txt

      - name: Apply and verify the bounded repair without write credentials
        run: python scripts/run_pr_805_sampling_isolation.py

      - name: Publish only after exact-head verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch --no-tags origin fix/structured-output-orchestration
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git show HEAD^:.github/workflows/tests.yml > .github/workflows/tests.yml
          rm scripts/repair_pr_805_sampling_isolation.py
          rm scripts/run_pr_805_sampling_isolation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: isolate request-scoped sampling defaults"
          git push "https://x-access-token:${GH_TOKEN}@github.com/ContextualWisdomLab/contextual-orchestrator.git" HEAD:fix/structured-output-orchestration
