name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Full unit and contract suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Hash-pinned per OpenSSF Scorecard Pinned-Dependencies. Reuses the
        # property-test lockfile (pytest + hypothesis), which covers the full
        # suite's requirements: the package itself is stdlib-only.
        run: python -m pip install --require-hashes -r fuzz/requirements-property.txt

      - name: Run full test suite
        run: python -m pytest -q

  nim_benchmark_quality:
    name: NIM benchmark coverage, docstrings, and package smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install hash-locked quality tools
        run: python -m pip install --require-hashes -r requirements-opencode-review-ci.txt

      - name: Prove complete benchmark coverage and public docstrings
        run: |
          set -euo pipefail
          python -m coverage erase
          python -m coverage run --branch \
            --source=contextual_orchestrator.nim_benchmark,contextual_orchestrator.nim_csv_evidence,contextual_orchestrator.nim_strict_scoring \
            -m pytest \
            tests/test_nim_benchmark.py \
            tests/test_nim_benchmark_budget_view.py \
            tests/test_nim_benchmark_release_acceptance.py \
            tests/test_nim_benchmark_review_regressions.py \
            tests/test_nim_benchmark_workflow_contract.py \
            tests/test_nim_artifact_publication.py \
            tests/test_nim_artifact_publication_edges.py \
            tests/test_nim_csv_evidence.py \
            tests/test_nim_csv_evidence_edges.py \
            tests/test_nim_strict_scorer_validity.py \
            -q
          python -m coverage report \
            --include=contextual_orchestrator/nim_benchmark.py,contextual_orchestrator/nim_csv_evidence.py,contextual_orchestrator/nim_strict_scoring.py \
            --show-missing \
            --fail-under=100
          python -m interrogate -f 100 contextual_orchestrator/nim_benchmark.py
          python -m interrogate -f 100 contextual_orchestrator/nim_csv_evidence.py
          python -m interrogate -f 100 contextual_orchestrator/nim_strict_scoring.py

      - name: Build, install, and import the wheel
        run: |
          set -euo pipefail
          rm -rf dist "$RUNNER_TEMP/nim-wheel-site"
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps \
            --target "$RUNNER_TEMP/nim-wheel-site" \
            dist/contextual_orchestrator-*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/nim-wheel-site" \
            python -c "import contextual_orchestrator; import contextual_orchestrator.nim_benchmark; import contextual_orchestrator.nim_csv_evidence; import contextual_orchestrator.nim_strict_scoring"