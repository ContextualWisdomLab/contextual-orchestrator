name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Full unit and contract suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test and quality dependencies
        # Both inputs are fully hash-locked. The OpenCode-review tool lock adds
        # coverage and interrogate; the property lock supplies Hypothesis for
        # the repository's always-on fuzz/property tests.
        run: >-
          python -m pip install --require-hashes
          -r requirements-opencode-review-ci.txt
          -r fuzz/requirements-property.txt

      - name: Run full test suite
        run: python -m pytest -q

      - name: Enforce exact broker statement and branch coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch \
            --source=scripts.ci.nim_credential_broker \
            -m pytest -q tests/test_nim_credential_broker.py
          python -m coverage report --fail-under=100 \
            --include=scripts/ci/nim_credential_broker.py

      - name: Enforce exact broker docstring coverage
        run: >-
          python -m interrogate -f 100
          scripts/ci/nim_credential_broker.py
