name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Full unit and contract suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Hash-pinned per OpenSSF Scorecard Pinned-Dependencies. Reuses the
        # property-test lockfile (pytest + hypothesis), which covers the full
        # suite's requirements: the package itself is stdlib-only.
        run: python -m pip install --require-hashes -r fuzz/requirements-property.txt

      - name: Run full test suite
        run: python -m pytest -q

  repair_nim_source:
    name: Bounded NIM source integration
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'claude/nim-all-models-support-fecb0b'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact pull-request head without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Execute reviewed source transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          source_workflow = root / ".github" / "workflows" / "nim-source-repair.yml"
          workflow_text = source_workflow.read_text(encoding="utf-8")
          step_marker = "      - name: Integrate transport, budget, and evidence contracts directly\n"
          script_marker = "          python - <<'PY'\n"
          step_start = workflow_text.index(step_marker)
          script_start = workflow_text.index(script_marker, step_start) + len(script_marker)
          script_end = workflow_text.index("\n          PY\n", script_start)
          script_lines = workflow_text[script_start:script_end].splitlines()
          transformation = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script_lines
          )
          exec(
              compile(transformation, str(source_workflow), "exec"),
              {"__name__": "__main__"},
          )

          test_path = root / "tests" / "test_nim_benchmark.py"
          test_text = test_path.read_text(encoding="utf-8")
          stale_assertion = (
              '    assert all(cell["workflow_depth"] == 4 for cell in conduct_cells)'
              '  # template plan under the cap'
          )
          replacement = (
              '    assert all(cell["configured_total_token_budget"] == 256 '
              'for cell in conduct_cells)\n'
              '    assert all(cell["configured_maximum_calls"] == '
              'nb.MAX_WORKFLOW_DEPTH for cell in conduct_cells)'
          )
          if stale_assertion not in test_text:
              raise SystemExit("stale conduct-depth assertion anchor not found")
          test_path.write_text(
              test_text.replace(stale_assertion, replacement, 1),
              encoding="utf-8",
          )

          trigger_path = root / ".github" / "workflows" / "nim-source-repair-trigger.yml"
          trigger_path.unlink()

          tests_workflow_path = root / ".github" / "workflows" / "tests.yml"
          tests_workflow_text = tests_workflow_path.read_text(encoding="utf-8")
          repair_marker = "\n  repair_nim_source:\n"
          if repair_marker not in tests_workflow_text:
              raise SystemExit("temporary repair job marker not found")
          tests_workflow_path.write_text(
              tests_workflow_text.split(repair_marker, 1)[0].rstrip() + "\n",
              encoding="utf-8",
          )
          PY

      - name: Install hash-locked verification dependencies
        run: |
          python -m pip install --require-hashes -r fuzz/requirements-property.txt
          python -m pip install --require-hashes -r requirements-opencode-review-ci.txt

      - name: Verify transformed source and exact quality gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/nim-source-repair.yml
          test ! -e .github/workflows/nim-source-repair-trigger.yml
          test ! -e contextual_orchestrator/nim_benchmark_hardening.py
          test ! -e tests/test_nim_benchmark_hardening.py
          ! grep -n 'urllib.request.urlopen' contextual_orchestrator/nim_benchmark.py
          ! grep -n 'nim_benchmark_hardening' contextual_orchestrator/__init__.py
          grep -F 'https://docs.api.nvidia.com/nim/docs/product' contextual_orchestrator/nim_benchmark.py
          grep -F 'coverage report --fail-under=100' .github/workflows/tests.yml
          grep -F 'interrogate -f 100' .github/workflows/tests.yml
          python -m compileall -q contextual_orchestrator tests
          python -m pytest tests/test_nim_benchmark.py -q
          python -m coverage erase
          python -m coverage run --branch \
            --source=contextual_orchestrator.nim_benchmark \
            -m pytest tests/test_nim_benchmark.py -q
          python -m coverage report --fail-under=100 \
            --include=contextual_orchestrator/nim_benchmark.py
          python -m interrogate -f 100 contextual_orchestrator/nim_benchmark.py
          python -m pytest -q

      - name: Validate bounded changed paths
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_paths < <(git diff --name-only --diff-filter=ACDMRTUXB)
          printf '%s\n' "${changed_paths[@]}"
          for changed_path in "${changed_paths[@]}"; do
            case "$changed_path" in
              .github/workflows/nim-source-repair.yml|\
              .github/workflows/nim-source-repair-trigger.yml|\
              .github/workflows/tests.yml|\
              contextual_orchestrator/__init__.py|\
              contextual_orchestrator/nim_benchmark.py|\
              contextual_orchestrator/nim_benchmark_hardening.py|\
              tests/test_nim_benchmark.py|\
              tests/test_nim_benchmark_hardening.py)
                ;;
              *)
                echo "::error::Unexpected changed path: $changed_path"
                exit 1
                ;;
            esac
          done

      - name: Exchange workflow-triggering GitHub App token
        id: publisher_app_token
        shell: bash
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || \
             [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "available=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="?"
          case "$request_url" in *\?*) separator="&" ;; esac
          oidc_response="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${request_url}${separator}audience=${OIDC_AUDIENCE}")"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          [ -n "$oidc_token" ] || { echo "available=false" >>"$GITHUB_OUTPUT"; exit 0; }
          token_response="$(curl -fsS -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            "${OPENCODE_API_BASE_URL}/exchange_github_app_token")"
          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          [ -n "$app_token" ] || { echo "available=false" >>"$GITHUB_OUTPUT"; exit 0; }
          echo "::add-mask::$app_token"
          {
            echo "available=true"
            echo "token=$app_token"
          } >>"$GITHUB_OUTPUT"

      - name: Fail closed without publication credential
        if: steps.publisher_app_token.outputs.available != 'true'
        run: |
          echo "::error::GitHub App token exchange unavailable; refusing to publish."
          exit 1

      - name: Publish verified source integration
        if: steps.publisher_app_token.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher_app_token.outputs.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git config user.name "opencode-agent[bot]"
          git config user.email "219766164+opencode-agent[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(nim): integrate pinned egress and equal evidence budgets"
          gh auth setup-git
          git push origin HEAD:refs/heads/claude/nim-all-models-support-fecb0b
