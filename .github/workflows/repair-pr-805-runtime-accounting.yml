def test_native_responses_final_synthesis_keeps_the_responses_endpoint() -> None:
    orch = _build()
    response = {
        "id": "resp-final",
        "object": "response",
        "model": "mock-planner",
        "output": [{
            "type": "message",
            "role": "assistant",
            "content": [{"type": "output_text", "text": "native result"}],
        }],
        "usage": {"input_tokens": 5, "output_tokens": 2, "total_tokens": 7},
        "echo": {},
    }
    body = {
        "model": "mock-planner",
        "input": "extract the visible region",
        "text": {"format": {"type": "json_schema", "name": "region", "schema": {"type": "object"}}},
        "instructions": "Use the supplied evidence.",
    }
    with patch.object(orch.client, "proxy_send", return_value=response) as send:
        result = orch.proxy_completion(body, endpoint="responses")

    final_agent, endpoint, forwarded = send.call_args.args
    assert final_agent.model == "mock-planner"
    assert endpoint == "responses"
    assert forwarded["input"] == body["input"]
    assert forwarded["text"] == body["text"]
    assert forwarded["instructions"].startswith(body["instructions"])
    assert "Verified workflow evidence" in forwarded["instructions"]
    assert result["object"] == "response"
    assert result["echo"]["instructions"] == body["instructions"]
    assert result["orchestration"]["workflow_run_id"] in orch._workflow_runs


def test_chat_final_synthesis_preserves_roles_without_midstream_system_injection() -> None:
