          new_method = '''    def _orchestrated_provider_completion(
        self, body: dict[str, Any], *, endpoint: str
    ) -> dict[str, Any]:
        """Conduct, persist, and synthesize one OpenAI-compatible response."""
        response_request = endpoint.strip("/") == "responses"
        chat_body = _responses_to_chat_payload(body) if response_request else dict(body)
        messages = chat_body.get("messages")
        if not isinstance(messages, list) or not messages:
            raise ValueError("structured completion requires non-empty messages")
        task = self._latest_user_text(messages)
        requested_model = body.get("model")
        final_agent = self._requested_agent(requested_model)
        if final_agent is None:
            final_agent = self._select_agent(task, "synthesizer")
        if final_agent.disabled:
            raise RuntimeError(f"requested model {requested_model!r} is disabled")

        workflow = self.conduct(messages, preserve_messages=True, judge=False)
        evidence = "\n\n".join(
            f"Workflow step {row['id']} ({row['role']}):\n{row['output']}"
            for row in workflow["trace"]
        )
        native_responses = response_request and body.get("response_format") is None
        if native_responses:
            upstream = {
                key: value
                for key, value in body.items()
                if key not in self._ORCHESTRATION_ONLY_KEYS and key != "model"
            }
            upstream["model"] = final_agent.model
            upstream["stream"] = False
            private_instruction = (
                "Private synthesis instructions: use the original request and verified "
                "workflow evidence. Return only the requested provider response; do not "
                "mention the workflow or invent evidence.\n\n"
                f"Verified workflow evidence:\n{evidence}"
            )
            original_instruction = _responses_text(body.get("instructions"))
            upstream["instructions"] = (
                f"{original_instruction}\n\n{private_instruction}"
                if original_instruction
                else private_instruction
            )
            final_endpoint = "responses"
        else:
            synthesis_messages = _append_synthesis_context(messages, evidence)
            upstream = {
                key: value
                for key, value in chat_body.items()
                if key not in self._ORCHESTRATION_ONLY_KEYS and key not in {"model", "messages"}
            }
            upstream["model"] = final_agent.model
            upstream["messages"] = synthesis_messages
            upstream["stream"] = False
            if response_request:
                if isinstance(body.get("metadata"), dict):
                    upstream["metadata"] = body["metadata"]
                response_format = body.get("response_format")
                if response_format is None:
                    response_format = _responses_text_format_to_chat_response_format(body.get("text"))
                if response_format is not None:
                    upstream["response_format"] = response_format
            final_endpoint = "chat/completions"

        self._raise_if_spend_budget_exceeded()
        raw = self.client.proxy_send(final_agent, final_endpoint, upstream)
        final_answer = _provider_response_text(raw) or workflow["answer"]
        final_trace = [dict(row) for row in workflow["trace"]]
        final_step_id = max((int(row["id"]) for row in final_trace), default=-1) + 1
        final_row: dict[str, Any] = {
            "id": final_step_id,
            "role": "synthesizer",
            "agent_id": final_agent.id,
            "subtask": "Provider-shaped final synthesis",
            "access": [row["id"] for row in final_trace],
            "output": final_answer,
        }
        usage = raw.get("usage")
        if isinstance(usage, dict):
            final_row["usage"] = usage
        final_trace.append(final_row)
        record = self._persist_provider_workflow(
            messages,
            {
                "mode": "conduct",
                "answer": final_answer,
                "trace": final_trace,
                "verification": workflow.get("verification"),
                "plan_source": workflow.get("plan_source"),
            },
        )
        orchestration = {
            "workflow_run_id": record["workflow_run_id"],
            "mode": "conduct",
            "agent_count": len(final_trace),
            "plan_source": workflow.get("plan_source"),
        }

        if response_request and not native_responses:
            returned = _chat_to_responses_payload(raw, body)
        else:
            returned = dict(raw)
        if response_request and isinstance(returned.get("echo"), dict):
            echo = dict(returned["echo"])
            instructions = _responses_text(body.get("instructions"))
            if instructions:
                echo["instructions"] = instructions
            elif "instructions" in echo:
                del echo["instructions"]
            metadata = body.get("metadata")
            if isinstance(metadata, dict):
                echo["metadata"] = {
                    key: value for key, value in metadata.items() if value is not None
                }
            for key in ("response_format", "text", "tools"):
                if body.get(key) is not None:
                    echo[key] = body[key]
            returned["echo"] = echo
        returned["orchestration"] = orchestration
        return returned

    def _persist_provider_workflow(
        self, messages: list[ChatMessage], result: dict[str, Any]
    ) -> dict[str, Any]:
        """Persist provider-shaped orchestration so lineage and spend are retrievable."""
        record = {
            "workflow_run_id": f"run_{uuid.uuid4().hex}",
            "created_at": int(time.time()),
            "mode": result["mode"],
            "policy_mode": "conduct",
            "prompt_text": self._latest_user_text(messages),
            "answer": result["answer"],
            "trace": result["trace"],
            "policy_snapshot": self.policy.as_dict(),
            "verification": result.get("verification"),
            "plan_source": result.get("plan_source"),
        }
        self._workflow_runs[record["workflow_run_id"]] = record
        self._run_order.appendleft(record["workflow_run_id"])
        if self._store is not None:
            self._store.save("workflow_run", record["workflow_run_id"], record)
        self._append_audit_event(
            "workflow_run_created",
            {
                "workflow_run_id": record["workflow_run_id"],
                "mode": record["mode"],
                "agent_count": len(record["trace"]),
            },
        )
        self.record_analytics_event(
            "workflow_run_created",
            {
                "workflow_run_id": record["workflow_run_id"],
                "run_mode": record["mode"],
                "policy_mode": record["policy_mode"],
                "trace_step_count": len(record["trace"]),
                "trace_complete": self._is_trace_complete(record),
            },
        )
        for step in record["trace"]:
            self.record_analytics_event(
                "workflow_step_completed",
                {
                    "workflow_run_id": record["workflow_run_id"],
                    "run_mode": record["mode"],
                    "step_id": step["id"],
                    "agent_id": step["agent_id"],
                    "role": step["role"],
                    "duration_ms": step.get("latency_ms"),
                },
            )
        return record

'''
