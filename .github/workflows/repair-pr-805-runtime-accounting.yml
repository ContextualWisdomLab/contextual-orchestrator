'''
          helper = '''def _append_synthesis_context(
    messages: list[ChatMessage], evidence: str
) -> list[ChatMessage]:
    """Copy *messages* and bind private synthesis evidence to the latest user turn.

    Updating an existing user turn preserves caller role ordering and tool-call
    adjacency. The private workflow evidence is never exposed as a new system
    message in the provider-facing conversation.
    """

    copied = [dict(message) for message in messages]
    context = (
        "\n\nPrivate synthesis instructions: use the original request and verified "
        "workflow evidence. Return only the requested provider response; do not "
        "mention the workflow or invent evidence.\n\n"
        f"Verified workflow evidence:\n{evidence}"
    )
    for index in range(len(copied) - 1, -1, -1):
        if copied[index].get("role") != "user":
            continue
        content = copied[index].get("content")
        if isinstance(content, str):
            copied[index]["content"] = content + context
            return copied
        if isinstance(content, list):
            copied[index]["content"] = [*content, {"type": "text", "text": context.lstrip()}]
            return copied
        raise ValueError("user message content must be text or a multimodal part list")
    copied.append({"role": "user", "content": context.lstrip()})
    return copied


def _provider_response_text(data: dict[str, Any]) -> str:
    """Extract persisted answer text from Chat or Responses provider shapes."""

    choices = data.get("choices")
    if isinstance(choices, list) and choices:
        message = choices[0].get("message") if isinstance(choices[0], dict) else None
        content = message.get("content") if isinstance(message, dict) else None
        if isinstance(content, str):
            return content
    output = data.get("output")
    if isinstance(output, list):
        parts: list[str] = []
        for item in output:
            if not isinstance(item, dict):
                continue
            content = item.get("content")
            if not isinstance(content, list):
                continue
            for part in content:
                if isinstance(part, dict) and isinstance(part.get("text"), str):
                    parts.append(part["text"])
        return "".join(parts)
    return ""


'''
          if helper not in text:
