name: Repair PR 805 runtime accounting

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/structured-output-orchestration"
    paths:
      - ".github/workflows/repair-pr-805-runtime-accounting.yml"

permissions:
  contents: write

concurrency:
  group: repair-pr-805-runtime-accounting
  cancel-in-progress: false

jobs:
  repair:
    name: Close structured-runtime review findings with red-green evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: fix/structured-output-orchestration
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r fuzz/requirements-property.txt

      - name: Add regressions first and prove RED
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          judge_path = Path("tests/test_model_judge.py")
          judge = judge_path.read_text(encoding="utf-8")
