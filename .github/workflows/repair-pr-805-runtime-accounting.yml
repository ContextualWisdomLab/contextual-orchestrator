            "tools": [{"type": "function", "function": {"name": "lookup", "parameters": {}}}],
        }
    )

    final_messages = result["echo"]["messages"]
    assert [message["role"] for message in final_messages] == ["user"]
    assert final_messages[0]["content"].startswith("call a tool")
    assert "Verified workflow evidence" in final_messages[0]["content"]


