name: Resolve PR 906 semantically against protected main

on:
  push:
    branches: [feat/nim-benchmark-rebuild-20260828]

permissions:
  contents: write

concurrency:
  group: resolve-pr-906-semantic
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main and preserve the NIM quality gate
        env:
          EXPECTED_BRANCH: feat/nim-benchmark-rebuild-20260828
          CALLER_FILE: .github/workflows/resolve-pr-906.yml
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Protected main is already an ancestor of this head."
            exit 0
          fi

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e

          if [[ $merge_rc -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            unexpected=()
            for path in "${conflicts[@]}"; do
              case "$path" in
                .github/workflows/ci.yml)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                .github/workflows/tests.yml)
                  git rm -f --ignore-unmatch -- "$path"
                  ;;
                *.md|*.mdx)
                  tmpdir="$(mktemp -d)"
                  git show ":2:$path" > "$tmpdir/ours"
                  git show ":1:$path" > "$tmpdir/base"
                  git show ":3:$path" > "$tmpdir/theirs"
                  git merge-file --union "$tmpdir/ours" "$tmpdir/base" "$tmpdir/theirs" || true
                  cp "$tmpdir/ours" "$path"
                  rm -rf "$tmpdir"
                  git add "$path"
                  ;;
                *) unexpected+=("$path") ;;
              esac
            done
            if (( ${#unexpected[@]} )); then
              printf 'Unexpected conflicts:\n%s\n' "${unexpected[*]}"
              git merge --abort
              exit 1
            fi
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          rm -f "$CALLER_FILE"
          git add -A
          git diff --cached --check
          python -m compileall -q contextual_orchestrator tests
          git commit -m "chore: merge protected main into PR #906"
          git push origin "HEAD:$EXPECTED_BRANCH"
