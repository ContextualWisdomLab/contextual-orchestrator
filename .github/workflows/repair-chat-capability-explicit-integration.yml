name: Repair chat capability source integration

on:
  push:
    branches:
      - fix/chat-capability-isolation-embedding-models

permissions:
  contents: write

concurrency:
  group: repair-chat-capability-explicit-integration
  cancel-in-progress: false

jobs:
  repair:
    name: Rebase, patch, verify, and self-delete
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: fix/chat-capability-isolation-embedding-models
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rebase work onto current main without publishing an unverified commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main

      - name: Replace import-time monkeypatches with explicit runtime guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          orchestrator_path = Path("contextual_orchestrator/orchestrator.py")
          orchestrator = orchestrator_path.read_text(encoding="utf-8")

          orchestrator = replace_once(
              orchestrator,
              "from .conventions import require_object_name\nfrom .credentials import NotConfigured, get_credential\n",
              "from .chat_capability import is_chat_compatible_model_id\nfrom .conventions import require_object_name\nfrom .credentials import NotConfigured, get_credential\n",
              "chat capability import",
          )

          orchestrator = replace_once(
              orchestrator,
              "        self._local.usage = None\n        # Expose the effective sampling knobs for request-path tests / diagnostics.\n",
              "        if not is_chat_compatible_model_id(agent.model):\n"
              "            raise ValueError(\n"
              "                f\"model {agent.model!r} is not chat-compatible and cannot serve {agent.id!r}\"\n"
              "            )\n"
              "        self._local.usage = None\n"
              "        # Expose the effective sampling knobs for request-path tests / diagnostics.\n",
              "ModelClient.chat guard",
          )

          orchestrator = replace_once(
              orchestrator,
              "        answer in fixed chunks so behavior shape stays testable and unchanged.\n"
              "        \"\"\"\n"
              "        if agent.base_url.startswith(\"mock://\"):\n",
              "        answer in fixed chunks so behavior shape stays testable and unchanged.\n"
              "        \"\"\"\n"
              "        if not is_chat_compatible_model_id(agent.model):\n"
              "            raise ValueError(\n"
              "                f\"model {agent.model!r} is not chat-compatible and cannot serve {agent.id!r}\"\n"
              "            )\n"
              "        if agent.base_url.startswith(\"mock://\"):\n",
              "ModelClient.stream_chat guard",
          )

          orchestrator = replace_once(
              orchestrator,
              "            for agent in self.agents\n        )\n        system = (\n",
              "            for agent in self.agents\n"
              "            if is_chat_compatible_model_id(agent.model)\n"
              "        )\n"
              "        system = (\n",
              "generated planner pool guard",
          )

          orchestrator = replace_once(
              orchestrator,
              "        known_agents = {agent.id for agent in self.agents}\n",
              "        known_agents = {agent.id: agent for agent in self.agents}\n",
              "workflow known-agent map",
          )

          orchestrator = replace_once(
              orchestrator,
              "            agent_id = item.get(\"agent_id\")\n"
              "            if agent_id not in known_agents:\n"
              "                # The planner named an unknown agent: reselect honestly instead of failing the plan.\n"
              "                agent_id = self._select_agent(subtask, role).id\n",
              "            agent_id = item.get(\"agent_id\")\n"
              "            assigned_agent = known_agents.get(agent_id)\n"
              "            if assigned_agent is None or not is_chat_compatible_model_id(assigned_agent.model):\n"
              "                # Unknown or endpoint-incompatible assignments are never trusted.\n"
              "                agent_id = self._select_agent(subtask, role).id\n",
              "generated workflow assignment guard",
          )

          orchestrator = replace_once(
              orchestrator,
              "        lowered = text.lower()\n"
              "        return sorted(self.agents, key=lambda agent: self._score_agent(agent, role, lowered), reverse=True)\n",
              "        lowered = text.lower()\n"
              "        eligible = [\n"
              "            agent\n"
              "            for agent in self.agents\n"
              "            if is_chat_compatible_model_id(agent.model)\n"
              "        ]\n"
              "        return sorted(\n"
              "            eligible,\n"
              "            key=lambda agent: self._score_agent(agent, role, lowered),\n"
              "            reverse=True,\n"
              "        )\n",
              "runtime ranking guard",
          )

          orchestrator = replace_once(
              orchestrator,
              "    def _select_agent(self, text: str, role: str) -> ModelAgent:\n"
              "        selected = self._ranked_agents(text, role)[0]\n",
              "    def _select_agent(self, text: str, role: str) -> ModelAgent:\n"
              "        ranked = self._ranked_agents(text, role)\n"
              "        if not ranked:\n"
              "            raise RuntimeError(f\"no chat-compatible agent available for role={role}\")\n"
              "        selected = ranked[0]\n",
              "runtime selection fail-closed guard",
          )

          orchestrator = replace_once(
              orchestrator,
              "    def _failover_candidates(self, primary: ModelAgent, text: str, role: str) -> list[ModelAgent]:\n"
              "        ranked = self._ranked_agents(text, role)\n"
              "        ordered = [primary] + [agent for agent in ranked if agent.id != primary.id]\n"
              "        eligible = [agent for agent in ordered if not agent.disabled and role not in agent.provider_exclusions]\n"
              "        healthy = [agent for agent in eligible if not self._circuit_open(agent.id)]\n"
              "        # If every eligible agent is circuit-open, still probe them rather than fail with no attempt.\n"
              "        return healthy or eligible or [primary]\n",
              "    def _failover_candidates(self, primary: ModelAgent, text: str, role: str) -> list[ModelAgent]:\n"
              "        ranked = self._ranked_agents(text, role)\n"
              "        primary_candidates = (\n"
              "            [primary] if is_chat_compatible_model_id(primary.model) else []\n"
              "        )\n"
              "        ordered = primary_candidates + [\n"
              "            agent for agent in ranked if agent.id != primary.id\n"
              "        ]\n"
              "        eligible = [agent for agent in ordered if not agent.disabled and role not in agent.provider_exclusions]\n"
              "        healthy = [agent for agent in eligible if not self._circuit_open(agent.id)]\n"
              "        # If every eligible agent is circuit-open, still probe compatible agents.\n"
              "        return healthy or eligible\n",
              "runtime failover guard",
          )

          orchestrator_path.write_text(orchestrator, encoding="utf-8")

          Path("contextual_orchestrator/chat_capability.py").write_text(
              '''"""Dependency-neutral chat endpoint capability classification.

Provider model catalogs are heterogeneous: one registry can contain chat,
embedding, reranking, transcription, moderation, image, audio, and realtime
endpoint families. This module supplies the conservative negative classifier used
by discovery and runtime orchestration without importing either subsystem.
"""

from __future__ import annotations

import re

_MODEL_TOKEN_RE = re.compile(r"[a-z0-9]+")
_NON_CHAT_EXACT_TOKENS = frozenset(
    {
        "audio",
        "bge",
        "e5",
        "embed",
        "embedding",
        "embeddings",
        "guard",
        "gte",
        "image",
        "images",
        "moderation",
        "realtime",
        "rerank",
        "reranker",
        "safety",
        "sora",
        "speech",
        "transcribe",
        "transcription",
        "tts",
        "whisper",
    }
)
_NON_CHAT_TOKEN_PREFIXES = (
    "embed",
    "moderat",
    "rerank",
    "transcrib",
)


def is_chat_compatible_model_id(model_id: str) -> bool:
    """Return whether a model identifier can enter an ordinary chat-agent pool.

    Only identifiers that clearly advertise a non-chat endpoint family are
    rejected. Unknown identifiers stay eligible until authenticated provider
    metadata or a measured endpoint probe establishes a stronger capability.
    """
    if type(model_id) is not str:
        return False
    tokens = tuple(_MODEL_TOKEN_RE.findall(model_id.casefold()))
    if not tokens:
        return False
    for token in tokens:
        if token in _NON_CHAT_EXACT_TOKENS:
            return False
        if token.startswith(_NON_CHAT_TOKEN_PREFIXES):
            return False
    return True
''',
              encoding="utf-8",
          )

          init_path = Path("contextual_orchestrator/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          init_text = replace_once(
              init_text,
              "from .chat_capability import install_runtime_chat_capability_guards\n",
              "",
              "remove runtime installer import",
          )
          init_text = replace_once(
              init_text,
              "\ninstall_runtime_chat_capability_guards(ModelClient, TaskOrchestrator)\n",
              "",
              "remove import-time runtime mutation",
          )
          init_path.write_text(init_text, encoding="utf-8")

          tests_path = Path("tests/test_chat_model_capability_isolation.py")
          tests = tests_path.read_text(encoding="utf-8")
          tests += '''


def test_non_chat_primary_fails_over_only_to_chat_agents() -> None:
    """Drop an incompatible primary while retaining a compatible fallback."""
    embedding_agent = _agent("embedding_agent", "azure/text-embedding-3-large")
    chat_agent = _agent("chat_agent", "gpt-5.2")
    orchestrator = TaskOrchestrator([embedding_agent, chat_agent])

    candidates = orchestrator._failover_candidates(
        embedding_agent,
        "Produce the final answer.",
        "synthesizer",
    )

    assert candidates == [chat_agent]


def test_streaming_client_rejects_non_chat_model_before_transport() -> None:
    """Apply the same endpoint boundary to streaming chat requests."""
    client = ModelClient()
    embedding_agent = _agent("embedding_agent", "azure/text-embedding-3-large")

    with pytest.raises(ValueError, match="chat-compatible"):
        next(
            client.stream_chat(
                embedding_agent,
                [{"role": "user", "content": "Produce the final answer."}],
            )
        )
'''
          tests_path.write_text(tests, encoding="utf-8")
          PY

          rm .github/workflows/repair-chat-capability-explicit-integration.yml

      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r fuzz/requirements-property.txt

      - name: Verify source integration and full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q contextual_orchestrator
          python -m pytest -q tests/test_chat_model_capability_isolation.py
          python -m pytest -q

      - name: Commit verified repair and current main merge
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "fix: integrate chat capability guards explicitly"
          git push origin HEAD:fix/chat-capability-isolation-embedding-models
