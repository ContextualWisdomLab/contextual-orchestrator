name: Repair PR 909 final contracts

on:
  push:
    branches:
      - fix/batch-routing-owner-20260829

permissions:
  contents: write

concurrency:
  group: repair-pr-909-final-contracts
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.5"

      - name: Apply, validate, and commit the final review contracts
        env:
          EXPECTED_PARENT: b87a75ce807593aa501e643a46906cc8a06b2411
          BRANCH: fix/batch-routing-owner-20260829
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python scripts/ci/repair_pr_909_final_contracts.py
          rm -f \
            scripts/ci/repair_pr_909_final_contracts.py \
            .github/workflows/repair-pr-909-final-contracts.yml
          git add -A
          git diff --cached --check
          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q \
              tests/test_cost_router_boundaries.py::test_batch_model_identity_error_does_not_capture_backend_value_errors \
              tests/test_cost_review_server.py::test_batch_routing_rejects_unknown_zdr_model_as_client_error \
              tests/test_cost_router.py::test_zdr_batch_rejects_an_explicit_non_zdr_configured_model \
              tests/test_api_contract.py::test_batch_job_openapi_documents_principal_hiding_404s \
              tests/test_orchestrated_responses_stream.py::test_stream_usage_failure_remains_inside_the_started_sse_protocol
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve final batch and SSE protocol boundaries'
          git push origin "HEAD:$BRANCH"
