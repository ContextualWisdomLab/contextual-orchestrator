name: Apply multimodal cumulative merge

on:
  push:
    branches:
      - feat/multimodal-content-parts-tip-http-honesty-20260816191047
    paths:
      - .github/workflows/diagnose-multimodal-cumulative-merge.yml

concurrency:
  group: apply-multimodal-cumulative-merge
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/multimodal-content-parts-tip-http-honesty-20260816191047
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable starting tree
        shell: bash
        run: |
          set -euo pipefail
          expected_feature=870930a55b1609a4f4d62cf4955a7c926360159a
          git merge-base --is-ancestor "$expected_feature" HEAD
          unexpected="$({ git diff --name-only "$expected_feature"...HEAD || true; } | grep -v '^\.github/workflows/diagnose-multimodal-cumulative-merge\.yml$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected branch changes after reviewed feature:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Merge cumulative base and preserve reviewed multimodal block
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'contextual-orchestrator-maintainer[bot]'
          git config user.email 'contextual-orchestrator-maintainer[bot]@users.noreply.github.com'
          feature_head=870930a55b1609a4f4d62cf4955a7c926360159a
          base_ref=feat/reasoning-effort-none-store-stream-empty-noop-http-honesty-20260814114817
          expected_base=ff21ba7c361d24d887ef2068ae877cc7622d946f
          git fetch origin "$base_ref"
          actual_base="$(git rev-parse "origin/$base_ref")"
          if [ "$actual_base" != "$expected_base" ]; then
            echo "Cumulative base moved from $expected_base to $actual_base; refusing stale merge." >&2
            exit 1
          fi

          set +e
          git merge --no-commit --no-ff "$expected_base"
          merge_status=$?
          set -e
          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "Expected an in-progress merge, got status $merge_status without MERGE_HEAD." >&2
            exit 1
          fi
          unmerged="$(git diff --name-only --diff-filter=U)"
          if [ "$unmerged" != "contextual_orchestrator/server.py" ]; then
            printf 'Unexpected merge-conflict set:\n%s\n' "$unmerged" >&2
            exit 1
          fi

          git checkout --theirs contextual_orchestrator/server.py
          FEATURE_HEAD="$feature_head" python - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          feature_head = os.environ["FEATURE_HEAD"]
          path = Path("contextual_orchestrator/server.py")
          current = path.read_text(encoding="utf-8")
          reviewed = subprocess.check_output(
              ["git", "show", f"{feature_head}:contextual_orchestrator/server.py"],
              text=True,
          )
          current_start_marker = "def _validate_messages(messages: Any) -> list[dict[str, str]]:\n"
          reviewed_start_marker = "def _validate_message_content_parts(content: list[Any]) -> list[dict[str, Any]]:\n"
          end_marker = "\n\ndef _validate_chat_tool_message_ids"
          if current.count(current_start_marker) != 1 or current.count(end_marker) != 1:
              raise RuntimeError("cumulative message-validation boundary changed")
          if reviewed.count(reviewed_start_marker) != 1 or reviewed.count(end_marker) != 1:
              raise RuntimeError("reviewed multimodal message-validation boundary changed")
          current_start = current.index(current_start_marker)
          current_end = current.index(end_marker, current_start)
          reviewed_start = reviewed.index(reviewed_start_marker)
          reviewed_end = reviewed.index(end_marker, reviewed_start)
          old_block = current[current_start:current_end]
          reviewed_block = reviewed[reviewed_start:reviewed_end]
          for marker in (
              "multipart content arrays are not supported on /v1/chat/completions",
              "validated: list[dict[str, str]] = []",
          ):
              if marker not in old_block:
                  raise RuntimeError(f"cumulative validation block lacks {marker!r}")
          for marker in (
              "content part type must be text or image_url",
              "validated: list[dict[str, Any]] = []",
              "content = _validate_message_content_parts(content)",
          ):
              if marker not in reviewed_block:
                  raise RuntimeError(f"reviewed multimodal block lacks {marker!r}")
          path.write_text(
              current[:current_start] + reviewed_block + current[current_end:],
              encoding="utf-8",
          )
          PY
          git add contextual_orchestrator/server.py

          python - <<'PY'
          from pathlib import Path

          source = Path("contextual_orchestrator/orchestrator.py").read_text(encoding="utf-8")
          required = (
              "ChatMessage = dict[str, Any]",
              "def _coerce_message_content_text(content: Any) -> str:",
              'if isinstance(item.get("text"), str):',
              'text = _coerce_message_content_text(message.get("content", ""))',
          )
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise RuntimeError(f"multimodal routing merge is incomplete: {missing}")
          PY
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check

      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r fuzz/requirements-property.txt

      - name: Run focused multimodal and cumulative regressions
        run: >-
          python -m pytest -q
          tests/test_multimodal_message_content_http_honesty.py
          tests/test_chat_developer_multimodal_content_http_honesty.py
          tests/test_empty_string_numeric_controls_noop_http_honesty.py
          tests/test_responses_truncation_parallel_empty_noop_http_honesty.py
          tests/test_request_sampling_concurrency.py

      - name: Run full repository suite
        run: python -m pytest -q

      - name: Verify compilation and formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q contextual_orchestrator tests
          git diff --check

      - name: Publish verified merge and remove diagnostic
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-multimodal-cumulative-merge.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No verified multimodal merge was produced.' >&2
            exit 1
          fi
          git commit -m 'merge: add multimodal content parts to cumulative API head'
          git push origin HEAD:feat/multimodal-content-parts-tip-http-honesty-20260816191047
