name: Temporary PR971 daemon-pool shutdown repair

on:
  push:
    branches:
      - fix/model-group-timeout-openrouter
    paths:
      - .github/workflows/_temp_pr971_daemon_pool_shutdown.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-pr971-daemon-pool-shutdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact event head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Prove RED regression on event head
        shell: bash
        run: |
          set -euo pipefail
          if uv run --locked --extra api --extra db --extra queue --group dev \
              python -m pytest -q tests/test_daemon_worker_pool_shutdown.py; then
            echo "RED regression unexpectedly passed before production repair" >&2
            exit 1
          fi

      - name: Apply smallest causal GREEN repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("contextual_orchestrator/batch_routing.py")
          text = path.read_text()

          old = """        self._workers: list[threading.Thread] = []\n        self._workers_lock = threading.Lock()\n"""
          new = """        self._workers: list[threading.Thread] = []\n        self._workers_lock = threading.Lock()\n        self._shutdown = False\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one worker-state anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    def submit(self, fn: Callable[..., Any], *args: Any) -> None:\n        """Queue ``fn(*args)`` for a pool worker. Fire-and-forget: no Future."""\n        self._queue.put((fn, args))\n        with self._workers_lock:\n            if len(self._workers) < self._max_workers:\n                worker = threading.Thread(\n                    target=self._drain,\n                    name=f"{self._thread_name_prefix}_{len(self._workers)}",\n                    daemon=True,\n                )\n                self._workers.append(worker)\n                worker.start()\n'''
          new = '''    def submit(self, fn: Callable[..., Any], *args: Any) -> None:\n        """Queue ``fn(*args)`` unless shutdown has closed admission."""\n        with self._workers_lock:\n            if self._shutdown:\n                raise RuntimeError("cannot schedule new work after shutdown")\n            self._queue.put((fn, args))\n            if len(self._workers) < self._max_workers:\n                worker = threading.Thread(\n                    target=self._drain,\n                    name=f"{self._thread_name_prefix}_{len(self._workers)}",\n                    daemon=True,\n                )\n                self._workers.append(worker)\n                worker.start()\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one submit anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        if cancel_futures:\n            while True:\n                try:\n                    self._queue.get_nowait()\n                except queue.Empty:\n                    break\n        with self._workers_lock:\n            workers = list(self._workers)\n        for _ in workers:\n            self._queue.put(None)\n        if wait:\n            for worker in workers:\n                worker.join()\n'''
          new = '''        with self._workers_lock:\n            workers = list(self._workers)\n            first_shutdown = not self._shutdown\n            self._shutdown = True\n        if first_shutdown:\n            if cancel_futures:\n                while True:\n                    try:\n                        self._queue.get_nowait()\n                    except queue.Empty:\n                        break\n            for _ in workers:\n                self._queue.put(None)\n        if wait:\n            for worker in workers:\n                worker.join()\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one shutdown anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text)

          changelog = Path("CHANGELOG.d/provider-embedding-daemon-worker-pool.md")
          changelog_text = changelog.read_text()
          sentence = (
              "- The daemon worker pool now closes task admission atomically before queuing "
              "shutdown sentinels, so a post-shutdown submission fails closed instead of "
              "being stranded behind stopped workers.\n"
          )
          if sentence not in changelog_text:
              changelog.write_text(changelog_text + sentence)

          gap = Path("docs/product-technical-gap-baseline.md")
          gap_text = gap.read_text()
          marker = "### PR #971 daemon worker shutdown admission — 2026-09-02"
          if marker not in gap_text:
              gap.write_text(
                  gap_text.rstrip()
                  + "\n\n"
                  + marker
                  + "\n\n"
                  + "- **Gap:** the fixed-size provider embedding daemon pool could accept a task after `shutdown()`, after worker-stop sentinels were already committed, leaving the task permanently unexecuted.\n"
                  + "- **Owner/contract:** `contextual-orchestrator` owns provider embedding execution. Pool shutdown closes admission atomically; post-shutdown submissions fail closed, while no implicit model deadline is introduced.\n"
                  + "- **Evidence:** `tests/test_daemon_worker_pool_shutdown.py` plus the existing subprocess process-exit regression `tests/test_provider_embedding_batch_backend_process_exit.py`.\n"
                  + "- **Status:** Implemented on PR #971; exact-head GitHub Checks remain the merge authority.\n"
              )
          PY

      - name: Focused and broader verification
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q \
              tests/test_daemon_worker_pool_shutdown.py \
              tests/test_provider_embedding_batch_backend_process_exit.py
          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q \
              tests/test_batch_embeddings.py \
              tests/test_endpoint_race_callback_settlement.py
          python -m compileall -q contextual_orchestrator tests/test_daemon_worker_pool_shutdown.py
          git diff --check

      - name: Re-fetch writer branch and publish self-retiring successor
        env:
          PUBLISH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo "PR_REVIEW_MERGE_TOKEN is required for a workflow-producing successor push" >&2
            exit 1
          fi
          branch="fix/model-group-timeout-openrouter"
          git fetch origin "${branch}"
          test "$(git rev-parse origin/${branch})" = "${GITHUB_SHA}"

          rm .github/workflows/_temp_pr971_daemon_pool_shutdown.yml
          test ! -e .github/workflows/_temp_pr971_daemon_pool_shutdown.yml

          git add \
            contextual_orchestrator/batch_routing.py \
            tests/test_daemon_worker_pool_shutdown.py \
            CHANGELOG.d/provider-embedding-daemon-worker-pool.md \
            docs/product-technical-gap-baseline.md \
            .github/workflows/_temp_pr971_daemon_pool_shutdown.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "repair produced no publishable diff" >&2; exit 1; }

          git config user.name "ContextualWisdomLab repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close daemon worker admission before shutdown"

          askpass="$(mktemp)"
          trap 'rm -f "${askpass}"' EXIT
          cat >"${askpass}" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$PUBLISH_TOKEN" ;;
          esac
          EOF
          chmod 700 "${askpass}"
          export GIT_ASKPASS="${askpass}"
          export GIT_TERMINAL_PROMPT=0
          git push origin "HEAD:${branch}"
