          Path("tests/test_batch_routing_boundaries_extra.py").write_text('''"""Boundary coverage for the explicit local embedding implementation seam."""

from __future__ import annotations

import pytest

from contextual_orchestrator.batch_routing import EmbeddingBatchRequest, LocalEmbeddingBatchBackend


class _Counter:
    def count_text(self, text: str, model: str) -> int:
        del text, model
        return 42


def test_local_backend_without_embedder_fails_closed() -> None:
    backend = LocalEmbeddingBatchBackend(token_counter=_Counter())
    request = EmbeddingBatchRequest(custom_id="row-1", model="m", input_text="semantic text")
    with pytest.raises(RuntimeError, match="explicit embedding implementation"):
        backend.submit([request])


def test_local_backend_without_token_counter_still_fails_closed() -> None:
    backend = LocalEmbeddingBatchBackend(embedder=lambda text: [float(len(text))])
    request = EmbeddingBatchRequest(custom_id="row-1", model="m", input_text="semantic text")
    with pytest.raises(RuntimeError, match="authoritative embedding tokenizer"):
        backend.submit([request])


def test_local_backend_requires_both_explicit_semantics_and_accounting() -> None:
    backend = LocalEmbeddingBatchBackend(
        embedder=lambda text: [float(len(text))], token_counter=_Counter()
    )
    request = EmbeddingBatchRequest(custom_id="row-1", model="m", input_text="abcd")
    job = backend.submit([request])
    item = backend.retrieve(job)[0]
    assert item.embedding == [4.0]
    assert item.prompt_tokens == 42
''')

          # ADR: the papers motivate evaluated routing; they do not authorize the retired rules.
          Path("docs/adr/0003-cost-aware-sync-batch-routing.md").write_text('''# ADR 0003: Evidence-bounded sync-versus-batch routing

- Status: Accepted; amended 2026-09-01
- Date: 2026-08-25
- Decision owners: ContextualWisdomLab
- Series: `docs/adr` only. This is not planning ADR 0003 (`docs/planning/adrs/0003-keyverse-authentication-boundary.md`).

## Context

FrugalGPT, RouteLLM, and Hybrid LLM demonstrate that cost/quality routing is an estimable or learned decision problem. They do **not** validate a hand-written `batch_min_tokens`, `priority`, `latency_tolerant`, fixed representative request shape, provider-order tie break, or pseudo-semantic hash embedding. The prior implementation cited those papers while using deterministic rules that were not the algorithms evaluated by those works. That divergence is retired rather than relabeled as an operational heuristic.

## Decision

1. Every completion continues to record prompt-safe measured cost/usage evidence when authoritative token counts and comparable price evidence exist.
2. Sync-versus-batch is explicit contract selection until an evaluated router is implemented. `routing.channel=sync|batch` is authoritative caller intent. An omitted or unrecognized channel stays synchronous; `batch_enabled=false` is an operator kill switch. `latency_tolerant`, `priority`, prompt length, and legacy threshold keys may remain compatibility metadata but cannot select a channel.
3. Table-driven cost comparison requires the exact request's prompt/completion token quantities. No 1000/1000 or other representative token shape may be invented. Unknown prices and equal minimum costs leave the selection unresolved rather than using input order as a tie break.
4. A local embedding backend may execute only an explicitly injected semantic embedding implementation with an authoritative tokenizer. SHA/digest-derived vectors are identifiers/test artifacts, not embeddings, and are prohibited as semantic output.
5. When multiple eligible embedding candidates remain and no independently validated router supplies a unique decision, routing fails closed or requires an exact caller-selected candidate. A single eligible candidate needs no comparative ranking.
6. Future automatic routing must identify its estimand, training/evaluation evidence, calibration/uncertainty contract, and executable provenance before production authority changes. Fugu, Conductor, and TRINITY architecture contracts do not by themselves justify token thresholds, fixed weights, or fallback ordering.

## Consequences

The synchronous API no longer silently changes response shape because a request was labeled bulk/latency-tolerant or crossed a configured token threshold. Offline tests can still inject a deterministic *real test embedder*, but production code does not fabricate semantic vectors. Cost optimization remains available when exact request measurements identify a unique minimum; otherwise the gateway preserves uncertainty instead of inventing a preference.

## References

Chen, L., Zaharia, M., & Zou, J. (2023). *FrugalGPT: How to use large language models while reducing cost and improving performance* [Preprint]. arXiv. https://doi.org/10.48550/arXiv.2305.05176

Ding, D., Mallick, A., Wang, C., Sim, R., Mukherjee, S., Ruhle, V., Lakshmanan, L. V. S., & Awadallah, A. (2024). *Hybrid LLM: Cost-efficient and quality-aware query routing* [Preprint]. arXiv. https://doi.org/10.48550/arXiv.2404.14618

Ong, I., Almahairi, A., Wu, V., Chiang, W.-L., Wu, T., Gonzalez, J. E., Kadous, M. W., & Stoica, I. (2024). *RouteLLM: Learning to route LLMs with preference data* [Preprint]. arXiv. https://doi.org/10.48550/arXiv.2406.18665
''')

          changelog = Path("CHANGELOG.md")
