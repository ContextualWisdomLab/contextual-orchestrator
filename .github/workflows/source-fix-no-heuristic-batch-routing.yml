              candidates: List[Dict[str, str]],
              price_book: Any,
              *,
              prompt_tokens: int,
              completion_tokens: int,
          ) -> Optional[Dict[str, str]]:
              """Return a uniquely cheapest candidate for the exact request shape.

              The caller must provide authoritative token quantities. Unknown prices and
              unresolved cost ties fail closed; input order is never a substantive tie-break.
              """
              for name, value in (("prompt_tokens", prompt_tokens), ("completion_tokens", completion_tokens)):
                  if type(value) is not int or value < 0:
                      raise ValueError(f"{name} must be a non-negative integer")
              if not candidates:
                  return None
              priced: list[tuple[Dict[str, str], float]] = []
              for candidate in candidates:
                  provider = candidate.get("provider", "")
                  model = candidate.get("model", "")
                  cost, _currency, price_known = price_book.compute_cost(
                      provider, model, prompt_tokens, completion_tokens
                  )
                  if price_known:
                      priced.append((candidate, cost))
              if not priced:
                  return None
              minimum = min(cost for _candidate, cost in priced)
              winners = [candidate for candidate, cost in priced if cost == minimum]
              return winners[0] if len(winners) == 1 else None


# ---------------------------------------------------------------------------
