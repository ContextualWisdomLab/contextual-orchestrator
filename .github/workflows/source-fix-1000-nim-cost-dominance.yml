name: Source fix PR1000 NIM evidence-only benchmark

on:
  push:
    branches: [fix/no-heuristic-batch-routing]
    paths: [.github/source-fix-1000-nim-cost-dominance.trigger]

permissions:
  contents: write
  pull-requests: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/no-heuristic-batch-routing
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Remove weighted price and character-token heuristics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          starting_head="$GITHUB_SHA"
          branch_name="fix/no-heuristic-batch-routing"
          live_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch_name}" --jq '.object.sha')"
          pr_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1000" --jq '.state')"
          pr_head_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1000" --jq '.head.ref')"
          test "$live_ref" = "$starting_head"
          test "$pr_state" = "open"
          test "$pr_head_ref" = "$branch_name"
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python3 <<'PY'
          from pathlib import Path

          source_path = Path('contextual_orchestrator/nim_benchmark.py')
          source = source_path.read_text(encoding='utf-8')

          def replace_section(text: str, start_marker: str, end_marker: str, replacement: str) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          source = replace_section(
              source,
              'def estimate_tokens(text: str) -> int:\n',
              '\n\nBENCHMARK_SCHEMA_VERSION',
              '''def estimate_tokens(text: str) -> int:\n    """Reject character-count token estimation at the benchmark boundary.\n\n    ADR-0006 requires provider-reported chat usage because local raw-tokenizer\n    counts cannot reconstruct provider framing, tool schemas, or multimodal\n    serialization. The historical ~4-chars/token approximation affected\n    admission, output allowance, cost, and benchmark evidence and is therefore\n    prohibited rather than retained as a fallback.\n    """\n    del text\n    raise BenchmarkContractError(\n        "heuristic token estimation is prohibited; provider-reported usage is required"\n    )\n''',
          )

          class_replacement = '''class EqualBudgetModelClient:\n    """Delegate model calls using only provider-reported token evidence.\n\n    Every policy cell receives the same declared token and call envelope. No\n    prompt or completion token count is reconstructed locally. Calls receive at\n    most the remaining *reported* allowance; after each response, complete\n    provider usage is mandatory and the cell fails closed when it is absent.\n    """\n\n    def __init__(\n        self,\n        delegate: ModelClient,\n        total_token_budget: int,\n        maximum_calls: int,\n    ) -> None:\n        if (\n            isinstance(total_token_budget, bool)\n            or not isinstance(total_token_budget, int)\n            or total_token_budget < 1\n        ):\n            raise ValueError("total_token_budget must be a positive integer")\n        if (\n            isinstance(maximum_calls, bool)\n            or not isinstance(maximum_calls, int)\n            or maximum_calls < 1\n        ):\n            raise ValueError("maximum_calls must be a positive integer")\n        self._delegate = delegate\n        self.total_token_budget = total_token_budget\n        self.maximum_calls = maximum_calls\n        self.observed_calls = 0\n        self.reported_usage_calls = 0\n        self.observed_tokens = 0\n        self.observed_prompt_tokens = 0\n        self.observed_completion_tokens = 0\n        self.attempted_models: list[dict[str, Any]] = []\n        self.reported_usage_by_model: dict[str, dict[str, int]] = {}\n        self._pending_model: str | None = None\n        self._exceeded = False\n        self._contract_error: BenchmarkContractError | None = None\n\n    def __getattr__(self, name: str) -> Any:\n        return getattr(self._delegate, name)\n\n    @property\n    def max_output_tokens(self) -> int:\n        return int(self._delegate.max_output_tokens)\n\n    @max_output_tokens.setter\n    def max_output_tokens(self, value: int) -> None:\n        self._delegate.max_output_tokens = value\n\n    @property\n    def remaining_tokens(self) -> int:\n        return max(0, self.total_token_budget - self.observed_tokens)\n\n    @property\n    def exceeded(self) -> bool:\n        return self._exceeded\n\n    @property\n    def contract_error(self) -> BenchmarkContractError | None:\n        return self._contract_error\n\n    @staticmethod\n    def _coerce_usage_count(value: Any) -> int | None:\n        if isinstance(value, bool) or not isinstance(value, (int, float)):\n            return None\n        if not math.isfinite(value) or value < 0:\n            return None\n        return int(value)\n\n    def _record_reported_usage(\n        self, model_id: str, usage: Any\n    ) -> dict[str, Any]:\n        if not isinstance(usage, dict):\n            error = BenchmarkContractError(\n                "provider-reported prompt and completion token usage is required"\n            )\n            self._contract_error = error\n            raise error\n        prompt_tokens = self._coerce_usage_count(usage.get("prompt_tokens"))\n        completion_tokens = self._coerce_usage_count(usage.get("completion_tokens"))\n        if prompt_tokens is None or completion_tokens is None:\n            error = BenchmarkContractError(\n                "provider-reported prompt and completion token usage is required"\n            )\n            self._contract_error = error\n            raise error\n        self.reported_usage_calls += 1\n        self.observed_prompt_tokens += prompt_tokens\n        self.observed_completion_tokens += completion_tokens\n        self.observed_tokens += prompt_tokens + completion_tokens\n        bucket = self.reported_usage_by_model.setdefault(\n            model_id, {"prompt_tokens": 0, "completion_tokens": 0}\n        )\n        bucket["prompt_tokens"] += prompt_tokens\n        bucket["completion_tokens"] += completion_tokens\n        self._exceeded = self.observed_tokens > self.total_token_budget\n        return usage\n\n    def _begin_call(self, agent: ModelAgent) -> int:\n        if self._exceeded or self.observed_calls >= self.maximum_calls:\n            raise PolicyTokenBudgetExceeded(\n                "policy cell maximum-call allowance exhausted"\n            )\n        if self.remaining_tokens < 1:\n            raise PolicyTokenBudgetExceeded(\n                "policy cell total-token allowance exhausted"\n            )\n        self.observed_calls += 1\n        self.attempted_models.append(\n            {"role": "attempted", "agent_id": agent.id, "model_id": agent.model}\n        )\n        return min(int(self._delegate.max_output_tokens), self.remaining_tokens)\n\n    def chat(\n        self,\n        agent: ModelAgent,\n        messages: list[dict[str, Any]],\n        temperature: float | None = None,\n        top_p: float | None = None,\n        effort_profile: ReasoningEffortProfile | None = None,\n    ) -> str:\n        """Perform one call; accounting is completed by ``take_usage``."""\n        output_cap = self._begin_call(agent)\n        self._pending_model = agent.model\n        try:\n            with self._delegate.request_settings(max_output_tokens=output_cap):\n                return self._delegate.chat(\n                    agent, messages, temperature, top_p, effort_profile\n                )\n        finally:\n            delegate_error = getattr(self._delegate, "benchmark_contract_error", None)\n            if isinstance(delegate_error, BenchmarkContractError):\n                self._contract_error = delegate_error\n\n    def proxy_send(\n        self, agent: ModelAgent, endpoint: str, payload: dict[str, Any]\n    ) -> dict[str, Any]:\n        """Apply the same evidence-only envelope to structured requests."""\n        output_cap = self._begin_call(agent)\n        request = dict(payload)\n        requested_cap = request.get("max_tokens")\n        request["max_tokens"] = min(\n            requested_cap\n            if type(requested_cap) is int and requested_cap > 0\n            else output_cap,\n            output_cap,\n        )\n        response = self._delegate.proxy_send(agent, endpoint, request)\n        self._record_reported_usage(agent.model, response.get("usage"))\n        return response\n\n    def proxy_send_once(\n        self, agent: ModelAgent, endpoint: str, payload: dict[str, Any]\n    ) -> dict[str, Any]:\n        return self.proxy_send(agent, endpoint, payload)\n\n    def take_usage(self) -> dict[str, Any] | None:\n        """Require complete provider usage for the preceding chat call."""\n        usage = self._delegate.take_usage()\n        pending_model = self._pending_model\n        self._pending_model = None\n        if pending_model is None:\n            return usage\n        return self._record_reported_usage(pending_model, usage)\n\n'''
          source = replace_section(
              source,
              'class EqualBudgetModelClient:\n',
              '# --------------------------------------------------------------------------\n# Catalog discovery',
              class_replacement,
          )

          usage_replacement = '''def _cell_usage(\n    trace: list[dict[str, Any]],\n    agents_by_id: dict[str, str],\n    task_prompt: str,\n) -> tuple[dict[str, dict[str, int]], dict[str, Any]]:\n    """Aggregate complete provider-reported usage for one evaluation cell.\n\n    ``task_prompt`` remains a compatibility argument but is never tokenized\n    locally. Missing, malformed, non-finite, or partial usage fails closed so\n    cost and token-budget evidence cannot be synthesized from text length.\n    """\n    del task_prompt\n    usage_by_model: dict[str, dict[str, int]] = {}\n    models_used: list[dict[str, Any]] = []\n    for row in trace:\n        agent_id = row.get("served_agent_id") or row["agent_id"]\n        try:\n            model_id = agents_by_id[agent_id]\n        except (KeyError, TypeError) as exc:\n            raise BenchmarkContractError(\n                f"trace references unknown agent {agent_id!r}"\n            ) from exc\n        models_used.append(\n            {\n                "step_id": row["id"],\n                "role": row["role"],\n                "agent_id": agent_id,\n                "model_id": model_id,\n            }\n        )\n        usage = row.get("usage") if isinstance(row.get("usage"), dict) else {}\n        prompt_tokens = _coerce_token_count(usage.get("prompt_tokens"))\n        completion_tokens = _coerce_token_count(usage.get("completion_tokens"))\n        if prompt_tokens is None or completion_tokens is None:\n            raise BenchmarkContractError(\n                "provider-reported prompt and completion token usage is required"\n            )\n        bucket = usage_by_model.setdefault(\n            model_id, {"prompt_tokens": 0, "completion_tokens": 0}\n        )\n        bucket["prompt_tokens"] += prompt_tokens\n        bucket["completion_tokens"] += completion_tokens\n    prompt_total = sum(bucket["prompt_tokens"] for bucket in usage_by_model.values())\n    completion_total = sum(\n        bucket["completion_tokens"] for bucket in usage_by_model.values()\n    )\n    return usage_by_model, {\n        "prompt_tokens": prompt_total,\n        "completion_tokens": completion_total,\n        "total_tokens": prompt_total + completion_total,\n        "token_usage_source": "reported",\n        "models_used": models_used,\n    }\n\n\n'''
          source = replace_section(
              source,
              'def _cell_usage(\n',
              'def _classify_run_error(',
              usage_replacement,
          )

          cost_replacement = '''def _price_vector(\n    pricing_scenario: dict[str, Any], model_id: str\n) -> tuple[float, float] | None:\n    """Return the explicit (input, output) USD/1M price vector, or ``None``."""\n    rate = pricing_scenario["usd_per_million_tokens"].get(model_id)\n    if rate is None:\n        return None\n    return float(rate["input"]), float(rate["output"])\n\n\ndef cheapest_priced_agent(\n    agents: list[ModelAgent], pricing_scenario: dict[str, Any] | None\n) -> ModelAgent | None:\n    """Return a uniquely component-wise price-dominant worker, if identified.\n\n    No prompt/completion mixture is assumed. Automatic selection is permitted\n    only when one candidate is no more expensive in both published price\n    dimensions and strictly cheaper in at least one dimension against every\n    competitor. Equal or crossing vectors remain unresolved.\n    """\n    if pricing_scenario is None:\n        return None\n    priced = [\n        (vector, agent)\n        for agent in agents\n        for vector in [_price_vector(pricing_scenario, agent.model)]\n        if vector is not None\n    ]\n    if not priced:\n        return None\n    winners = []\n    for vector, agent in priced:\n        dominates_all = True\n        for other, other_agent in priced:\n            if other_agent is agent:\n                continue\n            if not (\n                vector[0] <= other[0]\n                and vector[1] <= other[1]\n                and (vector[0] < other[0] or vector[1] < other[1])\n            ):\n                dominates_all = False\n                break\n        if dominates_all:\n            winners.append(agent)\n    return winners[0] if len(winners) == 1 else None\n\n\n'''
          source = replace_section(
              source,
              'def _combined_rate(',
              'def planned_evaluation_requests(',
              cost_replacement,
          )

          source = source.replace(
              '"token_usage_source": "estimated" if incurred else "unavailable",',
              '"token_usage_source": incurred.get("token_usage_source", "unavailable"),',
          )
          estimated_branch = '''        if cell["token_usage_source"] == "estimated" and cell_client.observed_calls:\n            cell.update(\n                {\n                    "prompt_tokens": cell_client.observed_prompt_tokens,\n                    "completion_tokens": cell_client.observed_completion_tokens,\n                    "total_tokens": cell_client.observed_tokens,\n                    "hypothetical_cost_usd": hypothetical_cost_usd(\n                        pricing_scenario, cell_client.estimated_usage_by_model\n                    ),\n                }\n            )\n'''
          if estimated_branch not in source:
              raise SystemExit('estimated run-cell branch not found')
          source = source.replace(estimated_branch, '', 1)
          source = source.replace(
              '"models_used": cell_client.attempted_models,\n            },',
              '"models_used": cell_client.attempted_models,\n                "token_usage_source": (\n                    "reported"\n                    if cell_client.reported_usage_calls == cell_client.observed_calls\n                    else "unavailable"\n                ),\n            },',
              1,
          )
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_nim_benchmark.py')
          tests = test_path.read_text(encoding='utf-8')
          old_adversarial = '''    adversarial_trace = [\n        {\n            "id": 0,\n            "role": "worker",\n            "agent_id": "worker_one",\n            "output": "answer text",\n            "usage": {"prompt_tokens": float("nan"), "completion_tokens": float("inf")},\n        },\n        {\n            "id": 1,\n            "role": "worker",\n            "agent_id": "worker_one",\n            "output": None,\n            "usage": "corrupted",\n        },\n    ]\n    _usage, summary = nb._cell_usage(adversarial_trace, agents_by_id, "prompt text")\n    assert summary["token_usage_source"] == "estimated"\n    assert summary["total_tokens"] > 0\n'''
          new_adversarial = '''    adversarial_trace = [\n        {\n            "id": 0,\n            "role": "worker",\n            "agent_id": "worker_one",\n            "output": "answer text",\n            "usage": {"prompt_tokens": float("nan"), "completion_tokens": float("inf")},\n        }\n    ]\n    with pytest.raises(nb.BenchmarkContractError, match="provider-reported"):\n        nb._cell_usage(adversarial_trace, agents_by_id, "prompt text")\n'''
          if old_adversarial not in tests:
              raise SystemExit('adversarial token fallback test block not found')
          tests = tests.replace(old_adversarial, new_adversarial, 1)

          tests = tests.replace(
              '''                    "agent_id": "worker_one",\n                    "output": "a zebra appears",\n                }\n''',
              '''                    "agent_id": "worker_one",\n                    "output": "a zebra appears",\n                    "usage": {"prompt_tokens": 3, "completion_tokens": 4},\n                }\n''',
              1,
          )

          old_tie = '''    # Deterministic tiebreak: equal combined rate resolves by model id.\n    assert nb.cheapest_priced_agent(agents, scenario).model == "vendor/model-b"\n'''
          new_tie = '''    # Equal price vectors are unresolved; model identity is not routing evidence.\n    assert nb.cheapest_priced_agent(agents, scenario) is None\n\n    dominant = {\n        "scenario_version": "1",\n        "scenario_status": "reviewed",\n        "usd_per_million_tokens": {\n            "vendor/model-b": {"input": 0.05, "output": 0.10},\n            "vendor/model-c": {"input": 0.10, "output": 0.20},\n        },\n    }\n    assert nb.cheapest_priced_agent(agents, dominant).model == "vendor/model-b"\n\n    crossing = {\n        "scenario_version": "1",\n        "scenario_status": "reviewed",\n        "usd_per_million_tokens": {\n            "vendor/model-b": {"input": 0.01, "output": 0.50},\n            "vendor/model-c": {"input": 0.50, "output": 0.01},\n        },\n    }\n    assert nb.cheapest_priced_agent(agents, crossing) is None\n'''
          if old_tie not in tests:
              raise SystemExit('cheapest-worker tie block not found')
          tests = tests.replace(old_tie, new_tie, 1)
          tests = tests.replace('cell.estimated_usage_by_model[agent.model]', 'cell.reported_usage_by_model[agent.model]')

          old_overflow = '''    class OversizedAnswerClient(ModelClient):\n        def chat(self, *args, **kwargs) -> str:  # type: ignore[override]\n            del args, kwargs\n            return "x" * 5000\n'''
          new_overflow = '''    class OversizedAnswerClient(ModelClient):\n        def chat(self, *args, **kwargs) -> str:  # type: ignore[override]\n            del args, kwargs\n            return "x" * 5000\n\n        def take_usage(self):\n            return {"prompt_tokens": 300, "completion_tokens": 300}\n'''
          if old_overflow not in tests:
              raise SystemExit('overflow usage test block not found')
          tests = tests.replace(old_overflow, new_overflow, 1)
          test_path.write_text(tests, encoding='utf-8')

          contract_test = Path('tests/test_nim_benchmark_no_heuristic_tokens.py')
          contract_test.write_text('''import pytest\n\nfrom contextual_orchestrator import nim_benchmark as nb\nfrom contextual_orchestrator.orchestrator import ModelAgent, ModelClient\n\n\ndef _agent() -> ModelAgent:\n    return ModelAgent(id="nim_worker", model="vendor/model")\n\n\ndef test_character_token_estimator_fails_closed() -> None:\n    with pytest.raises(nb.BenchmarkContractError, match="heuristic token estimation"):\n        nb.estimate_tokens("four characters are not token evidence")\n\n\ndef test_missing_provider_usage_fails_closed() -> None:\n    class MissingUsageClient(ModelClient):\n        def chat(self, *args, **kwargs):\n            return "answer"\n\n        def take_usage(self):\n            return None\n\n    client = nb.EqualBudgetModelClient(\n        MissingUsageClient(), total_token_budget=100, maximum_calls=1\n    )\n    client.chat(_agent(), [{"role": "user", "content": "question"}])\n    with pytest.raises(nb.BenchmarkContractError, match="provider-reported"):\n        client.take_usage()\n\n\ndef test_reported_usage_is_the_only_budget_authority() -> None:\n    class ReportedUsageClient(ModelClient):\n        def chat(self, *args, **kwargs):\n            return "answer"\n\n        def take_usage(self):\n            return {"prompt_tokens": 7, "completion_tokens": 5}\n\n    agent = _agent()\n    client = nb.EqualBudgetModelClient(\n        ReportedUsageClient(), total_token_budget=100, maximum_calls=1\n    )\n    client.chat(agent, [{"role": "user", "content": "question"}])\n    client.take_usage()\n    assert client.observed_tokens == 12\n    assert client.reported_usage_by_model[agent.model] == {\n        "prompt_tokens": 7,\n        "completion_tokens": 5,\n    }\n''', encoding='utf-8')

          adr = Path('docs/planning/adrs/0034-anti-heuristic-routing-evidence.md')
          adr_text = adr.read_text(encoding='utf-8')
          marker = '## 2026-09-01 NIM benchmark token-evidence amendment'
          if marker not in adr_text:
              adr_text += '''\n\n## 2026-09-01 NIM benchmark token-evidence amendment\n\nThe NIM benchmark MUST NOT reconstruct chat prompt or completion usage from character length. ADR-0006 is authoritative: provider chat framing, tool schemas, and multimodal serialization are provider-owned and cannot be recovered from a raw tokenizer or text-length proxy. Equal-budget evaluation therefore records and enforces only complete provider-reported `prompt_tokens` and `completion_tokens`; missing or malformed usage fails closed. Cost evidence is unavailable rather than estimated. The cheapest-worker baseline likewise uses component-wise dominance over the explicit input/output price vector and leaves equal or crossing vectors unresolved instead of imposing an unstated prompt/completion mixture or model-id tie-break.\n'''
              adr.write_text(adr_text, encoding='utf-8')

          baseline = Path('docs/product-technical-gap-baseline.md')
          baseline_text = baseline.read_text(encoding='utf-8')
          baseline_marker = '## 2026-09-01 no-heuristic NIM benchmark accounting repair'
          if baseline_marker not in baseline_text:
              baseline_text += '''\n\n## 2026-09-01 no-heuristic NIM benchmark accounting repair\n\nCausal owner: `contextual_orchestrator/nim_benchmark.py`. The benchmark previously used an explicit `~4 chars/token` approximation to admit calls, lower output allowances, enforce equal-token cells, calculate hypothetical cost, and backfill missing trace usage. That violates ADR-0006 and the organization no-heuristics contract. PR #1000 removes the approximation from every benchmark decision/evidence path: complete provider-reported prompt/completion usage is now mandatory, missing evidence fails closed, and cost remains unknown rather than inferred. The same repair removes the benchmark's implicit 1:1 input/output price weight and model-id tie-break; automatic cheapest-worker selection now requires a uniquely component-wise dominant published price vector. Hosted exact-head tests/security/review remain required before protected-main integration.\n'''
              baseline.write_text(baseline_text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          changelog_marker = 'NIM benchmark character-count token heuristic'
          if changelog_marker not in changelog_text:
              insert_at = changelog_text.find('\n', changelog_text.find('## [Unreleased]')) + 1
              changelog_text = (\n                  changelog_text[:insert_at]\n                  + '- Remove the NIM benchmark character-count token heuristic and weighted cheapest-worker selector. Benchmark token/cost evidence now requires complete provider-reported usage, and ambiguous price vectors fail closed.\n'\n                  + changelog_text[insert_at:]\n              )
              changelog.write_text(changelog_text, encoding='utf-8')
          PY

          python -m pytest -q \
            tests/test_nim_benchmark.py \
            tests/test_nim_benchmark_no_heuristic_tokens.py \
            -k 'cell_usage or run_policy_cell or cheapest_priced_agent or equal_budget or observed_budget_overflow or preserves_reported_usage_source or heuristic_token or missing_provider_usage or reported_usage_is_the_only_budget_authority'
          git diff --check
          latest_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch_name}" --jq '.object.sha')"
          latest_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1000" --jq '.state')"
          latest_head_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1000" --jq '.head.ref')"
          test "$latest_ref" = "$starting_head"
          test "$latest_state" = "open"
          test "$latest_head_ref" = "$branch_name"
          rm -f .github/workflows/source-fix-1000-nim-cost-dominance.yml .github/source-fix-1000-nim-cost-dominance.trigger
          git add -A
          git diff --cached --check
          git config user.name 'opencode-agent[bot]'
          git config user.email '219766164+opencode-agent[bot]@users.noreply.github.com'
          git commit -m 'fix(benchmark): require reported token evidence'
          git push origin HEAD:fix/no-heuristic-batch-routing
