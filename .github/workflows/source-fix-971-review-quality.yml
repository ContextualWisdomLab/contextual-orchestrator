name: TEMP PR971 review-quality RED GREEN

on:
  push:
    branches:
      - fix/model-group-timeout-openrouter
    paths:
      - .github/workflows/source-fix-971-review-quality.yml
      - scripts/ci/source_fix_971_review_quality.py

permissions:
  contents: read

concurrency:
  group: temp-pr971-review-quality-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/contextual-orchestrator' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/fix/model-group-timeout-openrouter'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Revalidate exact unchanged writer head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$EXPECTED_HEAD"
          test -f scripts/ci/source_fix_971_review_quality.py
          test -f .github/workflows/source-fix-971-review-quality.yml

      - name: Materialize durable RED regressions
        run: |
          set -euo pipefail
          uv run --locked --extra api --extra db --extra queue --group dev \
            python scripts/ci/source_fix_971_review_quality.py red
          git diff --check

      - name: Prove current head is RED for every causal contract
        run: |
          set -euo pipefail
          tests=(
            "tests/test_batch_job_registry.py::test_recovered_provider_embedding_restores_persisted_request_context"
            "tests/test_batch_job_registry.py::test_provider_embedding_rejects_mixed_zdr_policy_before_provider_io"
            "tests/test_embeddings_model_pool_http_honesty.py::test_batch_terminal_failure_fails_over_without_restoring_endpoint_health"
            "tests/test_model_discovery.py::test_discovery_default_has_independent_finite_network_deadline"
            "tests/test_provider_bootstrap.py::test_bootstrap_first_pass_preserves_provider_failure_domain_diversity"
          )
          for test_name in "${tests[@]}"; do
            set +e
            uv run --locked --extra api --extra db --extra queue --group dev \
              python -m pytest -q "$test_name"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "::error::${test_name} was already GREEN before the causal repair"
              exit 1
            fi
          done

      - name: Apply smallest causal GREEN repair
        run: |
          set -euo pipefail
          uv run --locked --extra api --extra db --extra queue --group dev \
            python scripts/ci/source_fix_971_review_quality.py green
          python -m compileall -q contextual_orchestrator
          git diff --check

      - name: Verify focused review regressions GREEN
        run: |
          set -euo pipefail
          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q \
              tests/test_batch_job_registry.py::test_recovered_provider_embedding_restores_persisted_request_context \
              tests/test_batch_job_registry.py::test_provider_embedding_rejects_mixed_zdr_policy_before_provider_io \
              tests/test_embeddings_model_pool_http_honesty.py::test_batch_terminal_failure_fails_over_without_restoring_endpoint_health \
              tests/test_model_discovery.py::test_discovery_default_has_independent_finite_network_deadline \
              tests/test_provider_bootstrap.py::test_bootstrap_first_pass_preserves_provider_failure_domain_diversity \
              tests/test_endpoint_race_terminal_provenance.py
          git diff --check

      - name: Verify broader owner surfaces
        run: |
          set -euo pipefail
          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q \
              tests/test_batch_job_registry.py \
              tests/test_provider_embedding_batch_backend.py \
              tests/test_batch_embeddings.py \
              tests/test_cost_router.py \
              tests/test_embeddings_model_pool_http_honesty.py \
              tests/test_model_discovery.py \
              tests/test_provider_bootstrap.py \
              tests/test_provider_bootstrap_boundaries.py \
              tests/test_endpoint_race.py \
              tests/test_endpoint_race_terminal_provenance.py
          git diff --check

      - name: Verify full repository suite
        run: |
          set -euo pipefail
          uv run --locked --extra api --extra db --extra queue --group dev python -m pytest -q
          git diff --check

      - name: Remove completed one-shot repair machinery
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/source-fix-971-review-quality.yml \
            scripts/ci/source_fix_971_review_quality.py
          if git ls-files | grep -E '(^|/)(source-fix-971|source_fix_971)'; then
            echo "::error::temporary PR971 repair machinery remains tracked"
            exit 1
          fi
          git diff --check

      - name: Publish exact non-force successor with workflow-starting credential
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          PRIMARY_PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
          FALLBACK_PUSH_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN }}
        run: |
          set -euo pipefail
          workflow_push_token="${PRIMARY_PUSH_TOKEN:-${FALLBACK_PUSH_TOKEN:-}}"
          if [ -z "$workflow_push_token" ]; then
            echo "::error::No workflow-starting mutation credential is configured; refusing github.token publication."
            exit 1
          fi
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(review): restore runtime and discovery authority"
          git remote set-url origin "https://x-access-token:${workflow_push_token}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
