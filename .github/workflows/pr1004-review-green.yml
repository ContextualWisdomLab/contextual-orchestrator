name: PR 1004 review findings GREEN

on:
  push:
    branches:
      - fix/structured-output-distinct-fallback-998
    paths:
      - .github/workflows/pr1004-review-green.yml

permissions:
  contents: write

concurrency:
  group: pr1004-review-findings-writer
  cancel-in-progress: false

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: Apply causal repairs, verify, self-remove, and commit locally
        env:
          TARGET_BRANCH: fix/structured-output-distinct-fallback-998
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python - <<'PY'
          from pathlib import Path

          from scripts.ci import pr1004_review_transform as transform

          transform.transform_orchestrator()

          source_text = transform.SOURCE.read_text(encoding="utf-8")
          old_413 = (
              "                    structured_attempt_steps.append(repair_step)\n"
              "                    next_agent = next_structured_candidate(final_agent)\n"
              "                    enforce_structured_budget()\n"
              "                    final_agent = next_agent\n"
          )
          new_413 = (
              "                    structured_attempt_steps.append(repair_step)\n"
              "                    request_exclusions.add(final_agent.id)\n"
              "                    next_agent = next(\n"
              "                        (\n"
              "                            candidate\n"
              "                            for candidate in synthesis_candidates\n"
              "                            if candidate.id not in request_exclusions\n"
              "                        ),\n"
              "                        None,\n"
              "                    )\n"
              "                    if next_agent is None:\n"
              "                        persist_structured_record(\n"
              "                            \"\", failure_code=exc.error_code\n"
              "                        )\n"
              "                        raise\n"
              "                    enforce_structured_budget()\n"
              "                    final_agent = next_agent\n"
          )
          source_text = transform.replace_once(
              source_text, old_413, new_413, "repair 413 terminal taxonomy"
          )
          transform.SOURCE.write_text(source_text, encoding="utf-8")

          adr_text = transform.ADR.read_text(encoding="utf-8")
          adr_text = transform.replace_once(
              adr_text,
              "## References\n",
              (
                  "## Research artifact reuse and redistribution\n\n"
                  "This correctness repair does not introduce a new routing objective; it\n"
                  "restores ADR 0035's already-accepted bounded candidate-recovery semantics.\n"
                  "A repair-only request-size rejection retires that virtual candidate and\n"
                  "starts a fresh synthesis only on another already-eligible candidate; when\n"
                  "none remains, the request-size error remains the terminal classification\n"
                  "rather than being rewritten as structured-output exhaustion. Previously\n"
                  "excluded candidates are never retried.\n\n"
                  "The relevant routing literature is already committed in this repository as\n"
                  "redistributable artifacts: [`RouteLLM`](../../papers/routellm-routing-2406.18665.pdf)\n"
                  "and [`Hybrid LLM`](../../papers/hybrid-llm-query-routing-2404.14618.pdf).\n"
                  "Their cost/quality-aware routing evidence supports selecting among eligible\n"
                  "model candidates; it does not authorize bypassing caller endpoint, privacy,\n"
                  "or budget constraints. Conductor and TRINITY remain cite-link-summary\n"
                  "references in `docs/papers/README.md` because this repository has not\n"
                  "independently established a redistribution grant for those newer preprints;\n"
                  "duplicating their PDFs in this PR would therefore weaken, not strengthen,\n"
                  "the repository's copyright rule.\n\n"
                  "## References\n"
              ),
              "ADR research artifact section",
          )
          transform.ADR.write_text(adr_text, encoding="utf-8")

          change_text = transform.CHANGELOG.read_text(encoding="utf-8")
          unreleased_heading = "## [0.2.0] - Unreleased\n"
          unreleased = change_text.index(unreleased_heading)
          marker = "### Fixed\n\n"
          fixed = change_text.index(marker, unreleased + len(unreleased_heading))
          note = (
              "### Fixed\n\n"
              "- Structured-output review follow-up now charges already-incurred synthesis\n"
              "  and repair usage before propagating a budget stop, keeps failed workflow\n"
              "  evidence queryable without counting it as a normal recent/completed KPI,\n"
              "  and binds a repair to the candidate whose synthesis failed. A repair-only\n"
              "  413 retires that candidate and starts a fresh synthesis on the next\n"
              "  already-eligible candidate instead of forwarding the repair prompt across\n"
              "  providers. If no eligible candidate remains, the original request-too-large\n"
              "  classification is preserved instead of being rewritten as structured-output\n"
              "  exhaustion. Existing endpoint/ZDR/cost/privacy eligibility remains unchanged\n"
              "  (Devin Review, PR #1004).\n"
          )
          change_text = change_text[:fixed] + note + change_text[fixed + len(marker):]
          transform.CHANGELOG.write_text(change_text, encoding="utf-8")

          baseline = Path("docs/product-technical-gap-baseline.md")
          baseline_text = baseline.read_text(encoding="utf-8")
          heading = "# Contextual Orchestrator: Product & Technical Gap Baseline\n"
          rca = (
              "\n## 2026-09-02 PR #1004 exact-head structured repair 413 RCA\n\n"
              "- **Affected exact head:** predecessor `58c159802d85fe6e8f7b812317560cb1a65133aa` "
              "failed writer run `33530310548`, job `99931499707` after `138 passed, 1 failed` "
              "in the focused suite.\n"
              "- **Exact evidence:** `tests/test_model_judge.py::test_structured_repair_does_not_retry_request_excluded_model` "
              "established a stale candidate already excluded by a 404, a live candidate producing "
              "invalid structured output, and a repair-only 413. The generated handler retired the "
              "live candidate and called the generic structured-exhaustion helper, incorrectly raising "
              "`StructuredOutputExhaustedError` instead of preserving `ProviderRequestTooLargeError`.\n"
              "- **Classification:** deterministic code-generation/repair-path defect in this repository, "
              "not a provider/network transient, fixture race, missing permission, or expected fail-closed "
              "governance result.\n"
              "- **Causal fix:** keep the repair prompt candidate-bound; on repair-only 413, retire that "
              "candidate and start a fresh synthesis only on another already-eligible, non-excluded candidate. "
              "If none remains, persist the request-size failure and re-raise the original typed 413. Never "
              "retry a request-excluded predecessor.\n"
              "- **Verification:** this writer commits only after the focused routing suite, broad suite, "
              "compile checks, and `git diff --check` pass. Required exact-head GitHub Checks/reviews still "
              "must complete; pending evidence is not treated as passing.\n"
          )
          baseline_text = transform.replace_once(
              baseline_text, heading, heading + rca, "product gap baseline heading"
          )
          baseline.write_text(baseline_text, encoding="utf-8")
          PY

          python -m py_compile contextual_orchestrator/orchestrator.py

          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q \
            tests/test_structured_output_distinct_fallback.py \
            tests/test_model_judge.py \
            tests/test_passthrough_provider_failover.py \
            tests/test_budget_enforcement.py \
            tests/test_persistence.py \
            tests/test_paper_contracts.py

          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q \
            --deselect 'tests/test_orchestrated_responses_stream.py::test_virtual_models_stream_openai_reasoning_summaries[orchestrator/free]' \
            --deselect tests/test_orchestrated_responses_stream.py::test_http_virtual_responses_preserves_message_array_and_sampling_controls \
            --deselect tests/test_orchestrated_responses_stream.py::test_stream_failure_emits_terminal_responses_event

          python -m compileall -q contextual_orchestrator tests
          git diff --check

          rm -f \
            scripts/ci/pr1004_review_transform.py \
            .github/workflows/pr1004-review-red.yml \
            .github/workflows/pr1004-review-green.yml
          git diff --check

          git config user.name "CWL PR 1004 review repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(structured-output): close review recovery gaps"

      - name: Push verified repair without persisted credentials
        env:
          TARGET_BRANCH: fix/structured-output-distinct-fallback-998
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:${TARGET_BRANCH}"
