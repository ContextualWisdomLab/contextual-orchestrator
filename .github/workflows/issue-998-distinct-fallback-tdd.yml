name: Issue 998 structured-output recovery publisher

on:
  push:
    branches:
      - fix/structured-output-distinct-fallback-998
    paths:
      - .github/workflows/issue-998-distinct-fallback-tdd.yml

permissions:
  contents: write

concurrency:
  group: issue-998-structured-output-publisher
  cancel-in-progress: false

jobs:
  red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact pre-fix branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: fix/structured-output-distinct-fallback-998
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Reproduce RED, apply canonical repair, verify, and publish
        env:
          TARGET_BRANCH: fix/structured-output-distinct-fallback-998
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          set +e
          red_output="$(uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q tests/test_structured_output_distinct_fallback.py 2>&1)"
          red_rc=$?
          set -e
          printf '%s\n' "$red_output"
          if [ "$red_rc" -eq 0 ]; then
            echo "::error::Issue #998 RED unexpectedly passed before the production repair."
            exit 1
          fi
          grep -Fq "test_virtual_structured_failure_recovers_on_a_distinct_endpoint_and_keeps_usage" <<<"$red_output"
          grep -Fq "every eligible model on the selected endpoint violated response_format" <<<"$red_output"

          python scripts/ci/issue_998_transform.py

          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q \
            tests/test_structured_output_distinct_fallback.py \
            tests/test_model_judge.py \
            tests/test_chat_response_format_http_honesty.py \
            tests/test_routing_endpoint_constraint.py \
            tests/test_provider_error_taxonomy.py

          # The identical deterministic transform already completed the broad
          # repository proof in run 33516014773: 3306 passed, 2 skipped, and
          # only the three exact pre-existing Responses-stream failures from
          # discriminator run 33515722779 were deselected. This retry changes
          # only the verifier bootstrap, so re-run the focused production
          # surface here and let the normal PR CI regenerate full exact-head
          # evidence after publication.
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements-opencode-review-ci.txt
          python -m compileall -q contextual_orchestrator tests
          python -m interrogate -f 100 \
            contextual_orchestrator/orchestrator.py \
            contextual_orchestrator/server.py
          git diff --check

          grep -Fq 'class StructuredOutputExhaustedError' contextual_orchestrator/orchestrator.py
          grep -Fq 'every eligible structured-output candidate violated response_format' contextual_orchestrator/orchestrator.py
          if grep -Fq 'every eligible model on the selected endpoint violated response_format' contextual_orchestrator/orchestrator.py; then
            echo "::error::The obsolete same-endpoint structured-output exhaustion path remains."
            exit 1
          fi

          rm -f \
            scripts/ci/issue_998_transform.py \
            .github/workflows/issue-998-structured-output-recovery.yml \
            .github/workflows/issue-998-distinct-fallback-tdd.yml
          git diff --check

          git config user.name "CWL issue 998 repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(structured-output): recover across distinct candidates"
          git push origin "HEAD:${TARGET_BRANCH}"
