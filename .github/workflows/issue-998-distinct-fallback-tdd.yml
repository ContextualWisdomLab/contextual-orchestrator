name: Issue 998 full-suite failure discriminator

on:
  push:
    branches:
      - fix/structured-output-distinct-fallback-998
    paths:
      - .github/workflows/issue-998-distinct-fallback-tdd.yml

permissions:
  contents: read

concurrency:
  group: issue-998-full-suite-failure-discriminator
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pre-fix branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: fix/structured-output-distinct-fallback-998
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Replay unrelated-looking Responses stream failures before transform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Production files remain unmodified in this discriminator. If these
          # fail here too, they are not caused by issue #998's transform.
          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q \
            'tests/test_orchestrated_responses_stream.py::test_virtual_models_stream_openai_reasoning_summaries[orchestrator/free]' \
            tests/test_orchestrated_responses_stream.py::test_http_virtual_responses_preserves_message_array_and_sampling_controls \
            tests/test_orchestrated_responses_stream.py::test_stream_failure_emits_terminal_responses_event
