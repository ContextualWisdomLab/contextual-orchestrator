name: Issue 998 distinct structured-output fallback TDD

on:
  push:
    branches:
      - fix/structured-output-distinct-fallback-998
    paths:
      - .github/workflows/issue-998-distinct-fallback-tdd.yml

permissions:
  contents: write

concurrency:
  group: issue-998-distinct-structured-output-writer
  cancel-in-progress: false

jobs:
  red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: fix/structured-output-distinct-fallback-998
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.5"

      - name: Verify RED, implement, and prove GREEN
        env:
          TARGET_BRANCH: fix/structured-output-distinct-fallback-998
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          set +e
          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q tests/test_structured_output_distinct_fallback.py
          red_rc=$?
          set -e
          if [ "$red_rc" -eq 0 ]; then
            echo "::error::Issue #998 RED tests unexpectedly passed before the production repair."
            exit 1
          fi
          echo "::notice::Issue #998 RED reproduced on exact current-main ancestry."

          python - <<'PY'
          from pathlib import Path

          path = Path("contextual_orchestrator/orchestrator.py")
          text = path.read_text(encoding="utf-8")

          class_marker = '''class ProviderResponseError(RuntimeError):
              """Raised for a provider response that cannot become a safe completion."""


          class ProviderRequestTooLargeError(ProviderUpstreamError):
          '''
          class_replacement = '''class ProviderResponseError(RuntimeError):
              """Raised for a provider response that cannot become a safe completion."""


          class StructuredOutputExhaustedError(ProviderResponseError):
              """Raised after every eligible structured-output candidate violates its contract."""


          class ProviderRequestTooLargeError(ProviderUpstreamError):
          '''
          if text.count(class_marker) != 1:
              raise SystemExit(f"ProviderResponseError anchor count={text.count(class_marker)}")
          text = text.replace(class_marker, class_replacement, 1)

          start = text.index("    def _orchestrated_provider_completion(")
          end = text.index("\n    def ", start + 10)
          segment = text[start:end]

          marker = '''        response_format = chat_body.get("response_format")
              synthesis_started = time.perf_counter()
              while True:
          '''
          replacement = '''        response_format = chat_body.get("response_format")
              structured_attempt_steps: list[dict[str, Any]] = []
              synthesis_started = time.perf_counter()
              while True:
          '''
          if segment.count(marker) != 1:
              raise SystemExit(f"structured loop anchor count={segment.count(marker)}")
          segment = segment.replace(marker, replacement, 1)

          id_marker = '                "id": len(workflow["trace"]),\n'
          id_replacement = (
              '                "id": len(workflow["trace"]) + len(structured_attempt_steps),\n'
          )
          if segment.count(id_marker) != 1:
              raise SystemExit(f"synthesis id anchor count={segment.count(id_marker)}")
          segment = segment.replace(id_marker, id_replacement, 1)

          contract_marker = '''            repair_step: dict[str, Any] | None = None
              contract_error = _structured_output_error(synthesis_output, response_format)
              if contract_error == "schema_missing":
          '''
          contract_replacement = '''            repair_step: dict[str, Any] | None = None
              contract_error = _structured_output_error(synthesis_output, response_format)
              synthesis_step["validation_outcome"] = contract_error or "accepted"
              if contract_error == "schema_missing":
          '''
          if segment.count(contract_marker) != 1:
              raise SystemExit(f"contract outcome anchor count={segment.count(contract_marker)}")
          segment = segment.replace(contract_marker, contract_replacement, 1)

          budget_marker = '''            in_flight_tokens, in_flight_cost = self._trace_budget_spend(
                  [*workflow["trace"], synthesis_step]
              )
          '''
          budget_replacement = '''            in_flight_tokens, in_flight_cost = self._trace_budget_spend(
                  [*workflow["trace"], *structured_attempt_steps, synthesis_step]
              )
          '''
          if segment.count(budget_marker) != 1:
              raise SystemExit(f"pre-repair budget anchor count={segment.count(budget_marker)}")
          segment = segment.replace(budget_marker, budget_replacement, 1)

          repair_marker = '''                repair_step = {
                      "id": synthesis_step["id"] + 1,
                      "role": "repair",
                      "agent_id": final_agent.id,
                      "subtask": "Strict JSON Schema repair",
                      "access": [synthesis_step["id"]],
                      "latency_ms": round((time.perf_counter() - repair_started) * 1000, 2),
                      "output": repaired_output,
                  }
          '''
          repair_replacement = '''                repair_step = {
                      "id": synthesis_step["id"] + 1,
                      "role": "repair",
                      "agent_id": final_agent.id,
                      "subtask": "Strict JSON Schema repair",
                      "access": [synthesis_step["id"]],
                      "latency_ms": round((time.perf_counter() - repair_started) * 1000, 2),
                      "output": repaired_output,
                      "validation_outcome": "accepted",
                  }
          '''
          if segment.count(repair_marker) != 1:
              raise SystemExit(f"repair success anchor count={segment.count(repair_marker)}")
          segment = segment.replace(repair_marker, repair_replacement, 1)

          failure_marker = '''            failed_agent = final_agent
              self._record_failure(failed_agent.id)
          '''
          failure_replacement = '''            failed_repair_step: dict[str, Any] = {
                  "id": synthesis_step["id"] + 1,
                  "role": "repair",
                  "agent_id": final_agent.id,
                  "subtask": "Strict JSON Schema repair",
                  "access": [synthesis_step["id"]],
                  "latency_ms": round((time.perf_counter() - repair_started) * 1000, 2),
                  "output": repaired_output,
                  "validation_outcome": repair_error,
              }
              if isinstance(repaired.get("usage"), dict):
                  failed_repair_step["usage"] = _canonical_provider_usage(
                      repaired["usage"], responses=response_request
                  )
              structured_attempt_steps.extend((synthesis_step, failed_repair_step))
              in_flight_tokens, in_flight_cost = self._trace_budget_spend(
                  [*workflow["trace"], *structured_attempt_steps]
              )
              self._raise_if_spend_budget_exceeded(
                  additional_output_tokens=in_flight_tokens,
                  additional_cost_usd=in_flight_cost,
              )

              failed_agent = final_agent
              self._record_failure(failed_agent.id)
          '''
          if segment.count(failure_marker) != 1:
              raise SystemExit(f"failed-repair anchor count={segment.count(failure_marker)}")
          segment = segment.replace(failure_marker, failure_replacement, 1)

          endpoint_marker = '''            request_exclusions.add(failed_agent.id)
              failed_endpoint = failed_agent.base_url.rstrip("/").casefold()
              next_agent = next(
                  (
                      candidate
                      for candidate in synthesis_candidates
                      if candidate.id not in request_exclusions
                      and candidate.base_url.rstrip("/").casefold() == failed_endpoint
                  ),
                  None,
              )
              if next_agent is None:
                  raise ProviderResponseError(
                      "every eligible model on the selected endpoint violated response_format"
                  )
          '''
          endpoint_replacement = '''            request_exclusions.add(failed_agent.id)
              next_agent = next(
                  (
                      candidate
                      for candidate in synthesis_candidates
                      if candidate.id not in request_exclusions
                  ),
                  None,
              )
              if next_agent is None:
                  raise StructuredOutputExhaustedError(
                      "every eligible structured-output candidate violated response_format"
                  )
          '''
          if segment.count(endpoint_marker) != 1:
              raise SystemExit(f"same-endpoint fallback anchor count={segment.count(endpoint_marker)}")
          segment = segment.replace(endpoint_marker, endpoint_replacement, 1)

          trace_marker = '''        trace = [
              *workflow["trace"],
              synthesis_step,
              *([repair_step] if repair_step is not None else []),
          ]
          '''
          trace_replacement = '''        trace = [
              *workflow["trace"],
              *structured_attempt_steps,
              synthesis_step,
              *([repair_step] if repair_step is not None else []),
          ]
          '''
          if segment.count(trace_marker) != 1:
              raise SystemExit(f"final trace anchor count={segment.count(trace_marker)}")
          segment = segment.replace(trace_marker, trace_replacement, 1)

          text = text[:start] + segment + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q \
            tests/test_structured_output_distinct_fallback.py \
            tests/test_model_judge.py \
            tests/test_chat_response_format_http_honesty.py \
            tests/test_routing_endpoint_constraint.py \
            tests/test_candidate_routing_controls.py \
            tests/test_file_structured_orchestration.py

          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m ruff check \
            contextual_orchestrator/orchestrator.py \
            tests/test_structured_output_distinct_fallback.py

          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q

          git diff --check
          git add contextual_orchestrator/orchestrator.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(structured-output): recover with distinct eligible candidates"
          git push origin "HEAD:${TARGET_BRANCH}"
