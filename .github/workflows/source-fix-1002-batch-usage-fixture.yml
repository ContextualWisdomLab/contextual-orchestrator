name: Source fix PR1002 batch usage fixture

on:
  push:
    branches:
      - fix/orchestrated-responses-stream-and-spend-analytics-20260901
    paths:
      - scripts/source_fix_1002_batch_usage_fixture.py
      - .github/workflows/source-fix-1002-batch-usage-fixture.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/orchestrated-responses-stream-and-spend-analytics-20260901
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.12.5'
      - name: Apply exact fixture repair
        run: python scripts/source_fix_1002_batch_usage_fixture.py
      - name: Verify focused accounting contract
        run: uv run --locked --extra api --extra db --extra queue --group dev python -m pytest -q tests/test_batch_optimizer.py tests/test_model_judge_usage_provenance_regression.py tests/test_provider_usage_capture.py tests/test_spend_analytics.py
      - name: Remove one-shot artifacts and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/source_fix_1002_batch_usage_fixture.py .github/workflows/source-fix-1002-batch-usage-fixture.yml
          git config user.name 'CWL source-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/test_batch_optimizer.py scripts/source_fix_1002_batch_usage_fixture.py .github/workflows/source-fix-1002-batch-usage-fixture.yml
          git diff --cached --check
          git commit -m 'test(batch): isolate provider usage fixture from optional judge'
          git fetch origin fix/orchestrated-responses-stream-and-spend-analytics-20260901
          remote_head="$(git rev-parse origin/fix/orchestrated-responses-stream-and-spend-analytics-20260901)"
          if [ "$remote_head" != "$(git rev-parse HEAD^)" ]; then
            git merge --no-edit "$remote_head"
            uv run --locked --extra api --extra db --extra queue --group dev python -m pytest -q tests/test_batch_optimizer.py tests/test_model_judge_usage_provenance_regression.py tests/test_provider_usage_capture.py tests/test_spend_analytics.py
          fi
          git push origin HEAD:fix/orchestrated-responses-stream-and-spend-analytics-20260901
