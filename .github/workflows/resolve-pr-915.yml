name: Resolve PR 915 against protected main

# Diagnostic retry: report bounded diff3 hunks for executable conflicts.
on:
  push:
    branches: [chore/ruff-cleanup]

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    uses: ContextualWisdomLab/contextual-orchestrator/.github/workflows/reusable-pr-conflict-resolver.yml@automation/one-shot-pr-conflict-resolver
    with:
      pr_number: 915
      branch: chore/ruff-cleanup
      caller_file: .github/workflows/resolve-pr-915.yml
