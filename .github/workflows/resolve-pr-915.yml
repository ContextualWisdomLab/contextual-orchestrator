name: Resolve PR 915 semantically against protected main

on:
  push:
    branches: [chore/ruff-cleanup]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: resolve-pr-915-semantic
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main and retain the Ruff-preferred Callable import
        env:
          EXPECTED_BRANCH: chore/ruff-cleanup
          CALLER_FILE: .github/workflows/resolve-pr-915.yml
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e
          if [[ $merge_rc -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            unsafe=()
            for path in "${conflicts[@]}"; do
              case "$path" in
                *.md|*.mdx)
                  tmpdir="$(mktemp -d)"
                  git show ":2:$path" > "$tmpdir/ours"
                  git show ":1:$path" > "$tmpdir/base"
                  git show ":3:$path" > "$tmpdir/theirs"
                  git merge-file --union "$tmpdir/ours" "$tmpdir/base" "$tmpdir/theirs"
                  cp "$tmpdir/ours" "$path"
                  rm -rf "$tmpdir"
                  git add "$path"
                  ;;
                contextual_orchestrator/model_group.py)
                  git checkout --conflict=diff3 -- "$path"
                  ;;
                *) unsafe+=("$path") ;;
              esac
            done
            if (( ${#unsafe[@]} )); then
              printf 'Unexpected conflicts:\n%s\n' "${unsafe[*]}"
              git merge --abort
              exit 1
            fi

            python - <<'PY'
          from pathlib import Path

          path = Path("contextual_orchestrator/model_group.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          output: list[str] = []
          cursor = 0
          conflicts = 0
          while cursor < len(lines):
              if not lines[cursor].startswith("<<<<<<<"):
                  output.append(lines[cursor])
                  cursor += 1
                  continue
              ours_start = cursor + 1
              base_marker = next(i for i in range(ours_start, len(lines)) if lines[i].startswith("|||||||"))
              split_marker = next(i for i in range(base_marker + 1, len(lines)) if lines[i].startswith("======="))
              end_marker = next(i for i in range(split_marker + 1, len(lines)) if lines[i].startswith(">>>>>>>"))
              ours = "".join(lines[ours_start:base_marker])
              theirs = "".join(lines[split_marker + 1:end_marker])
              if ours != "from collections.abc import Callable\n":
                  raise RuntimeError(f"unexpected Ruff side: {ours!r}")
              if theirs != "from typing import Callable\n":
                  raise RuntimeError(f"unexpected main side: {theirs!r}")
              output.append(ours)
              conflicts += 1
              cursor = end_marker + 1
          if conflicts != 1:
              raise RuntimeError(f"expected one import conflict, found {conflicts}")
          merged = "".join(output)
          if any(marker in merged for marker in ("<<<<<<<", "|||||||", "=======", ">>>>>>>")):
              raise RuntimeError("conflict marker remains")
          path.write_text(merged, encoding="utf-8")
          PY
            git add contextual_orchestrator/model_group.py
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          rm -f "$CALLER_FILE"
          git add -A
          git diff --cached --check
          python -m compileall -q contextual_orchestrator
          git commit -m "chore: merge protected main into PR #915"
          git push origin "HEAD:$EXPECTED_BRANCH"
