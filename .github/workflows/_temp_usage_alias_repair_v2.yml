name: One-shot Responses usage alias repair v2

on:
  push:
    branches:
      - fix/orchestrated-responses-stream-and-spend-analytics-20260901

permissions:
  contents: write

concurrency:
  group: responses-usage-alias-repair-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout writer branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Patch usage counter aliases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("contextual_orchestrator/orchestrator.py")
          text = path.read_text(encoding="utf-8")
          old = '''    @staticmethod
    def _usage_is_reported_token_mapping(usage: Any) -> bool:
        """Validate the canonical non-negative token fields of reported usage."""
        return isinstance(usage, Mapping) and all(
            type(usage.get(key)) is int and usage[key] >= 0
            for key in ("prompt_tokens", "completion_tokens", "total_tokens")
        )
'''
          new = '''    @staticmethod
    def _usage_is_reported_token_mapping(usage: Any) -> bool:
        """Validate complete non-negative Chat or Responses token counters."""
        if not isinstance(usage, Mapping):
            return False
        return all(
            type(value) is int and value >= 0
            for value in (
                usage.get("prompt_tokens", usage.get("input_tokens")),
                usage.get("completion_tokens", usage.get("output_tokens")),
                usage.get("total_tokens"),
            )
        )
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one usage helper anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m py_compile contextual_orchestrator/orchestrator.py

      - name: Prove focused regression in locked project environment
        run: uv run --locked --extra api --extra db --extra queue --group dev python -m pytest -q tests/test_model_judge_usage_provenance_regression.py

      - name: Commit source repair and remove one-shot writer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_temp_usage_alias_repair_v2.yml
          git add contextual_orchestrator/orchestrator.py tests/test_model_judge_usage_provenance_regression.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(accounting): accept Responses usage counters"
          git push origin "HEAD:${GITHUB_REF_NAME}"
