name: Patch reusable resolver union exit handling

on:
  push:
    branches: [automation/one-shot-pr-conflict-resolver]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Accept merge-file union conflict count while validating output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/reusable-pr-conflict-resolver.yml')
          text = path.read_text(encoding='utf-8')
          old = 'git merge-file --union "$tmpdir/ours" "$tmpdir/base" "$tmpdir/theirs"'
          new = old + ' || true'
          if text.count(old) != 1:
              raise SystemExit(f'expected one union anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/patch-reusable-union-exit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: accept union conflict-count exit status"
          git push origin HEAD:automation/one-shot-pr-conflict-resolver
