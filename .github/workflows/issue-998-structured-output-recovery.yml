name: Issue 998 structured-output recovery

on:
  push:
    branches:
      - fix/structured-output-distinct-fallback-998
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-998-structured-output-recovery
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/contextual-orchestrator'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Confirm the cross-endpoint regression is RED
        run: |
          set -euo pipefail
          set +e
          output="$(uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q tests/test_structured_output_distinct_fallback.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -eq 0 ]; then
            echo "The regression suite unexpectedly passed before the production repair." >&2
            exit 1
          fi
          grep -Fq \
            "test_virtual_structured_failure_recovers_on_a_distinct_endpoint_and_keeps_usage" \
            <<<"$output"

      - name: Apply the bounded core repair
        run: python scripts/ci/issue_998_transform.py

      - name: Run focused structured-output and routing tests
        run: |
          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q \
            tests/test_structured_output_distinct_fallback.py \
            tests/test_model_judge.py \
            tests/test_chat_response_format_http_honesty.py \
            tests/test_candidate_routing_controls.py \
            tests/test_provider_error_taxonomy.py

      - name: Run full repository suite
        run: |
          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q

      - name: Verify source and documentation quality
        run: |
          set -euo pipefail
          python -m compileall -q contextual_orchestrator tests
          uv run --locked --group dev python -m interrogate -f 100 \
            contextual_orchestrator/orchestrator.py \
            contextual_orchestrator/server.py
          git diff --check

      - name: Remove one-shot writer and publish the reviewed tree
        env:
          BRANCH_NAME: fix/structured-output-distinct-fallback-998
        run: |
          set -euo pipefail
          rm -f \
            scripts/ci/issue_998_transform.py \
            .github/workflows/issue-998-structured-output-recovery.yml
          git diff --check
          git config user.name "CWL issue 998 repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(structured-output): recover across distinct candidates"
          git push origin "HEAD:${BRANCH_NAME}"
