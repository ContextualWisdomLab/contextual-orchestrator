name: OpenCode hourly maintenance loop

# Hourly autonomous maintenance: an OpenCode agent whose model traffic is
# served by THIS repository's gateway (contextual-orchestrator) with
# auto-discovered providers and operator-managed model-group routing.
# The agent works the PR queue (review -> fix -> recheck -> merge), root-causes
# failing checks, and advances docs/product-technical-gap-baseline.md items.

on:
  schedule:
    - cron: "23 * * * *" # hourly at :23 UTC; offset avoids top-of-hour CI storms
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: opencode-hourly-loop
  cancel-in-progress: false

jobs:
  external-pr-review:
    name: Review external PR diffs without secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: none
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate untrusted fork diffs without executing them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name != env.GITHUB_REPOSITORY) | [.number, .head.sha] | @tsv' |
          while IFS=$'\t' read -r pr_number head_sha; do
            [ -n "$pr_number" ] || continue
            git fetch --no-tags origin "pull/${pr_number}/head:refs/review/external-${pr_number}"
            test "$(git rev-parse "refs/review/external-${pr_number}")" = "$head_sha"
            git diff --check "origin/main...refs/review/external-${pr_number}"
            printf 'PR #%s head %s: diff integrity passed\n' "$pr_number" "$head_sha" >> "$GITHUB_STEP_SUMMARY"
          done

  loop:
    name: Run OpenCode maintenance agent through the local gateway
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write # required for reviewed branch fixes; scoped to this job
      pull-requests: write
      issues: write
    env:
      # Bootstrap transport only: these flow into the process-local KV registry
      # (see scripts/ci/serve_seeded_gateway.py); the gateway never reads them
      # from the environment again after seeding. See docs/kv-credentials.md.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
      BYTEZ_API_KEY: ${{ secrets.BYTEZ_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      NVIDIA_NIM_API_KEY_SUB: ${{ secrets.NVIDIA_NIM_API_KEY_SUB }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: true # the agent needs to push fixes/branches

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node for the OpenCode CLI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned runtime dependencies
        run: python -m pip install --require-hashes -r fuzz/requirements-property.txt

      - name: Install OpenCode CLI
        run: |
          npm ci --ignore-scripts
          node node_modules/opencode-ai/postinstall.mjs

      - name: Generate ephemeral loopback gateway token
        run: |
          gateway_token=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$gateway_token"
          echo "GATEWAY_BEARER_TOKEN=$gateway_token" >> "$GITHUB_ENV"

      - name: Start the contextual-orchestrator gateway with auto-discovery
        run: |
          set -euo pipefail
          nohup python -m scripts.ci.serve_seeded_gateway \
            --serve \
            --agents examples/agents.mock.json \
            --auto-discover-model-agents \
            --auth-token "$GATEWAY_BEARER_TOKEN" \
            --host 127.0.0.1 --port 8000 \
            > /tmp/gateway.log 2>&1 &
          for _attempt in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ${GATEWAY_BEARER_TOKEN}" \
              http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "gateway ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::gateway did not become healthy"; tail -50 /tmp/gateway.log; exit 1

      - name: Point OpenCode at the local gateway
        run: |
          set -euo pipefail
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<JSON
          {
            "\$schema": "https://opencode.ai/config.json",
            "model": "contextual_orchestrator_gateway/orchestrator/auto",
            "provider": {
              "contextual_orchestrator_gateway": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Contextual Orchestrator Gateway",
                "options": {
                  "baseURL": "http://127.0.0.1:8000/v1",
                  "apiKey": "${GATEWAY_BEARER_TOKEN}"
                },
                "models": {
                  "orchestrator/auto": { "name": "measured automatic orchestration" }
                }
              }
            }
          }
          JSON

      - name: Build trusted same-repository PR allowlist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY) | .number' \
            > /tmp/trusted-pr-numbers.txt

      - name: Run the hourly loop agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./node_modules/.bin/opencode run --model contextual_orchestrator_gateway/orchestrator/auto \
            "$(cat .github/opencode/hourly-loop-prompt.md)"

      - name: Dump gateway log on failure
        if: failure()
        run: tail -100 /tmp/gateway.log
