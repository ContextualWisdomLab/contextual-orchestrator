name: PR 1004 review findings RED

on:
  push:
    branches:
      - fix/structured-output-distinct-fallback-998
    paths:
      - .github/workflows/pr1004-review-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: fix/structured-output-distinct-fallback-998
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: Require the three review regressions to fail before production repair
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q \
            tests/test_structured_output_distinct_fallback.py::test_structured_budget_rejection_persists_incurred_usage_without_completed_run \
            tests/test_structured_output_distinct_fallback.py::test_repair_413_retires_candidate_and_restarts_fresh_synthesis \
            tests/test_structured_output_distinct_fallback.py::test_failed_structured_run_stays_queryable_but_out_of_recent_completed_metrics 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -eq 0 ]; then
            echo "::error::Review regressions unexpectedly passed before the production fix."
            exit 1
          fi
          grep -Fq "3 failed" <<<"$output"
          echo "::notice::All three review findings reproduced RED on production code."
