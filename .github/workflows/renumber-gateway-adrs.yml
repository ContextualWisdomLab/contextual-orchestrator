name: Verify gateway ADR sequence repair

on:
  push:
    branches:
      - fix/auto-reasoning-effort-contract-rebased
    paths:
      - .github/workflows/renumber-gateway-adrs.yml

permissions:
  contents: read

concurrency:
  group: renumber-gateway-adrs
  cancel-in-progress: false

jobs:
  prepare:
    name: Patch and test with read-only token
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      base_sha: ${{ steps.patch.outputs.base_sha }}
      patch_b64: ${{ steps.patch.outputs.patch_b64 }}
    steps:
      - name: Checkout exact triggering commit without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Renumber and consolidate gateway ADRs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match for {old!r}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          gateway_old = Path("docs/planning/adrs/0010-gateway-only-provider-contract.md")
          gateway_new = Path("docs/planning/adrs/0012-gateway-only-provider-contract.md")
          gateway = gateway_old.read_text(encoding="utf-8")
          if gateway.count('id: "0010"') != 1:
              raise SystemExit("gateway ADR id mismatch")
          gateway = gateway.replace('id: "0010"', 'id: "0012"', 1)
          gateway_new.write_text(gateway, encoding="utf-8")
          gateway_old.unlink()

          reasoning_old = Path("docs/planning/adrs/0011-paper-grounded-adaptive-reasoning-policy.md")
          reasoning_new = Path("docs/planning/adrs/0013-paper-grounded-adaptive-reasoning-policy.md")
          reasoning = reasoning_old.read_text(encoding="utf-8")
          replacements = (
              ('id: "0011"', 'id: "0013"'),
              (
                  'path: "docs/planning/adrs/0010-gateway-only-provider-contract.md"',
                  'path: "docs/planning/adrs/0012-gateway-only-provider-contract.md"',
              ),
              ('in ADR 0010.', 'in ADR 0012.'),
          )
          for old, new in replacements:
              if reasoning.count(old) != 1:
                  raise SystemExit(f"reasoning ADR expected one {old!r}")
              reasoning = reasoning.replace(old, new, 1)
          reasoning_new.write_text(reasoning, encoding="utf-8")
          reasoning_old.unlink()

          selection_old = Path("docs/adr/0012-gateway-owned-model-selection.md")
          selection_body = selection_old.read_text(encoding="utf-8")
          heading = "# ADR 0012: Gateway-owned model selection and multi-agent structured output\n\n- Status: Accepted\n- Date: 2026-08-20\n\n"
          if not selection_body.startswith(heading):
              raise SystemExit("gateway selection ADR header mismatch")
          selection_body = selection_body[len(heading):]
          selection_new = Path("docs/planning/adrs/0014-gateway-owned-model-selection.md")
          selection_new.write_text(
              '''---
          id: "0014"
          title: "Gateway-owned model selection and multi-agent structured output"
          status: accepted
          proposed_date: "2026-08-20"
          accepted_date: "2026-08-20"
          deciders:
            - "repository maintainer"
          consulted:
            - "gateway-only provider contract"
            - "paper-grounded adaptive reasoning policy"
          informed:
            - "LineageWeave"
            - "fast-mlsirm"
            - "contributors"
          affected_components:
            - "contextual_orchestrator/__main__.py"
            - "contextual_orchestrator/cost_router.py"
            - "contextual_orchestrator/orchestrator.py"
            - "contextual_orchestrator/server.py"
          supersedes: null
          superseded-by: null
          related:
            - path: "docs/planning/adrs/0012-gateway-only-provider-contract.md"
              relation: depends-on
            - path: "docs/planning/adrs/0013-paper-grounded-adaptive-reasoning-policy.md"
              relation: implements
          effort: M
          ---

          # Gateway-owned model selection and multi-agent structured output

          '''.replace("          ", "")
              + selection_body,
              encoding="utf-8",
          )
          selection_old.unlink()
          try:
              selection_old.parent.rmdir()
          except OSError:
              pass

          replace_once(
              "AGENTS.md",
              "[ADR 0011](docs/planning/adrs/0011-paper-grounded-adaptive-reasoning-policy.md)",
              "[ADR 0013](docs/planning/adrs/0013-paper-grounded-adaptive-reasoning-policy.md)",
          )
          replace_once(
              "AGENTS.md",
              "as specified by\n  ADR 0010;",
              "as specified by\n  ADR 0012;",
          )
          replace_once(
              "docs/architecture.md",
              "0011](planning/adrs/0011-paper-grounded-adaptive-reasoning-policy.md)",
              "0013](planning/adrs/0013-paper-grounded-adaptive-reasoning-policy.md)",
          )
          replace_once(
              "docs/architecture.md",
              "[ADR 0010](planning/adrs/0010-gateway-only-provider-contract.md)",
              "[ADR 0012](planning/adrs/0012-gateway-only-provider-contract.md)",
          )
          for path in (
              "docs/planning/adrs/0002-explicit-local-mlx-evaluation.md",
              "docs/planning/adrs/0007-sast-transport-and-sql-hardening.md",
          ):
              replace_once(
                  path,
                  'superseded-by: "0010-gateway-only-provider-contract"',
                  'superseded-by: "0012-gateway-only-provider-contract"',
              )

          workflow = Path(".github/workflows/renumber-gateway-adrs.yml")
          workflow.unlink()
          PY

          test ! -e docs/planning/adrs/0010-gateway-only-provider-contract.md
          test ! -e docs/planning/adrs/0011-paper-grounded-adaptive-reasoning-policy.md
          test ! -e docs/adr/0012-gateway-owned-model-selection.md
          test -e docs/planning/adrs/0012-gateway-only-provider-contract.md
          test -e docs/planning/adrs/0013-paper-grounded-adaptive-reasoning-policy.md
          test -e docs/planning/adrs/0014-gateway-owned-model-selection.md
          ! grep -R --line-number --fixed-strings \
            'docs/planning/adrs/0010-gateway-only-provider-contract.md' \
            AGENTS.md docs --exclude='0010-pii-audit-not-mask.md'
          ! grep -R --line-number --fixed-strings \
            'docs/planning/adrs/0011-paper-grounded-adaptive-reasoning-policy.md' \
            AGENTS.md docs

      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r fuzz/requirements-property.txt

      - name: Verify renumbered branch
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q contextual_orchestrator
          python -m pytest -q
          git diff --check

      - name: Export verified patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > /tmp/renumber-gateway-adrs.patch
          test -s /tmp/renumber-gateway-adrs.patch
          echo "base_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "patch_b64=$(base64 -w0 /tmp/renumber-gateway-adrs.patch)" >> "$GITHUB_OUTPUT"

  commit:
    name: Commit verified ADR patch without executing repository code
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout branch without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: fix/auto-reasoning-effort-contract-rebased
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact base, apply tested patch, and push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.base_sha }}
          PATCH_B64: ${{ needs.prepare.outputs.patch_b64 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          printf '%s' "${PATCH_B64}" | base64 -d > /tmp/renumber-gateway-adrs.patch
          git apply --index /tmp/renumber-gateway-adrs.patch
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: assign unique gateway ADR sequence"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fix/auto-reasoning-effort-contract-rebased
