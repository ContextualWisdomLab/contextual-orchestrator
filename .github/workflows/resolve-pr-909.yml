name: Resolve PR 909 semantically against protected main

on:
  push:
    branches: [fix/batch-routing-owner-20260829]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: resolve-pr-909-semantic
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main and compose owner isolation with ZDR routing
        env:
          EXPECTED_BRANCH: fix/batch-routing-owner-20260829
          CALLER_FILE: .github/workflows/resolve-pr-909.yml
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e
          if [[ $merge_rc -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            unsafe=()
            for path in "${conflicts[@]}"; do
              case "$path" in
                *.md|*.mdx)
                  tmpdir="$(mktemp -d)"
                  git show ":2:$path" > "$tmpdir/ours"
                  git show ":1:$path" > "$tmpdir/base"
                  git show ":3:$path" > "$tmpdir/theirs"
                  git merge-file --union "$tmpdir/ours" "$tmpdir/base" "$tmpdir/theirs"
                  cp "$tmpdir/ours" "$path"
                  rm -rf "$tmpdir"
                  git add "$path"
                  ;;
                contextual_orchestrator/cost_router.py|contextual_orchestrator/server.py)
                  git checkout --conflict=diff3 -- "$path"
                  ;;
                *) unsafe+=("$path") ;;
              esac
            done
            if (( ${#unsafe[@]} )); then
              printf 'Unexpected conflicts:\n%s\n' "${unsafe[*]}"
              git merge --abort
              exit 1
            fi

            python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          from typing import Callable


          def resolve_diff3(path: str, resolver: Callable[[int, str, str, str], str], expected: int) -> None:
              source = Path(path)
              lines = source.read_text(encoding="utf-8").splitlines(keepends=True)
              output: list[str] = []
              index = 0
              cursor = 0
              while cursor < len(lines):
                  if not lines[cursor].startswith("<<<<<<<"):
                      output.append(lines[cursor])
                      cursor += 1
                      continue
                  ours_start = cursor + 1
                  base_marker = next(
                      i for i in range(ours_start, len(lines)) if lines[i].startswith("|||||||")
                  )
                  split_marker = next(
                      i for i in range(base_marker + 1, len(lines)) if lines[i].startswith("=======")
                  )
                  end_marker = next(
                      i for i in range(split_marker + 1, len(lines)) if lines[i].startswith(">>>>>>>")
                  )
                  ours = "".join(lines[ours_start:base_marker])
                  base = "".join(lines[base_marker + 1:split_marker])
                  theirs = "".join(lines[split_marker + 1:end_marker])
                  output.append(resolver(index, ours, base, theirs))
                  index += 1
                  cursor = end_marker + 1
              if index != expected:
                  raise RuntimeError(f"{path}: expected {expected} conflicts, found {index}")
              merged = "".join(output)
              if any(marker in merged for marker in ("<<<<<<<", "|||||||", "=======", ">>>>>>>")):
                  raise RuntimeError(f"{path}: conflict marker remains")
              source.write_text(merged, encoding="utf-8")


          def cost_router_resolution(index: int, ours: str, base: str, theirs: str) -> str:
              del ours, base
              merged = theirs
              if index == 0:
                  old_doc = '        """Submit a batch of requests to the configured batch backend."""\n'
                  new_doc = '        """Submit a batch, resolve its targets, and bind its authenticated owner."""\n'
                  if old_doc not in merged:
                      raise RuntimeError("submit_batch docstring anchor changed")
                  merged = merged.replace(old_doc, new_doc, 1)
                  anchor = "        job = self.batch_backend.submit(prepared_requests, metadata=metadata)\n"
                  if merged.count(anchor) != 1:
                      raise RuntimeError("submit_batch prepared-request anchor changed")
                  merged = merged.replace(anchor, anchor + "        job.owner_id = owner_id\n", 1)
                  return merged
              if index == 1:
                  replacements = (
                      (
                          "    def poll_batch(self, job_id: str) -> Dict[str, Any]:\n",
                          "    def poll_batch(self, job_id: str, *, owner_id: Optional[str] = None) -> Dict[str, Any]:\n",
                      ),
                      (
                          '        """Poll a previously submitted batch job by id."""\n',
                          '        """Poll a previously submitted batch job owned by ``owner_id``."""\n',
                      ),
                      (
                          "    def retrieve_batch(self, job_id: str) -> Dict[str, Any]:\n",
                          "    def retrieve_batch(self, job_id: str, *, owner_id: Optional[str] = None) -> Dict[str, Any]:\n",
                      ),
                      (
                          '        """Retrieve batch results and record usage + cost for each completion."""\n',
                          '        """Retrieve results for a batch owned by ``owner_id`` and record usage."""\n',
                      ),
                      (
                          "    def _require_job(self, job_id: str) -> BatchJob:\n",
                          "    def _require_job(self, job_id: str, *, owner_id: Optional[str] = None) -> BatchJob:\n",
                      ),
                      (
                          "        if job is None:\n",
                          "        if job is None or job.owner_id != owner_id:\n",
                      ),
                  )
                  for old, new in replacements:
                      if merged.count(old) != 1:
                          raise RuntimeError(f"cost_router anchor changed: {old!r}")
                      merged = merged.replace(old, new, 1)
                  require_anchor = "        job = self._require_job(job_id)\n"
                  if merged.count(require_anchor) != 2:
                      raise RuntimeError("expected poll/retrieve job lookup anchors")
                  merged = merged.replace(
                      require_anchor,
                      "        job = self._require_job(job_id, owner_id=owner_id)\n",
                  )
                  return merged
              raise RuntimeError(f"unexpected cost_router conflict {index}")


          def server_resolution(index: int, ours: str, base: str, theirs: str) -> str:
              del base
              if index not in (0, 1):
                  raise RuntimeError(f"unexpected server conflict {index}")
              if "owner_id=security.principal_id(self.headers)," not in ours:
                  raise RuntimeError("owner-id side changed")
              if "zdr_only=zdr_only," not in theirs:
                  raise RuntimeError("ZDR side changed")
              return ours + theirs


          resolve_diff3(
              "contextual_orchestrator/cost_router.py",
              cost_router_resolution,
              expected=2,
          )
          resolve_diff3(
              "contextual_orchestrator/server.py",
              server_resolution,
              expected=2,
          )
          PY
            git add contextual_orchestrator/cost_router.py contextual_orchestrator/server.py
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          rm -f "$CALLER_FILE"
          git add -A
          git diff --cached --check
          python -m compileall -q contextual_orchestrator
          git commit -m "chore: merge protected main into PR #909"
          git push origin "HEAD:$EXPECTED_BRANCH"
