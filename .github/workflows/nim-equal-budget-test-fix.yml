name: NIM equal-budget regression repair

on:
  push:
    branches:
      - claude/nim-all-models-support-fecb0b

permissions:
  contents: read
  id-token: write

concurrency:
  group: nim-equal-budget-regression-repair
  cancel-in-progress: true

jobs:
  repair-stale-depth-assertion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering head without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Replace the superseded fixed-depth contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_nim_benchmark.py")
          test_text = test_path.read_text(encoding="utf-8")
          old = '''    assert all(cell["workflow_depth"] == 4 for cell in conduct_cells)  # template plan under the cap
          '''
          new = '''    # Equal total-token budgets may stop conduct before every template step.
              # Fairness now requires bounded depth plus identical configured budgets,
              # not an unconditional four-call trace.
              assert all(0 <= cell["workflow_depth"] <= nb.MAX_WORKFLOW_DEPTH for cell in conduct_cells)
              assert all(cell["configured_total_token_budget"] == 256 for cell in conduct_cells)
              assert all(cell["configured_maximum_calls"] == nb.MAX_WORKFLOW_DEPTH for cell in conduct_cells)
          '''
          if old not in test_text:
              raise SystemExit("stale fixed-depth assertion was not found exactly once")
          if test_text.count(old) != 1:
              raise SystemExit("stale fixed-depth assertion is ambiguous")
          test_path.write_text(test_text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/nim-equal-budget-test-fix.yml").unlink()
          PY

      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r fuzz/requirements-property.txt

      - name: Verify focused and complete suites
        run: |
          set -euo pipefail
          git diff --check
          python -m pytest tests/test_nim_benchmark.py -q
          python -m pytest -q

      - name: Validate exact changed paths
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_paths < <(git diff --name-only --diff-filter=ACDMRTUXB)
          printf '%s\n' "${changed_paths[@]}"
          test "${#changed_paths[@]}" -eq 2
          test "${changed_paths[0]}" = ".github/workflows/nim-equal-budget-test-fix.yml"
          test "${changed_paths[1]}" = "tests/test_nim_benchmark.py"

      - name: Exchange workflow-triggering GitHub App token
        id: publisher_app_token
        shell: bash
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || \
             [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "available=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="?"
          case "$request_url" in *\?*) separator="&" ;; esac
          oidc_response="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${request_url}${separator}audience=${OIDC_AUDIENCE}")"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          test -n "$oidc_token"
          token_response="$(curl -fsS -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            "${OPENCODE_API_BASE_URL}/exchange_github_app_token")"
          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          test -n "$app_token"
          echo "::add-mask::$app_token"
          {
            echo "available=true"
            echo "token=$app_token"
          } >>"$GITHUB_OUTPUT"

      - name: Fail closed without publication credential
        if: steps.publisher_app_token.outputs.available != 'true'
        run: |
          echo "::error::GitHub App token exchange unavailable; refusing to publish."
          exit 1

      - name: Publish verified regression repair
        if: steps.publisher_app_token.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher_app_token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "opencode-agent[bot]"
          git config user.email "219766164+opencode-agent[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(nim): align conduct depth with equal total budgets"
          gh auth setup-git
          git push origin HEAD:refs/heads/claude/nim-all-models-support-fecb0b
