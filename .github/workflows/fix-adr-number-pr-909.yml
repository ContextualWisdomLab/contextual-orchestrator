name: Repair PR 909 merge-result regressions

on:
  push:
    branches:
      - fix/batch-routing-owner-20260829

permissions:
  contents: write

concurrency:
  group: repair-pr-909-merge-result
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.5"

      - name: Apply, validate, and commit the bounded repair
        env:
          EXPECTED_PARENT: 0130f94c24c108e8a1f9d5d1b56c4dd1d3ff772f
          BRANCH: fix/batch-routing-owner-20260829
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python scripts/ci/repair_pr_909.py
          rm -f \
            scripts/ci/repair_pr_909.py \
            .github/workflows/fix-adr-number-pr-909.yml
          git add -A
          git diff --cached --check
          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q \
              tests/test_planning_adr_identifiers.py \
              tests/test_cost_review_server.py \
              tests/test_cost_router_boundaries.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: repair merge-result ADR and batch model contracts'
          git push origin "HEAD:$BRANCH"
