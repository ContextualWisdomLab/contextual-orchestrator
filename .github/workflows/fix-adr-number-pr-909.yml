name: Repair duplicate ADR number on PR 909

on:
  push:
    branches: [fix/batch-routing-owner-20260829]

permissions:
  contents: write

concurrency:
  group: repair-pr-909-adr-number
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Renumber streamed Responses usage ADR and validate
        env:
          EXPECTED_PARENT: 96c27059e49e50d4e508ce4612463e922fbff447
          BRANCH: fix/batch-routing-owner-20260829
          SELF: .github/workflows/fix-adr-number-pr-909.yml
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          old='docs/planning/adrs/0038-streamed-responses-usage-boundary.md'
          new='docs/planning/adrs/0040-streamed-responses-usage-boundary.md'
          test -f "$old"
          test ! -e "$new"
          git mv "$old" "$new"
          python - <<'PY'
          from pathlib import Path

          adr = Path('docs/planning/adrs/0040-streamed-responses-usage-boundary.md')
          text = adr.read_text(encoding='utf-8')
          old = 'id: "0038"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r} in {adr}')
          adr.write_text(text.replace(old, 'id: "0040"', 1), encoding='utf-8')

          architecture = Path('docs/architecture.md')
          text = architecture.read_text(encoding='utf-8')
          old = 'See [ADR 0038](planning/adrs/0038-streamed-responses-usage-boundary.md).'
          new = 'See [ADR 0040](planning/adrs/0040-streamed-responses-usage-boundary.md).'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one streamed ADR link in {architecture}')
          architecture.write_text(text.replace(old, new, 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = 'answer, and nested gateway upstreams remain compatible (ADR 0038).'
          replacement = 'answer, and nested gateway upstreams remain compatible (ADR 0040).'
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one streamed ADR reference in {changelog}')
          changelog.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY
          rm -f "$SELF"
          git add -A
          git diff --cached --check
          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q tests/test_planning_adr_identifiers.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: assign unique ADR number to streamed Responses usage'
          git push origin "HEAD:$BRANCH"
