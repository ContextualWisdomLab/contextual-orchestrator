              assert report["actual_cost_evidence"]["valid_until_date"] in markdown
              csv_text = Path(report["artifact_paths"]["csv_path"]).read_text(
                  encoding="utf-8"
              )
              assert "configured_total_token_budget" in csv_text
              assert report["provenance"]["benchmark_parameters"][
                  "policy_total_token_budget"
              ] == 256


          def test_live_run_fails_before_egress_when_cost_evidence_expired(
