name: Patch PR 914 resolver union exit handling

on:
  push:
    branches: [fix/chat-stream-usage-compat]

permissions:
  contents: write

concurrency:
  group: patch-pr-914-union-exit
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Accept merge-file union conflict count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/resolve-pr-914.yml')
          text = path.read_text(encoding='utf-8')
          pattern = r'(?m)^(\s*git merge-file --union .*?)(?: \|\| true)?$'
          updated, count = re.subn(pattern, r'\1 || true', text, count=1)
          if count != 1:
              raise SystemExit(f'expected one merge-file command, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY
          grep -F 'git merge-file --union "$tmpdir/ours" "$tmpdir/base" "$tmpdir/theirs" || true' .github/workflows/resolve-pr-914.yml
          rm -f .github/workflows/patch-pr-914-union-exit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: accept union conflict-count exit status for PR #914"
          git push origin HEAD:fix/chat-stream-usage-compat
