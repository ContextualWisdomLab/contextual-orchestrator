name: Reusable fail-closed PR conflict resolver

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      branch:
        required: true
        type: string
      caller_file:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge protected main and stop on executable conflicts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_BRANCH: ${{ inputs.branch }}
          CALLER_FILE: ${{ inputs.caller_file }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          original_head="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          main_head="$(git rev-parse origin/main)"

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e

          if [[ $merge_rc -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            names_report="$(mktemp)"
            {
              echo "Conflict inventory (fail-closed diagnostic)."
              echo
              echo "Exact PR head: \`$original_head\`"
              echo "Protected main: \`$main_head\`"
              echo
              echo '```text'
              printf '%s\n' "${conflicts[@]}"
              echo '```'
            } > "$names_report"
            gh pr comment "$PR_NUMBER" --body-file "$names_report"

            unsafe=()
            for path in "${conflicts[@]}"; do
              case "$path" in
                *.md|*.mdx)
                  if git cat-file -e ":1:$path" 2>/dev/null \
                    && git cat-file -e ":2:$path" 2>/dev/null \
                    && git cat-file -e ":3:$path" 2>/dev/null; then
                    tmpdir="$(mktemp -d)"
                    git show ":2:$path" > "$tmpdir/ours"
                    git show ":1:$path" > "$tmpdir/base"
                    git show ":3:$path" > "$tmpdir/theirs"
                    git merge-file --union "$tmpdir/ours" "$tmpdir/base" "$tmpdir/theirs"
                    cp "$tmpdir/ours" "$path"
                    rm -rf "$tmpdir"
                    git add "$path"
                  else
                    unsafe+=("$path")
                  fi
                  ;;
                *)
                  unsafe+=("$path")
                  ;;
              esac
            done
            if (( ${#unsafe[@]} )); then
              report="$(mktemp)"
              {
                echo "Reusable conflict resolver stopped fail-closed."
                echo
                echo "Exact PR head: \`$original_head\`"
                echo "Protected main: \`$main_head\`"
                echo
                echo "Executable, structured-data, or non-three-way conflicts require semantic resolution:"
              } > "$report"
              for path in "${unsafe[@]}"; do
                {
                  echo
                  echo "#### \`$path\`"
                  echo
                } >> "$report"
                if git checkout --conflict=diff3 -- "$path" 2>/dev/null; then
                  echo '```diff' >> "$report"
                  python - "$path" <<'PY' >> "$report"
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
          emitted = 0
          cursor = 0
          while cursor < len(lines):
              if not lines[cursor].startswith("<<<<<<<"):
                  cursor += 1
                  continue
              end = cursor + 1
              while end < len(lines) and not lines[end].startswith(">>>>>>>"):
                  end += 1
              end = min(end, len(lines) - 1)
              start_context = max(0, cursor - 6)
              end_context = min(len(lines), end + 7)
              block = lines[start_context:end_context]
              if emitted + len(block) > 180:
                  print("... additional conflict context omitted ...")
                  break
              for line_number, line in enumerate(block, start_context + 1):
                  print(f"{line_number:>6} {line}")
              emitted += len(block)
              cursor = end_context
          PY
                  echo '```' >> "$report"
                else
                  {
                    echo '```text'
                    echo "diff3 context unavailable (add/delete, rename, binary, or missing merge stage)"
                    git status --short -- "$path"
                    echo '```'
                  } >> "$report"
                fi
              done
              python - "$report" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          if len(text) > 60000:
              text = text[:60000] + "\n\n... report truncated at 60,000 characters ...\n"
          path.write_text(text, encoding="utf-8")
          PY
              gh pr comment "$PR_NUMBER" --body-file "$report"
              git merge --abort
              exit 1
            fi
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          rm -f "$CALLER_FILE"
          git add -A
          git diff --cached --check
          python -m compileall -q contextual_orchestrator
          git commit -m "chore: merge protected main into PR #$PR_NUMBER"
          git push origin "HEAD:$EXPECTED_BRANCH"
