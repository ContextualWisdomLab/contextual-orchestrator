name: Reusable fail-closed PR conflict resolver

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      branch:
        required: true
        type: string
      caller_file:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge protected main or report semantic conflicts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_BRANCH: ${{ inputs.branch }}
          CALLER_FILE: ${{ inputs.caller_file }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          original_head="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          main_head="$(git rev-parse origin/main)"

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Protected main is already an ancestor of this branch."
            exit 0
          fi

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e

          if [[ $merge_rc -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            inventory="$(mktemp)"
            {
              echo "Conflict inventory (fail-closed diagnostic)."
              echo
              echo "Exact PR head: \`$original_head\`"
              echo "Protected main: \`$main_head\`"
              echo
              echo '```text'
              printf '%s\n' "${conflicts[@]}"
              echo '```'
            } > "$inventory"
            gh pr comment "$PR_NUMBER" --body-file "$inventory"

            unsafe=()
            for path in "${conflicts[@]}"; do
              case "$path" in
                *.md|*.mdx)
                  if git cat-file -e ":1:$path" 2>/dev/null \
                    && git cat-file -e ":2:$path" 2>/dev/null \
                    && git cat-file -e ":3:$path" 2>/dev/null; then
                    tmpdir="$(mktemp -d)"
                    git show ":2:$path" > "$tmpdir/ours"
                    git show ":1:$path" > "$tmpdir/base"
                    git show ":3:$path" > "$tmpdir/theirs"
                    git merge-file --union "$tmpdir/ours" "$tmpdir/base" "$tmpdir/theirs" || true
                    cp "$tmpdir/ours" "$path"
                    rm -rf "$tmpdir"
                    git add "$path"
                  else
                    unsafe+=("$path")
                  fi
                  ;;
                *) unsafe+=("$path") ;;
              esac
            done

            if (( ${#unsafe[@]} )); then
              report="$(mktemp)"
              {
                echo "Reusable resolver stopped fail-closed."
                echo
                echo "Exact PR head: \`$original_head\`"
                echo "Protected main: \`$main_head\`"
                echo
                echo "Executable, structured-data, add/delete, or rename conflicts require semantic resolution."
              } > "$report"

              for path in "${unsafe[@]}"; do
                {
                  echo
                  echo "#### \`$path\`"
                  echo
                } >> "$report"
                if git checkout --conflict=diff3 -- "$path" 2>/dev/null; then
                  echo '```diff' >> "$report"
                  python - "$path" <<'PY' >> "$report"
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          emitted = 0
          index = 0
          while index < len(lines):
              if not lines[index].startswith("<<<<<<<"):
                  index += 1
                  continue
              end = index + 1
              while end < len(lines) and not lines[end].startswith(">>>>>>>"):
                  end += 1
              start_context = max(0, index - 5)
              end_context = min(len(lines), end + 6)
              block = lines[start_context:end_context]
              if emitted + len(block) > 160:
                  print("... additional conflict context omitted ...")
                  break
              for number, line in enumerate(block, start_context + 1):
                  print(f"{number:>6} {line}")
              emitted += len(block)
              index = end_context
          PY
                  echo '```' >> "$report"
                else
                  {
                    echo '```text'
                    echo "diff3 context unavailable"
                    git status --short -- "$path"
                    echo '```'
                  } >> "$report"
                fi
              done

              python - "$report" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          if len(text) > 60000:
              path.write_text(text[:60000] + "\n\n... report truncated ...\n", encoding="utf-8")
          PY
              gh pr comment "$PR_NUMBER" --body-file "$report"
              git merge --abort
              exit 1
            fi
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          rm -f "$CALLER_FILE"
          git add -A
          git diff --cached --check
          python -m compileall -q contextual_orchestrator
          git commit -m "chore: merge protected main into PR #$PR_NUMBER"
          git push origin "HEAD:$EXPECTED_BRANCH"
