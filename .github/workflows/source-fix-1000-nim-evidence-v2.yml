name: Source fix PR1000 NIM evidence v2

on:
  push:
    branches: [fix/no-heuristic-batch-routing]
    paths: [.github/source-fix-1000-nim-evidence-v2.trigger]

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/no-heuristic-batch-routing
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: Repair NIM benchmark evidence boundaries
        id: patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_name='fix/no-heuristic-batch-routing'
          starting_head="$GITHUB_SHA"
          echo "starting_head=$starting_head" >>"$GITHUB_OUTPUT"
          live_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch_name}" --jq '.object.sha')"
          pr_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1000" --jq '.state')"
          pr_head_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1000" --jq '.head.ref')"
          test "$live_ref" = "$starting_head"
          test "$pr_state" = open
          test "$pr_head_ref" = "$branch_name"

          log_file="$RUNNER_TEMP/pr1000-nim-source-fix.log"
          set +e
          {
            if uv run --locked --extra api --extra db --extra queue --group dev \
              python -m pytest -q tests/test_nim_benchmark_no_heuristic_tokens.py; then
              echo 'No-heuristic NIM regressions unexpectedly pass before production repair.'
              exit 91
            fi

            uv run --locked --extra api --extra db --extra queue --group dev \
              python scripts/ci/repair_pr1000_nim_evidence.py

            uv run --locked --extra api --extra db --extra queue --group dev \
              python -m pytest -q \
              tests/test_nim_benchmark_no_heuristic_tokens.py \
              tests/test_nim_benchmark.py
            uv run --locked --extra api --extra db --extra queue --group dev \
              python -m ruff check \
              contextual_orchestrator/nim_benchmark.py \
              tests/test_nim_benchmark.py \
              tests/test_nim_benchmark_no_heuristic_tokens.py \
              scripts/ci/repair_pr1000_nim_evidence.py
            git diff --check
          } > >(tee "$log_file") 2>&1
          repair_status=$?
          set -e
          if [ "$repair_status" -ne 0 ]; then
            {
              printf '%s\n\n' 'PR #1000 NIM source-fix diagnostic (exact-head run):'
              printf '```text\n'
              tail -c 50000 "$log_file"
              printf '\n```\n'
            } >"$RUNNER_TEMP/pr1000-comment.md"
            gh pr comment 1000 --body-file "$RUNNER_TEMP/pr1000-comment.md" || true
            exit "$repair_status"
          fi

          latest_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch_name}" --jq '.object.sha')"
          latest_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1000" --jq '.state')"
          latest_head_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1000" --jq '.head.ref')"
          test "$latest_ref" = "$starting_head"
          test "$latest_state" = open
          test "$latest_head_ref" = "$branch_name"

          rm -f \
            .github/workflows/source-fix-1000-nim-evidence-v2.yml \
            .github/source-fix-1000-nim-evidence-v2.trigger \
            scripts/ci/repair_pr1000_nim_evidence.py
          git add -A
          git diff --cached --check
          git config user.name 'opencode-agent[bot]'
          git config user.email '219766164+opencode-agent[bot]@users.noreply.github.com'
          git commit -m 'fix(benchmark): require reported token evidence'

      - name: Push repaired exact head
        env:
          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
          STARTING_HEAD: ${{ steps.patch.outputs.starting_head }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo '::error::No event-capable branch-write credential is configured.'
            exit 1
          fi
          branch_name='fix/no-heuristic-batch-routing'
          remote_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch_name}" --jq '.object.sha')"
          test "$remote_head" = "$STARTING_HEAD"
          gh auth setup-git
          git push origin HEAD:"$branch_name"
