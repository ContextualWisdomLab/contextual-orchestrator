name: One-shot hourly PR maintenance bootstrap

on:
  push:
    branches:
      - ci/hourly-pr-maintenance

permissions:
  contents: write

concurrency:
  group: one-shot-hourly-pr-maintenance-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ci/hourly-pr-maintenance
          fetch-depth: 0

      - name: Write contract test and prove RED
        run: |
          set -euo pipefail
          cat > tests/test_hourly_pr_maintenance_workflow.py <<'PY'
          """Contract tests for the bounded hourly PR-maintenance dispatcher."""

          from pathlib import Path


          WORKFLOW = Path(".github/workflows/hourly-pr-maintenance.yml")
          DOCTORING = Path("docs/doctoring/hourly-pr-maintenance.md")
          CHANGELOG = Path("CHANGELOG.md")


          def _read(path: Path) -> str:
              """Read one repository contract file as UTF-8 text."""
              return path.read_text(encoding="utf-8")


          def test_hourly_dispatch_is_bounded_and_non_cancelling() -> None:
              """Each heartbeat may request at most one exact-head repair."""
              workflow = _read(WORKFLOW)

              assert 'cron: "11 * * * *"' in workflow
              assert "workflow_dispatch:" in workflow
              assert "group: contextual-orchestrator-hourly-pr-maintenance" in workflow
              assert "cancel-in-progress: false" in workflow
              assert "timeout-minutes: 5" in workflow
              assert '"target_repository": "ContextualWisdomLab/contextual-orchestrator"' in workflow
              assert '"base_branch": "main"' in workflow
              assert '"max_prs": "100"' in workflow
              assert '"max_dispatches": "1"' in workflow
              assert '"retry_hours": "1"' in workflow


          def test_hourly_dispatch_preserves_credential_and_model_boundaries() -> None:
              """The caller only dispatches central policy and never runs a model."""
              workflow = _read(WORKFLOW)
              workflow_scope, jobs_scope = workflow.split("\njobs:\n", maxsplit=1)

              assert "\npermissions:\n  contents: read\n" in workflow_scope
              assert "PR_REVIEW_MERGE_TOKEN" in jobs_scope
              assert "OPENCODE_APPROVE_TOKEN" in jobs_scope
              assert "NVIDIA_NIM_API_KEY" not in workflow
              assert "COPILOT_GITHUB_TOKEN" not in workflow
              assert "secrets: inherit" not in workflow
              assert "pull-requests: write" not in workflow
              assert "issues: write" not in workflow
              assert "contents: write" not in workflow
              assert "repos/ContextualWisdomLab/.github/dispatches" in workflow
              assert '"event_type": "pr-review-fix-scheduler"' in workflow


          def test_doctoring_and_changelog_define_the_operating_contract() -> None:
              """Operators can audit cadence, ownership, safety, and rollback."""
              doctoring = _read(DOCTORING)
              changelog = _read(CHANGELOG)

              for phrase in (
                  "root-cause analysis",
                  "remediation feasibility",
                  "one-hour same-head retry floor",
                  "NVIDIA_NIM_API_KEY",
                  "COPILOT_GITHUB_TOKEN",
                  "independent non-author approval",
                  "repository_dispatch",
                  "APA 7th references",
              ):
                  assert phrase in doctoring
              assert "Hourly PR maintenance dispatcher" in changelog
          PY

          set +e
          python3 -m pytest -q tests/test_hourly_pr_maintenance_workflow.py > /tmp/hourly-red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/hourly-red.log
          if [ "$red_status" -eq 0 ]; then
            echo "::error::Hourly maintenance contract unexpectedly passed before implementation."
            exit 1
          fi
          grep -q "hourly-pr-maintenance.yml" /tmp/hourly-red.log

      - name: Implement dispatcher and operator records
        run: |
          set -euo pipefail
          mkdir -p docs/doctoring
          cat > .github/workflows/hourly-pr-maintenance.yml <<'YAML'
          name: Hourly PR Maintenance

          on:
            schedule:
              - cron: "11 * * * *"
            workflow_dispatch:

          concurrency:
            group: contextual-orchestrator-hourly-pr-maintenance
            cancel-in-progress: false

          permissions:
            contents: read

          jobs:
            dispatch-central-review-repair:
              runs-on: ubuntu-latest
              timeout-minutes: 5
              steps:
                - name: Dispatch bounded central review repair
                  env:
                    PR_REVIEW_MERGE_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
                    OPENCODE_APPROVE_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN }}
                  run: |
                    set -euo pipefail
                    token="${PR_REVIEW_MERGE_TOKEN:-${OPENCODE_APPROVE_TOKEN:-}}"
                    if [ -z "$token" ]; then
                      echo "::error::No established central scheduler dispatch credential is configured."
                      exit 1
                    fi
                    payload="$({
                      jq -n \
                        --arg event_type "pr-review-fix-scheduler" \
                        '{
                          "event_type": $event_type,
                          "client_payload": {
                            "target_repository": "ContextualWisdomLab/contextual-orchestrator",
                            "base_branch": "main",
                            "max_prs": "100",
                            "max_dispatches": "1",
                            "retry_hours": "1",
                            "dry_run": false
                          }
                        }'
                    })"
                    response_file="$(mktemp)"
                    status_code="$(curl \
                      --silent \
                      --show-error \
                      --location \
                      --output "$response_file" \
                      --write-out '%{http_code}' \
                      --request POST \
                      --header 'Accept: application/vnd.github+json' \
                      --header "Authorization: Bearer ${token}" \
                      --header 'X-GitHub-Api-Version: 2022-11-28' \
                      --data "$payload" \
                      https://api.github.com/repos/ContextualWisdomLab/.github/dispatches)"
                    if [ "$status_code" != "204" ]; then
                      echo "::error::Central review-repair dispatch failed with HTTP ${status_code}."
                      cat "$response_file"
                      exit 1
                    fi
                    echo "Dispatched one bounded Contextual Orchestrator review-repair opportunity."
          YAML

          cat > docs/doctoring/hourly-pr-maintenance.md <<'MD'
          # Hourly PR Maintenance Control Boundary

          ## Decision

          Contextual Orchestrator owns a small scheduled caller while the organization
          `.github` repository owns the reusable review-repair policy and the OpenCode
          writer. The caller sends a `repository_dispatch` event to the protected
          central control plane every hour; it does not copy the repair engine into the
          product repository.

          ## Cadence and bounded work

          The heartbeat runs at minute 11 of every hour. It asks the central scheduler
          to inspect up to 100 open `main` pull requests, dispatch at most one repair,
          and enforce a one-hour same-head retry floor. Non-cancelling concurrency
          avoids terminating a legitimate long-running run merely because the next
          heartbeat arrived.

          The central scheduler performs root-cause analysis and remediation feasibility
          screening. Queued checks, reviewer latency, missing independent approval,
          provider delay, billing limits, and unavailable credentials are operational
          states rather than evidence of a source defect. They must not produce invented
          commits.

          ## Credential, model, and authority boundaries

          The caller uses only the established `PR_REVIEW_MERGE_TOKEN`, falling back to
          `OPENCODE_APPROVE_TOKEN`, to create the central dispatch event. Its generated
          `GITHUB_TOKEN` remains read-only. The caller receives neither
          `NVIDIA_NIM_API_KEY` nor any model prompt or source archive. The central,
          separately reviewed OpenCode worker owns NVIDIA NIM access and repair
          execution. `COPILOT_GITHUB_TOKEN` is not a model, scheduler, review, or merge
          credential in this path.

          A repair cannot approve itself, weaken checks, label pending evidence as
          passing, replay an ambiguous state-changing tool call, or bypass independent
          non-author approval. Exact-head CI, security review, coverage, docstrings, and
          branch protection remain authoritative.

          ## Standalone and ecosystem behavior

          The product remains independently deployable. The dispatch payload contains
          only repository identity, protected base, queue bounds, and retry cadence.
          Central `.github` may improve the repair engine without importing product code;
          Contextual Orchestrator continues to own provider routing, tool execution,
          credential authority, audit behavior, and release evidence.

          ## Verification and rollback

          Permanent tests bind the cron, single-flight policy, one-dispatch limit,
          one-hour retry floor, exact target, read-only caller permission, explicit
          credentials, and absence of model or Copilot secrets. Rollback removes the
          caller, test, and this record; it does not change reviewer identities, central
          worker secrets, branch protection, or product runtime behavior.

          ## APA 7th references

          GitHub, Inc. (n.d.-a). *Events that trigger workflows*. GitHub Docs. Retrieved
          August 15, 2026, from
          https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows

          GitHub, Inc. (n.d.-b). *REST API endpoints for repositories: Create a repository
          dispatch event*. GitHub Docs. Retrieved August 15, 2026, from
          https://docs.github.com/en/rest/repos/repos#create-a-repository-dispatch-event

          GitHub, Inc. (n.d.-c). *Workflow syntax for GitHub Actions: Permissions*.
          GitHub Docs. Retrieved August 15, 2026, from
          https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
          MD

          cat > CHANGELOG.md <<'MD'
          # Changelog

          All notable changes to Contextual Orchestrator are documented in this file.

          ## [Unreleased]

          ### Added

          - Hourly PR maintenance dispatcher that requests one bounded, exact-target review-repair opportunity from the protected central `.github` control plane.

          ### Security

          - Kept the scheduled caller read-only and model-secret-free while preserving exact-head checks, independent approval, and the existing reviewer credential scheme.
          MD

      - name: Prove GREEN
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_hourly_pr_maintenance_workflow.py
          python3 -m compileall -q tests/test_hourly_pr_maintenance_workflow.py
          git diff --check

      - name: Commit verified implementation and remove bootstrap
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-hourly-pr-maintenance-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/hourly-pr-maintenance.yml \
            docs/doctoring/hourly-pr-maintenance.md \
            tests/test_hourly_pr_maintenance_workflow.py \
            CHANGELOG.md \
            .github/workflows/one-shot-hourly-pr-maintenance-bootstrap.yml
          git diff --cached --check
          git commit -m "ci: schedule bounded hourly PR maintenance"
          git push origin HEAD:ci/hourly-pr-maintenance
