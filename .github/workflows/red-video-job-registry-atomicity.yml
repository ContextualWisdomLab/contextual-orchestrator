name: Video job registry atomicity RED

on:
  push:
    branches:
      - feat/normalized-video-job-resource-20260829

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.5"
      - name: Run atomicity regressions
        run: >-
          uv run --locked --extra api --extra db --extra queue --group dev
          python -m pytest -q tests/test_video_job_registry_atomicity.py
