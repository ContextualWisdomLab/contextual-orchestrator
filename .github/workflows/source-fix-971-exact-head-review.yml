name: Source Fix 971 Exact Head Review

on:
  push:
    branches:
      - fix/model-group-timeout-openrouter
    paths:
      - .github/workflows/source-fix-971-exact-head-review.yml

permissions:
  contents: read

concurrency:
  group: source-fix-971-exact-head-review
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact writer head without persisted mutation credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install declared hash-locked verification toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Revalidate exact remote head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          local_head="$(git rev-parse HEAD)"
          if [ -z "$remote_head" ] || [ "$remote_head" != "$local_head" ]; then
            echo "::error::writer head moved: local=$local_head remote=$remote_head"
            exit 1
          fi

      - name: Materialize exact-head false-negative regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          regression = Path("tests/test_pr971_exact_head_review_regressions.py")
          regression.write_text(
              '''"""Executable regressions for externally demonstrated PR #971 review misses."""

          from __future__ import annotations

          from types import SimpleNamespace

          from contextual_orchestrator import model_discovery as discovery
          from contextual_orchestrator.credentials import NotConfigured


          def test_tool_probe_missing_credential_is_fail_closed(monkeypatch) -> None:
              """A missing credential must produce unknown evidence, never NameError."""
              monkeypatch.setattr(discovery, "get_credential", lambda _name: "registered")

              def raise_not_configured(*_args, **_kwargs):
                  raise NotConfigured("credential disappeared")

              monkeypatch.setattr(discovery.ModelClient, "_validate_provider", raise_not_configured)
              candidate = SimpleNamespace(
                  credential_name="SYNTHETIC_API_KEY",
                  chat_base_url="https://provider.example/v1",
                  model_id="synthetic-model",
                  auth_scheme="Bearer",
              )

              assert discovery.probe_discovered_model_tool_call_capability(candidate) is None
          ''',
              encoding="utf-8",
          )

          batch_tests = Path("tests/test_batch_job_registry.py")
          text = batch_tests.read_text(encoding="utf-8")
          marker = "def test_recovered_provider_embedding_restores_persisted_request_context() -> None:"
          if marker not in text:
              text = text.rstrip() + '''


          def test_recovered_provider_embedding_restores_persisted_request_context() -> None:
              """Restart recovery rehydrates the persisted privacy policy before provider I/O."""
              client = FakeValkeyClient()
              client.lose_execution_extension = False
              registry = JobRegistryFactory(client)
              events: list[tuple[str, bool]] = []

              class RequestScope:
                  def __init__(self, zdr_only: bool) -> None:
                      self.zdr_only = zdr_only

                  def __enter__(self):
                      events.append(("enter", self.zdr_only))
                      return self

                  def __exit__(self, *_exc) -> None:
                      events.append(("exit", self.zdr_only))

              def request_context(request: EmbeddingBatchRequest):
                  return RequestScope(request.zdr_only)

              def runner(requests):
                  assert events[-1] == ("enter", True)
                  return [[1.0] for _request in requests], len(requests)

              original = ProviderEmbeddingBatchBackend(
                  runner,
                  job_registry=registry,
                  claim_lease_seconds=1,
                  request_context=request_context,
              )
              job = original.reserve(
                  [
                      EmbeddingBatchRequest(
                          input_text="private",
                          model="synthetic-model",
                          zdr_only=True,
                      )
                  ]
              )
              original._states[job.job_id] = "queued"
              original.close()

              recovered = ProviderEmbeddingBatchBackend(
                  runner,
                  job_registry=registry,
                  claim_lease_seconds=1,
                  request_context=request_context,
              )
              try:
                  assert recovered.wait(job, timeout=1)["status"] == "completed"
                  assert events == [("enter", True), ("exit", True)]
              finally:
                  recovered.close()
          ''' + "\n"
              batch_tests.write_text(text, encoding="utf-8")
          PY

      - name: Prove each current-head regression is RED
        shell: bash
        run: |
          set -euo pipefail
          specs=(
            "tests/test_no_heuristic_default_transport_retry.py"
            "tests/test_pr971_exact_head_review_regressions.py::test_tool_probe_missing_credential_is_fail_closed"
            "tests/test_batch_job_registry.py::test_recovered_provider_embedding_restores_persisted_request_context"
          )
          for spec in "${specs[@]}"; do
            set +e
            python -m pytest -q "$spec"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "::error::expected RED regression was already GREEN before source repair: $spec"
              exit 1
            fi
            echo "RED verified: $spec"
          done

      - name: Apply smallest causal owner repairs and traceability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path: str, marker: str, addition: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if marker in text:
                  return
              target.write_text(text.rstrip() + "\n\n" + addition.strip() + "\n", encoding="utf-8")

          replace_once(
              "contextual_orchestrator/orchestrator.py",
              "        max_retries: int = 2,\n",
              "        max_retries: int = 0,\n",
          )
          replace_once(
              "contextual_orchestrator/model_discovery.py",
              "from .credentials import get_credential\n",
              "from .credentials import NotConfigured, get_credential\n",
          )
          replace_once(
              "contextual_orchestrator/batch_routing.py",
              "        execution_timeout_seconds: float | None = None,\n    ) -> None:\n",
              "        execution_timeout_seconds: float | None = None,\n        request_context: Callable[[EmbeddingBatchRequest], Any] | None = None,\n    ) -> None:\n",
          )
          replace_once(
              "contextual_orchestrator/batch_routing.py",
              "        self._runner = runner\n        self._max_concurrency = max_concurrency\n",
              "        self._runner = runner\n        self._request_context = request_context\n        self._max_concurrency = max_concurrency\n",
          )
          replace_once(
              "contextual_orchestrator/batch_routing.py",
              "        requests = list(self._requests[job_id])\n        try:\n            vectors, prompt_tokens = self._runner(requests)\n",
              "        requests = list(self._requests[job_id])\n        try:\n            if requests and any(request.zdr_only != requests[0].zdr_only for request in requests):\n                raise ValueError(\"provider embedding batch cannot mix ZDR policies\")\n            request_scope = (\n                self._request_context(requests[0])\n                if self._request_context is not None and requests\n                else nullcontext()\n            )\n            with request_scope:\n                vectors, prompt_tokens = self._runner(requests)\n",
          )
          replace_once(
              "contextual_orchestrator/cost_router.py",
              "_BATCH_LEDGER_SETTLEMENT_TIMEOUT_SECONDS = 1.0\n",
              "_BATCH_LEDGER_SETTLEMENT_TIMEOUT_SECONDS = 1.0\n_DEFAULT_PROVIDER_EMBEDDING_CLAIM_LEASE_SECONDS = 30.0\n",
          )
          replace_once(
              "contextual_orchestrator/cost_router.py",
              "        client_timeout = float(getattr(client, \"timeout\", None) or 0)\n        return ProviderEmbeddingBatchBackend(\n",
              "        client_timeout = float(getattr(client, \"timeout\", None) or 0)\n        claim_lease_seconds = float(\n            self.config.get(\n                _EMBEDDING_CONFIG_CATEGORY,\n                \"provider_embedding_claim_lease_seconds\",\n                _DEFAULT_PROVIDER_EMBEDDING_CLAIM_LEASE_SECONDS,\n            )\n        )\n        if self.job_registry.durable and claim_lease_seconds <= 0:\n            raise ValueError(\"durable provider embedding claim lease must be positive\")\n        return ProviderEmbeddingBatchBackend(\n",
          )
          replace_once(
              "contextual_orchestrator/cost_router.py",
              "            claim_lease_seconds=(\n                client_timeout\n                if self.job_registry.durable and client_timeout > 0\n                else None\n            ),\n            execution_timeout_seconds=client_timeout if client_timeout > 0 else None,\n        )\n",
              "            claim_lease_seconds=(claim_lease_seconds if self.job_registry.durable else None),\n            execution_timeout_seconds=client_timeout if client_timeout > 0 else None,\n            request_context=lambda request: self.orchestrator.request_policy(request.zdr_only),\n        )\n",
          )
          replace_once(
              "contextual_orchestrator/server.py",
              "                        orchestrator._group_router.observe_failure(embedding_agent.id)\n                        document = None\n",
              "                        orchestrator._record_embedding_failure(\n                            embedding_agent, \"/v1/embeddings\", last_embedding_error\n                        )\n                        document = None\n",
          )

          append_once(
              "docs/adr/0001-tool-execution-fallback-policy.md",
              "## Amendment (2026-09-02): no library-authored default provider retry count",
              '''## Amendment (2026-09-02): no library-authored default provider retry count

          RFC 9110 constrains when replay can be safe for idempotent semantics, and
          NIST SP 800-204 discusses retry and circuit-breaker resilience, but neither
          identifies a numeric retry allocation for this library. The previously
          inherited `ModelClient(max_retries=2)` default therefore exceeded the
          available authority. The default is now `0`; explicit nonzero retry
          budgets remain caller-owned configuration backed by a separate policy.
          Failure taxonomy remains evidence for classification and failover, not a
          mechanism for inventing extra model attempts.
          ''',
          )

          baseline = Path("docs/product-technical-gap-baseline.md")
          text = baseline.read_text(encoding="utf-8")
          text = text.replace("\n#857's 21 still-unresolved review threads,", "\n`#857`'s 21 still-unresolved review threads,")
          text = text.replace("\n#883, #889 then landed,", "\n`#883`, `#889` then landed,")
          marker = "## 2026-09-02 — PR #971 exact-head review false-negative repair"
          if marker not in text:
              text = text.rstrip() + '''

          ## 2026-09-02 — PR #971 exact-head review false-negative repair

          External review evidence exposed four still-live causal gaps on the current
          writer head: missing `NotConfigured` exception binding in discovery; restart
          recovery that could execute persisted `zdr_only` embedding work outside its
          request-policy scope; durable execution claims accidentally coupled to the
          newly unbounded inference timeout; and a non-exception embedding failure path
          bypassing the shared circuit/event recorder. The same audit rejected the
          library's inherited numeric provider retry default because the cited standards
          constrain retry safety but do not establish that allocation.

          The owner repair binds the missing exception, rehydrates privacy context from
          persisted request evidence and rejects mixed-policy batches, separates a
          positive configurable durable claim lease from inference duration, unifies
          embedding failure accounting, and makes automatic provider retry opt-in. The
          executable corpus includes restart-backed privacy recovery, missing-credential
          exception handling, and provider/model/reasoning-neutral default retry cases.
          Temporary source-fix workflows are non-production machinery and must be absent
          from the publishable tree.
          ''' + "\n"
          baseline.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          entry = (
              "- Harden PR #971 review false negatives: restore persisted embedding privacy "
              "scope after restart, decouple durable claim leases from inference deadlines, "
              "bind missing discovery exceptions, unify embedding failure accounting, and "
              "remove the unproven default provider retry allocation.\n"
          )
          if entry not in text:
              if "## [Unreleased]" in text:
                  text = text.replace("## [Unreleased]\n", "## [Unreleased]\n" + entry, 1)
              elif "## Unreleased" in text:
                  text = text.replace("## Unreleased\n", "## Unreleased\n" + entry, 1)
              else:
                  text = entry + "\n" + text
              changelog.write_text(text, encoding="utf-8")
          PY

      - name: Verify focused GREEN contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q contextual_orchestrator
          python -m pytest -q \
            tests/test_no_heuristic_default_transport_retry.py \
            tests/test_pr971_exact_head_review_regressions.py \
            tests/test_batch_job_registry.py \
            tests/test_batch_embeddings.py \
            tests/test_cost_router.py \
            tests/test_embeddings_model_pool_http_honesty.py \
            tests/test_model_discovery.py \
            tests/test_provider_gateway_resilience.py \
            tests/test_provider_integration.py \
            tests/test_provider_error_taxonomy.py
          git diff --check

      - name: Verify broader repository suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          git diff --check

      - name: Remove all completed one-shot repair machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/source-fix-971-exact-head-review.yml \
            .github/workflows/source-fix-971-default-retry-policy.yml \
            .github/source-fix-971-default-retry-policy.trigger \
            scripts/source_fix_971_default_retry_policy.py
          if git ls-files | grep -E '(^|/)(source-fix-971|source_fix_971)' | grep -v '^tests/test_pr971_exact_head_review_regressions.py$'; then
            echo "::error::temporary PR971 repair machinery remains tracked"
            exit 1
          fi
          git diff --check

      - name: Commit verified owner repair and publish with workflow-starting credential
        shell: bash
        env:
          WORKFLOW_PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WORKFLOW_PUSH_TOKEN:-}" ]; then
            echo "::error::No workflow-starting mutation credential is configured; refusing github.token publication."
            exit 1
          fi
          git fetch origin "${GITHUB_REF_NAME}"
          remote_head="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          local_parent="$(git rev-parse HEAD)"
          if [ "$remote_head" != "$local_parent" ]; then
            echo "::error::writer branch moved before publish: local=$local_parent remote=$remote_head"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::repair produced no publishable delta"
            exit 1
          fi
          git commit -m "fix(routing): close exact-head review false negatives"
          git remote set-url origin "https://x-access-token:${WORKFLOW_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
