name: NIM benchmark

# Evidence-grade NVIDIA NIM model discovery and cost-quality benchmark
# (issue #86). Two entry points:
#   * manual dispatch — defaults to a deterministic DRY RUN (no NVIDIA egress);
#     operators opt in explicitly to a live run and its request budget;
#   * conservative monthly schedule — one live run under a small hard budget.
# Single-flight concurrency: a run never overlaps or cancels another.
# The benchmark fails closed on its own (missing secret for non-dry runs,
# incomplete discovery, exceeded budget, missing provenance) — this workflow
# never weakens that; it only supplies provenance and uploads artifacts.
# It never merges, releases, or rewrites production configuration.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate everything without contacting NVIDIA)"
        type: boolean
        default: true
      max_total_requests:
        description: "Hard cap on provider requests for this run"
        type: number
        default: 500
      pricing_scenario:
        description: "Optional path to a reviewed pricing-scenario JSON (empty => hypothetical costs stay 'unknown')"
        type: string
        default: ""
  schedule:
    # Conservative: one live run per month, small budget, single-flight.
    - cron: "23 3 5 * *"

permissions:
  contents: read

concurrency:
  group: nim-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Discover, probe, and benchmark the NIM catalog
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Resolve run parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MAX_REQUESTS: ${{ inputs.max_total_requests }}
          INPUT_PRICING: ${{ inputs.pricing_scenario }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            # Scheduled runs are live but conservative: small hard budget,
            # no pricing scenario (hypothetical costs honestly 'unknown').
            echo "dry_run_flag=" >> "$GITHUB_OUTPUT"
            echo "max_requests=300" >> "$GITHUB_OUTPUT"
            echo "pricing_scenario=" >> "$GITHUB_OUTPUT"
          else
            if [ "$INPUT_DRY_RUN" = "true" ]; then
              echo "dry_run_flag=--dry-run" >> "$GITHUB_OUTPUT"
            else
              echo "dry_run_flag=" >> "$GITHUB_OUTPUT"
            fi
            echo "max_requests=${INPUT_MAX_REQUESTS}" >> "$GITHUB_OUTPUT"
            echo "pricing_scenario=${INPUT_PRICING}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the benchmark
        env:
          # Bootstrap transport only: the CLI seeds this one secret into the
          # in-process KV, then resolves it via get_credential. It is never
          # passed via argv, printed, or serialized into artifacts; the
          # harness refuses to write any artifact containing it.
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          DRY_RUN_FLAG: ${{ steps.params.outputs.dry_run_flag }}
          PRICING_SCENARIO: ${{ steps.params.outputs.pricing_scenario }}
          MAX_REQUESTS: ${{ steps.params.outputs.max_requests }}
          PROVENANCE_GIT_SHA: ${{ github.sha }}
          PROVENANCE_RUN_ID: ${{ github.run_id }}
        run: |
          extra_args=()
          if [ -n "$DRY_RUN_FLAG" ]; then extra_args+=("$DRY_RUN_FLAG"); fi
          if [ -n "$PRICING_SCENARIO" ]; then extra_args+=(--pricing-scenario "$PRICING_SCENARIO"); fi
          python -m contextual_orchestrator nim-benchmark \
            "${extra_args[@]}" \
            --task-manifest examples/nim_task_manifest.json \
            --output-dir benchmark_artifacts \
            --max-total-requests "$MAX_REQUESTS" \
            --git-sha "$PROVENANCE_GIT_SHA" \
            --workflow-run-id "$PROVENANCE_RUN_ID"

      - name: Upload benchmark artifacts (JSON, CSV, Markdown)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # actions/upload-artifact@v5
        with:
          name: nim-benchmark-${{ github.run_id }}
          path: benchmark_artifacts/
          retention-days: 90
          if-no-files-found: error
