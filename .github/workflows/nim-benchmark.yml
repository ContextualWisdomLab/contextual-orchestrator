name: NIM benchmark

# Evidence-grade NVIDIA NIM model discovery and cost-quality benchmark
# (issue #86). Two isolated entry points:
#   * a deterministic manual dry run that never receives provider credentials;
#   * an explicitly selected manual live run or conservative monthly live run.
# Single-flight concurrency prevents overlap and never cancels an active run.
# The benchmark fails closed on incomplete discovery, exceeded budgets, missing
# provenance, or missing live credentials. It never merges, releases, or
# rewrites production configuration.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate everything without contacting NVIDIA)"
        type: boolean
        default: true
      max_total_requests:
        description: "Hard cap on provider requests for this run"
        type: number
        default: 500
      pricing_scenario:
        description: "Optional path to a reviewed pricing-scenario JSON (empty => hypothetical costs stay 'unknown')"
        type: string
        default: ""
  schedule:
    # Conservative: one live run per month under a small hard request budget.
    - cron: "23 3 5 * *"

permissions:
  contents: read

concurrency:
  group: nim-benchmark
  cancel-in-progress: false

jobs:
  dry_run_benchmark:
    name: Validate the benchmark without provider credentials
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Run deterministic dry benchmark
        env:
          PRICING_SCENARIO: ${{ inputs.pricing_scenario }}
          MAX_REQUESTS: ${{ inputs.max_total_requests }}
          PROVENANCE_GIT_SHA: ${{ github.sha }}
          PROVENANCE_RUN_ID: ${{ github.run_id }}
        run: |
          extra_args=(--dry-run)
          if [ -n "$PRICING_SCENARIO" ]; then
            extra_args+=(--pricing-scenario "$PRICING_SCENARIO")
          fi
          python -m contextual_orchestrator nim-benchmark \
            "${extra_args[@]}" \
            --task-manifest examples/nim_task_manifest.json \
            --output-dir benchmark_artifacts \
            --max-total-requests "$MAX_REQUESTS" \
            --git-sha "$PROVENANCE_GIT_SHA" \
            --workflow-run-id "$PROVENANCE_RUN_ID"

      - name: Upload dry-run benchmark artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # actions/upload-artifact@v5
        with:
          name: nim-benchmark-dry-run-${{ github.run_id }}
          path: benchmark_artifacts/
          retention-days: 90
          if-no-files-found: error

  live_benchmark:
    name: Discover, probe, and benchmark the live NIM catalog
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Resolve live-run parameters
        id: live_parameters
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MAX_REQUESTS: ${{ inputs.max_total_requests }}
          INPUT_PRICING: ${{ inputs.pricing_scenario }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "max_requests=300" >> "$GITHUB_OUTPUT"
            echo "pricing_scenario=" >> "$GITHUB_OUTPUT"
          else
            echo "max_requests=${INPUT_MAX_REQUESTS}" >> "$GITHUB_OUTPUT"
            echo "pricing_scenario=${INPUT_PRICING}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run live benchmark
        env:
          # This is the only workflow binding for the provider credential. The
          # dry-run job is structurally separate and cannot receive this value.
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          PRICING_SCENARIO: ${{ steps.live_parameters.outputs.pricing_scenario }}
          MAX_REQUESTS: ${{ steps.live_parameters.outputs.max_requests }}
          PROVENANCE_GIT_SHA: ${{ github.sha }}
          PROVENANCE_RUN_ID: ${{ github.run_id }}
        run: |
          extra_args=()
          if [ -n "$PRICING_SCENARIO" ]; then
            extra_args+=(--pricing-scenario "$PRICING_SCENARIO")
          fi
          python -m contextual_orchestrator nim-benchmark \
            "${extra_args[@]}" \
            --task-manifest examples/nim_task_manifest.json \
            --output-dir benchmark_artifacts \
            --max-total-requests "$MAX_REQUESTS" \
            --git-sha "$PROVENANCE_GIT_SHA" \
            --workflow-run-id "$PROVENANCE_RUN_ID"

      - name: Upload live benchmark artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # actions/upload-artifact@v5
        with:
          name: nim-benchmark-live-${{ github.run_id }}
          path: benchmark_artifacts/
          retention-days: 90
          if-no-files-found: error
