name: Source fix PR1000 NIM decision thresholds

on:
  push:
    branches:
      - fix/no-heuristic-batch-routing
    paths:
      - .github/source-fix-1000-nim-evidence-thresholds.trigger

jobs:
  repair:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/no-heuristic-batch-routing
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: Prove decision regressions are RED before repair
        shell: bash
        run: |
          set -euo pipefail
          if uv run pytest -q tests/test_nim_benchmark_no_heuristic_tokens.py::test_fixed_sample_and_completion_floors_cannot_authorize_evidence; then
            echo '::error::NIM evidence-threshold regression was not RED before production repair'
            exit 1
          fi
          if uv run pytest -q tests/test_nim_benchmark_no_heuristic_tokens.py::test_output_token_allocation_has_no_hand_selected_default; then
            echo '::error::NIM output-token allocation regression was not RED before production repair'
            exit 1
          fi
          if uv run pytest -q tests/test_nim_benchmark_no_heuristic_candidates.py; then
            echo '::error::NIM candidate-admission/name-tie regressions were not RED before production repair'
            exit 1
          fi
      - name: Apply exact-text production repair
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m scripts.ci.repair_pr1000_nim_evidence_thresholds
          uv run python -m scripts.ci.repair_pr1000_nim_candidate_admission
      - name: Verify focused repaired contract
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/test_nim_benchmark_no_heuristic_tokens.py \
            tests/test_nim_benchmark_no_heuristic_candidates.py \
            tests/test_nim_benchmark_release_acceptance.py::test_complete_request_plan_rejects_invalid_counts \
            tests/test_nim_benchmark_release_acceptance.py::test_complete_request_plan_covers_a_127_model_catalog \
            tests/test_nim_benchmark_release_acceptance.py::test_buyer_facing_request_plan_matches_internal_plan \
            tests/test_nim_benchmark_release_acceptance.py::test_one_request_short_fails_after_catalog_before_any_probe \
            tests/test_nim_benchmark_release_acceptance.py::test_smoke_manifest_cannot_authorize_production_routing
          git diff --check
      - name: Remove one-shot repair artifacts, reconcile concurrent head, and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/source-fix-1000-nim-evidence-thresholds.yml \
            .github/source-fix-1000-nim-evidence-thresholds.trigger \
            scripts/ci/repair_pr1000_nim_evidence_thresholds.py \
            scripts/ci/repair_pr1000_nim_candidate_admission.py
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::repair produced no tracked change'
            exit 1
          fi
          git config user.name 'opencode-agent[bot]'
          git config user.email '219766164+opencode-agent[bot]@users.noreply.github.com'
          git commit -m 'fix(nim): retire heuristic benchmark decisions'
          git fetch --no-tags origin fix/no-heuristic-batch-routing
          remote_head="$(git rev-parse FETCH_HEAD)"
          if [ "$remote_head" != "$(git rev-parse HEAD)" ] && ! git merge-base --is-ancestor "$remote_head" HEAD; then
            git merge --no-edit "$remote_head"
            uv run pytest -q \
              tests/test_nim_benchmark_no_heuristic_tokens.py \
              tests/test_nim_benchmark_no_heuristic_candidates.py \
              tests/test_nim_benchmark_release_acceptance.py::test_complete_request_plan_rejects_invalid_counts \
              tests/test_nim_benchmark_release_acceptance.py::test_complete_request_plan_covers_a_127_model_catalog \
              tests/test_nim_benchmark_release_acceptance.py::test_buyer_facing_request_plan_matches_internal_plan \
              tests/test_nim_benchmark_release_acceptance.py::test_one_request_short_fails_after_catalog_before_any_probe \
              tests/test_nim_benchmark_release_acceptance.py::test_smoke_manifest_cannot_authorize_production_routing
            git diff --check
          fi
          git push origin HEAD:fix/no-heuristic-batch-routing
