name: Temporary usage alias repair

on:
  push:
    branches:
      - fix/orchestrated-responses-stream-and-spend-analytics-20260901

permissions:
  contents: write

concurrency:
  group: usage-alias-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/contextual-orchestrator' && github.actor == 'seonghobae'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/orchestrated-responses-stream-and-spend-analytics-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Repair canonical and Responses usage aliases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('contextual_orchestrator/orchestrator.py')
          text = path.read_text(encoding='utf-8')
          old = "\n".join([
              "    @staticmethod",
              "    def _usage_is_reported_token_mapping(usage: Any) -> bool:",
              "        \"\"\"Validate the canonical non-negative token fields of reported usage.\"\"\"",
              "        return isinstance(usage, Mapping) and all(",
              "            type(usage.get(key)) is int and usage[key] >= 0",
              "            for key in (\"prompt_tokens\", \"completion_tokens\", \"total_tokens\")",
              "        )",
          ])
          new = "\n".join([
              "    @staticmethod",
              "    def _usage_is_reported_token_mapping(usage: Any) -> bool:",
              "        \"\"\"Validate complete non-negative Chat or Responses token counters.\"\"\"",
              "        if not isinstance(usage, Mapping):",
              "            return False",
              "        counts = (",
              "            usage.get(\"prompt_tokens\", usage.get(\"input_tokens\")),",
              "            usage.get(\"completion_tokens\", usage.get(\"output_tokens\")),",
              "            usage.get(\"total_tokens\"),",
              "        )",
              "        return all(type(value) is int and value >= 0 for value in counts)",
          ])
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one exact usage validator block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python -m py_compile contextual_orchestrator/orchestrator.py
          python -m pytest -q tests/test_model_judge_usage_provenance_regression.py
          git diff --check

      - name: Commit causal source repair and remove writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ContextualWisdomLab automation'
          git config user.email '8172694+seonghobae@users.noreply.github.com'
          git rm .github/workflows/_temp_usage_alias_repair.yml
          git add contextual_orchestrator/orchestrator.py
          git diff --cached --check
          git commit -m 'fix(accounting): accept Responses usage counters'
          git push origin HEAD:fix/orchestrated-responses-stream-and-spend-analytics-20260901
