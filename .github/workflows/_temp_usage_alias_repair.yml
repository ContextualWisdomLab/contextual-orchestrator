name: Temporary usage alias repair

on:
  push:
    branches:
      - fix/orchestrated-responses-stream-and-spend-analytics-20260901

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/contextual-orchestrator' && github.actor == 'seonghobae'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/orchestrated-responses-stream-and-spend-analytics-20260901
          fetch-depth: 0

      - name: Repair canonical and Responses usage aliases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('contextual_orchestrator/orchestrator.py')
          text = path.read_text(encoding='utf-8')
          old = '''    @staticmethod
              def _usage_is_reported_token_mapping(usage: Any) -> bool:
                  """Validate the canonical non-negative token fields of reported usage."""
                  return isinstance(usage, Mapping) and all(
                      type(usage.get(key)) is int and usage[key] >= 0
                      for key in ("prompt_tokens", "completion_tokens", "total_tokens")
                  )
          '''
          # Keep the replacement literal aligned to source indentation without relying on line numbers.
          old = old.replace('          ', '')
          new = '''    @staticmethod
          def _usage_is_reported_token_mapping(usage: Any) -> bool:
              """Validate non-negative Chat Completions or Responses token fields."""
              if not isinstance(usage, Mapping):
                  return False
              prompt = usage.get("prompt_tokens", usage.get("input_tokens"))
              completion = usage.get("completion_tokens", usage.get("output_tokens"))
              total = usage.get("total_tokens")
              return all(type(value) is int and value >= 0 for value in (prompt, completion, total))
          '''.replace('      ', '')
          if text.count(old) != 1:
              raise SystemExit(f'expected one usage validator block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          python -m compileall -q contextual_orchestrator/orchestrator.py
          grep -F 'RESPONSES_ZERO_USAGE' tests/test_model_judge_usage_provenance_regression.py >/dev/null
          git diff --check

      - name: Commit causal source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ContextualWisdomLab automation'
          git config user.email '8172694+seonghobae@users.noreply.github.com'
          git add contextual_orchestrator/orchestrator.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(accounting): accept Responses usage counters'
          git push origin HEAD:fix/orchestrated-responses-stream-and-spend-analytics-20260901
