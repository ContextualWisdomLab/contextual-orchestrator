name: Issue 998 structured-output fallback TDD writer

on:
  push:
    branches:
      - fix/structured-output-cross-endpoint-fallback-998
    paths:
      - .github/workflows/issue-998-tdd-writer.yml

permissions:
  contents: write

concurrency:
  group: issue-998-structured-output-writer
  cancel-in-progress: false

jobs:
  red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: fix/structured-output-cross-endpoint-fallback-998
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.5"

      - name: Reproduce, repair, verify, and publish source delta
        env:
          TARGET_BRANCH: fix/structured-output-cross-endpoint-fallback-998
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          cat > tests/test_structured_output_cross_endpoint_failover.py <<'PY'
          """Regression for issue #998 cross-endpoint structured-output recovery."""

          from unittest.mock import patch

          from contextual_orchestrator import ModelAgent, TaskOrchestrator


          def test_virtual_structured_contract_failure_advances_to_distinct_endpoint() -> None:
              """Two invalid calls on one candidate must advance to another eligible endpoint."""
              first = ModelAgent("first_agent", "first-model", "mock://catalog")
              other = ModelAgent("other_agent", "other-model", "mock://other")
              orchestrator = TaskOrchestrator([first, other])
              calls: list[str] = []

              def send(agent, _endpoint, _payload):
                  calls.append(agent.id)
                  count = 10 if agent.id == other.id else 6
                  return {
                      "choices": [
                          {"message": {"content": f'{{"input_count": {count}}}'}}
                      ]
                  }

              response_format = {
                  "type": "json_schema",
                  "json_schema": {
                      "name": "exact_count",
                      "strict": True,
                      "schema": {
                          "type": "object",
                          "properties": {"input_count": {"const": 10}},
                          "required": ["input_count"],
                          "additionalProperties": False,
                      },
                  },
              }
              with (
                  patch.object(orchestrator, "conduct", return_value={"trace": []}),
                  patch.object(orchestrator, "_select_agent", return_value=first),
                  patch.object(
                      orchestrator,
                      "_failover_candidates",
                      return_value=[first, other],
                  ),
                  patch.object(orchestrator.client, "proxy_send_once", side_effect=send),
              ):
                  result = orchestrator.proxy_completion(
                      {
                          "model": TaskOrchestrator.AUTO_MODEL,
                          "messages": [
                              {"role": "user", "content": "classify ten items"}
                          ],
                          "response_format": response_format,
                      },
                      single_agent=False,
                  )

              assert result["choices"][0]["message"]["content"] == '{"input_count": 10}'
              assert calls == [first.id, first.id, other.id]
          PY

          set +e
          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q tests/test_structured_output_cross_endpoint_failover.py
          red_rc=$?
          set -e
          if [ "$red_rc" -eq 0 ]; then
            echo "::error::RED regression unexpectedly passed before the production repair."
            exit 1
          fi
          echo "::notice::RED reproduced: cross-endpoint structured fallback is absent."

          python - <<'PY'
          from pathlib import Path

          path = Path("contextual_orchestrator/orchestrator.py")
          text = path.read_text(encoding="utf-8")
          old = '''            failed_endpoint = failed_agent.base_url.rstrip("/").casefold()
              next_agent = next(
                  (
                      candidate
                      for candidate in synthesis_candidates
                      if candidate.id not in request_exclusions
                      and candidate.base_url.rstrip("/").casefold() == failed_endpoint
                  ),
                  None,
              )
              if next_agent is None:
                  raise ProviderResponseError(
                      "every eligible model on the selected endpoint violated response_format"
                  )
          '''
          new = '''            next_agent = next(
                  (
                      candidate
                      for candidate in synthesis_candidates
                      if candidate.id not in request_exclusions
                  ),
                  None,
              )
              if next_agent is None:
                  raise ProviderResponseError(
                      "every eligible structured-output model violated response_format"
                  )
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  "expected exactly one same-endpoint structured fallback block; "
                  f"found {text.count(old)}"
              )
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q \
            tests/test_structured_output_cross_endpoint_failover.py \
            tests/test_model_judge.py \
            tests/test_chat_response_format_http_honesty.py \
            tests/test_routing_endpoint_constraint.py \
            tests/test_candidate_routing_controls.py

          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m ruff check \
            contextual_orchestrator/orchestrator.py \
            tests/test_structured_output_cross_endpoint_failover.py

          uv run --locked --extra api --extra db --extra queue --group dev \
            python -m pytest -q

          git diff --check
          git add contextual_orchestrator/orchestrator.py \
            tests/test_structured_output_cross_endpoint_failover.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(structured-output): fail over across eligible endpoints"
          git push origin "HEAD:${TARGET_BRANCH}"
