name: Finalize endpoint transport and agent role separation

on:
  push:
    branches:
      - fix/chat-capability-isolation-embedding-models
    paths:
      - .github/workflows/repair-chat-capability-finalize-v3.yml

permissions:
  contents: write

concurrency:
  group: repair-chat-transport-role-separation
  cancel-in-progress: true

jobs:
  finalize:
    name: Patch, verify, and self-delete
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: fix/chat-capability-isolation-embedding-models
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Finalize capability boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          Path("contextual_orchestrator/chat_capability.py").write_text(
              '''"""Classify chat transport compatibility and ordinary agent-role eligibility.

Provider catalogs mix endpoint-only models with models served through an
OpenAI-compatible chat transport. Transport compatibility is not the same as
fitness for an ordinary thinker, worker, verifier, or synthesizer role: audio and
policy-classification models can use chat transport, while embedding, reranking,
transcription, moderation-endpoint, image-generation, realtime, and speech-only
models cannot.
"""

from __future__ import annotations

import re

_MODEL_TOKEN_RE = re.compile(r"[a-z0-9]+")
_TRANSPORT_INCOMPATIBLE_EXACT_TOKENS = frozenset(
    {
        "bge",
        "clip",
        "dall",
        "e5",
        "embed",
        "embedding",
        "embeddings",
        "gte",
        "image",
        "images",
        "moderation",
        "realtime",
        "rerank",
        "reranker",
        "siglip",
        "sora",
        "speech",
        "transcribe",
        "transcription",
        "tts",
        "whisper",
    }
)
_TRANSPORT_INCOMPATIBLE_PREFIXES = (
    "embed",
    "moderat",
    "rerank",
    "transcrib",
)


def _model_tokens(model_id: str) -> tuple[str, ...]:
    """Normalize one provider-prefixed model identifier into lowercase tokens."""
    if type(model_id) is not str:
        return ()
    return tuple(_MODEL_TOKEN_RE.findall(model_id.casefold()))


def is_chat_transport_compatible_model_id(model_id: str) -> bool:
    """Return whether an identifier can use the ordinary chat transport.

    The classifier rejects only identifiers that clearly advertise an endpoint
    family incompatible with chat messages. Audio-capable and safety-classifier
    models remain transport-compatible because providers serve some of them over
    ``/chat/completions``.
    """
    tokens = _model_tokens(model_id)
    if not tokens:
        return False
    for token in tokens:
        if token in _TRANSPORT_INCOMPATIBLE_EXACT_TOKENS:
            return False
        if token.startswith(_TRANSPORT_INCOMPATIBLE_PREFIXES):
            return False
    return True


def is_chat_compatible_model_id(model_id: str) -> bool:
    """Backward-compatible name for chat transport compatibility."""
    return is_chat_transport_compatible_model_id(model_id)


def is_general_chat_agent_model_id(model_id: str) -> bool:
    """Return whether a chat model may enter ordinary orchestration roles.

    Explicit guard and safety models can use chat transport but are specialized
    policy classifiers, not general answer synthesizers. This negative role gate
    does not infer reasoning, coding, vision, or verification capabilities.
    """
    tokens = _model_tokens(model_id)
    if not tokens or not is_chat_transport_compatible_model_id(model_id):
        return False
    return not any(
        token == "safety"
        or token == "guard"
        or token.startswith("nemoguard")
        or token.endswith("guard")
        for token in tokens
    )
''',
              encoding="utf-8",
          )

          import_pattern = re.compile(
              r"from \.chat_capability import (?:\([^)]*\)|[^\n]+)\n",
              re.DOTALL,
          )

          discovery_path = Path("contextual_orchestrator/model_discovery.py")
          discovery = discovery_path.read_text(encoding="utf-8")
          discovery, count = import_pattern.subn(
              "from .chat_capability import (\n"
              "    is_chat_compatible_model_id,  # compatibility re-export\n"
              "    is_general_chat_agent_model_id,\n"
              ")\n",
              discovery,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"model discovery import: expected one match, found {count}")
          for name in (
              "is_chat_transport_compatible_model_id",
              "is_chat_compatible_model_id",
              "is_general_chat_agent_model_id",
          ):
              discovery = discovery.replace(
                  f"{name}(",
                  "is_general_chat_agent_model_id(",
              )
          discovery = discovery.replace(
              "One chat-compatible model found on a provider, with reported pricing.",
              "One general chat-agent candidate found on a provider, with reported pricing.",
          )
          discovery = discovery.replace(
              "Build a disabled chat ModelAgent or reject a non-chat discovery record.",
              "Build a disabled general chat agent or reject an ineligible discovery record.",
          )
          discovery = discovery.replace(
              'raise ValueError("non-chat model cannot be converted into a chat agent")',
              'raise ValueError("model is not eligible for the general chat agent pool")',
          )
          discovery_path.write_text(discovery, encoding="utf-8")

          orchestrator_path = Path("contextual_orchestrator/orchestrator.py")
          orchestrator = orchestrator_path.read_text(encoding="utf-8")
          orchestrator, count = import_pattern.subn(
              "from .chat_capability import (\n"
              "    is_chat_transport_compatible_model_id,\n"
              "    is_general_chat_agent_model_id,\n"
              ")\n",
              orchestrator,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"orchestrator import: expected one match, found {count}")

          for name in (
              "is_chat_compatible_model_id",
              "is_chat_transport_compatible_model_id",
              "is_general_chat_agent_model_id",
          ):
              orchestrator = orchestrator.replace(
                  f"not {name}(agent.model)",
                  "not is_chat_transport_compatible_model_id(agent.model)",
              )
          for name in (
              "is_chat_compatible_model_id",
              "is_chat_transport_compatible_model_id",
              "is_general_chat_agent_model_id",
          ):
              orchestrator = orchestrator.replace(
                  f"if {name}(agent.model)",
                  "if is_general_chat_agent_model_id(agent.model)",
              )
              orchestrator = orchestrator.replace(
                  f"not {name}(assigned.model)",
                  "not is_general_chat_agent_model_id(assigned.model)",
              )
          orchestrator_path.write_text(orchestrator, encoding="utf-8")

          existing_tests_path = Path("tests/test_chat_model_capability_isolation.py")
          existing_tests = existing_tests_path.read_text(encoding="utf-8").replace(
              'with pytest.raises(ValueError, match="non-chat model"):',
              'with pytest.raises(ValueError, match="general chat agent"):',
          )
          existing_tests_path.write_text(existing_tests, encoding="utf-8")

          Path("tests/test_chat_transport_role_separation.py").write_text(
              '''"""Regression tests for chat transport versus ordinary agent roles."""

from __future__ import annotations

import sys
from pathlib import Path

import pytest

sys.path.insert(0, str(Path(__file__).resolve().parents[1]))

from contextual_orchestrator import ModelAgent, TaskOrchestrator  # noqa: E402
from contextual_orchestrator.chat_capability import (  # noqa: E402
    is_chat_transport_compatible_model_id,
    is_general_chat_agent_model_id,
)
from contextual_orchestrator.orchestrator import ModelClient  # noqa: E402


def _agent(agent_id: str, model_id: str, *, priority: int = 0) -> ModelAgent:
    """Build one mock-backed agent for transport and role regressions."""
    return ModelAgent(
        id=agent_id,
        model=model_id,
        base_url="mock://local",
        priority=priority,
        tags=("writing",),
    )


@pytest.mark.parametrize(
    "model_id",
    [
        "gpt-audio",
        "gpt-4o-audio-preview",
        "gpt-4o-mini-audio-preview",
        "nvidia/llama-3.1-nemotron-safety-guard-8b-v3",
        "meta-llama/Llama-Guard-4-12B",
    ],
)
def test_chat_endpoint_models_remain_transport_compatible(model_id: str) -> None:
    """Do not reject models that providers serve through chat transport."""
    assert is_chat_transport_compatible_model_id(model_id)


@pytest.mark.parametrize(
    "model_id",
    [
        "nvidia/llama-3.1-nemotron-safety-guard-8b-v3",
        "nvidia/llama-3.1-nemoguard-8b-content-safety",
        "meta-llama/Llama-Guard-4-12B",
    ],
)
def test_guard_models_do_not_enter_general_synthesis_pool(model_id: str) -> None:
    """Keep chat-served policy classifiers out of ordinary worker roles."""
    assert not is_general_chat_agent_model_id(model_id)


@pytest.mark.parametrize(
    "model_id",
    [
        "gpt-audio",
        "gpt-4o-audio-preview",
        "gpt-5.2",
        "qwen/qwen3-235b-a22b-instruct",
    ],
)
def test_general_generation_models_remain_agent_eligible(model_id: str) -> None:
    """Preserve capable chat generation models for ordinary agent selection."""
    assert is_general_chat_agent_model_id(model_id)


@pytest.mark.parametrize(
    "model_id",
    [
        "azure/text-embedding-3-large",
        "text_embedding_3_large",
        "company/reranker-v2",
        "gpt-4o-mini-transcribe",
        "omni-moderation-latest",
        "gpt-image-1",
        "dall-e-3",
        "gpt-realtime",
        "tts-1",
    ],
)
def test_endpoint_only_models_fail_both_boundaries(model_id: str) -> None:
    """Reject clear non-chat endpoint families before transport or routing."""
    assert not is_chat_transport_compatible_model_id(model_id)
    assert not is_general_chat_agent_model_id(model_id)


def test_direct_transport_can_use_guard_but_role_selection_cannot() -> None:
    """Separate an intentional direct policy call from generic synthesis."""
    guard_agent = _agent(
        "guard_agent",
        "meta-llama/Llama-Guard-4-12B",
        priority=10_000,
    )
    chat_agent = _agent("chat_agent", "gpt-5.2")
    client = ModelClient()

    output = client.chat(
        guard_agent,
        [{"role": "user", "content": "Classify this policy input."}],
    )
    assert isinstance(output, str)
    orchestrator = TaskOrchestrator([guard_agent, chat_agent], client=client)
    assert orchestrator._select_agent("Produce the final answer.", "synthesizer") is chat_agent
''',
              encoding="utf-8",
          )

          doctoring_path = Path("docs/doctoring/embedding-chat-capability-isolation.md")
