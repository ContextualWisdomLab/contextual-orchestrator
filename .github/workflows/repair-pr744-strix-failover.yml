name: Repair PR 744 Strix failover

on:
  push:
    branches:
      - cursor/model-auto-discovery-b4a1
    paths:
      - .github/workflows/repair-pr744-strix-failover.yml

permissions:
  contents: write

concurrency:
  group: repair-pr744-strix-failover
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: cursor/model-auto-discovery-b4a1
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge current main without discarding feature fixes
        run: |
          set -euo pipefail
          git config user.name "opencode-agent[bot]"
          git config user.email "219766164+opencode-agent[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git merge --no-edit -X ours origin/main

      - name: Apply test-first failover and price fixes
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "contextual_orchestrator/price_honesty.py",
              "    return (prompt + completion) / 2.0\n",
              "    return (prompt / 2.0) + (completion / 2.0)\n",
          )

          replace_once(
              "tests/test_original_list_price.py",
              "from contextual_orchestrator.model_discovery import (  # noqa: E402\n",
              "from contextual_orchestrator.price_honesty import complete_pair_mean  # noqa: E402\n"
              "from contextual_orchestrator.model_discovery import (  # noqa: E402\n",
          )
          replace_once(
              "tests/test_original_list_price.py",
              "\n\ndef test_partial_two_sided_price_is_unknown_not_free() -> None:\n",
              "\n\ndef test_complete_pair_mean_avoids_intermediate_overflow() -> None:\n"
              "    result = complete_pair_mean(sys.float_info.max, sys.float_info.max)\n"
              "    assert result == sys.float_info.max\n"
              "    assert result < float(\"inf\")\n"
              "\n\ndef test_partial_two_sided_price_is_unknown_not_free() -> None:\n",
          )
          replace_once(
              "tests/test_original_list_price.py",
              "    test_non_finite_and_boolean_prices_are_unknown()\n",
              "    test_non_finite_and_boolean_prices_are_unknown()\n"
              "    test_complete_pair_mean_avoids_intermediate_overflow()\n",
          )

          orchestrator_path = Path("contextual_orchestrator/orchestrator.py")
          orchestrator = orchestrator_path.read_text(encoding="utf-8")

          proxy_send_marker = (
              "    def proxy_send(\n"
              "        self, agent: ModelAgent, endpoint: str, payload: dict[str, Any]\n"
              "    ) -> dict[str, Any]:\n"
              "        \"\"\"Passthrough a full request to one agent, returning the raw provider JSON.\"\"\"\n"
              "        if agent.base_url.startswith(\"mock://\"):\n"
              "            return self._mock_raw(agent, endpoint, payload)\n"
              "        self._validate_provider(agent)  # pragma: no cover\n"
              "        return self._send_raw_with_retry(agent, endpoint, payload)  # pragma: no cover\n"
              "\n"
          )
          proxy_send_once = (
              "    def proxy_send_once(\n"
              "        self, agent: ModelAgent, endpoint: str, payload: dict[str, Any]\n"
              "    ) -> dict[str, Any]:\n"
              "        \"\"\"Passthrough once so a transient failure can change model/provider.\n"
              "\n"
              "        Structured and tool-bearing requests can be very large. Repeating\n"
              "        the same saturated model amplifies 429 pressure and consumes the\n"
              "        caller's bounded execution window, so cross-agent failover owns\n"
              "        retries for this path.\n"
              "        \"\"\"\n"
              "        if agent.base_url.startswith(\"mock://\"):\n"
              "            return self._mock_raw(agent, endpoint, payload)\n"
              "        self._validate_provider(agent)  # pragma: no cover\n"
              "        return self._send_raw(agent, endpoint, payload)  # pragma: no cover\n"
              "\n"
          )
          if orchestrator.count(proxy_send_marker) != 1:
              raise SystemExit("orchestrator.py: proxy_send marker mismatch")
          orchestrator = orchestrator.replace(
              proxy_send_marker, proxy_send_marker + proxy_send_once, 1
          )

          proxy_completion_start = orchestrator.index("    def proxy_completion(\n")
          proxy_completion_end = orchestrator.index(
              "    def complete(self, messages: list[ChatMessage]", proxy_completion_start
          )
          proxy_completion_new = (
              "    def proxy_completion(\n"
              "        self, body: dict[str, Any], *, endpoint: str = \"chat/completions\"\n"
              "    ) -> dict[str, Any]:\n"
              "        \"\"\"Passthrough a full OpenAI request with capability-ranked failover.\n"
              "\n"
              "        Provider-specific response shapes remain single-agent per attempt,\n"
              "        while a transient failure advances to the next eligible model or\n"
              "        provider. Each candidate receives one upstream attempt, preventing\n"
              "        repeated multi-million-token requests against a rate-limited model.\n"
              "        \"\"\"\n"
              "        messages = body.get(\"messages\")\n"
              "        if isinstance(messages, list):\n"
              "            text = self._latest_user_text(messages)\n"
              "        else:\n"
              "            text = _coerce_input_text(body.get(\"input\"))\n"
              "        primary = self._select_agent(text, \"worker\")\n"
              "        upstream_template = {\n"
              "            key: value\n"
              "            for key, value in body.items()\n"
              "            if key not in self._ORCHESTRATION_ONLY_KEYS\n"
              "        }\n"
              "        # v1 passthrough returns the full JSON body; SSE stream passthrough is a\n"
              "        # follow-up, so force a non-streamed upstream response here.\n"
              "        upstream_template[\"stream\"] = False\n"
              "\n"
              "        candidates = self._failover_candidates(primary, text, \"worker\")\n"
              "        last_error: Exception | None = None\n"
              "        for agent in candidates:\n"
              "            upstream = dict(upstream_template)\n"
              "            upstream[\"model\"] = agent.model\n"
              "            try:\n"
              "                send_once = getattr(self.client, \"proxy_send_once\", None)\n"
              "                if send_once is None:\n"
              "                    result = self.client.proxy_send(agent, endpoint, upstream)\n"
              "                else:\n"
              "                    result = send_once(agent, endpoint, upstream)\n"
              "            except Exception as exc:  # noqa: BLE001 - one provider yields to the next\n"
              "                last_error = exc\n"
              "                self._record_failure(agent.id, immediate=is_transient_error(exc))\n"
              "                continue\n"
              "            self._record_success(agent.id)\n"
              "            return result\n"
              "        raise RuntimeError(\n"
              "            f\"all {len(candidates)} candidate agents failed for passthrough endpoint={endpoint}\"\n"
              "        ) from last_error\n"
              "\n"
          )
          orchestrator = (
              orchestrator[:proxy_completion_start]
              + proxy_completion_new
              + orchestrator[proxy_completion_end:]
          )

          failure_start = orchestrator.index("    def _record_failure(self, agent_id: str) -> None:\n")
          failure_end = orchestrator.index("    def _record_success(", failure_start)
          failure_new = (
              "    def _record_failure(self, agent_id: str, *, immediate: bool = False) -> None:\n"
              "        \"\"\"Record failure and optionally open the circuit immediately.\n"
              "\n"
              "        A transient failure on the structured passthrough path represents\n"
              "        an expensive request that should not be repeated against the same\n"
              "        provider during the cooldown window.\n"
              "        \"\"\"\n"
              "        state = self._circuit.setdefault(agent_id, {\"failures\": 0.0, \"opened_at\": 0.0})\n"
              "        state[\"failures\"] += 1.0\n"
              "        if immediate:\n"
              "            state[\"failures\"] = max(\n"
              "                state[\"failures\"], float(self.circuit_failure_threshold)\n"
              "            )\n"
              "        if state[\"failures\"] >= self.circuit_failure_threshold and not state[\"opened_at\"]:\n"
              "            state[\"opened_at\"] = time.monotonic()\n"
              "\n"
          )
          orchestrator_path.write_text(
              orchestrator[:failure_start] + failure_new + orchestrator[failure_end:],
              encoding="utf-8",
          )

          passthrough_path = Path("tests/test_openai_passthrough.py")
          passthrough = passthrough_path.read_text(encoding="utf-8")
          passthrough = passthrough.replace(
              "from __future__ import annotations\n\nimport json\n",
              "from __future__ import annotations\n\nimport copy\nimport json\n",
              1,
          )
          passthrough = passthrough.replace(
              "from pathlib import Path\n\nsys.path.insert",
              "from pathlib import Path\n\nimport pytest\n\nsys.path.insert",
              1,
          )
          marker = "\n\ndef test_proxy_completion_responses_endpoint_returns_response_object() -> None:\n"
          if passthrough.count(marker) != 1:
              raise SystemExit("tests/test_openai_passthrough.py: response-test marker mismatch")
          addition = r'''

          class _FailoverPassthroughClient:
              """Test client that fails selected agents without same-agent retries."""

              def __init__(self, failing_agent_ids: set[str]) -> None:
                  self.failing_agent_ids = failing_agent_ids
                  self.calls: list[tuple[str, str, dict]] = []

              def proxy_send_once(
                  self, agent: ModelAgent, endpoint: str, payload: dict
              ) -> dict:
                  """Record one attempt and either fail or return a raw provider shape."""
                  self.calls.append((agent.id, endpoint, copy.deepcopy(payload)))
                  if agent.id in self.failing_agent_ids:
                      raise urllib.error.HTTPError(
                          url=agent.base_url,
                          code=429,
                          msg="Too Many Requests",
                          hdrs=None,
                          fp=None,
                      )
                  return {
                      "id": f"chatcmpl_{agent.id}",
                      "object": "chat.completion",
                      "model": agent.model,
                      "choices": [
                          {
                              "index": 0,
                              "message": {
                                  "role": "assistant",
                                  "content": None,
                                  "tool_calls": [
                                      {
                                          "id": "call_1",
                                          "type": "function",
                                          "function": {"name": "lookup", "arguments": "{}"},
                                      }
                                  ],
                              },
                              "finish_reason": "tool_calls",
                          }
                      ],
                  }


          def _failover_orchestrator(client: _FailoverPassthroughClient) -> TaskOrchestrator:
              """Build a deterministic primary/fallback pool for passthrough tests."""
              return TaskOrchestrator(
                  agents=[
                      ModelAgent(
                          "primary_agent",
                          "primary-model",
                          base_url="mock://primary",
                          tags=("coding", "implementation", "reasoning"),
                          priority=100,
                      ),
                      ModelAgent(
                          "fallback_agent",
                          "fallback-model",
                          base_url="mock://fallback",
                          tags=("coding", "implementation", "reasoning"),
                          priority=90,
                      ),
                  ],
                  client=client,
              )


          def test_tool_passthrough_moves_to_fallback_after_one_429() -> None:
              client = _FailoverPassthroughClient({"primary_agent"})
              orchestrator = _failover_orchestrator(client)
              tools = [{"type": "function", "function": {"name": "lookup", "parameters": {}}}]
              body = {
                  "messages": [{"role": "user", "content": "inspect this repository"}],
                  "tools": tools,
                  "tool_choice": "auto",
                  "mode": "auto",
              }
              original = copy.deepcopy(body)

              result = orchestrator.proxy_completion(body)

              assert body == original
              assert [call[0] for call in client.calls] == ["primary_agent", "fallback_agent"]
              assert [call[2]["model"] for call in client.calls] == ["primary-model", "fallback-model"]
              assert all(call[2]["tools"] == tools for call in client.calls)
              assert all(call[2]["tool_choice"] == "auto" for call in client.calls)
              assert all(call[2]["stream"] is False for call in client.calls)
              assert all("mode" not in call[2] for call in client.calls)
              assert orchestrator._circuit_open("primary_agent")
              assert result["model"] == "fallback-model"
              assert result["choices"][0]["message"]["tool_calls"][0]["function"]["name"] == "lookup"


          def test_tool_passthrough_fails_after_each_candidate_once() -> None:
              client = _FailoverPassthroughClient({"primary_agent", "fallback_agent"})
              orchestrator = _failover_orchestrator(client)

              with pytest.raises(RuntimeError, match="all 2 candidate agents failed"):
                  orchestrator.proxy_completion(
                      {
                          "messages": [{"role": "user", "content": "inspect this repository"}],
                          "tools": [{"type": "function", "function": {"name": "lookup", "parameters": {}}}],
                      }
                  )

              assert [call[0] for call in client.calls] == ["primary_agent", "fallback_agent"]
          '''
          passthrough_path.write_text(passthrough.replace(marker, addition + marker, 1), encoding="utf-8")
          PY

      - name: Install locked review test dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify focused and full suites
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-opencode-review-ci.txt
          python3 -m pytest tests/test_original_list_price.py tests/test_openai_passthrough.py -q
          python3 -m pytest tests -q
          python3 -m compileall -q contextual_orchestrator tests

      - name: Commit verified repair and remove one-shot workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-pr744-strix-failover.yml
          git add contextual_orchestrator/orchestrator.py \
            contextual_orchestrator/price_honesty.py \
            tests/test_original_list_price.py \
            tests/test_openai_passthrough.py \
            .github/workflows/repair-pr744-strix-failover.yml
          git commit -m "fix(routing): fail over Strix tool calls after one 429"
          git push origin HEAD:cursor/model-auto-discovery-b4a1
