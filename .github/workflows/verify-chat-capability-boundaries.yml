name: Verify chat capability boundaries

on:
  push:
    branches:
      - fix/chat-capability-isolation-embedding-models
    paths:
      - .github/workflows/verify-chat-capability-boundaries.yml

permissions:
  contents: read

concurrency:
  group: verify-chat-capability-boundaries
  cancel-in-progress: false

jobs:
  prepare:
    name: Prove RED, apply GREEN, and verify read-only
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      base_sha: ${{ steps.export.outputs.base_sha }}
      patch_b64: ${{ steps.export.outputs.patch_b64 }}
    steps:
      - name: Checkout exact triggering commit without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r fuzz/requirements-property.txt

      - name: Confirm the transport-role regression is RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q tests/test_chat_transport_role_separation.py > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "${status}" -ne 0
          grep -Eq "is_general_chat_agent_model_id|cannot import name" /tmp/red.log

      - name: Apply the narrow capability-boundary fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          Path("contextual_orchestrator/chat_capability.py").write_text(
              '''"""Classify chat transport compatibility and ordinary agent-role eligibility.

Provider catalogs mix endpoint-only models with models served through an
OpenAI-compatible chat transport. Transport compatibility is not the same as
fitness for an ordinary thinker, worker, verifier, or synthesizer role: audio and
policy-classification models can use chat transport, while embedding, reranking,
transcription, moderation-endpoint, image-generation, realtime, and speech-only
models cannot.
"""

from __future__ import annotations

import re

_MODEL_TOKEN_RE = re.compile(r"[a-z0-9]+")
_TRANSPORT_INCOMPATIBLE_EXACT_TOKENS = frozenset(
    {
        "bge",
        "e5",
        "embed",
        "embedding",
        "embeddings",
        "gte",
        "image",
        "images",
        "moderation",
        "realtime",
        "rerank",
        "reranker",
        "sora",
        "speech",
        "transcribe",
        "transcription",
        "tts",
        "whisper",
    }
)
_TRANSPORT_INCOMPATIBLE_PREFIXES = (
    "embed",
    "moderat",
    "rerank",
    "transcrib",
)


def _model_tokens(model_id: str) -> tuple[str, ...]:
    """Normalize a provider-prefixed model identifier into lowercase tokens."""
    if type(model_id) is not str:
        return ()
    return tuple(_MODEL_TOKEN_RE.findall(model_id.casefold()))


def is_chat_compatible_model_id(model_id: str) -> bool:
    """Return whether an identifier can use an ordinary chat operation.

    Only identifiers that clearly advertise a non-chat endpoint family are
    rejected. Audio-capable and policy-classification models remain transport
    compatible when their providers serve them through chat completions.
    """
    tokens = _model_tokens(model_id)
    if not tokens:
        return False
    for token in tokens:
        if token in _TRANSPORT_INCOMPATIBLE_EXACT_TOKENS:
            return False
        if token.startswith(_TRANSPORT_INCOMPATIBLE_PREFIXES):
            return False
    return True


def is_general_chat_agent_model_id(model_id: str) -> bool:
    """Return whether a chat model may enter ordinary orchestration roles.

    Explicit guard and safety models are specialized policy classifiers rather
    than general answer synthesizers. This negative role gate does not infer any
    positive reasoning, coding, vision, or verification capability from a name.
    """
    tokens = _model_tokens(model_id)
    if not tokens or not is_chat_compatible_model_id(model_id):
        return False
    return not any(
        token == "safety"
        or token == "guard"
        or token.startswith("nemoguard")
        or token.endswith("guard")
        for token in tokens
    )
''',
              encoding="utf-8",
          )

          discovery_path = Path("contextual_orchestrator/model_discovery.py")
          discovery = discovery_path.read_text(encoding="utf-8")
          discovery = replace_once(
              discovery,
              "from .chat_capability import is_chat_compatible_model_id\n",
              "from .chat_capability import is_general_chat_agent_model_id\n",
              "model discovery capability import",
          )
          discovery = discovery.replace(
              "is_chat_compatible_model_id(",
              "is_general_chat_agent_model_id(",
          )
          discovery = discovery.replace(
              "Provider model-list discovery for chat-agent candidates.",
              "Provider model-list discovery for general chat-agent candidates.",
          )
          discovery = discovery.replace(
              "Clearly non-chat identifiers are rejected",
              "Clearly endpoint-incompatible or specialized identifiers are rejected",
          )
          discovery = discovery.replace(
              "One chat-compatible model found on a provider, with reported pricing.",
              "One general chat-agent candidate found on a provider, with reported pricing.",
          )
          discovery = discovery.replace(
              "chat-compatible candidates",
              "general chat-agent candidates",
          )
          discovery = discovery.replace(
              "Build a disabled chat ModelAgent or reject a non-chat discovery record.",
              "Build a disabled general chat agent or reject an ineligible discovery record.",
          )
          discovery = discovery.replace(
              "Write every discovered chat model's known pricing into the price book.",
              "Write every eligible general chat model's known pricing into the price book.",
          )
          discovery = discovery.replace(
              "lowest-cost chat-compatible model",
              "lowest-cost general chat-agent model",
          )
          discovery = discovery.replace(
              "cheapest chat-compatible models",
              "cheapest general chat-agent models",
          )
          discovery_path.write_text(discovery, encoding="utf-8")

          orchestrator_path = Path("contextual_orchestrator/orchestrator.py")
          orchestrator = orchestrator_path.read_text(encoding="utf-8")
          orchestrator = replace_once(
              orchestrator,
              "from .chat_capability import is_chat_compatible_model_id\n",
              "from .chat_capability import (\n"
              "    is_chat_compatible_model_id,\n"
              "    is_general_chat_agent_model_id,\n"
              ")\n",
              "orchestrator capability imports",
          )
          orchestrator = replace_once(
              orchestrator,
              "            if is_chat_compatible_model_id(agent.model)\n"
              "        )\n"
              "        system = (\n",
              "            if is_general_chat_agent_model_id(agent.model)\n"
              "        )\n"
              "        system = (\n",
              "planner inventory role gate",
          )
          orchestrator = replace_once(
              orchestrator,
              "            if assigned is None or not is_chat_compatible_model_id(assigned.model):\n",
              "            if assigned is None or not is_general_chat_agent_model_id(assigned.model):\n",
              "generated assignment role gate",
          )
          orchestrator = replace_once(
              orchestrator,
              "            if is_chat_compatible_model_id(agent.model)\n"
              "        ]\n\n"
              "    def _select_agent",
              "            if is_general_chat_agent_model_id(agent.model)\n"
              "        ]\n\n"
              "    def _select_agent",
              "ranked agent role gate",
          )
          orchestrator = replace_once(
              orchestrator,
              "            if is_chat_compatible_model_id(agent.model)\n"
              "        ]\n"
              "        eligible = [agent for agent in ordered",
              "            if is_general_chat_agent_model_id(agent.model)\n"
              "        ]\n"
              "        eligible = [agent for agent in ordered",
              "failover role gate",
          )
          orchestrator = replace_once(
              orchestrator,
              "raise RuntimeError(f\"no chat-compatible agent available for role={role}\")",
              "raise RuntimeError(f\"no general chat-compatible agent available for role={role}\")",
              "general-role empty-pool error",
          )
          orchestrator_path.write_text(orchestrator, encoding="utf-8")

          incident_path = Path("tests/test_chat_model_capability_isolation.py")
          incident = incident_path.read_text(encoding="utf-8")
          incident = replace_once(
              incident,
              "from contextual_orchestrator.credentials import (  # noqa: E402\n",
              "from contextual_orchestrator.chat_capability import (  # noqa: E402\n"
              "    is_chat_compatible_model_id,\n"
              ")\n"
              "from contextual_orchestrator.credentials import (  # noqa: E402\n",
              "direct transport classifier import",
          )
          incident = replace_once(
              incident,
              "    discover_provider_models,\n"
              "    is_chat_compatible_model_id,\n"
              "    refresh_price_book,\n",
              "    discover_provider_models,\n"
              "    refresh_price_book,\n",
              "remove discovery-module classifier re-export dependency",
          )
          incident = replace_once(
              incident,
              "            {\"id\": \"company/reranker-v2\"},\n"
              "            {\"id\": \"gpt-5.2\"},\n",
              "            {\"id\": \"company/reranker-v2\"},\n"
              "            {\"id\": \"nvidia/llama-3.1-nemotron-safety-guard-8b-v3\"},\n"
              "            {\"id\": \"gpt-audio\"},\n"
              "            {\"id\": \"gpt-5.2\"},\n",
              "mixed discovery capability cases",
          )
          incident = replace_once(
              incident,
              "    assert [model.model_id for model in discovered] == [\n"
              "        \"gpt-5.2\",\n",
              "    assert [model.model_id for model in discovered] == [\n"
              "        \"gpt-audio\",\n"
              "        \"gpt-5.2\",\n",
              "audio discovery expectation",
          )
          incident = replace_once(
              incident,
              "        (\"vendor/transcriber-v2\", False),\n"
              "        (\"gpt-5.2\", True),\n",
              "        (\"vendor/transcriber-v2\", False),\n"
              "        (\"gpt-audio\", True),\n"
              "        (\"nvidia/llama-3.1-nemotron-safety-guard-8b-v3\", True),\n"
              "        (\"gpt-5.2\", True),\n",
              "transport-compatible audio and policy cases",
          )
          incident_path.write_text(incident, encoding="utf-8")

          Path("docs/doctoring/embedding-chat-capability-isolation.md").write_text(
              '''# Embedding-to-chat capability isolation incident

**Status:** Accepted incident decision
**Date:** 2026-08-20
**Affected consumer:** LineageWeave buyer-surface stack around PR #260

## Incident

A conducted workflow reached the final contextual-orchestrator synthesizer with
`model_group=text-embedding-3-large` and deployment
`azure/text-embedding-3-large`. The gateway rejected the chat operation as
unsupported. Its configured fallback map contained chat-generation model groups,
but no fallback attached to the embedding group.

The missing fallback was a symptom, not the causal defect. An embedding deployment
had already crossed the ordinary chat-agent boundary and become eligible for a
worker role.

## Causal boundary

Provider-compatible `/models` registries can contain multiple endpoint families.
The original discovery parser accepted every non-empty model identifier and exposed
it to agent creation, price selection, and durable pool synchronization. A catalog
row naming an embedding deployment could therefore be scored for thinker, worker,
verifier, or synthesizer work even though its serving endpoint accepts embedding
input rather than chat messages.

The first incident fix closed discovery and price-routing boundaries, but an
already-persisted incompatible `ModelAgent` could still survive that filter.
Runtime ranking, generated workflow assignment, cross-agent failover, readiness
probing, streaming, and direct `ModelClient.chat()` previously trusted the persisted
identifier. That stale-state path reproduces the same unsupported Azure operation
after a restart or durable bootstrap.

Capability classification must answer two different questions. **Chat transport
compatibility** asks whether a model can be invoked through a chat-completions
operation. **General agent-role eligibility** asks whether that chat-served model is
appropriate for ordinary thinker, worker, verifier, or synthesizer work. OpenAI's
`gpt-audio` and `gpt-audio-mini` are served through Chat Completions. NVIDIA content
safety and topic-control NIMs also expose OpenAI-compatible chat-completions
interfaces, but they are specialized policy classifiers rather than general answer
generators. Rejecting every identifier containing `audio`, `guard`, or `safety` at
the transport layer would therefore create a new endpoint-routing defect while
fixing the embedding incident.

OpenAI documents `text-embedding-3-large` under the embeddings endpoint, separately
from chat-completions models. Microsoft demonstrates it with
`client.embeddings.create`, not `client.chat.completions.create`. LiteLLM exposes
chat, responses, embeddings, image, audio, rerank, and other endpoint families as
distinct operations. A router fallback can choose another deployment for the same
operation; it cannot make an embedding deployment execute a chat operation.

## Decision

Transport compatibility and ordinary agent-role eligibility are shared runtime
invariants.

1. Normalize provider prefixes and common separators in model identifiers.
2. At the transport boundary, reject identifiers that clearly advertise embedding,
   reranking, transcription, moderation-endpoint, image or video generation,
   realtime, or speech-only semantics.
3. Keep provider-documented audio and policy-classifier models transport-compatible
   when they are served through chat completions.
4. At discovery and ordinary orchestration-role boundaries, additionally exclude
   explicit guard, safety, and NemoGuard policy classifiers.
5. Apply the general-role guard while parsing OpenAI-compatible and Bytez catalogs
   and before converting, pricing, or cost-selecting a discovery record.
6. Remove stale ineligible agents from thinker, worker, verifier, and synthesizer
   ranking, generated-plan inventory and assignments, and cross-agent failover.
7. Apply only the transport guard in `ModelClient.chat()`, `stream_chat()`, and
   readiness probing so legitimate chat-served specialized models are not falsely
   rejected.
8. Fail closed when no general chat agent remains.
9. Leave unknown identifiers eligible without fabricating reasoning, tool, vision,
   or verification capabilities from their names.

This is a conservative negative filter. A future capability registry may replace
name-based exclusion with authenticated provider metadata, measured endpoint probes,
and separate endpoint-specific pools.

## Rejected response

Adding `text-embedding-3-large` to a chat fallback map is rejected. It would retain
the invalid primary assignment and merely hide it when a fallback happened to be
available. Repeated provider retries are also rejected because the request is
structurally unsupported, not transiently unavailable.

## Residual operational action

Runtime containment means an already-persisted embedding agent can no longer win
ordinary chat selection or failover while stale data is being cleaned up. Durable
state must still converge to the correct exact set: the provider-bootstrap slice
owns stale discovered-agent withdrawal and must import the shared general-role
classifier when rebased. Runtime rejection is defense in depth, not a substitute
for deleting invalid persistent configuration.

## Verification evidence

`tests/test_chat_model_capability_isolation.py` reproduces the exact Azure model ID,
provider/separator aliases, persisted-state paths, and provider I/O boundaries.
`tests/test_chat_transport_role_separation.py` proves that provider-documented
chat-served audio and policy models remain transport-compatible while policy
classifiers stay out of ordinary synthesis roles. Together they cover discovery,
conversion, pricing, selection, generated plans, failover, readiness, direct chat,
and streaming boundaries.

## References

BerriAI. (n.d.). *LiteLLM: Call 100+ LLMs using the OpenAI input/output format*.
Retrieved August 20, 2026, from https://docs.litellm.ai/

Microsoft. (n.d.). *How to switch between OpenAI and Azure OpenAI endpoints*.
Microsoft Learn. Retrieved August 20, 2026, from
https://learn.microsoft.com/en-us/azure/developer/ai/how-to/switching-endpoints

NVIDIA. (n.d.). *Deploy NemoGuard NIMs*. Retrieved August 20, 2026, from
https://docs.nvidia.com/nemo/microservices/26.3.1/guardrails/tutorials/deploy-nemoguard-nims.html

NVIDIA. (n.d.). *Reference—Llama 3.1 Nemotron Safety Guard 8B NIM*. Retrieved
August 20, 2026, from
https://docs.nvidia.com/nim/llama-3-1-nemotron-safety-guard-8b/latest/reference.html

OpenAI. (n.d.). *Data controls in the OpenAI platform: Default usage policies by
endpoint*. Retrieved August 20, 2026, from
https://platform.openai.com/docs/models/default-usage-policies-by-endpoint

OpenAI. (n.d.). *gpt-audio model*. Retrieved August 20, 2026, from
https://developers.openai.com/api/docs/models/gpt-audio

OpenAI. (n.d.). *gpt-audio-mini model*. Retrieved August 20, 2026, from
https://developers.openai.com/api/docs/models/gpt-audio-mini
''',
              encoding="utf-8",
          )

          Path(".github/workflows/verify-chat-capability-boundaries.yml").unlink()
          PY

      - name: Snapshot the intended patch before running tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > /tmp/expected.patch
          test -s /tmp/expected.patch

      - name: Run focused and full verification
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q contextual_orchestrator
          python -m pytest -q tests/test_chat_transport_role_separation.py tests/test_chat_model_capability_isolation.py
          python -m pytest -q
          git diff --check
          git diff --binary > /tmp/actual.patch
          cmp /tmp/expected.patch /tmp/actual.patch

      - name: Export the verified patch
        id: export
        shell: bash
        run: |
          set -euo pipefail
          echo "base_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "patch_b64=$(base64 -w0 /tmp/expected.patch)" >> "$GITHUB_OUTPUT"

  commit:
    name: Commit verified patch without executing repository code
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout branch without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: fix/chat-capability-isolation-embedding-models
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact base, apply tested patch, and push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.base_sha }}
          PATCH_B64: ${{ needs.prepare.outputs.patch_b64 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          printf '%s' "${PATCH_B64}" | base64 -d > /tmp/verified.patch
          git apply --index /tmp/verified.patch
          git diff --cached --check
          actual_paths="$(git diff --cached --name-only | sort)"
          expected_paths="$(cat <<'EOF'
.github/workflows/verify-chat-capability-boundaries.yml
contextual_orchestrator/chat_capability.py
contextual_orchestrator/model_discovery.py
contextual_orchestrator/orchestrator.py
docs/doctoring/embedding-chat-capability-isolation.md
tests/test_chat_model_capability_isolation.py
EOF
)"
          test "${actual_paths}" = "${expected_paths}"
          test ! -e .github/workflows/verify-chat-capability-boundaries.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: separate chat transport from ordinary agent roles"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fix/chat-capability-isolation-embedding-models
